<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<title>交易系统入口 · 导航</title>
<style>
:root {
  --bg: #F4F1EA;
  --surface: #FAF8F3;
  --raised: #EAE5DC;
  --text: #332F28;
  --dim: rgba(51,47,40,.68);
  --faint: rgba(51,47,40,.45);
  --line: rgba(51,47,40,.12);
  --up: #3A755D;
  --blue: #3C5A78;
  --card-shadow: 0 4px 20px rgba(51,47,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614;
    --surface: #1F1D1A;
    --raised: #2C2925;
    --text: #DDD7CB;
    --dim: rgba(221,215,203,.68);
    --faint: rgba(221,215,203,.45);
    --line: rgba(221,215,203,.12);
    --up: #6CA88D;
    --blue: #8CAECF;
    --card-shadow: 0 4px 24px rgba(0,0,0,.45);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}
.header {
  text-align: center;
  margin-bottom: 36px;
}
.header h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.header p {
  font-size: 13px;
  color: var(--faint);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 300px));
  gap: 18px;
  width: 100%;
  max-width: 640px;
  justify-content: center;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px 20px;
  text-decoration: none;
  color: inherit;
  box-shadow: var(--card-shadow);
  display: flex;
  flex-direction: column;
  transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.card:hover {
  transform: translateY(-3px);
  border-color: var(--dim);
}
.card:active {
  transform: translateY(0);
}
.card-icon {
  font-size: 32px;
  margin-bottom: 14px;
}
.card-title {
  font-size: 17px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.card-title .badge {
  font-size: 10.5px;
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--raised);
  color: var(--dim);
  font-weight: 500;
}
.card-desc {
  font-size: 12.5px;
  color: var(--dim);
  line-height: 1.55;
  margin-bottom: 18px;
  flex: 1;
}
.card-action {
  font-size: 13px;
  font-weight: 600;
  color: var(--blue);
  display: flex;
  align-items: center;
  gap: 4px;
}
.card-action span {
  transition: transform .15s ease;
}
.card:hover .card-action span {
  transform: translateX(4px);
}
.footer {
  margin-top: 40px;
  font-size: 11.5px;
  color: var(--faint);
  text-align: center;
}
.footer kbd {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: monospace;
}
</style>
</head>
<body>

<div class="header">
  <h1>交易工作台</h1>
  <p>Trading & Backtest Workspace</p>
</div>

<div class="grid">
  <!-- 实盘交易 -->
  <a href="./order.html" class="card" id="cardOrder">
    <div class="card-icon">🚀</div>
    <div class="card-title">
      实盘交易
      <span class="badge">Live</span>
    </div>
    <div class="card-desc">币安合约直连极简交易终端。支持图表选点挂单、止损止盈预挂、拖拽改价与高频平滑跟盘。</div>
    <div class="card-action">进入实盘 <span>→</span></div>
  </a>

  <!-- 模拟复盘 -->
  <a href="./cs.html" class="card" id="cardSim">
    <div class="card-icon">📊</div>
    <div class="card-title">
      模拟复盘
      <span class="badge">Backtest</span>
    </div>
    <div class="card-desc">ETH 5m 真实历史盲盒切片训练。支持逐 Bar 推进撮合、胜率与最大回撤深度统计。</div>
    <div class="card-action">进入复盘 <span>→</span></div>
  </a>
</div>

<div class="footer">
  快捷键：按 <kbd>1</kbd> 或 <kbd>O</kbd> 实盘 · 按 <kbd>2</kbd> 或 <kbd>C</kbd> 复盘
</div>

<script>
window.addEventListener("keydown", (e) => {
  if (e.key === "1" || e.key === "o" || e.key === "O") {
    window.location.href = "./order.html";
  } else if (e.key === "2" || e.key === "c" || e.key === "C") {
    window.location.href = "./cs.html";
  }
});
</script>

</body>
</html>
