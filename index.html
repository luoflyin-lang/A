<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
(function(){
  var host = window.location.hostname.toLowerCase();
  var v = Date.now();
  if (host.startsWith("cs.") || host.indexOf("cs") !== -1) {
    window.location.replace("./cs.html?_v=" + v);
  } else {
    window.location.replace("./order.html?_v=" + v);
  }
})();
</script>
</head>
<body style="background:#171614;color:#DDD7CB;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
<p>正在跳转...</p>
</body>
</html>
