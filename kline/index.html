<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全天单K线实时监控 (黄金 | 欧美 | 美日 | 日经 | 德指 | 标普 | 恒指 | 比特币)</title>
  <!-- TradingView 官方基础脚本
       data-cfasync="false" 是关键：阻止 Cloudflare Rocket Loader 改写/延迟该脚本 -->
  <script data-cfasync="false" type="text/javascript" src="https://s3.tradingview.com/tv.js" onerror="window.__tvLoadFailed = true;"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
    }

    /* 移动端地址栏让 100vh 溢出，用 dvh 兜底 */
    body {
      height: 100dvh;
    }

    /* 全屏页面包装容器 */
    #pages-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 单屏独立全屏图表页面 */
    .chart-page {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.15s ease-in-out;
    }

    .chart-page.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    /* 单个图表卡片，铺满整个屏幕 */
    .chart-box {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 裁剪容器：向右裁剪价格轴，向下裁剪时间轴 */
    .chart-crop {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(100% + 110px);
      height: calc(100% + 45px);
    }

    /* 遮住 TradingView 左下角 logo（图表在跨域 iframe 内，无法直接删除节点） */
    .logo-mask {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 130px;
      height: 32px;
      background-color: #ffffff;
      z-index: 998;
      pointer-events: none;
    }

    /* 左上角品种名称 */
    .symbol-overlay {
      position: absolute;
      top: 14px;
      left: 20px;
      z-index: 999;
      font-size: 18px;
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.5px;
      user-select: none;
      pointer-events: none;
    }

    /* 右上角收盘倒计时：纯净简约，无背景无阴影 */
    .countdown-overlay {
      position: absolute;
      top: 14px;
      right: 20px;
      z-index: 999;
      font-size: 20px;
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.5px;
      user-select: none;
      pointer-events: none;
      background: transparent;
      box-shadow: none;
      padding: 0;
    }

    /* 网络断开时右上角倒计时变红警示 */
    .countdown-overlay.is-offline {
      color: #ff3b30 !important;
      font-weight: 700 !important;
      background: rgba(255, 59, 48, 0.1) !important;
      padding: 2px 8px !important;
      border-radius: 4px !important;
    }

    /* 页面右侧 10% 无缝翻页全高触发热区 (无形隐形，点击整条右侧切换到下一品种) */
    #page-flip-trigger-next {
      position: fixed;
      top: 0;
      right: 0;
      width: 10vw;
      min-width: 60px;
      height: 100%;
      height: 100dvh;
      z-index: 5000;
      cursor: pointer;
      background: transparent;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* 页面左侧 10% 无缝翻页全高触发热区 (无形隐形，点击整条左侧返回上一品种) */
    #page-flip-trigger-prev {
      position: fixed;
      top: 0;
      left: 0;
      width: 10vw;
      min-width: 60px;
      height: 100%;
      height: 100dvh;
      z-index: 5000;
      cursor: pointer;
      background: transparent;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* 网络断开全屏蒙层与告警卡片 */
    #network-alert {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .network-alert-card {
      background: #ffffff;
      border: 2px solid #ff3b30;
      border-radius: 14px;
      box-shadow: 0 16px 48px rgba(255, 59, 48, 0.22);
      padding: 32px 36px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      animation: alertPulse 2s infinite ease-in-out;
    }

    @keyframes alertPulse {
      0%, 100% { border-color: #ff3b30; box-shadow: 0 16px 48px rgba(255, 59, 48, 0.22); }
      50% { border-color: #ff7875; box-shadow: 0 16px 48px rgba(255, 59, 48, 0.38); }
    }

    .network-alert-icon {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 14px;
    }

    .network-alert-title {
      font-size: 21px;
      font-weight: 700;
      color: #ff3b30;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .network-alert-desc {
      font-size: 14px;
      color: #444444;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .network-alert-status {
      font-size: 13px;
      color: #666666;
      background: #f5f5f7;
      border: 1px solid #e5e5ea;
      padding: 8px 14px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 22px;
    }

    .network-alert-btn {
      background: #ff3b30;
      color: #ffffff;
      border: none;
      padding: 11px 26px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .network-alert-btn:hover {
      background: #d62d23;
    }

    .network-alert-btn:active {
      transform: scale(0.97);
    }

    /* 脚本加载失败时的可见错误提示 */
    #fatal-error {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      color: #000000;
      text-align: center;
      padding: 0 24px;
      font-size: 14px;
      line-height: 1.6;
    }

    #fatal-error strong {
      font-size: 17px;
    }

    #fatal-error span {
      font-size: 12px;
      color: #666666;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <!-- 网络断开高警示蒙层 -->
  <div id="network-alert">
    <div class="network-alert-card">
      <div class="network-alert-icon">⚠️</div>
      <div class="network-alert-title" id="network-alert-title">网络连接已断开！</div>
      <div class="network-alert-desc">行情数据与倒计时已立即暂停。请检查您的 Wi-Fi 或网络连接，切勿依据当前静止画面做交易决策！</div>
      <div class="network-alert-status" id="network-alert-status">正在持续监测网络，恢复后将自动刷新图表...</div>
      <div>
        <button class="network-alert-btn" id="network-retry-btn" onclick="manualCheckNetwork()">立即检测并刷新</button>
      </div>
    </div>
  </div>

  <!-- 页面左侧 10% 隐形翻页触发区 (点击返回上一品种) -->
  <div id="page-flip-trigger-prev" onclick="prevChart()" title="点击切换至上一品种"></div>

  <!-- 页面右侧 10% 隐形翻页触发区 (点击切换至下一品种) -->
  <div id="page-flip-trigger-next" onclick="nextChart()" title="点击切换至下一品种"></div>

  <!-- 全屏单K线页面容器 (8 个品种独立层级，0毫秒无感秒切) -->
  <div id="pages-wrapper">
    <!-- 品种 0: 现货黄金 -->
    <div id="page-0" class="chart-page active">
      <div class="chart-box">
        <div class="symbol-overlay" id="symbol-0">XAUUSD</div>
        <div id="chart-0" class="chart-crop"></div>
        <div class="logo-mask"></div>
        <div class="countdown-overlay">--:--</div>
      </div>
    </div>

    <!-- 品种 1: 欧元美元 -->
    <div id="page-1" class="chart-page">
      <div class="chart-box">
        <div class="symbol-overlay" id="symbol-1">EURUSD</div>
        <div id="chart-1" class="chart-crop"></div>
        <div class="logo-mask"></div>
        <div class="countdown-overlay">--:--</div>
      </div>
    </div>

    <!-- 品种 2: 美元日元 -->
    <div id="page-2" class="chart-page">
      <div class="chart-box">
        <div class="symbol-overlay" id="symbol-2">USDJPY</div>
        <div id="chart-2" class="chart-crop"></div>
        <div class="logo-mask"></div>
        <div class="countdown-overlay">--:--</div>
      </div>
    </div>

    <!-- 品种 3: 日经 225 -->
    <div id="page-3" class="chart-page">
      <div class="chart-box">
        <div class="symbol-overlay" id="symbol-3">JP225</div>
        <div id="chart-3" class="chart-crop"></div>
        <div class="logo-mask"></div>
        <div class="countdown-overlay">--:--</div>
      </div>
    </div>

    <!-- 品种 4: 德国指数 40 -->
    <div id="page-4" class="chart-page">
      <div class="chart-box">
        <div class="symbol-overlay" id="symbol-4">DAX</div>
        <div id="chart-4" class="chart-crop"></div>
        <div class="logo-mask"></div>
        <div class="countdown-overlay">--:--</div>
      </div>
    </div>

    <!-- 品种 5: 标普 500 -->
    <div id="page-5" class="chart-page">
      <div class="chart-box">
        <div class="symbol-overlay" id="symbol-5">SPX500</div>
        <div id="chart-5" class="chart-crop"></div>
        <div class="logo-mask"></div>
        <div class="countdown-overlay">--:--</div>
      </div>
    </div>

    <!-- 品种 6: 恒生指数 50 -->
    <div id="page-6" class="chart-page">
      <div class="chart-box">
        <div class="symbol-overlay" id="symbol-6">HK50</div>
        <div id="chart-6" class="chart-crop"></div>
        <div class="logo-mask"></div>
        <div class="countdown-overlay">--:--</div>
      </div>
    </div>

    <!-- 品种 7: 比特币 -->
    <div id="page-7" class="chart-page">
      <div class="chart-box">
        <div class="symbol-overlay" id="symbol-7">BTC</div>
        <div id="chart-7" class="chart-crop"></div>
        <div class="logo-mask"></div>
        <div class="countdown-overlay">--:--</div>
      </div>
    </div>
  </div>

  <!-- 致命错误提示（tv.js 未能加载时显示） -->
  <div id="fatal-error">
    <strong>图表脚本加载失败</strong>
    <div>无法加载 https://s3.tradingview.com/tv.js</div>
    <span>请检查网络 / 广告拦截插件，或确认 Cloudflare 未开启 Rocket Loader、未对该域设置阻断第三方脚本的 CSP。</span>
  </div>

  <script data-cfasync="false">
    /**
     * 8 大精选核心品种定义：
     * 0: 现货黄金 (XAUUSD)
     * 1: 欧元美元 (EURUSD)
     * 2: 美元日元 (USDJPY)
     * 3: 日经 225 (JP225)
     * 4: 德国指数 40 (DAX / GER40)
     * 5: 标普 500 (SPX500)
     * 6: 恒生指数 50 (HK50)
     * 7: 比特币 (BTC / BTCUSDT)
     */
    var CHARTS_CONFIG = [
      { id: "chart-0", symbol: "OANDA:XAUUSD", title: "XAUUSD" },
      { id: "chart-1", symbol: "FX:EURUSD", title: "EURUSD" },
      { id: "chart-2", symbol: "FX:USDJPY", title: "USDJPY" },
      { id: "chart-3", symbol: "OANDA:JP225USD", title: "JP225" },
      { id: "chart-4", symbol: "FOREXCOM:GER40", title: "DAX" },
      { id: "chart-5", symbol: "OANDA:SPX500USD", title: "SPX500" },
      { id: "chart-6", symbol: "FOREXCOM:HK50", title: "HK50" },
      { id: "chart-7", symbol: "BINANCE:BTCUSDT", title: "BTC" }
    ];

    var currentIndex = 0;
    var isToggling = false;
    var loadedCharts = {};

    /**
     * 无缝翻页核心方法：
     * 0 毫秒即时切换，无刷新无白屏
     */
    function showChart(index) {
      if (index < 0) index = CHARTS_CONFIG.length - 1;
      if (index >= CHARTS_CONFIG.length) index = 0;
      currentIndex = index;

      ensureChartLoaded(currentIndex);

      for (var i = 0; i < CHARTS_CONFIG.length; i++) {
        var pageEl = document.getElementById("page-" + i);
        if (pageEl) {
          if (i === currentIndex) {
            pageEl.classList.add("active");
          } else {
            pageEl.classList.remove("active");
          }
        }
      }
    }

    function nextChart() {
      if (isToggling) return;
      isToggling = true;
      showChart(currentIndex + 1);
      setTimeout(function() {
        isToggling = false;
      }, 150);
    }

    function prevChart() {
      if (isToggling) return;
      isToggling = true;
      showChart(currentIndex - 1);
      setTimeout(function() {
        isToggling = false;
      }, 150);
    }

    // 兼容历史调用名
    function togglePage() {
      nextChart();
    }

    var TV_MAX_RETRY = 40;
    var chartState = {};

    function showFatalError() {
      var el = document.getElementById("fatal-error");
      if (el) el.style.display = "flex";
    }

    /**
     * 创建 TradingView 图表组件 (15 分钟标准周期)
     */
    function createTradingViewWidget(containerId, symbol) {
      var container = document.getElementById(containerId);
      if (!container) return;

      var state = chartState[containerId];
      if (!state) {
        state = chartState[containerId] = { retry: 0 };
      }

      if (window.__tvLoadFailed) {
        showFatalError();
        return;
      }

      if (typeof TradingView === "undefined" || !TradingView.widget) {
        state.retry++;
        if (state.retry > TV_MAX_RETRY) {
          showFatalError();
          return;
        }
        setTimeout(function () {
          createTradingViewWidget(containerId, symbol);
        }, 500);
        return;
      }

      container.innerHTML = ""; // 清空容器

      new TradingView.widget({
        autosize: true,
        symbol: symbol,
        interval: "15",
        timezone: "Asia/Shanghai",
        theme: "light",
        style: "1", // 1 为普通K线
        locale: "zh_CN",
        backgroundColor: "#ffffff",
        gridColor: "rgba(255, 255, 255, 0)", // 去掉背景网格
        toolbar_bg: "#ffffff",
        enable_publishing: false,
        allow_symbol_change: false,
        hide_top_toolbar: true,
        hide_legend: true,
        hide_side_toolbar: true,
        save_image: false,
        hide_volume: true, // 彻底隐藏成交量
        loading_screen: {
          backgroundColor: "#ffffff",
          foregroundColor: "#ffffff"
        },
        disabled_features: [
          "volume_force_overlay",
          "create_volume_indicator_by_default",
          "header_widget",
          "timeframes_toolbar",
          "left_toolbar",
          "control_bar",
          "legend_widget",
          "scales_context_menu",
          "use_localstorage_for_settings",
          "save_chart_properties_to_local_storage",
          "display_market_status"
        ],
        container_id: containerId,
        studies: [
          {
            id: "MAExp@tv-basicstudies",
            inputs: {
              length: 20
            }
          }
        ],
        studies_overrides: {
          "moving average exponential.plot.color": "#000000",
          "moving average exponential.plot.linewidth": 2,
          // 兜底隐藏成交量柱线
          "volume.volume.color.0": "rgba(255, 255, 255, 0)",
          "volume.volume.color.1": "rgba(255, 255, 255, 0)",
          "volume.volume.transparency": 100,
          "volume.show ma": false
        },
        overrides: {
          // 纯白背景
          "paneProperties.background": "#ffffff",
          "paneProperties.backgroundType": "solid",
          // 彻底隐藏鼠标十字光标虚线
          "paneProperties.crossHairProperties.color": "rgba(255, 255, 255, 0)",
          "paneProperties.crossHairProperties.width": 0,

          // 去掉背景网格线与品种水印
          "paneProperties.vertGridProperties.color": "rgba(255, 255, 255, 0)",
          "paneProperties.horzGridProperties.color": "rgba(255, 255, 255, 0)",
          "paneProperties.separatorColor": "rgba(255, 255, 255, 0)",
          "symbolWatermarkProperties.color": "rgba(255, 255, 255, 0)",
          "symbolWatermarkProperties.transparency": 100,

          // 彻底隐藏实时现价虚线 (Price Line) 及相关基准线
          "mainSeriesProperties.showPriceLine": false,
          "mainSeriesProperties.priceLineColor": "rgba(255, 255, 255, 0)",
          "mainSeriesProperties.priceLineWidth": 0,
          "mainSeriesProperties.baseLineColor": "rgba(255, 255, 255, 0)",

          // 彻底隐藏买卖盘虚线 (Bid/Ask Line)
          "mainSeriesProperties.bidAsk.visible": false,
          "mainSeriesProperties.bidAsk.bidLineColor": "rgba(255, 255, 255, 0)",
          "mainSeriesProperties.bidAsk.askLineColor": "rgba(255, 255, 255, 0)",

          // 彻底隐藏昨收价虚线 (Prev Close Line)
          "mainSeriesProperties.showPrevClosePriceLine": false,
          "mainSeriesProperties.prevClosePriceLineColor": "rgba(255, 255, 255, 0)",

          // 隐藏最新价倒计时标签与高低均价线
          "mainSeriesProperties.showCountdown": false,
          "mainSeriesProperties.highLowAvgPrice.highLowPriceLinesVisible": false,
          "mainSeriesProperties.highLowAvgPrice.highLowPriceLabelsVisible": false,
          "mainSeriesProperties.highLowAvgPrice.averageClosePriceLineVisible": false,

          // 黑白蜡烛：上涨为空心/白色配黑边，下跌为纯黑
          "mainSeriesProperties.candleStyle.upColor": "#ffffff",
          "mainSeriesProperties.candleStyle.downColor": "#000000",
          "mainSeriesProperties.candleStyle.drawWick": true,
          "mainSeriesProperties.candleStyle.drawBorder": true,
          "mainSeriesProperties.candleStyle.borderColor": "#000000",
          "mainSeriesProperties.candleStyle.borderUpColor": "#000000",
          "mainSeriesProperties.candleStyle.borderDownColor": "#000000",
          "mainSeriesProperties.candleStyle.wickUpColor": "#000000",
          "mainSeriesProperties.candleStyle.wickDownColor": "#000000",

          // 坐标轴文字与刻度隐藏（透明）
          "scalesProperties.textColor": "rgba(255, 255, 255, 0)",
          "scalesProperties.lineColor": "rgba(255, 255, 255, 0)",
          "scalesProperties.showBidAskPrice": false,
          "scalesProperties.showSymbolLabels": false,
          "scalesProperties.showSeriesLastValue": false
        }
      });
    }

    function ensureChartLoaded(index) {
      if (!loadedCharts[index]) {
        loadedCharts[index] = true;
        createTradingViewWidget(CHARTS_CONFIG[index].id, CHARTS_CONFIG[index].symbol);
      }
    }

    /**
     * 智能梯队加载：优先秒开当前品种，后台异步队列预热剩余品种
     */
    function initCharts() {
      // 1. 立即加载当前首屏 (XAUUSD)
      ensureChartLoaded(0);

      // 2. 平滑后台异步预热加载其他品种，杜绝并发冲击
      var preloadIdx = 1;
      var preloadTimer = setInterval(function () {
        if (preloadIdx >= CHARTS_CONFIG.length) {
          clearInterval(preloadTimer);
          return;
        }
        ensureChartLoaded(preloadIdx);
        preloadIdx++;
      }, 450);
    }

    /**
     * 全天候网络连通性监测引擎
     */
    var isNetworkOnline = true;
    var consecutiveFailures = 0;
    var isReconnecting = false;

    function setNetworkState(online) {
      if (online) {
        consecutiveFailures = 0;
        if (!isNetworkOnline) {
          isNetworkOnline = true;
          isReconnecting = true;
          var titleEl = document.getElementById("network-alert-title");
          var statusEl = document.getElementById("network-alert-status");
          if (titleEl) {
            titleEl.textContent = "✅ 网络已恢复！";
            titleEl.style.color = "#34c759";
          }
          if (statusEl) {
            statusEl.textContent = "正在拉取最新行情数据，即将自动刷新图表...";
            statusEl.style.color = "#34c759";
          }
          setTimeout(function() {
            window.location.reload();
          }, 400);
          return;
        }

        var alertEl = document.getElementById("network-alert");
        if (alertEl) alertEl.style.display = "none";

        var countdowns = document.querySelectorAll(".countdown-overlay");
        for (var i = 0; i < countdowns.length; i++) {
          countdowns[i].classList.remove("is-offline");
        }
      } else {
        if (!isNetworkOnline) return;
        isNetworkOnline = false;

        var alertEl = document.getElementById("network-alert");
        if (alertEl) alertEl.style.display = "flex";

        var titleEl = document.getElementById("network-alert-title");
        var statusEl = document.getElementById("network-alert-status");
        if (titleEl) {
          titleEl.textContent = "⚠️ 网络连接已断开！";
          titleEl.style.color = "#ff3b30";
        }
        if (statusEl) {
          statusEl.textContent = "正在持续监测网络，恢复后将自动刷新图表...";
          statusEl.style.color = "#666666";
        }

        var countdowns = document.querySelectorAll(".countdown-overlay");
        var warningText = "⚠️ 网络断开";
        for (var i = 0; i < countdowns.length; i++) {
          countdowns[i].textContent = warningText;
          countdowns[i].classList.add("is-offline");
        }
      }
    }

    function probeUrl(url, timeoutMs) {
      return new Promise(function(resolve) {
        if (typeof navigator.onLine === "boolean" && !navigator.onLine) {
          resolve(false);
          return;
        }
        var controller = new AbortController();
        var timer = setTimeout(function() {
          try { controller.abort(); } catch(e) {}
          resolve(false);
        }, timeoutMs || 2200);

        fetch(url, {
          mode: "no-cors",
          cache: "no-store",
          signal: controller.signal
        }).then(function() {
          clearTimeout(timer);
          resolve(true);
        }).catch(function() {
          clearTimeout(timer);
          resolve(false);
        });
      });
    }

    async function checkConnectivity() {
      if (typeof navigator.onLine === "boolean" && !navigator.onLine) {
        return false;
      }
      var target = (window.location && window.location.protocol && window.location.protocol.startsWith("http"))
        ? window.location.origin + "/ping?_=" + Date.now()
        : "https://aa.124568.xyz/ping?_=" + Date.now();

      return await probeUrl(target, 2500);
    }

    async function runNetworkCheck() {
      if (isReconnecting) return;
      var ok = await checkConnectivity();
      if (ok) {
        setNetworkState(true);
      } else {
        consecutiveFailures++;
        if (consecutiveFailures >= 2 || (typeof navigator.onLine === "boolean" && !navigator.onLine)) {
          setNetworkState(false);
        }
      }
    }

    async function manualCheckNetwork() {
      var btn = document.getElementById("network-retry-btn");
      var statusEl = document.getElementById("network-alert-status");
      if (btn) btn.textContent = "检测中...";
      if (statusEl) statusEl.textContent = "正在发送心跳探测包...";
      var ok = await checkConnectivity();
      if (ok) {
        setNetworkState(true);
      } else {
        if (btn) btn.textContent = "立即检测并刷新";
        if (statusEl) statusEl.textContent = "探测失败：仍未检测到可用外网，请检查网络设置。";
      }
    }

    /**
     * 15分钟 K 线收盘倒计时逻辑 (所有品种全量同步)
     */
    function updateCountdown() {
      var countdowns = document.querySelectorAll(".countdown-overlay");
      if (!isNetworkOnline) {
        var warningText = "⚠️ 网络断开";
        for (var i = 0; i < countdowns.length; i++) {
          countdowns[i].textContent = warningText;
          countdowns[i].classList.add("is-offline");
        }
        return;
      }

      var now = new Date();
      var elapsedInCandle = (now.getUTCMinutes() * 60 + now.getUTCSeconds()) % 900;
      var remainingSeconds = 900 - elapsedInCandle;

      var mins = Math.floor(remainingSeconds / 60);
      var secs = remainingSeconds % 60;
      var formatted = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");

      for (var j = 0; j < countdowns.length; j++) {
        countdowns[j].textContent = formatted;
        countdowns[j].classList.remove("is-offline");
      }
    }

    // 初始化运行
    function init() {
      initCharts();
      updateCountdown();
      setInterval(updateCountdown, 1000);   // 每秒刷新倒计时

      // 原生网络状态监听
      window.addEventListener("offline", function() {
        setNetworkState(false);
      });
      window.addEventListener("online", function() {
        runNetworkCheck();
      });

      // 定时主动心跳探测：每 5 秒检测一次
      setInterval(runNetworkCheck, 5000);

      // 设备从休眠唤醒或标签页切换时立即校正与检测
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          updateCountdown();
          runNetworkCheck();
        }
      });

      // 页面初次加载时立即做一次网络连通性初检
      runNetworkCheck();

      // 键盘快捷键翻页：空格、Enter、方向键、数字键 1~8 直达
      window.addEventListener("keydown", function (e) {
        if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight" || e.key === "ArrowDown") {
          nextChart();
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          prevChart();
        } else if (e.key >= "1" && e.key <= "8") {
          var targetIdx = parseInt(e.key, 10) - 1;
          showChart(targetIdx);
        }
      });

      // 移动端/触屏左右滑动翻页支持
      var touchStartX = 0;
      var touchStartY = 0;
      window.addEventListener("touchstart", function (e) {
        if (e.touches && e.touches.length > 0) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      window.addEventListener("touchend", function (e) {
        if (e.changedTouches && e.changedTouches.length > 0) {
          var deltaX = e.changedTouches[0].clientX - touchStartX;
          var deltaY = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
            if (deltaX < 0) {
              nextChart();
            } else {
              prevChart();
            }
          }
        }
      }, { passive: true });
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
