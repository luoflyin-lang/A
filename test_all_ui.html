<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交易系统全按钮与全功能自动化测试 (低成本 0 资金消耗)</title>
<style>
  :root {
    --bg: #F4F1EA; --surface: #FAF8F3; --text: #332F28; --dim: rgba(51,47,40,.68);
    --up: #3A755D; --down: #A85244; --blue: #3C5A78; --line: rgba(51,47,40,.12);
  }
  body {
    margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 20px; margin-top: 0; display: flex; align-items: center; justify-content: space-between; }
  .badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: var(--up); color: #fff; }
  .badge.dry { background: #8B6A2B; }
  .controls { margin-bottom: 16px; display: flex; gap: 10px; }
  button.action-btn {
    padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 6px;
    background: var(--blue); color: #fff; border: none; cursor: pointer;
  }
  button.action-btn:hover { opacity: 0.9; }
  .grid { display: grid; grid-template-columns: 460px 1fr; gap: 20px; height: calc(100vh - 120px); }
  .log-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .log-header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--line); font-size: 14px; background: rgba(0,0,0,0.02); }
  .log-body { flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 12.5px; font-family: monospace; }
  .test-row { padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: flex-start; justify-content: space-between; }
  .test-title { font-weight: 500; }
  .test-detail { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .status-pass { color: var(--up); font-weight: bold; }
  .status-fail { color: var(--down); font-weight: bold; }
  .status-run { color: var(--blue); font-weight: bold; }
  .preview-card {
    background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<h1>
  <span>⚡ 交易系统全按钮与全功能自动化测试</span>
  <span class="badge dry">100% 零成本 · 演练模式 DRY_RUN</span>
</h1>

<div class="controls">
  <button class="action-btn" id="runAllBtn" onclick="runAllTests()">开始全量自动化测试</button>
  <span id="summaryText" style="align-self:center; font-size:13px; font-weight:500;">等待运行…</span>
</div>

<div class="grid">
  <div class="log-card">
    <div class="log-header">测试执行进度与结果</div>
    <div class="log-body" id="logBox"></div>
  </div>
  <div class="preview-card">
    <div class="log-header">被测应用实时交互视窗 (order.html)</div>
    <iframe id="appFrame" src="./order.html"></iframe>
  </div>
</div>

<script>
  let w = null;
  const logs = [];
  const logBox = document.getElementById("logBox");
  const summaryText = document.getElementById("summaryText");

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  function addLog(id, name, status, detail) {
    let el = document.getElementById("test-" + id);
    if (!el) {
      el = document.createElement("div");
      el.id = "test-" + id;
      el.className = "test-row";
      logBox.appendChild(el);
    }
    const stClass = status === "PASS" ? "status-pass" : (status === "FAIL" ? "status-fail" : "status-run");
    const stIcon = status === "PASS" ? "✔" : (status === "FAIL" ? "✘" : "⏳");
    el.innerHTML = `
      <div>
        <div class="test-title">${name}</div>
        ${detail ? `<div class="test-detail">${detail}</div>` : ""}
      </div>
      <span class="${stClass}">${stIcon} ${status}</span>
    `;
    logBox.scrollTop = logBox.scrollHeight;
  }

  function assert(cond, msg) {
    if (!cond) throw new Error(msg || "Assertion failed");
  }

  async function initApp() {
    const iframe = document.getElementById("appFrame");
    w = iframe.contentWindow;
    for (let i = 0; i < 60; i++) {
      if (w && w.BN && w.BN.S && w.BN.TRADE && w.BN.$) break;
      await sleep(100);
      w = iframe.contentWindow;
    }
    assert(w && w.BN && w.BN.S, "iframe 内嵌 order.html 初始化超时");
    
    // 映射顶层代理
    w.S = w.BN.S;
    w.F = w.BN.F;
    w.$ = w.BN.$;
    w.TradeCore = w.BN.TRADE.core;
    w.send = w.BN.TRADE.send;
    w.placeOrder = w.BN.TRADE.placeOrder;
    w.cancelOrder = w.BN.TRADE.cancelOrder;
    w.closePos = w.BN.TRADE.closePos;
    w.cancelAllOrders = w.BN.TRADE.cancelAllOrders;
    w.closeAllPositions = w.BN.TRADE.closeAllPositions;
    w.sweepOrphans = w.BN.TRADE.sweepOrphans;
    w.checkRiskGates = w.BN.TRADE.checkRiskGates;
    w.slWatchdog = w.BN.TRADE.slWatchdog;
    w.step = w.BN.TRADE.step;
    w.pick = w.BN.TRADE.pick;
    w.open = w.BN.TRADE.open;
    w.close = w.BN.TRADE.close;
    w.posView = w.BN.TRADE.posView;
    w.render = w.BN.TRADE.render;
    w.endFlow = w.BN.TRADE.endFlow;
    w.startFlow = w.BN.TRADE.startFlow;
    w.setTestnet = w.BN.TRADE.setTestnet;
    w.CHART_VIEW_STATE = w.CHART_VIEW_STATE || (w.BN && w.BN.chartView && w.BN.chartView());
    w.tvChart = w.tvChart || (w.BN && w.BN.tvChart && w.BN.tvChart());
    w.pool = w.BN.TRADE.pool;
    
    // 强制开启 DRY_RUN 演练模式，保证绝对不消耗一分钱真实资金！
    w.DRY_RUN = true;
    w.BN.TRADE.dryRun(true);

    // 模拟账户已配置 Key 与初始模拟净值
    w.API_KEY = "mock_test_key_001";
    w.API_SECRET = "mock_test_secret_001";
    w.HASKEY = true;
    w.ACCT_LOADING = false;
    w.S.acct = { equity: 10000, avail: 10000, used: 0, wallet: 10000, upnl: 0 };
    if (!w.S.pos) w.S.pos = {};
    if (!w.S.ords) w.S.ords = {};
    if (w.posView) w.posView();
    if (w.render) w.render();
  }

  async function runAllTests() {
    const btn = document.getElementById("runAllBtn");
    btn.disabled = true;
    logBox.innerHTML = "";
    summaryText.textContent = "测试执行中，请观察视窗变化…";

    await initApp();

    let passed = 0, failed = 0;
    const testCases = [
      // 1. 顶部导航栏按钮测试
      {
        id: "nav_symbol",
        name: "1. 顶部币种栏 (#name) 与币种名称 (#nS) 打开抽屉",
        test: async () => {
          const nameBtn = w.$("#name") || w.$("#nS");
          assert(nameBtn, "未找到币种名称元素");
          nameBtn.click();
          await sleep(200);
          assert(w.$("#shList").classList.contains("on"), "#shList 未能正常弹出");
          // 点击遮罩关闭
          w.$("#mask").click();
          await sleep(150);
          assert(!w.$("#shList").classList.contains("on"), "遮罩点击未关闭 #shList");

          // 测试直接点击 #nS 打开抽屉
          w.$("#nS").click();
          await sleep(200);
          assert(w.$("#shList").classList.contains("on"), "#nS 点击未能打开抽屉");
          w.$("#mask").click();
          await sleep(150);
          assert(!w.$("#shList").classList.contains("on"), "遮罩点击未关闭 #shList");
        }
      },
      {
        id: "nav_tf",
        name: "2. 左上角极简化（仅保留品种名称 #nS，彻底删除三条杠 #nListBtn 等冗余按钮）",
        test: async () => {
          assert(w.$("#nS"), "左上角必须保留品种名称 #nS");
          assert(!w.$("#nListBtn"), "左上角三条杠 #nListBtn 应已彻底删除");
          assert(!w.$("#nTf"), "左上角冗余周期徽章 #nTf 应彻底删除");
          assert(!w.$("#bStar"), "左上角星号按钮 #bStar 应彻底删除");
          assert(!w.$("#bAudio"), "左上角铃铛按钮 #bAudio 应彻底删除");
          assert(!w.$("#nNatr"), "左上角 NATR 徽章 #nNatr 应彻底删除");
          // 验证点击品种名称可以直接唤出抽屉
          w.$("#nS").click();
          await sleep(200);
          assert(w.$("#shList").classList.contains("on"), "#nS 点击未能打开抽屉");
          w.$("#mask").click();
          await sleep(150);
        }
      },
      {
        id: "nav_filter",
        name: "3. 机会清单过滤开关 (#fBtn) 切换",
        test: async () => {
          w.open("shList");
          await sleep(150);
          const fBtn = w.$("#fBtn");
          const initFilter = w.S.filter;
          fBtn.click();
          await sleep(150);
          assert(w.S.filter !== initFilter, "过滤状态未能正常切换");
          // 复原
          fBtn.click();
          await sleep(100);
          w.close();
        }
      },
      {
        id: "nav_list_tf",
        name: "4. 清单内周期已精简，固定为 15m 单一周期",
        test: async () => {
          w.open("shList");
          await sleep(150);
          const tfSeg = w.$("#listTfSeg");
          assert(!tfSeg, "#listTfSeg 1h分段切换应已彻底移除");
          assert(w.S.tf === "15m", "系统周期应保持 15m");
          w.close();
        }
      },

      // 2. 密钥设置与免口令直接保存 (#khud)
      {
        id: "key_modal",
        name: "5. API Key 弹窗 (#av) 免口令直接保存与关闭校验",
        test: async () => {
          localStorage.removeItem(w.KKEY);
          w.openKey();
          await sleep(200);
          assert(w.$("#khud").classList.contains("on"), "密钥弹窗未能正常弹出");
          assert(!w.$("#kP"), "#kP 口令输入框未彻底移除");
          w.$("#kK").value = "test_key_ok";
          w.$("#kS").value = "test_secret_ok";
          w.$("#kSave").click();
          await sleep(200);
          assert(w.HASKEY === true, "Key 保存后 HASKEY 应为 true");
          const stored = localStorage.getItem(w.KKEY);
          assert(stored && stored.includes("test_key_ok"), "Key 未能成功保存至 localStorage");
          assert(!stored.includes('mode":"aes'), "不应再包含口令加密 aes 结构");
          // 确保主界面干净极简，不放置显眼冗余的 #bKeyNav 按钮
          assert(!w.$("#bKeyNav"), "主图表界面不应放置多余的 #bKeyNav 按钮");
          // 打开并关闭弹窗
          w.openKey();
          await sleep(150);
          assert(w.$("#khud").classList.contains("on"), "openKey 未能唤起密钥弹窗");
          w.$("#kX").click();
          await sleep(150);
          assert(!w.$("#khud").classList.contains("on"), "#kX 关闭按钮失效");
          w.S.acct = { equity: 10000, avail: 10000, used: 0, wallet: 10000, upnl: 0 };
        }
      },

      // 3. TV 整合面板 (#shTv) 与 Tab 切换
      {
        id: "tv_sheet",
        name: "6. TV 整合面板 (#bTv) 及 Tab 切换",
        test: async () => {
          w.$("#bTv").click();
          await sleep(200);
          assert(w.$("#shTv").classList.contains("on"), "#shTv 未能正常弹出");
          // 切换到关注 Tab
          w.$("#tabWatBtn").click();
          await sleep(150);
          assert(w.$("#tabWatContent").classList.contains("on"), "关注 Tab 未能激活");
          // 切换回持仓 Tab
          w.$("#tabPosBtn").click();
          await sleep(150);
          assert(w.$("#tabPosContent").classList.contains("on"), "持仓 Tab 未能激活");
          w.close();
        }
      },

      // 4. 持仓平仓双通道按钮测试：「挂单平」与「市价平」
      {
        id: "pos_close_dual",
        name: "7. 持仓操作：「挂单平」(GTX) 与「市价平」(MARKET)",
        test: async () => {
          // 模拟持有一张多头仓位
          w.S.pos["BTCUSDC"] = { sym: "BTCUSDC", side: "BOTH", amt: 0.5, entry: 80000, liq: 76000, upnl: 100, lev: 20 };
          w.S.mid["BTCUSDC"] = 80200;
          w.posView();
          await sleep(100);

          const clsBtn = w.$('button.cls[data-x="BTCUSDC"]');
          assert(clsBtn, "未找到「挂单平」按钮");
          const clsMktBtn = w.$('button.cls-mkt[data-x="BTCUSDC"]');
          assert(clsMktBtn, "未找到「市价平」按钮");

          // 监听 send 调用
          let sentOrder = null;
          const origSend = w.send;
          w.send = async (method, path, params, label, silent, opt) => {
            sentOrder = { method, path, params, label, opt };
            return { orderId: 99901, clientOrderId: "test" };
          };

          // 触发挂单平 (GTX Limit)
          await w.closePos("BTCUSDC", false);
          assert(sentOrder && sentOrder.params.type === "LIMIT" && sentOrder.params.timeInForce === "GTX", "挂单平仓未发出 LIMIT GTX 订单");

          // 触发市价强平 (Market)
          await w.closePos("BTCUSDC", true);
          assert(sentOrder && sentOrder.params.type === "MARKET" && sentOrder.params.reduceOnly === "true" && +sentOrder.params.quantity > 0, "市价强平未正确发出带 quantity 与 reduceOnly 的 MARKET 订单");

          w.send = origSend;
          delete w.S.pos["BTCUSDC"];
          w.posView();
        }
      },

      // 5. 撤单与重复单清理测试
      {
        id: "cancel_order_algo",
        name: "8. 撤单函数 cancelOrder 传参及 options 隔离",
        test: async () => {
          let reqPayload = null;
          const origSend = w.send;
          w.send = async (method, path, params, label, silent, opt) => {
            reqPayload = { method, path, params, opt };
            return { code: 200, msg: "success" };
          };

          // 模拟老调用传 { escapeLock: true }
          await w.cancelOrder("BTCUSDC", "12345678", false, { escapeLock: true });
          assert(reqPayload.params.orderId === "12345678", `orderId 解析错误: ${reqPayload.params.orderId}`);
          assert(reqPayload.opt.escapeLock === true, "escapeLock 未能正确透传");
          assert(typeof reqPayload.params.algoId === "undefined", "algoId 错误混入参数");

          // 模拟 algo 条件单撤单
          await w.cancelOrder("BTCUSDC", "88889999", true, { escapeLock: true });
          assert(reqPayload.path.includes("algoOrder"), "algo 单撤单路径错误");
          assert(reqPayload.params.algoId === "88889999", `algoId 解析错误: ${reqPayload.params.algoId}`);

          w.send = origSend;
        }
      },

      // 6. 下单流程与只挂单入场校验
      {
        id: "order_flow",
        name: "9. 下单流程：确认 LIMIT GTX 入场与 STOP_MARKET 止损",
        test: async () => {
          w.DRY_RUN = true;
          w.LOCK = "";
          w.ACCT_LOADING = false;
          w.S.acct = { equity: 10000, avail: 10000, used: 0, wallet: 10000, upnl: 0 };
          w.S.sym = "BTCUSDC";
          w.S.mid["BTCUSDC"] = 80000;
          w.F.risk = 1;
          w.F.e = 79500;
          w.F.sl = 79000;
          w.F.tp = 81000;
          w.F.on = true;
          w.render();
          await sleep(150);

          // 风险切换按钮测试 (#ohR)
          const ohR = w.$("#ohR");
          assert(ohR, "未找到风险切换按钮 #ohR");
          ohR.click();
          await sleep(100);
          assert(w.F.risk === 0.25, "点击 #ohR 未切换至 0.25% 风险");
          ohR.click();
          await sleep(100);
          assert(w.F.risk === 1, "点击 #ohR 未切回 1% 风险");

          // 跳过止盈测试 (#ohSkip)
          w.F.step = 3;
          w.$("#ohSkip").click();
          await sleep(100);
          assert(w.F.tp === null, "点击跳过止盈未能清空止盈");
          w.F.tp = 81000;

          // 拦截 placeOrder 检查订单类型
          const placedOrders = [];
          const origPlace = w.placeOrder;
          w.placeOrder = async (ord, label, silent, opt) => {
            placedOrders.push(ord);
            return { orderId: 77701, algoId: 77701 };
          };

          // 点击确认下单按钮 (#ohGo)
          const goBtn = w.$("#ohGo");
          assert(goBtn && !goBtn.disabled, "确认下单按钮 #ohGo 处于不可用状态");
          w.NET.info = Date.now();
          w.NET.mid = Date.now();
          w.setLock("");
          w.LOCK = "";
          await goBtn.click();
          await sleep(300);

          assert(placedOrders.length >= 2, `下单未提交足够订单: ${placedOrders.length}`);
          const entryOrd = placedOrders[0];
          const slOrd = placedOrders[1];

          // 核心校验：入场必须是 LIMIT + GTX (0% 手续费)
          assert(entryOrd.type === "LIMIT", `入场单类型不正确: ${entryOrd.type}`);
          assert(entryOrd.timeInForce === "GTX", `入场单未启用 GTX 只挂单: ${entryOrd.timeInForce}`);
          // 核心校验：止损必须是市价 STOP_MARKET 全平
          assert(slOrd.type === "STOP_MARKET", `止损单类型不正确: ${slOrd.type}`);
          assert(slOrd.closePosition === "true", `单向持仓未设 closePosition="true": ${slOrd.closePosition}`);

          // 核心校验 2：做空在现价下方（K线底部跌破做空），必须提交 STOP_MARKET 突破条件单，价格不能被篡改
          placedOrders.length = 0;
          w.F.on = true;
          w.F.step = 4;
          w.F.e = 78800; // 低于 mid (80000)
          w.F.sl = 80500; // 止损高于 entry，确定做空
          w.F.tp = 75000;
          w.render();
          await sleep(150);
          assert(w.$("#ohGo").textContent.includes("跌破做空"), "做空低于市价按钮未显示【跌破做空】");
          assert(w.sizing().isBreakout === true, "做空低于市价未标记为 isBreakout");
          assert(Math.abs(w.sizing().e - 78800) < 1e-4, `入场价被非法篡改！期望 78800，实际 ${w.sizing().e}`);
          await goBtn.click();
          await sleep(300);
          assert(placedOrders.length >= 1, "跌破做空未提交订单");
          const bkEntry = placedOrders[0];
          assert(bkEntry.type === "STOP_MARKET", `跌破做空入场单类型不正确，期望 STOP_MARKET，实际: ${bkEntry.type}`);
          assert(Math.abs(+bkEntry.stopPrice - 78800) < 1e-4, `跌破做空触发价不正确: ${bkEntry.stopPrice}`);
          assert(!bkEntry.reduceOnly, "开仓突破单不能带 reduceOnly");

          w.placeOrder = origPlace;
          w.endFlow();
        }
      },

      // 7. 三大全局风控闸门拦截测试
      {
        id: "risk_gates",
        name: "10. 三大全局风控闸门拦截（熔断 / 敞口 / 冷静期）",
        test: async () => {
          // 闸门 1: 单日最大亏损 5% 拦截测试
          w.S.acct = { equity: 10000, avail: 10000, used: 0, wallet: 10000, upnl: -600 };
          let gate = w.checkRiskGates("BTCUSDC", 100);
          assert(!gate.pass && gate.reason.includes("单日限额"), "单日浮亏超 5% 未触发熔断拦截");
          w.S.acct.upnl = 0;

          // 闸门 2: 并发总风险上限 3% 拦截测试
          w.S.pos["BTCUSDC"] = { sym: "BTCUSDC", amt: 1.0, entry: 80000 };
          w.S.ords["BTCUSDC"] = [{ symbol: "BTCUSDC", stopPrice: "77000", type: "STOP_MARKET", closePosition: "true" }]; // $3000 风险 = 30%
          gate = w.checkRiskGates("BTCUSDC", 200);
          assert(!gate.pass && gate.reason.includes("并发限额"), "并发总风险超 3% 未触发拦截");
          delete w.S.pos["BTCUSDC"];
          delete w.S.ords["BTCUSDC"];

          // 闸门 3: 连亏冷静期拦截测试
          localStorage.setItem("bn_cooldown_until", String(Date.now() + 60000));
          gate = w.checkRiskGates("BTCUSDC", 50);
          assert(!gate.pass && gate.reason.includes("冷静期"), "冷静期未触发只读开仓拦截");
          localStorage.removeItem("bn_cooldown_until");
        }
      },

      // 8. 裸仓看门狗巡检与保底补单
      {
        id: "watchdog_healing",
        name: "11. 独立裸仓看门狗 (slWatchdog) 警报与自动推导补挂",
        test: async () => {
          // 注入无止损裸仓
          w.DRY_RUN = true;
          w.S.acct = { equity: 10000, avail: 10000, used: 0, wallet: 10000, upnl: 0 };
          w.S.pos["ETHUSDC"] = { sym: "ETHUSDC", side: "BOTH", amt: 5.0, entry: 3000, liq: 2850, lev: 20 };
          w.S.ords["ETHUSDC"] = [];

          const cancelCalls = sentCalls.filter(c => c.method === "DELETE" && String(c.params.orderId) === "777666");
          assert(cancelCalls.length > 0, "止损单挂入失败后，未能自动撤销未成交的入场单！");

          // 恢复现场
          w.send = origSend;
          w.F.on = false;
        }
      }
    ];

    for (const tc of testCases) {
      addLog(tc.id, tc.name, "RUNNING", "执行测试逻辑…");
      try {
        await tc.test();
        addLog(tc.id, tc.name, "PASS", "全部断言与交互响应均正确");
        passed++;
      } catch (err) {
        console.error(err);
        addLog(tc.id, tc.name, "FAIL", err.message);
        failed++;
      }
      await sleep(100);
    }

    btn.disabled = false;
    summaryText.innerHTML = `<span style="color:var(--up);font-weight:bold;">测试完毕: ${passed} 项通过</span>${failed ? `, <span style="color:var(--down);font-weight:bold;">${failed} 项失败</span>` : " (100% 全部通过)"}`;
  }

  // 页面加载完成后自动触发全量测试
  window.addEventListener("load", () => {
    setTimeout(runAllTests, 500);
  });
</script>
</body>
</html>
