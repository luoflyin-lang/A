<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经济学闯关 · 从买奶茶到当央行行长</title>
<style>
:root{
  --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7; --surface2:#F0EFED;
  --border:#E6E5E3;
  --blue:#2783DE; --blue-s:#E5F2FC;
  --green:#46A171; --green-s:#E8F1EC;
  --orange:#D5803B; --orange-s:#FBEBDE;
  --red:#E56458; --red-s:#FCE9E7;
  --r:10px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --text:#FFFFFF; --text2:rgba(255,255,255,.65); --canvas:#191919; --soft:#202020; --surface2:#383836;
    --border:rgba(255,255,255,.20);
    --blue:#5E9FE8; --blue-s:rgba(94,159,232,.14);
    --green:#72BC8F; --green-s:rgba(114,188,143,.14);
    --orange:#DE9255; --orange-s:rgba(222,146,85,.14);
    --red:#E97366; --red-s:rgba(233,115,102,.14);
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--soft);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
b{font-weight:600}

.top{position:sticky;top:0;z-index:20;background:var(--canvas);border-bottom:1px solid var(--border)}
.top-in{max-width:1060px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.brand h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}
.brand p{margin:0;font-size:12px;color:var(--text2);white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rank{font-size:12px;color:var(--text2);white-space:nowrap}
.rank b{color:var(--text);font-size:13px}
.pbar{width:120px;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .35s ease}

.wrap{max-width:1060px;margin:0 auto;padding:24px}
.panel{background:var(--canvas);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.mt16{margin-top:16px}.mt20{margin-top:20px}

.hero h2{margin:0 0 6px;font-size:23px;line-height:1.3;font-weight:600;letter-spacing:-.2px}
.hero p{margin:0;color:var(--text2);font-size:14px;max-width:56ch}
.herorow{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.herorow>div:first-child{flex:1 1 460px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:14px;margin-top:18px}
.card{background:var(--canvas);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:left;
  display:flex;flex-direction:column;gap:7px;min-height:136px;cursor:pointer;font:inherit;color:inherit;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px);box-shadow:var(--shadow)}
.card:disabled{cursor:not-allowed;opacity:.5}
.card .row1{display:flex;align-items:center;gap:8px}
.card .em{font-size:19px;line-height:1}
.card .no{font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums;margin-left:auto}
.card h3{margin:0;font-size:15px;font-weight:600}
.card p{margin:0;font-size:13px;color:var(--text2)}
.card .foot{margin-top:auto;padding-top:4px;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--text2);white-space:nowrap}
.tag.b{background:var(--blue-s);color:var(--blue)}
.tag.g{background:var(--green-s);color:var(--green)}
.tag.o{background:var(--orange-s);color:var(--orange)}

.btn{appearance:none;border:1px solid transparent;background:var(--blue);color:#fff;font:inherit;font-size:14px;font-weight:500;
  min-height:44px;padding:0 18px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:opacity .15s}
.btn:hover:not(:disabled){opacity:.88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn.ghost:hover:not(:disabled){border-color:var(--blue);color:var(--blue);opacity:1}
.btn.sm{min-height:38px;font-size:13px;padding:0 13px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.lvtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lvtop .em{font-size:26px;line-height:1}
.lvtop h2{margin:0 0 2px;font-size:20px;font-weight:600}
.lvtop p{margin:0;color:var(--text2);font-size:13px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 0}
.step{font:inherit;font-size:13px;padding:0 14px;height:38px;border-radius:99px;border:1px solid var(--border);
  background:var(--canvas);color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.step.on{background:var(--blue);border-color:var(--blue);color:#fff}
.step:disabled{opacity:.45;cursor:not-allowed}

.lead{font-size:15px;margin:0 0 14px}
ul.pts{margin:0;padding-left:20px}
ul.pts li{margin:9px 0;font-size:14px}
.term{margin-top:18px;border-left:3px solid var(--orange);background:var(--orange-s);padding:12px 16px;border-radius:0 8px 8px 0}
.term .k{font-size:12px;font-weight:600;color:var(--orange);letter-spacing:.3px}
.term .v{font-size:14px;margin-top:3px}
.task{border-left:3px solid var(--blue);background:var(--blue-s);padding:12px 16px;border-radius:0 8px 8px 0;font-size:14px}
.task .lb{font-size:11px;font-weight:600;color:var(--blue);letter-spacing:.5px;display:block;margin-bottom:2px}

.lab{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
.lab-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.ctl{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--text2)}
.ctl-h b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl input[type=range]{width:100%;margin:10px 0 0;height:22px;accent-color:var(--blue);cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.stat{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:0}
.stat .sl{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sv{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
.stat .sv i{font-size:11px;font-weight:400;font-style:normal;color:var(--text2);margin-left:2px}
.stat.good{background:var(--green-s);border-color:transparent}.stat.good .sv{color:var(--green)}
.stat.warn{background:var(--orange-s);border-color:transparent}.stat.warn .sv{color:var(--orange)}
.stat.bad{background:var(--red-s);border-color:transparent}.stat.bad .sv{color:var(--red)}

.chart{background:var(--canvas);border:1px solid var(--border);border-radius:8px;padding:6px 4px 0}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit}
.cl{font-size:10px;fill:var(--text2)}
.cl2{font-size:9px;fill:var(--text2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);padding:2px 8px 9px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.hint{font-size:13px;color:var(--text2);line-height:1.6}
.hint b{color:var(--text)}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;color:var(--text2);font-weight:500}
.tbl tr:last-child td{border-bottom:none}

.result{margin-top:16px;padding:13px 16px;border-radius:8px;font-size:14px;display:none;line-height:1.6}
.result.ok{display:block;background:var(--green-s);color:var(--green)}
.result.no{display:block;background:var(--orange-s);color:var(--orange)}

.q{font-size:15px;font-weight:500;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-size:14px;text-align:left;background:var(--canvas);border:1px solid var(--border);border-radius:8px;
  padding:11px 14px;min-height:44px;cursor:pointer;color:inherit;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{font-weight:600;color:var(--text2);flex:none}
.opt.right{background:var(--green-s);border-color:var(--green);color:var(--green)}
.opt.right .k{color:var(--green)}
.opt.wrong{background:var(--red-s);border-color:var(--red);color:var(--red)}
.opt.wrong .k{color:var(--red)}
.opt:disabled{cursor:default}

.quote{font-size:17px;font-weight:600;line-height:1.5;margin:0 0 12px}
.cert{border:1px solid var(--border);border-radius:12px;padding:30px 24px;text-align:center;background:linear-gradient(180deg,var(--blue-s),transparent 65%)}
.cert .seal{font-size:30px}
.cert h3{margin:10px 0 2px;font-size:19px;font-weight:600}
.cert .nm{font-size:26px;font-weight:700;margin:16px 0 6px;letter-spacing:.5px;min-height:34px}
.cert .meta{font-size:12px;color:var(--text2)}
.cert .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.badge{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);font-size:16px;filter:grayscale(1);opacity:.4}
.badge.on{background:var(--green-s);filter:none;opacity:1}
.nameinput{font:inherit;font-size:15px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--canvas);color:inherit;min-height:44px;width:220px;max-width:100%}

.prose p{margin:0 0 12px;font-size:15px;line-height:1.68}
.prose p:last-child{margin-bottom:0}

.pagefoot{max-width:1060px;margin:0 auto;padding:4px 24px 40px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text2)}

@media (max-width:760px){
  .wrap{padding:16px}
  .top-in{padding:10px 16px;gap:10px}
  .lab{grid-template-columns:1fr;gap:16px}
  .hero h2{font-size:20px}
  .pagefoot{padding:4px 16px 32px}
  .prose p{font-size:14.5px}
  .pbar{width:84px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand">
    <div class="logo">📈</div>
    <div><h1>经济学闯关</h1><p>十关，从买奶茶到当央行行长</p></div>
  </div>
  <div class="top-right">
    <div class="rank">称号 · <b id="rankName">经济小白</b></div>
    <div class="pbar"><i id="pbar" style="width:0%"></i></div>
    <div class="rank"><b id="pnum">0</b>/10</div>
  </div>
</div></div>

<div class="wrap" id="app"></div>
<div class="pagefoot">
  <span>本游戏用简化模型演示经济学直觉，不构成投资或政策建议。</span>
  <button class="btn ghost sm" id="resetBtn">重置进度</button>
</div>

<script>
/* ==================== 工具 ==================== */
function el(tag, cls, html){ var n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; }
function num(v,d){ var s=(+v).toFixed(d==null?0:d); if(s.indexOf(".")>=0) s=s.replace(/0+$/,"").replace(/\.$/,""); return s; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function sc(v,dmin,dmax,pmin,pmax){ return pmin+(v-dmin)/(dmax-dmin)*(pmax-pmin); }

var PW=340,PH=212,PL=50,PR=328,PT=26,PB=168;
function svgWrap(inner){ return '<svg viewBox="0 0 '+PW+' '+PH+'" preserveAspectRatio="xMidYMid meet" role="img">'+inner+'</svg>'; }
function frame(xName,yName,xMax,yMax,yMin){
  var mid=(PT+PB)/2;
  return '<rect x="'+PL+'" y="'+PT+'" width="'+(PR-PL)+'" height="'+(PB-PT)+'" rx="4" fill="var(--soft)" stroke="var(--border)"/>'+
    '<line x1="'+PL+'" y1="'+mid+'" x2="'+PR+'" y2="'+mid+'" stroke="var(--border)" stroke-dasharray="3 4"/>'+
    '<text class="cl" x="'+PL+'" y="'+(PT-9)+'">'+yName+'</text>'+
    '<text class="cl2" x="'+(PL-6)+'" y="'+(PT+5)+'" text-anchor="end">'+yMax+'</text>'+
    '<text class="cl2" x="'+(PL-6)+'" y="'+(PB+3)+'" text-anchor="end">'+(yMin==null?"0":yMin)+'</text>'+
    (xMax?('<text class="cl2" x="'+PR+'" y="'+(PB+15)+'" text-anchor="end">'+xMax+'</text>'):"")+
    '<text class="cl" x="'+((PL+PR)/2)+'" y="'+(PH-4)+'" text-anchor="middle">'+xName+'</text>';
}
function legend(items){
  return '<div class="legend">'+items.map(function(i){ return '<span><i style="background:'+i.c+'"></i>'+i.t+'</span>'; }).join("")+'</div>';
}
function rangeCtl(o){
  var wrap=el("div","ctl");
  wrap.innerHTML='<div class="ctl-h"><span>'+o.label+'</span><b class="ctl-v"></b></div>'+
    '<input type="range" min="'+o.min+'" max="'+o.max+'" step="'+o.step+'" value="'+o.value+'" aria-label="'+o.label+'">';
  var inp=wrap.querySelector("input"), vv=wrap.querySelector(".ctl-v");
  function upd(){ vv.textContent=o.fmt(+inp.value); if(o.on) o.on(+inp.value); }
  vv.textContent=o.fmt(+inp.value);
  inp.addEventListener("input",upd);
  return {node:wrap,input:inp,get:function(){return +inp.value;},set:function(v){inp.value=v;upd();},sync:upd};
}
function statsBlock(defs){
  var wrap=el("div","stats"), map={};
  defs.forEach(function(d){
    var b=el("div","stat");
    b.innerHTML='<div class="sl">'+d.k+'</div><div class="sv"><span>–</span><i>'+(d.unit||"")+'</i></div>';
    map[d.id]=b; wrap.appendChild(b);
  });
  return {node:wrap,set:function(id,v,tone){ var b=map[id]; if(!b) return; b.querySelector("span").textContent=v; b.className="stat"+(tone?" "+tone:""); }};
}
function labGrid(left,right){
  var g=el("div","lab"), a=el("div","lab-col"), b=el("div","lab-col");
  left.forEach(function(n){a.appendChild(n);}); right.forEach(function(n){b.appendChild(n);});
  g.appendChild(a); g.appendChild(b); return g;
}
/* ==================== 实验室 1～5 ==================== */

/* 1 · 稀缺与机会成本 */
function labScarcity(mount){
  var h=6;
  var s=rangeCtl({label:"每天用于学编程的时间",min:0,max:12,step:1,value:6,fmt:function(v){return v+" 小时";},on:function(v){h=v;upd();}});
  var st=statsBlock([{id:"inc",k:"今日收入",unit:"元"},{id:"sk",k:"技能点",unit:"点"},{id:"oc",k:"机会成本",unit:"元/时"}]);
  var ch=el("div","chart"), note=el("div","hint");
  mount.appendChild(labGrid([s.node,st.node,note],[ch]));
  function upd(){
    var inc=30*(12-h), sk=8*h;
    st.set("inc",inc,inc>=180?"good":""); st.set("sk",sk,sk>=40?"good":""); st.set("oc","30");
    note.innerHTML='摆摊 <b>'+(12-h)+'</b> 小时 · 学编程 <b>'+h+'</b> 小时。每多学 1 小时编程，你就放弃了 <b>30 元</b>——这 30 元就是它的机会成本。';
    var px=function(v){return sc(v,0,96,PL,PR);}, py=function(v){return sc(v,0,360,PB,PT);};
    ch.innerHTML=svgWrap(
      frame("技能点 →","↑ 今日收入（元）","96","360")+
      '<rect x="'+px(40)+'" y="'+py(360)+'" width="'+(px(96)-px(40))+'" height="'+(py(180)-py(360))+'" fill="var(--green)" opacity=".16"/>'+
      '<rect x="'+px(60)+'" y="'+py(360)+'" width="'+(px(96)-px(60))+'" height="'+(py(300)-py(360))+'" fill="none" stroke="var(--red)" stroke-dasharray="4 3" stroke-width="1.5"/>'+
      '<line x1="'+px(0)+'" y1="'+py(360)+'" x2="'+px(96)+'" y2="'+py(0)+'" stroke="var(--blue)" stroke-width="2.5"/>'+
      '<circle cx="'+px(sk)+'" cy="'+py(inc)+'" r="6" fill="var(--blue)" stroke="var(--canvas)" stroke-width="2.5"/>'+
      '<text class="cl" x="'+px(62)+'" y="'+py(322)+'" fill="var(--red)">做不到的区域</text>'+
      '<text class="cl" x="'+px(72)+'" y="'+py(150)+'" fill="var(--green)">目标区</text>');
  }
  s.sync();
  return {check:function(){
    var inc=30*(12-h), sk=8*h;
    if(inc>=180&&sk>=40) return {ok:true,msg:"收入 "+inc+" 元、技能 "+sk+" 点，两个目标同时达成。注意只有 5 小时和 6 小时两种解法——可行空间就这么窄，这就是稀缺。"};
    return {ok:false,msg:"现在收入 "+inc+" 元、技能 "+sk+" 点。绿色方框才是可行的目标区，把滑块调到 5～6 小时之间试试。"};
  }};
}

/* 2 · 供给、需求与价格 */
function labPrice(mount){
  var p=10, unlocked=false, cost=8, shift=0;
  var s=rangeCtl({label:"一杯奶茶的售价",min:5,max:30,step:1,value:10,fmt:function(v){return v+" 元";},on:function(v){p=v;upd();}});
  var st=statsBlock([{id:"q",k:"今日销量",unit:"杯"},{id:"rev",k:"营业额",unit:"元"},{id:"pf",k:"净利润",unit:"元"}]);
  var ch=el("div","chart"), note=el("div","hint");
  var chips=el("div","btnrow");
  var b1=el("button","btn ghost sm","原料涨到 12 元"), b2=el("button","btn ghost sm","网红打卡，需求 +80"), b3=el("button","btn ghost sm","回到基础情景");
  [b1,b2,b3].forEach(function(b){b.disabled=true;chips.appendChild(b);});
  b1.onclick=function(){cost=12;shift=0;upd();}; b2.onclick=function(){cost=8;shift=80;upd();}; b3.onclick=function(){cost=8;shift=0;upd();};
  var chipHint=el("div","hint","通关后解锁「情景实验」：看看成本上涨、需求变热时，最优价格会往哪边走。");
  mount.appendChild(labGrid([s.node,st.node,note,chipHint,chips],[ch]));
  function calc(){ var q=Math.max(0,300+shift-10*p); return {q:q,rev:p*q,pf:(p-cost)*q-300}; }
  function upd(){
    var r=calc();
    st.set("q",r.q); st.set("rev",r.rev); st.set("pf",num(r.pf),r.pf>=850?"good":(r.pf<0?"bad":""));
    note.innerHTML='定价太低，卖得多却不赚钱；定价太高，没人买。<b>利润 =（售价 − 每杯成本 '+cost+' 元）× 销量 − 固定成本 300 元</b>。';
    var px=function(v){return sc(v,0,400,PL,PR);}, py=function(v){return sc(v,0,32,PB,PT);};
    var topP=Math.min(32,(300+shift)/10);
    ch.innerHTML=svgWrap(
      frame("销量（杯）→","↑ 价格（元）","400","32")+
      ((r.q>0&&p>cost)?('<rect x="'+px(0)+'" y="'+py(p)+'" width="'+(px(r.q)-px(0))+'" height="'+(py(cost)-py(p))+'" fill="var(--green)" opacity=".18"/>'):"")+
      '<line x1="'+px(0)+'" y1="'+py(topP)+'" x2="'+px(300+shift)+'" y2="'+py(0)+'" stroke="var(--blue)" stroke-width="2.5"/>'+
      '<line x1="'+px(0)+'" y1="'+py(cost)+'" x2="'+px(400)+'" y2="'+py(cost)+'" stroke="var(--orange)" stroke-width="2" stroke-dasharray="5 4"/>'+
      '<line x1="'+px(0)+'" y1="'+py(p)+'" x2="'+px(r.q)+'" y2="'+py(p)+'" stroke="var(--text2)" stroke-width="1" stroke-dasharray="2 3"/>'+
      '<circle cx="'+px(r.q)+'" cy="'+py(p)+'" r="6" fill="var(--blue)" stroke="var(--canvas)" stroke-width="2.5"/>'+
      ((r.pf>0&&r.q>60)?('<text class="cl" x="'+px(r.q/2)+'" y="'+py((p+cost)/2-0.6)+'" fill="var(--green)" text-anchor="middle">毛利</text>'):""))+
      legend([{c:"var(--blue)",t:"需求：价越高，买的人越少"},{c:"var(--orange)",t:"每杯成本"}]);
  }

    '<tr><td>高价</td><td>8 / 8</td><td>2 / 12</td></tr>'+

  }

  task:"化工厂向河里排污，下游居民为此付出代价。你是监管者，可以对每件产品征收排污税。<br>目标：找到让<b>社会总福利</b>最高的税率（≥ 395 元）。注意：税不是越高越好。",
  lab:labExternality,
  quiz:{q:"工厂排污让下游居民治病、减产，而这些成本不在工厂的账本上。这叫：",
    o:["规模经济","负外部性","比较优势","沉没成本"],a:1,
    exp:"私人成本小于社会成本，于是产量超过社会最优。常见纠正手段是庇古税或可交易排污权。"},
  insight:"<p>“市场万能”和“市场邪恶”都是懒人的结论。真正的问题是：<b>这里的成本和收益，有没有落到同一个人头上？</b></p><p>如果没有，就需要一个机制把它们重新对齐。这才是监管的经济学意义。</p>"
},
{
  id:8, icon:"♟️", tier:"高阶", title:"街角的两家加油站",
  sub:"博弈论 · 囚徒困境",
  concept:"<p>前面的关卡里，你面对的是一个不会反击的世界。但很多时候，<b>你的最优选择取决于对方怎么选</b>——这就是<b>博弈</b>。</p><p><b>囚徒困境：</b>每个人都选对自己最有利的那步，结果反而集体变差。价格战、军备竞赛、内卷、公共资源过度使用，都是它的变体。</p><p>出路往往在于<b>重复互动</b>：当游戏要玩很多轮、对方会记住你时，声誉就有了价值。</p>",
  task:"你和对面的加油站各自决定价格，共 <b>8 个回合</b>。参考收益表（你 / 对手，单位：万元）。<br>目标：八回合后你的总利润 ≥ 55 万。",
  lab:labGame,
  quiz:{q:"两家店本可以都维持高价各赚 8 万，却双双降价变成各赚 4 万。这说明：",
    o:["个体理性可能导致集体更差的结果","降价总是错的","企业应当公开商定价格","市场总能自动达到最优"],a:0,
    exp:"这是囚徒困境。顺带说一句：现实中企业合谋定价是违法的；重复博弈中的合作靠的是声誉与长期利益，而不是私下约定。"},
  insight:"<p>看到“大家都很努力，但大家都更累了”的局面，先别急着指责个人。先问：<b>这个游戏的规则是什么？</b></p><p>想改变结果，往往要改规则：拉长博弈、公开信息、建立声誉机制或外部约束。</p>"
},
{
  id:9, icon:"🏦", tier:"高阶", title:"你是央行行长",
  sub:"利率 · 通胀与失业的权衡",
  concept:"<p>央行手里最主要的方向盘是<b>利率</b>。</p><p><b>加息</b>：借钱变贵 → 投资消费降温 → 通胀下来了，代价是失业上升。<br><b>降息</b>：反之。</p><p>两件事让它变难：一是<b>时滞</b>——今天的动作要几个月甚至一年才看到效果；二是<b>惯性</b>——通胀会自己延续，拖得越久越难治。</p>",
  task:"你接手时：通胀 <b>6.0%</b>（偏高）、失业 <b>4.2%</b>。任期 <b>4 个回合</b>，中性利率为 3%。<br>目标：任期结束时通胀落在 1～3%，且失业 ≤ 6%。",
  lab:labCentralBank,
  quiz:{q:"一国通胀明显过高，央行通常会：",
    o:["降息刺激经济","加息以抑制总需求","直接规定所有商品价格","什么也不做，等它自愈"],a:1,
    exp:"加息抬高借贷成本、抑制需求，从而压低通胀，代价是增长放缓、失业上升，且效果有数月至一年的时滞。"},
  insight:"<p>宏观政策没有“正确答案”，只有<b>权衡</b>：你想少一点通胀，就得接受多一点失业；反之亦然。</p><p>下次在新闻里看到“加息 25 个基点”，你已经知道它在调什么、为什么调、以及代价是什么了。</p>"
},
{
  id:10, icon:"🎓", tier:"结业", title:"结业大考",
  sub:"把九把刀用在真实情景里",
  concept:"<p>你已经走完了九关，手里有九把刀：</p><p><b>稀缺与机会成本 · 供求与价格 · 边际与沉没 · 比较优势 · 价格管制与激励 · 货币与通胀 · 外部性 · 博弈 · 货币政策</b></p><p>经济学不是背名词，而是一套提问方式：代价是什么？激励是什么？谁在为它买单？接下来用六个情景验证一下。</p>",
  task:"六道情景题，<b>答对 5 题即可结业</b>。选完后点击下方的「检验结果」。",
  lab:labExam,
  quiz:null,
  cert:true
}
];
/* ==================== 应用外壳 ==================== */
var KEY="econ-quest-v1";
var S={unlocked:1,done:{},score:0,name:""};
function load(){ try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); if(o&&typeof o==="object"){ S.unlocked=o.unlocked||1; S.done=o.done||{}; S.score=o.score||0; S.name=o.name||""; } } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
var RANKS=[[1,"经济小白"],[3,"生活理财家"],[5,"市场观察员"],[7,"政策分析师"],[9,"首席经济学家"]];
function doneCount(){ var n=0; for(var k in S.done){ if(S.done[k]) n++; } return n; }
function rankName(){ var n=doneCount(); for(var i=0;i<RANKS.length;i++){ if(n<=RANKS[i][0]) return RANKS[i][1]; } return "诺奖候选人"; }
function tierCls(t){ return t==="入门"?"g":(t==="进阶"?"b":(t==="高阶"?"o":"")); }

var app=document.getElementById("app");
function syncTop(){
  var n=doneCount();
  document.getElementById("pnum").textContent=n;
  document.getElementById("pbar").style.width=Math.round(n/LEVELS.length*100)+"%";
  document.getElementById("rankName").textContent=rankName();
}
function markDone(L){
  if(!S.done[L.id]){ S.done[L.id]=true; S.score+=100; }
  var nx=Math.min(L.id+1,LEVELS.length);
  if(S.unlocked<nx) S.unlocked=nx;
  save(); syncTop();
}

function renderHome(){
  app.innerHTML="";
  var n=doneCount(), all=(n>=LEVELS.length);
  var hero=el("div","panel hero");
  hero.innerHTML='<div class="herorow">'+
    '<div><h2>十关，把经济学装进你的日常直觉</h2>'+
    '<p>每关只讲一个概念，然后把一个可以拨动的小世界交给你：调价格、调税率、调利率，亲眼看看会发生什么。不需要数学基础，会拖滑块就行。</p></div>'+
    '<div class="btnrow"></div></div>';
  var go=el("button","btn", all?"🎓 查看结业证书":(n===0?"▶ 从第 1 关开始":"▶ 继续第 "+S.unlocked+" 关"));
  go.onclick=function(){ if(all){ renderLevel(LEVELS.length-1,2); } else { renderLevel(S.unlocked-1,0); } };
  hero.querySelector(".btnrow").appendChild(go);
  app.appendChild(hero);
  var grid=el("div","grid");
  LEVELS.forEach(function(L,i){
    var open=(i+1)<=S.unlocked, done=!!S.done[L.id];
    var c=el("button","card");
    c.disabled=!open;
    c.innerHTML='<div class="row1"><span class="em">'+L.icon+'</span>'+
      '<span class="tag '+tierCls(L.tier)+'">'+L.tier+'</span>'+
      '<span class="no">'+(i+1)+' / '+LEVELS.length+'</span></div>'+
      '<h3>'+L.title+'</h3><p>'+L.sub+'</p>'+
      '<div class="foot"><span class="tag">'+(done?"✓ 已通关":(open?"可挑战":"🔒 未解锁"))+'</span></div>';
    c.onclick=function(){ renderLevel(i,0); };
    grid.appendChild(c);
  });
  app.appendChild(grid);
  syncTop();
  window.scrollTo(0,0);
}

function renderLevel(idx,startStep){
  var L=LEVELS[idx];
  app.innerHTML="";
  var st={lab:!!S.done[L.id], quiz:!!S.done[L.id]};
  var head=el("div","panel");
  head.innerHTML='<div class="lvtop"><span class="em">'+L.icon+'</span>'+
    '<div style="min-width:0"><h2>第 '+L.id+' 关 · '+L.title+'</h2><p>'+L.sub+'</p></div>'+
    '<div class="btnrow" style="margin-left:auto"></div></div>';
  var back=el("button","btn ghost sm","← 关卡地图"); back.onclick=renderHome;
  head.querySelector(".btnrow").appendChild(back);
  var nav=el("div","steps"); head.appendChild(nav);
  app.appendChild(head);

  var titles=L.quiz?["① 学 · 概念","② 玩 · 实验","③ 测 · 小考","④ 悟 · 迁移"]:["① 学 · 回顾","② 玩 · 大考","③ 悟 · 证书"];
  var cur=0, panels=[];
  function canGo(i){
    if(i<=1) return true;
    if(L.quiz) return (i===2)?st.lab:st.quiz;
    return st.lab;
  }
  function refresh(){
    Array.prototype.forEach.call(nav.children,function(b,i){
      b.className="step"+(i===cur?" on":"");
      b.disabled=!canGo(i);
    });
  }
  function show(i){
    if(!canGo(i)) return;
    cur=i;
    panels.forEach(function(p,pi){ p.style.display=(pi===i)?"":"none"; });
    refresh();
    window.scrollTo(0,0);
  }
  titles.forEach(function(t,i){
    var b=el("button","step",t);
    b.onclick=function(){ show(i); };
    nav.appendChild(b);
  });

  /* ① 概念 */
  var p0=el("div","panel mt16");
  p0.appendChild(el("div","prose",L.concept));
  var r0=el("div","btnrow mt20");
  var g0=el("button","btn",L.quiz?"进入实验室 →":"开始结业大考 →");
  g0.onclick=function(){ show(1); };
  r0.appendChild(g0); p0.appendChild(r0);
  panels.push(p0);

  /* ② 实验 */
  var p1=el("div","panel mt16");
  var tk=el("div","task"); tk.innerHTML='<span class="lb">你的任务</span>'+L.task;
  p1.appendChild(tk);
  var mount=el("div",null,""); p1.appendChild(mount);
  var inst=L.lab(mount);
  var res1=el("div","result"); p1.appendChild(res1);
  var r1=el("div","btnrow mt20");
  var ck=el("button","btn","检验结果");
  var nx1=el("button","btn ghost",L.quiz?"下一步：小考 →":"下一步：领证书 →");
  nx1.style.display="none";
  ck.onclick=function(){
    var r=inst.check();
    res1.className="result "+(r.ok?"ok":"no");
    res1.innerHTML=(r.ok?"✅ ":"💡 ")+r.msg;
    if(r.ok){
      st.lab=true;
      if(!L.quiz){ st.quiz=true; markDone(L); }
      nx1.style.display=""; refresh();
    }
  };
  nx1.onclick=function(){ show(2); };
  r1.appendChild(ck); r1.appendChild(nx1); p1.appendChild(r1);
  panels.push(p1);

  /* ③ 小考 */
  if(L.quiz){
    var p2=el("div","panel mt16");
    p2.appendChild(el("p","q",L.quiz.q));
    var opts=el("div","opts"); p2.appendChild(opts);
    var res2=el("div","result"); p2.appendChild(res2);
    var r2=el("div","btnrow mt20");
    var nx2=el("button","btn","查看总结 →"); nx2.style.display="none";
    nx2.onclick=function(){ show(3); };
    r2.appendChild(nx2); p2.appendChild(r2);
    var locked=false;
    L.quiz.o.forEach(function(txt,oi){
      var b=el("button","opt",'<span class="k">'+"ABCD".charAt(oi)+'</span><span>'+txt+'</span>');
      b.onclick=function(){
        if(locked) return;
        if(oi===L.quiz.a){
          locked=true;
          Array.prototype.forEach.call(opts.children,function(c,ci){ c.disabled=true; if(ci===L.quiz.a) c.className="opt right"; });
          res2.className="result ok"; res2.innerHTML="✅ 答对了。"+L.quiz.exp;
          st.quiz=true; markDone(L); nx2.style.display=""; refresh();
        } else {
          b.className="opt wrong"; b.disabled=true;
          res2.className="result no"; res2.innerHTML="💡 这个不对。回到上一步再拨两下滑块，答案就在里面。";
        }
      };
      opts.appendChild(b);
    });
    panels.push(p2);
  }

  /* ④ 迁移 / 证书 */
  var p3=el("div","panel mt16");
  if(L.cert){
    var d=new Date();
    var cert=el("div","cert");
    cert.innerHTML='<div class="seal">🎓</div><h3>经济学思维 · 结业证书</h3>'+
      '<div class="nm">—</div>'+
      '<div class="meta">已完成十关训练，掌握九个核心概念</div>'+
      '<div class="badges"></div>'+
      '<div class="meta" style="margin-top:16px">签发日期 '+d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日</div>';
    var nmEl=cert.querySelector(".nm"), bg=cert.querySelector(".badges");
    LEVELS.forEach(function(x){ bg.appendChild(el("div","badge"+(S.done[x.id]?" on":""),x.icon)); });
    p3.appendChild(cert);
    var rn=el("div","btnrow mt20");
    var inp=el("input","nameinput"); inp.type="text"; inp.placeholder="你的名字"; inp.value=S.name||"";
    rn.appendChild(el("span","hint","写上名字，它会出现在证书上："));
    function syncName(){ var v=inp.value.replace(/^\s+|\s+$/g,""); nmEl.textContent=v||"—"; S.name=v; save(); }
    inp.addEventListener("input",syncName); syncName();
    rn.appendChild(inp); p3.appendChild(rn);
    p3.appendChild(el("div","prose mt20",
      '<p><b>接下来往哪走？</b>想系统一点，曼昆《经济学原理》的前十章恰好覆盖你玩过的这些关；想看真实世界里的应用，可以读《魔鬼经济学》和《贫穷的本质》。</p>'+
      '<p>但最有用的，其实是把这四个问题变成习惯：<b>代价是什么？激励是什么？谁在为它买单？如果所有人都这么做会怎样？</b></p>'));
  } else {
    p3.appendChild(el("p","quote","🎯 带走这一条"));
    p3.appendChild(el("div","prose",L.insight));
  }
  var r3=el("div","btnrow mt20");
  var home=el("button","btn ghost","← 关卡地图"); home.onclick=renderHome;
  r3.appendChild(home);
  if(idx+1<LEVELS.length){
    var nxl=el("button","btn","下一关："+LEVELS[idx+1].icon+" "+LEVELS[idx+1].title+" →");
    nxl.onclick=function(){ renderLevel(idx+1,0); };
    r3.appendChild(nxl);
  }
  p3.appendChild(r3);
  panels.push(p3);

  panels.forEach(function(p){ app.appendChild(p); });
  var s0=startStep||0;
  show(canGo(s0)?s0:0);
}

(function(){
  var rb=document.getElementById("resetBtn"), armed=false, tid=null;
  rb.onclick=function(){
    if(!armed){ armed=true; rb.textContent="再点一次确认重置"; tid=setTimeout(function(){armed=false;rb.textContent="重置进度";},3000); return; }
    clearTimeout(tid); armed=false; rb.textContent="重置进度";
    S={unlocked:1,done:{},score:0,name:""}; save(); renderHome();
  };
})();

load();
renderHome();
</script>
</body>
</html>
