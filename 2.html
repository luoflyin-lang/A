const DB=[
{id:"m1",name:"第1章 微观基础",icon:"🧭",intro:"你刚接手一家街角咖啡店，先学会像经济学家一样思考。",
cards:[
["稀缺与权衡","资源有限、欲望无限，所以任何选择都有代价。经济学的第一性原理不是钱，而是‘取舍’。"],
["机会成本","选择的真实成本 = 放弃的最高价值替代方案（含隐性成本，如你的时间）。会计只算花掉的钱，经济学还算没赚到的钱。"],
["边际思维","决策看‘再多一单位’的边际收益 vs 边际成本，而不是平均值。已经花掉且收不回的是沉没成本，与未来决策无关。"],
["供给与需求","价格上升→需求量减少、供给量增加。注意区分‘需求量变动’（沿曲线移动，价格引起）与‘需求变动’（曲线移动，收入/偏好/替代品引起）。"],
["弹性","弹性 = 需求量变化% ÷ 价格变化%。缺乏弹性（<1，如汽油、药品）涨价总收入反而增加；富有弹性（>1，如某品牌零食）涨价总收入下降。"],
["价格管制","价格上限低于均衡→短缺、排队、黑市、质量下降；价格下限高于均衡→过剩（如最低工资对低技能岗位的影响）。"]],
qs:[
["你花200元买了演唱会门票，同一时段本可以加班赚300元。去看演唱会的机会成本是？",["200元票价","300元放弃的加班收入（还要算上票价的另一用途）","500元","零，因为票已经买了"],1,"机会成本是放弃的最高价值替代方案。票钱是已发生支出，真正被‘牺牲’的是那300元收入。"],
["电影开场10分钟你发现片子很烂，票不可退。经济学上正确做法是？",["必须看完，否则票钱白花","只比较‘继续看’的未来收益与成本，不好看就走","看完一半再走以对冲","取决于票价高低"],1,"票价是沉没成本，不进入边际决策。只看往后的边际收益 vs 边际成本（你的时间）。"],
["咖啡豆价格大涨，对咖啡的供给曲线影响是？",["右移（供给增加）","左移（供给减少），均衡价上升、均衡量下降","不动，只是需求下降","变成垂直线"],1,"投入品成本上升使每一价格下的供给量减少，曲线左移。"],
["汽油需求在短期缺乏弹性，意味着？",["涨价后需求量降幅小于涨价幅度，卖方总收入上升","涨价后没人买","需求曲线水平","弹性与收入无关"],0,"缺乏弹性时，价格上升带来的收入增加超过销量损失。这也是为什么能源税容易转嫁给消费者。"],
["政府把租金上限定在均衡租金之下，最可能出现？",["住房供给增加","房源短缺、排队与地下加价，长期新建减少","租金自动回到均衡","房东利润上升"],1,"价格上限造成量的短缺与非价格配给，长期抑制供给投资。"],
["下列哪一项会让‘需求曲线’整体右移（而非沿曲线移动）？",["该商品自身降价","消费者收入上升（正常品）","生产成本下降","政府对卖方征税"],1,"自身价格变化是沿曲线移动；收入、偏好、替代/互补品价格变化才使曲线移动。"]]},

{id:"m2",name:"第2章 市场结构与失灵",icon:"⚖️",intro:"市场很强大，但会失灵。你现在是反垄断与环保听证会的顾问。",
cards:[
["完全竞争","多买多卖、产品同质、自由进出。企业是价格接受者，短期 P=MC，长期 P=MC=最低平均成本，经济利润为零（会计利润可为正）。"],
["垄断与市场力量","垄断者按 MR=MC 定产量再抬价，结果是产量偏低、价格偏高，产生无谓损失。垄断的来源：规模经济、网络效应、专利、行政许可。"],
["外部性","负外部性（污染）使社会成本>私人成本，产量高于社会最优；解法：庇古税、可交易排放权、明确产权（科斯）。正外部性（教育、疫苗）则需补贴。"],
["公共品与公地悲剧","公共品非排他、非竞争（国防、灯塔）→ 搭便车 → 私人供给不足。共有资源（渔场）竞争但非排他 → 过度使用。"],
["博弈论","囚徒困境：各自最优导致集体最差；纳什均衡未必帕累托最优。重复博弈、声誉与惩罚机制可支撑合作（这正是合同与监管的逻辑）。"],
["信息不对称","逆向选择发生在交易前（柠檬市场、保险只有病人买）；道德风险发生在交易后（有保险后开车更莽）。解法：信号（保修、学历）、筛选、免赔额、监督。"]],
qs:[
["完全竞争行业的长期均衡特征是？",["价格高于平均成本，利润为正","P=MC=最低平均成本，经济利润为零","企业可以任意定价","产量低于社会最优"],1,"自由进出把经济利润竞争掉，长期停在效率最高的成本点。"],
["工厂向河里排污却不承担下游损失，这属于？",["正外部性，产量不足","负外部性，产量高于社会最优","公共品问题","道德风险"],1,"私人成本低于社会成本，市场会‘生产过多’污染性产出。"],
["庇古税的核心作用是？",["惩罚企业以增加财政收入","把外部成本内部化，使私人成本≈社会成本","直接禁止污染","补贴受害者"],1,"用价格纠正边际激励，让污染者面对真实的社会成本。"],
["下列最接近纯公共品的是？",["付费流媒体会员","国防与灯塔","公共渔场里的鱼","高速公路的收费车道"],1,"非排他+非竞争才是纯公共品；渔场是共有资源，收费道路可排他。"],
["二手车‘柠檬问题’的根源是？",["道德风险","交易前的信息不对称造成逆向选择，好车被挤出市场","垄断定价","外部性"],1,"卖方比买方更了解车况，买家只肯出平均价，优质车退出，市场质量下滑。"],
["囚徒困境中双方都选择‘背叛’，这一结果是？",["帕累托最优","纳什均衡但非帕累托最优","既非均衡也非最优","垄断均衡"],1,"给定对方策略无人愿改变（均衡），但双方合作本可更好（非最优）。"]]},

{id:"m3",name:"第3章 宏观经济学",icon:"🌐",intro:"你被任命为统计局与总理府的联合分析师，先学会读懂一个国家。",
cards:[
["GDP 三种算法","生产法（增加值之和）、支出法（C+I+G+NX）、收入法（工资+利润+租金+税）。只算本期新生产的最终产品：二手交易、中间品、转移支付都不计。"],
["名义 vs 实际","实际 GDP 剔除价格变动。GDP 平减指数 = 名义/实际×100。人均实际 GDP 增长才是生活水平改善的近似。"],
["失业","摩擦性（找工作中）、结构性（技能不匹配）、周期性（需求不足）。自然失业率 = 摩擦+结构；失业率下降也可能因为人退出劳动力（看劳动参与率）。"],
["通胀","CPI 有替代偏差、质量偏差。需求拉动（钱多）vs 成本推动（供给冲击）。温和通胀润滑经济，通缩+债务=债务紧缩螺旋，最难治。"],
["AD-AS 与产出缺口","短期 AD 右移→产出↑价格↑；供给冲击使 AS 左移→滞胀（产出↓价格↑），这时货币政策面临两难。长期产出由技术、资本、人口决定。"],
["乘数","边际消费倾向 MPC=c 时，简单支出乘数=1/(1−c)。但有税收、进口、挤出与预期，现实乘数通常远小于教科书值（衰退期更大，繁荣期更小）。"]],
qs:[
["下列哪一项计入今年的 GDP？",["二手房的成交总价","今年新生产并卖出的汽车","给失业者的救济金","股票买卖差价"],1,"GDP 只统计本期新生产的最终产品与服务；二手交易和转移支付不算生产。"],
["名义 GDP 增长 8%、通胀 6%，实际增长约为？",["14%","约2%","6%","无法判断"],1,"实际增长≈名义增长−通胀率，约2%。"],
["煤矿工人因产业转型长期失业，属于？",["摩擦性失业","结构性失业","周期性失业","隐性就业"],1,"技能与岗位需求不匹配即结构性失业，需再培训而非单纯刺激需求。"],
["国际油价暴涨引发的短期后果最接近？",["产出上升、价格下降","总供给左移，出现产出下降+通胀上升的滞胀","总需求右移","通缩"],1,"成本推动型冲击让央行两难：抗通胀会加深衰退。"],
["MPC=0.8 时简单支出乘数约为？",["0.8","1.25","5","8"],2,"1/(1−0.8)=5。现实中因税收、进口与挤出会显著更小。"],
["失业率下降，但同时劳动参与率大幅下降，说明？",["就业形势明确改善","可能是灰心劳动者退出统计，需谨慎解读","通胀必然上升","GDP 一定增长"],1,"失业率的分母是劳动力，人退出统计也会让数字变好看。"]]},

{id:"m4",name:"第4章 货币与银行",icon:"🏦",intro:"你走进央行的地下金库：钱到底是从哪来的？",
cards:[
["货币是什么","职能：交换媒介、记账单位、价值储藏。层次：M0 现金 < M1 现金+活期 < M2 +定期与储蓄。现代经济中绝大部分货币是银行存款，即债务。"],
["银行如何创造货币","部分准备金制度下，银行放贷即创造存款。理论货币乘数 = 1/准备率（10% → 最多10倍），实际受资本充足率、贷款需求与现金漏损限制。"],
["央行工具","政策利率与走廊、公开市场操作、准备金率、再贴现、QE（买长期资产压低长端利率、扩表）与前瞻指引。目标：物价稳定+金融稳定（有的还含就业）。"],
["名义 vs 实际利率","费雪方程：名义 i ≈ 实际 r + 预期通胀 π。通胀超预期时借款人受益、储户受损。实际利率才决定投资与储蓄决策。"],
["收益率曲线","期限结构反映增长与通胀预期+期限溢价。长端低于短端（倒挂）历史上是衰退的强预警信号，因为市场预期央行未来必须降息。"],
["银行挤兑与最后贷款人","银行天然期限错配（短借长贷），信心一失即挤兑。存款保险+央行作为最后贷款人（对有偿付能力但缺流动性者放款）是防线；代价是道德风险，故需资本与监管。"]],
qs:[
["准备率10%、无现金漏损，1000元基础货币最多支持多少存款？",["1100元","约10000元","100元","1000元"],1,"货币乘数=1/0.1=10，这是理论上限，现实中远低于此。"],
["费雪方程告诉我们？",["名义利率≈实际利率+预期通胀","实际利率恒定","通胀与利率无关","名义利率=汇率变化"],0,"所以看到‘利率5%’要先问通胀多少，才知道钱是真涨还是虚涨。"],
["量化宽松（QE）的本质是？",["央行直接给居民发现金","央行购买（多为长期）资产、压低长端利率并扩张自身资产负债表","提高准备金率","财政部发债"],1,"QE 作用于价格（长端利率与风险溢价）与预期，不等于财政转移。"],
["收益率曲线倒挂通常被视为？",["经济过热信号","衰退预警信号","通缩已结束","与宏观无关的技术现象"],1,"市场在为未来降息定价，历史命中率高但并非必然。"],
["预期通胀上升而名义利率不变，则实际利率？",["上升，有利储户","下降，有利借款人","不变","变为零"],1,"r=i−π，π↑而 i 不变则 r↓，债务实际负担减轻。"],
["央行作为‘最后贷款人’的经典准则是？",["救助所有亏损机构","对有偿付能力但暂缺流动性的机构放款，并有惩罚性利率与合格抵押品","只救大银行","完全不干预"],1,"白芝浩原则：救流动性、不救破产，避免道德风险。"]]},

{id:"m5",name:"第5章 财政与政策取舍",icon:"🏛️",intro:"预算会议开始了，你要在增长、通胀与债务之间做选择。",
cards:[
["预算与自动稳定器","财政赤字=支出−收入。失业保险、累进税等在衰退时自动扩张、繁荣时自动收缩，无需立法，是最快的稳定器。"],
["税收效率","税收产生无谓损失，弹性越大损失越大；宽税基、低税率、少扭曲通常更优。拉弗曲线说明税率过高会反而减少收入，但拐点位置有争议。"],
["债务可持续性","关键看利率 r 与名义增长 g 的关系：r<g 时债务/GDP 更容易稳定；r>g 则需要基本盈余。真正的风险是币种错配与再融资风险，而非绝对数字。"],
["菲利普斯曲线","短期存在通胀-失业取舍；长期曲线垂直于自然失业率，靠通胀换就业只会推高预期（滞胀的教训）。故央行独立与预期锚定极重要。"],
["政策时滞与挤出","认知、决策、执行、见效四重时滞使逆周期调节容易‘打歪’。政府大量借款可能推高利率、挤出私人投资（充分就业时尤甚）。"],
["李嘉图等价与再分配","若理性家庭预期减税=未来加税，就会储蓄而非消费，刺激失效（现实只是部分成立）。政策评估要看‘谁受益、谁承担、代际如何分配’。"]],
qs:[
["下列哪一项是自动稳定器？",["临时基建刺激计划","失业保险与累进所得税","央行降息","减税一次性红包"],1,"随经济周期自动增减，无需新决策。"],
["债务/GDP 更容易稳定的条件是？",["名义利率高于名义增长率","名义利率低于名义增长率","绝对债务规模小于1万亿","财政永远盈余"],1,"r<g 时增长自动稀释债务；r>g 需要基本盈余来止血。"],

/* ================= 存档 ================= */
const LS="econquest_v1";
let S=(function(){try{const o=JSON.parse(localStorage.getItem(LS));if(o&&o.v===1)return o}catch(e){}
 return {v:1,xp:0,srs:{},prog:{},ach:[],rev:0,ans:0,right:0,bestCombo:0,sims:{},grad:0}})();
function save(){localStorage.setItem(LS,JSON.stringify(S))}
function lvl(){return Math.floor(Math.sqrt(S.xp/60))+1}
function xpAt(l){return Math.pow(l-1,2)*60}
function title(){let t=TITLES[0][1];TITLES.forEach(function(p){if(lvl()>=p[0])t=p[1]});return t}
function P(id){if(!S.prog[id])S.prog[id]={learn:0,drill:0,boss:0};return S.prog[id]}
function unlocked(i){return i===0||P(DB[i-1].id).boss>0}
function allBoss(){return DB.every(function(m){return P(m.id).boss>0})}
function addXp(n){S.xp+=n;save()}
function ach(id){if(S.ach.indexOf(id)<0){S.ach.push(id);save();toast("🏆 解锁成就："+ACH.filter(function(a){return a[0]===id})[0][1])}}
function checkAch(){if(S.rev>=50)ach("a4");if(lvl()>=10)ach("a6");if(allBoss())ach("a7");
 if(S.bestCombo>=10)ach("a3");if(S.sims.mk&&S.sims.cb&&S.sims.pf)ach("a5");save()}

/* ================= 间隔复习 (Leitner) ================= */
const INT=[0,1,2,4,8,16,35];
function srsUpd(key,ok){const c=S.srs[key]||{b:0,n:0};c.b=ok?Math.min(6,c.b+1):1;c.n++;c.due=Date.now()+INT[c.b]*864e5;S.srs[key]=c;save()}
function dueItems(){const out=[];for(const k in S.srs){if(S.srs[k].due<=Date.now()){const p=k.split(":");const m=DB.filter(function(x){return x.id===p[0]})[0];if(m&&m.qs[+p[1]])out.push({key:k,q:m.qs[+p[1]],mod:m.name})}}return out}

function el(h){const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function toast(t){const d=el('<div style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f6feb;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99">'+t+'</div>');document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function fmt(n){return n.toLocaleString("zh-CN",{maximumFractionDigits:0})}
function pct(x){return (x*100).toFixed(1)+"%"}

 document.getElementById("hbar").style.width=Math.min(100,cur/need*100)+"%";

/* ================= 通用答题引擎 ================= */
let Q=null,timer=null;
function quiz(cfg){Q={items:cfg.items,i:0,right:0,n:0,combo:0,best:0,lives:cfg.lives||0,xp:cfg.xp||10,time:cfg.time||0,
 title:cfg.title||"练习",after:cfg.after,wrong:[],mult:cfg.mult||1,endless:!!cfg.endless,refill:cfg.refill};qStep()}
function qStep(){
 if(timer){clearInterval(timer);timer=null}
 const a=document.getElementById("app");a.innerHTML="";
 if(Q.endless&&Q.i>=Q.items.length&&Q.refill)Q.items=Q.items.concat(Q.refill());
 if(Q.i>=Q.items.length||(Q.lives<0)){return qEnd()}
 const it=Q.items[Q.i],q=it.q;
 const opts=shuffle(q[1].map(function(t,i){return {t:t,i:i}}));
 const hd=el('<div class="card"><div class="kv"><span>'+Q.title+'</span><span>第 '+(Q.i+1)+' 题</span><span>✅ '+Q.right+'</span><span>🔥 连击 '+Q.combo+'</span>'+(Q.lives?'<span>❤️ '+Q.lives+'</span>':'')+'<span id="tm"></span></div></div>');
 a.appendChild(hd);
 a.appendChild(el('<div class="card"><div class="small">'+(it.mod||"")+'</div><div style="font-size:16px;margin-top:4px">'+q[0]+'</div></div>'));
 const wrap=el('<div class="card"></div>');
 opts.forEach(function(o,k){const b=el('<button class="opt">'+(k+1)+'. '+o.t+'</button>');
  b.onclick=function(){answer(it,o.i===q[2],wrap,opts,q)};wrap.appendChild(b)});
 a.appendChild(wrap);
 if(Q.time){let t=Q.time;document.getElementById("tm").textContent="⏱ "+t+"s";
  timer=setInterval(function(){t--;const e=document.getElementById("tm");if(e)e.textContent="⏱ "+t+"s";
   if(t<=0){clearInterval(timer);timer=null;answer(it,false,wrap,opts,q,true)}},1000)}
 head();
}
function answer(it,ok,wrap,opts,q,timeout){
 if(timer){clearInterval(timer);timer=null}
 Array.prototype.forEach.call(wrap.children,function(b,k){b.disabled=true;
  if(opts[k].i===q[2])b.className="opt ok";else b.className="opt"});
 Q.n++;S.ans++;if(ok){Q.right++;S.right++;Q.combo++;Q.best=Math.max(Q.best,Q.combo);
  if(Q.combo>S.bestCombo)S.bestCombo=Q.combo;
  addXp(Math.round(Q.xp*Q.mult*(1+Math.min(Q.combo,10)*0.1)))}
 else{Q.combo=0;Q.wrong.push({q:q,mod:it.mod});if(Q.lives)Q.lives--;if(Q.lives===0)Q.lives=-1}
 if(it.key){srsUpd(it.key,ok);S.rev++}
 save();checkAch();
 const fb=el('<div class="card"><b>'+(ok?'✅ 正确':(timeout?'⏰ 超时':'❌ 答错'))+'</b><div class="hint">'+q[3]+'</div></div>');
 const b=el('<button class="b">继续 →</button>');b.onclick=function(){Q.i++;qStep()};fb.appendChild(b);
 document.getElementById("app").appendChild(fb);
 fb.scrollIntoView({behavior:"smooth",block:"end"});
 head();
}
function qEnd(){
 const a=document.getElementById("app");a.innerHTML="";
 const rate=Q.n?Math.round(Q.right/Q.n*100):0;
 a.appendChild(el('<div class="card"><div class="small">'+Q.title+' 结算</div><div class="big">'+Q.right+' / '+Q.n+'（'+rate+'%）</div><div class="small">最高连击 '+Q.best+' · 当前 Lv.'+lvl()+' '+title()+'</div></div>'));
 if(Q.wrong.length){const w=el('<div class="card"><b>📌 错题回顾（已排入复习队列）</b></div>');
  Q.wrong.forEach(function(x){w.appendChild(el('<div style="margin-top:10px"><div>'+x.q[0]+'</div><div class="small">✅ '+x.q[1][x.q[2]]+'</div><div class="hint">'+x.q[3]+'</div></div>'))});a.appendChild(w)}
 const btns=el('<div class="card"></div>');
 const b1=el('<button class="b">回学院</button>');b1.onclick=function(){view="home";render()};
 const b2=el('<button class="b g">去复习</button>');b2.onclick=function(){view="review";render()};
 btns.appendChild(b1);btns.appendChild(b2);a.appendChild(btns);
 if(Q.after)Q.after({right:Q.right,n:Q.n});
 head();
}

/* ---- 市场实验室 ---- */
let mk=null;
function market(){
 const b=1+Math.floor(Math.random()*4),d=1+Math.floor(Math.random()*4);
 const pe=6+Math.floor(Math.random()*15),qe=30+Math.floor(Math.random()*50);
 mk={b:b,d:d,a:qe+b*pe,c:qe-d*pe,pe:pe,qe:qe,p:pe+(Math.random()<0.5?-4:4),tax:0,done:false};
 mkRender();
}
function mkRender(){
 const a=document.getElementById("app");a.innerHTML="";
 const Qd=Math.max(0,mk.a-mk.b*mk.p),Qs=Math.max(0,mk.c+mk.d*mk.p);
 const gap=Qs-Qd;
 a.appendChild(el('<div class="card"><b>⚖️ 市场均衡实验室</b><div class="small">本局需求 Qd = '+mk.a+' − '+mk.b+'P，供给 Qs = '+mk.c+' + '+mk.d+'P（隐藏均衡待你发现）。移动价格看市场反应。</div></div>'));
 const c=el('<div class="card"><div class="big">价格 P = '+mk.p.toFixed(1)+'</div>'+
  '<div class="kv"><span>需求量 '+Qd.toFixed(1)+'</span><span>供给量 '+Qs.toFixed(1)+'</span><span>'+(Math.abs(gap)<0.5?'≈ 市场清算 ✅':(gap>0?'过剩 '+gap.toFixed(1)+'（价格偏高）':'短缺 '+(-gap).toFixed(1)+'（价格偏低）'))+'</span></div></div>');
 const r=el('<input type="range" min="1" max="40" step="0.5" value="'+mk.p+'">');
 r.oninput=function(){mk.p=parseFloat(r.value);mkRender()};c.appendChild(r);
 a.appendChild(c);
 const g=el('<div class="card"><b>提交你认为的均衡价格</b><div class="small">误差 ≤0.5 得满分奖励。</div></div>');
 const inp=el('<input style="background:#f6f8fa;color:#1f2328;border:1px solid #d0d7de;border-radius:8px;padding:8px;width:120px" placeholder="如 12.5">');
 const sb=el('<button class="b g">提交</button>');
 sb.onclick=function(){const v=parseFloat(inp.value);if(isNaN(v))return toast("请输入数字");
  const err=Math.abs(v-mk.pe);const sc=err<=0.5?100:Math.max(0,Math.round(100-err*12));
  S.sims.mk=Math.max(S.sims.mk||0,sc);addXp(20+Math.round(sc/4));save();checkAch();
  mk.done=true;mkResult(sc,err)};
 g.appendChild(inp);g.appendChild(sb);a.appendChild(g);
 const t=el('<div class="card"><b>🧾 加一道从量税（对卖方征收）</b><div class="small">税额 t = '+mk.tax.toFixed(1)+'</div></div>');
 const tr=el('<input type="range" min="0" max="10" step="0.5" value="'+mk.tax+'">');
 tr.oninput=function(){mk.tax=parseFloat(tr.value);mkRender()};t.appendChild(tr);
 if(mk.tax>0){const Pb=(mk.a-mk.c+mk.d*mk.tax)/(mk.b+mk.d),Ps=Pb-mk.tax,Qn=Math.max(0,mk.a-mk.b*Pb);
  const dwl=0.5*mk.tax*Math.max(0,mk.qe-Qn);
  const buyerShare=(Pb-mk.pe)/mk.tax;
  t.appendChild(el('<div class="kv" style="margin-top:6px"><span>买方支付 '+Pb.toFixed(2)+'</span><span>卖方实收 '+Ps.toFixed(2)+'</span><span>成交量 '+Qn.toFixed(1)+'（原 '+mk.qe+'）</span><span>税收 '+(mk.tax*Qn).toFixed(1)+'</span><span>无谓损失 ≈ '+dwl.toFixed(1)+'</span></div>'+
   '<div class="hint">买方承担了约 '+pct(Math.max(0,Math.min(1,buyerShare)))+' 的税负。谁弹性更小，谁就承担更多——税由谁缴纳并不决定谁真正承担。</div>'));}
 a.appendChild(t);
 const bk=el('<div class="card"></div>');const b1=el('<button class="b o">换一局</button>');b1.onclick=market;
 const b2=el('<button class="b o">返回</button>');b2.onclick=function(){view="sim";render()};
 bk.appendChild(b1);bk.appendChild(b2);a.appendChild(bk);head();
}
function mkResult(sc,err){
 const a=document.getElementById("app");
 a.appendChild(el('<div class="card"><b>结果：'+sc+' 分</b><div class="small">真实均衡 P*='+mk.pe+'，Q*='+mk.qe+'，你的误差 '+err.toFixed(2)+'。</div>'+
 '<div class="hint">解法：令 '+mk.a+'−'+mk.b+'P = '+mk.c+'+'+mk.d+'P → P* = ('+mk.a+'−'+mk.c+')/('+mk.b+'+'+mk.d+') = '+mk.pe+'。价格的唯一工作，就是让人们愿意买的量与愿意卖的量相等。</div></div>'));
}

/* ---- 央行行长 ---- */
let cb=null;
function cbank(){cb={t:1,pi:3+Math.random()*4,y:(Math.random()*3-0.5),loss:0,hist:[],shockNote:""};cbRender()}
function cbRender(){
 const a=document.getElementById("app");a.innerHTML="";
 a.appendChild(el('<div class="card"><b>🏦 央行行长 · 第 '+cb.t+'/8 回合</b><div class="small">目标：通胀 2%、产出缺口 0。损失 = Σ[(π−2)² + 0.5·缺口²]，越低越好。中性实际利率约 1%。</div></div>'));
 a.appendChild(el('<div class="card"><div class="kv"><span class="big">π = '+cb.pi.toFixed(2)+'%</span><span class="big">缺口 = '+cb.y.toFixed(2)+'%</span></div>'+
  '<div class="small">累计损失 '+cb.loss.toFixed(1)+'</div>'+(cb.shockNote?'<div class="hint">'+cb.shockNote+'</div>':'')+
  '<div class="hint">提示（泰勒规则直觉）：名义利率 ≈ π + 1 + 0.5(π−2) + 0.5·缺口。政策有一期时滞，别过度反应也别不作为。</div></div>'));
 const c=el('<div class="card"><b>设定政策名义利率</b><div id="rv" class="big">4.0%</div></div>');
 const r=el('<input type="range" min="0" max="16" step="0.25" value="4">');
 r.oninput=function(){document.getElementById("rv").textContent=parseFloat(r.value).toFixed(2)+"%"};
 const taylor=cb.pi+1+0.5*(cb.pi-2)+0.5*cb.y;
 const b=el('<button class="b g">决策并进入下一回合</button>');
 b.onclick=function(){cbStep(parseFloat(r.value))};
 const b2=el('<button class="b o">按泰勒规则（'+taylor.toFixed(2)+'%）</button>');
 b2.onclick=function(){cbStep(taylor)};
 c.appendChild(r);c.appendChild(b);c.appendChild(b2);a.appendChild(c);
 if(cb.hist.length){const t=el('<div class="card"><b>历史</b><table><tr><th>回合</th><th>利率</th><th>通胀</th><th>缺口</th></tr></table></div>');
  const tb=t.querySelector("table");cb.hist.forEach(function(h){tb.appendChild(el('<tr><td>'+h.t+'</td><td>'+h.r.toFixed(2)+'</td><td>'+h.pi.toFixed(2)+'</td><td>'+h.y.toFixed(2)+'</td></tr>'))});a.appendChild(t)}
 const bk=el('<div class="card"></div>');const bb=el('<button class="b o">放弃返回</button>');bb.onclick=function(){view="sim";render()};bk.appendChild(bb);a.appendChild(bk);head();
}
function cbStep(r){
 const real=r-cb.pi;
 const sh=Math.random();let note="";let eps=(Math.random()-0.5)*1.0,pshock=0;
 if(sh<0.12){eps-=2.2;note="⚠️ 外需骤降：出口订单大幅下滑（需求冲击）。"}
 else if(sh<0.24){pshock+=2.0;eps-=0.6;note="⚠️ 能源价格暴涨：成本推动型通胀（供给冲击，两难时刻）。"}
 else if(sh<0.34){eps+=1.6;note="📈 财政扩张与地产回暖，需求偏热。"}
 const y=0.55*cb.y-0.9*(real-1.0)+eps;
 const pi=0.72*cb.pi+0.28*2+0.35*y+pshock+(Math.random()-0.5)*0.5;
 cb.hist.push({t:cb.t,r:r,pi:pi,y:y});
 cb.loss+=Math.pow(pi-2,2)+0.5*Math.pow(y,2);
 cb.pi=pi;cb.y=y;cb.shockNote=note;cb.t++;
 if(cb.t>8)cbEnd();else cbRender();
}
function cbEnd(){
 const a=document.getElementById("app");a.innerHTML="";
 const L=cb.loss,sc=Math.max(0,Math.round(100-L*1.6));
 S.sims.cb=Math.max(S.sims.cb||0,sc);addXp(25+Math.round(sc/3));save();checkAch();
 let g=L<20?"A · 教科书级软着陆":L<40?"B · 稳健，略有摇摆":L<70?"C · 波动偏大，注意时滞":"D · 政策过度反应或过度迟疑";
 a.appendChild(el('<div class="card"><b>任期结束</b><div class="big">'+sc+' 分（损失 '+L.toFixed(1)+'）· '+g+'</div>'+
 '<div class="hint">复盘要点：①实际利率（i−π）才影响需求；②政策有时滞，看的是未来而非当下；③供给冲击下通胀与产出反向，必须选择优先目标并守住预期锚；④连续大幅调整往往制造新的波动。</div></div>'));
 const t=el('<div class="card"><table><tr><th>回合</th><th>利率</th><th>通胀</th><th>缺口</th></tr></table></div>');
 const tb=t.querySelector("table");cb.hist.forEach(function(h){tb.appendChild(el('<tr><td>'+h.t+'</td><td>'+h.r.toFixed(2)+'</td><td>'+h.pi.toFixed(2)+'</td><td>'+h.y.toFixed(2)+'</td></tr>'))});a.appendChild(t);
 const bk=el('<div class="card"></div>');const b1=el('<button class="b">再来一任</button>');b1.onclick=cbank;
 const b2=el('<button class="b o">返回</button>');b2.onclick=function(){view="sim";render()};bk.appendChild(b1);bk.appendChild(b2);a.appendChild(bk);head();
}

/* ---- 投资生涯 ---- */
const REG=[["繁荣",0.18,0.02,0.03,0.030,0.30],["温和增长",0.09,0.04,0.02,0.021,0.32],["衰退",-0.20,0.09,0.015,0.008,0.20],["高通胀/滞胀",-0.06,-0.03,0.045,0.070,0.18]];
let pf=null;
function folio(){pf={y:1,w:100000,real:100000,cpi:1,peak:100000,dd:0,st:60,bd:30,hist:[]};pfRender()}
function pfRender(){
 const a=document.getElementById("app");a.innerHTML="";
 a.appendChild(el('<div class="card"><b>📈 投资生涯 · 第 '+pf.y+'/20 年</b><div class="small">起始 10 万，每年追加 1 万。宏观情景随机，目标是 20 年后的<b>实际</b>（扣通胀）财富，同时控制最大回撤。</div></div>'));
 a.appendChild(el('<div class="card"><div class="kv"><span class="big">名义 '+fmt(pf.w)+'</span><span class="big">实际 '+fmt(pf.w/pf.cpi)+'</span></div><div class="small">累计通胀 '+pct(pf.cpi-1)+' · 最大回撤 '+pct(pf.dd)+'</div></div>'));
 const c=el('<div class="card"><b>今年配置</b><div id="al" class="kv"></div></div>');
 const rs=el('<input type="range" min="0" max="100" step="5" value="'+pf.st+'">');
 const rb=el('<input type="range" min="0" max="100" step="5" value="'+pf.bd+'">');
 function upd(){pf.st=parseInt(rs.value);pf.bd=Math.min(parseInt(rb.value),100-pf.st);rb.value=pf.bd;
  document.getElementById("al").innerHTML='<span class="pill">股票 '+pf.st+'%</span><span class="pill">债券 '+pf.bd+'%</span><span class="pill">现金 '+(100-pf.st-pf.bd)+'%</span>'}
 rs.oninput=upd;rb.oninput=upd;
 c.appendChild(el('<div class="small">股票比例</div>'));c.appendChild(rs);
 c.appendChild(el('<div class="small">债券比例</div>'));c.appendChild(rb);
 const b=el('<button class="b g">度过这一年 →</button>');b.onclick=pfStep;c.appendChild(b);
 a.appendChild(c);upd();
 if(pf.hist.length){const t=el('<div class="card"><b>历史</b><table><tr><th>年</th><th>情景</th><th>股</th><th>债</th><th>组合</th><th>实际财富</th></tr></table></div>');
  const tb=t.querySelector("table");pf.hist.slice(-10).forEach(function(h){tb.appendChild(el('<tr><td>'+h.y+'</td><td>'+h.r+'</td><td>'+pct(h.s)+'</td><td>'+pct(h.b)+'</td><td>'+pct(h.p)+'</td><td>'+fmt(h.rw)+'</td></tr>'))});a.appendChild(t)}
 const bk=el('<div class="card"></div>');const bb=el('<button class="b o">放弃返回</button>');bb.onclick=function(){view="sim";render()};bk.appendChild(bb);a.appendChild(bk);head();
}
function pfStep(){
 let x=Math.random(),acc=0,R=REG[1];
 for(let i=0;i<REG.length;i++){acc+=REG[i][5];if(x<=acc){R=REG[i];break}}
 const s=R[1]+(Math.random()-0.5)*0.22,b=R[2]+(Math.random()-0.5)*0.05,ca=R[3],inf=R[4]+(Math.random()-0.5)*0.01;
 const ws=pf.st/100,wb=pf.bd/100,wc=1-ws-wb;
 const p=ws*s+wb*b+wc*ca-0.003;
 pf.w=pf.w*(1+p)+10000;pf.cpi*=(1+inf);
 pf.peak=Math.max(pf.peak,pf.w);pf.dd=Math.max(pf.dd,(pf.peak-pf.w)/pf.peak);
 pf.hist.push({y:pf.y,r:R[0],s:s,b:b,p:p,rw:pf.w/pf.cpi});
 pf.y++;if(pf.y>20)pfEnd();else pfRender();
}
function pfEnd(){
 const a=document.getElementById("app");a.innerHTML="";
 const real=pf.w/pf.cpi,invested=100000+10000*20;
 const sc=Math.max(0,Math.round(real/1000-pf.dd*200));
 S.sims.pf=Math.max(S.sims.pf||0,sc);addXp(25+Math.min(60,Math.round(sc/20)));save();checkAch();
 a.appendChild(el('<div class="card"><b>20 年结束</b><div class="big">实际财富 '+fmt(real)+'（累计投入 '+fmt(invested)+'）</div>'+
  '<div class="small">名义 '+fmt(pf.w)+' · 累计通胀 '+pct(pf.cpi-1)+' · 最大回撤 '+pct(pf.dd)+' · 评分 '+sc+'</div>'+
  '<div class="hint">复盘要点：①名义收益骗人，实际（扣通胀）才是购买力；②现金看似安全，长期被通胀慢性侵蚀；③高股票比例期望更高但回撤更深——能否拿住才是真约束；④每年0.3%的费用与摩擦，20年也会吃掉可观终值；⑤加仓（持续投入）与时间是普通人最大的优势。</div></div>'));
 const t=el('<div class="card"><table><tr><th>年</th><th>情景</th><th>组合收益</th><th>实际财富</th></tr></table></div>');
 const tb=t.querySelector("table");pf.hist.forEach(function(h){tb.appendChild(el('<tr><td>'+h.y+'</td><td>'+h.r+'</td><td>'+pct(h.p)+'</td><td>'+fmt(h.rw)+'</td></tr>'))});a.appendChild(t);
 const bk=el('<div class="card"></div>');const b1=el('<button class="b">再活一遍</button>');b1.onclick=folio;
 const b2=el('<button class="b o">返回</button>');b2.onclick=function(){view="sim";render()};bk.appendChild(b1);bk.appendChild(b2);a.appendChild(bk);head();
}

/* ================= 无尽挑战 ================= */
function poolAll(){const out=[];DB.forEach(function(m,i){if(unlocked(i))m.qs.forEach(function(q,j){out.push({key:m.id+":"+j,q:q,mod:m.name})})});return out}
function endless(a){
 const MODS=[["⚡ 极速","每题 12 秒，XP ×1.6",{time:12,mult:1.6}],
 ["💎 高压","只有 1 条命，XP ×2.2",{lives:1,mult:2.2}],
 ["🎯 标准","3 条命，XP ×1.2",{lives:3,mult:1.2}],
 ["🌪️ 混沌","20 秒 + 2 条命，XP ×1.8",{time:20,lives:2,mult:1.8}]];
 a.appendChild(el('<div class="card"><b>♾️ 无尽挑战</b><div class="small">题目从已解锁章节随机抽取并无限续接，直到用完生命。选择一个词条开始（每局题序与选项都会重新随机）。</div></div>'));
 MODS.forEach(function(m){const c=el('<div class="card"><b>'+m[0]+'</b><div class="small">'+m[1]+'</div></div>');
  const b=el('<button class="b r">开始</button>');
  b.onclick=function(){const cfg=m[2];
   quiz({items:shuffle(poolAll()),title:"无尽挑战 "+m[0],xp:12,time:cfg.time||0,lives:cfg.lives||0,mult:cfg.mult,
    endless:true,refill:function(){return shuffle(poolAll())}})};
  c.appendChild(b);a.appendChild(c)});
 a.appendChild(el('<div class="card"><div class="small">当前已解锁题库：'+poolAll().length+' 题。通关更多章节可扩大题池。</div></div>'));
}

/* ================= 毕业大考 ================= */
function graduation(){
 const all=[];DB.forEach(function(m){m.qs.forEach(function(q,j){all.push({key:m.id+":"+j,q:q,mod:m.name})})});
 quiz({items:shuffle(all).slice(0,30),title:"🎓 毕业大考",xp:20,time:40,after:function(r){
  S.grad=Math.max(S.grad,r.right);save();
  if(r.right>=27){ach("a8");addXp(300);toast("🎓 恭喜！资深经济学家认证通过 (+300XP)")}
  else toast("得分 "+r.right+"/30，27 分及格。先回去复习错题再战。");checkAch()}});
}

/* ================= 档案 ================= */
function me(a){
 const done=DB.filter(function(m){return P(m.id).boss>0}).length;
 a.appendChild(el('<div class="card"><b>🎖️ 学习档案</b><div class="big">Lv.'+lvl()+' '+title()+'</div>'+
  '<div class="kv"><span>XP '+S.xp+'</span><span>累计答题 '+S.ans+'</span><span>正确率 '+(S.ans?Math.round(S.right/S.ans*100):0)+'%</span><span>最高连击 '+S.bestCombo+'</span><span>复习次数 '+S.rev+'</span><span>通关章节 '+done+'/10</span><span>大考最好 '+S.grad+'/30</span></div>'+
  (S.ach.indexOf("a8")>=0?'<div class="hint">🎓 已获得「资深经济学家」认证。接下来靠间隔复习与模拟器保持手感。</div>':'')+'</div>'));
 const ac=el('<div class="card"><b>🏆 成就</b></div>');
 ACH.forEach(function(x){const got=S.ach.indexOf(x[0])>=0;
  ac.appendChild(el('<div style="margin-top:6px'+(got?'':';opacity:.45')+'">'+(got?'✅':'🔒')+' <b>'+x[1]+'</b> <span class="small">'+x[2]+'</span></div>'))});
 a.appendChild(ac);
 a.appendChild(el('<div class="card"><b>📅 建议节奏（对抗遗忘的用法）</b><div class="small">1）每天先清「今日复习」；2）再学 1 章知识卡+练习；3）有把握时打 Boss；4）每周至少玩 1 局模拟器；5）十章通关后每周一次无尽挑战 + 大考重刷。坚持 6–8 周即可覆盖本科级经济学与金融学主干。</div></div>'));
 const rs=el('<div class="card"><b>⚙️ 存档</b><div class="small">进度保存在本浏览器本地（localStorage）。清除浏览器数据会丢失。</div></div>');
 const b1=el('<button class="b o">导出存档</button>');
 b1.onclick=function(){const s=JSON.stringify(S);if(navigator.clipboard)navigator.clipboard.writeText(s);prompt("存档 JSON（可手动复制保存）：",s)};
 const b2=el('<button class="b o">导入存档</button>');
 b2.onclick=function(){const s=prompt("粘贴存档 JSON：");if(!s)return;try{const o=JSON.parse(s);if(o&&o.v===1){S=o;save();toast("导入成功");render()}else toast("版本不匹配")}catch(e){toast("格式错误")}};
 const b3=el('<button class="b r">重置全部进度</button>');
 b3.onclick=function(){if(confirm("确定清空所有进度？")){localStorage.removeItem(LS);S={v:1,xp:0,srs:{},prog:{},ach:[],rev:0,ans:0,right:0,bestCombo:0,sims:{},grad:0};render()}};
 rs.appendChild(b1);rs.appendChild(b2);rs.appendChild(b3);a.appendChild(rs);
}

/* ================= 快捷键与启动 ================= */
document.addEventListener("keydown",function(e){
 if(e.key>="1"&&e.key<="4"){const o=document.querySelectorAll(".opt");const i=parseInt(e.key)-1;
  if(o[i]&&!o[i].disabled)o[i].click()}
});
render();
</script>
