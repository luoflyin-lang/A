<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>概率大陆：从零到大师</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--a:#6a4de0;--b:#00a2b8;--bg:#f7f8fc;--bg2:#e6eaf6;--ok:#0f9d6b;--no:#e0415f;--gold:#c07f10;--txt:#232946;--dim:#5d6685;--card:#fffffffff;--line:#d9dce8}
body.ocean{--a:#0090a8;--b:#0da97f;--bg:#f2f9fa;--bg2:#dcefF4}
body.lava{--a:#e05a1f;--b:#d99a10;--bg:#fdf6f2;--bg2:#fbe9dd}
body.aurora{--a:#18a862;--b:#00a2b8;--bg:#f2faf6;--bg2:#dcf3e8}
body{margin:0;padding:0 0 82px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--txt);background:radial-gradient(900px 520px at 15% -8%,var(--bg2),var(--bg)) fixed,var(--bg);min-height:100vh;overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;color:#ffffff;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer;transition:.15s;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.btn:active{transform:scale(.95)}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1,h2,h3{margin:0 0 8px;line-height:1.5}
.dim{color:var(--dim);font-size:13px;line-height:1.75}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:11px;color:var(--dim)}
.stats b{display:block;font-size:16px;color:var(--txt)}
.bar{height:8px;border-radius:99px;background:#e6e8f0;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:.4s}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.nav div{padding:8px 0 12px;text-align:center;font-size:11px;color:var(--dim);cursor:pointer}
.nav div.on{color:var(--b);text-shadow:0 0 12px var(--b)}
.nav div span{display:block;font-size:19px}
.node{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:11px;margin-bottom:9px;cursor:pointer;background:#fffffffff}
.node.lock{opacity:.4}
.node.done{border-color:var(--ok);box-shadow:0 0 16px rgba(15,157,107,.18)}
.node.cur{border-color:var(--b);animation:pulse 1.9s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(0,162,184,0)}50%{box-shadow:0 0 22px rgba(0,162,184,.35)}}
.node .ic{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--a),var(--b))}
.node.lock .ic{background:#e6e8f0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fffffffff;color:var(--txt);font-size:15px;cursor:pointer;line-height:1.6}
.opt.ok{border-color:var(--ok);background:rgba(15,157,107,.12)}
.opt.no{border-color:var(--no);background:rgba(224,65,95,.10)}
input.in{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fffffffff;color:var(--txt);font-size:16px}
.fb{border-radius:14px;padding:12px;margin-top:10px;font-size:14px;line-height:1.8}
.fb.ok{background:rgba(15,157,107,.10);border:1px solid var(--ok)}
.fb.no{background:rgba(224,65,95,.08);border:1px solid var(--no)}
.shake{animation:sk .42s}
@keyframes sk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.combo{position:fixed;right:12px;top:104px;z-index:25;font-size:27px;font-weight:900;color:var(--gold);text-shadow:0 0 14px rgba(192,127,16,.4);pointer-events:none}
.pt{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:60}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin:2px 5px 2px 0}
.tag.on{color:var(--gold);border-color:var(--gold)}
.hp{height:15px;border-radius:99px;background:#e6e8f0;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5f78,#ffd36e);transition:.5s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,93vw);z-index:70;background:var(--bg);border-left:1px solid var(--line);transform:translateX(104%);transition:.3s;overflow:auto;padding:16px}
.drawer.on{transform:none}
.fab{position:fixed;right:14px;bottom:92px;z-index:40;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.cel{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(250,251,254,.93);text-align:center;padding:20px}
.cel h1{font-size:38px;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
canvas{width:100%;background:#fbfcfe;border-radius:14px;border:1px solid var(--line);display:block}
.star{color:var(--gold);letter-spacing:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:90;background:#fffffffff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14px;transition:.3s;opacity:0}
.toast.on{opacity:1;bottom:110px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f{font-family:'Courier New',monospace;font-size:14px;line-height:1.9}
input[type=range]{width:100%}
@media(max-width:520px){.wrap{padding:10px}.cel h1{font-size:30px}}
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="wrap" id="main"></div>
<div class="nav" id="nav"></div>
<div class="fab" onclick="toggleDrawer()">📖</div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<div id="cel"></div>
<div class="combo" id="combo"></div>
<script>
/* ============ 工具 ============ */
const $=s=>document.getElementById(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PK=a=>a[Math.floor(Math.random()*a.length)];
const Cnk=(n,k)=>{if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
const Pnk=(n,k)=>{let r=1;for(let i=0;i<k;i++)r*=(n-i);return r};
const FA=n=>{let r=1;for(let i=2;i<=n;i++)r*=i;return r};
const rd=(x,d)=>{d=(d==null)?4:d;const m=Math.pow(10,d);return Math.round(x*m)/m};
const TD=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const DN=t=>{if(!t)return -9999;const p=t.split('-');return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000)};
const PHI={'0.5':0.6915,'1':0.8413,'1.5':0.9332,'2':0.9772,'2.5':0.9938};

/* ============ 存档 ============ */
const KEY='probland_save_v1';
const DEF={lv:1,xp:0,coins:120,stars:{},wrong:[],streak:0,last:'',tasks:[],tday:'',ach:{},min:{},skin:'neon',skins:['neon'],items:{hint:2,skip:1,revive:1},badges:[],view:'home',st:{corr:0,tot:0,vr:0,bayes:0,mx:0,rev:0,boss:0,sim:{}},dt:{lvl:0,corr:0,combo:0,rev:0,sim:0}};
let S;
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');S=Object.assign({},DEF,o);S.st=Object.assign({},DEF.st,S.st||{});S.st.sim=S.st.sim||{};S.dt=Object.assign({},DEF.dt,S.dt||{});S.items=Object.assign({},DEF.items,S.items||{});}catch(e){S=JSON.parse(JSON.stringify(DEF))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const NEED=lv=>60+lv*25+Math.floor(lv*lv*0.9);
const TT=[[1,'概率学徒'],[4,'掷币见习'],[9,'计数游侠'],[15,'条件术士'],[22,'分布行者'],[30,'期望骑士'],[40,'方差领主'],[50,'极限旅人'],[62,'估计贤者'],[74,'检验祭司'],[86,'统计宗师'],[99,'概率大师']];
const TITLE=lv=>{let t=TT[0][1];for(const x of TT){if(lv>=x[0])t=x[1]}return t};

/* ============ 关卡数据 ============ */
const CON=[
{n:'随机大陆',ic:'🎲',boss:'混沌骰神',badge:'混沌骰徽章 🎲'},
{n:'计数丛林',ic:'🌴',boss:'排列巨蟒',badge:'丛林罗盘 🧭'},
{n:'条件之城',ic:'🏙️',boss:'贝叶斯主教',badge:'先验之钥 🗝️'},
{n:'变量之海',ic:'🌊',boss:'分布海怪',badge:'钟形贝壳 🐚'},
{n:'数字特征峰',ic:'⛰️',boss:'方差巨龙',badge:'期望之冠 👑'},
{n:'推断神殿',ic:'🏛️',boss:'假设检验之神',badge:'真理天平 ⚖️'}];

const LV=[
/* ===== 洲 0 随机大陆 ===== */
{id:1,c:0,ic:'🌱',n:'随机现象与样本空间',teach:'「明天会不会下雨」这种事前说不准、却能反复观察的现象，叫随机现象。把一次试验的所有可能结果装进一个袋子——这袋子就是样本空间 Ω，袋里每颗糖是一个样本点。事件就是从袋里挑出的一小把糖。例：掷一枚骰子，Ω={1,2,3,4,5,6}，事件「点数为偶数」={2,4,6}。',qs:[
()=>{const a=PK([['掷一枚骰子，观察出现的点数',6],['抛一枚硬币两次，记录正反面的序列',4],['抛一枚硬币三次，记录正反面的序列',8],['同时掷两枚可区分的骰子，记录点数对',36],['从写有 1~5 的五张卡片中任取两张（不计顺序）',10],['掷一枚骰子两次，记录点数的有序对',36]]);return{t:'num',q:'试验：'+a[0]+'。<br>样本空间 Ω 中样本点的个数是多少？',a:a[1],sol:'把所有可能结果一一列清即可，'+a[0]+' 的结果总数 = '+a[1]+' 个。',trap:'常见坑：把「事件个数」当成「样本点个数」，或忽略了顺序不同也算不同结果。'}},
()=>({t:'mc',q:'下面哪一个是随机现象？',opts:['太阳从东方升起','标准大气压下纯水加热到 100℃ 沸腾','明天某地是否下雨','两个奇数之和是偶数'],a:2,sol:'随机现象 = 结果不止一种、事前无法确定、但可以重复观察。只有「明天是否下雨」满足。',trap:'必然发生和绝不发生的都属于确定性现象，不是随机现象。'}),
()=>({t:'tf',q:'判断：事件 A 一定是样本空间 Ω 的一个子集。',a:true,sol:'事件就是「若干结果的集合」，所以 A ⊆ Ω。Ω 本身叫必然事件，∅ 叫不可能事件。',trap:'别把事件当成一个数，它是一个集合。'})]},
{id:2,c:0,ic:'🔗',n:'事件的关系与运算',teach:'事件就是集合，运算就是画圈：A∪B = 至少一个发生；A∩B = 同时发生；A−B = A 发生而 B 不发生；Ā = A 不发生。掷骰子时设 A={偶数}、B={点数>3}，则 A∩B={4,6}，A∪B={2,3,4,5,6}，A−B={2}。德摩根定律：A∪B 的对立 = Ā∩B̄。',qs:[
()=>{const k=R(2,4);const A=[2,4,6];const B=[];for(let i=k+1;i<=6;i++)B.push(i);const m=PK(['∪','∩','−']);let s;if(m==='∪')s=A.filter(x=>true).concat(B.filter(x=>A.indexOf(x)<0)).length;else if(m==='∩')s=A.filter(x=>B.indexOf(x)>=0).length;else s=A.filter(x=>B.indexOf(x)<0).length;return{t:'num',q:'掷一枚骰子。A =「点数为偶数」，B =「点数大于 '+k+'」。<br>事件 A '+m+' B 中含有几个样本点？',a:s,sol:'A={2,4,6}，B={'+B.join(',')+'}。按定义逐个筛：'+(m==='∪'?'并集取「出现在任一个里」':(m==='∩'?'交集取「同时在两个里」':'差集取「在 A 但不在 B」'))+'，共 '+s+' 个。',trap:'常见坑：A−B 写成 B−A，或把并集里重复的元素数了两次。'}},
()=>({t:'mc',q:'「A、B 都不发生」应写成哪个式子？',opts:['Ā∪B̄','Ā∩B̄','A∪B 的补集的补集','A−B'],a:1,sol:'都不发生 = Ā 且 B̄ = Ā∩B̄，由德摩根定律它也等于 A∪B 的对立事件。',trap:'Ā∪B̄ 表示的是「至少一个不发生」，也就是 A∩B 的对立事件，别混。'}),
()=>({t:'tf',q:'判断：两个互斥事件一定是对立事件。',a:false,sol:'互斥只要求 A∩B=∅；对立还要求 A∪B=Ω。例如掷骰子的 {1} 与 {2} 互斥但不对立。',trap:'对立 = 互斥 + 必有一个发生，条件更强。'})]},
{id:3,c:0,ic:'🪙',n:'频率与概率',sim:'coin',teach:'抛 10 次硬币出现 7 次正面，频率 0.7 并不代表概率是 0.7。抛的次数越多，频率会越来越贴近一个固定的数——那才是概率。所以概率是频率的「稳定值」。基本性质：0 ≤ P(A) ≤ 1，P(Ω)=1，P(∅)=0。先去下面的实验室亲手抛一千次看看。',qs:[
()=>{const n=PK([50,80,200,400,500]);const m=R(Math.round(n*0.4),Math.round(n*0.6));return{t:'num',q:'某次试验抛硬币 '+n+' 次，其中出现正面 '+m+' 次。<br>「出现正面」这一事件的频率是多少？（保留 4 位小数，可填分数）',a:rd(m/n),sol:'频率 = 发生次数 ÷ 试验总次数 = '+m+' / '+n+' = '+rd(m/n)+'。',trap:'常见坑：把频率和概率当成同一个东西。频率是实测值，会波动；概率是它的稳定极限值。'}},
()=>({t:'mc',q:'关于频率与概率，正确的说法是：',opts:['抛 10 次硬币必有 5 次正面','试验次数越多，频率越会稳定在概率附近','频率一定等于概率','概率会随试验次数改变'],a:1,sol:'这正是频率稳定性（后面大数定律会严格证明）：n 越大，频率越向概率靠拢。概率本身是客观固定的。',trap:'「概率 0.5」不承诺任何一次有限试验的结果，它只约束长期趋势。'}),
()=>({t:'num',q:'已知 P(A)=0.62，则对立事件 P(Ā) 等于多少？',a:0.38,sol:'P(Ā) = 1 − P(A) = 1 − 0.62 = 0.38。',trap:'常见坑：把 1−P(A) 写成 P(A)−1，得到负概率——概率永远在 0 到 1 之间。'})]},
{id:4,c:0,ic:'➕',n:'概率的加法公式',teach:'算「至少一个发生」时，把两块面积直接相加会把重叠部分算两次，所以要减掉：P(A∪B)=P(A)+P(B)−P(AB)。若 A、B 互斥则 P(AB)=0，可直接相加。另外两个常用武器：P(Ā)=1−P(A)，P(A−B)=P(A)−P(AB)。',qs:[
()=>{const a=R(30,55)/100,b=R(25,45)/100,c=R(8,20)/100;return{t:'num',q:'已知 P(A)='+a+'，P(B)='+b+'，P(AB)='+c+'。<br>求 P(A∪B)。（4 位小数）',a:rd(a+b-c),sol:'P(A∪B)=P(A)+P(B)−P(AB) = '+a+' + '+b+' − '+c+' = '+rd(a+b-c)+'。减去 P(AB) 是因为重叠部分被算了两次。',trap:'常见坑：忘记减 P(AB)，把互斥情形的公式硬套到一般情形上。'}},
()=>{const a=R(40,70)/100,c=R(10,25)/100;return{t:'num',q:'已知 P(A)='+a+'，P(AB)='+c+'。<br>求 P(A−B)，即「A 发生而 B 不发生」的概率。（4 位小数）',a:rd(a-c),sol:'A 被 B 切成两块：A = (A−B) ∪ AB，且两块互斥，所以 P(A−B)=P(A)−P(AB) = '+rd(a-c)+'。',trap:'常见坑：写成 P(A)−P(B)。只能减去两者重叠的那一块。'}},
()=>({t:'tf',q:'判断：对任意两个事件，总有 P(A∪B) ≤ P(A)+P(B)。',a:true,sol:'因为 P(A∪B)=P(A)+P(B)−P(AB) 且 P(AB) ≥ 0，所以并的概率不会超过两者之和，互斥时取等号。',trap:'这条不等式恒成立，无需任何独立性或互斥假设。'})]},
/* ===== 洲 1 计数丛林 ===== */
{id:5,c:1,ic:'🧮',n:'加法原理与乘法原理',teach:'分类用加法，分步用乘法。从家到公司：地铁 3 条线路、公交 2 条线路，任选其一 → 3+2=5 种（分类，加法）。若必须先坐地铁 3 种再换单车 2 种 → 3×2=6 种（分步，乘法）。口诀：「或」用加，「先…再…」用乘。',qs:[
()=>{const m=R(3,7),n=R(2,6);return{t:'num',q:'衣柜里有 '+m+' 件上衣和 '+n+' 条裤子，各选一件搭配成一套。<br>共有多少种不同的搭配？',a:m*n,sol:'搭配需要两步完成：先选上衣（'+m+' 种），再选裤子（'+n+' 种），分步相乘 = '+m*n+' 种。',trap:'常见坑：看到「各选一件」误用加法。判断标准是「必须两步都做」→ 乘法。'}},
()=>{const m=R(3,8),n=R(2,7);return{t:'num',q:'书架上有 '+m+' 本数学书和 '+n+' 本物理书，从中任取一本。<br>共有多少种不同的取法？',a:m+n,sol:'一次只取一本，要么取数学书（'+m+' 种）要么取物理书（'+n+' 种），两类互不重叠，分类相加 = '+(m+n)+' 种。',trap:'常见坑：套用乘法。这里只做「一步」，只是这一步有两类做法。'}},
()=>({t:'mc',q:'密码由 3 位数字组成（每位 0–9 可重复）。共有多少种？',opts:['30','720','1000','999'],a:2,sol:'分三步，每步 10 种选择且可重复：10×10×10 = 1000 种。',trap:'常见坑：误按「不可重复」算成 10×9×8=720。看清题目是否允许重复。'})]},
{id:6,c:1,ic:'🔢',n:'排列',teach:'排列 = 挑出来还要排队，顺序不同算不同方案。从 n 个里取 k 个排成一行：A(n,k)=n(n−1)…(n−k+1)。例：5 人选 3 人排前三名 = 5×4×3 = 60。全部排完 A(n,n)=n!。看到「名次、座位、密码、先后顺序」就是排列。',qs:[
()=>{const n=R(5,9),k=R(2,3);return{t:'num',q:'从 '+n+' 名同学中选 '+k+' 人，分别担任班长、'+(k===2?'学习委员':'学习委员、体育委员')+'（职务不同）。<br>共有多少种安排方式？',a:Pnk(n,k),sol:'职务不同 → 有顺序 → 排列。A('+n+','+k+') = '+Array.from({length:k},(_,i)=>n-i).join('×')+' = '+Pnk(n,k)+'。',trap:'常见坑：用组合 C(n,k) 算，漏掉了「谁当什么职务」的顺序差异。'}},
()=>{const n=R(4,6);return{t:'num',q:''+n+' 个人排成一排照相，共有多少种不同的排法？',a:FA(n),sol:'全排列 A(n,n)=n! = '+Array.from({length:n},(_,i)=>n-i).join('×')+' = '+FA(n)+'。',trap:'常见坑：把 n! 记成 n×n。阶乘是从 n 一直乘到 1。'}},
()=>{const n=R(4,6);return{t:'num',q:''+n+' 个人排成一排，其中甲必须站在最左端。<br>共有多少种排法？',a:FA(n-1),sol:'甲的位置被固定（1 种），剩下 '+(n-1)+' 人全排列 = '+(n-1)+'! = '+FA(n-1)+' 种。',trap:'常见坑：忘记先处理「特殊元素」。有限制的元素要优先安排。'}}]},
{id:7,c:1,ic:'🎯',n:'组合',teach:'组合 = 只挑不排，顺序无关。C(n,k)=A(n,k)/k! = n!/(k!(n−k)!)。例：5 人选 3 人组成小组 = 60/6 = 10。对称性：C(n,k)=C(n,n−k)。看到「小组、代表、取球、握手、连线」就是组合。',qs:[
()=>{const n=R(5,10),k=R(2,3);return{t:'num',q:'从 '+n+' 名同学中选 '+k+' 人组成一个小组（不分职务）。<br>共有多少种选法？',a:Cnk(n,k),sol:'不分职务 → 无顺序 → 组合。C('+n+','+k+') = A('+n+','+k+')/'+k+'! = '+Pnk(n,k)+'/'+FA(k)+' = '+Cnk(n,k)+'。',trap:'常见坑：用排列算，导致每个小组被重复计了 k! 次。'}},
()=>{const a=R(4,7),b=R(3,6),x=R(1,2),y=R(1,2);return{t:'num',q:'某班有 '+a+' 名男生、'+b+' 名女生，要选出 '+x+' 名男生和 '+y+' 名女生参加活动。<br>共有多少种选法？',a:Cnk(a,x)*Cnk(b,y),sol:'分两步且每步都是组合：C('+a+','+x+')×C('+b+','+y+') = '+Cnk(a,x)+'×'+Cnk(b,y)+' = '+Cnk(a,x)*Cnk(b,y)+'。',trap:'常见坑：把两个组合数相加。男生女生都要选，是分步，用乘法。'}},
()=>({t:'tf',q:'判断：C(10,3) 与 C(10,7) 的值相等。',a:true,sol:'C(n,k)=C(n,n−k)：从 10 个里挑 3 个留下，等价于挑 7 个丢掉，方案一一对应，都等于 120。',trap:'算大数时优先用小的那个 k，能省很多计算。'})]},
{id:8,c:1,ic:'⚪',n:'古典概型',teach:'当样本点有限且等可能时，P(A) = A 的样本点数 ÷ Ω 的样本点数。关键是分子分母必须用同一种数法（都算顺序或都不算）。例：5 白 3 黑取 2 球，恰好 1 白 1 黑 = C(5,1)C(3,1)/C(8,2) = 15/28。',qs:[
()=>{const w=R(3,6),bl=R(2,5),k=2,j=1;const p=Cnk(w,j)*Cnk(bl,k-j)/Cnk(w+bl,k);return{t:'num',q:'袋中有 '+w+' 个白球、'+bl+' 个黑球，一次任取 2 个球。<br>求恰好 1 白 1 黑的概率。（4 位小数，可填分数）',a:rd(p),sol:'总数 C('+(w+bl)+',2)='+Cnk(w+bl,2)+'；有利 C('+w+',1)×C('+bl+',1)='+Cnk(w,1)*Cnk(bl,1)+'。概率 = '+Cnk(w,1)*Cnk(bl,1)+'/'+Cnk(w+bl,2)+' = '+rd(p)+'。',trap:'常见坑：分子按有顺序数、分母按无顺序数，两边口径不一致。'}},
()=>{const s=R(4,10);let c=0;for(let i=1;i<=6;i++)for(let j2=1;j2<=6;j2++)if(i+j2===s)c++;return{t:'num',q:'同时掷两枚均匀骰子，求点数之和等于 '+s+' 的概率。（4 位小数，可填分数）',a:rd(c/36),sol:'样本空间是 36 个有序点数对；和为 '+s+' 的组合共 '+c+' 种，故概率 = '+c+'/36 = '+rd(c/36)+'。',trap:'常见坑：把两枚骰子当成不可区分，只数出 21 种，破坏了等可能性。'}},
()=>{const n=R(3,5);const p=1-FA(n)/Math.pow(n,n)*0;return{t:'mc',q:'古典概型成立的前提是：',opts:['样本点个数无限','各样本点发生的可能性相等且有限','事件必须互斥','概率必须大于 0.5'],a:1,sol:'古典概型要求样本空间有限且每个样本点等可能，才能用「数个数」的方式算概率。',trap:'不等可能时硬用比例法就会出错，这时需要几何概型或一般概率模型。'}}]},
{id:9,c:1,ic:'📏',n:'几何概型',teach:'样本点无限但「均匀铺满」一段长度或一块面积时，概率 = 有利区域度量 ÷ 总区域度量。例：公交每 10 分钟一班，你随机到站，等待不超过 3 分钟的概率 = 3/10。诀窍：先把问题画成一条线段或一块平面区域。',qs:[
()=>{const T=PK([10,12,15,20]),t=R(2,T-3);return{t:'num',q:'某路公交车每 '+T+' 分钟发一班，乘客随机时刻到站。<br>求候车时间不超过 '+t+' 分钟的概率。（4 位小数，可填分数）',a:rd(t/T),sol:'把一个发车间隔看成长度为 '+T+' 的线段，有利区间长度为 '+t+'，概率 = '+t+'/'+T+' = '+rd(t/T)+'。',trap:'常见坑：数「几种情况」。连续型问题必须比长度/面积，不能数个数。'}},
()=>{const L=PK([1,2,4,5,10]);const a=rd(L*R(20,40)/100,2),b=rd(a+L*R(20,40)/100,2);return{t:'num',q:'在区间 [0, '+L+'] 上随机取一点 X，求 X 落在 ['+a+', '+b+'] 内的概率。（4 位小数）',a:rd((b-a)/L),sol:'概率 = 有利区间长度 ÷ 总长度 = ('+b+'−'+a+')/'+L+' = '+rd((b-a)/L)+'。',trap:'常见坑：忘记除以总长度，或把端点是否包含当成会影响概率——单点概率为 0，不影响。'}},
()=>({t:'tf',q:'判断：几何概型中，某个特定单点被取到的概率为 0，但这个点并非不可能发生。',a:true,sol:'连续型场合单点长度为 0，概率为 0；但它确实可能被取到。所以「概率为 0」不等于「不可能」。',trap:'这是连续型与离散型最大的思维差异，后面学密度函数时会反复用到。'})]},
/* ===== 洲 2 条件之城 ===== */
{id:10,c:2,ic:'🚪',n:'条件概率',teach:'「已知 B 发生」= 把世界缩小到 B 里重新算比例：P(A|B)=P(AB)/P(B)（要求 P(B)>0）。例：掷骰子，已知点数为偶数（B={2,4,6}），求它大于 3 的概率 = |{4,6}|/|{2,4,6}| = 2/3，比无条件的 1/2 更大——因为分母变小了。',qs:[
()=>{const k=R(2,4);const B=[2,4,6];const AB=B.filter(x=>x>k);return{t:'num',q:'掷一枚均匀骰子，已知出现的点数为偶数。<br>求此时点数大于 '+k+' 的概率。（4 位小数，可填分数）',a:rd(AB.length/3),sol:'缩小样本空间到 B={2,4,6}（3 个），其中大于 '+k+' 的有 {'+AB.join(',')+'}（'+AB.length+' 个），概率 = '+AB.length+'/3 = '+rd(AB.length/3)+'。',trap:'常见坑：分母仍用 6。已知条件发生后，分母必须换成条件事件的规模。'}},
()=>{const ab=R(10,25)/100,b=R(35,60)/100;return{t:'num',q:'已知 P(AB)='+ab+'，P(B)='+b+'。<br>求 P(A|B)。（4 位小数）',a:rd(ab/b),sol:'P(A|B)=P(AB)/P(B) = '+ab+'/'+b+' = '+rd(ab/b)+'。',trap:'常见坑：分子分母写反成 P(B)/P(AB)，或除以 P(A)。竖线后面的那个才是分母。'}},
()=>({t:'tf',q:'判断：一般来说 P(A|B) 与 P(B|A) 是同一个数。',a:false,sol:'两者分母不同：P(A|B)=P(AB)/P(B)，P(B|A)=P(AB)/P(A)。只有 P(A)=P(B) 时才相等。混淆这两者就是著名的「基础比率谬误」。',trap:'例：「下雨时地湿」概率接近 1，但「地湿时下雨」概率远小于 1。'})]},
{id:11,c:2,ic:'✖️',n:'乘法公式与不放回抽样',teach:'把条件概率反过来乘：P(AB)=P(B)·P(A|B)=P(A)·P(B|A)。多步抽取就一步一步乘。不放回从 5 白 3 黑中连抽 2 个都是白：(5/8)×(4/7)=5/14。注意第二步的分子分母都变小了——这就是「不放回」的全部秘密。',qs:[
()=>{const w=R(4,7),bl=R(2,5),N=w+bl;const p=w/N*(w-1)/(N-1);return{t:'num',q:'袋中 '+w+' 白 '+bl+' 黑，不放回地连续取两个球。<br>求两球都是白球的概率。（4 位小数，可填分数）',a:rd(p),sol:'P = P(第一次白)×P(第二次白 | 第一次白) = ('+w+'/'+N+')×('+(w-1)+'/'+(N-1)+') = '+rd(p)+'。',trap:'常见坑：第二步仍用 '+w+'/'+N+'（那是有放回的算法）。不放回时总数和白球数都要各减 1。'}},
()=>{const w=R(4,7),bl=R(3,6),N=w+bl;const p=w/N*bl/(N-1)*2;return{t:'num',q:'袋中 '+w+' 白 '+bl+' 黑，不放回取两球。<br>求「一白一黑」的概率。（4 位小数，可填分数）',a:rd(p),sol:'两种顺序都算：先白后黑 ('+w+'/'+N+')('+bl+'/'+(N-1)+') 加上先黑后白 ('+bl+'/'+N+')('+w+'/'+(N-1)+')，合计 = '+rd(p)+'。',trap:'常见坑：只算了一种顺序，答案正好差一半。'}},
()=>({t:'mc',q:'P(ABC) 的正确展开是：',opts:['P(A)P(B)P(C)','P(A)P(B|A)P(C|AB)','P(A|BC)P(B)P(C)','P(A)+P(B|A)+P(C|AB)'],a:1,sol:'链式法则：一步一步条件下去，P(ABC)=P(A)P(B|A)P(C|AB)。只有相互独立时才能写成概率直接相乘。',trap:'不加独立性假设就把概率乘起来，是最常见的错误来源。'})]},
{id:12,c:2,ic:'🌐',n:'全概率公式',teach:'当结果的「来源」不止一种时，先分类、再加权求和：P(B)=Σ P(Aᵢ)P(B|Aᵢ)，其中 Aᵢ 要不重不漏（完备事件组）。例：甲机器产量 60% 次品率 2%，乙机器 40% 次品率 5%，随机取一件是次品的概率 = 0.6×0.02+0.4×0.05 = 0.032。口诀：由因求果。',qs:[
()=>{const a=R(40,70)/100,b=rd(1-a,2);const d1=R(1,4)/100,d2=R(3,8)/100;const p=a*d1+b*d2;return{t:'num',q:'某车间甲机器生产 '+rd(a*100,0)+'% 的零件，次品率 '+rd(d1*100,0)+'%；乙机器生产 '+rd(b*100,0)+'%，次品率 '+rd(d2*100,0)+'%。<br>随机抽取一件，求它是次品的概率。（4 位小数）',a:rd(p),sol:'全概率：P(次品)='+a+'×'+d1+' + '+b+'×'+d2+' = '+rd(p)+'。相当于对两条来路的次品率做加权平均。',trap:'常见坑：直接把两个次品率平均。必须用各自的产量比例作权重。'}},
()=>{const p1=R(30,50)/100,p2=rd(1-p1,2);const h1=R(60,90)/100,h2=R(20,50)/100;const p=p1*h1+p2*h2;return{t:'num',q:'某射击队甲选手占 '+rd(p1*100,0)+'%，命中率 '+h1+'；乙选手占 '+rd(p2*100,0)+'%，命中率 '+h2+'。<br>随机派一人射击一次，求命中的概率。（4 位小数）',a:rd(p),sol:'P(命中) = '+p1+'×'+h1+' + '+p2+'×'+h2+' = '+rd(p)+'。',trap:'常见坑：权重与条件概率配错位置（用甲的比例乘乙的命中率）。列一张小表能避免。'}},
()=>({t:'mc',q:'使用全概率公式时，划分出的 A₁,A₂,…,Aₙ 必须满足：',opts:['两两互斥且并起来是 Ω','彼此独立','概率都相等','都包含事件 B'],a:0,sol:'需要「完备事件组」：不重（两两互斥）不漏（并为 Ω），这样每个样本点恰好被算一次。',trap:'漏掉一类会算少，重复计一类会算多——这是全概率题最常见的失分点。'})]},
{id:13,c:2,ic:'🔮',n:'贝叶斯公式',sim:'monty',teach:'由果反推因：P(Aᵢ|B) = P(Aᵢ)P(B|Aᵢ) / Σ P(Aⱼ)P(B|Aⱼ)。检测阳性并不等于真有病——病很罕见时，大量健康人中的少数误诊会淹没真患者。先验 × 似然 → 后验，这就是理性更新信念的方式。下面用蒙提霍尔实验亲手感受一次。',qs:[
()=>{const pr=PK([0.005,0.01,0.02]);const se=PK([0.95,0.98,0.99]);const fp=PK([0.02,0.05,0.1]);const num=pr*se,den=pr*se+(1-pr)*fp;return{t:'num',q:'某疾病患病率 '+pr+'。检测的灵敏度为 '+se+'（患者中检出阳性的比例），健康人的误报率为 '+fp+'。<br>某人检测为阳性，求他真的患病的概率。（4 位小数）',a:rd(num/den),sol:'先算阳性总概率（全概率）：'+pr+'×'+se+' + '+rd(1-pr,3)+'×'+fp+' = '+rd(den,6)+'；再取真患者那一份：'+rd(num,6)+'/'+rd(den,6)+' = '+rd(num/den)+'。',trap:'常见坑：直接把灵敏度当作「阳性即患病」的概率。忽略了患病率极低这个先验。'}},
()=>{const a=R(40,70)/100,b=rd(1-a,2);const d1=R(1,4)/100,d2=R(4,9)/100;const den=a*d1+b*d2;return{t:'num',q:'甲机器生产 '+rd(a*100,0)+'% 零件次品率 '+rd(d1*100,0)+'%，乙机器生产 '+rd(b*100,0)+'% 次品率 '+rd(d2*100,0)+'%。<br>现取到一件次品，求它来自甲机器的概率。（4 位小数）',a:rd(a*d1/den),sol:'分母是次品总概率 '+rd(den,6)+'（全概率），分子是甲造成的次品 '+rd(a*d1,6)+'。后验 = '+rd(a*d1/den)+'。',trap:'常见坑：把答案写成甲的产量比例。看到「已知结果，问原因」就要用贝叶斯。'}},
()=>({t:'mc',q:'蒙提霍尔问题中，三门一奖，你选一门后主持人打开另一扇空门，此时：',opts:['换与不换都是 1/2','换门中奖概率 2/3，应该换','不换更好，概率 2/3','信息没有变化，概率仍是 1/3'],a:1,sol:'不换 = 你一开始就猜对（1/3）；换 = 你一开始猜错（2/3）。主持人「必开空门」的行为泄露了信息，所以换门胜率 2/3。',trap:'常见坑：以为剩两扇门就一定五五开。前提是主持人知情且必定开空门。'})]},
{id:14,c:2,ic:'🧩',n:'事件的独立性',teach:'独立 = 知道 B 发生对 A 的概率毫无影响：P(A|B)=P(A)，等价于 P(AB)=P(A)P(B)。此时 P(A∪B)=P(A)+P(B)−P(A)P(B)，「至少一个发生」也常用 1−P(Ā)P(B̄)。切记：互斥 ≠ 独立！互斥是你死我活（强相关），独立是互不打扰。',qs:[
()=>{const a=R(30,70)/100,b=R(30,70)/100;return{t:'num',q:'A、B 相互独立，P(A)='+a+'，P(B)='+b+'。<br>求 P(A∪B)。（4 位小数）',a:rd(a+b-a*b),sol:'独立时 P(AB)=P(A)P(B)='+rd(a*b,4)+'，故 P(A∪B)='+a+'+'+b+'−'+rd(a*b,4)+' = '+rd(a+b-a*b)+'。也可用 1−'+rd(1-a,2)+'×'+rd(1-b,2)+'。',trap:'常见坑：把独立当互斥，直接相加。互斥与独立是两回事。'}},
()=>{const a=R(60,90)/100,b=R(50,85)/100;return{t:'num',q:'甲、乙两人独立射击，命中率分别为 '+a+' 和 '+b+'。<br>求目标至少被命中一次的概率。（4 位小数）',a:rd(1-(1-a)*(1-b)),sol:'正难则反：都不中的概率 = '+rd(1-a,2)+'×'+rd(1-b,2)+' = '+rd((1-a)*(1-b),4)+'，故至少一次 = 1 − 该值 = '+rd(1-(1-a)*(1-b))+'。',trap:'常见坑：把两个命中率相加，结果可能超过 1。「至少一个」优先用对立事件。'}},
()=>({t:'tf',q:'判断：若 P(A)>0、P(B)>0 且 A、B 互斥，则 A、B 一定不独立。',a:true,sol:'互斥时 P(AB)=0，而独立要求 P(AB)=P(A)P(B)>0，矛盾。所以两个正概率的互斥事件必不独立。',trap:'互斥是「你发生我就一定不发生」，信息量极大，绝不是互不影响。'})]},
/* ===== 洲 3 变量之海 ===== */
{id:15,c:3,ic:'🎰',n:'随机变量与分布',teach:'随机变量就是把结果翻译成数字的机器。抛两枚硬币，记 X = 正面个数 ∈ {0,1,2}。分布律列出每个取值的概率，所有概率之和必须 = 1。分布函数 F(x)=P(X ≤ x) 是从左往右不断累加的阶梓：单调不减、右连续，F(−∞)=0，F(+∞)=1。',qs:[
()=>{const n=R(3,5);const tot=n*(n+1)/2;return{t:'num',q:'随机变量 X 只取 1,2,…,'+n+'，且 P(X=k) = c·k。<br>求常数 c。（4 位小数，可填分数）',a:rd(1/tot),sol:'概率之和为 1：c(1+2+…+'+n+') = c×'+tot+' = 1，所以 c = 1/'+tot+' = '+rd(1/tot)+'。',trap:'常见坑：忘记「概率之和=1」这个归一条件——它是求待定常数的唯一入口。'}},
()=>{const p1=R(1,3)/10,p2=R(2,4)/10;const p3=rd(1-p1-p2,4);return{t:'num',q:'X 的分布律为：P(X=0)='+rd(p1,2)+'，P(X=1)='+rd(p2,2)+'，P(X=2)='+p3+'。<br>求分布函数值 F(1) = P(X ≤ 1)。（4 位小数）',a:rd(p1+p2),sol:'F(1) 把所有 ≤ 1 的取值概率累加：'+rd(p1,2)+' + '+rd(p2,2)+' = '+rd(p1+p2)+'。',trap:'常见坑：把 F(1) 算成 P(X=1)。分布函数是累加值，不是单点概率。'}},
()=>({t:'tf',q:'判断：任意分布函数 F(x) 都是单调不减的，且取值范围在 [0,1]。',a:true,sol:'F(x)=P(X ≤ x) 是累加概率，x 变大时只会累加更多概率，所以单调不减；它本身是概率，因此在 0 到 1 之间。',trap:'还要记住两个极限：F(−∞)=0，F(+∞)=1，以及右连续性。'})]},
{id:16,c:3,ic:'🎯',n:'二项分布 B(n,p)',teach:'同一件事独立重复 n 次，每次成功率 p，成功次数 X ~ B(n,p)：P(X=k)=C(n,k)pᵏ(1−p)ⁿ⁻ᵏ。E(X)=np，D(X)=np(1−p)。例：投篮 5 次命中率 0.6，恰好命中 3 次 = C(5,3)×0.6³×0.4² ≈ 0.3456。关键词：n 固定、只有成败、彼此独立。',qs:[
()=>{const n=R(4,6),k=R(1,3),p=PK([0.3,0.4,0.5,0.6,0.7]);const v=Cnk(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k);return{t:'num',q:'X ~ B('+n+', '+p+')。<br>求 P(X = '+k+')。（4 位小数）',a:rd(v),sol:'P(X='+k+') = C('+n+','+k+')×'+p+'^'+k+'×'+rd(1-p,1)+'^'+(n-k)+' = '+Cnk(n,k)+'×'+rd(Math.pow(p,k),6)+'×'+rd(Math.pow(1-p,n-k),6)+' = '+rd(v)+'。',trap:'常见坑：忘乘组合数 C(n,k)（漏掉了「哪几次成功」的位置选择），或把指数 n−k 写成 n。'}},
()=>{const n=PK([10,20,50,100]),p=PK([0.2,0.3,0.4,0.5]);const which=PK(['E','D']);return{t:'num',q:'X ~ B('+n+', '+p+')。<br>求 '+(which==='E'?'期望 E(X)':'方差 D(X)')+'。（4 位小数）',a:which==='E'?rd(n*p):rd(n*p*(1-p)),sol:which==='E'?('E(X)=np = '+n+'×'+p+' = '+rd(n*p)+'。'):('D(X)=np(1−p) = '+n+'×'+p+'×'+rd(1-p,2)+' = '+rd(n*p*(1-p))+'。'),trap:'常见坑：把方差写成 np。方差多一个 (1−p) 因子，且 p=0.5 时方差最大。'}},
()=>({t:'mc',q:'下列哪个场景可以用二项分布建模？',opts:['不放回地从 10 个产品中取 3 个的次品数','独立投篮 20 次的命中次数','等待第一次成功所需的次数','单位时间内电话接入次数'],a:1,sol:'二项分布需要：次数 n 固定、每次只有成败、成功率不变、各次独立。只有独立投篮 20 次满足。',trap:'不放回抽样是超几何分布；等待首次成功是几何分布；单位时间计数是泊松分布。'})]},
{id:17,c:3,ic:'📞',n:'泊松分布与几何分布',teach:'泊松管「单位时间内发生了几次」：P(X=k)=λᵏe⁻λ/k!，E(X)=D(X)=λ。例：每小时平均 3 通电话，某小时恰好 2 通 = 3²e⁻³/2! ≈ 0.2240。几何分布管「第几次才首次成功」：P(X=k)=(1−p)ᵏ⁻¹p，E(X)=1/p。',qs:[
()=>{const l=PK([1,2,3,4]),k=R(0,3);const v=Math.pow(l,k)*Math.exp(-l)/FA(k);return{t:'num',q:'某服务台单位时间内接到的呼叫次数 X ~ P('+l+')。<br>求 P(X = '+k+')。（4 位小数，可用 e ≈ 2.71828）',a:rd(v),sol:'P(X=k)=λᵏe⁻λ/k! = '+l+'^'+k+'·e^−'+l+'/'+k+'! = '+rd(Math.pow(l,k),4)+'×'+rd(Math.exp(-l),6)+'/'+FA(k)+' = '+rd(v)+'。',trap:'常见坑：忘除 k!，或把 e⁻λ 写成 eλ。注意 0! = 1。'}},
()=>{const p=PK([0.2,0.25,0.3,0.4,0.5]),k=R(2,4);const v=Math.pow(1-p,k-1)*p;return{t:'num',q:'每次试验成功率为 '+p+'，各次独立，记 X 为首次成功所需的试验次数。<br>求 P(X = '+k+')。（4 位小数）',a:rd(v),sol:'前 '+(k-1)+' 次均失败、第 '+k+' 次成功：P = '+rd(1-p,2)+'^'+(k-1)+'×'+p+' = '+rd(v)+'。',trap:'常见坑：指数写成 k 而不是 k−1。前面只有 k−1 次失败。'}},
()=>({t:'mc',q:'关于泊松分布 P(λ)，下列正确的是：',opts:['E(X)=λ，D(X)=λ²','E(X)=D(X)=λ','E(X)=1/λ','E(X)=λ，D(X)=√λ'],a:1,sol:'泊松分布的期望与方差相等，都等于 λ——这是它最鲜明的特征，也常用于判断数据是否符合泊松假设。',trap:'1/λ 是指数分布的期望，别与泊松混淆。'})]},
{id:18,c:3,ic:'⏳',n:'均匀分布与指数分布',teach:'连续型用密度 f(x)，概率 = 曲线下的面积，P(X=a)=0。均匀 U(a,b)：密度是平的，落在子区间的概率 = 子区间长/(b−a)。指数 E(λ)：P(X>t)=e⁻λᵗ，E(X)=1/λ，且「无记忆」——已经等了 10 分钟，再等 5 分钟的概率和刚开始等一样。',qs:[
()=>{const l=PK([0.2,0.25,0.5,1,2]),t=R(1,4);const v=Math.exp(-l*t);return{t:'num',q:'某元件寿命 X ~ 指数分布 E('+l+')（单位：年）。<br>求 P(X > '+t+')。（4 位小数）',a:rd(v),sol:'指数分布的生存函数 P(X>t)=e^(−λt) = e^(−'+l+'×'+t+') = e^(−'+rd(l*t,3)+') = '+rd(v)+'。',trap:'常见坑：把 P(X>t) 写成 1−e⁻λᵗ（那是 P(X ≤ t)）。看清不等号方向。'}},
()=>{const a=R(0,3),b=a+R(3,7);const c=R(a+1,b-1);return{t:'num',q:'X ~ U('+a+', '+b+')。<br>求 P(X > '+c+')。（4 位小数，可填分数）',a:rd((b-c)/(b-a)),sol:'均匀分布比长度：('+b+'−'+c+')/('+b+'−'+a+') = '+(b-c)+'/'+(b-a)+' = '+rd((b-c)/(b-a))+'。',trap:'常见坑：分母用 b 而不是 b−a。区间不从 0 开始时特别易错。'}},
()=>({t:'tf',q:'判断：指数分布具有无记忆性，即 P(X > s+t | X > s) = P(X > t)。',a:true,sol:'代入定义：e^(−λ(s+t))/e^(−λs) = e^(−λt)。所以元件「不会衰老」，已经用了多久对未来没有影响。',trap:'无记忆性是指数分布（连续）与几何分布（离散）的专属标志，其他分布没有。'})]},
{id:19,c:3,ic:'🔔',n:'正态分布 N(μ,σ²)',sim:'normal',teach:'正态曲线是一座对称的钟：中心是 μ（决定位置），σ 决定胖瘦（越大越矮胖）。标准化 Z=(X−μ)/σ ~ N(0,1)，任何正态问题都能查同一张 Φ 表。经验法则：μ±σ 约 68.3%，μ±2σ 约 95.4%，μ±3σ 约 99.7%。去下面拖动滑块看看。',qs:[
()=>{const mu=PK([10,20,50,100]),sg=PK([2,4,5,10]);const k=PK([0.5,1,1.5,2,2.5]);const v=PHI[''+k];return{t:'num',q:'X ~ N('+mu+', '+sg+'²)。已知 Φ(0.5)=0.6915，Φ(1)=0.8413，Φ(1.5)=0.9332，Φ(2)=0.9772，Φ(2.5)=0.9938。<br>求 P(X < '+rd(mu+k*sg,2)+')。（4 位小数）',a:v,sol:'先标准化：Z=(X−μ)/σ = ('+rd(mu+k*sg,2)+'−'+mu+')/'+sg+' = '+k+'，所以概率 = Φ('+k+') = '+v+'。',trap:'常见坑：忘除 σ（只减 μ）。标准化必须「先减均值、再除标准差」两步都做。'}},
()=>{const mu=PK([0,5,30,60]),sg=PK([2,3,5]);const k=PK([1,1.5,2]);const v=rd(2*PHI[''+k]-1);return{t:'num',q:'X ~ N('+mu+', '+sg+'²)。已知 Φ(1)=0.8413，Φ(1.5)=0.9332，Φ(2)=0.9772。<br>求 P(|X − '+mu+'| < '+rd(k*sg,2)+')。（4 位小数）',a:v,sol:'|X−μ| < '+rd(k*sg,2)+' 等价于 |Z| < '+k+'，概率 = Φ('+k+') − Φ(−'+k+') = 2Φ('+k+') − 1 = '+v+'。',trap:'常见坑：直接写 Φ(k)，忘了左尾。对称区间要用 2Φ(k)−1。'}},
()=>({t:'mc',q:'保持 μ 不变而增大 σ，正态密度曲线会：',opts:['向右平移','变得更高更窄','变得更矮更胖，对称中心不变','失去对称性'],a:2,sol:'σ 只管「胖瘦」：σ 越大数据越分散，曲线越矮胖；总面积恒为 1，中心仍在 μ。',trap:'平移是 μ 的责任，胖瘦是 σ 的责任，两个参数分工明确。'})]},
{id:20,c:3,ic:'🗺️',n:'二维分布、边缘与条件分布',teach:'两个随机变量一起看，就用一张联合概率表。把某一行（或某一列）加起来，得到边缘分布——就是「把另一个变量忘掉」。条件分布 = 只看某一行，再把这行内部按比例放大到和为 1。X 与 Y 独立 ⇔ 每个格子 = 对应行和 × 列和。',qs:[
()=>{const a=R(2,6),b=R(2,6),c=R(2,6);const d=20-a-b-c;const q=PK(['X0','Y0']);const v=q==='X0'?(a+b)/20:(a+c)/20;return{t:'num',q:'(X,Y) 的联合分布（单位 1/20）：<br>P(X=0,Y=0)='+a+'/20，P(X=0,Y=1)='+b+'/20，P(X=1,Y=0)='+c+'/20，P(X=1,Y=1)='+d+'/20。<br>求 '+(q==='X0'?'边缘概率 P(X=0)':'边缘概率 P(Y=0)')+'。（4 位小数，可填分数）',a:rd(v),sol:q==='X0'?('把 X=0 那一行加起来：('+a+'+'+b+')/20 = '+(a+b)+'/20 = '+rd(v)+'。'):('把 Y=0 那一列加起来：('+a+'+'+c+')/20 = '+(a+c)+'/20 = '+rd(v)+'。'),trap:'常见坑：行与列加错方向。求 X 的边缘就把 Y 的所有可能加掉。'}},
()=>{const a=R(2,6),b=R(2,6),c=R(2,6);const d=20-a-b-c;return{t:'num',q:'联合分布（单位 1/20）：P(0,0)='+a+'，P(0,1)='+b+'，P(1,0)='+c+'，P(1,1)='+d+'。<br>求条件概率 P(Y=0 | X=0)。（4 位小数，可填分数）',a:rd(a/(a+b)),sol:'只看 X=0 这一行，行和为 ('+a+'+'+b+')/20。P(Y=0|X=0) = '+a+'/('+a+'+'+b+') = '+rd(a/(a+b))+'。',trap:'常见坑：分母仍用 20。条件概率的分母必须是那一行的行和。'}},
()=>({t:'mc',q:'判断二维离散型中 X 与 Y 是否独立，正确做法是：',opts:['看是否有格子概率为 0','验证每一个格子都满足 P(X=xᵢ,Y=yⱼ)=P(X=xᵢ)P(Y=yⱼ)','只验证其中一个格子','比较 E(X) 与 E(Y)'],a:1,sol:'独立是「全部格子都满足」的强要求：只要有一个格子不等于行和×列和，就不独立。',trap:'验一个格子成立不能下结论；但只要反例一个就能否定独立。'})]},
/* ===== 洲 4 数字特征峰 ===== */
{id:21,c:4,ic:'⚖️',n:'数学期望',teach:'期望是「长期平均」，不是「最可能」。E(X)=Σ xᵢpᵢ（连续型换成 ∫xf(x)dx）。例：抽奖 1% 中 100 元，99% 中 0 元，E=1 元——虽然你几乎总是空手。性质超好用：E(aX+b)=aE(X)+b，E(X+Y)=E(X)+E(Y)（不需要独立！）。',qs:[
()=>{const x=[R(0,2),R(3,5),R(6,9)];const p1=R(1,4)/10,p2=R(2,5)/10,p3=rd(1-p1-p2,4);const e=x[0]*p1+x[1]*p2+x[2]*p3;return{t:'num',q:'X 的分布律：P(X='+x[0]+')='+rd(p1,2)+'，P(X='+x[1]+')='+rd(p2,2)+'，P(X='+x[2]+')='+p3+'。<br>求 E(X)。（4 位小数）',a:rd(e),sol:'E(X)=Σxᵢpᵢ = '+x[0]+'×'+rd(p1,2)+' + '+x[1]+'×'+rd(p2,2)+' + '+x[2]+'×'+p3+' = '+rd(e)+'。',trap:'常见坑：把三个取值直接算算术平均。必须用概率做权重。'}},
()=>{const e=R(2,8),a=R(2,5),b=R(1,9);return{t:'num',q:'已知 E(X) = '+e+'，求 E('+a+'X + '+b+')。',a:a*e+b,sol:'期望的线性性：E(aX+b)=aE(X)+b = '+a+'×'+e+' + '+b+' = '+(a*e+b)+'。',trap:'常见坑：把常数 b 也乘上了 a，或以为常数项会消失。E(b)=b。'}},
()=>({t:'tf',q:'判断：E(X+Y)=E(X)+E(Y) 需要 X、Y 独立才成立。',a:false,sol:'期望的可加性无条件成立，不需要独立。需要独立的是 E(XY)=E(X)E(Y) 和 D(X+Y)=D(X)+D(Y)。',trap:'记住分工：期望相加总行；相乘和方差相加才要求独立（或不相关）。'})]},
{id:22,c:4,ic:'📊',n:'方差与标准差',teach:'方差量的是「波动大小」：D(X)=E[(X−E X)²]，实战常用 D(X)=E(X²)−[E(X)]²。标准差 σ=√D(X)，单位和 X 一样。性质：D(aX+b)=a²D(X)（平移不改变波动），D(C)=0；独立时 D(X±Y)=D(X)+D(Y)。',qs:[
()=>{const x=[R(0,2),R(3,6)];const p=R(2,8)/10;const q2=rd(1-p,2);const e=x[0]*p+x[1]*q2;const e2=x[0]*x[0]*p+x[1]*x[1]*q2;return{t:'num',q:'X 只取两个值：P(X='+x[0]+')='+rd(p,2)+'，P(X='+x[1]+')='+q2+'。<br>求 D(X)。（4 位小数）',a:rd(e2-e*e),sol:'先求 E(X)='+rd(e,4)+'；再求 E(X²)='+x[0]+'²×'+rd(p,2)+'+'+x[1]+'²×'+q2+'='+rd(e2,4)+'；故 D(X)=E(X²)−[E(X)]² = '+rd(e2,4)+'−'+rd(e*e,4)+' = '+rd(e2-e*e)+'。',trap:'常见坑：把 [E(X)]² 写成 E(X²)，两者顺序完全不同：先平方再平均 ≠ 先平均再平方。'}},
()=>{const d=R(2,9),a=R(2,5),b=R(1,9);return{t:'num',q:'已知 D(X) = '+d+'，求 D('+a+'X '+(PK([0,1])?'+ ':'− ')+b+')。',a:a*a*d,sol:'D(aX+b)=a²D(X) = '+a+'²×'+d+' = '+(a*a*d)+'。常数平移不改变波动，所以 b 消失。',trap:'常见坑：写成 aD(X)+b。系数要平方，常数项直接丢掉。'}},
()=>({t:'tf',q:'判断：对任意两个随机变量都有 D(X+Y)=D(X)+D(Y)。',a:false,sol:'一般公式是 D(X+Y)=D(X)+D(Y)+2Cov(X,Y)。只有 Cov=0（例如独立）时才能直接相加。',trap:'下一关就专门处理那个 2Cov 项。'})]},
{id:23,c:4,ic:'🔀',n:'协方差与相关系数',teach:'协方差看两者「同涨同跌」的倾向：Cov(X,Y)=E(XY)−E(X)E(Y)。正=同向，负=反向，0=线性无关。它带单位不好比较，于是标准化成相关系数 ρ = Cov(X,Y)/(σₓσᵧ) ∈ [−1,1]。通用公式：D(X±Y)=D(X)+D(Y)±2Cov(X,Y)。',qs:[
()=>{const exy=R(5,20),ex=R(1,5),ey=R(1,5);return{t:'num',q:'已知 E(XY)='+exy+'，E(X)='+ex+'，E(Y)='+ey+'。<br>求 Cov(X,Y)。',a:exy-ex*ey,sol:'Cov(X,Y)=E(XY)−E(X)E(Y) = '+exy+' − '+ex+'×'+ey+' = '+(exy-ex*ey)+'。',trap:'常见坑：写成 E(XY)−E(X+Y)。减去的是两个期望的乘积。'}},
()=>{const dx=R(2,9),dy=R(2,9),cv=R(-4,4);return{t:'num',q:'已知 D(X)='+dx+'，D(Y)='+dy+'，Cov(X,Y)='+cv+'。<br>求 D(X+Y)。',a:dx+dy+2*cv,sol:'D(X+Y)=D(X)+D(Y)+2Cov(X,Y) = '+dx+'+'+dy+'+2×('+cv+') = '+(dx+dy+2*cv)+'。',trap:'常见坑：忘乘 2，或在 Cov 为负时搞错正负号。'}},
()=>{const cv=R(2,9),sx=PK([2,3,4,5]),sy=PK([2,3,4,5]);return{t:'num',q:'已知 Cov(X,Y)='+cv+'，σₓ='+sx+'，σᵧ='+sy+'。<br>求相关系数 ρ。（4 位小数）',a:rd(cv/(sx*sy)),sol:'ρ = Cov(X,Y)/(σₓσᵧ) = '+cv+'/('+sx+'×'+sy+') = '+rd(cv/(sx*sy))+'。',trap:'常见坑：分母用方差而不是标准差。若题目给的是 D(X)，要先开根号。'}}]},
{id:24,c:4,ic:'📉',n:'切比雪夫不等式与大数定律',teach:'切比雪夫不等式：不管什么分布，P(|X−μ| ≥ kσ) ≤ 1/k²——离中心越远越稀罕。大数定律说：n 越大，样本均值 x̄ 就越必然地贴住真均值 μ。这正是「抛硬币次数多了频率就稳在 0.5」的严格保证，也是一切统计推断的地基。',qs:[
()=>{const k=PK([2,3,4,5]);return{t:'num',q:'设随机变量 X 的期望为 μ、标准差为 σ。<br>用切比雪夫不等式估计 P(|X−μ| ≥ '+k+'σ) 的上限。（4 位小数，可填分数）',a:rd(1/(k*k)),sol:'P(|X−μ| ≥ kσ) ≤ 1/k² = 1/'+(k*k)+' = '+rd(1/(k*k))+'。',trap:'常见坑：写成 1/k。分母是 k 的平方，所以偏离 3σ 以上的概率不超过 1/9。'}},
()=>({t:'mc',q:'伯努利大数定律的核心结论是：',opts:['样本均值一定等于总体均值','n 较大时频率依概率收敛于概率','任何分布都近似正态','方差会随 n 增大'],a:1,sol:'大数定律说的是「依概率收敛」：n 越大，频率（样本均值）偏离概率（总体均值）较多的可能性越小。',trap:'「一定等于」太强；「近似正态」是下一关的中心极限定理。'}),
()=>({t:'tf',q:'判断：切比雪夫不等式需要知道 X 的具体分布才能使用。',a:false,sol:'只需要期望和方差存在。正是因为不靠分布，它的估计才非常保守（宽松）。',trap:'知道具体分布时要直接算精确概率，别用这个粗略上限。'})]},
{id:25,c:4,ic:'🔔',n:'中心极限定理',sim:'clt',teach:'不管原来的分布多奇怪（只要方差有限），把 n 个独立同分布的变量加起来或取平均，n 较大时结果都近似正态：ΣXᵢ ≈ N(nμ, nσ²)，x̄ ≈ N(μ, σ²/n)。所以先标准化再查 Φ 表就能算概率。去下面看直方图怎么长成钟形。',qs:[
()=>{const n=PK([25,100,400]),mu=PK([5,10,20]),sg=PK([2,5,10]);const k=PK([1,1.5,2]);const c=rd(mu+k*sg/Math.sqrt(n),4);return{t:'num',q:'X₁,…,Xₙ 独立同分布，μ='+mu+'，σ='+sg+'，n='+n+'。已知 Φ(1)=0.8413，Φ(1.5)=0.9332，Φ(2)=0.9772。<br>用中心极限定理求 P(x̄ < '+c+')。（4 位小数）',a:PHI[''+k],sol:'x̄ 近似 N(μ, σ²/n)，标准差为 σ/√n = '+sg+'/'+Math.sqrt(n)+' = '+rd(sg/Math.sqrt(n),4)+'。Z=('+c+'−'+mu+')/'+rd(sg/Math.sqrt(n),4)+' ≈ '+k+'，概率 = Φ('+k+') = '+PHI[''+k]+'。',trap:'常见坑：分母用 σ 而不是 σ/√n。样本均值的波动比单个观测小得多。'}},
()=>{const n=PK([36,64,100]),mu=PK([2,4,5]),sg=PK([3,6]);const k=PK([1,2]);const c=rd(n*mu+k*sg*Math.sqrt(n),2);return{t:'num',q:'X₁,…,Xₙ 独立同分布，μ='+mu+'，σ='+sg+'，n='+n+'，记 Sₙ=ΣXᵢ。已知 Φ(1)=0.8413，Φ(2)=0.9772。<br>求 P(Sₙ < '+c+')。（4 位小数）',a:PHI[''+k],sol:'Sₙ 近似 N(nμ, nσ²)：均值 '+n*mu+'，标准差 σ√n = '+sg+'×'+Math.sqrt(n)+' = '+sg*Math.sqrt(n)+'。Z=('+c+'−'+n*mu+')/'+sg*Math.sqrt(n)+' = '+k+'，概率 = '+PHI[''+k]+'。',trap:'常见坑：把和的标准差写成 nσ。方差才是 nσ²，开根后是 √nσ。'}},
()=>({t:'mc',q:'关于中心极限定理，正确的是：',opts:['要求原分布必须是正态','只要 n 较大，和（或均值）的分布近似正态','要求变量不独立','n=2 时已经很准'],a:1,sol:'CLT 不要求原分布正态，只要求独立同分布且方差有限，n 较大时和/均值就近似正态。',trap:'这正是它神奇的地方：源分布可以很丑，叠加后依然变钟形。'})]},
/* ===== 洲 5 推断神殿 ===== */
{id:26,c:5,ic:'👥',n:'总体、样本与统计量',teach:'总体是你想了解的全部，样本是你实际拿到的 n 个观测。统计量 = 只由样本算出的量（不能含未知参数）。核心结论：E(x̄)=μ，D(x̄)=σ²/n（样本越多越稳），E(S²)=σ²。样本方差分母是 n−1 而不是 n，因为 x̄ 已经「用掉」了一个自由度。',qs:[
()=>{const sg=PK([2,3,4,6]),n=PK([4,9,16,25]);return{t:'num',q:'总体方差 σ² = '+sg*sg+'，抽取容量为 n = '+n+' 的样本。<br>求样本均值的方差 D(x̄)。（4 位小数，可填分数）',a:rd(sg*sg/n),sol:'D(x̄)=σ²/n = '+sg*sg+'/'+n+' = '+rd(sg*sg/n)+'。样本量越大，均值越稳定。',trap:'常见坑：除成 √n（那是标准差的算法）。方差除 n，标准差除 √n。'}},
()=>{const m=R(4,9);const d=PK([[-2,-1,1,2],[-3,-1,1,3],[-2,0,0,2],[-1,-1,1,1]]);const x=d.map(v=>m+v);const s2=d.reduce((s,v)=>s+v*v,0)/3;return{t:'num',q:'样本观测值为 '+x.join(', ')+'。<br>求样本方差 S²（分母用 n−1）。（4 位小数）',a:rd(s2),sol:'x̄ = '+m+'；各偏差为 '+d.join(', ')+'；偏差平方和 = '+d.reduce((s,v)=>s+v*v,0)+'；S² = 平方和/(n−1) = '+d.reduce((s,v)=>s+v*v,0)+'/3 = '+rd(s2)+'。',trap:'常见坑：分母用 4（即 n）。考试中默认样本方差用 n−1。'}},
()=>({t:'mc',q:'下列哪个不是统计量？',opts:['样本均值 x̄','样本方差 S²','(x̄ − μ)/σ，其中 μ、σ 未知','样本最大值'],a:2,sol:'统计量必须完全由样本确定，不能含未知参数。含有未知 μ、σ 的表达式无法由数据算出。',trap:'这个细节正是后面「σ 未知时改用 t 统计量」的根本原因。'})]},
{id:27,c:5,ic:'📐',n:'三大抽样分布 χ² / t / F',teach:'正态总体下的三个工具：χ²(n) 是 n 个独立标准正态的平方和；t(n) 像正态但尾巴更厚（σ 未知时用它）；F 是两个 χ² 之比（比较两个方差时用）。三条结论：(n−1)S²/σ² ~ χ²(n−1)；(x̄−μ)/(σ/√n) ~ N(0,1)；(x̄−μ)/(S/√n) ~ t(n−1)。',qs:[
()=>{const n=PK([6,10,16,21,25]);return{t:'num',q:'设总体 X ~ N(μ, σ²)，样本容量 n = '+n+'。<br>统计量 (n−1)S²/σ² 服从 χ² 分布，其自由度是多少？',a:n-1,sol:'(n−1)S²/σ² ~ χ²(n−1)，所以自由度 = '+n+' − 1 = '+(n-1)+'。',trap:'常见坑：写成 n。汇总均值已被估计，自由度要扣掉 1。'}},
()=>({t:'mc',q:'总体正态、方差 σ² 未知时，检验均值 μ 应用哪个统计量？',opts:['(x̄−μ)/(σ/√n) ~ N(0,1)','(x̄−μ)/(S/√n) ~ t(n−1)','(n−1)S²/σ² ~ χ²(n−1)','F 分布'],a:1,sol:'σ 未知时用样本标准差 S 代替，代价是分布从正态变成尾部更厚的 t(n−1)。',trap:'σ 已知用 Z，σ 未知用 t；检验方差用 χ²；比两个方差用 F。'}),
()=>({t:'tf',q:'判断：自由度 n 越大，t(n) 分布越接近标准正态分布。',a:true,sol:'n 越大，S 估计 σ 越准，额外的不确定性越小，尾部变薄，t 分布收敛到 N(0,1)。实践上 n>30 已很接近。',trap:'小样本时千万不要用 1.96，必须查 t 表。'})]},
{id:28,c:5,ic:'🔧',n:'矩估计',teach:'思路极朴素：让「理论矩」等于「样本矩」，解出参数。一阶矩就是 E(X)=x̄。例：指数分布 E(X)=1/λ，令 1/λ = x̄ → λ̂ = 1/x̄；均匀分布 U(0,θ) 的 E(X)=θ/2 = x̄ → θ̂ = 2x̄。参数多就再用二阶矩 E(X²) 补方程。',qs:[
()=>{const x=[R(2,5),R(3,6),R(4,8),R(1,4)];const m=x.reduce((s,v)=>s+v,0)/4;return{t:'num',q:'设总体 X ~ 指数分布 E(λ)，样本观测值为 '+x.join(', ')+'。<br>求 λ 的矩估计值。（4 位小数，可填分数）',a:rd(1/m),sol:'x̄ = ('+x.join('+')+')/4 = '+rd(m,4)+'；由 E(X)=1/λ 令 1/λ = x̄，得 λ̂ = 1/x̄ = '+rd(1/m)+'。',trap:'常见坑：直接把 λ̂ 写成 x̄。指数分布的期望是 1/λ，记反就全错。'}},
()=>{const x=[R(1,4),R(2,6),R(3,7),R(2,5)];const m=x.reduce((s,v)=>s+v,0)/4;return{t:'num',q:'设总体 X ~ U(0, θ)，样本观测值为 '+x.join(', ')+'。<br>求 θ 的矩估计值。（4 位小数）',a:rd(2*m),sol:'x̄ = '+rd(m,4)+'；由 E(X)=θ/2 令 θ/2 = x̄，得 θ̂ = 2x̄ = '+rd(2*m)+'。',trap:'常见坑：把 θ̂ 写成 x̄。均匀分布的均值在区间中点，所以右端点要乘 2。'}},
()=>({t:'mc',q:'矩估计的基本思想是：',opts:['最大化似然函数','用样本矩代替总体矩并解方程','最小化残差平方和','使方差最小'],a:1,sol:'矩估计就是列方程：理论矩（含参数）= 样本矩（由数据算出），然后解出参数。',trap:'最大化似然是下一关的极大似然估计，最小二乘是回归。'})]},
{id:29,c:5,ic:'🎯',n:'极大似然估计',teach:'反问一句：哪个参数值最可能生出我手上这批数据？写出似然 L(θ)=∏ f(xᵢ;θ)，取对数再求导置零。结果往往非常直观：伯努利 p̂ = 成功次数/n；泊松 λ̂ = x̄；正态 μ̂ = x̄。取对数只是把乘法变加法，方便求导而已。',qs:[
()=>{const n=PK([20,50,80,100]);const k=R(Math.round(n*0.2),Math.round(n*0.7));return{t:'num',q:'做 '+n+' 次独立试验，成功 '+k+' 次。设每次成功率为 p。<br>求 p 的极大似然估计值。（4 位小数，可填分数）',a:rd(k/n),sol:'似然 L(p)=pᵏ(1−p)ⁿ⁻ᵏ，取对数求导置零得 p̂ = k/n = '+k+'/'+n+' = '+rd(k/n)+'。结果就是成功频率。',trap:'常见坑：忘除 n，或把分母写成失败次数。'}},
()=>{const x=[R(1,4),R(2,5),R(0,3),R(3,6)];const m=x.reduce((s,v)=>s+v,0)/4;return{t:'num',q:'设总体 X ~ 泊松分布 P(λ)，样本观测值为 '+x.join(', ')+'。<br>求 λ 的极大似然估计值。（4 位小数）',a:rd(m),sol:'泊松分布的极大似然估计与矩估计一致：λ̂ = x̄ = ('+x.join('+')+')/4 = '+rd(m)+'。',trap:'常见坑：因为泊松的方差也等于 λ，有人会去算样本方差。一阶矩更直接也更有效。'}},
()=>({t:'mc',q:'求极大似然估计时取对数的目的是：',opts:['改变极值点位置','把连乘变成连加、便于求导','使估计量无偏','降低方差'],a:1,sol:'对数是严格递增变换，不会改变最大值点，只是把乘积变成和，求导大大简化。',trap:'取对数不影响结果，也不会带来无偏性——极大似然估计可能是有偏的。'})]},
{id:30,c:5,ic:'🏅',n:'估计量的评价标准',teach:'三把尺子：无偏性 E(θ̂)=θ（长期不偏心）；有效性——都无偏时方差更小的更好；一致性——n→∞ 时收敛到真值。经典事实：S²（除以 n−1）是 σ² 的无偏估计，而除以 n 的那个偏小、有偏。',qs:[
()=>({t:'tf',q:'判断：样本方差 S² = Σ(xᵢ−x̄)²/(n−1) 是总体方差 σ² 的无偏估计。',a:true,sol:'可以证明 E(S²)=σ²。若分母换成 n，则 E 会变成 (n−1)σ²/n < σ²，系统性偏小。',trap:'这就是「为什么除 n−1」的标准答案：为了保证无偏。'}),
()=>({t:'mc',q:'两个估计量都是 θ 的无偏估计，应选哪个？',opts:['方差更大的','方差更小的','计算更简单的','两个一样好'],a:1,sol:'都无偏时比「有效性」：方差小意味着估计值更集中在真值附近，更可靠。',trap:'无偏只保证「平均不偏心」，不保证单次准。方差才描述单次可靠度。'}),
()=>({t:'tf',q:'判断：样本均值 x̄ 是总体均值 μ 的无偏估计。',a:true,sol:'E(x̄)=E(ΣXᵢ/n)=nμ/n=μ，所以无偏；且 D(x̄)=σ²/n → 0，所以也是一致估计。',trap:'无偏是对「期望」的要求，与具体一次抽样的误差无关。'})]},
{id:31,c:5,ic:'📏',n:'区间估计',sim:'ci',teach:'点估计给一个数，区间估计给一个范围加信心。σ 已知时 μ 的置信区间：x̄ ± z·σ/√n。常用 z：90%→1.645，95%→1.96，99%→2.576。信心越高区间越宽，n 越大区间越窄。含义：反复抽样做出的区间中，约 95% 会盖住真 μ。去实验室验证。',qs:[
()=>{const zs=[[1.645,'90%'],[1.96,'95%'],[2.576,'99%']];const z=PK(zs);const sg=PK([2,3,5,10]),n=PK([16,25,36,100]);const r=z[0]*sg/Math.sqrt(n);return{t:'num',q:'总体 X ~ N(μ, σ²)，σ = '+sg+' 已知，n = '+n+'。<br>求 μ 的 '+z[1]+' 置信区间的半径（即 ± 后面那个数，z = '+z[0]+'）。（4 位小数）',a:rd(r),sol:'半径 = z·σ/√n = '+z[0]+'×'+sg+'/'+Math.sqrt(n)+' = '+rd(r)+'。区间为 x̄ ± '+rd(r)+'。',trap:'常见坑：忘除 √n，或把 n 直接当成 √n。注意除的是根号 n。'}},
()=>({t:'mc',q:'「μ 的 95% 置信区间为 (4.2, 5.8)」的正确含义是：',opts:['μ 落在该区间的概率是 95%','若反复抽样并构造区间，约 95% 的区间会包含 μ','95% 的数据落在该区间内','样本均值有 95% 的可能是 5'],a:1,sol:'μ 是固定常数，随机的是区间。置信水平描述的是「造区间这个程序」的长期命中率。',trap:'把 μ 说成随机的是最典型的误解，下面的模拟器会把这一点看得很清楚。'}),
()=>({t:'tf',q:'判断：其他条件不变，把置信水平从 95% 提高到 99%，区间会变宽。',a:true,sol:'z 从 1.96 增到 2.576，半径变大。想要更高的信心，就必须接受更模糊的结论。',trap:'想同时要高信心与窄区间，唯一办法是增大样本量 n。'})]},
{id:32,c:5,ic:'⚖️',n:'假设检验',teach:'先立原假设 H₀（默认无罪），再看数据有多离谱。σ 已知时检验 μ：Z=(x̄−μ₀)/(σ/√n)，双侧时 |Z| > z_{α/2}（如 1.96）就拒绝 H₀。两类错误：第一类 = H₀ 真却拒绝（弃真，概率 α）；第二类 = H₀ 假却接受（取伪，概率 β）。n 不变时 α 与 β 此消彼长。',qs:[
()=>{const mu0=PK([10,20,50,100]),sg=PK([2,4,5,10]),n=PK([16,25,100]);const z=PK([-2.5,-1.5,1.2,1.8,2.4,3]);const xb=rd(mu0+z*sg/Math.sqrt(n),4);return{t:'num',q:'检验 H₀: μ = '+mu0+'（σ = '+sg+' 已知），n = '+n+'，算得 x̄ = '+xb+'。<br>求检验统计量 Z 的值。（4 位小数）',a:rd(z),sol:'Z = (x̄ − μ₀)/(σ/√n) = ('+xb+' − '+mu0+')/('+sg+'/'+Math.sqrt(n)+') = '+rd(z)+'。',trap:'常见坑：分母直接用 σ，忘了除 √n——那样会严重低估统计量。'}},
()=>({t:'mc',q:'在假设检验中，「第一类错误」指的是：',opts:['H₀ 为真时却拒绝了 H₀','H₀ 为假时却接受了 H₀','样本量不足','计算错误'],a:0,sol:'第一类错误 = 弃真，概率为显著水平 α；第二类错误 = 取伪，概率为 β。',trap:'口诀：一弃真、二取伪。降低 α 会抬高 β，除非增大 n。'}),
()=>{const z=PK([1.2,1.8,2.4,2.9,0.7]);const rej=Math.abs(z)>1.96;return{t:'tf',q:'双侧检验，显著水平 α = 0.05（临界值 1.96），算得 Z = '+z+'。<br>判断：应当拒绝原假设 H₀。',a:rej,sol:'|Z| = '+Math.abs(z)+(rej?' > ':' < ')+'1.96，所以'+(rej?'落入拒绝域，应拒绝 H₀。':'未落入拒绝域，不能拒绝 H₀。'),trap:'双侧检验比的是绝对值；而且「不拒绝」不等于「证明 H₀ 正确」。'}}]},
{id:33,c:5,ic:'📈',n:'一元线性回归入门',teach:'用一条直线 ŷ = â + b̂x 概括 x 与 y 的关系。最小二乘让残差平方和最小：b̂ = Sxy/Sxx，â = ȳ − b̂x̄，其中 Sxy=Σ(xᵢ−x̄)(yᵢ−ȳ)，Sxx=Σ(xᵢ−x̄)²。b̂ 的含义：x 每增加 1 个单位，y 平均变化 b̂ 个单位。R² 越接近 1 拟合越好。',qs:[
()=>{const b=R(2,5),a=R(1,6);const xs=[1,2,3,4];const ys=xs.map(x=>a+b*x);return{t:'num',q:'数据点：(1, '+ys[0]+'), (2, '+ys[1]+'), (3, '+ys[2]+'), (4, '+ys[3]+')。<br>求最小二乘回归直线的斜率 b̂。',a:b,sol:'x̄=2.5，ȳ='+(a+2.5*b)+'；Sxx=Σ(xᵢ−x̄)²=2.25+0.25+0.25+2.25=5；Sxy='+5*b+'；故 b̂=Sxy/Sxx='+5*b+'/5='+b+'。（这组数据完全共线，斜率就是真值）',trap:'常见坑：把分子分母写反成 Sxx/Sxy，或用了 Syy。'}},

/* ================== 关卡运行：秒懂 → 试手 → 闯关 ================== */
let RUN=null,TMR=null;
function PARSE(s){s=(s||'').trim();if(!s)return NaN;s=s.split('％').join('%');if(s.indexOf('%')>=0){const v=parseFloat(s);return isNaN(v)?NaN:v/100}if(s.indexOf('/')>=0){const p=s.split('/');const a=parseFloat(p[0]),b=parseFloat(p[1]);return b?a/b:NaN}return parseFloat(s)}
function genQ(l){const gi=Math.floor(Math.random()*l.qs.length);return{lid:l.id,gi:gi,q:l.qs[gi]()}}
function wKey(lid,gi){return 'L'+lid+'#'+gi}
function wrongAdd(lid,gi){const k=wKey(lid,gi);const w=S.wrong[k]||{lid:lid,gi:gi,cc:0};w.cc=0;w.due=TD();S.wrong[k]=w;save()}
function wrongOK(lid,gi){const k=wKey(lid,gi),w=S.wrong[k];if(!w)return;w.cc=(w.cc||0)+1;if(w.cc>=2){delete S.wrong[k];toast('🎓 这道错题已毕业，从错题本移除！')}else{const gap=w.cc===1?3:7;w.due=ADD(TD(),gap)}save()}

function startLevel(l){RUN={mode:'lv',l:l,phase:'teach',timed:false};drawTeach()}
function drawTeach(){const l=RUN.l;let h='<div class="card"><div class="crumb">'+CON[l.c].ic+' '+CON[l.c].n+'</div><h2>'+l.ic+' '+l.n+'</h2><div class="tag">① 秒懂</div><p class="teach">'+l.teach+'</p>';
if(l.sim)h+='<button class="btn g3" onclick="openSim(&quot;'+l.sim+'&quot;)">🧪 先玩一下交互实验室</button>';
h+='<button class="btn" onclick="startStage(&quot;guide&quot;)">② 开始试手（2 道引导题）</button><button class="btn gh" onclick="go(0,&quot;map&quot;)">返回地图</button></div>';
$('main').innerHTML=h}
function startStage(ph){const l=RUN.l;RUN.phase=ph;RUN.i=0;RUN.right=0;RUN.items=[];const n=ph==='guide'?2:5;for(let i=0;i<n;i++)RUN.items.push(genQ(l));nextQ()}
function nextQ(){clearTimeout(TMR);if(RUN.mode==='boss'){bossNext();return}if(RUN.i>=RUN.items.length){finishStage();return}RUN.cur=RUN.items[RUN.i];drawQ()}

function qBody(q){let h='<div class="qtx">'+q.q+'</div>';
if(q.t==='mc')h+='<div class="opts">'+q.opts.map((o,i)=>'<div class="opt" id="o'+i+'" onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</div>').join('')+'</div>';
else if(q.t==='tf')h+='<div class="opts row"><div class="opt" id="o1" onclick="pick(true)">✅ 正确</div><div class="opt" id="o0" onclick="pick(false)">❌ 错误</div></div>';
else h+='<div class="inrow"><input id="ansIn" class="in" placeholder="输入答案（可填小数、分数如 1/6、百分比如 25%）" onkeydown="if(event.key===&quot;Enter&quot;)pick(null)"><button class="btn s" onclick="pick(null)">提交</button></div>';
return h}
function drawQ(){const q=RUN.cur.q;const tot=RUN.items?RUN.items.length:0;
let head=RUN.mode==='rev'?('📕 智能复习 '+(RUN.i+1)+'/'+tot):(RUN.phase==='guide'?('② 试手 '+(RUN.i+1)+'/'+tot):('③ 闯关 '+(RUN.i+1)+'/'+tot));
let h='<div class="card q" id="qcard"><div class="qhead"><span class="tag">'+head+'</span><span class="tag mini2">'+(RUN.mode==='rev'?'复习模式':RUN.l.n)+'</span></div>';
if(RUN.timed&&RUN.phase==='chal')h+='<div class="timer" id="tmr">⏱️ 30</div>';
h+=qBody(q);
h+='<div class="toolrow"><button class="btn gh s" onclick="useHint()">💡 提示（'+S.items.hint+'）</button><button class="btn gh s" onclick="useSkip()">⏭️ 跳过（'+S.items.skip+'）</button><button class="btn gh s" onclick="quitRun()">退出</button></div><div id="fb"></div></div>';
$('main').innerHTML=h;
if(RUN.timed&&RUN.phase==='chal'){let t=30;TMR=setInterval(()=>{t--;const e=$('tmr');if(e)e.textContent='⏱️ '+t;if(t<=0){clearInterval(TMR);grade(false,true)}},1000)}}

function pick(v){const q=RUN.cur.q;let ok=false;
if(q.t==='mc'){ok=(v===q.a);document.querySelectorAll('.opt').forEach(e=>e.classList.add('dim'));const el=$('o'+v);if(el){el.classList.remove('dim');el.classList.add(ok?'good':'bad')}if(!ok){const g=$('o'+q.a);if(g){g.classList.remove('dim');g.classList.add('good')}}}
else if(q.t==='tf'){ok=(v===q.a);const el=$('o'+(v?1:0));if(el)el.classList.add(ok?'good':'bad');const g=$('o'+(q.a?1:0));if(g)g.classList.add('good')}
else{const raw=$('ansIn')?$('ansIn').value:'';const val=PARSE(raw);if(isNaN(val)){toast('请先输入一个数字、分数或百分比');return}const a=q.a;ok=Math.abs(val-a)<=(0.006+Math.abs(a)*0.004);if($('ansIn'))$('ansIn').disabled=true}
grade(ok,false)}

function grade(ok,timeout){clearInterval(TMR);const card=$('qcard');const q=RUN.cur.q,lid=RUN.cur.lid,gi=RUN.cur.gi;

function ctx2(){const cv=$('cv');const w=cv.clientWidth||640;cv.width=w*2;cv.height=300*2;const x=cv.getContext('2d');x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,w,300);x.font='12px sans-serif';return{x:x,w:w,h:300}}

/* 3) 正态曲线拖动 μ 与 σ */
let NM={mu:0,sg:1};
function simNormal(){$('main').innerHTML=simShell('🔔 正态曲线实验室','拖动滑块：μ 只平移位置，σ 只改变胖瘦（总面积永远是 1）。阴影区域是 μ ± kσ，对应经验法则 68.3% / 95.4% / 99.7%。',
'<label class="sl">μ = <span id="mv">0</span><input type="range" min="-8" max="8" step="0.5" value="'+NM.mu+'" oninput="NM.mu=+this.value;nmDraw()"></label><label class="sl">σ = <span id="sv">1</span><input type="range" min="0.5" max="5" step="0.1" value="'+NM.sg+'" oninput="NM.sg=+this.value;nmDraw()"></label><button class="btn s" onclick="NM.k=1;nmDraw()">±1σ</button><button class="btn s" onclick="NM.k=2;nmDraw()">±2σ</button><button class="btn s" onclick="NM.k=3;nmDraw()">±3σ</button>');
NM.k=NM.k||1;nmDraw()}
function nden(x,mu,sg){return Math.exp(-((x-mu)*(x-mu))/(2*sg*sg))/(sg*Math.sqrt(2*Math.PI))}
function nmDraw(){const c=ctx2(),x=c.x,w=c.w,h=c.h;const y0=h-24,X0=38,W=w-48;axes(x,w,h,'f(x)');
const lo=-14,hi=14;const sc=1/(0.5*Math.sqrt(2*Math.PI));const px=v=>X0+(v-lo)/(hi-lo)*W,py=v=>y0-v/sc*(y0-16);
const k=NM.k||1;x.fillStyle='rgba(14,159,192,.15)';x.beginPath();x.moveTo(px(NM.mu-k*NM.sg),y0);for(let v=NM.mu-k*NM.sg;v<=NM.mu+k*NM.sg;v+=0.05)x.lineTo(px(v),py(nden(v,NM.mu,NM.sg)));x.lineTo(px(NM.mu+k*NM.sg),y0);x.fill();
x.strokeStyle='#0e9fc0';x.lineWidth=2.5;x.beginPath();for(let v=lo;v<=hi;v+=0.05){const Y=py(nden(v,NM.mu,NM.sg));if(v===lo)x.moveTo(px(v),Y);else x.lineTo(px(v),Y)}x.stroke();
x.strokeStyle='#d6336c';x.setLineDash([3,3]);x.beginPath();x.moveTo(px(NM.mu),y0);x.lineTo(px(NM.mu),py(nden(NM.mu,NM.mu,NM.sg)));x.stroke();x.setLineDash([]);
x.fillStyle='#5d6685';x.fillText('μ = '+NM.mu,px(NM.mu)+4,y0-6);x.fillText('x',w-16,y0+14);
if($('mv'))$('mv').textContent=NM.mu;if($('sv'))$('sv').textContent=rd(NM.sg,2);
const pr=k===1?0.6827:k===2?0.9545:0.9973;
$('simout').innerHTML='当前：X ~ N('+NM.mu+', '+rd(NM.sg*NM.sg,2)+')，σ = '+rd(NM.sg,2)+'。阴影区间 ('+rd(NM.mu-k*NM.sg,2)+', '+rd(NM.mu+k*NM.sg,2)+')，概率 ≈ <b>'+rd(pr*100,2)+'%</b>。注意：不管 μ、σ 怎么变，这个百分比永远不变——这就是标准化的意义。'}

/* 4) 中心极限定理直方图 */
let CL={dist:'uni',n:5,means:[],bins:40};
function simCLT(){$('main').innerHTML=simShell('📊 中心极限定理定验室','选一个「很不正态」的源分布，每次抽 n 个数取平均，把平均值堆成直方图。n 越大，直方图越像钟形——而且越窄（标准差 σ/√n）。',
'<button class="btn s" onclick="clSet(&quot;uni&quot;)">均匀</button><button class="btn s" onclick="clSet(&quot;exp&quot;)">指数（极偏）</button><button class="btn s" onclick="clSet(&quot;ber&quot;)">硬币 0/1</button><button class="btn s" onclick="clSet(&quot;dice&quot;)">骰子</button><label class="sl">n = <span id="nv">'+CL.n+'</span><input type="range" min="1" max="50" value="'+CL.n+'" oninput="CL.n=+this.value;CL.means=[];clDraw()"></label><button class="btn s g2" onclick="clRun(50)">抽 50 组</button><button class="btn s g2" onclick="clRun(1000)">抽 1000 组</button><button class="btn s gh" onclick="CL.means=[];clDraw()">清空</button>');
clDraw()}
function clSet(d){CL.dist=d;CL.means=[];clDraw()}
function clOne(){const d=CL.dist;if(d==='uni')return Math.random();if(d==='exp')return -Math.log(1-Math.random());if(d==='ber')return Math.random()<0.5?0:1;return R(1,6)}
function clStat(){const d=CL.dist;if(d==='uni')return[0.5,Math.sqrt(1/12)];if(d==='exp')return[1,1];if(d==='ber')return[0.5,0.5];return[3.5,Math.sqrt(35/12)]}
function clRun(t){for(let i=0;i<t;i++){let s=0;for(let j=0;j<CL.n;j++)s+=clOne();CL.means.push(s/CL.n)}clDraw()}
function clDraw(){const c=ctx2(),x=c.x,w=c.w,h=c.h;const y0=h-24,X0=38,W=w-48;axes(x,w,h,'频数');
const st=clStat(),mu=st[0],sg=st[1]/Math.sqrt(CL.n);const lo=mu-4.2*st[1],hi=mu+4.2*st[1];
const B=CL.bins,cnt=new Array(B).fill(0);CL.means.forEach(v=>{let i=Math.floor((v-lo)/(hi-lo)*B);if(i>=0&&i<B)cnt[i]++});
const mx=Math.max(1,Math.max.apply(null,cnt));const bw=W/B;
for(let i=0;i<B;i++){const bh=cnt[i]/mx*(y0-24);x.fillStyle='rgba(124,92,214,.75)';x.fillRect(X0+i*bw+0.5,y0-bh,bw-1,bh)}
x.strokeStyle='#0e9fc0';x.lineWidth=2;x.beginPath();let pk=0;for(let i=0;i<B;i++){const cx=lo+(i+0.5)/B*(hi-lo);pk=Math.max(pk,nden(cx,mu,sg))}
for(let i=0;i<=200;i++){const v=lo+(hi-lo)*i/200;const Y=y0-nden(v,mu,sg)/pk*(y0-24)*(mx>3?1:0.6);const Xp=X0+(v-lo)/(hi-lo)*W;if(i===0)x.moveTo(Xp,Y);else x.lineTo(Xp,Y)}x.stroke();
if($('nv'))$('nv').textContent=CL.n;
const m=CL.means.length?CL.means.reduce((a,b)=>a+b,0)/CL.means.length:0;
$('simout').innerHTML='源分布：'+({uni:'均匀 U(0,1)',exp:'指数 E(1)，左偏严重',ber:'两点 0/1，双峰',dice:'骰子，离散'}[CL.dist])+'　n = <b>'+CL.n+'</b>　已抽 <b>'+CL.means.length+'</b> 组<br>理论：x̄ ≈ N('+rd(mu,4)+', '+rd(sg*sg,4)+')，标准差 σ/√n = <b>'+rd(sg,4)+'</b>；实测平均 = '+rd(m,4)+'。蓝线是理论正态曲线。'}

/* 5) 置信区间命中率 */
let CI={z:1.96,cl:'95%',n:25,hit:0,tot:0,rows:[]};
function simCI(){$('main').innerHTML=simShell('📏 置信区间实验室','真值 μ = 50、σ = 10（游戏里才知道）。每次抽 n 个数造一个区间，红色 = 没盖住 μ。长期命中率会靠近置信水平——随机的是区间，不是 μ。',
'<button class="btn s" onclick="ciSet(1.645,&quot;90%&quot;)">90%</button><button class="btn s" onclick="ciSet(1.96,&quot;95%&quot;)">95%</button><button class="btn s" onclick="ciSet(2.576,&quot;99%&quot;)">99%</button><label class="sl">n = <span id="cnv">'+CI.n+'</span><input type="range" min="4" max="100" value="'+CI.n+'" oninput="CI.n=+this.value;ciDraw()"></label><button class="btn s g2" onclick="ciRun(20)">抽 20 次</button><button class="btn s g2" onclick="ciRun(500)">抽 500 次</button><button class="btn s gh" onclick="CI.hit=0;CI.tot=0;CI.rows=[];ciDraw()">重置</button>');
ciDraw()}
function ciSet(z,cl){CI.z=z;CI.cl=cl;CI.hit=0;CI.tot=0;CI.rows=[];ciDraw()}
function nrand(){let u=Math.random(),v=Math.random();if(u<1e-9)u=1e-9;return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function ciRun(t){for(let i=0;i<t;i++){let s=0;for(let j=0;j<CI.n;j++)s+=50+10*nrand();const xb=s/CI.n,r=CI.z*10/Math.sqrt(CI.n);const ok=(xb-r<=50&&50<=xb+r);CI.tot++;if(ok)CI.hit++;CI.rows.push([xb,r,ok]);if(CI.rows.length>28)CI.rows.shift()}ciDraw()}
function ciDraw(){const c=ctx2(),x=c.x,w=c.w,h=c.h;const X0=38,W=w-48;x.strokeStyle='#ccd0dd';x.beginPath();x.moveTo(X0,10);x.lineTo(X0,h-24);x.lineTo(w-10,h-24);x.stroke();
const lo=38,hi=62;const px=v=>X0+(Math.min(hi,Math.max(lo,v))-lo)/(hi-lo)*W;
x.strokeStyle='#d6336c';x.setLineDash([4,4]);x.beginPath();x.moveTo(px(50),10);x.lineTo(px(50),h-24);x.stroke();x.setLineDash([]);x.fillStyle='#d6336c';x.fillText('真值 μ = 50',px(50)+4,16);
CI.rows.forEach((r,i)=>{const y=24+i*((h-56)/28);x.strokeStyle=r[2]?'#22a06b':'#e0415f';x.lineWidth=2.5;x.beginPath();x.moveTo(px(r[0]-r[1]),y);x.lineTo(px(r[0]+r[1]),y);x.stroke();x.fillStyle=r[2]?'#22a06b':'#e0415f';x.fillRect(px(r[0])-1.5,y-3,3,6)});
if($('cnv'))$('cnv').textContent=CI.n;
$('simout').innerHTML='置信水平 <b>'+CI.cl+'</b>（z = '+CI.z+'），n = '+CI.n+'，半径 = z·σ/√n = <b>'+rd(CI.z*10/Math.sqrt(CI.n),4)+'</b><br>命中 '+CI.hit+' / '+CI.tot+' = <b>'+(CI.tot?rd(CI.hit/CI.tot*100,2):0)+'%</b>（应靠近 '+CI.cl+'）。提高置信水平区间变宽，增大 n 区间变窄——自己拖一拖就看到了。'}

/* ================== 公式速查手册 ================== */
const BOOK=[
['随机大陆',['概率公理：0 ≤ P(A) ≤ 1，P(Ω)=1','加法公式：P(A∪B)=P(A)+P(B)−P(A∩B)','互斥时：P(A∪B)=P(A)+P(B)','对立事件：P(Ā)=1−P(A)','差事件：P(A−B)=P(A)−P(A∩B)','德摩根：‾A∪B = Ā∩B̄，‾A∩B = Ā∪B̄']],
['计数丛林',['乘法原理：分步 → 相乘；加法原理：分类 → 相加','排列（有序）：A(n,k) = n!/(n−k)!','组合（无序）：C(n,k) = n!/[k!(n−k)!]','对称性：C(n,k)=C(n,n−k)；递推 C(n,k)=C(n−1,k−1)+C(n−1,k)','古典型：P(A)=有利基本事件数/样本空间总数（等可能）','几何型：P(A)=区域度量之比（长度/面积/体积）']],
['条件之城',['条件概率：P(A|B)=P(A∩B)/P(B)，P(B)>0','乘法公式：P(A∩B)=P(B)P(A|B)=P(A)P(B|A)','全概率：P(A)=Σ P(Bᵢ)P(A|Bᵢ)（Bᵢ 完备互斥）','贝叶斯：P(Bₖ|A)=P(Bₖ)P(A|Bₖ)/Σ P(Bᵢ)P(A|Bᵢ)','独立：P(A∩B)=P(A)P(B) ⇔ P(A|B)=P(A)','独立 ≠ 互斥；互斥且概率非零则必不独立']],
['变量之海',['分布函数：F(x)=P(X ≤ x)，右连续、单调不减','密度：P(a<X≤b)=∫ₐᵇ f(x)dx，∫ f = 1','二项分布 B(n,p)：P(X=k)=C(n,k)pᵏ(1−p)ⁿ⁻ᵏ，E=np，D=np(1−p)','泊松 P(λ)：P(X=k)=λᵏ e⁻ᶫ/k!，E=D=λ','几何分布：P(X=k)=(1−p)ᵏ⁻¹p，E=1/p，D=(1−p)/p²','均匀 U(a,b)：E=(a+b)/2，D=(b−a)²/12','指数 E(λ)：F(x)=1−e⁻ᶫˣ (x>0)，E=1/λ，D=1/λ²，具无记忆性','正态 N(μ,σ²)：Z=(X−μ)/σ ~ N(0,1)，P(|X−μ|<kσ)=2Φ(k)−1','边缘分布：按行/列求和；条件分布：格子/行和','独立 ⇔ 每个格子 = 行和 × 列和（连续：f(x,y)=fₓ(x)fᵧ(y)）']],
['数字特征峰',['E(X)=Σxᵢpᵢ = ∫xf(x)dx；E(aX+b)=aE(X)+b；E(X+Y)=E(X)+E(Y) 无条件成立','D(X)=E(X²)−[E(X)]²；D(aX+b)=a²D(X)；σ=√D(X)','Cov(X,Y)=E(XY)−E(X)E(Y)；D(X±Y)=D(X)+D(Y)±2Cov(X,Y)','ρ = Cov(X,Y)/(σₓσᵧ) ∈ [−1,1]；独立 ⇒ ρ=0，反之不一定','k 阶原点矩 E(Xᵏ)，k 阶中心矩 E[(X−EX)ᵏ]','切比雪夫：P(|X−μ| ≥ kσ) ≤ 1/k²（不靠分布）','大数定律：x̄ 依概率收敛于 μ','中心极限定理：ΣXᵢ ≈ N(nμ, nσ²)，x̄ ≈ N(μ, σ²/n)']],
['推断神殿',['E(x̄)=μ，D(x̄)=σ²/n，E(S²)=σ²（S² 分母用 n−1）','正态总体：(n−1)S²/σ² ~ χ²(n−1)','σ 已知：(x̄−μ)/(σ/√n) ~ N(0,1)；σ 未知：(x̄−μ)/(S/√n) ~ t(n−1)','F 分布用于两总体方差比；t 分布 n→∞ 时趋于 N(0,1)','矩估计：理论矩 = 样本矩（指数 λ̂=1/x̄，U(0,θ) θ̂=2x̄）','极大似然：最大化 L(θ)=∏ f(xᵢ;θ)（伯努利 p̂=k/n，泊松 λ̂=x̄）','评价：无偏 E(θ̂)=θ；有效性比方差；一致性 n→∞','区间估计（σ 已知）：x̄ ± z_{α/2}·σ/√n，z：1.645 / 1.96 / 2.576','假设检验：Z=(x̄−μ₀)/(σ/√n)；σ 未知换 t；检验方差用 χ²=(n−1)S²/σ₀²','两类错误：一弃真（α）、二取伪（β）；n 固定时此消彼长','回归：b̂=Sxy/Sxx，â=ȳ−b̂x̄；b̂ = x 每增 1，y 平均变化量']]];
