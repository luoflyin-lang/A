.node{border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--pan2);cursor:pointer;font-size:.9em;margin-bottom:6px}

details{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-top:8px}

/* --- 知识卡 --- */
function C(id,era,name,en,rar,intu,def,formula,myth,news,effect){
 CONTENT.cards.push({id:id,era:era,name:name,en:en,rarity:rar,intu:intu,def:def,formula:formula,myth:myth,news:news,effect:effect});

C("scarcity",1,"稀缺性","Scarcity","C","你一天只有 24 小时，想做的事却有 40 小时的量。","欲望无限而可用资源有限，因此必须配置。","无","稀缺不等于贫穷：亿万富翁的时间也稀缺。","'医疗资源紧张'本质是稀缺下的排序问题。","回合开局显示本回合资源上限。");
C("oppcost",1,"机会成本","Opportunity Cost","R","排队 3 小时抢 30 元奶茶，代价是那 3 小时本可做的最好的事。","选择某方案时被放弃的价值最高的其他方案的价值。","机会成本 = 放弃的最优备选价值","误以为只有花出去的钱才是成本；'免费'常常最贵。","讨论巨额基建时，真问题是这笔钱的其他用途。","决策界面显示每个选项被放弃的隐含收益。");
C("marginal",1,"边际思维","Marginal Thinking","R","要不要再吃一块蛋糕，只看'这一块'，不看已吃掉的。","理性决策比较增加一单位行动的边际收益与边际成本。","MB = MC 时最优","用平均值代替边际值决策，例如按平均成本定价而亏损。","航空公司卖尾单低价票：高于边际成本就赚。","解锁边际收益/成本数值提示。");
C("sunk",1,"沉没成本","Sunk Cost","C","电影很难看，票钱已付，走出影院才是理性的。","已发生且不可收回的支出，与后续决策无关。","决策只看未来现金流","'都投了这么多不能放弃'是谬误，不是坚持。","亏损项目被不断追加投资，最终损失更大。","免疫一次'继续投入'型陷阱。");
C("incentive",1,"激励","Incentives","C","押金制的共享单车，车总停得更整齐。","人对成本收益变化的系统性反应。","行为 = f(相对价格与奖惩)","忽视意外后果：塑料袋收费后更厚的袋子销量上升。","补贴改变了购买时间分布，而非总量。","预测后果时提示'人们会怎么钻空子'。");
C("compadv",1,"比较优势","Comparative Advantage","R","医生打字比助理快，仍该请助理，因为医生时间更值钱。","机会成本更低的一方专业化生产该产品，交易后双方都变好。","比较 OC 而非绝对产量","以为绝对生产率低就不能得益于贸易。","贸易战讨论中'什么都自己造'忽略了机会成本。","贸易类事件收益 +20%。");
C("ppf",1,"生产可能性边界","PPF","C","厨房时间在做菜与洗碗之间分配的极限。","给定技术与要素下可生产的产出组合外沿。","边界斜率 = 转换的机会成本","以为境内点也是有效的；那是资源闲置。","产能利用率讨论的就是与边界的距离。","解锁产能上限可视化。");
C("invhand",1,"看不见的手","Invisible Hand","R","没人下令，早餐摊却总在通勤路上出现。","竞争与产权明确时，价格信号引导自利行为达成有效配置。","竞争 + 产权 + 信息 -> 有效率","外部性、垄断、信息不对称存在时这只手会失灵。","限价导致缺货，是价格信号被掐断的结果。","市场化选项成功率 +10%。");
C("supdem",2,"供求与均衡","Supply and Demand","C","雨天打车的人变多，价格自然被顶上去。","价格调整至需求量等于供给量，形成均衡。","Qd(P) = Qs(P)","把'需求变化'与'需求量变化'混为一谈。","猪肉价波动几乎总能拆成供给或需求冲击。","解锁供求沙盒的精确均衡读数。");
C("elast",2,"弹性","Elasticity","R","盐涨价你照买，机票涨价你换日期。","一个变量对另一个变量变化的百分比敏感度。","Ed = (%dQ)/(%dP)","以为涨价一定增收；|Ed|>1 时涨价反而减收。","油价上涨对通胀的传导取决于弹性。","满级可读出需求曲线任意点的精确弹性值。");
C("surplus",2,"消费者与生产者剩余","Surplus","C","你愿付 50 元、实付 30 元，那 20 元就是你赚到的。","愿付价与实付价之差的加总（生产者反之）。","CS = 需求曲线下、价格上的面积","把剩余当成利润；它是福利度量，不是会计数字。","反垄断案中的损害计算就是剩余转移与损失。","福利计算题给出图形辅助。");
C("dwl",2,"税收与无谓损失","Deadweight Loss","R","税像给交易加一道摩擦，有些本该发生的买卖没发生。","因价格扭曲而产生的、没进任何人口袋的福利损失。","DWL ≈ 0.5 x t x dQ","以为税负由法定纳税人承担；实则按弹性分摊。","消费税调整时'谁真正掏钱'之争。","税收类事件可预览无谓损失大小。");
C("pricectl",2,"价格管制","Price Control","C","把温度计按住，房间不会真的变凉。","限价或保护价使价格偏离均衡，产生短缺或过剩与非价格配给。","P_cap < P* -> 短缺","以为限价保护穷人；排队、黑市与降质常抵消好处。","租金管制城市的空置与转租乱象。","识别管制类陷阱事件。");
C("costs",2,"成本结构与规模经济","Cost Structure","C","开工厂的底底固定成本，产量越大摄销越轻。","固定、可变、边际与平均成本共同塑造厂商供给决策。","ATC = FC/q + VC/q；MC = dTC/dq","把平均成本当停产标准；短期只要 P > AVC 就该继续生产。","制造业产能利用率与单位成本报道。","解锁成本曲线沙盒的最优产量标注。");
C("monopoly",2,"垄断与市场结构","Monopoly","R","全镇只有一口井，井主定价的自由度就是市场势力。","厂商面对向下倾斜需求曲线，在 MR=MC 处定价高于边际成本。","MR = MC，P > MC","以为大公司必然是垄断；关键是可竞争性与进入壁垒。","平台'二选一'与自我优待的反垄断调查。","解锁市场势力与加成率读数。");
C("gametheory",2,"博弈与纳什均衡","Nash Equilibrium","R","两家外卖同时补贴，谁先停谁先丢单，于是都在烧钱。","给定他人策略，无人有单方面改变策略的动机。","最优反应的交点","以为纳什均衡一定是最优结果；囚徒困境说不是。","价格战、军备竞赛、减产协议同一结构。","对手行为预测准确度提升。");
C("external",2,"外部性与科斯定理","Externality","R","楼上装修的噪音没写进他的账单，却写进了你的睡眠。","决策成本或收益溢出给第三方，使私人与社会最优偏离。","社会边际成本 = 私人 + 外部成本","以为只能靠禁令；产权清晰下谈判或定价往往更有效。","碳定价、拥堵费、排污权交易。","环境类事件可选'定价'高分解法。");
C("asymm",2,"信息不对称","Asymmetric Information","R","二手车市场里，卖家永远比你更懂那辆车。","交易一方掌握更多信息，产生逆向选择与道德风险。","逆向选择（事前）/ 道德风险（事后）","以为多披露就够；信号与激励机制设计才是关键。","保险定价、员工期权、平台评分体系。","识别隐藏信息型事件的伪装选项。");

/* --- 题目 --- */
function Q(id,era,c,type,q,opts,ans,explain,steps){
 CONTENT.qs.push({id:id,era:era,card:c,type:type,q:q,opts:opts,ans:ans,explain:explain,steps:steps||""});
}
Q("q1",1,"oppcost","calc","你放弃时薪 80 元的兼职，去看一场票价 100 元、时长 3 小时的电影。经济成本是？",["100 元","240 元","340 元","无法计算"],2,"经济成本 = 显性成本 + 隐性（机会）成本。","显性：票价 100 元。隐性：80 x 3 = 240 元。合计 340 元。");
Q("q2",1,"sunk","trap","项目已投 800 万，再投 300 万可获得预期 250 万收益。理性选择？",["追加，否则 800 万白花","不追加，增量净值为负","追加一半","取决于已投入金额"],1,"已投入是沉没成本，只比较增量。","增量净值 = 250 - 300 = -50 万 < 0，故不追加。已投的 800 万无论如何选择都拿不回来。");
Q("q3",1,"marginal","calc","工厂平均成本 60 元，边际成本 35 元，市场价 45 元。短期应？",["停产","增产","减产","提价到 60 元"],1,"短期看边际：价格高于边际成本就应扩产。","P=45 > MC=35，每多产一单位增利 10 元。平均成本含固定成本，与短期产量决策无关。");
Q("q4",1,"compadv","case","甲国生产 1 单位布放弃 3 单位粮，乙国放弃 5 单位粮。谁在布上有比较优势？",["甲国","乙国","都没有","取决于绝对产量"],0,"比较优势看机会成本高低。","甲国布的机会成本 3 小于乙国 5，故甲国专业化生产布，乙国产粮，交易后双方消费可能性扩大。");
Q("q5",1,"incentive","case","塑料袋收费 0.5 元后袋子总重量反而上升，最可能原因？",["统计错误","消费者转向更厚的可重复使用袋","需求完全无弹性","价格太高"],1,"激励改变行为方向，常有意外后果。","");
Q("q6",1,"ppf","graph","经济体位于 PPF 境内点，含义是？",["技术倒退","存在资源闲置或低效配置","已达最优","不可能出现"],1,"境内点意味着未充分利用资源。","");
Q("q7",2,"elast","calc","价格从 10 元升到 11 元，需求量从 100 降到 85。需求价格弹性约为？",["-0.15","-1.5","-1.0","-15"],1,"|Ed| 大于 1，富有弹性，涨价会减少总收入。","%dQ = -15/100 = -15%；%dP = 1/10 = 10%；Ed = -15%/10% = -1.5。总收入：原 1000 元 -> 新 935 元，确实下降。");
Q("q8",2,"dwl","calc","每件征税 4 元，交易量从 1000 件降至 800 件。无谓损失约为？",["400 元","800 元","3200 元","4000 元"],0,"DWL 是税收三角形面积；政府税收属于转移，不是损失。","DWL = 0.5 x t x dQ = 0.5 x 4 x 200 = 400 元。税收 = 4 x 800 = 3200 元。");
Q("q9",2,"dwl","concept","税负更多落在哪一方？",["法定纳税人","弹性更小的一方","弹性更大的一方","永远五五分"],1,"税负按相对弹性分摊，越缺乏弹性越难转移。","买方承担比例 = 供给斜率/(供给斜率+需求斜率)，可在供求沙盒里拖滑块验证。");
Q("q10",2,"pricectl","graph","限价低于均衡价时，市场最可能出现？",["过剩与降价","短缺、排队与黑市","均衡不变","供给增加"],1,"价格被压低，需求量大于供给量，出现非价格配给。","");
Q("q11",2,"gametheory","case","一次性囚徒困境的纳什均衡是？",["双方合作","双方背叛","一方合作一方背叛","不存在均衡"],1,"个体理性导致集体次优；重复博弈与可信承诺才能维持合作。","");
Q("q12",2,"asymm","concept","车险投保后驾驶更冒险，属于？",["逆向选择","道德风险","信号传递","逆向工程"],1,"事后行为改变为道德风险；事前隐藏类型为逆向选择。","");

/* 绘图工具 */
function gAxes(g,W,H,xl,yl){
 g.clearRect(0,0,W,H);
 g.strokeStyle="#3a4356";g.lineWidth=1;
 g.beginPath();g.moveTo(46,10);g.lineTo(46,H-28);g.lineTo(W-10,H-28);g.stroke();
 g.fillStyle="#8e9bb0";g.font="12px sans-serif";
 g.fillText(xl,W-78,H-10);g.fillText(yl,6,16);
}
function gLine(g,pts,color,dash){
 if(!pts.length)return;
 g.save();g.strokeStyle=color;g.lineWidth=2;if(dash)g.setLineDash([5,4]);
 g.beginPath();
 for(var i=0;i<pts.length;i++){if(i===0)g.moveTo(pts[i][0],pts[i][1]);else g.lineTo(pts[i][0],pts[i][1]);}
 g.stroke();g.restore();
}
function gPoly(g,pts,color){
 g.save();g.fillStyle=color;g.beginPath();
 for(var i=0;i<pts.length;i++){if(i===0)g.moveTo(pts[i][0],pts[i][1]);else g.lineTo(pts[i][0],pts[i][1]);}
 g.closePath();g.fill();g.restore();
}
function gDot(g,x,y,color,label){
 g.fillStyle=color;g.beginPath();g.arc(x,y,4,0,6.2832);g.fill();
 if(label){g.fillStyle="#e7ebf2";g.font="12px sans-serif";g.fillText(label,x+7,y-7);}
}
function gText(g,s,x,y,color){g.fillStyle=color||"#8e9bb0";g.font="12px sans-serif";g.fillText(s,x,y);}

/* 沙盒1：供求、税收与无谓损失（需求 P=100-bQ，供给 P=10+dQ） */
SB("sd",2,"供求与税收无谓损失","先把税拉到 20，再把需求斜率从 0.3 拉到 2：观察买方承担份额与三角形面积如何变化，并自问为什么。",
 [{k:"b",label:"需求斜率 b（越大越缺乏弹性）",min:0.3,max:2,step:0.1,v:0.8},
  {k:"d",label:"供给斜率 d",min:0.3,max:2,step:0.1,v:0.6},
  {k:"t",label:"单位税 t",min:0,max:30,step:1,v:0}],
 function(g,W,H,p){
  var a=100,c=10,X=function(q){return 46+q*(W-62)/120;},Y=function(pr){return H-28-pr*(H-46)/110;};
  gAxes(g,W,H,"数量 Q","价格 P");
  var qs=(a-c)/(p.b+p.d),ps=c+p.d*qs;
  var qt=Math.max(0,(a-c-p.t)/(p.b+p.d)),pb=a-p.b*qt,psell=pb-p.t;
  gPoly(g,[[X(qt),Y(pb)],[X(qt),Y(psell)],[X(qs),Y(ps)]],"rgba(255,107,107,.35)");
  var i,dm=[],sp=[],sp2=[];
  for(i=0;i<=120;i+=2){dm.push([X(i),Y(Math.max(0,a-p.b*i))]);sp.push([X(i),Y(c+p.d*i)]);sp2.push([X(i),Y(c+p.t+p.d*i)]);}
  gLine(g,dm,"#4da3ff");gLine(g,sp,"#3ddc97");if(p.t>0)gLine(g,sp2,"#ffb454",true);
  gDot(g,X(qs),Y(ps),"#e7ebf2","无税均衡");
  if(p.t>0){gDot(g,X(qt),Y(pb),"#ffb454","买方价");gDot(g,X(qt),Y(psell),"#ff6b6b","卖方价");}
  gText(g,"蓝=需求  绿=供给  橙虚线=含税供给  红区=无谓损失",56,22);
  var dwl=0.5*p.t*(qs-qt),rev=p.t*qt,bs=p.d/(p.b+p.d);
  return "无税均衡：Q*="+f1(qs)+"，P*="+f1(ps)+"<br>含税：Q="+f1(qt)+"，买方付 "+f1(pb)+"，卖方得 "+f1(psell)+
   "<br>政府税收："+f1(rev)+"（转移）；<b>无谓损失 DWL = 0.5 x t x dQ = "+f1(dwl)+"</b>"+
   "<br>税负分摊：买方承担 "+Math.round(bs*100)+"%，卖方承担 "+Math.round((1-bs)*100)+
   "%。<br><span class=\"mut\">结论：弹性越小（斜率越大）的一方承担越多税负，且交易量降得越少、无谓损失越小。</span>";
 });

/* 沙盒2：弹性与总收入（需求 Q = 100 - B·P） */
SB("el",2,"弹性与总收入","把价格从低拖到高，盯住总收入曲线的顶点：顶点恰好出现在 |Ed|=1 处，想想为什么。",
 [{k:"P",label:"当前价格 P",min:5,max:95,step:1,v:30},{k:"B",label:"需求敏感度 B",min:0.5,max:3,step:0.1,v:1}],
 function(g,W,H,p){
  var A=100,X=function(q){return 46+q*(W-62)/110;},Y=function(pr){return H-28-pr*(H-46)/110;};
  gAxes(g,W,H,"数量 Q","价格 P / 收入标尺");
  var i,dm=[],tr=[],maxTR=0,q;
  for(i=0;i<=100;i+=1){q=A-p.B*i;if(q>=0&&i*q>maxTR)maxTR=i*q;}
  for(i=0;i<=100;i+=1){q=A-p.B*i;if(q<0)continue;dm.push([X(q),Y(i)]);tr.push([X(q),Y(maxTR>0?(i*q)/maxTR*100:0)]);}
  gLine(g,dm,"#4da3ff");gLine(g,tr,"#ffb454",true);
  var Q=Math.max(0.01,A-p.B*p.P),Ed=-p.B*p.P/Q,TR=p.P*Q;
  gDot(g,X(Q),Y(p.P),"#3ddc97","P="+p.P);
  gText(g,"蓝=需求曲线  橙虚线=总收入（归一化）",56,22);
  return "Q = 100 - "+f1(p.B)+" x P = "+f1(Q)+"；总收入 TR = P x Q = "+f1(TR)+
   "<br><b>点弹性 Ed = -B x P/Q = "+f2(Ed)+"</b>（"+(Math.abs(Ed)>1?"富有弹性：降价增收":(Math.abs(Ed)<1?"缺乏弹性：涨价增收":"单位弹性：收入极大"))+"）"+
   "<br><span class=\"mut\">结论：同一条直线需求曲线上，弹性不是常数——高价区富有弹性，低价区缺乏弹性。</span>";
 });

/* 沙盒3：成本曲线与厂商产量决策（MC = a·q，ATC = FC/q + a·q/2） */
SB("cost",2,"成本曲线与产量决策","把价格拖到低于 ATC 最低点但高于 AVC：企业亏损却仍应继续生产，试着解释原因。",
 [{k:"FC",label:"固定成本 FC",min:50,max:600,step:10,v:200},{k:"a",label:"边际成本斜率 a",min:0.2,max:2,step:0.1,v:2},{k:"P",label:"市场价格 P",min:5,max:100,step:1,v:40}],
 function(g,W,H,p){
  var X=function(q){return 46+q*(W-62)/60;},Y=function(v){return H-28-v*(H-46)/120;};
  gAxes(g,W,H,"产量 q","单位成本 / 价格");
  var i,mc=[],atc=[],avc=[];
  for(i=1;i<=60;i++){mc.push([X(i),Y(p.a*i)]);atc.push([X(i),Y(p.FC/i+p.a*i/2)]);avc.push([X(i),Y(p.a*i/2)]);}
  gLine(g,mc,"#ff6b6b");gLine(g,atc,"#4da3ff");gLine(g,avc,"#8e9bb0",true);
  gLine(g,[[X(0),Y(p.P)],[X(60),Y(p.P)]],"#3ddc97");
  var q=clamp(p.P/p.a,0,60),atcq=p.FC/Math.max(0.01,q)+p.a*q/2,avcq=p.a*q/2;
  var prof=(p.P-atcq)*q,qmin=Math.sqrt(2*p.FC/p.a);
  gDot(g,X(q),Y(p.P),"#ffb454","q*="+f1(q));
  gText(g,"红=MC  蓝=ATC  灰虚线=AVC  绿=价格",56,22);
  return "最优产量（P = MC）：q* = P/a = "+f1(q)+"；ATC = "+f1(atcq)+"，AVC = "+f1(avcq)+
   "<br><b>利润 = (P - ATC) x q = "+f1(prof)+"</b>；ATC 最低点位于 q = sqrt(2FC/a) = "+f1(qmin)+
   "<br><span class=\"mut\">结论：短期停产条件是 P < AVC，不是 P < ATC——固定成本已经沉没。</span>";
 });

/* 随机种子：Seed 可分享，决定经济体、流派、事件与冲击序列 */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
var RNG=mulberry32(1),S=null,VIEW="home",SBID=null,MSG="";
function rnd(){return RNG();}
function ri(n){return Math.floor(rnd()*n);}
function pick(a){return a[ri(a.length)];}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function f1(x){return (Math.round(x*10)/10).toFixed(1);}
function f2(x){return (Math.round(x*100)/100).toFixed(2);}
function money(x){var s=x<0?"-":"";x=Math.abs(x);if(x>=1e8)return s+f2(x/1e8)+" 亿";if(x>=1e4)return s+f1(x/1e4)+" 万";return s+Math.round(x);}
function esc(s){return String(s===undefined||s===null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");}
function today(){return Math.floor(Date.now()/86400000);}
function findBy(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}
function cardOf(id){return findBy(CONTENT.cards,id);}
function bossOf(era){for(var i=0;i<CONTENT.bosses.length;i++){if(CONTENT.bosses[i].era===era)return CONTENT.bosses[i];}return null;}
function eraObj(era){for(var i=0;i<CONTENT.eras.length;i++){if(CONTENT.eras[i].id===era)return CONTENT.eras[i];}return CONTENT.eras[0];}
function eraName(era){return eraObj(era).name;}
function roleOf(era){return eraObj(era).role;}
function maxEra(){var m=1,i;for(i=0;i<CONTENT.events.length;i++){if(CONTENT.events[i].era<8&&CONTENT.events[i].era>m)m=CONTENT.events[i].era;}return m;}
function diffName(d){return d==="easy"?"解释模式":(d==="master"?"硕士模式":"标准模式");}

function newGame(seed,mode,diff){
 RNG=mulberry32(seed);
 var eco=pick(CONTENT.economies),sch=pick(CONTENT.schools),i;

       i:eco.rStar+eco.pi,gap:0,g:eco.gTrend,gTrend:eco.gTrend,open:eco.open},
  res:{cash:200000,nw:200000,approval:52,prestige:0,cog:6,rating:"A"},
  cards:{},prog:{},mistakes:[],ach:[],log:[],seenEv:[],
  stats:{turns:0,answered:0,correct:0,reviews:0,bosses:0,best:0,trap:0,stable:0},
  settings:{fs:(S&&S.settings?S.settings.fs:15),newCap:8},cur:null,over:false};
 for(i=0;i<CONTENT.cards.length;i++){if(CONTENT.cards[i].era===1)unlock(CONTENT.cards[i].id);}

function unlock(id){if(!S.cards[id]){S.cards[id]={lvl:1,ef:2.5,rep:0,ivl:0,due:today(),streak:0,ok:0,bad:0};return true;}return false;}

/* ---- 宏观模型（公式即教学内容，界面「模型透视」实时展示）
   1) 支出乘数      k = 1/(1 - MPC)
   2) 产出缺口      gap' = 0.72·gap + 0.4·k·fiscal - 0.85·rate - 1.2·|shock|
   3) 奥肯定律      u = u_n - 0.5·gap
   4) 预期适应      pi_e' = 0.6·pi_e + 0.4·pi
   5) 菲利普斯      pi = pi_e - 0.6·(u - u_n) + 供给冲击
   6) 泰勒规则      i = r* + pi + 0.5·(pi - target) + 0.5·gap
   7) 实际增长      g = gTrend + 0.5·(gap - gap_prev)
   8) 复利/实际利率 nw' = nw·(1 + (i - pi)/400)   （季度频率） ---- */
function stepEconomy(eff){
 eff=eff||{};
 var e=S.eco,r=S.res,k=1/(1-e.mpc),gapPrev=e.gap;
 var fis=(eff.fiscal||0)*(S.school==="keynes"?1.25:(S.school==="monetarist"?0.8:1));
 e.gap=clamp(0.72*e.gap+0.4*k*fis-0.85*(eff.rate||0)-1.2*Math.abs(eff.shock||0),-9,9);
 e.u=clamp(e.un-0.5*e.gap,0.4,28);
 e.piE=0.6*e.piE+0.4*e.pi;
 e.pi=clamp(e.piE-0.6*(e.u-e.un)+(eff.supply||0),-4,45);
 e.i=clamp(e.rStar+e.pi+0.5*(e.pi-e.target)+0.5*e.gap+(eff.rate||0),0,40);
 e.g=clamp(e.gTrend+0.5*(e.gap-gapPrev),-11,14);
 r.cash+=(eff.cash||0);
 r.nw=Math.round((r.nw+(eff.cash||0))*(1+(e.i-e.pi)/400));
 r.approval=clamp(r.approval+(eff.approval||0)-(e.pi>e.target+3?1.2:0)-(e.u>e.un+1.5?1.2:0)+(e.g>e.gTrend?0.8:0),0,100);
 r.prestige+=(eff.prestige||0);r.cog+=(eff.cog||0);
 r.rating=r.nw<=0?"D":(e.pi<e.target+2&&r.approval>45?"AA":(r.approval<25?"BBB":"A"));
 if(Math.abs(e.pi-e.target)<=1)S.stats.stable++;else S.stats.stable=0;
 S.log.push({t:S.turn,gap:e.gap,u:e.u,pi:e.pi,i:e.i,nw:r.nw});
 if(S.log.length>60)S.log.shift();
 if(r.nw<=0)S.over=true;
}

/* ---- SM-2 间隔重复：ivl=稳定度，ef=难度因子，due=到期日，streak=连续正确 ---- */
function srs(cs,ok,hard){
 if(!cs)return;
 cs.rep++;S.stats.reviews++;
 if(ok){
  cs.ok++;cs.streak++;
  var q=hard?3:5;
  cs.ef=Math.max(1.3,cs.ef+(0.1-(5-q)*0.08));
  if(cs.ivl===0)cs.ivl=1;else if(cs.ivl===1)cs.ivl=6;else cs.ivl=Math.round(cs.ivl*cs.ef);
  if(cs.streak%2===0)cs.lvl=Math.min(5,cs.lvl+1);
 }else{
  cs.bad++;cs.streak=0;cs.ef=Math.max(1.3,cs.ef-0.2);cs.ivl=1;cs.lvl=Math.max(1,cs.lvl-1);
 }
 cs.due=today()+cs.ivl;
}
/* 遗忘曲线：R = exp(-已过天数 / (1.6·稳定度)) */
function retention(cs){var el=Math.max(0,today()-(cs.due-cs.ivl)),iv=Math.max(1,cs.ivl);return clamp(Math.exp(-el/(iv*1.6)),0,1);}
function dueCards(){var a=[],k;for(k in S.cards){if(S.cards[k].due<=today())a.push(k);}return a;}

/* ---- 回合推进与遭遇（到期复习以剧情/提问/侦探三种形态随机出现） ---- */
function prog(era){if(!S.prog[era])S.prog[era]={ev:0,boss:false};return S.prog[era];}
function eventPool(){
 var a=[],i,e;
 for(i=0;i<CONTENT.events.length;i++){e=CONTENT.events[i];
  if(e.era<=S.era||(e.era===8&&S.era>=4)){if(S.seenEv.indexOf(e.id)<0)a.push(e);}}
 return a;
}
function nextEncounter(){
 S.turn++;S.stats.turns++;S.quarter++;if(S.quarter>4){S.quarter=1;S.year++;}
 var pr=prog(S.era);
 if(pr.ev>=4&&!pr.boss&&bossOf(S.era)){S.cur={k:"boss",era:S.era,stage:0,score:[],chosen:-1};return;}
 var due=dueCards();
 if(due.length>0&&rnd()<0.45){startReview(due[ri(due.length)]);return;}
 var pool=eventPool();
 if(!pool.length){S.seenEv=[];pool=eventPool();}
 if(!pool.length){startReview(Object.keys(S.cards)[0]);return;}
 S.cur={k:"event",id:pool[ri(pool.length)].id,chosen:-1};
}
function startReview(cardId){
 if(!cardId){S.cur=null;return;}
 var qs=[],i;
 for(i=0;i<CONTENT.qs.length;i++){if(CONTENT.qs[i].card===cardId)qs.push(CONTENT.qs[i]);}
 var q=qs.length?qs[ri(qs.length)]:genQ(cardId);
 S.cur={k:"review",card:cardId,q:q,form:["drama","press","detective"][ri(3)],chosen:-1};
}
/* 无题库时自动生成主动回忆题（交错练习：干扰项取自其他纪元） */
function genQ(cardId){
 var c=cardOf(cardId),others=[],i;
 for(i=0;i<CONTENT.cards.length;i++){if(CONTENT.cards[i].id!==cardId)others.push(CONTENT.cards[i]);}
 var opts=[c.intu,pick(others).intu,pick(others).intu],ord=[0,1,2],ans=0,arr=[];
 for(i=2;i>0;i--){var j=ri(i+1),t=ord[i];ord[i]=ord[j];ord[j]=t;}
 for(i=0;i<3;i++){arr.push(opts[ord[i]]);if(ord[i]===0)ans=i;}
 return {id:"gen_"+cardId,era:c.era,card:cardId,type:"concept",
  q:"下面哪句话准确描述了「"+c.name+"」的直觉？",opts:arr,ans:ans,
  explain:c.def+"（常见误解："+c.myth+"）",steps:""};
}
function recordMistake(card,title,why){
 S.mistakes.push({card:card||"",title:title,why:why,t:S.turn});
 if(S.mistakes.length>80)S.mistakes.shift();
}
function chooseEvent(i){
 if(!S.cur||S.cur.k!=="event"||S.cur.chosen>=0)return;
 var ev=findBy(CONTENT.events,S.cur.id);if(!ev)return;
 var op=ev.opts[i];if(!op)return;
 S.cur.chosen=i;
 unlock(op.card);
 srs(S.cards[op.card],op.score>=2,op.score===1);
 if(op.score>=2)S.stats.best++;
 if(op.score===0)recordMistake(op.card,ev.title,op.fb);
 stepEconomy(op.eff);
 prog(S.era).ev++;S.seenEv.push(ev.id);
 checkAch();save();render();
}
function answerReview(i){
 if(!S.cur||S.cur.k!=="review"||S.cur.chosen>=0)return;
 S.cur.chosen=i;
 var q=S.cur.q,ok=(i===q.ans);
 S.stats.answered++;
 if(ok){S.stats.correct++;if(q.type==="trap"||q.type==="case")S.stats.trap++;}
 srs(S.cards[S.cur.card],ok,false);
 if(!ok)recordMistake(S.cur.card,q.q,q.explain);
 stepEconomy({cog:ok?2:0,prestige:ok?0.5:0});
 checkAch();save();render();
}
function bossChoose(i){
 if(!S.cur||S.cur.k!=="boss"||S.cur.chosen>=0)return;
 var b=bossOf(S.cur.era),st=b.stages[S.cur.stage];
 S.cur.chosen=i;
 var ok=(i===st.ans);
 S.cur.score.push(ok?1:0);S.stats.answered++;
 if(ok)S.stats.correct++;else recordMistake(null,st.q,st.explain);
 save();render();
}
function bossNext(){
 var b=bossOf(S.cur.era),i,sum=0;
 if(S.cur.stage<b.stages.length-1){S.cur.stage++;S.cur.chosen=-1;save();render();return;}
 for(i=0;i<S.cur.score.length;i++)sum+=S.cur.score[i];
 if(sum>=Math.ceil(b.stages.length*0.6)){
  prog(S.era).boss=true;S.stats.bosses++;S.res.prestige+=5;
  var n=0;
  for(i=0;i<CONTENT.cards.length;i++){if(CONTENT.cards[i].era===S.era+1&&n<6){if(unlock(CONTENT.cards[i].id))n++;}}
  if(S.era<maxEra())S.era++;
  MSG="Boss 通过（"+sum+"/"+b.stages.length+"）：晋升为「"+roleOf(S.era)+"」，已解锁新纪元卡组。";
 }else{
  prog(S.era).ev=2;
  MSG="Boss 未通过（"+sum+"/"+b.stages.length+"）：错题已进入错题本，再推两个回合可重新挑战。";
 }
 checkAch();nextEncounter();save();render();
}
function checkAch(){
 var i,a;
 for(i=0;i<CONTENT.ach.length;i++){a=CONTENT.ach[i];
  if(S.ach.indexOf(a.id)<0){try{if(a.test(S)){S.ach.push(a.id);MSG="成就解锁：「"+a.name+"」——"+a.desc;}}catch(e){}}}
 if(S.mode==="daily"&&S.turn>=12&&!S.over){S.over=true;S.daily=true;}
}

function vHand(){
 var due=dueCards(),arr=[],k,i,c,cs,h="";
 h+="<div class=\"pan\"><h3>到期复习</h3>"+(due.length?"<div class=\"sm\">共 "+due.length+" 张到期。"+btn("进入复习中心 (R)","go","review")+"</div>":"<div class=\"sm mut\">暂无到期卡片，继续推进回合即可。</div>")+"</div>";

 arr.sort(function(a,b){return S.cards[b].lvl-S.cards[a].lvl;});
 h+="<div class=\"pan\"><h3>手牌 · 知识卡（"+arr.length+"）</h3>";
 for(i=0;i<arr.length;i++){c=cardOf(arr[i]);cs=S.cards[arr[i]];if(!c)continue;
  h+="<div class=\"card\" data-act=\"card\" data-arg=\""+c.id+"\"><div class=\"b\">"+esc(c.name)+" <span class=\"mut sm\">"+esc(c.en)+"</span></div><div class=\"sm mut\">掌握 "+cs.lvl+"/5 · 稀有度 "+c.rarity+" · 记忆强度 "+Math.round(retention(cs)*100)+"%"+(cs.due<=today()?" · 已到期":"")+"</div>"+bar(cs.lvl/5,cs.due<=today()?"#ffb454":"#3ddc97")+"</div>";
 }
 return h+"</div>";
}
function vMap(){
 var h=nav()+"<div class=\"pan\"><h2>知识地图 · 科技树</h2><div class=\"sm mut\">节点颜色越浅 = 记忆越褶色，需要复习。未解锁纪元需先通过前置 Boss。</div></div>";

  for(j=0;j<CONTENT.cards.length;j++){c=CONTENT.cards[j];if(c.era!==er.id)continue;
   cs=S?S.cards[c.id]:null;

  }

 var h=nav()+"<div class=\"pan\"><h2>沙盒实验室</h2><div class=\"sm mut\">每个沙盒都有「试试这个」引导实验与结论提示。拖滑块时数字与图形实时联动。</div></div><div class=\"grid2\">";

 }

}
function vSandbox(){
 var sb=findBy(CONTENT.sandboxes,SBID);
 if(!sb)return vLab();
 var h=nav()+"<div class=\"pan\"><h2>"+esc(sb.name)+"</h2><div class=\"pan2 sm\">试试这个："+esc(sb.tip)+"</div><canvas id=\"sbc\"></canvas><div class=\"pan2 sm\" id=\"sbout\" style=\"margin-top:10px\"></div>";
 for(var i=0;i<sb.params.length;i++){

function sbDraw(){

 var cv=document.getElementById("sbc");if(!cv)return;
 var W=cv.clientWidth||600,H=330,p={},i;
 cv.width=W;cv.height=H;
 for(i=0;i<sb.params.length;i++)p[sb.params[i].k]=sb.params[i].v;

function vReview(){
 if(!S)return vHome();
 var due=dueCards(),arr=[],k,i,cs,c,h=nav();
 for(k in S.cards)arr.push(k);
 arr.sort(function(a,b){return retention(S.cards[a])-retention(S.cards[b]);});
 h+="<div class=\"pan\"><h2>晨间简报</h2><div>今日到期 <b>"+due.length+"</b> 张；已解锁 "+arr.length+" 张；累计复习 "+S.stats.reviews+" 次；正确率 "+(S.stats.answered?Math.round(S.stats.correct/S.stats.answered*100):0)+"%。</div>";
 h+="<div class=\"sm mut\">主动回忆优先：先自己说出答案，再看选项。交错练习会把不同纪元的概念混在一起考。</div>";
 h+="<div style=\"margin-top:8px\">"+(due.length?btn("开始复习最褶色的一张","drill",arr[0],"pri"):btn("提前复习最褶色的一张","drill",arr[0]))+"</div></div>";
 h+="<div class=\"pan\"><h3>遗忘曲线（记忆强度 R = exp(-已过天数 / 1.6·稳定度)）</h3>";
 for(i=0;i<arr.length&&i<14;i++){cs=S.cards[arr[i]];c=cardOf(arr[i]);if(!c)continue;
  h+="<div style=\"margin-bottom:7px\"><div class=\"sm\">"+esc(c.name)+" <span class=\"mut\">R="+Math.round(retention(cs)*100)+"% · 间隔 "+cs.ivl+" 天 · Lv"+cs.lvl+"</span></div>"+bar(retention(cs),retention(cs)<0.6?"#ff6b6b":"#3ddc97")+"</div>";
 }
 h+="</div>";
 h+="<div class=\"pan\"><h3>错题本（按概念聚类）</h3>";
 if(!S.mistakes.length)h+="<div class=\"sm mut\">暂无错题。</div>";
 var groups={},key;
 for(i=0;i<S.mistakes.length;i++){key=S.mistakes[i].card||"other";if(!groups[key])groups[key]=[];groups[key].push(S.mistakes[i]);}
 for(key in groups){
  c=cardOf(key);
  h+="<div class=\"pan2\"><div class=\"b\">"+(c?esc(c.name):"综合情景")+" · "+groups[key].length+" 条</div>";
  for(i=0;i<groups[key].length&&i<3;i++)h+="<div class=\"sm mut\">· "+esc(groups[key][i].why)+"</div>";
  if(c)h+=btn("一键专项特训","drill",key);
  h+="</div>";
 }
 return h+"</div>";
}
function eraMastery(list){
 var tot=0,got=0,i,c;
 for(i=0;i<CONTENT.cards.length;i++){c=CONTENT.cards[i];if(list.indexOf(c.era)<0)continue;tot++;if(S.cards[c.id])got+=S.cards[c.id].lvl/5;}
 return tot?got/tot:0;
}
function radarDims(){
 var acc=S.stats.answered?S.stats.correct/S.stats.answered:0;
 return [{k:"微观直觉",v:eraMastery([1,2])},{k:"宏观框架",v:eraMastery([3])},{k:"金融计算",v:eraMastery([5,6])},
  {k:"数据素养",v:clamp(eraMastery([8])*0.6+acc*0.4,0,1)},{k:"风险意识",v:eraMastery([4,7])},
  {k:"批判性思维",v:clamp(S.stats.trap/20*0.5+S.stats.best/20*0.5,0,1)}];
}
function drawRadar(){
 var cv=document.getElementById("rad");if(!cv)return;
 var W=cv.clientWidth||420,H=300;cv.width=W;cv.height=H;
 var g=cv.getContext("2d"),d=radarDims(),n=d.length,cx=W/2,cy=H/2+4,R=Math.min(W,H)/2-40,i,j,a,x,y;
 g.clearRect(0,0,W,H);
 for(j=1;j<=4;j++){g.strokeStyle="#28303f";g.beginPath();
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;x=cx+Math.cos(a)*R*j/4;y=cy+Math.sin(a)*R*j/4;if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}
  g.closePath();g.stroke();}
 g.fillStyle="rgba(77,163,255,.32)";g.strokeStyle="#4da3ff";g.lineWidth=2;g.beginPath();
 for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;x=cx+Math.cos(a)*R*clamp(d[i].v,0.02,1);y=cy+Math.sin(a)*R*clamp(d[i].v,0.02,1);if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}
 g.closePath();g.fill();g.stroke();
 g.font="12px sans-serif";g.fillStyle="#8e9bb0";
 for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;x=cx+Math.cos(a)*(R+18);y=cy+Math.sin(a)*(R+18);
  g.textAlign=Math.cos(a)>0.3?"left":(Math.cos(a)<-0.3?"right":"center");
  g.fillText(d[i].k+" "+Math.round(d[i].v*100),x,y);}
 g.textAlign="left";
}
function vReport(){
 if(!S)return vHome();
 var k,cnt=0,mast=0,ret=0,cs,h=nav();
 for(k in S.cards){cs=S.cards[k];cnt++;ret+=retention(cs);if(cs.lvl>=4)mast++;}
 var acc=S.stats.answered?Math.round(S.stats.correct/S.stats.answered*100):0;
 var level=mast>=100?"硕士入门":(mast>=60?"本科高年级":(mast>=25?"本科中级":"本科入门"));
 h+="<div class=\"pan\"><h2>学习报告</h2>"+kv("已解锁概念",cnt+" 个")+kv("掌握（4 级以上）",mast+" 个")+
  kv("平均记忆留存率",(cnt?Math.round(ret/cnt*100):0)+"%")+kv("答题正确率",acc+"%")+kv("完成回合",S.stats.turns+"")+
  kv("通过 Boss",S.stats.bosses+"")+kv("预估对应水平",level)+"</div>";
 h+="<div class=\"pan\"><h3>能力雷达</h3><canvas id=\"rad\"></canvas></div>";
 h+="<div class=\"pan\"><h3>成就（"+S.ach.length+"/"+CONTENT.ach.length+"）</h3>";
 for(var i=0;i<CONTENT.ach.length;i++){var a=CONTENT.ach[i],got=S.ach.indexOf(a.id)>=0;
  h+=tag(esc(a.name)+(got?" ✓":""),got?"ok":"");}
 h+="</div><div class=\"pan\">"+btn("查看通关证书","go","cert","pri")+btn("错题本与遗忘曲线","go","review")+"</div>";
 return h;
}
function vSettings(){
 var h=nav()+"<div class=\"pan\"><h2>设置</h2>";
 h+="<div class=\"sm mut\">字号：<b id=\"lb_fs\">"+(S?S.settings.fs:15)+"</b> px</div><input type=\"range\" id=\"fsr\" min=\"13\" max=\"22\" step=\"1\" value=\""+(S?S.settings.fs:15)+"\">";
 h+="<div style=\"margin-top:10px\" class=\"sm mut\">难度（当前："+(S?diffName(S.diff):"未开局")+"）</div><div class=\"row\">"+
  btn("解释模式","diff","easy")+btn("标准模式","diff","std")+btn("硕士模式（无提示·含陷阱）","diff","master")+"</div>";
 h+="<div style=\"margin-top:12px\"><h3>存档导出 / 导入（JSON 文本）</h3><textarea id=\"sbox\" rows=\"6\" placeholder=\"点「导出存档」后复制这里的文本；粘贴后点「导入存档」。\"></textarea><div class=\"row\" style=\"margin-top:8px\">"+
  btn("导出存档","expSave")+btn("导入存档","impSave")+btn("清空存档并重开","restart")+"</div></div>";
 h+="<div class=\"sm mut\" style=\"margin-top:10px\">快捷键：数字键 1-5 选选项，空格继续，R 打开复习中心。本游戏无音频，全部数据保存在本地。</div>";
 return h+"</div>";
}
function vCert(){
 if(!S)return vHome();
 var k,mast=[],cs;
 for(k in S.cards){cs=S.cards[k];if(cs.lvl>=4){var c=cardOf(k);if(c)mast.push(c.name);}}
 var h=nav()+"<div class=\"pan center\"><h1>通关证书</h1><div class=\"mut\">《经世：从稀缺到金融帝国》</div>"+
  "<div style=\"margin:14px 0\">持卡人已在 Seed "+S.seed+" 的经济体中存活 "+S.stats.turns+" 个季度，通过 "+S.stats.bosses+" 个纪元终局考核，掌握 "+mast.length+" 个概念至 4 级以上。</div>"+
  "<div class=\"sm mut\">"+esc(mast.join(" · "))+"</div><div class=\"sm mut\" style=\"margin-top:12px\">经济学不能预测未来；它只能让你把权衡看得更清楚。</div></div>";
 return h;
}
function vOver(){
 var h="<div class=\"pan center\"><h2>"+(S.daily?"每日挑战结束":"本局结束：资产净值归零")+"</h2>"+
  "<div>存活 "+S.stats.turns+" 个季度 · 正确率 "+(S.stats.answered?Math.round(S.stats.correct/S.stats.answered*100):0)+"% · 通过 Boss "+S.stats.bosses+" 个</div>"+
  "<div class=\"sm mut\">失败不惩罚：所有错题已进入错题本，卡牌掌握度与复习计划会跟着你进入下一局。</div>"+
  "<div class=\"row center\" style=\"justify-content:center;margin-top:10px\">"+btn("看学习报告","go","report","pri")+btn("再来一局（新种子）","newGame")+btn("首屏","go","home")+"</div></div>";
 return h;
}
function showCard(id){
 var c=cardOf(id);if(!c)return;
 var cs=S?S.cards[id]:null;
 var h="<h2>"+esc(c.name)+" <span class=\"mut sm\">"+esc(c.en)+"</span></h2>"+
  tag("稀有度 "+c.rarity,"acc")+tag(esc(eraName(c.era)))+(cs?tag("掌握 "+cs.lvl+"/5","ok")+tag("记忆强度 "+Math.round(retention(cs)*100)+"%"):tag("未解锁"))+
  "<div class=\"pan2\"><b>直觉类比：</b>"+esc(c.intu)+"</div>"+
  "<div class=\"pan2\"><b>精确定义：</b>"+esc(c.def)+"</div>"+
  "<div class=\"pan2\"><b>最小公式：</b>"+esc(c.formula)+"</div>"+
  "<div class=\"pan2\"><b>常见误解 / 反例：</b>"+esc(c.myth)+"</div>"+
  "<div class=\"pan2\"><b>真实新闻里长什么样：</b>"+esc(c.news)+"</div>"+
  "<div class=\"pan2 sm mut\">卡牌效果："+esc(c.effect)+"</div>"+
  "<div class=\"row\">"+(cs?btn("立即专项特训","drill",id,"pri"):"")+btn("关闭","close")+"</div>";
 document.getElementById("mbox").innerHTML=h;
 document.getElementById("modal").className="on";
}
function render(){
 var el=document.getElementById("app"),h;
 if(VIEW==="lab")h=vLab();
 else if(VIEW==="sandbox")h=vSandbox();
 else if(VIEW==="home")h=vHome();
 else if(!S)h=vHome();
 else if(VIEW==="game")h=S.over?vOver():vGame();
 else if(VIEW==="map")h=vMap();
 else if(VIEW==="review")h=vReview();
 else if(VIEW==="report")h=vReport();
 else if(VIEW==="settings")h=vSettings();
 else if(VIEW==="cert")h=vCert();
 else h=vHome();
 el.innerHTML=h;
 if(VIEW==="sandbox")sbDraw();
 if(VIEW==="report")drawRadar();
}
function go(v){VIEW=v;render();}

/* ---- 交互：委派点击 + 滑块 + 快捷键 ---- */
var ACT={
 go:function(a){go(a);},
 newGame:function(){newGame(Math.floor(Math.random()*1e9),"career",S?S.diff:"std");go("game");},
 daily:function(){var d=new Date();newGame(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(),"daily",S?S.diff:"std");go("game");},
 endless:function(){newGame(Math.floor(Math.random()*1e9),"endless",S?S.diff:"std");go("game");},
 cont:function(){var s=loadSave();if(s){S=s;applyFont();if(!S.cur)nextEncounter();go("game");}else{ACT.newGame();}},
 next:function(){if(!S)return;nextEncounter();save();go("game");},
 ev:function(a){chooseEvent(parseInt(a,10));},
 ans:function(a){answerReview(parseInt(a,10));},
 boss:function(a){bossChoose(parseInt(a,10));},
 bnext:function(){bossNext();},
 card:function(a){showCard(a);},
 close:function(){document.getElementById("modal").className="";},
 sb:function(a){SBID=a;go("sandbox");},
 drill:function(a){if(!S)return;ACT.close();startReview(a);save();go("game");},
 diff:function(a){if(S){S.diff=a;save();}render();},
 expSave:function(){var t=document.getElementById("sbox");if(t)t.value=JSON.stringify(S||{});},
 impSave:function(){var t=document.getElementById("sbox");if(!t)return;
  try{var o=JSON.parse(t.value);if(o&&o.eco&&o.cards){S=o;applyFont();save();MSG="存档已导入。";go("game");}else{alert("存档格式不对。");}}catch(e){alert("无法解析："+e.message);}},
 restart:function(){try{localStorage.removeItem(LS);}catch(e){}S=null;go("home");}
};
document.addEventListener("click",function(ev){
 var el=ev.target;
 while(el&&el!==document.body&&!(el.getAttribute&&el.getAttribute("data-act")))el=el.parentNode;
 if(!el||!el.getAttribute)return;
 var act=el.getAttribute("data-act");
 if(act&&ACT[act]){ev.preventDefault();ACT[act](el.getAttribute("data-arg"));}
});
document.addEventListener("input",function(ev){
 var el=ev.target;if(!el||!el.getAttribute)return;
 var k=el.getAttribute("data-sb");
 if(k){
  var sb=findBy(CONTENT.sandboxes,SBID),i;
  if(sb){for(i=0;i<sb.params.length;i++){if(sb.params[i].k===k)sb.params[i].v=parseFloat(el.value);}
   var lb=document.getElementById("lb_"+k);if(lb)lb.innerHTML=el.value;sbDraw();}
  return;
 }
 if(el.id==="fsr"){
  var v=parseInt(el.value,10);
  if(!S)S={settings:{fs:v}};else S.settings.fs=v;
  var l2=document.getElementById("lb_fs");if(l2)l2.innerHTML=v;
  applyFont();if(S&&S.eco)save();
 }
});
document.addEventListener("keydown",function(ev){
 if(document.getElementById("modal").className==="on"){if(ev.key==="Escape")ACT.close();return;}
 if(ev.target&&(ev.target.tagName==="TEXTAREA"||ev.target.tagName==="INPUT"))return;
 var k=ev.key;
 if(k===" "){ev.preventDefault();
  if(S&&S.cur&&S.cur.k==="boss"&&S.cur.chosen>=0)bossNext();
  else if(S&&S.cur&&S.cur.chosen>=0)ACT.next();
  else if(S&&!S.cur)ACT.next();
  return;}
 if(k==="r"||k==="R"){go("review");return;}
 if(/^[1-5]$/.test(k)&&S&&S.cur&&S.cur.chosen<0&&VIEW==="game"){
  var i=parseInt(k,10)-1;
  if(S.cur.k==="event")chooseEvent(i);else if(S.cur.k==="review")answerReview(i);else bossChoose(i);
 }
});
window.addEventListener("resize",function(){if(VIEW==="sandbox")sbDraw();if(VIEW==="report")drawRadar();});

/* ---- 启动（自检：首屏可渲染、存档读写正常、无未定义变量） ---- */
(function boot(){
 var s=loadSave();
 if(s&&s.eco&&s.cards){S=s;}
 applyFont();
 VIEW="home";
 render();
})();
</script>
