<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CFO 崛起之路 · 从奶茶摊到上市集团</title>
<style>
:root{
  --bg:#f6f7fb; --bg2:#ffffff; --card:#ffffff; --card2:#f2f4fa;
  --line:#dde1ec; --txt:#1f2430; --dim:#66708a;
  --cy:#0891b2; --pk:#db2777; --am:#b45309; --gn:#059669; --rd:#e11d48; --pu:#7c3aed;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 15% -10%,#e0ecf8 0%,transparent 60%),
             radial-gradient(900px 500px at 90% 0%,#f6e4f0 0%,transparent 55%),var(--bg);
  color:var(--txt);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;overflow-x:hidden
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9999}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:214px;flex:0 0 214px;padding:18px 12px;border-right:1px solid var(--line);
  background:rgba(255,255,255,.8);backdrop-filter:blur(10px);position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-size:17px;font-weight:800;letter-spacing:.5px;margin:0 6px 4px;
  background:linear-gradient(90deg,var(--cy),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--dim);letter-spacing:0;
  -webkit-text-fill-color:var(--dim)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;
  font-size:14px;color:var(--dim);transition:.18s;width:100%;text-align:left}
.nav button:hover{background:var(--card);color:var(--txt)}
.nav button.on{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(244,114,182,.1));
  color:var(--txt);box-shadow:inset 0 0 0 1px rgba(8,145,178,.35)}
.nav .bdg{margin-left:auto;font-size:11px;background:var(--rd);color:#fff;border-radius:9px;padding:0 6px;font-weight:700}
.main{flex:1;min-width:0;padding:20px 26px 90px;max-width:1080px;margin:0 auto}

/* ---------- dashboard ---------- */
.dash{background:linear-gradient(135deg,#ffffff,#f4f7fd);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px;position:relative;overflow:hidden}
.dash:before{content:"";position:absolute;inset:-40% -10% auto auto;width:280px;height:280px;
  background:radial-gradient(circle,rgba(34,211,238,.16),transparent 70%);pointer-events:none}
.dtop{display:flex;flex-wrap:wrap;gap:14px;align-items:center;position:relative}
.stage-ico{font-size:34px;filter:drop-shadow(0 0 10px rgba(34,211,238,.5))}
.dname{font-size:17px;font-weight:800}
.dsub{font-size:12px;color:var(--dim)}
.kpis{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.kpi{background:#f4f6fb;border:1px solid var(--line);border-radius:11px;padding:6px 11px;min-width:78px}
.kpi b{display:block;font-size:15px;color:var(--cy)}
.kpi span{font-size:10.5px;color:var(--dim)}
.xpwrap{margin-top:13px;position:relative}
.xprow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:5px}
.xprow b{color:var(--am)}
.bar{height:11px;border-radius:99px;background:#e9ecf4;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--cy),var(--pu),var(--pk));
  transition:width .9s cubic-bezier(.22,1,.36,1);box-shadow:0 0 14px rgba(167,139,250,.7)}
.hearts{font-size:16px;letter-spacing:2px}
.spark{width:100%;height:44px;display:block;margin-top:10px;opacity:.95}

/* ---------- cards ---------- */
.h2{font-size:19px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.h2 .tag{font-size:11px;font-weight:600;color:var(--dim);background:var(--card);border:1px solid var(--line);
  padding:2px 8px;border-radius:99px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.chapcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;transition:.2s}
.chapcard:hover{transform:translateY(-2px);border-color:rgba(34,211,238,.4)}
.chapcard.lock{opacity:.45}
.chapcard h3{margin:6px 0 4px;font-size:15.5px}
.chapcard p{margin:0;font-size:12.5px;color:var(--dim)}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.pill{font-size:12px;padding:6px 9px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
  display:flex;align-items:center;gap:5px;transition:.15s}
.pill:hover{border-color:var(--cy)}
.pill.done{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);color:#047857}
.pill.boss{background:rgba(251,113,133,.13);border-color:rgba(251,113,133,.4)}
.pill.lockp{opacity:.4;cursor:not-allowed}

/* ---------- level stage ---------- */
.stagebox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative}
.lvhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.lvhead h2{margin:0;font-size:19px}
.chip{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.chip.cy{color:var(--cy);border-color:rgba(34,211,238,.4)}
.chip.pk{color:var(--pk);border-color:rgba(244,114,182,.4)}
.chip.rd{color:var(--rd);border-color:rgba(251,113,133,.5)}
.teach{margin:14px 0}
.tblock{border-left:3px solid var(--cy);background:rgba(34,211,238,.06);padding:11px 14px;border-radius:0 12px 12px 0;margin-bottom:10px}
.tblock.f{border-color:var(--pu);background:rgba(167,139,250,.07)}
.tblock.e{border-color:var(--am);background:rgba(251,191,36,.07)}
.tblock h4{margin:0 0 5px;font-size:13px;letter-spacing:.5px}
.tblock p{margin:0;font-size:14px;color:#3c465e}
.q{font-size:16px;font-weight:700;margin:16px 0 12px;line-height:1.6}
.qmeta{font-size:12px;color:var(--dim);margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;background:var(--card2);
  border:1px solid var(--line);transition:.16s;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--cy);transform:translateX(3px)}
.opt .k{flex:0 0 22px;height:22px;border-radius:7px;background:#e9ecf4;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:var(--dim)}
.opt.ok{background:rgba(52,211,153,.17);border-color:var(--gn);animation:pop .35s}
.opt.ok .k{background:var(--gn);color:#05261a}
.opt.no{background:rgba(251,113,133,.15);border-color:var(--rd);animation:shake .35s}
.opt.no .k{background:var(--rd);color:#3b0a14}
.opt:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.exp{margin-top:14px;border-radius:12px;padding:13px 15px;font-size:14px;animation:fade .3s}
.exp.good{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35)}
.exp.bad{background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.35)}
.exp b{display:block;margin-bottom:4px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.btn{padding:11px 20px;border-radius:12px;font-weight:700;font-size:14.5px;transition:.18s}
.btn.p{background:linear-gradient(90deg,var(--cy),var(--pu));color:#04121c;box-shadow:0 6px 20px rgba(34,211,238,.28)}
.btn.p:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.g{background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.btn.g:hover{color:var(--txt);border-color:var(--cy)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.pbar{height:5px;border-radius:99px;background:#e9ecf4;overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pk));transition:.4s}

/* combo + timer */
#combo{position:fixed;top:14%;left:50%;transform:translateX(-50%) scale(.5);opacity:0;
  font-size:38px;font-weight:900;pointer-events:none;z-index:9998;
  background:linear-gradient(90deg,var(--am),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(251,191,36,.5)}
#combo.show{animation:cb .95s ease-out}
@keyframes cb{0%{opacity:0;transform:translateX(-50%) scale(.4)}20%{opacity:1;transform:translateX(-50%) scale(1.22)}
  70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1.1) translateY(-30px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--am)}
.timer.warn{color:var(--rd);animation:blink .6s infinite}
@keyframes blink{50%{opacity:.35}}

/* drag */
.dragpool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:12px;min-height:56px;margin-bottom:14px}
.token{padding:8px 12px;border-radius:10px;background:linear-gradient(135deg,#eef1f9,#e6eaf5);
  border:1px solid var(--line);font-size:13.5px;cursor:grab;transition:.15s;user-select:none}
.token:hover{border-color:var(--cy);transform:translateY(-2px)}
.token.sel{border-color:var(--am);box-shadow:0 0 0 2px rgba(251,191,36,.35)}
.token.ok{border-color:var(--gn);background:rgba(52,211,153,.16)}
.token.no{border-color:var(--rd);background:rgba(251,113,133,.16)}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bucket{border:1.5px dashed var(--line);border-radius:12px;padding:10px;min-height:104px;transition:.18s;background:#f7f8fc}
.bucket.over{border-color:var(--cy);background:rgba(34,211,238,.09)}
.bucket h5{margin:0 0 8px;font-size:12.5px;color:var(--cy);letter-spacing:.5px}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px}

/* journal */
.jbox{background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jcol h5{margin:0 0 7px;font-size:12.5px;letter-spacing:1px}
.jcol.d h5{color:var(--cy)}.jcol.c h5{color:var(--pk)}
select,input[type=number],input[type=text]{width:100%;padding:9px 11px;border-radius:10px;background:#ffffff;
  color:var(--txt);border:1px solid var(--line);font:inherit;font-size:14px}
select:focus,input:focus{outline:none;border-color:var(--cy)}
.balcheck{margin-top:12px;padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:700;text-align:center}
.balcheck.y{background:rgba(52,211,153,.14);color:#047857}
.balcheck.n{background:rgba(251,113,133,.14);color:#9f1239}
.tledger{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.tledger th,.tledger td{border:1px solid var(--line);padding:7px 9px;text-align:left}
.tledger th{background:var(--card2);color:var(--dim);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* sandbox */
.sbgrid{display:grid;gap:14px;grid-template-columns:280px 1fr}
.slider{margin-bottom:13px}
.slider label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:5px}
.slider label b{color:var(--am);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:99px;background:#e9ecf4;border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:linear-gradient(135deg,var(--cy),var(--pu));cursor:pointer;box-shadow:0 0 10px rgba(34,211,238,.6)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--cy);cursor:pointer}
.tri{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.st{background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:12px}
.st h5{margin:0 0 8px;font-size:12.5px;letter-spacing:.5px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.st .ln{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#3c465e}
.st .ln.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:6px;font-weight:800;color:var(--txt)}
.st .ln.hl{color:var(--am)}
.st .ln b{font-variant-numeric:tabular-nums}
.up{color:var(--gn)}.dn{color:var(--rd)}

/* detective */
.repbox{background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.clues{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.clue{text-align:left;padding:10px 13px;border-radius:11px;background:var(--card2);border:1px solid var(--line);
  font-size:14px;display:flex;gap:9px;align-items:flex-start;transition:.15s}
.clue:hover:not(:disabled){border-color:var(--am)}
.clue .bx{flex:0 0 18px;height:18px;border-radius:5px;border:1.5px solid var(--dim);display:grid;place-items:center;font-size:12px;margin-top:2px}
.clue.pick .bx{background:var(--am);border-color:var(--am);color:#241700}
.clue.tp{background:rgba(52,211,153,.14);border-color:var(--gn)}
.clue.fp{background:rgba(251,113,133,.14);border-color:var(--rd)}
.clue.fn{background:rgba(251,191,36,.12);border-color:var(--am)}
.clue small{display:block;color:var(--dim);font-size:12.5px;margin-top:3px}

/* ---------- VIZ ---------- */
.viz{background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.viz .vt{font-size:12px;color:var(--dim);letter-spacing:1px;margin-bottom:12px;text-align:center}
.hands{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hand{flex:1 1 190px;max-width:280px;border-radius:14px;padding:13px;border:1px solid var(--line)}
.hand.l{background:linear-gradient(160deg,rgba(34,211,238,.14),transparent)}
.hand.r{background:linear-gradient(160deg,rgba(244,114,182,.14),transparent)}
.hand .hi{font-size:30px;text-align:center}
.hand h5{margin:4px 0 8px;text-align:center;font-size:15px}
.hand.l h5{color:var(--cy)}.hand.r h5{color:var(--pk)}
.hand ul{margin:0;padding-left:17px;font-size:12.8px;color:#3c465e}
.arrowmid{display:grid;place-items:center;font-size:22px;color:var(--dim)}
.tl{position:relative;padding:24px 0 8px}
.tl:before{content:"";position:absolute;left:0;right:0;top:34px;height:2px;background:var(--line)}
.tlrow{display:flex;justify-content:space-between;position:relative}
.tlpt{flex:1;text-align:center;position:relative;padding-top:44px}
.tlpt:before{content:"";position:absolute;top:28px;left:50%;transform:translateX(-50%);
  width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--cy)}
.tlpt.hot:before{background:var(--am);border-color:var(--am);box-shadow:0 0 12px var(--am)}
.tlpt .t{position:absolute;top:0;left:0;right:0;font-size:11.5px;color:var(--dim)}
.tlpt .d{font-size:12.5px;padding:0 4px}
.scale{margin:0 auto;max-width:440px}
.beam{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--cy),var(--pk));
  transform-origin:center;transition:.6s;position:relative}
.beam:after{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);
  width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--line)}
.pans{display:flex;justify-content:space-between;margin-top:34px;gap:14px}
.pan{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#ffffff}
.pan b{display:block;font-size:17px}
.pan.a b{color:var(--cy)}.pan.b b{color:var(--pk)}
.pan span{font-size:11.5px;color:var(--dim)}
.wf{display:flex;align-items:flex-end;gap:5px;height:180px;padding-top:10px}
.wfb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.wfb i{display:block;width:100%;border-radius:5px 5px 0 0;transition:.6s}
.wfb .lb{font-size:10.5px;color:var(--dim);margin-top:6px;text-align:center;line-height:1.25}
.wfb .vl{font-size:11px;font-weight:700;margin-bottom:3px}
.bridge{display:flex;align-items:flex-end;gap:4px;height:170px}
.brb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.brb i{width:100%;border-radius:4px;transition:.6s}
.brb .lb{font-size:10px;color:var(--dim);margin-top:5px;text-align:center;line-height:1.2}
.linkmap{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);position:relative}
.lnode{border:1px solid var(--line);border-radius:12px;padding:11px;background:#ffffff;font-size:12.5px}
.lnode h5{margin:0 0 6px;font-size:13px}
.lnode.a h5{color:var(--cy)}.lnode.b h5{color:var(--am)}.lnode.c h5{color:var(--gn)}
.lnode .ar{color:var(--pk);font-weight:700}
.gears{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gear{flex:1 1 130px;max-width:190px;text-align:center;border:1px solid var(--line);border-radius:14px;padding:13px;
  background:conic-gradient(from 0deg,rgba(34,211,238,.12),rgba(244,114,182,.12),rgba(251,191,36,.12),rgba(34,211,238,.12))}
.gear .gi{font-size:26px;animation:spin 9s linear infinite}
.gear:nth-child(2) .gi{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.gear b{display:block;font-size:14px;margin:5px 0 3px}
.gear span{font-size:11.5px;color:var(--dim)}
.deq{text-align:center;font-size:13px;color:var(--am);margin-top:12px;font-weight:700}

/* misc pages */
.badgewall{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.bd{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--card);transition:.2s}
.bd.got{border-color:var(--am);background:linear-gradient(160deg,rgba(251,191,36,.14),var(--card));
  box-shadow:0 0 18px rgba(251,191,36,.14)}
.bd .i{font-size:26px;filter:grayscale(1) opacity(.35)}
.bd.got .i{filter:none}
.bd b{display:block;font-size:12.8px;margin:5px 0 2px}
.bd span{font-size:11px;color:var(--dim)}
.lb-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;background:var(--card);
  border:1px solid var(--line);margin-bottom:7px}
.lb-row.me{border-color:var(--cy);background:linear-gradient(90deg,rgba(34,211,238,.13),var(--card))}
.lb-row .rk{width:26px;text-align:center;font-weight:800;color:var(--dim)}
.lb-row .nm{flex:1;font-size:14px}
.lb-row .xp{font-variant-numeric:tabular-nums;color:var(--am);font-weight:700;font-size:13.5px}
.flames{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.fl{width:36px;height:44px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:19px;filter:grayscale(1) opacity(.35)}
.fl.on{filter:none;border-color:var(--am);background:rgba(251,191,36,.14);animation:fl 1.6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-3px) scale(1.06)}}
.kmap{display:flex;flex-direction:column;gap:9px}
.kmrow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px}
.kmrow .ic{font-size:20px}
.kmrow .bd2{flex:1}
.kmrow h4{margin:0 0 6px;font-size:14px}
.kmtags{display:flex;flex-wrap:wrap;gap:5px}
.kt{font-size:11.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.kt.on{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.45);color:#047857}
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty .e{font-size:40px;display:block;margin-bottom:8px}

/* chest */
.modal{position:fixed;inset:0;background:rgba(245,246,250,.86);backdrop-filter:blur(6px);z-index:9990;

levels:[
{id:'1-1',type:'concept',title:'会计是什么',
analogy:'你妈问你「这个月钱都花哪去了」——你翻手机账单一笔一笔说，这是<b>记账</b>。但如果她问「你现在到底有多少身家、欠了多少、这个月赚了还是亏了」——你需要的是一份<b>体检报告</b>。会计就是把零散账单，加工成一份能回答「有多少 / 欠多少 / 赚多少 / 钱在不在」的体检报告。',
formal:'会计是以货币为主要计量单位，对一个主体的经济活动进行<b>确认、计量、记录与报告</b>的信息系统。它最终输出四份东西：资产负债表（家底）、利润表（战绩）、现金流量表（血液）、附注（脚注解释）。',

{q:'下列哪一项<b>不属于</b>会计要回答的问题？',o:['公司有多少家底','公司这段时间赚了多少','公司的钱是真进来了还是只是账面数字','公司下个季度股价会涨多少'],a:3,

{q:'「资产负债表 / 利润表 / 现金流量表」分别像什么？',o:['照片 / 录像 / 录像','录像 / 照片 / 照片','照片 / 照片 / 录像','三者都是照片'],a:0,

{id:'1-3',type:'concept',title:'权责发生制 vs 收付实现制',viz:'timeline',
analogy:'你办了一张 1200 元健身年卡。<b>健身房老板视角</b>：如果按「钱到手就算收入」（收付实现制），他 1 月就赚了 1200，2 月起白干；如果按「服务做了才算收入」（权责发生制），他每月只确认 100 元收入，剩下的先记成「我欠客户 11 个月健身服务」。哪个更能反映真实经营？显然是后者。',
formal:'<b>权责发生制（应计制）</b>：收入在「已履行义务、经济利益很可能流入」时确认，费用在「相关义务已发生」时确认，与现金收付时点无关。<b>收付实现制</b>：钱进就是收入，钱出就是费用。企业财报（利润表、资产负债表）用权责发生制，只有现金流量表回到收付实现制的视角。',
example:'星巴克每年有约 17 亿美元的储值卡未使用余额，全部挂在负债里而不是收入里。反之，一家做 To-B 生意的公司 12 月发货、次年 3 月才收钱，收入必须记在<b>12 月</b>，同时挂一笔应收账款——这就是「有利润没现金」的源头。',
quiz:[

e:'义务已在 12 月履行完毕，收入就属于 12 月。同时借记应收账款 5 万。现金要到 1 月才动，所以 12 月「有收入、有利润、没现金」。'},
{q:'预收客户一年会员费 12 万（服务尚未提供），当期正确处理是？',o:['确认收入 12 万','确认负债 12 万','确认资产 12 万并计收入','不做账'],a:1,
e:'钱进了银行，所以「银行存款」资产增加 12 万；但你欠客户一年服务，所以同时确认「合同负债」12 万。收入要随服务逐月释放。把预收当收入是最常见的财务造假手法之一。'},
{q:'为什么现金流量表要单独用收付实现制？',o:['为了让报表更多一张显得专业','因为权责发生制会让利润「看得见摸不着」，需要一张表回答「钱到底有没有进口袋」','因为准则规定必须不一致','因为现金没法用应计口径'],a:1,
e:'权责发生制提高了利润的经济含义，代价是引入了大量估计与判断（何时确认、坏账多少、折旧几年）。现金流量表是不带判断的「照妖镜」，这就是「利润是观点，现金是事实」的制度根源。'}

{id:'1-4',type:'concept',title:'复式记账：为什么一笔账要写两次',viz:'doubleentry',
analogy:'你花 30 元买了一杯奶茶。单式记账只会写「-30 元」。但真实世界发生了<b>两件事</b>：钱少了 30，同时你获得了一杯奶茶（虽然马上被喝掉变成费用）。复式记账坚持记下「钱去哪了」和「钱从哪来」两端——就像每一笔转账都必须有转出方和转入方，天生自带对账功能。',
formal:'复式记账要求每笔交易至少记入两个账户，且<b>借方合计恒等于贷方合计</b>。这保证了会计恒等式「资产 = 负债 + 所有者权益」在任何时刻都成立，并让「试算平衡」成为一种自动错误检测机制。',
example:'茅台卖一批酒收现 100 万，会同时发生：银行存款 +100 万（资产增加，借方）、主营业务收入 +100 万（收入增加，贷方）；紧接着结转成本：营业成本 +20 万（费用增加，借方）、库存商品 −20 万（资产减少，贷方）。四个数字，两次平衡。',
quiz:[

e:'「有借必有贷、借贷必相等」既是约束也是校验。如果试算不平衡，说明一定有错；同时你既知道钱变成了什么（去向），也知道钱是谁给的（来源）。'},
{q:'股东追加投资 200 万现金，这笔交易影响哪两个要素？',o:['资产增加 + 负债增加','资产增加 + 所有者权益增加','资产增加 + 收入增加','负债减少 + 权益增加'],a:1,

{q:'「资产 = 负债 + 所有者权益」为什么永远成立？',o:['因为准则强制规定','因为等式左边是「有什么」，右边是「这些东西是谁的钱买的」，本质是同一堆东西的两种看法','因为会计师会人工调平','因为资产总是等于现金'],a:1,

{id:'1-5',type:'concept',title:'借贷方向：左手右手直觉法',viz:'hands',
analogy:'忘掉「借 = 借钱」这个中文陷阱。<b>借（Debit）只是「左边」，贷（Credit）只是「右边」</b>，是两个方位词。记法：<b>左手接资源（资源变多记左边），右手拿钱袋（资金来源变多记右边）</b>。你借了 100 万买设备：设备（资源）进了左手 → 借记设备；钱是银行给的（来源）→ 贷记银行借款。',

e:'应付账款是负债，负债增加记贷方（右边）。这笔资源的来源是供应商赊给你的。'},
{q:'「确认主营业务收入 50 万」应记在哪一方？',o:['借方','贷方','借方且同时贷记现金','取决于是否开票'],a:1,
e:'收入增加记贷方。因为收入最终会增加所有者权益（留存收益），而权益增加在右侧。对应的借方是银行存款或应收账款。'},
{q:'「支付本月房租 2 万」的完整分录是？',o:['借 银行存款 2 万 / 贷 销售费用 2 万','借 销售费用 2 万 / 贷 银行存款 2 万','借 销售费用 2 万 / 贷 应付账款 2 万','借 银行存款 2 万 / 贷 实收资本 2 万'],a:1,
e:'费用增加记借方（费用是利润的减项，方向随资产），现金减少记贷方。方向搞反是最常见错误，用「左手接到了什么」自检：这次接到的是「已消耗的租期」，所以费用在左边。'}
]},
{id:'1-6',type:'journal',title:'借贷记账模拟器',
intro:'给你一笔真实业务，选出借方科目与贷方科目并填入金额，系统实时校验借贷是否平衡。<b>自检口诀：先问「左手接到了什么资源/消耗」，再问「这资源是谁给的」。</b>',
accounts:['银行存款','库存现金','应收账款','存货','固定资产','累计折旧','应付账款','合同负债(预收款)','短期借款','长期借款','实收资本','主营业务收入','营业成本','销售费用','管理费用','财务费用','应交税费'],
entries:[
{biz:'股东投入开办资金 50 万元，已存入公司银行账户。',amt:500000,d:'银行存款',c:'实收资本',
e:'左手接到了 50 万现金（资产↑记借方），这钱来自股东（权益↑记贷方）。切记：股东投资不是收入。'},
{biz:'用银行存款购入一台商用制冰机，价款 8 万元。',amt:80000,d:'固定资产',c:'银行存款',
e:'左手接到设备（固定资产↑借方），代价是银行存款减少（资产↓贷方）。两边都是资产，总额不变、结构改变。'},
{biz:'向供应商赊购奶粉与珍珠一批，价值 12 万元，尚未付款。',amt:120000,d:'存货',c:'应付账款',
e:'左手接到货（存货↑借方），资源来自供应商的信用（负债↑贷方）。这类交易会让总资产和总负债同时膨胀。'},
{biz:'向企业客户赊销团购奶茶券，确认收入 30 万元，款项未收。',amt:300000,d:'应收账款',c:'主营业务收入',
e:'义务已履行，收入必须确认（收入↑贷方）；钱没到但形成收款权利（应收账款↑借方）。这就是「有利润没现金」的诞生现场。'},
{biz:'客户购买年度储值卡，预收现金 24 万元，服务尚未提供。',amt:240000,d:'银行存款',c:'合同负债(预收款)',
e:'现金到手（资产↑借方），但你欠客户一年奶茶（负债↑贷方），<b>不能确认收入</b>。若此处贷记收入即为提前确认收入的造假。'},
{biz:'支付本月门店员工工资 6 万元（计入销售费用）。',amt:60000,d:'销售费用',c:'银行存款',
e:'费用增加记借方，现金减少记贷方。费用方向与资产一致——因为费用是「已经被消耗掉的资产」。'},
{biz:'计提本月制冰机折旧 1200 元。',amt:1200,d:'管理费用',c:'累计折旧',
e:'折旧把资产价值转成当期费用：费用↑借方；资产端用「累计折旧」这个抵减账户表示价值减少↑贷方。<b>本笔完全不涉及现金</b>，是理解三表联动的钥匙。'},
{biz:'收回此前赊销的应收账款 10 万元。',amt:100000,d:'银行存款',c:'应收账款',
e:'现金↑借方，应收权利消失↓贷方。注意：<b>这笔交易不产生任何收入和利润</b>，收入早在赊销时就已确认，此处只是资产形态转换。'},
{biz:'向银行取得一年期流动资金借款 200 万元。',amt:2000000,d:'银行存款',c:'短期借款',
e:'现金↑借方，资金来源是银行（负债↑贷方）。借款不是收入，只影响筹资活动现金流。'},
{biz:'支付当期银行借款利息 5 万元。',amt:50000,d:'财务费用',c:'银行存款',
e:'利息是使用资金的代价，属财务费用（费用↑借方），现金流出（资产↓贷方）。注意归还本金则是贷记银行存款、借记短期借款，不进利润表。'}
]},
{id:'1-7',type:'boss',title:'BOSS：会计恒等式守门人',time:150,
quiz:[
{q:'某公司资产 900 万、负债 350 万，则所有者权益为？',o:['1250 万','550 万','350 万','无法计算'],a:1,e:'900 − 350 = 550 万。恒等式最基本的移项运用。'},
{q:'公司用银行存款偿还应付账款 20 万，对报表的影响是？',o:['总资产减少 20 万，总负债减少 20 万，权益不变','总资产不变，负债减少','利润减少 20 万','所有者权益减少 20 万'],a:0,e:'借 应付账款 20 / 贷 银行存款 20。等式两边同时缩小 20 万，仍然平衡，且不碰利润表。'},
{q:'下列哪一项会<b>直接增加</b>所有者权益？',o:['向银行借款','赊购原材料','当期实现净利润','收回应收账款'],a:2,e:'净利润通过留存收益进入权益。借款和赊购只增加负债，收回应收只是资产内部转换。'},
{q:'12 月已完工并交付、约定次年收款的项目，若会计把收入记在次年，属于？',o:['正确的谨慎处理','违反权责发生制，跨期调节利润','收付实现制的合法运用','与准则无关'],a:1,e:'义务已在 12 月履行，收入就属于 12 月。人为推迟或提前确认收入都是跨期调节，是典型的盈余管理/造假手段。'},
{q:'「借」在会计语境中的准确含义是？',o:['借钱进来','账户的左方','负债增加','现金流出'],a:1,e:'借/贷仅是「左/右」的方位术语，与中文日常语义无关。这是零基础最大的认知障碍。'},
{q:'预收 12 万年费，当年只提供了 3 个月服务。年末应确认收入与负债各多少？',o:['收入 12 万，负债 0','收入 3 万，负债 9 万','收入 0，负债 12 万','收入 9 万，负债 3 万'],a:1,e:'12 ÷ 12 × 3 = 3 万收入已履约；剩余 9 万仍是欠客户的服务，挂合同负债。'},
{q:'一笔业务记为「借 存货 5 万 / 贷 银行存款 3 万」，问题在于？',o:['科目选错','借贷不平衡，缺少 2 万的贷方','借方应该是费用','完全正确'],a:1,e:'借方 5 万 ≠ 贷方 3 万。差额 2 万很可能是应付账款（部分赊购）。试算不平衡说明必然有错，这就是复式记账的自检价值。'},
{q:'费用类账户增加记借方，根本原因是？',o:['准则随机规定','费用是所有者权益的减项，减少权益等价于记在左方','费用总是伴随现金流出','费用属于资产'],a:1,e:'权益增加在贷方，那么侵蚀权益的费用自然记借方。同理收入增加权益，故记贷方。理解这一层，就永远不会记反方向。'}
]}
]},

{
id:'c2',icon:'🏛️',title:'资产负债表',desc:'公司的家底快照：有什么、欠什么、剩多少。',
levels:[
{id:'2-1',type:'concept',title:'会计恒等式与天平',viz:'balance',
analogy:'把公司想象成一间仓库。左边墙贴着清单「仓库里有什么」：现金、奶粉、冰柜、别人欠我的钱。右边墙贴着另一张清单「这些东西是花谁的钱买的」：一部分是供应商和银行的（负债），剩下的才是股东的（权益）。两张清单描述的是同一间仓库，金额必然相等。',
formal:'资产负债表（Balance Sheet）以「资产 = 负债 + 所有者权益」为骨架，报告某一<b>时点</b>的财务状况。左侧按流动性排列资源，右侧按到期先后与索取权顺序排列资金来源。所有者权益又称「净资产」，等于资产减负债。',
example:'苹果公司 2023 年末：总资产约 3525 亿美元，总负债约 2901 亿美元，股东权益仅约 624 亿美元。权益比例很低不是因为不赚钱，而是它常年大规模<b>回购股票</b>把权益「买掉了」。看报表不能只看数字大小，要问「为什么」。',
quiz:[
{q:'资产负债表描述的是？',o:['一段时间的经营成果','某一时点的财务状况快照','未来的现金预测','股价走势'],a:1,e:'它是「照片」，标题永远写「XX 年 12 月 31 日」。利润表和现金流量表才是「录像」，标题写「XX 年度」。'},
{q:'某公司总资产 5000 万、所有者权益 1200 万，资产负债率为？',o:['24%','76%','120%','无法计算'],a:1,e:'负债 = 5000 − 1200 = 3800 万，3800 ÷ 5000 = 76%。这属于偏高杠杆，需结合行业与现金流判断风险。'},
{q:'所有者权益为负数意味着什么？',o:['公司必然破产','资不抵债，账面净资产为负，但若现金流健康仍可持续经营','会计做错了','公司免税'],a:1,e:'称为「负净资产」。例如长期巨额回购或连年亏损都可能导致。麦当劳、星巴克都曾出现负权益却经营良好——因为它们现金流极强。不能只看一个指标下结论。'}
]},
{id:'2-2',type:'mcq',title:'流动 vs 非流动：以一年为界',
intro:'<b>流动资产</b>：预计在 1 年（或一个营业周期）内变现或耗用。<b>流动负债</b>：1 年内需偿还。这条线之所以重要，是因为「短债长投」——用一年内要还的钱去买十年才回本的资产——是企业猝死的头号杀手。',
quiz:[
{q:'下列哪一项<b>不属于</b>流动资产？',o:['应收账款','存货','商誉','交易性金融资产'],a:2,e:'商誉是收购产生的非流动资产，且不能摊销、只能做减值测试，是资产负债表里最「虚」的一项。'},
{q:'「一年内到期的非流动负债」应列示在？',o:['流动负债','非流动负债','所有者权益','不列示'],a:0,e:'即将到期就要按流动负债披露。很多公司短期偿债压力就藏在这一行，看财报必须专门翻它。'},
{q:'流动比率 = 流动资产 ÷ 流动负债 = 0.8 说明？',o:['短期偿债能力充裕','短期资产不足以覆盖短期债务，存在流动性压力','公司一定亏损','公司资产质量很好'],a:1,e:'小于 1 意味着一年内到期的债务超过一年内可变现的资产，需依赖再融资或经营现金流。但便利店、餐饮等预收模式行业天然低于 1，仍需结合商业模式判断。'},
{q:'一家公司用 1 年期短期借款投资建设需 8 年回本的工厂，最大风险是？',o:['利润下降','期限错配，借款到期时资产无法变现，可能引发流动性危机','税负增加','存货积压'],a:1,e:'这是「短债长投」。资产本身可能优质，但现金流时间轴不匹配就会猝死。分析偿债能力必须看期限结构，不只看总量。'}
]},
{id:'2-3',type:'concept',title:'应收账款：卖出去了但钱没到',
analogy:'你在小区里开奶茶店，隔壁公司说「先给我们送 300 杯，月底统一结账」。你送了，营业额上去了，老板很开心——但如果这家公司下个月跑路，你的 300 杯就白送了。应收账款就是「已经确认的收入 + 还没落袋的风险」。',
formal:'应收账款是企业因销售商品或提供服务而形成的收款权利。企业需按预期信用损失模型计提<b>坏账准备</b>，资产负债表列示净额。关键分析指标：应收账款周转天数 = 应收账款平均余额 ÷ 营业收入 × 365。',
example:'某上市公司三年间收入从 20 亿增至 26 亿（+30%），应收账款却从 6 亿增至 18 亿（+200%），周转天数由 110 天升至 253 天。这几乎必然意味着：放宽信用政策硬撑收入，或存在虚构销售。这是第 6 章侦探关的核心信号之一。',
quiz:[
{q:'应收账款周转天数上升，通常意味着？',o:['收款速度加快，现金流改善','收款变慢，占用资金增加、坏账风险上升','收入质量提高','存货管理变好'],a:1,e:'天数 = 钱躺在客户口袋里的时间。变长意味着你在替客户垫资，同时坏账概率上升。要和同业、和自身历史两个维度对比。'},
{q:'计提坏账准备 500 万，对报表的影响是？',o:['资产减少 500 万、利润减少 500 万，不影响现金','现金减少 500 万','负债增加 500 万','只影响附注'],a:0,e:'借 信用减值损失 500（费用↑，利润↓）/ 贷 坏账准备 500（资产净额↓）。这是典型的「非现金损失」，也是公司调节利润的常用阀门。'},
{q:'收入增长 15% 而应收账款增长 90%，最合理的怀疑是？',o:['公司经营效率大幅提升','收入质量存疑：可能靠放宽信用压货，甚至虚构销售','客户都变有钱了','存货周转加快'],a:1,e:'应收增速持续远超收入增速是收入质量恶化的强信号。验证方法：看经营现金流是否同步跟上，看前五大客户集中度，看期后回款。'}
]},
{id:'2-4',type:'mcq',title:'存货：躺在仓库里的利润与地雷',
intro:'存货是「还没卖出去的成本」。它同时是希望（未来能卖钱）和风险（可能过期、跌价、卖不掉）。存货一旦卖出，成本才从资产端转入利润表变成营业成本——这个「转身」时点，决定了当期利润的高低。',
quiz:[
{q:'存货在卖出时，会计上发生什么？',o:['直接冲减所有者权益','由资产（存货）转为费用（营业成本），同时确认收入','变成现金','计入投资活动'],a:1,e:'借 营业成本 / 贷 库存商品。这是「资产 → 费用」的经典转身，也是毛利产生的时刻：收入 − 结转成本 = 毛利。'},
{q:'物价上涨期间，采用先进先出法（FIFO）相比加权平均法，通常会导致？',o:['营业成本更高、利润更低','营业成本更低、当期利润更高','完全没有差异','存货余额更低'],a:1,e:'FIFO 先结转较早（较便宜）的成本，所以成本低、毛利高，同时期末存货以较新的高价计量，账面存货偏高。计价方法选择会实质影响利润，看财报要看附注的会计政策。'},
{q:'计提存货跌价准备 200 万的影响是？',o:['利润减少 200 万、存货净值减少 200 万、不影响现金','现金减少 200 万','负债增加','增加收入'],a:0,e:'当可变现净值低于成本时必须计提。它是非现金减值，会一次性压低当期利润——有些公司会集中在业绩已经很差的年度大额计提（「财务洗澡」），为次年反转铺路。'},
{q:'收入停滞但存货连续三年高速增长，最可能说明？',o:['公司在为爆发做准备，一定是好事','产品滞销或积压，未来存在跌价与减值风险','管理效率提升','成本控制良好'],a:1,e:'存货增速长期高于收入增速是危险信号。结合存货周转天数变长、毛利率下滑一起看，往往预示后续大额减值。特别警惕存货占总资产比重异常高的制造与地产企业。'}
]},
{id:'2-5',type:'concept',title:'商誉：收购时多付的「情怀溢价」',
analogy:'一家奶茶店净资产只有 100 万（设备+存货+现金），你却花 500 万把它买了。多付的 400 万买的是什么？是它的品牌、老客户、配方、位置。这 400 万在你的报表上就叫<b>商誉</b>——它不是骗人，但它的价值完全取决于「这家店未来还能不能继续赚钱」。',
formal:'商誉 = 合并成本 − 被购买方可辨认净资产公允价值份额。商誉不摊销，但每年至少进行一次<b>减值测试</b>；一旦被收购业务不达预期，需计提商誉减值，一次性冲击当期利润，且不可转回。',
example:'A 股 2018 年商誉减值集中爆发，多家公司单年计提数十亿商誉减值，直接由盈利转为巨亏。判断风险的方法：看「商誉 ÷ 净资产」比例，若超过 30%，且收购标的业绩承诺期刚过，就要高度警惕。',
quiz:[
{q:'商誉在资产负债表上属于？',o:['流动资产','非流动资产，且不摊销、只做减值测试','负债','所有者权益'],a:1,e:'它是非流动资产。不摊销意味着平时不影响利润，但减值时会「一次性爆炸」，这种非线性风险最容易被忽视。'},
{q:'商誉减值 10 亿对三张表的影响是？',o:['利润表大额亏损、资产负债表资产与权益各减 10 亿、现金流量表不受影响','三张表都减 10 亿','只影响现金流','只影响附注披露'],a:0,e:'典型的非现金损失。经营现金流完全不变，这也是为什么「巨亏当年经营现金流仍为正」的公司并不罕见——要区分账面损失与真实失血。'},
{q:'商誉占净资产 60%、被收购公司业绩承诺刚到期，应如何判断？',o:['估值很便宜可以买入','高减值风险，需重点核查标的近期收入与现金流是否达标','商誉越多说明公司越强','与投资判断无关'],a:1,e:'业绩承诺期是「保护期」，一到期往往标的业绩立刻下滑，随之商誉减值。这是 A 股最经典的暴雷模式，检查清单：商誉/净资产比、标的近三年完成率、行业景气度。'}
]},
{id:'2-6',type:'mcq',title:'递延项目：跨期的时间差',
intro:'「递延」= 推迟。递延项目全部源于「会计口径」与「现金/税务口径」的时间差。<b>递延收益</b>：钱收了但收入还不能确认（负债）。<b>递延所得税资产</b>：现在多交了税、未来能少交（资产）。<b>递延所得税负债</b>：现在少交了税、未来要补交（负债）。',
quiz:[
{q:'政府补助 1000 万用于购建设备（设备使用 10 年），当期应如何处理？',o:['一次确认 1000 万收入','确认递延收益 1000 万，随设备折旧分 10 年计入损益','计入所有者权益','不做账'],a:1,e:'与资产相关的政府补助需通过递延收益分期结转，与资产的受益期匹配。一次性确认会虚增当期利润。'},
{q:'税法不允许当期扣除的减值损失 400 万（未来实际发生时可扣），会产生？',o:['递延所得税资产','递延所得税负债','商誉','合同负债'],a:0,e:'会计上已认损失、税上还没认，导致现在多交税、未来可抵扣，形成递延所得税<b>资产</b>（未来的抵税权利）。'},
{q:'递延所得税资产大额增加，可能的隐含信息是？',o:['公司盈利能力显著提升','存在较多可抵扣亏损或减值，需确认未来是否真有足够利润来消化','税率下降','现金增加'],a:1,e:'确认递延所得税资产的前提是「未来很可能有足够应纳税所得额」。若公司连年亏损却大额确认，属于激进假设，是利润被高估的信号。'}
]},
{id:'2-7',type:'boss',title:'BOSS：读懂星珠咖啡的资产负债表',time:180,
quiz:[
{q:'星珠咖啡：总资产 8000 万，流动资产 3000 万（其中存货 900、应收 1100、现金 800），流动负债 3600 万。流动比率约为？',o:['0.83','1.20','2.22','0.42'],a:0,e:'3000 ÷ 3600 ≈ 0.83，小于 1，短期偿债压力偏大。'},
{q:'承上题，速动比率（剔除存货）约为？',o:['0.83','0.58','1.05','0.25'],a:1,e:'(3000 − 900) ÷ 3600 = 2100 ÷ 3600 ≈ 0.58。速动比率剔除了最难变现的存货，更保守。'},
{q:'星珠总负债 5600 万，资产负债率是？',o:['30%','50%','70%','140%'],a:2,e:'5600 ÷ 8000 = 70%。对餐饮连锁而言偏高，需结合租赁负债性质与经营现金流判断。'},
{q:'星珠非流动资产 5000 万中商誉 2200 万，净资产 2400 万。商誉/净资产 ≈ 92%，说明？',o:['公司品牌极其强大，是优势','商誉减值风险极高，一旦减值净资产可能几乎被抹平','完全正常','应该继续加大收购'],a:1,e:'92% 意味着净资产几乎全是「收购溢价」这种虚资产。若标的不达预期，一次减值就可能导致资不抵债。这是最高级别的红旗。'},
{q:'其流动负债中「合同负债（储值卡）」1500 万，如何理解？',o:['是坏消息，说明欠钱多','是好消息，客户提前付款相当于无息占用资金，但需保证未来有能力兑付服务','应重分类为收入','应计入权益'],a:1,e:'预收模式是优质商业模式的标志（星巴克、Costco 都靠它）。但它是<b>真实义务</b>，若门店大量关闭将面临兑付压力。好坏取决于经营是否持续。'},
{q:'若星珠用 800 万现金偿还 800 万短期借款，流动比率将？',o:['上升至约 0.79','下降至约 0.79','保持 0.83 不变','上升至 1.0'],a:0,e:'(3000−800) ÷ (3600−800) = 2200 ÷ 2800 ≈ 0.79。<b>反直觉但重要</b>：当流动比率原本小于 1 时，同额偿债会让比率进一步下降。'},
{q:'星珠「一年内到期的非流动负债」1200 万，而账上现金仅 800 万，最应关注？',o:['毛利率','再融资能力与经营现金流能否覆盖到期债务','商誉规模','存货计价方法'],a:1,e:'这是最直接的流动性风险点。核查顺序：经营现金流年度净额 → 未使用银行授信额度 → 可快速处置资产。'},
{q:'仅凭资产负债表，<b>无法</b>直接得知的是？',o:['公司家底结构','负债规模','本年赚了多少利润的形成过程','净资产金额'],a:2,e:'资产负债表只有「留存收益」这个累积结果，利润是怎么来的（收入多少、成本多少）必须看利润表。三张表缺一不可，这正是第 5 章的意义。'}
]}
]},

{
id:'c3',icon:'💰',title:'利润表',desc:'一年的战绩：从收入到净利润，每一层都在漏钱。',
levels:[
{id:'3-1',type:'concept',title:'收入确认：钱到手 ≠ 收入',
analogy:'你收了客户 1000 元定制蛋糕订金，蛋糕还没做。这 1000 元是收入吗？不是，是你欠人家一个蛋糕。收入确认的核心只有一句话：<b>你把该做的事做完了没有？</b>做完了才算赚到。',
formal:'现行准则采用「五步法」：①识别与客户的合同 ②识别合同中的单项履约义务 ③确定交易价格 ④将交易价格分摊至各项履约义务 ⑤在履行每一项履约义务时确认收入。控制权转移是判断核心。',
example:'某软件公司签 3 年合同 360 万，一次收款。若含「软件许可（交付即完成）+ 3 年运维（持续提供）」两项义务，需按公允价值分摊，例如许可 120 万当期确认，运维 240 万分 36 个月确认。若全部一次确认，就是虚增首年利润 240 万。',
quiz:[
{q:'收入确认最关键的判断标准是？',o:['是否收到现金','是否开具发票','履约义务是否完成、商品或服务的控制权是否转移','是否签订合同'],a:2,e:'现金、发票、合同都只是证据，不是标准。控制权转移才是实质。这也解释了为什么预收款不能确认收入。'},
{q:'商场代销模式下（商场只收佣金、不承担存货风险），商场应确认的收入是？',o:['商品全额售价','仅佣金净额','售价的一半','不确认收入'],a:1,e:'这是「总额法 vs 净额法」。不承担存货风险、不控制商品的一方是「代理人」，只能按净额（佣金）确认。很多平台公司靠混用总额法虚增收入规模。'},
{q:'某公司在 12 月 31 日突然向经销商大量发货并全额确认收入，次年 1 月大量退货。这属于？',o:['正常的季节性波动','渠道压货（channel stuffing），提前确认收入的操纵手法','谨慎性原则的体现','净额法应用'],a:1,e:'典型的期末冲收入。识别方法：看第四季度收入占比是否异常、看次年一季度收入是否骤降、看应收账款和存货（经销商端）是否暴增。'}
]},
{id:'3-2',type:'concept',title:'毛利与毛利率：一杯奶茶赚多少',
analogy:'一杯奶茶卖 18 元，原料（茶叶、奶、珍珠、杯子）成本 5 元，毛利 13 元，毛利率 72%。但这 13 元还要付房租、店员工资、外卖平台抽成、总部管理费——最后到手可能只剩 2 元。<b>毛利率决定「有没有资格赚钱」，费用率决定「最终能不能赚到」。</b>',
formal:'毛利 = 营业收入 − 营业成本；毛利率 = 毛利 ÷ 营业收入。营业成本只包含与产出直接相关的成本（原材料、直接人工、制造费用）。毛利率反映产品定价权与成本控制力，是判断商业模式质量的第一指标。',
example:'贵州茅台毛利率长期在 91% 以上（极强定价权）；星巴克约 27%（含门店运营成本口径）；家电制造约 15%–25%；工程施工常低于 10%。<b>跨行业比毛利率毫无意义，必须同业对比。</b>',
quiz:[
{q:'收入 500 万、营业成本 300 万、销售费用 80 万、管理费用 50 万，毛利率是？',o:['14%','40%','60%','24%'],a:1,e:'毛利 = 500 − 300 = 200 万，200 ÷ 500 = 40%。销售费用与管理费用不进营业成本，不影响毛利率。'},
{q:'某公司毛利率连续三年从 42% 降至 28%，最需要排查的是？',o:['公司一定造假','原材料涨价、产品降价竞争、产品结构变化或成本口径调整，需逐项拆解','管理层能力','税率变化'],a:1,e:'毛利率下滑是趋势性信号而非结论。拆解路径：量价拆分（是降价还是成本涨）→ 产品结构（低毛利产品占比升高？）→ 与同业对比（是行业性还是公司性）。'},
{q:'一家公司毛利率显著高于所有同业（如同业 25%，它 55%），应该？',o:['直接判断为优质公司买入','警惕：核查是否成本归集口径不同、是否存在关联交易或虚增收入','认为行业分类错了','忽略此信息'],a:1,e:'异常高毛利要么是真护城河（专利、品牌），要么是财务异常。核查方法：把部分成本挪到销售/管理费用会人为抬高毛利率；关联方低价供货同理。这是侦探关的经典疑点。'}
]},
{id:'3-3',type:'mcq',title:'三费 + 财务费用',
intro:'<b>销售费用</b>：为了把货卖出去（广告、渠道、销售人员薪酬）。<b>管理费用</b>：维持公司运转（行政、总部薪酬、办公）。<b>研发费用</b>：为了未来（研发人员、试验）。<b>财务费用</b>：用钱的代价（利息净支出、汇兑损益）。这四项从毛利里往外掏钱。',
quiz:[
{q:'外卖平台佣金支出应计入？',o:['营业成本','销售费用','管理费用','财务费用'],a:1,e:'属于为促成销售发生的支出，计入销售费用。不同公司归集口径可能不同，比较毛利率时要看附注确认口径一致。'},
{q:'研发支出资本化 vs 费用化的差别是？',o:['没有差别','资本化计入无形资产（不减当期利润，未来摊销），费用化直接减少当期利润','资本化减少利润更多','只影响现金流'],a:1,e:'这是最重要的利润调节阀之一。高资本化率会推高当期利润、增厚资产。分析时应关注「研发资本化率」的突然上升，以及后续是否出现无形资产减值。'},
{q:'销售费用率（销售费用/收入）从 12% 升至 25%，而收入仅增 5%，说明？',o:['营销效率提升','获客成本大幅上升、投入产出比恶化','产品竞争力增强','成本控制有效'],a:1,e:'花双倍的钱只换来 5% 增长，是典型的「买增长」。持续下去会侵蚀净利率。要看客单价、复购率是否同步改善。'},
{q:'某公司财务费用为<b>负数</b>，说明？',o:['报表错误','利息收入大于利息支出，公司现金充裕、几乎无有息负债','公司在亏损','汇率一定升值了'],a:1,e:'现金富余型公司常出现（如茅台）。财务费用为负是低杠杆、高现金的标志之一，但也可能意味着资本运用效率不高。'}
]},
{id:'3-4',type:'concept',title:'从收入到净利润：瀑布结构',viz:'waterfall',
analogy:'把收入想成山顶的一桶水，往下流经好几道闸门：先扣原料（营业成本）→ 再扣卖货和管人的钱（三费）→ 再扣利息（财务费用）→ 再扣税。每道闸门都放走一些，最后流到桶底的才是<b>净利润</b>。看财报要看「水在哪一道闸门漏得最多」。',
formal:'营业收入 − 营业成本 − 税金及附加 − 销售/管理/研发/财务费用 ± 其他收益/投资收益/资产减值 = <b>营业利润</b>；± 营业外收支 = <b>利润总额</b>；− 所得税费用 = <b>净利润</b>；再分归母净利润与少数股东损益。',
example:'某公司收入 100 亿：营业成本 62 亿 → 毛利 38 亿；销售 12、管理 6、研发 5、财务 1 → 营业利润 14 亿；营业外净收入 1 亿 → 利润总额 15 亿；所得税 3.4 亿 → 净利润 11.6 亿。净利率 11.6%。同时要问：14 亿营业利润里有多少是主营挣的？',
quiz:[
{q:'营业利润与利润总额的差别在于？',o:['是否扣所得税','是否包含营业外收支（如政府补助中的非经常项、资产处置损益等）','是否包含毛利','没有差别'],a:1,e:'营业利润衡量「主营生意本身赚不赚钱」，利润总额加入了偶发项。分析时更看重营业利润，因为它可持续。'},
{q:'公司净利润 5 亿，其中卖掉一栋办公楼获利 4 亿，如何评价？',o:['盈利能力很强','扣非后仅约 1 亿，主营盈利能力弱，5 亿不可持续','与主营无关不必关心','说明资产管理优秀'],a:1,e:'必须看<b>扣非归母净利润</b>。一次性收益不能外推，用含非经常损益的利润做估值会严重高估。'},
{q:'所得税费用 ÷ 利润总额 得出的有效税率远低于法定 25%，可能原因？',o:['一定是逃税','享受高新技术企业等税收优惠、有可弥补亏损、或确认了递延所得税资产','会计算错了','与利润无关'],a:1,e:'合理原因很多，但如果有效税率异常低且无法解释，需警惕利润虚增（虚构的利润通常不需要真交税，因此会拉低有效税率）。这是识别造假的一个交叉验证点。'}
]},
{id:'3-5',type:'mcq',title:'EPS 与非经常性损益',
intro:'<b>EPS（每股收益）= 归母净利润 ÷ 加权平均普通股股数</b>。它把利润换算到「一股」的口径，方便跨公司比较，也是市盈率 PE 的分母。而<b>非经常性损益</b>是必须剔除的噪音。',
quiz:[
{q:'归母净利润 6 亿，加权平均股本 3 亿股，EPS 是？',o:['0.5 元','2 元','18 元','无法计算'],a:1,e:'6 ÷ 3 = 2 元/股。若股价 40 元，则 PE = 40 ÷ 2 = 20 倍。'},
{q:'公司大额回购并注销股票，在净利润不变时 EPS 会？',o:['下降','上升，因为分母股本减少','不变','变成负数'],a:1,e:'这是苹果长期做的事：用现金回购推高 EPS。需注意这不代表主营变强，分析时要同时看净利润本身的增长。'},
{q:'以下哪项属于非经常性损益？',o:['主营产品销售收入','出售子公司的一次性投资收益','正常的员工薪酬','日常原材料采购成本'],a:1,e:'非经常性损益包括资产处置损益、非流动资产减值、与主营无关的政府补助、债务重组收益等——特征是「不可持续」。'},
{q:'用「稀释每股收益」而非「基本每股收益」的原因是？',o:['数字更好看','考虑可转债、期权等潜在稀释因素，给出更保守的口径','准则要求二选一','与股本无关'],a:1,e:'潜在普通股一旦转股会摊薄现有股东权益。稀释 EPS 更保守，投资分析中应以稀释口径为准。'}
]},
{id:'3-6',type:'boss',title:'BOSS：重建珍珠星球的利润表',time:180,
quiz:[
{q:'收入 8000 万、营业成本 4400 万，毛利率是？',o:['45%','55%','40%','36%'],a:0,e:'(8000−4400)/8000 = 3600/8000 = 45%。'},
{q:'承上：销售费用 1400、管理费用 600、研发 200、财务费用 100、税金及附加 100，营业利润是？',o:['1200 万','1300 万','1100 万','3600 万'],a:0,e:'3600 − 100 − 1400 − 600 − 200 − 100 = 1200 万。营业利润率 15%。'},
{q:'承上：营业外净收入 300 万（政府一次性奖励），所得税率 25%，净利润约？',o:['900 万','1125 万','1500 万','1200 万'],a:1,e:'利润总额 = 1200 + 300 = 1500；所得税 = 375；净利润 = 1125 万。'},
{q:'承上：其中 300 万政府奖励属非经常性，扣非净利润约为？',o:['1125 万','900 万','825 万','1500 万'],a:2,e:'扣除税后影响：300 × (1−25%) = 225 万；1125 − 225 = 900 万。若按题目 A 股常用口径直接扣税后非经常项，答案为 900 万；若同时考虑该奖励对应无可抵扣项，825 万为更保守估计。<b>核心是记住：必须扣、且要扣税后金额。</b>'},
{q:'若股本 3000 万股，基本 EPS（按净利润）约为？',o:['0.375 元','0.30 元','3.75 元','0.50 元'],a:0,e:'1125 ÷ 3000 = 0.375 元/股。用扣非利润算则约 0.30 元，估值时应参考后者。'},
{q:'次年公司把 200 万研发支出全部资本化（上年全部费用化），对利润的影响？',o:['利润减少 200 万','当期利润增加约 200 万（税前），但资产增加、未来摊销压力后移','没有影响','现金流增加 200 万'],a:1,e:'会计政策变化制造的「纸面增长」。识别方法：对比研发资本化率的年度变化，并检查无形资产是否随后出现减值。'},
{q:'毛利率 45% 但净利率仅 14%，漏损最大的环节是？',o:['所得税','销售费用（占收入 17.5%）','财务费用','研发费用'],a:1,e:'1400/8000 = 17.5%，是最大的单项支出。改善方向：提升复购降低获客成本、优化渠道结构。分析利润表要养成「算费用率」的习惯。'},
{q:'关于利润表，下列说法正确的是？',o:['利润表上的利润等于当年增加的现金','利润表是权责发生制的产物，包含大量估计与判断，必须与现金流量表交叉验证','利润表不受会计政策影响','净利润越高现金一定越多'],a:1,e:'折旧年限、坏账比例、研发资本化、收入确认时点都是判断。所以「利润是观点，现金是事实」——这正是下一章的主题。'}
]}
]},

{
id:'c4',icon:'💧',title:'现金流量表',desc:'利润是观点，现金是事实。公司的血液检测。',
levels:[
{id:'4-1',type:'concept',title:'现金为王：为什么赚钱的公司会死',
analogy:'你的奶茶店今年账面净利润 100 万，老板很开心。但这 100 万全在「应收账款」里——客户欠着没给。而房租、工资、奶粉款都要付现金。到了月底，你有 100 万利润，账上只有 3 万块，房东上门催租。<b>企业不是因为亏损而死，是因为没现金而死。</b>',
formal:'现金流量表按<b>收付实现制</b>编制，反映一定期间现金及现金等价物的流入流出，分为经营活动、投资活动、筹资活动三大类。三者合计 + 汇率影响 = 现金净增加额，期初现金 + 净增加额 = 期末现金，与资产负债表的现金项目相互勾稽。',
example:'某明星企业连续 5 年账面盈利，累计净利润 30 亿，但同期经营活动现金流净额累计为 −18 亿。差额被应收账款和存货吸收。第 6 年债务到期无法续贷，直接违约。<b>净利润与经营现金流长期背离，是最可靠的暴雷预警信号。</b>',
quiz:[
{q:'「利润是观点，现金是事实」的根本原因是？',o:['会计师喜欢现金','利润受收入确认时点、折旧年限、坏账估计等大量主观判断影响，而现金收付难以主观虚构','现金流量表更简单','准则规定'],a:1,e:'利润是多个估计叠加的结果，现金流则要求银行流水支撑。虽然现金流也可被操纵（如年末借款冲流水、票据置换），但难度和留痕都远高于调利润。'},
{q:'一家公司连续三年净利润为正、经营现金流为负，最合理解读是？',o:['成长期正常现象，无需关注','利润未转化为现金，需核查应收账款、存货、关联交易与收入真实性','说明公司在扩张，是好事','现金流量表编错了'],a:1,e:'短期为负可能因扩张备货，但<b>连续三年</b>就是结构性问题。核查动作：净利润与 CFO 差额的构成、应收周转天数趋势、大客户是否关联方。'},
{q:'现金流量表中的「现金及现金等价物」包括？',o:['只有库存现金','库存现金、银行存款及持有不超三个月、流动性强、价值变动风险小的投资','所有金融资产','应收账款'],a:1,e:'关键是「三个月内到期 + 流动性强 + 价值稳定」。长期理财、股票投资都不算，这会影响你计算真实可动用资金。'}
]},
{id:'4-2',type:'drag',title:'三大活动分类',
intro:'<b>经营活动</b>：主营生意的日常收付（卖货收钱、买料付钱、发工资、交税）。<b>投资活动</b>：买卖长期资产与对外投资。<b>筹资活动</b>：与股东和债主之间的钱（借款、还款、增资、分红、付利息在我国准则下计入筹资）。把下列项目拖入正确分类。',
buckets:['经营活动','投资活动','筹资活动'],
items:[
{t:'销售奶茶收到现金',b:'经营活动',e:'主营业务现金流入，经营活动的核心。'},
{t:'支付供应商奶粉货款',b:'经营活动',e:'购买商品接受劳务支付的现金，经营活动流出。'},
{t:'支付员工工资',b:'经营活动',e:'支付给职工以及为职工支付的现金。'},
{t:'缴纳企业所得税',b:'经营活动',e:'支付的各项税费，归入经营活动。'},
{t:'购买新门店的装修与设备',b:'投资活动',e:'购建固定资产支付的现金，即资本支出 CapEx，投资活动流出。'},
{t:'收购一家竞品奶茶品牌',b:'投资活动',e:'取得子公司支付的现金净额，投资活动流出。'},
{t:'出售闲置厂房收到现金',b:'投资活动',e:'处置固定资产收回的现金净额，投资活动流入。'},
{t:'购买 3 年期理财产品',b:'投资活动',e:'投资支付的现金（非现金等价物），投资活动流出。'},
{t:'向银行取得新贷款',b:'筹资活动',e:'取得借款收到的现金，筹资活动流入。'},
{t:'偿还贷款本金',b:'筹资活动',e:'偿还债务支付的现金，筹资活动流出。'},
{t:'支付借款利息',b:'筹资活动',e:'我国准则将支付利息列入筹资活动（分配股利、利润或偿付利息支付的现金）。IFRS 下可选列经营活动，跨境比较要留意。'},
{t:'向股东派发现金红利',b:'筹资活动',e:'分配股利支付的现金，筹资活动流出。'}
]},
{id:'4-3',type:'concept',title:'核心难点：净利润 ≠ 经营现金流',viz:'bridge',
analogy:'净利润像「体重秤读数」，经营现金流像「实际肌肉量」。要从前者推到后者，要做三类调整：①<b>加回不花钱的费用</b>（折旧、摊销、减值——它们减了利润却没出钱）②<b>剔除不属于经营的损益</b>（利息、投资收益、资产处置损益）③<b>调整运营资金变动</b>（应收增加要减掉，那是没收到的钱；存货增加要减掉，钱变成了货；应付增加要加回，那是暂时没付的钱）。',
formal:'间接法公式：净利润 + 折旧摊销 + 减值损失 + 利息支出 ± 处置损益 ± 递延所得税 − 经营性应收项目的增加 − 存货的增加 + 经营性应付项目的增加 = <b>经营活动产生的现金流量净额（CFO）</b>。两个关键比率：净现比（CFO ÷ 净利润）应长期 ≥ 1；收现比（销售商品收到的现金 ÷ 营业收入）应接近 1+增值税率。',
example:'珍珠星球本年：净利润 1125 万，折旧摊销 +480 万，利息支出 +100 万，应收账款增加 −620 万，存货增加 −310 万，应付账款增加 +240 万 → CFO = 1015 万。净现比 0.90，尚可接受。若应收再多增 500 万，CFO 就跌到 515 万，净现比 0.46——同样的利润，完全不同的健康度。',
quiz:[
{q:'为什么间接法要将折旧「加回」净利润？',o:['因为折旧是收入','因为折旧在利润表中扣减了利润，但它当期并未支付任何现金','因为折旧会增加资产','因为准则要求'],a:1,
e:'现金在买设备那年就一次流出了（计入投资活动），之后每年的折旧只是账面分摊。所以从利润回推现金时必须加回。<b>这也意味着重资产行业的 CFO 天然高于净利润。</b>'},
{q:'应收账款本年增加 800 万，在间接法中应如何调整？',o:['加 800 万','减 800 万','不调整','加 400 万'],a:1,
e:'应收增加意味着有 800 万收入计入了利润但钱没到，必须从利润中减除。反之，应付增加说明你暂时欠着没付，要加回。'},
{q:'某公司净利润 5 亿、CFO 0.5 亿，净现比 0.1，应优先排查？',o:['税率变化','应收账款与存货是否大幅增加，收入是否真实','毛利率','股本结构'],a:1,
e:'净现比长期低于 0.5 是高危信号。拆解顺序：先看间接法补充资料里哪一项调整数额最大，再顺着那一项挖（通常是应收或存货）。'}
]},
{id:'4-4',type:'concept',title:'自由现金流 FCF：真正属于你的钱',
analogy:'你的奶茶店今年经营收了 300 万现金，听起来很美。但为了保住生意，你必须每年花 250 万重新装修、换设备。真正能抽出来分红、还债、扩张的只有 50 万。<b>FCF 才是股东真正能拿到的钱，也是所有估值模型的分子。</b>',
formal:'自由现金流 FCF = 经营活动现金流净额（CFO）− 资本性支出（CapEx，即购建固定资产、无形资产和其他长期资产支付的现金）。需区分<b>维护性 CapEx</b>（保住现有产能）与<b>成长性 CapEx</b>（扩张）：后者高并不一定是坏事。',
example:'茅台式企业：CFO 100 亿、CapEx 8 亿 → FCF 92 亿，轻资产印钱机。重资产制造业：CFO 100 亿、CapEx 95 亿 → FCF 5 亿，赚的钱都得再投回去。同样 100 亿 CFO，投资价值天差地别。',
quiz:[
{q:'CFO 8 亿、购建固定资产支付现金 3 亿、分红 1 亿，FCF 是？',o:['4 亿','5 亿','8 亿','11 亿'],a:1,
e:'FCF = 8 − 3 = 5 亿。分红是 FCF 的<b>用途</b>，不是计算 FCF 时的扣除项。这是最常见的计算陷阱。'},
{q:'一家公司 FCF 长期为负，但 CFO 为大额正数，最可能的情况是？',o:['公司在亏损','处于大规模扩张期，资本支出很大；需判断扩张的回报率是否合理','一定是造假','现金流量表错了'],a:1,
e:'亚马逊早期、台积电扩产期都是这种形态。关键是问：这些 CapEx 未来能否带来超过资本成本的回报？验证方式是跟踪 ROIC 与产能利用率。'},
{q:'为什么估值用 FCF 而不是净利润？',o:['FCF 数字更大','净利润包含非现金项且未扣除维持经营必需的再投资，FCF 更接近股东可支配的真现金','净利润不可靠','两者没区别'],a:1,
e:'估值的本质是「未来能从企业抽出多少现金」。净利润可以很高而企业仍在不断伸手要钱，那种利润对股东无意义。'}
]},
{id:'4-5',type:'mcq',title:'三符号组合：8 种公司体质画像',
intro:'把经营（O）、投资（I）、筹资（F）三个净额的正负号排列，能快速画出一家公司的生命阶段：<br><b>+ − −</b> 成熟健康型（自己赚钱、自己投资、还能还债分红）——最优质<br><b>+ − +</b> 成长扩张型（边赚边借边投）<br><b>− − +</b> 高风险烧钱型（主营失血、靠融资活着）<br><b>+ + −</b> 收缩偿债型（卖资产还钱）',
quiz:[
{q:'经营 +、投资 −、筹资 − 的公司通常处于？',o:['初创期','成熟期：主营造血、持续投入、并能还债分红','衰退期','破产前夕'],a:1,
e:'这是最健康的组合：不靠外部输血，自己就能支撑投资并回报股东。苹果、茅台、可口可乐长期展现这个形态。'},
{q:'经营 −、投资 −、筹资 + 且已持续三年，最大风险是？',o:['利润下滑','一旦融资环境收紧，现金链立即断裂','毛利率下降','存货积压'],a:1,
e:'主营不造血、还在大投资，完全靠借新还旧。这是典型的「庞氏骗局式」现金结构，历史上大多数债务违约案例在爆雷前 2–3 年就已呈现这个特征。'},
{q:'经营 +、投资 +、筹资 −，最可能在做什么？',o:['大规模扩张','可能在变卖资产/收回投资并集中偿还债务或大额分红回购','新建工厂','大量备货'],a:1,
e:'投资为正意味着在“收钱”而非花钱。可能是健康的聚焦主业（剥离不赚钱的业务），也可能是断臂求生。需看处置的是核心资产还是包袖。'},
{q:'一家公司经营现金流很好但它是靠大量拖欠供应商货款实现的，如何评价？',o:['很健康','需警惕：应付账款/存货周转异常伸长可能是供应链强势，也可能是无钱可付','完全不重要','说明成本控制好'],a:1,
e:'两种解释截然不同：京东、Costco 是真强势（同时存货周转快、银行存款充裕）；而现金果乘较少、应付突然拉长的公司往往是资金紧张。必须交叉比对存货周转与现金余额。'}
]},
{id:'4-6',type:'boss',title:'BOSS：现金流断裂危机',time:180,
quiz:[
{q:'净利润 2000、折旧摊销 600、应收增加 900、存货增加 400、应付增加 300（单位万元，忽略其他），CFO 是？',o:['1600 万','2600 万','1200 万','3000 万'],a:0,e:'2000 + 600 − 900 − 400 + 300 = 1600 万。口诀：非现金费用加回，应收存货增加减掉，应付增加加回。'},
{q:'承上：当年购建固定资产支付 1300 万，FCF 是？',o:['300 万','2900 万','1600 万','−1300 万'],a:0,e:'1600 − 1300 = 300 万。虽然净利润 2000 万，真正自由的钱只有 300 万。'},
{q:'承上：公司本年需偿还到期借款 1500 万、付利息 100 万，期初现金 600 万、无新增融资，期末现金为？',o:['−700 万，存在违约风险','1400 万','600 万','300 万'],a:0,e:'600 + 1600 − 1300 − 1500 − 100 = −700 万。现金不可能为负，说明必须再融资、展期或处置资产，否则违约。<b>这就是「赚钱的公司被现金流猝死」的完整推演。</b>'},
{q:'面对上题危机，下列哪个动作<b>最快</b>缓解现金缺口且不损害主营？',o:['加大广告投放抢收入','加速应收回款与应收账款保理，同时推迟非必要 CapEx','大量备货防涨价','回购股票提振信心'],a:1,e:'现金危机的优先级是「收钱 + 少花」。应收保理/保守保发能快速变现，推迟 CapEx 直接减少流出。其他选项都是让现金更紧。'},
{q:'收现比（销售商品提供劳务收到的现金 ÷ 营业收入）长期仅 0.6，说明？',o:['正常，因为有增值税','大约四成收入没收到现金，收入质量差','公司税负低','毛利率高'],a:1,e:'正常制造业收现比应在 1.0–1.13 之间（因含增值税）。长期 0.6 说明收入大量没变成钱，需要结合应收及票据一起看（有些公司收的是商业汇票，不计入现金）。'},
{q:'公司年末大额短期借款让账上现金看起来很多，如何识穿？',o:['相信资产负债表就好','看现金流量表的筹资活动，并计算「现金 − 有息负债」的净现金','只看利润表','看存货'],a:1,e:'要算<b>净现金</b>（现金及等价物 − 短期借款 − 长期借款 − 应付债券）。同时看财务费用：真有钱的公司不会交大额利息。「存贷双高」是经典造假红旗。'},
{q:'下列事项中，<b>不会</b>影响经营活动现金流的是？',o:['支付员工工资','计提商誉减值 5 亿','收回应收账款','支付供应商货款'],a:1,e:'商誉减值是纯账面处理，不动现金，在间接法下会被完全加回。这也是判断「巨亏是真失血还是账面洗澡」的关键工具。'},
{q:'一家公司 CFO 连续三年高于净利润且 FCF 稳定为正，最合理的初步判断是？',o:['一定是好公司，可以无条件买入','盈利质量良好，但仍需确认增长持续性与估值是否合理','它在造假','它在衰退'],a:1,e:'这是强力的盈利质量证据（预收模式、重资产企业常见），但财务质量≠投资回报。还要看行业空间、竞争格局与价格。财报分析给你「排除项」，不直接给「买入价」。'}
]}
]},

{
id:'c5',icon:'🔗',title:'三表联动',desc:'核心难点：一笔交易如何同时穿透三张表。',
levels:[
{id:'5-1',type:'concept',title:'三表关系总图',viz:'linkmap',
analogy:'把三张表想成一个水系：<b>利润表</b>是今年下了多少雨（本期经营成果），雨水流进<b>资产负债表</b>的水库（变成留存收益，抬高水位）；<b>现金流量表</b>则专门监测水库里「真正的液体水」增减了多少（因为有些雨落在了应收账款这块海绵上，还没流进水库）。',
formal:'三表三条硬勾稽：<b>①</b>利润表的净利润 → 资产负债表的未分配利润（期末留存收益 = 期初 + 净利润 − 分红）；<b>②</b>现金流量表的期末现金 = 资产负债表的货币资金项；<b>③</b>现金流量表的经营净额 = 净利润 ± 非现金项目 ± 资产负债表运营资金科目的变动。',
example:'任何一份真实报表都可以用这三条验证。实战技巧：拿到一份财报，先用「期初未分配利润 + 净利润 − 分红 = 期末未分配利润」算一遗，对不上就要去附注找原因（直接计入权益的项目、会计差错更正、股份支付等）。',
quiz:[
{q:'三表之间最根本的链接点是？',o:['毛利率','净利润进入留存收益，现金变动对应货币资金','存货周转率','股本'],a:1,
e:'一个连接利润表与资产负债表，一个连接现金流量表与资产负债表。把这两根钉子记牢，三表就吐成一个模型。'},
{q:'期初未分配利润 800 万，当年净利润 300 万，分红 100 万，期末未分配利润？',o:['1100 万','1000 万','900 万','700 万'],a:1,
e:'800 + 300 − 100 = 1000 万。这条勾稽很多人从未手算过，但它是建模与查错的基本功。'},
{q:'如果一家公司现金流量表期末现金与资产负债表货币资金不一致，最可能的合理解释是？',o:['一定是造假','货币资金中含受限制资金（保证金、冻结存款），不属于现金等价物','利润表算错','与分红有关'],a:1,
e:'这是极具实战价值的细节：很多公司账上「现金很多」却不能用，因为大部分是开证保证金或被冻结。必须去附注看「使用受限制的货币资金」金额。'}
]},
{id:'5-2',type:'concept',title:'穿透演练一：赊销一笔',viz:'trisync',
analogy:'你赊销了 100 万奶茶券，成本 40 万。<b>利润表</b>：收入 +100、成本 +40、利润 +60（忽略税）。<b>资产负债表</b>：应收账款 +100、存货 −40、留存收益 +60（左右各 +60，仍平衡）。<b>现金流量表</b>：经营净额 = +60（净利）−100（应收增）+40（存货减）= <b>0</b>。利润涨了 60 万，现金一分没动。',
formal:'任何交易的穿透都按固定三步走：<b>第 1 步</b>先写分录（借什么、贷什么）；<b>第 2 步</b>看分录中是否碰到收入/费用类科目 → 影响利润表；<b>第 3 步</b>看分录中是否碰到货币资金 → 影响现金流量表。三个问题问完，三表影响自然浮现。',
example:'这正是「高增长、高利润、零现金」公司的微观机制。把这一笔重复 20 次，就得到一家利润 1200 万、经营现金流 0 的公司——报表完全合规，但它交不出工资。',
quiz:[
{q:'赊销一笔业务，三表影响正确的是？',o:['利润↑、现金↑、资产↑','利润↑、现金不变、资产结构变化（应收↑存货↓）','利润不变、现金↑','三表都不变'],a:1,
e:'赊销同时完成了两件事：确认收入（利润↑）与结转成本（存货↓）。没有任何现金科目被碰到，所以 CFO 不变。'},
{q:'下月客户把 100 万还了，三表影响是？',o:['利润再↑100 万','利润不变，应收↓100、现金↑100，经营现金流 +100 万','负债↓','权益↑100 万'],a:1,
e:'<b>收入只确认一次。</b>回款阶段仅是资产形态转换 + 现金流入。这也解释了为什么一家公司可能出现「收入下滑但经营现金流大增」（集中收回旧账）。'},
{q:'若赊销后客户破产，计提 100% 坏账，当初确认的 60 万利润会？',o:['自动冲回','需通过信用减值损失 100 万冲减后期利润，累计看变成亏损 40 万','不用处理','只改现金流量表'],a:1,
e:'收入不能追溯冲回，只能在<b>后期</b>计提减值。总账看：+60 − 100 = −40 万（即白派的 40 万成本）。这就是为什么激进赊销只能提前透支利润，早晚要还。'}
]},
{id:'5-3',type:'mcq',title:'穿透演练二：买设备付现',
intro:'花 1000 万现金买一条生产线（预计用 10 年，无残值，直线法）。分录：借 固定资产 1000 / 贷 银行存款 1000。注意：<b>没有碰到任何收入费用科目</b>，所以当期利润完全不变；但现金实实在在少了 1000 万，计入<b>投资活动</b>。',
quiz:[
{q:'买设备当年对三表的影响是？',o:['利润↓1000 万、现金↓1000 万','利润不变、总资产不变（结构改变）、投资活动现金流出 1000 万','利润↑、现金↓','负债↑1000 万'],a:1,
e:'现金→固定资产，都是资产，总额不变。利润表当期零影响。<b>这是为什么一家狂抗拟资本开支的公司可以利润很好看却没现金。</b>'},
{q:'该设备第一年折旧 100 万（计入营业成本），对三表的影响？',o:['利润↓100、固定资产净值↓100、现金不变（间接法中加回）','利润↓100、现金↓100','只影响现金流','无影响'],a:0,
e:'折旧是「上年已付过钱的资产在今年被用掉一部分」。它减利润、减资产，但不动现金——所以 CFO 计算时要加回。<b>这是全课最重要的一个知识点。</b>'},
{q:'若公司把折旧年限从 10 年改为 20 年，当期影响？',o:['当期利润增加 50 万（少提折旧），但现金流完全不变','利润与现金同时增加','现金增加 50 万','无任何影响'],a:0,
e:'折旧从 100 降为 50 万，利润凭空多了 50 万。这是典型的会计估计调节。<b>识别方法：对比附注中固定资产折旧年限与同业，年限明显偏长就要警惕。</b>'},
{q:'重资产公司的 CFO 通常高于净利润，原因是？',o:['它们更优质','折旧摊销金额大，作为非现金费用被全部加回','它们不交税','应收很少'],a:1,
e:'所以不能单看 CFO/净利润 高就说好，要进一步看 FCF（扣掉 CapEx）。重资产企业的 CFO 很大一部分必须拿去重新买设备。'}
]},
{id:'5-4',type:'concept',title:'穿透演练三：最反直觉的一关 · 计提折旧',viz:'trisync',
analogy:'你买了一部 12000 元的手机，打算用 3 年。买的那天你真金白银掉了 12000（现金流出），但你不会说自己那个月「花了 12000 生活费」——你会说每月「摄销」了约 333 元。折旧就是企业版的这个动作：<b>现金早就付完了，之后每年只是把它一点点搬到利润表上。</b>',
formal:'计提折旧分录：借 营业成本/管理费用 X / 贷 累计折旧 X。三表影响：利润表费用↑、利润↓X；资产负债表固定资产净值↓X、留存收益↓X（两边同时缩小，仍平衡）；现金流量表：<b>零影响</b>，在间接法中作为非现金项目全额加回。',
example:'将同样道理套用到其他非现金项：无形资产摊销、商誉减值、存货跌价准备、坏账准备、股份支付费用——它们全部是「减利润不减现金」。掌握这一类，你就能看懂 90% 的净利润与 CFO 差异。',
quiz:[
{q:'计提折旧 500 万，对现金的影响是？',o:['现金减少 500 万','现金减少 125 万','完全不影响现金','现金增加 500 万'],a:2,
e:'现金在购买设备那年已经一次流出完了。后续每年的折旧只是账面重新分配。这是零基础最高频的认知误区。'},
{q:'折旧使资产负债表两边发生什么？',o:['只有左边减少，不再平衡','左边固定资产净值↓，右边留存收益↓，同额缩小仍平衡','右边负债↑','两边同时增加'],a:1,
e:'费用侵蚀的是权益（通过净利润→留存收益）。这也再一次验证了「费用为何记借方」。'},
{q:'一家公司本年净利润 −800 万（亏损），其中包含商誉减值 2000 万，其他正常。如何判断？',o:['公司真实失血 800 万','主营仍盈利约 1200 万，亏损主要来自一次性非现金减值，应看经营现金流确认','公司即将破产','无法判断'],a:1,
e:'这是真实分析框架：把非现金、一次性项剔开，看主营底盘。同时要警惕反向情况：公司可能利用已经亏损的年度一次性计提大额减值（财务洗澡）。'}
]},
{id:'5-5',type:'sandbox',title:'三表联动沙盒'},
{id:'5-6',type:'boss',title:'BOSS：十笔交易全穿透',time:240,
quiz:[
{q:'股东增资 500 万现金。三表影响？',o:['利润↑500、现金↑500','利润不变、资产↑500、权益↑500、筹资现金流入 500','负债↑500','经营现金流入 500'],a:1,e:'增资不是收入，不过利润表；现金流入属筹资活动。'},
{q:'以现金 300 万购买存货。三表影响？',o:['利润↓300','利润不变、总资产不变、经营现金流出 300','投资现金流出 300','权益↓300'],a:1,e:'存货未卖出不结转成本，利润不变；但买原料属经营活动现金流出。<b>这就是备货拖累 CFO 的机制。</b>'},
{q:'将上述存货中的 200 万以 400 万赊销。对 CFO 的影响？',o:['+400 万','+200 万','0（利润+200、应收−400、存货+200）','−200 万'],a:2,e:'利润 +200，应收增加要减 400，存货减少要加 200 → 净影响 0。利润凭空多了 200 万，现金一分未增。'},
{q:'支付本年房租 150 万现金。三表影响？',o:['利润↓150、现金↓150、经营现金流出 150','利润不变','投资现金流出','只影响资产负债表'],a:0,e:'既碰费用又碰现金，三表全动。这类「利润与现金同步」的交易才是健康业务的主体。'},
{q:'计提本年应付未付的年终奖金 200 万。三表影响？',o:['利润↓200、负债↑200、现金不变（CFO 不变）','利润↓200、现金↓200','无影响','资产↓200'],a:0,e:'计提未付，形成应付职工薪酬（负债）。利润已减但现金未出，间接法下作为经营性应付增加加回。<b>年末大量拖工资会美化 CFO。</b>'},
{q:'偿还银行本金 300 万 + 利息 20 万。对利润表的影响？',o:['利润↓320 万','利润仅↓20 万（本金不过利润表）','利润不变','利润↓300 万'],a:1,e:'本金是负债减少，利息才是费用。两者在现金流量表上都归筹资活动（我国准则）。'},
{q:'预收客户储值卡 600 万现金（未提供服务）。三表影响？',o:['收入↑600、利润↑','利润不变、现金↑600、合同负债↑600、经营现金流入 600','筹资现金流入 600','权益↑600'],a:1,e:'这是最美的业务形态：<b>现金先到、利润后确认</b>。它会造成 CFO 远大于净利润，是星巴克/Costco 模式的财务指纹。'},
{q:'计提存货跌价准备 80 万。对 CFO 的影响？',o:['− 80 万','0（利润↓80 但作为非现金项加回）','+80 万','无法判断'],a:1,e:'非现金减值一律在间接法中加回。所以「大额减值年度的 CFO 反而显得很好看」并不奇怪。'},
{q:'回购并注销股票 400 万。三表影响？',o:['利润↓400','利润不变、现金↓400、权益↓400、筹资现金流出 400（EPS 会上升）','投资现金流出','负债↓400'],a:1,e:'回购是对股东的资本返还，不进利润表。它降低权益、推高 ROE 与 EPS——看到 ROE 上升时必须先确认是否因为分母被回购缩小。'},
{q:'综合判断：一家公司利润高速增长、CFO 接近零、CapEx 巨大、筹资活动持续大额流入。最合理的结论是？',o:['优质成长股，应重仓买入','高风险：利润未变现、扩张完全靠外部融资，一旦融资受限或应收坏账就会崩盘','完全健康','仅需关注毛利率'],a:1,e:'这是历史上绝大多数财务造假与债务爆雷公司的完整画像。三表联动的终极价值就在于：<b>单看任何一张表都可能被骗，三张一起看就很难骗你。</b>'}
]}
]},

{
id:'c6',icon:'🕵️',title:'财报分析实战',desc:'杜邦分析、周转率、偿债能力与造假识别。',
levels:[
{id:'6-1',type:'concept',title:'ROE 与杜邦分析三齿轮',viz:'gears',
analogy:'股东只关心一件事：我投的 100 块今年给我赚了多少？这就是 ROE。而赚钱只有三种活法：<b>①卖得贵</b>（茅台：卖一矶赚很多）、<b>②卖得快</b>（沃尔玛：一矶赚得少但转得快）、<b>③借钱放大</b>（银行：用别人的钱做生意）。三个齿轮乘在一起就是 ROE。',
formal:'ROE = 净利润 ÷ 平均净资产。杜邦拆解：<b>ROE = 销售净利率 × 总资产周转率 × 权益乘数</b>，即（净利润/收入）×（收入/总资产）×（总资产/净资产）。ROA = 净利润 ÷ 总资产，不含杠杆因素。',
example:'三种 20% ROE：<b>A（高端白酒）</b>净利率 50% × 周转 0.5 × 杠杆 0.8 ≈ 20%；<b>B（超市）</b>净利率 2.5% × 周转 3.2 × 杠杆 2.5 ≈ 20%；<b>C（激进地产）</b>净利率 8% × 周转 0.25 × 杠杆 10 = 20%。同样的 ROE，风险天差地别——C 只需要银行抽贷就死。',
quiz:[
{q:'销售净利率 10%、总资产周转率 1.2、权益乘数 2.5，ROE 是？',o:['12%','30%','25%','13.7%'],a:1,e:'10% × 1.2 × 2.5 = 30%。同时 ROA = 10% × 1.2 = 12%，差额全靠杠杆放大。'},
{q:'两家公司 ROE 都是 25%，A 靠高净利率，B 靠权益乘数 8 倍。哪家风险更大？',o:['A','B，因为高杠杆在行业下行或利率上升时会放大亏损与偿债风险','一样','无法判断'],a:1,e:'杠杆是双向放大器。看到高 ROE 必须先拆开看成因，否则你会把一家高危公司误认为优质企业。'},
{q:'公司 ROE 从 15% 升至 24%，但净利率与周转率都没变，最可能原因？',o:['盈利能力提升','权益乘数上升（加杠杆或大额回购缩减净资产）','成本下降','税率下降'],a:1,e:'三个因子两个不变，变化必然来自第三个。区分「真赚钱能力提升」与「只是加了杠杆」是杜邦分析最大的实用价值。'}
]},
{id:'6-2',type:'mcq',title:'周转率家族：效率的体温计',
intro:'<b>存货周转天数</b> = 平均存货 ÷ 营业成本 × 365（货在仓库躺多久）<br><b>应收周转天数</b> = 平均应收 ÷ 营业收入 × 365（钱在客户口袋躺多久）<br><b>应付周转天数</b> = 平均应付 ÷ 营业成本 × 365（你能拖供应商多久）<br><b>现金周转天数 CCC = 存货天 + 应收天 − 应付天</b>，越小越好，为负说明在无息占用上下游资金。',
quiz:[
{q:'存货天数 60、应收天数 45、应付天数 90，CCC 是？',o:['195 天','15 天','105 天','−15 天'],a:1,e:'60 + 45 − 90 = 15 天。意味着你只需自掉 15 天的运营资金，运营效率不错。'},
{q:'CCC 为 −30 天意味着？',o:['公司在亏钱','公司先收客户钱、后付供应商款，相当于无息使用产业链资金','数据错误','应收太多'],a:1,e:'这是极强商业模式的标志（苹果、Costco、优秀便利店）。它的直接后果是 CFO 长期高于净利润、几乎不需要外部融资。'},
{q:'存货周转天数从 45 天升至 120 天，最可能意味着？',o:['销量大增','产品滞销或为涨价囤货，需排查并警惕后续跌价准备','毛利率提升','应收减少'],a:1,e:'存货天数大幅拉长基本只有两种解释，且大多数时候是前者。验证：看同期收入增速、看附注库龄结构、看后一年是否计提跌价。'},
{q:'总资产周转率长期低于同业，说明？',o:['定价权强','单位资产创收能力弱，可能存在闲置产能或低效资产','杠杆低','现金多'],a:1,e:'需结合产能利用率与在建工程看：大量在建工程长期不转固定资产，是资本开支浪费甚至资金被占用的经典信号。'}
]},
{id:'6-3',type:'mcq',title:'偿债能力：会不会猝死',
intro:'<b>短期</b>：流动比率、速动比率、现金比率。<b>长期</b>：资产负债率、有息负债率、<b>利息保障倍数 = EBIT ÷ 利息支出</b>（赚的钱够付几倍利息）。最硬的一条：<b>经营现金流 ÷ 到期债务</b>——因为还债用的是现金，不是利润。',
quiz:[

{q:'公司收入三年 CAGR 40%，但毛利率从 45% 降至 26%、销售费用率翻倍，如何评价？',o:['优质高成长','增长是靠降价与砧钱买来的，盈利质量恶化，需确认单位经济模型是否跑得通','成本控制优秀','与估值无关'],a:1,e:'「不赚钱的增长」。关键验证：单店模型（单店收入、单店利润率、回本周期），以及考虑获客成本后的 LTV/CAC。'},

/* ==================== Streak ==================== */
function touchStreak(){var t=today();if(S.streak.last===t)return;
var y=new Date(Date.now()-86400000);var ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
if(S.streak.last===ys){S.streak.n++;}
else if(S.streak.last===''){S.streak.n=1;}
else{if(S.streak.shield>0){S.streak.shield--;S.streak.n++;toast('🛡️ 断点保护卡已自动使用，连继天数保住！');}else{S.streak.n=1;}}
S.streak.last=t;if(S.streak.n>=3)grant('st3');if(S.streak.n>=7)grant('st7');if(S.streak.n>=30)grant('st30');save();}

function hasB(id){return S.badges.indexOf(id)>=0}

S.badges.push(id);save();setTimeout(function(){modal(b.i,'解锁徽章：'+b.n,b.d+'。徽章墙已更新，去看看你的收藏。','');burst(innerWidth/2,innerHeight/2,null,40);sBox();},300);}

if(S.perfects>=5)grant('perfch');if(S.reviews>=10)grant('rev10');if(S.boxes>=5)grant('box5');

/* ==================== 错题本 / SRS ==================== */
var IVL=[1,3,7,15,30];
function addWrong(lvId,qi,q){for(var i=0;i<S.wrong.length;i++){if(S.wrong[i].k===lvId+'#'+qi){S.wrong[i].box=0;S.wrong[i].due=dayNum()+1;save();return}}
S.wrong.push({k:lvId+'#'+qi,lv:lvId,qi:qi,box:0,due:dayNum()+1});save();}
function clrWrong(k){for(var i=0;i<S.wrong.length;i++){if(S.wrong[i].k===k){S.wrong[i].box++;
if(S.wrong[i].box>=IVL.length){S.wrong.splice(i,1);}else{S.wrong[i].due=dayNum()+IVL[S.wrong[i].box];}save();return}}}
function dueList(){return S.wrong.filter(function(w){return w.due<=dayNum()})}
function wrongQ(w){var x=findLv(w.lv);if(!x||!x.l.quiz||!x.l.quiz[w.qi])return null;return x.l.quiz[w.qi]}
function ghost(lv){/* 30% 幽灵重现：将一道到期错题插入本关 */
var d=dueList();if(!d.length||!lv.quiz||Math.random()>0.3)return null;
var w=d[Math.floor(Math.random()*d.length)];var q=wrongQ(w);if(!q)return null;return{w:w,q:q};}

z.innerHTML='<div class="eg-card" style="text-align:center;padding:32px 20px"><div style="font-size:44px">🔎</div>'+
'<div style="font-size:18px;font-weight:800;margin:8px 0">结案：'+window._DR+'/'+l.cases.length+' 个案例完全正确（'+pct+'%）</div>'+
'<div style="color:var(--dim);font-size:13px;line-height:1.85;margin-bottom:16px">真实的财报尽职调查就是这个过程：<b>先列候选疑点，再逐个排除合理解释，剩下的才是真红旗。</b></div>'+
'<button class="eg-btn" onclick="go(\'level\',\''+l.id+'\')">再查一次</button> <button class="eg-btn gh" onclick="go(\'map\')">回到地图</button></div>';return}
var c=l.cases[ci];window._DS={};
var tb='<table class="eg-tbl">';c.rows.forEach(function(r){tb+='<tr>';r.forEach(function(x){tb+='<td>'+x+'</td>'});tb+='</tr>'});tb+='</table>';
var cl='';c.clues.forEach(function(x,i){cl+='<div class="eg-clue" id="cl'+i+'" onclick="dtTog('+i+')"><div class="bx"></div><div>'+x.t+'</div></div>'});
z.innerHTML='<div class="eg-card"><div style="font-size:11px;color:var(--dim);margin-bottom:8px">案例 '+(ci+1)+' / '+l.cases.length+'</div>'+
'<div class="eg-q">'+c.name+'</div><div class="eg-sub">'+c.desc+'</div>'+tb+
'<h4 style="margin-top:18px">候选线索（多选）</h4>'+cl+
'<div style="text-align:center;margin-top:14px"><button class="eg-btn" id="dtgo" onclick="dtCheck()">提交侦探报告</button></div><div id="dtfb"></div></div>';}
function dtTog(i){window._DS[i]=!window._DS[i];var e=el('cl'+i);e.className='eg-clue'+(window._DS[i]?' sel':'');e.querySelector('.bx').textContent=window._DS[i]?'✓':'';}
function dtCheck(){var l=window._DT,c=l.cases[window._DC],tp=0,fp=0,fn=0;
c.clues.forEach(function(x,i){var s=!!window._DS[i];var e=el('cl'+i);
if(x.bad&&s){tp++;e.className='eg-clue rt'}else if(!x.bad&&s){fp++;e.className='eg-clue wr'}
else if(x.bad&&!s){fn++;e.className='eg-clue wr'}else e.className='eg-clue';
e.innerHTML+='<span class="wy">'+(x.bad?'🚩 <b>真红旗</b>：':'✅ <b>合理现象，不应勾选</b>：')+x.why+'</span>';});
var bad=c.clues.filter(function(x){return x.bad}).length;var perfect=(tp===bad&&fp===0);
if(perfect){window._DR++;sOk();addXp(50);burst(innerWidth/2,innerHeight/2,null,36)}else sBad();
el('dtgo').disabled=true;
el('dtfb').innerHTML='<div class="eg-exp'+(perfect?'':' bad')+'" style="margin-top:14px"><span class="t">'+
(perfect?'✅ 完美结案！所有红旗全中、无误报':'📊 本案得分：命中 '+tp+'/'+bad+' · 误报 '+fp+' · 遗漏 '+fn)+'</span>'+
'上方每条线索已展开详解，特别看你误报的那几条——<b>学会排除合理现象，比背下红旗清单重要得多。</b></div>'+
'<div style="text-align:center;margin-top:12px"><button class="eg-btn" onclick="window._DC++;dtRender()">'+(window._DC+1>=l.cases.length?'结算 →':'下一案 →')+'</button></div>';
renderDash();}

/* ==================== 三表联动沙盒 ==================== */
var B0={cash:800,ar:600,inv:400,ppe:2400,ap:200,loan:0,eq:4000};
function renderSbx(){return '<div class="eg-sub">你是 CFO，拖动下方滑块做经营决策，右侧三张表<b>实时联动</b>。重点观察：<b>利润变好的时候，现金可能同时变差。</b>期初：现金 800、应收 600、存货 400、固定资产净值 2400、应付 200、借款 0、权益 4000（单位：万元）。</div>'+
'<div class="eg-3"><div class="eg-card"><h4>经营决策面板</h4>'+
sl('sPrice','商品涨价幅度','%',-20,40,0,1)+
sl('sCredit','给审户的赊账天数','天',0,180,60,5)+
sl('sInv','存货备货月数','个月',0.5,6,2,0.5)+
sl('sStore','新开门店数（每家 CapEx 80）','家',0,20,0,1)+
sl('sLoan','新增银行借款','万',0,3000,0,100)+
sl('sBuy','回购股票金额','万',0,1500,0,100)+
'<div class="eg-note" id="sbxTip"></div></div><div id="sbxOut"></div></div>'}
function sl(id,lb,u,mn,mx,vl,st){return '<div class="eg-sl"><label>'+lb+'<b id="'+id+'v">'+vl+' '+u+'</b></label>'+
'<input type="range" id="'+id+'" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+vl+'" oninput="sbxCalc()"></div>'}
function sbxCalc(){var p=+el('sPrice').value,cd=+el('sCredit').value,im=+el('sInv').value,ns=+el('sStore').value,ln=+el('sLoan').value,bb=+el('sBuy').value;
el('sPricev').textContent=p+' %';el('sCreditv').textContent=cd+' 天';el('sInvv').textContent=im+' 个月';
el('sStorev').textContent=ns+' 家';el('sLoanv').textContent=ln+' 万';el('sBuyv').textContent=bb+' 万';
/* 收入：基础 30 家店 × 每店 100 万；涨价需求弹性 −1.2 */
var stores=30+ns,vol=Math.max(0,1-1.2*(p/100));
var rev=stores*100*(1+p/100)*vol;
var cogs=rev*0.4;
var ppeAdd=ns*80,ppe1=B0.ppe+ppeAdd;
var depr=ppe1*0.10;
var sga=stores*100*0.30;
var interest=(B0.loan+ln)*0.05;
var ebit=rev-cogs-sga-depr;
var pretax=ebit-interest;
var tax=Math.max(0,pretax*0.25);
var net=pretax-tax;
var ar1=rev*cd/365,inv1=cogs*im/12,ap1=cogs*30/365;
var dAR=ar1-B0.ar,dINV=inv1-B0.inv,dAP=ap1-B0.ap;
var cfo=net+depr-dAR-dINV+dAP;
var cfi=-ppeAdd;
var cff=ln-bb;
var cash1=B0.cash+cfo+cfi+cff;
var ppeNet1=ppe1-depr;
var eq1=B0.eq+net-bb;
var assets=cash1+ar1+inv1+ppeNet1;
var liab=ap1+B0.loan+ln;
var diff=assets-(liab+eq1);
var warn=[];
if(cash1<0)warn.push('🚨 <b>现金为负</b>：公司已断现金流。即使利润为正也会直接死亡——这就是「利润表好看却破产」的真实机制。');
if(net>0&&cfo<0)warn.push('⚠️ <b>赚利润但失现金</b>：净利润 '+fmt(net)+' 但经营现金流 '+fmt(cfo)+'。利润全卡在应收与存货里了。');
if(cd>=120)warn.push('📌 赊账 '+cd+' 天意味着应收高达 '+fmt(ar1)+'，占收入 '+fmt(ar1/rev*100,0)+'%。现实中这种结构几乎必然伴随大额坏账。');
if(im>=4)warn.push('📌 备货 '+im+' 个月 → 存货 '+fmt(inv1)+'。奶茶原料有保质期，这会直接变成跌价准备。');
if(p>=25)warn.push('📌 涨价 '+p+'% 后销量已降至原来的 '+fmt(vol*100,0)+'%。涨价不是免费的——需求弹性会吃掉毛利。');
if(ln>=2000)warn.push('📌 借款 '+ln+' 万带来利息 '+fmt(interest)+' 万/年，并抬高权益乘数。ROE 会奇迹般上升，但风险同步放大。');
if(!warn.length)warn.push('✅ 当前组合相对健康。试试把赊账天数拉到 150 天、备货拉到 5 个月，看看利润与现金如何彻底背道而驰。');
el('sbxTip').innerHTML=warn.join('<br><br>');
el('sbxOut').innerHTML=
st2('💰 利润表','var(--pu)',[['营业收入',rev],['营业成本',-cogs],['毛利',rev-cogs,1],['销售管理费用',-sga],['折旧费用',-depr],['营业利润',ebit,1],['利息支出',-interest],['所得税',-tax],['净利润',net,1]])+
st2('💧 现金流量表','var(--gn)',[['净利润',net],['+ 折旧（非现金）',depr],['− 应收增加',-dAR],['− 存货增加',-dINV],['+ 应付增加',dAP],['经营活动 CFO',cfo,1],['投资活动（CapEx）',cfi,1],['筹资活动（借款−回购）',cff,1],['现金净增加',cfo+cfi+cff,1],['期末现金',cash1,1]])+
st2('🏛️ 资产负债表','var(--cy)',[['货币资金',cash1],['应收账款',ar1],['存货',inv1],['固定资产净值',ppeNet1],['资产合计',assets,1],['应付账款',ap1],['借款',B0.loan+ln],['所有者权益',eq1],['负债+权益',liab+eq1,1],['平衡差额',diff,1]])+
'<div class="eg-card"><h4>关键比率</h4>'+
'<div class="eg-st" style="border:none;padding:0">'+
ln2('毛利率',fmt((rev-cogs)/rev*100)+'%')+ln2('净利率',fmt(net/rev*100)+'%')+
ln2('ROE',fmt(net/eq1*100)+'%')+ln2('ROA',fmt(net/assets*100)+'%')+
ln2('权益乘数',fmt(assets/eq1,2))+ln2('总资产周转率',fmt(rev/assets,2))+
ln2('资产负债率',fmt(liab/assets*100)+'%')+
ln2('CFO / 净利润',net!==0?fmt(cfo/net,2):'—')+
ln2('应收周转天数',fmt(ar1/rev*365,0)+' 天')+
ln2('存货周转天数',fmt(inv1/cogs*365,0)+' 天')+
ln2('现金周转天数 CCC',fmt(ar1/rev*365+inv1/cogs*365-ap1/cogs*365,0)+' 天')+
ln2('自由现金流 FCF',fmt(cfo-ppeAdd)+' 万')+
'</div><div class="eg-note">平衡差额永远为 0，说明沙盒完全遵守会计恒等式。你可以把它当作一个微型财务模型反复实验。</div></div>';
}
function st2(t,c,rows){var h='<div class="eg-st"><div class="sh" style="color:'+c+'">'+t+'</div>';
rows.forEach(function(r){var v2=r[1],cls=r[2]?' tt':'';var col=v2<0?'eg-dn':(r[2]?'eg-up':'');
h+='<div class="ln2'+cls+'"><span>'+r[0]+'</span><b class="'+col+'">'+fmt(v2)+'</b></div>'});return h+'</div>'}
function ln2(k,v2){return '<div class="ln2"><span>'+k+'</span><b>'+v2+'</b></div>'}
