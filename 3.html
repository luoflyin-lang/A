<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>经济学与金融学文明：总督学院</title>
<style>
:root{
  --bg:#07111f;--panel:#101d30;--panel2:#16263d;--line:#29405f;
  --text:#eaf2ff;--muted:#93a8c7;--gold:#ffd166;--green:#55d69e;
  --red:#ff7085;--blue:#64b5ff;--purple:#b69cff
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(circle at top,#142b4c 0,#07111f 48%);
  color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif
}
button,select,input{font:inherit}
button{
  border:1px solid var(--line);border-radius:9px;padding:9px 13px;
  color:var(--text);background:#19304d;cursor:pointer
}
button:hover{border-color:var(--blue);transform:translateY(-1px)}
button.primary{background:#1769aa;border-color:#3999e8}
button.good{background:#126848;border-color:#35bf87}
button.warn{background:#744523;border-color:#d98b43}
button.danger{background:#742f3d;border-color:#db5b71}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
header{
  position:sticky;top:0;z-index:10;padding:12px 18px;
  background:rgba(7,17,31,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)
}
.header-row{max-width:1450px;margin:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;color:var(--gold)}
.header-stats{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.pill{background:#13243a;border:1px solid var(--line);padding:5px 9px;border-radius:20px;font-size:13px}
.layout{max-width:1450px;margin:16px auto;display:grid;grid-template-columns:220px 1fr 300px;gap:14px;padding:0 14px}
.panel{background:rgba(16,29,48,.94);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 35px #0004}
nav button{display:block;width:100%;margin-bottom:7px;text-align:left}
nav button.active{background:#225985;border-color:var(--blue)}
h1,h2,h3{margin-top:0} h2{font-size:21px} h3{font-size:16px;color:#cfe2ff}
.muted{color:var(--muted)} .small{font-size:13px}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px}
.card.locked{filter:saturate(.25);opacity:.65}
.card.done{border-color:#2f8f69}
.metric{font-size:25px;font-weight:800}
.bar{height:8px;background:#071321;border-radius:9px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}
.event{border-left:4px solid var(--gold)}
.option{display:block;width:100%;text-align:left;margin:7px 0;padding:11px}
.option.correct{border-color:var(--green);background:#174b3c}
.option.wrong{border-color:var(--red);background:#552a37}
.tag{display:inline-block;padding:3px 7px;border-radius:7px;background:#263d5c;color:#bed5f5;font-size:12px;margin:2px}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--line);text-align:left}
.lesson-text{line-height:1.75;font-size:15px}
.callout{background:#112943;border-left:4px solid var(--blue);padding:11px;border-radius:7px;margin:10px 0}
.modal{
  position:fixed;inset:0;background:#020812dc;z-index:30;display:flex;
  align-items:center;justify-content:center;padding:15px
}
.modal-box{max-width:750px;width:100%;max-height:90vh;overflow:auto;background:#13243a;border:1px solid #45698f;border-radius:15px;padding:20px}
.hidden{display:none!important}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chart{width:100%;height:190px;background:#091522;border-radius:9px;border:1px solid var(--line)}
.quest{padding:8px 0;border-bottom:1px solid var(--line)}
code{background:#071321;padding:2px 5px;border-radius:5px}
.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#193552;border:1px solid #4f79a3;border-radius:10px;padding:11px 16px;display:none}
textarea{width:100%;min-height:100px;background:#081524;color:white;border:1px solid var(--line);border-radius:8px;padding:8px}
@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.right{grid-column:1/-1}}
@media(max-width:700px){.layout{display:block}nav{margin-bottom:12px}nav button{display:inline-block;width:auto}.right{margin-top:12px}}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="logo">🏛️ 经济金融文明</div>
    <div class="header-stats" id="topStats"></div>
    <button onclick="nextTurn()" class="primary">推进一季度 ▶</button>
  </div>
</header>

<div class="layout">
  <nav class="panel" id="nav"></nav>
  <main class="panel" id="main"></main>
  <aside class="panel right" id="right"></aside>
</div>

<div class="modal" id="startModal">
  <div class="modal-box">
    <h1>经济学与金融学文明</h1>
    <p class="muted">你将同时扮演一座城邦的决策者、央行观察员、投资者和经济学研究者。</p>
    <div class="callout">
      <b>学习循环：</b>学习理论 → 预测结果 → 制定政策 → 观察数据 → 解释偏差 → 间隔复习。
      游戏不能替代学位与研究训练，但能帮助你建立系统知识地图和经济直觉。
    </div>
    <label>城邦名称</label>
    <input id="cityName" value="启明共和国" style="width:100%;margin:6px 0 12px;padding:9px;background:#091522;color:white;border:1px solid #36516e;border-radius:8px">
    <label>难度</label>
    <select id="difficulty" style="width:100%;margin:6px 0 12px;padding:9px;background:#091522;color:white;border:1px solid #36516e;border-radius:8px">
      <option value="story">故事模式：适合零基础</option>
      <option value="normal" selected>学者模式：完整反馈</option>
      <option value="expert">专家模式：波动更大、解释更少</option>
    </select>
    <button class="primary" onclick="newGame()">建立城邦</button>
    <button id="continueBtn" onclick="continueGame()">继续存档</button>
  </div>
</div>

<div class="modal hidden" id="modal">
  <div class="modal-box" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const curriculum=[
 {id:"scarcity",stage:1,field:"经济学基础",title:"稀缺、选择与机会成本",xp:60,
  text:`经济学研究人们如何在稀缺条件下作选择。真正的成本不仅是付出的货币，而是放弃的最佳替代方案，即<b>机会成本</b>。
  <div class="callout">边际思维：不要只问“做不做”，而要问“再多做一单位的收益是否大于成本”。</div>
  沉没成本已经发生，理性决策原则上不应受其影响。生产可能性边界展示资源与技术约束，边界上的点有效率，边界内有闲置，边界外暂时不可行。`,
  qs:[
   ["你用两小时看电影，最佳替代是做价值300元的兼职。机会成本最接近？",["电影票价格","300元加可能的其他直接成本","零","电影带来的快乐"],1,"机会成本是放弃的最佳替代收益，并考虑相关直接成本。"],
   ["已花500元购买不能退款的演出票，但暴雨使出行很痛苦。500元属于？",["边际收益","固定收益","沉没成本","外部成本"],2,"已经发生且不可收回的成本是沉没成本。"]
  ]},
 {id:"supply",stage:1,field:"微观经济学",title:"供给、需求与市场均衡",xp:80,
  text:`需求曲线描述其他条件不变时价格与需求量的关系；供给曲线描述价格与供给量的关系。曲线上的移动由商品自身价格引起，整条曲线移动则来自收入、偏好、技术、预期等变化。
  <div class="callout">均衡不是“公平”或“最好”，只是计划购买量等于计划销售量的状态。</div>
  价格上限若低于均衡价会造成短缺；价格下限若高于均衡价会造成过剩。`,
  qs:[
   ["生产技术改善通常会怎样？",["供给右移、价格下降","需求右移、价格上升","供给左移","需求量下降但曲线不动"],0,"技术改善降低单位成本，使供给曲线右移。"],
   ["低于均衡价格的租金上限通常导致？",["过剩","短缺与非价格配给","供需同时右移","没有影响"],1,"低价提高需求量并压低供给量，形成短缺。"]
  ]},
 {id:"elasticity",stage:2,field:"微观经济学",title:"弹性、税收与福利",xp:100,
  text:`价格弹性衡量数量对价格变化的敏感度。绝对值大于1称富有弹性，小于1称缺乏弹性。替代品越多、调整时间越长，需求通常越有弹性。
  税收的经济负担并不由法律规定谁缴税决定，而更多落在<b>较缺乏弹性</b>的一方。消费者剩余与生产者剩余用于近似衡量市场福利；税收可能产生无谓损失。`,
  qs:[
   ["需求极缺乏弹性、供给富有弹性时，消费税主要由谁承担？",["消费者","生产者","政府","平均分担"],0,"缺乏弹性的一方更难调整数量，因此承担更多税负。"],
   ["价格上涨10%，需求量下降20%，需求弹性绝对值约为？",["0.5","1","2","10"],2,"弹性约为数量变化率除以价格变化率，即2。"]
  ]},
 {id:"firm",stage:2,field:"微观经济学",title:"企业、成本与市场结构",xp:110,
  text:`短期中至少有一种投入固定；长期中所有投入都可调整。利润最大化的一般条件是边际收益等于边际成本。
  完全竞争企业是价格接受者；垄断者面对向下倾斜的需求曲线；垄断竞争有差异化产品；寡头市场强调战略互动与博弈。会计利润扣除显性成本，经济利润还扣除隐性机会成本。`,
  qs:[
   ["利润最大化的一般边际条件是？",["平均成本最低","价格最高","MR=MC","总收入最大"],2,"最后一单位的边际收益应与边际成本相等。"],
   ["经济利润与会计利润相比还扣除了？",["税收","隐性机会成本","折旧","工资"],1,"经济利润将自有资源的机会成本也计入成本。"]
  ]},
 {id:"game",stage:3,field:"微观经济学",title:"博弈论、信息与行为经济学",xp:120,
  text:`纳什均衡指每个参与者在给定他人策略时都没有单方面改变策略的动力。重复博弈、信誉和惩罚机制可能促进合作。
  信息不对称会导致逆向选择和道德风险。行为经济学研究有限理性、损失厌恶、锚定、现状偏好与心理账户等现象。`,
  qs:[
   ["投保前高风险者更愿购买保险主要属于？",["道德风险","逆向选择","规模经济","搭便车"],1,"交易前隐藏类型造成的筛选问题是逆向选择。"],
   ["投保后因为有保险而更冒险主要属于？",["道德风险","逆向选择","信号传递","沉没成本"],0,"契约成立后的隐藏行动问题是道德风险。"]
  ]},
 {id:"external",stage:3,field:"公共经济学",title:"外部性、公共品与政府",xp:120,
  text:`外部性是行为对未参与交易者产生的成本或收益。负外部性使市场产量可能过高，正外部性使市场产量可能过低。
  公共品具有非排他性和非竞争性，容易出现搭便车。政策工具包括庇古税、补贴、排放交易、产权界定、监管和公共供给。政府也会面临信息、激励与寻租问题。`,
  qs:[
   ["碳税主要试图解决？",["信息不对称","负外部性","自然垄断","货币幻觉"],1,"碳排放的社会成本未完全进入市场价格。"],
   ["纯公共品通常具有？",["排他且竞争","非排他且非竞争","排他但非竞争","非排他但竞争"],1,"这是纯公共品的两个定义性特征。"]
  ]},
 {id:"macro",stage:4,field:"宏观经济学",title:"GDP、通胀与失业",xp:130,
  text:`GDP衡量一定时期境内生产的最终产品和服务的市场价值。支出法：<b>Y=C+I+G+NX</b>。名义GDP受价格与产量影响，实际GDP剔除价格变化。
  CPI衡量代表性消费篮子的价格变化，但会受替代偏差、质量变化等影响。失业包括摩擦性、结构性和周期性失业。GDP不是完整的幸福指标。`,
  qs:[
   ["进口在GDP核算中为何被NX扣除？",["进口有害","避免把境外生产计入本国GDP","降低消费","因为不交税"],1,"进口可能已进入C、I或G，扣除是为排除境外产出。"],
   ["名义GDP上涨而实际GDP不变，最可能是？",["产量增加","总体价格上涨","人口下降","出口为零"],1,"实际产量未变时，名义值上涨主要来自价格。"]
  ]},
 {id:"cycles",stage:4,field:"宏观经济学",title:"经济增长与商业周期",xp:140,
  text:`长期生活水平主要取决于劳动生产率。资本积累、教育、人力资本、制度和技术进步推动增长，但物质资本通常存在边际报酬递减。
  短期经济会受到需求与供给冲击。潜在产出表示资源正常利用时可持续的产出。产出缺口、金融条件、预期和刚性共同影响周期。`,
  qs:[
   ["长期人均增长最可持续的核心来源通常是？",["不断印钞","生产率与技术进步","价格上限","贸易逆差"],1,"持续提高单位投入产出能力是长期增长核心。"],
   ["负面供给冲击可能同时造成？",["通胀下降、产出上升","通胀上升、产出下降","二者都上升","二者都下降"],1,"成本上升或供给能力下降可能导致滞胀。"]
  ]},
 {id:"money",stage:5,field:"货币经济学",title:"货币、银行与中央银行",xp:150,
  text:`货币承担交换媒介、计价单位和价值储藏功能。商业银行通过资产负债表进行信用中介；贷款创造存款，但受到资本、流动性、风险、需求和监管约束。
  央行通过政策利率、公开市场操作、准备金工具、资产购买和预期引导影响金融条件。货币政策存在传导时滞，也要关注金融稳定。`,
  qs:[
   ["央行提高政策利率，其他条件不变，通常首先会？",["降低融资成本","收紧金融条件","提高货币乘数到无限","直接增加实际产出"],1,"政策利率上升通常推高借贷成本并抑制总需求。"],
   ["银行的典型脆弱性来自？",["短期负债与较长期、较不流动资产的错配","没有任何负债","现金太多","利润恒定"],0,"期限和流动性转换使银行可能遭遇挤兑。"]
  ]},
 {id:"fiscal",stage:5,field:"宏观政策",title:"财政政策、债务与政策争论",xp:150,
  text:`财政政策通过政府支出、税收与转移支付影响总需求和资源配置。乘数大小取决于经济闲置程度、货币政策反应、开放度和家庭行为。
  债务可跨期平滑冲击并投资公共项目，但高债务也可能带来利息负担、挤出效应和财政风险。评价政策应区分实证判断与规范判断。`,
  qs:[
   ["经济严重衰退且利率受限时，财政乘数往往可能？",["相对较大","必为零","必为负无穷","与环境完全无关"],0,"闲置资源多且货币政策不抵消时，财政刺激效应可能更强。"],
   ["政府债务是否可持续主要取决于？",["债务绝对值一个指标","利率、增长率、初级余额与制度可信度","货币名称","人口姓名"],1,"可持续性是动态问题，需比较融资成本、增长和财政路径。"]
  ]},
 {id:"trade",stage:6,field:"国际经济学",title:"贸易、汇率与国际金融",xp:160,
  text:`比较优势来自机会成本差异，即使一方在所有产品上都有绝对优势，贸易仍可能互利。贸易会扩大总收益，但国内分配并不均匀。
  汇率受利差、通胀预期、风险、资本流动和政策制度影响。经常账户与资本金融账户在国际收支核算中相互对应。固定汇率会约束货币政策独立性。`,
  qs:[
   ["比较优势由什么决定？",["绝对产量","机会成本","国土面积","货币面值"],1,"应比较生产一项产品所放弃的另一项产品数量。"],
   ["固定汇率、资本自由流动和独立货币政策三者通常？",["可同时完全实现","最多同时充分实现两个","都不重要","只有小国能全实现"],1,"这称为开放经济的三元悖论。"]
  ]},
 {id:"finance",stage:7,field:"金融学",title:"时间价值、债券与股票",xp:180,
  text:`一元今天通常比未来的一元更有价值。现值公式为 <b>PV=FV/(1+r)^n</b>。债券价格与到期收益率通常反向变化，期限和久期越高，对利率越敏感。
  股票价值来自未来可分配现金流的折现。高预期收益通常伴随更高风险；估值不是预测一个精确价格，而是分析现金流、折现率和情景。`,
  qs:[
   ["市场利率上升时，既有固定利率债券价格通常？",["上升","下降","不变","必归零"],1,"新债收益率更高，旧债需降价才能提供有竞争力的收益率。"],
   ["以10%折现率计算，一年后的110元现值为？",["90","100","110","121"],1,"110÷1.1=100。"]
  ]},
 {id:"portfolio",stage:7,field:"投资学",title:"风险、组合与资产定价",xp:190,
  text:`组合风险不仅取决于单项资产风险，还取决于资产之间的相关性。分散化可以降低非系统性风险，却不能完全消除系统性风险。
  CAPM用市场风险暴露β解释要求回报：E(R)=Rf+β(E(Rm)-Rf)。现实中还存在规模、价值、动量、流动性等因子争论。历史表现不等于未来收益。`,
  qs:[
   ["分散投资最能消除哪类风险？",["系统性风险","公司特有风险","通胀风险","所有风险"],1,"不同公司的特有冲击可在组合中相互抵消。"],
   ["β主要衡量？",["资产价格绝对值","资产对市场系统性波动的敏感度","会计利润","交易次数"],1,"β描述资产收益相对市场收益的共同变动程度。"]
  ]},
 {id:"derivatives",stage:8,field:"金融工程",title:"期货、期权与风险管理",xp:200,

let state=null,currentView="dashboard",activeLesson=null;

function freshState(){
 return {
  city:document.getElementById("cityName").value||"启明共和国",
  difficulty:document.getElementById("difficulty").value,
  turn:1,year:1,quarter:1,xp:0,coins:200,reputation:50,
  economy:{growth:3,inflation:2.2,unemployment:5,debt:42,equality:55,stability:70,rate:2.5},
  learned:{},reviews:{},wrong:[],history:[],event:null,answered:0,correct:0,season:1,
  log:["城邦建立。你的每项政策都将成为经济学实验。"]
 };
}
function newGame(){state=freshState();save();closeStart();render()}
function continueGame(){state=JSON.parse(localStorage.getItem("econCivilization"));closeStart();render()}
function closeStart(){document.getElementById("startModal").classList.add("hidden")}
function save(){localStorage.setItem("econCivilization",JSON.stringify(state))}
function toast(x){let e=document.getElementById("toast");e.textContent=x;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function level(){return Math.min(10,1+Math.floor(state.xp/450))}
function mastery(id){return state.learned[id]?.mastery||0}
function dueCount(){return Object.values(state.reviews).filter(x=>x.due<=state.turn).length}
function pct(a,b){return b?Math.round(a/b*100):0}
function render(){
 renderTop();renderNav();renderRight();
 const map={dashboard:dashboardHTML,curriculum:curriculumHTML,city:cityHTML,review:reviewHTML,
  lab:labHTML,journal:journalHTML,achievements:achievementsHTML};
 document.getElementById("main").innerHTML=map[currentView]();
 drawChart();
}

 document.getElementById("topStats").innerHTML=`

 document.getElementById("nav").innerHTML=`<h3>${state.city}</h3><div class="small muted">第 ${state.season} 赛季 · ${stages[level()-1]}</div><hr style="border-color:#29405f">`+
 items.map(x=>`<button class="${currentView==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")+

  ["推进四个季度",state.turn>=5],

function metric(n,v,u,bad){return `<div class="card"><div class="muted">${n}</div><div class="metric ${bad?'red':''}">${Number(v).toFixed(1)}<small>${u}</small></div></div>`}
function tip(){
 let e=state.economy;
 if(e.inflation>6&&e.growth<1)return "你可能面对滞胀。单纯刺激需求会加重通胀，需要区分供给冲击和需求冲击。";
 if(e.debt>85)return "高债务不等于立即破产，但会降低应对下一次冲击的财政空间。";
 if(e.stability<40)return "金融稳定正在恶化。关注杠杆、流动性错配和风险传染。";
 return "不要只盯着GDP。政策同时影响分配、价格稳定、就业、债务和未来生产能力。";
}

 return `<h2>知识地图</h2><p class="muted">课程按前置关系解锁。测验通过后进入遗忘曲线复习队列。</p>

function openLesson(id){
 activeLesson=curriculum.find(x=>x.id==id);
 showModal(`<span class="tag">${activeLesson.field}</span><h2>${activeLesson.title}</h2>
 <div class="lesson-text">${activeLesson.text}</div>
 <div class="callout"><b>费曼检验：</b>请先用自己的话解释本课机制，再开始测验。不要只记结论。</div>

 <button onclick="closeModal()">稍后再做</button>`);
}
function startQuiz(id,index,score){
 let l=curriculum.find(x=>x.id==id),q=l.qs[index];
 showModal(`<div class="small muted">${l.title} · 第 ${index+1}/${l.qs.length} 题</div>
 <h2>${q[0]}</h2><div id="options">${q[1].map((x,i)=>`<button class="option" onclick="answerQuiz('${id}',${index},${score},${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join("")}</div>`);
}
function answerQuiz(id,index,score,choice){
 let l=curriculum.find(x=>x.id==id),q=l.qs[index],ok=choice===q[2];
 state.answered++;if(ok)state.correct++;else state.wrong.push({id,q:index,time:state.turn});
 document.querySelectorAll(".option").forEach((e,i)=>{e.disabled=true;if(i==q[2])e.classList.add("correct");if(i==choice&&!ok)e.classList.add("wrong")});
 document.getElementById("options").insertAdjacentHTML("beforeend",
 `<div class="callout"><b>${ok?"正确":"需要修正"}：</b>${q[3]}</div>
 <button class="primary" onclick="${index+1<l.qs.length?`startQuiz('${id}',${index+1},${score+(ok?1:0)})`:`finishLesson('${id}',${score+(ok?1:0)})`}">继续</button>`);
 save();renderTop();
}
function finishLesson(id,score){
 let l=curriculum.find(x=>x.id==id),ratio=score/l.qs.length;
 let old=mastery(id),gain=Math.round(25+ratio*35);
 state.learned[id]={mastery:clamp(old+gain,0,100),last:state.turn};
 state.reviews[id]={due:state.turn+(ratio==1?3:1),interval:ratio==1?3:1,ease:ratio==1?2.4:1.8};
 state.xp+=Math.round(l.xp*(.5+.5*ratio));state.coins+=20+score*10;
 state.log.push(`完成课程《${l.title}》，测验 ${score}/${l.qs.length}`);
 save();
 showModal(`<h2>${ratio>=.8?"🎓 课程通过":"📚 已建立初步认识"}</h2>
 <p>得分：${score}/${l.qs.length}</p><p>掌握度：${Math.round(mastery(id))}%</p>
 <p class="muted">知识已加入间隔复习。一次答对并不等于长期掌握。</p><button class="primary" onclick="closeModal();go('curriculum')">返回知识地图</button>`);
}

 let e=state.economy;
 return `<h2>城邦模拟</h2>
 <p class="muted">调整政策不会立刻产生全部效果。模型是简化的教学系统，不是现实预测工具。</p>
 <div class="grid">
 <div class="card"><h3>政策利率</h3><div class="metric">${e.rate.toFixed(1)}%</div>

 <div class="card"><h3>财政立场</h3><p>刺激可降低短期失业，但可能增加债务与通胀。</p>
 <button class="good" onclick="fiscal(1)">温和刺激</button> <button class="warn" onclick="fiscal(-1)">财政紧缩</button></div>
 <div class="card"><h3>结构改革</h3><p>消耗100金币，短期有成本，长期改善潜在增长。</p>
 <button onclick="reform()" ${state.coins<100?'disabled':''}>投资教育与竞争</button></div>
 </div>
 <div class="callout">当前政策诊断：${policyDiagnosis()}</div>
 <h3>传导链练习</h3><p>每次操作时请口述：工具 → 金融条件/预算 → 消费投资 → 总需求或供给 → 产出、就业与价格。</p>`;
}
function policy(type,d){
 state.economy.rate=clamp(state.economy.rate+d,0,20);
 state.economy.growth-=d*.45;state.economy.inflation-=d*.25;state.economy.unemployment+=d*.18;
 state.log.push(`${d>0?"提高":"降低"}政策利率 ${Math.abs(d)} 个百分点`);
 save();render();toast("政策已实施，部分影响将在季度推进时显现");
}
function fiscal(n){
 let e=state.economy;e.growth+=1.1*n;e.unemployment-=.5*n;e.inflation+=.45*n;e.debt+=2.5*n;
 state.log.push(n>0?"实施温和财政刺激":"实施财政紧缩");save();render()
}
function reform(){
 if(state.coins<100)return;state.coins-=100;state.economy.growth+=1.2;state.economy.equality+=2;state.reputation+=2;
 state.log.push("投资教育、基础研究与市场竞争改革");save();render();toast("潜在生产能力提高")
}
function policyDiagnosis(){
 let e=state.economy;
 if(e.inflation>5&&e.unemployment<5)return "需求可能偏热，但应确认通胀是需求型还是供给型。";
 if(e.inflation<1&&e.unemployment>8)return "总需求疲弱，存在通缩与失业风险。";
 return "指标暂未指向单一答案，建议结合冲击来源、预期和风险分布判断。";
}
function reviewHTML(){
 let due=Object.keys(state.reviews).filter(id=>state.reviews[id].due<=state.turn);
 return `<h2>间隔复习中心</h2>
 <p class="muted">复习间隔会按回忆质量自动调整：忘记会缩短，轻松回忆会延长。</p>
 <div class="card"><div class="metric">${due.length}</div><div>项知识到期</div>
 <button class="primary" onclick="startReview()" ${!due.length?'disabled':''}>开始复习</button></div>
 <h3 style="margin-top:15px">记忆库</h3>
 <table><tr><th>概念</th><th>掌握度</th><th>下次复习</th></tr>
 ${Object.keys(state.reviews).map(id=>{let l=curriculum.find(x=>x.id==id),r=state.reviews[id];
 return `<tr><td>${l.title}</td><td>${Math.round(mastery(id))}%</td><td>${r.due<=state.turn?"现在":r.due-state.turn+" 季度后"}</td></tr>`}).join("")}</table>`;
}
function startReview(){
 let ids=Object.keys(state.reviews).filter(id=>state.reviews[id].due<=state.turn);
 if(!ids.length)return;
 let id=ids[Math.floor(Math.random()*ids.length)],l=curriculum.find(x=>x.id==id),qi=Math.floor(Math.random()*l.qs.length),q=l.qs[qi];
 showModal(`<span class="tag">回忆测试</span><h2>${q[0]}</h2>
 ${q[1].map((x,i)=>`<button class="option" onclick="finishReview('${id}',${qi},${i})">${x}</button>`).join("")}`);
}
function finishReview(id,qi,choice){
 let l=curriculum.find(x=>x.id==id),q=l.qs[qi],r=state.reviews[id],ok=choice===q[2];
 if(ok){r.interval=Math.max(2,Math.round(r.interval*r.ease));r.ease=Math.min(3,r.ease+.1);state.learned[id].mastery=clamp(mastery(id)+6,0,100);state.correct++}
 else{r.interval=1;r.ease=Math.max(1.3,r.ease-.2);state.learned[id].mastery=clamp(mastery(id)-8,0,100);state.wrong.push({id,q:qi,time:state.turn})}
 r.due=state.turn+r.interval;state.answered++;state.xp+=ok?18:5;state.log.push(`复习《${l.title}》：${ok?"成功回忆":"需要巩固"}`);
 save();showModal(`<h2>${ok?"✅ 回忆成功":"🔁 记忆已校准"}</h2><div class="callout">${q[3]}</div>
 <p>下次复习：约 ${r.interval} 个季度后</p><button class="primary" onclick="closeModal();go('review')">继续</button>`);
}
function labHTML(){
 return `<h2>经济实验室</h2><p class="muted">改变参数，观察模型，并解释模型为何可能失效。</p>
 <div class="grid">
 <div class="card"><h3>复利计算器</h3>
 <input id="pv" type="number" value="10000" placeholder="本金"><input id="rr" type="number" value="5" placeholder="年利率%">
 <input id="nn" type="number" value="20" placeholder="年数"><button onclick="compound()">计算</button><div id="compoundOut"></div></div>
 <div class="card"><h3>债券利率敏感性</h3>
 <p>近似关系：价格变化% ≈ -久期 × 收益率变化。</p>
 <input id="dur" type="number" value="6" placeholder="久期"><input id="dy" type="number" value="1" placeholder="收益率变化百分点">
 <button onclick="bond()">估算</button><div id="bondOut"></div></div>
 <div class="card"><h3>实际利率</h3><p>费雪近似：实际利率 ≈ 名义利率 − 预期通胀。</p>
 <input id="nom" type="number" value="4"><input id="inf" type="number" value="2"><button onclick="realRate()">计算</button><div id="rateOut"></div></div>
 <div class="card"><h3>组合分散化思考</h3><p>两项资产相关性越低，组合波动通常越可能降低。但危机中相关性可能突然上升。</p>
 <button onclick="toast('关键不是资产数量，而是风险来源是否真正不同')">记录结论</button></div>
 </div>`;
}
function compound(){let p=+pv.value,r=+rr.value/100,n=+nn.value;compoundOut.innerHTML=`<div class="metric">${(p*(1+r)**n).toFixed(2)}</div><p class="muted">未考虑税费、通胀和不确定性。</p>`}
function bond(){bondOut.innerHTML=`<div class="metric">${(-dur.value*dy.value).toFixed(1)}%</div><p class="muted">这是小幅利率变化的一阶近似，凸性会带来修正。</p>`}
function realRate(){rateOut.innerHTML=`<div class="metric">${(+nom.value-(+inf.value)).toFixed(1)}%</div>`}
function journalHTML(){
 return `<h2>研究日志</h2><div class="callout">专业能力来自“提出可证伪问题—建立模型—寻找识别策略—分析证据—承认局限”的循环。</div>
 <h3>季度研究备忘录</h3><textarea id="memo" placeholder="1. 发生了什么？&#10;2. 我的机制解释是什么？&#10;3. 哪些证据会推翻我的解释？&#10;4. 谁获益、谁承担成本？">${state.memo||""}</textarea>
 <button class="primary" onclick="state.memo=memo.value;save();toast('研究备忘录已保存')">保存</button>
 <h3 style="margin-top:16px">决策记录</h3>${state.log.slice().reverse().map(x=>`<div class="quest">${x}</div>`).join("")}`;
}
function achievementsHTML(){
 let learned=Object.keys(state.learned).length,avg=learned?Object.values(state.learned).reduce((a,b)=>a+b.mastery,0)/learned:0;
 let badges=[
  ["稀缺性初学者",mastery("scarcity")>=60],
  ["微观分析师",curriculum.filter(x=>x.stage<=3).every(x=>mastery(x.id)>=60)],
  ["宏观政策师",mastery("macro")>=70&&mastery("money")>=70],
  ["金融风险师",mastery("portfolio")>=70&&mastery("derivatives")>=70],
  ["因果侦探",mastery("econometrics")>=70],
  ["文明经济学家",curriculum.every(x=>mastery(x.id)>=80)],
  ["逆境治理者",state.turn>=20&&state.economy.stability>=60]
 ];
 return `<h2>学者档案</h2>
 <div class="grid">${metric("学术等级",level(),"","")}${metric("平均掌握",avg,"%","")}${metric("决策季度",state.turn-1,"","")}${metric("正确率",pct(state.correct,state.answered),"%","")}</div>
 <h3 style="margin-top:16px">勋章</h3><div class="grid">${badges.map(x=>`<div class="card ${x[1]?'done':'locked'}"><div class="metric">${x[1]?"🏅":"🔒"}</div><b>${x[0]}</b></div>`).join("")}</div>
 <div class="callout" style="margin-top:14px"><b>成为真正资深分析者还需：</b>微积分、线性代数、概率统计、编程与数据处理；系统阅读教材和论文；复现研究；独立完成带识别策略的实证项目；持续跟踪现实制度与历史案例。</div>`;
}
function nextTurn(){
 if(state.event){openEvent();return}
 let e=state.economy;
 state.history.push({g:e.growth,i:e.inflation,u:e.unemployment});
 let heat=e.growth-2.5;
 e.inflation+=heat*.12-(e.rate-2.5)*.08+(Math.random()-.5)*.7;
 e.unemployment-=heat*.11+(Math.random()-.5)*.35;
 e.growth+=-(e.rate-2.5)*.04+(Math.random()-.5)*1.4;
 e.debt+=Math.max(0,-e.growth)*.5+.25;
 e.stability+=(Math.random()-.5)*2;
 for(let id in state.learned)state.learned[id].mastery=clamp(state.learned[id].mastery*.985,0,100);
 Object.keys(e).forEach(k=>e[k]=clamp(e[k],k=="growth"?-12:0, k=="debt"?200:100));
 state.turn++;state.quarter++;if(state.quarter>4){state.quarter=1;state.year++}
 if(Math.random()<.55)state.event=events[Math.floor(Math.random()*events.length)];
 state.reputation=clamp(state.reputation+(e.growth>0?.5:-1)+(e.stability>50?.2:-1),0,100);
 if(e.stability<=5||e.debt>=180){endSeason(false);return}
 save();render();
}
function openEvent(){
 let ev=state.event;if(!ev)return;
 showModal(`<span class="tag">经济冲击</span><h2>${ev.title}</h2><p>${ev.desc}</p>
 <p class="muted">请选择方案。现实政策结果取决于制度、时机、规模和公众预期。</p>
 ${ev.options.map((o,i)=>`<button class="option" onclick="chooseEvent(${i})">${o[0]}</button>`).join("")}`);
}
function chooseEvent(i){
 let o=state.event.options[i],e=state.economy;
 for(let k in o[1]){if(k in e)e[k]+=o[1][k];else if(k=="reputation")state.reputation+=o[1][k]}
 state.log.push(`事件“${state.event.title}”：${o[0]}`);
 let explanation=o[2];state.event=null;state.xp+=25;save();
 showModal(`<h2>政策反馈</h2><div class="callout">${explanation}</div>
 <p><b>反事实问题：</b>如果不采取该政策，结果会怎样？游戏给出的变化只是教学模型，并不能单独证明因果。</p>
 <button class="primary" onclick="closeModal();render()">返回城邦</button>`);
}
function endSeason(win){
 state.season++;state.coins+=100;state.economy.stability=50;state.economy.debt=Math.min(state.economy.debt,100);
 state.log.push("文明经历危机重组，进入新赛季");save();
 showModal(`<h2>文明危机与制度重建</h2><p>金融稳定或债务指标越过临界值。你的知识进度保留，城邦进入新的随机赛季。</p>
 <button class="primary" onclick="closeModal();render()">开始新赛季</button>`);
}
function drawChart(){
 let c=document.getElementById("chart");if(!c)return;
 let d=state.history.slice(-30);if(d.length<2){let x=c.getContext("2d");x.fillStyle="#93a8c7";x.fillText("推进季度后生成宏观曲线",20,30);return}
 c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;
 let x=c.getContext("2d");x.scale(devicePixelRatio,devicePixelRatio);
 let w=c.clientWidth,h=c.clientHeight;x.strokeStyle="#29405f";
 for(let y=20;y<h;y+=35){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}
 [["g","#55d69e"],["i","#ffd166"],["u","#ff7085"]].forEach(([k,color])=>{
  x.strokeStyle=color;x.lineWidth=2;x.beginPath();
  d.forEach((p,i)=>{let xx=i/(d.length-1)*(w-20)+10,yy=h-20-clamp(p[k]+5,0,20)/20*(h-40);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()
 });
 x.fillStyle="#55d69e";x.fillText("增长",10,14);x.fillStyle="#ffd166";x.fillText("通胀",55,14);x.fillStyle="#ff7085";x.fillText("失业",100,14);
}
function showModal(html){document.getElementById("modalBody").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function exportSave(){
 let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
 let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="经济金融文明存档.json";a.click();URL.revokeObjectURL(a.href)
}
function resetGame(){
 if(confirm("新文明会清除当前浏览器存档。确定吗？")){localStorage.removeItem("econCivilization");location.reload()}
}
(function init(){
 let s=localStorage.getItem("econCivilization");
 document.getElementById("continueBtn").disabled=!s;
 if(s){try{state=JSON.parse(s)}catch(e){}}
})();
</script>
</body>
</html>
