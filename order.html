// 动态生成标准 WAV Data URI，作为 HTML5 <audio> 双重保障
function createWavDataUri(notes, totalSec = 5.0) {
  try {
    const sampleRate = 22050;
    const numSamples = Math.floor(sampleRate * totalSec);
    const buffer = new Int16Array(numSamples);

    notes.forEach(n => {
      const start = Math.floor(sampleRate * (n.delay || 0));
      const len = Math.floor(sampleRate * (n.dur || 0.3));
      const freq = n.freq;
      const gain = n.gain || 0.55;
      for (let i = 0; i < len && start + i < numSamples; i++) {
        const t = i / sampleRate;
        const env = Math.min(1, i / (sampleRate * 0.015)) * Math.exp(-3.2 * (i / len));
        const sample = (Math.sin(2 * Math.PI * freq * t) * 0.85 + Math.sin(4 * Math.PI * freq * t) * 0.15) * env * gain;
        const cur = buffer[start + i];
        const add = Math.floor(sample * 16000);
        buffer[start + i] = Math.max(-32767, Math.min(32767, cur + add));
      }
    });

    const header = new ArrayBuffer(44);
    const view = new DataView(header);
    function writeStr(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }
    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + numSamples * 2, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, 1, true); // Mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeStr(36, 'data');
    view.setUint32(40, numSamples * 2, true);

    const wavBytes = new Uint8Array(44 + numSamples * 2);
    wavBytes.set(new Uint8Array(header), 0);
    wavBytes.set(new Uint8Array(buffer.buffer), 44);

    let binary = '';
    const chunk = 8192;
    for (let i = 0; i < wavBytes.length; i += chunk) {
      const sub = wavBytes.subarray(i, Math.min(i + chunk, wavBytes.length));
      binary += String.fromCharCode.apply(null, sub);
    }
    return 'data:audio/wav;base64,' + btoa(binary);
  } catch(e) {
    return "";
  }
}

function updateCloseCountdown(forcedNow){
  const el = $("#cdTimer");
  if(!el) return;
  const period = tfMs(S.tf || "15m");
  const t = (forcedNow != null ? forcedNow : Date.now()) + TOFF;
  const leftMs = period - (t % period);
  const totalSec = Math.floor(leftMs / 1000);
  if(totalSec >= 60){
    const m = Math.ceil(totalSec / 60);
    const mStr = (m < 10 ? "0" : "") + m + ":00";
    if(el.textContent !== mStr) el.textContent = mStr;
    el.classList.remove("ending");
  } else {
    const sStr = "00:" + (totalSec < 10 ? "0" : "") + totalSec;
    if(el.textContent !== sStr) el.textContent = sStr;
    el.classList.add("ending");
  }
}

/* 智能预热：在后台预加载机会清单相邻标的的 500 根 K 线，彻底消灭切币网络卡顿 */
function prefetchAdjacentCandidates(currentSym){
  try{
    const p = pool();
    if(!p || !p.length) return;
    const idx = p.findIndex(x => x.n === currentSym);
    if(idx < 0) return;
    const nextSym1 = p[(idx + 1) % p.length]?.n;
    const nextSym2 = p[(idx + 2) % p.length]?.n;
    const prevSym = p[(idx - 1 + p.length) % p.length]?.n;
    const candidates = [nextSym1, prevSym, nextSym2].filter(Boolean);

    candidates.forEach((sym, i) => {
      const key = sym + "|15m";
      const cached = S.kc[key];
      if(!cached || Date.now() - cached.t > 120000){
        setTimeout(() => {
          if(S.sym === sym) return;
          pub("/fapi/v1/klines", { symbol: sym, interval: "15m", limit: 500 }, 8000)
            .then(r => {
              if(Array.isArray(r) && r.length){
                const raw = r.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}));
                S.kc[key] = { k: raw, t: Date.now() };
              }
            })
            .catch(()=>{});
        }, 200 + i * 350);
      }
    });
  }catch(e){}
}

function preloadTopOpportunities(){
  try{
    const p = pool();
    if(!p || !p.length) return;
    const topCandidates = p.slice(0, 5).map(x => x.n);
    topCandidates.forEach((sym, i) => {
      const key = sym + "|15m";
      if(!S.kc[key]){
        setTimeout(() => {
          pub("/fapi/v1/klines", { symbol: sym, interval: "15m", limit: 500 }, 8000)
            .then(r => {
              if(Array.isArray(r) && r.length){
                const raw = r.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}));
                S.kc[key] = { k: raw, t: Date.now() };
              }
            })
            .catch(()=>{});
        }, 150 + i * 300);
      }
    });
  }catch(e){}
}

/* 智能切币：优先命中内存 K 线缓存实现 0ms 秒开，后台自动对齐与预加载 */
async function pick(sym){
  if(!sym) return;
  close();
  if(sym === S.sym) return;
  if(F.on) endFlow();
  clearTradeLines();
  S.sym = sym;
  useMaxLev();
  savePref();
  
  // 1. 立即同步 UI（币种标题、自选星标状态等），实现 0ms 点击响应无卡顿
  head();
  wSync();

  const key = S.sym + "|" + S.tf;
  const c = S.kc[key];
  const hasValidCache = !!(c && c.k && c.k.length > 0);

  if(hasValidCache){
    // 2. 命中缓存：立即绘制已记忆的 500 根 K 线与持仓挂单线，绝不等待网络阻塞 UI
    useCandles(c.k, true);
    syncTradeLines();
    subCoin(S.sym, S.tf);
    // 后台静默刷新以对齐最新数据，不阻塞主线程
    kline(false).catch(()=>{});
  } else {
    // 3. 无缓存首屏：拉取 500 根数据并绘制
    await kline(true);
    head();
    wSync();
    syncTradeLines();
  }

  // 4. 智能预测预热：在后台静默拉取相邻标的 500 根 K 线，确保翻页与切币全流程极速秒开
  prefetchAdjacentCandidates(sym);
}

function step(n){
  const l=pool();
  const listToUse = l.length ? l : (S.uni || []).map(u => ({ n: u.name }));
  if(!listToUse.length) return;
  let i=listToUse.findIndex(x=>x.n===S.sym);if(i<0)i=0;
  const nextSym = listToUse[(i+n+listToUse.length)%listToUse.length].n;
  pick(nextSym);
}

/* ================= 下单：按止损自动算仓 ================= */
const F={on:false,step:0,e:null,sl:null,tp:null,risk:1};
function maxLev(){return S.maxLev[S.sym]||LEV_DEF;}
function useMaxLev(){S.lev=Math.min(maxLev(),LEVWANT>0?Math.round(LEVWANT):LEV_DEF);}
function flowSide(){return (F.e!=null&&F.sl!=null)?(F.sl<F.e?"buy":"sell"):S.side;}
function startFlow(){F.on=true;F.step=1;F.e=F.sl=F.tp=null;
  $("#ohud").classList.add("on");render();toast("请在图表上点击选择【入场价】");}
function endFlow(){F.on=false;F.step=0;F.e=F.sl=F.tp=null;
  $("#ohud").classList.remove("on");syncTradeLines();}
function sizing(entryOverride, slOverride){
  const f=fOf(S.sym);
  const curM = mid(S.sym);
  const buy = flowSide() === "buy";
  const tk = f.tick || 0.01;

  let rawE = entryOverride != null ? entryOverride : F.e;
  let rawSl = slOverride != null ? slOverride : F.sl;

  // 方案 A 智能双模式：做多高于现价或做空低于现价判定为突破/跌破单，绝不暗中篡改用户入场价！
  let isBreakout = false;
  if(rawE != null && curM > 0){
    let alignedE = alignPx(rawE, S.sym, buy ? -1 : 1);
    isBreakout = (buy && alignedE > curM) || (!buy && alignedE < curM);
    // 仅当刚好等于市价时，向挂单 Maker 侧微调 1 tick，防止 Post-Only 拒单
    if(!isBreakout && Math.abs(alignedE - curM) < 1e-9){
      alignedE = alignPx(buy ? curM - tk : curM + tk, S.sym, buy ? -1 : 1);
    }
    rawE = alignedE;
  }
  if(rawSl != null){
    rawSl = alignPx(rawSl, S.sym, buy ? 1 : -1);
  }

  const base={equity:equity(),riskPct:F.risk,entry:rawE,sl:rawSl,tp:F.tp,
    lev:S.lev,maxLev:maxLev(),step:f.step||0.001,tick:f.tick||0.01,
    minQty:f.minQty||0,maxQty:f.maxQty||0,minNotional:f.minNotional||5,
    feeRate: isBreakout ? TAKER_FEE : (MAKER_FEE+TAKER_FEE)/2,
    availableMargin:availMargin()};
  let r=TradeCore.sizing(base);
  r.isBreakout = isBreakout;
  if(r.notional>0){
    const lv=Math.min(S.lev,levFor(S.sym,r.notional));
    if(lv!==r.lev){
      const r2=TradeCore.sizing(Object.assign({},base,{lev:lv,maxLev:Math.max(lv,1)}));
      r2.isBreakout = isBreakout;
      if(lv<S.lev)r2.capped=(r2.capped?r2.capped+"；":"")+"名义超出 "+S.lev+"x 档位，按 "+lv+"x 计";
      r=r2;}}
  return r;
}

/* ================= 同步图表价格线 ================= */
let LL_SIG="",LL_ITEMS=[];
function llSig(){
  const a=[S.sym, F.on ? "F:" + F.e + ":" + F.sl + ":" + F.tp : ""];
  Object.entries(S.pos).forEach(([k,p])=>{if(p.sym===S.sym)a.push("P"+k+":"+p.amt+":"+p.entry);});
  const symOrds = (S.ords[S.sym]||[]).filter(o => o && (!o.symbol || o.symbol === S.sym));
  symOrds.forEach(o=>{const oi=ordInfo(o);
    a.push("O"+(o.orderId||o.algoId)+":"+(oi.price||+(o.price||0))+":"+oi.kind+":"+oi.sizeTxt);});
  const pb = PENDBR[S.sym];
  if(pb) a.push("PB:" + pb.sl + ":" + pb.tp + ":" + pb.qty + ":" + (pb.items ? pb.items.map(i=>i.tp).join(",") : ""));
  return a.join("|");
}

function llPlace(){
  LL_ITEMS.forEach(it=>{
    if(it.dragging) return;
    if(it.sym && it.sym !== S.sym){
      it.el.style.display="none";
      return;
    }
    const y=p2y(it.v);
    if(y==null || y < -30 || y > window.innerHeight + 30){
      it.el.style.display="none";
      return;
    }
    it.el.style.display="block";
    it.el.style.top=y+"px";
  });
}

function liveLines(force){
  const sig=llSig();
  if(!force&&sig===LL_SIG&&LL_ITEMS.every(it=>it.el.isConnected)){llPlace();return;}
  LL_SIG=sig;LL_ITEMS=[];
  document.querySelectorAll(".dl.dyn").forEach(el=>el.remove());
  const lay=$("#dlayer");
  if(!lay) return;

  // 1. 持仓线
  Object.entries(S.pos).filter(([k,p])=>p.sym===S.sym).forEach(([k,p])=>{
    const lg=p.amt>0,d=document.createElement("div");
    d.className="dl dyn pos en";
    d.dataset.c=p.sym;
    d.innerHTML='<span class="grip" style="cursor:default">'+(lg?"多仓 ":"空仓 ")+sz(Math.abs(p.amt),p.sym)+" @ "+px(p.entry,p.sym)+'</span><span class="xbtn" title="平仓">✕</span>';
    lay.appendChild(d);LL_ITEMS.push({el:d,v:+p.entry,sym:p.sym});
    d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
      if(confirm("挂单平仓 "+disp(p.sym)+"（"+(lg?"多仓 ":"空仓 ")+sz(Math.abs(p.amt),p.sym)+"）？"))closePos(k);
    });
  });

  // 2. 挂单线（绑定拖拽改单逻辑）
  const symOrds = (S.ords[S.sym]||[]).filter(o => o && (!o.symbol || o.symbol === S.sym));
  symOrds.forEach(o=>{
    const oi=ordInfo(o),v=oi.price||+(o.price||0);if(!v)return;
    const d=document.createElement("div");
    d.className="dl dyn "+(oi.isEntry?"en":oi.tp?"tp":oi.trig?"sl":"en");
    d.dataset.c=o.symbol||S.sym;
    d.innerHTML='<span class="grip">'+oi.kind+" "+oi.sizeTxt+" @ "+px(v,o.symbol||S.sym)+'</span><span class="xbtn" title="撤单">✕</span>';
    lay.appendChild(d);
    
    const itObj = {el:d, v:v, sym:o.symbol||S.sym, dragging:false};
    LL_ITEMS.push(itObj);

    // 绑定挂单拖拽改价
    const grip = d.querySelector(".grip");
    if(grip){
      let startY = 0, isDragging = false, currentPrice = v;
      grip.addEventListener("pointerdown", ev => {
        if(ev.button !== 0 && ev.pointerType === "mouse") return;
        isDragging = true;
        itObj.dragging = true;
        startY = ev.clientY;
        currentPrice = v;
        d.classList.add("dragging");
        grip.classList.add("dragging");
        try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
        ev.stopPropagation();
        if(ev.cancelable) ev.preventDefault();
      }, { passive: false });

      grip.addEventListener("pointermove", ev => {
        if(!isDragging) return;
        const cy = ev.clientY;
        const p = y2p(cy);
        if(p == null || !isFinite(p) || p <= 0) return;
        const aligned = alignPx(p, o.symbol);
        if(aligned > 0){
          currentPrice = aligned;
          d.style.top = cy + "px";
          const curM = mid(o.symbol);
          const diffPct = (curM > 0) ? ((aligned - curM) / curM * 100) : 0;
          const pctTxt = curM > 0 ? " (" + (diffPct > 0 ? "+" : "") + diffPct.toFixed(2) + "%)" : "";
          grip.textContent = "改价 → " + oi.kind + " @" + px(aligned, o.symbol) + pctTxt;
        }
        ev.stopPropagation();
        if(ev.cancelable) ev.preventDefault();
      }, { passive: false });

      const onUp = ev => {
        if(!isDragging) return;
        isDragging = false;
        itObj.dragging = false;
        d.classList.remove("dragging");
        grip.classList.remove("dragging");
        try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
        ev.stopPropagation();
        if(ev.cancelable) ev.preventDefault();

        if(currentPrice > 0 && Math.abs(currentPrice - v) > 1e-8){
          modifyOrderPrice(o, currentPrice);
        } else {
          liveLines(true);
        }
      };

      grip.addEventListener("pointerup", onUp, { passive: false });
      grip.addEventListener("pointercancel", onUp, { passive: false });
      grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
    }

    d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
      cancelOrder(o.symbol,o.orderId||o.algoId,o.isAlgo);
    });
  });

  // 3. 待成交挂单 (PENDBR)
  const pb = PENDBR[S.sym];
  if(pb){
    const hasLiveSl = (S.ords[S.sym]||[]).some(o=>ordInfo(o).sl);
    if(pb.sl != null && !hasLiveSl){
      const d=document.createElement("div");
      d.className="dl dyn sl";
      d.dataset.c=S.sym;
      d.innerHTML='<span class="grip">待挂止损 @ '+px(pb.sl,S.sym)+'</span><span class="xbtn" title="取消待挂止损">✕</span>';
      lay.appendChild(d);
      const itObj = {el:d, v:+pb.sl, sym:S.sym, dragging:false};
      LL_ITEMS.push(itObj);

      const grip = d.querySelector(".grip");
      if(grip){
        let isDragging = false, curP = +pb.sl;
        grip.addEventListener("pointerdown", ev => {
          isDragging = true; itObj.dragging = true; 
          d.classList.add("dragging"); grip.classList.add("dragging");
          try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
        }, { passive: false });
        grip.addEventListener("pointermove", ev => {
          if(!isDragging) return;
          const p = y2p(ev.clientY);
          if(p > 0){
            curP = alignPx(p, S.sym);
            d.style.top = ev.clientY + "px";
            grip.textContent = "待挂止损 → " + px(curP, S.sym);
          }
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
        }, { passive: false });
        const onUp = ev => {
          if(!isDragging) return;
          isDragging = false; itObj.dragging = false; 
          d.classList.remove("dragging"); grip.classList.remove("dragging");
          try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
          if(curP > 0){
            pb.sl = curP; savePendBr(); syncTradeLines();
            toast("已修改待挂止损价格至 " + px(curP, S.sym));
          }
        };
        grip.addEventListener("pointerup", onUp, { passive: false });
        grip.addEventListener("pointercancel", onUp, { passive: false });
        grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
      }

      d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
        pb.sl=null;
        if(Array.isArray(pb.items)) pb.items.forEach(it => it.sl = null);
        savePendBr();syncTradeLines();toast("已取消待挂止损");
      });
    }

    // 独立待挂止盈线（支持多笔入场各自的止盈）
    const pbItems = Array.isArray(pb.items) ? pb.items : [pb];
    pbItems.forEach(it => {
      const isLive = (S.ords[S.sym]||[]).some(o => (it.tpOid && String(o.orderId||o.algoId) === String(it.tpOid)) || Math.abs((o.price||0) - it.tp) < 1e-6);
      if(it.tp != null && !isLive && !it.tpFbDone){
        const d=document.createElement("div");
        d.className="dl dyn tp";
        d.dataset.c=S.sym;
        const itQtyTxt = it.qty ? sz(it.qty, S.sym) + " " : "";
        d.innerHTML='<span class="grip">待挂止盈 ' + itQtyTxt + '@ '+px(it.tp,S.sym)+'</span><span class="xbtn" title="取消待挂止盈">✕</span>';
        lay.appendChild(d);
        const itObj = {el:d, v:+it.tp, sym:S.sym, dragging:false};
        LL_ITEMS.push(itObj);

        const grip = d.querySelector(".grip");
        if(grip){
          let isDragging = false, curP = +it.tp;
          grip.addEventListener("pointerdown", ev => {
            isDragging = true; itObj.dragging = true; 
            d.classList.add("dragging"); grip.classList.add("dragging");
            try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
            ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
          }, { passive: false });
          grip.addEventListener("pointermove", ev => {
            if(!isDragging) return;
            const p = y2p(ev.clientY);
            if(p > 0){
              curP = alignPx(p, S.sym);
              d.style.top = ev.clientY + "px";
              grip.textContent = "待挂止盈 " + itQtyTxt + "→ " + px(curP, S.sym);
            }
            ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
          }, { passive: false });
          const onUp = ev => {
            if(!isDragging) return;
            isDragging = false; itObj.dragging = false; 
            d.classList.remove("dragging"); grip.classList.remove("dragging");
            try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
            ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
            if(curP > 0){
              it.tp = curP;
              pb.tp = curP;
              savePendBr(); syncTradeLines();
              toast("已修改待挂止盈价格至 " + px(curP, S.sym));
            }
          };
          grip.addEventListener("pointerup", onUp, { passive: false });
          grip.addEventListener("pointercancel", onUp, { passive: false });
          grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
        }

        d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
          it.tp=null;
          if(pb.items && pb.items.every(x => x.tp == null)) pb.tp = null;
          savePendBr();syncTradeLines();toast("已取消该笔待挂止盈");
        });
      }
    });
  }

  llPlace();
}

function flowRrInfo(e, sl, tp){
  if(e == null || sl == null || tp == null) return null;
  const dist = Math.abs(e - sl);
  if(!(dist > 0)) return null;
  const isLong = sl < e;
  const isProfit = isLong ? (tp > e) : (tp < e);
  if(!isProfit) return { valid: false, ratio: 0, text: "⚠ 止盈方向错误" };
  const ratio = Math.abs(tp - e) / dist;
  return { valid: true, ratio, text: "盈亏比 " + ratio.toFixed(2) + ":1" };
}

function clearTradeLines(){
  if(candleSeries){
    if(tradeLines.entry){ try{candleSeries.removePriceLine(tradeLines.entry);}catch(e){} tradeLines.entry = null; }
    if(tradeLines.sl){ try{candleSeries.removePriceLine(tradeLines.sl);}catch(e){} tradeLines.sl = null; }
    if(tradeLines.tp){ try{candleSeries.removePriceLine(tradeLines.tp);}catch(e){} tradeLines.tp = null; }
    if(tradeLines.pos && tradeLines.pos.length){
      tradeLines.pos.forEach(l => { try{candleSeries.removePriceLine(l);}catch(e){} });
      tradeLines.pos = [];
    }
    if(tradeLines.ords && tradeLines.ords.length){
      tradeLines.ords.forEach(l => { try{candleSeries.removePriceLine(l);}catch(e){} });
      tradeLines.ords = [];
    }
  }
  LL_SIG = "";
  LL_ITEMS = [];
  document.querySelectorAll(".dl.dyn").forEach(el => el.remove());
  ["#hEn", "#hSl", "#hTp"].forEach(id => {
    const el = $(id);
    if(el) el.style.display = "none";
  });
}

function syncTradeLines(){
  if(!candleSeries) return;
  clearTradeLines();
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const blueColor = isDark ? "#8CAECF" : "#3C5A78";
  const upColor = isDark ? "#6CA88D" : "#3A755D";
  const downColor = isDark ? "#C27A68" : "#A85244";

  // 绘制新选点线及即时盈亏比
  if(F.on){
    let dist = (F.e != null && F.sl != null) ? Math.abs(F.e - F.sl) : 0;
    let slPct = (F.e != null && F.sl != null && F.e > 0) ? (dist / F.e * 100) : 0;

    if(F.e != null){
      tradeLines.entry = candleSeries.createPriceLine({
        price: F.e, color: blueColor, lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: "入场 " + px(F.e, S.sym)
      });
    }
    if(F.sl != null){
      const slTxt = "止损 " + px(F.sl, S.sym) + (slPct > 0 ? " (-" + slPct.toFixed(2) + "%)" : "");
      tradeLines.sl = candleSeries.createPriceLine({
        price: F.sl, color: downColor, lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: slTxt
      });
    }
    if(F.tp != null){
      const rInfo = flowRrInfo(F.e, F.sl, F.tp);
      const tpTxt = "止盈 " + px(F.tp, S.sym) + (rInfo ? " (" + rInfo.text + ")" : "");
      tradeLines.tp = candleSeries.createPriceLine({
        price: F.tp, color: upColor, lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: tpTxt
      });
    }
  }

  const p = posOf(S.sym)[0];
  if(p && Math.abs(p.amt) > 0){
    const lg = p.amt > 0;
    const posLine = candleSeries.createPriceLine({
      price: p.entry,
      color: blueColor,
      lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: false,
      title: (lg ? "多仓 " : "空仓 ") + sz(Math.abs(p.amt), S.sym) + " @" + px(p.entry, S.sym)
    });
    tradeLines.pos.push(posLine);
  }

  const symOrds = (S.ords[S.sym] || []).filter(o => o && (!o.symbol || o.symbol === S.sym));
  symOrds.forEach(o => {
    const oi = ordInfo(o);
    const v = oi.price || +(o.price || 0);
    if(!(v > 0)) return;
    const c = oi.isEntry ? blueColor : (oi.tp ? upColor : (oi.trig ? downColor : blueColor));
    const ordLine = candleSeries.createPriceLine({
      price: v,
      color: c,
      lineWidth: 1.5,
      lineStyle: LightweightCharts.LineStyle.Dotted,
      axisLabelVisible: false,
      title: oi.kind + " " + oi.sizeTxt + " @" + px(v, o.symbol || S.sym)
    });
    tradeLines.ords.push(ordLine);
  });

  const pb = PENDBR[S.sym];
  if(pb){
    const hasLiveSl = symOrds.some(o=>ordInfo(o).sl);
    if(pb.sl != null && !hasLiveSl){
      const slLine = candleSeries.createPriceLine({
        price: pb.sl,
        color: downColor,
        lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: false,
        title: "待挂止损 @" + px(pb.sl, S.sym)
      });
      tradeLines.ords.push(slLine);
    }
    const pbItems = Array.isArray(pb.items) ? pb.items : [pb];
    pbItems.forEach(it => {
      const isLive = symOrds.some(o => (it.tpOid && String(o.orderId||o.algoId) === String(it.tpOid)) || Math.abs((o.price||0) - it.tp) < 1e-6);
      if(it.tp != null && !isLive && !it.tpFbDone){
        const tpLine = candleSeries.createPriceLine({
          price: it.tp,
          color: upColor,
          lineWidth: 1.5,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: false,
          title: "待挂止盈 " + (it.qty ? sz(it.qty, S.sym) + " " : "") + "@" + px(it.tp, S.sym)
        });
        tradeLines.ords.push(tpLine);
      }
    });
  }

  syncHandles();
  liveLines(true);
}

function syncHandles(){
  let dist = (F.e != null && F.sl != null) ? Math.abs(F.e - F.sl) : 0;
  let slPct = (F.e != null && F.sl != null && F.e > 0) ? (dist / F.e * 100) : 0;
  const rInfo = flowRrInfo(F.e, F.sl, F.tp);

  [["e","#hEn","入场",""],
   ["sl","#hSl","止损", slPct > 0 ? " (-" + slPct.toFixed(2) + "%)" : ""],
   ["tp","#hTp","止盈", rInfo ? " · " + rInfo.text : ""]
  ].forEach(([k,hd,lb,extra])=>{
    const el=$(hd);
    if(!el) return;
    const v=F.on?F[k]:null;
    const y=p2y(v);
    if(v==null || y==null || y < -30 || y > window.innerHeight + 30){
      el.style.display="none";
      return;
    }
    el.style.display="block";
    el.style.top=y+"px";
    const grip=el.querySelector(".grip");
    if(grip && !grip.classList.contains("dragging"))grip.textContent=lb+" "+px(v,S.sym)+extra;
  });
}

let lastCommitTime=0;
function pickPrice(p){
  if(!p || !isFinite(p) || p <= 0) return;
  const nowT = Date.now();
  if(nowT - lastCommitTime < 300) return;
  lastCommitTime = nowT;

  if(!F.on){
    F.on=true;F.step=1;F.e=F.sl=F.tp=null;
    $("#ohud").classList.add("on");
  }
  if(F.step<=1){
    F.e=p;F.step=2;
    toast("【入场已定】"+px(p,S.sym)+" · 请再次长按选【止损价】");
  }else if(F.step===2){
    F.sl=p;F.step=3;
    const dPct = (F.e != null && F.e > 0) ? (Math.abs(p - F.e) / F.e * 100).toFixed(2) : "";
    toast("【止损已定】"+px(p,S.sym)+" (-"+dPct+"%) · 再次长按选【止盈】或点【跳过】");
  }else if(F.step===3){
    F.tp=p;F.step=4;
    const rInfo = flowRrInfo(F.e, F.sl, p);
    const rrTip = rInfo ? " (" + rInfo.text + " · +" + (rInfo.ratio ? rInfo.ratio.toFixed(2) : 0) + "R)" : "";
    toast("【止盈已定】"+px(p,S.sym)+rrTip+" · 请在面板核对并点击【确认】");
  }else{
    const d=[["e",F.e],["sl",F.sl],["tp",F.tp]].filter(x=>x[1]!=null)
      .sort((a,b)=>Math.abs(a[1]-p)-Math.abs(b[1]-p))[0];
    if(d)F[d[0]]=p;
  }
  render();
}

/* ================= 瞄准选价 / 拖拽把手 / 右键选点 / 左右 20% 点击切币 ================= */
function y2p(y){
  if(!candleSeries) return null;
  return candleSeries.coordinateToPrice(y);
}
function p2y(p){
  if(!candleSeries || p==null) return null;
  return candleSeries.priceToCoordinate(p);
}

let aim=false, aimPrice=null, pT=null, pX=0, pY=0, pKill=false, pMulti=false;
let touchStartX=0, touchStartY=0, touchStartTime=0;

function guide(clientY){
  if(!aim){hideGuide();return null;}
  const p=y2p(clientY),l=$("#pline");
  if(p==null||!isFinite(p)||p<=0){l.style.display="none";aimPrice=null;return null;}
  aimPrice=p;
  let lb=!F.on||F.step<=1?"入场":F.step===2?"止损":F.step===3?"止盈":"调整";
  let extra="";
  if(F.on){
    if(F.step===2 && F.e!=null && F.e>0){
      const dPct=Math.abs(p - F.e)/F.e*100;
      extra = " (-" + dPct.toFixed(2) + "%)";
    }else if(F.step===3 && F.e!=null && F.sl!=null){
      const rInfo = flowRrInfo(F.e, F.sl, p);
      if(rInfo){
        extra = " · " + rInfo.text;
      }
    }
  }
  l.style.display="block";l.style.top=clientY+"px";
  $("#pbub").textContent=lb+" "+px(p,S.sym)+extra;
  return p;
}
function hideGuide(){$("#pline").style.display="none";aimPrice=null;}
function enterAim(){
  if(pKill||pMulti)return;
  aim=true;
  $("#pline").classList.add("aim");
  guide(pY);
  navigator.vibrate?.(15);
}
function resetPress(){
  clearTimeout(pT);pT=null;aim=false;pKill=false;pMulti=false;
  hideGuide();$("#pline").classList.remove("aim");
}

function onChart(t){
  if(!t||!t.closest)return false;
  if(t.closest(".grip")||t.closest(".xbtn")||t.closest(".sheet")||t.closest("#ohud")||t.closest("#khud")||t.closest("#tl")||t.closest("#br"))return false;
  if(t.closest("#tv_chart")||t.closest(".edge-zone"))return true;
  return t===document.body||t===document.documentElement;
}

const AIM_MS=240,H_TOL=12;

function bindGrip(hd,key){
  const grip=$(hd)?.querySelector(".grip");if(!grip)return;
  let isDragging=false;

  const onPointerDown = ev => {
    if(ev.button !== 0 && ev.pointerType === "mouse") return;
    isDragging = true;
    grip.classList.add("dragging");
    try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
  };

  const onPointerMove = ev => {
    if(!isDragging) return;
    const cy = ev.clientY;
    const p = y2p(cy);
    if(p == null || !isFinite(p) || p <= 0) return;
    const aligned = alignPx(p, S.sym);
    if(aligned > 0 && F[key] !== aligned){
      F[key] = aligned;
      render();
    }
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
  };

  const onPointerUp = ev => {
    if(!isDragging) return;
    isDragging = false;
    grip.classList.remove("dragging");
    try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
    render();
  };

  grip.addEventListener("pointerdown", onPointerDown, { passive: false });
  grip.addEventListener("pointermove", onPointerMove, { passive: false });
  grip.addEventListener("pointerup", onPointerUp, { passive: false });
  grip.addEventListener("pointercancel", onPointerUp, { passive: false });
  grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
}
bindGrip("#hEn","e");bindGrip("#hSl","sl");bindGrip("#hTp","tp");

// 鼠标长按与左右切币
addEventListener("mousedown",e=>{
  if(e.button!==0||!onChart(e.target))return;
  aim=false;aimPrice=null;pKill=false;pMulti=false;
  pX=e.clientX;pY=e.clientY;
  touchStartX=e.clientX;touchStartY=e.clientY;touchStartTime=Date.now();
  clearTimeout(pT);
  pT=setTimeout(enterAim,AIM_MS);
});
addEventListener("mousemove",e=>{
  if(!pT&&!aim)return;
  if(aim){guide(e.clientY);return;}
  const dx=Math.abs(e.clientX-pX),dy=Math.abs(e.clientY-pY);
  if(dx>H_TOL||dy>H_TOL){
    pKill=true;clearTimeout(pT);pT=null;hideGuide();
  }
});
addEventListener("mouseup",e=>{
  const wasAim = aim && !pKill && onChart(e.target);
  const p = aimPrice || y2p(e.clientY);
  const dt = Date.now() - touchStartTime;
  const dx = Math.abs(e.clientX - touchStartX);
  const dy = Math.abs(e.clientY - touchStartY);
  resetPress();

  if(wasAim && p != null && isFinite(p) && p > 0){
    pickPrice(p);
    return;
  }

  // 点击屏幕左右 20% 区域快速切币（无明显拖拽且非长按）
  if(!F.on && onChart(e.target) && dt < 280 && dx < 10 && dy < 10){
    if(document.querySelector(".sheet.on")) return;
    const w = window.innerWidth;
    if(e.clientX < w * 0.20){
      step(-1);
    }else if(e.clientX > w * 0.80){
      step(1);
    }
  }
});
addEventListener("contextmenu",e=>{
  if(!onChart(e.target))return;
  const p=y2p(e.clientY);
  if(p==null||!isFinite(p)||p<=0)return;
  e.preventDefault();
  pickPrice(p);
});

// 触屏长按与左右 20% 切币（优化多指触控防整页缩放）
addEventListener("touchstart",e=>{
  if(!onChart(e.target))return;
  pMulti=e.touches.length>1;pKill=pMulti;aim=false;aimPrice=null;
  const t=e.touches[0];if(!t)return;
  pX=t.clientX;pY=t.clientY;
  touchStartX=t.clientX;touchStartY=t.clientY;touchStartTime=Date.now();
  clearTimeout(pT);
  if(!pMulti)pT=setTimeout(enterAim,AIM_MS);
},{passive:false});

addEventListener("touchmove",e=>{
  if(e.touches.length>1){
    pMulti=pKill=true;clearTimeout(pT);aim=false;hideGuide();
    if(e.cancelable) e.preventDefault();
    return;
  }
  if(!pT&&!aim)return;
  const t=e.touches[0];if(!t)return;
  if(aim){
    guide(t.clientY);
    if(e.cancelable)e.preventDefault();
    return;
  }
  const dx=Math.abs(t.clientX-pX),dy=Math.abs(t.clientY-pY);
  if(dx>H_TOL||dy>H_TOL){
    pKill=true;clearTimeout(pT);hideGuide();
  }
},{passive:false});

addEventListener("touchend",e=>{
  clearTimeout(pT);
  const wasAim = aim && !pKill && !pMulti;
  const p = aimPrice;
  const dt = Date.now() - touchStartTime;
  const t = e.changedTouches?.[0];
  const dx = t ? Math.abs(t.clientX - touchStartX) : 0;
  const dy = t ? Math.abs(t.clientY - touchStartY) : 0;
  const cx = t ? t.clientX : touchStartX;

  resetPress();

  if(wasAim && p != null && isFinite(p) && p > 0){
    if(e.cancelable) e.preventDefault();
    pickPrice(p);
    return;
  }

  // 触屏手势切币：支持横向滑动切币（滑幅 > 45px，垂直偏离 < 30px）或点击左右 15% 边缘
  const isSwipeLeft = (t && (touchStartX - t.clientX > 45) && dy < 30 && dt < 350);
  const isSwipeRight = (t && (t.clientX - touchStartX > 45) && dy < 30 && dt < 350);
  if(!F.on && onChart(e.target) && !pMulti && !document.querySelector(".sheet.on")){
    if(isSwipeLeft){
      if(e.cancelable) e.preventDefault();
      step(1);
    }else if(isSwipeRight){
      if(e.cancelable) e.preventDefault();
      step(-1);
    }else if(dt < 280 && dx < 12 && dy < 12){
      const w = window.innerWidth;
      if(cx < w * 0.15){
        if(e.cancelable) e.preventDefault();
        step(-1);
      }else if(cx > w * 0.85){
        if(e.cancelable) e.preventDefault();
        step(1);
      }
    }
  }
},{passive:false});

function setLock(why){
  if(LOCK===why)return;
  const was=LOCK;LOCK=why;const b=$("#lockbar");
  if(b){b.textContent=why?"⚠ "+why+" · 交易已锁定":"";b.classList.toggle("on",!!why);}
  document.body.classList.toggle("locked",!!why);
  try{render();}catch(e){}
  if(why&&!was)try{onLocked();}catch(e){log("onLocked err "+e.message);}
}
window.setLock = setLock;
window.NET = NET;

async function onLocked(){
  if(!NET.mid&&!LOCK_CANCEL_COLDSTART){log("cold start lock, skip cancel");return;}
  const kill=[];
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    (arr||[]).filter(Boolean).forEach(o=>{if(!ordInfo(o).ro)kill.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo});});});
  if(!kill.length)return;
  if(!LOCK_CANCEL_ENTRY){toast("⚠ 行情已锁定，交易所还挂着 "+kill.length+" 张未成交入场单（保留不撤）");return;}
  toast("行情异常，正在撤掉 "+kill.length+" 张未成交入场单");
  for(const k of kill){
    try{await cancelOrder(k.sym,k.oid,k.isAlgo);log("lock-cancel "+k.sym);}
    catch(e){log("lock-cancel err "+e.message);}}
  load(true);
}

function lockCheck(){
  const t=Date.now(),ivl=9e5;
  const age=NET.mid?t-NET.mid:Infinity;
  let why="";
  if(!S.uni.length)why="行情未加载";
  else if(t-T0>30000&&age>120000)
    why=NET.mid?"实时价中断超过 2 分钟":"实时价未接通";
  else if(NET.fail>=8)why="行情接口连续失败";
  else if(NET.info&&t-NET.info>120000)why="行情接口超过 2 分钟无响应";
  else if(!NET.info)why="行情尚未加载";
  else if(S.k.length&&t-S.k[S.k.length-1].t>ivl*4)why="K 线停更";
  setLock(why);
}

/* ================= TRADE 纯函数内核与全局风控闸门 ================= */
function alignSz(s,sym){return TradeCore.alignSz(s,fOf(sym).step||0.001);}
function alignPx(p,sym,dir){return TradeCore.alignPx(p,fOf(sym).tick||0.01,dir);}

function checkRiskGates(sym, newRiskUsd){
  const eq = equity();
  if(!eq || eq <= 0) return { pass: true };

  // 1. 单日最大亏损熔断
  const upnl = (+((S.acct||{}).upnl) || 0);
  const maxLossUsd = eq * (MAX_DAILY_LOSS_PCT / 100);
  if(upnl < -maxLossUsd){
    return { pass: false, reason: "今日持仓浮亏 (" + money(Math.abs(upnl)) + ") 超过单日限额 " + MAX_DAILY_LOSS_PCT + "% ($" + money(maxLossUsd) + ")，已触发日内熔断锁单！" };
  }

  // 2. 并发持仓总风险上限 (3%)
  let totalRiskUsd = newRiskUsd || 0;
  Object.values(S.pos || {}).forEach(p => {
    if(p && Math.abs(p.amt) > 0){
      const liveSl = (S.ords[p.sym] || []).map(ordInfo).find(i => i.sl && i.ro);
      const slPx = liveSl ? liveSl.price : (PENDBR[p.sym]?.sl || (p.amt > 0 ? p.entry * 0.98 : p.entry * 1.02));
      totalRiskUsd += Math.abs(p.entry - slPx) * Math.abs(p.amt);
    }
  });
  const maxTotalRisk = eq * (MAX_TOTAL_RISK_PCT / 100);
  if(totalRiskUsd > maxTotalRisk){
    return { pass: false, reason: "当前全部持仓总风险 ($" + money(totalRiskUsd) + ") 超过并发限额 " + MAX_TOTAL_RISK_PCT + "% ($" + money(maxTotalRisk) + ")，请降低敞口！" };
  }

  // 3. 连亏冷静期 (3笔亏损后冷静 30 分钟)
  const coolUntil = +localStorage.getItem("bn_cooldown_until") || 0;
  if(Date.now() < coolUntil){
    const leftSec = Math.round((coolUntil - Date.now()) / 1000);
    return { pass: false, reason: "连亏保护中：系统处于只读冷静期（剩余 " + leftSec + " 秒），暂停新开仓！" };
  }

  return { pass: true };
}

/* ================= 确认下单流程 ================= */
$("#ohGo").addEventListener("click",async()=>{
  if(SUBMITTING||INFLIGHT){toast("正在提交，请稍候");return;}
  if(!DRY_RUN && !HASKEY){toast("未配置 API Key / Secret，无法下单");return;}
  if(!DRY_RUN && ACCT_LOADING){toast("账户加载中，请稍候再试");return;}
  if(!hasAcct()){toast("未读到账户资金，无法下单");return;}
  const r=sizing();
  if(!r.ok){toast((r.reasons&&r.reasons[0])||"入场或止损无效");return;}

  // 全局三大风控闸门校验（单日最大亏损、并发总风险上限、连亏冷静期）
  const gateCheck = checkRiskGates(S.sym, r.riskUsd);
  if(!gateCheck.pass){
    toast("⚠ 触发风控拦截：" + gateCheck.reason, true);
    return;
  }

  const sym=S.sym,qty=fmtSz(alignSz(r.size,sym),sym);
  if(!(+qty>0)){toast("数量小于最小下单精度（stepSize="+(fOf(sym).step||0)+"）");return;}
  const buy=flowSide()==="buy",m=mid(sym);
  if(!isFinite(m)||m<=0){toast("无法获取市价，已阻止下单");return;}
  const side=buy?"BUY":"SELL",ps=buy?"LONG":"SHORT";
  
  // 方案 A 智能双模式：
  // 逢高做空 / 逢低接多（Maker 区）：LIMIT GTX（0% 挂单手续费）
  // 跌破做空 / 突破做多（突破区）：STOP_MARKET（条件单，严格按选定价格挂入，跌破/突破即触发）
  const ePx = fmtPx(r.e, sym);
  const isBreakout = !!r.isBreakout;
  const entry = isBreakout ? {
    symbol: sym,
    side: side,
    type: "STOP_MARKET",
    stopPrice: ePx,
    triggerPrice: ePx,
    quantity: qty,
    workingType: WORK,
    priceProtect: "true"
  } : {
    symbol: sym,
    side: side,
    type: "LIMIT",
    price: ePx,
    quantity: qty,
    timeInForce: TIF // "GTX" 只挂单
  };
  if(S.dual) entry.positionSide = ps;
  if(LOCK){toast("行情异常，交易已锁定："+LOCK);return;}
  SUBMITTING=true;try{render();}catch(e){}
  try{
    if(!await ensureLev(r.lev)) return;
    const slOrd=exitOrder(sym,buy,alignPx(r.sl,sym,buy?1:-1),ps,qty);
    const tpOrd=(r.tp!=null)?tpPostOnlyOrder(sym,buy,r.tp,ps,qty):null;
    const actionLabel = buy ? (isBreakout ? "突破做多 " : "挂单做多 ") : (isBreakout ? "跌破做空 " : "挂单做空 ");
    const label = actionLabel + qty + " " + disp(sym) + " @" + ePx;
    
    const good=x=>x&&(x.orderId!=null||x.algoId!=null)&&!(x.code!=null&&+x.code<0);
    const oidOf=x=>x?(x.algoId!=null?x.algoId:x.orderId):null;

    let eRes=null,slRes=null,tpRes=null;
    
    // 1. 提交入场单（普通只挂单 LIMIT GTX 或 突破条件单 STOP_MARKET）
    eRes=await placeOrder(entry,label);
    
    // 若限价只挂单（GTX）遇 -5022 盘口穿透，智能向盘口外微调并重试（仅对普通只挂单有效）
    if(!isBreakout && !good(eRes)){
      const code=eRes&&eRes.code!=null?+eRes.code:(LAST_ERR&&LAST_ERR.code!=null?+LAST_ERR.code:0);
      if(code===-5022){
        const curM=mid(sym);
        const tkSafe=(fOf(sym).tick||0.01);
        if(tkSafe>0&&curM>0){
          const safePx=buy?Math.min(+entry.price,curM-tkSafe):Math.max(+entry.price,curM+tkSafe);
          const np=alignPx(safePx,sym,buy?-1:1);
          entry.price=fmtPx(np,sym);
          toast("只挂单会立刻成交，已将价格微调至 "+px(np,sym)+" 重试");
          eRes=await placeOrder(entry,label);
        }
      }
    }
    
    const eOk=good(eRes);
    if(eOk){
      // 2. 预挂市价止损单（带快速重试机制）
      slRes=await placeOrder(slOrd,"预挂止损(市价)",true).catch(()=>null);
      if(!good(slRes)){
        await sleep(300);
        slRes=await placeOrder(slOrd,"预挂止损(重试1)",true).catch(()=>null);
      }
      if(!good(slRes)){
        await sleep(500);
        slRes=await placeOrder(slOrd,"预挂止损(重试2)",true).catch(()=>null);
      }

      // 3. 预挂止盈单
      if(tpOrd){
        tpRes=await placeOrder(tpOrd,"预挂止盈",true).catch(()=>null);
      }
    }else{
      toast("⚠ 入场单提交失败："+errText(LAST_ERR||eRes));
      return;
    }
    
    let slOk=good(slRes),tpOk=tpOrd?good(tpRes):true;

    // 关键风控闭环：若止损单重试后依然失败
    if(!slOk){
      const entryOid = oidOf(eRes);
      // 检查入场单是否已直接成交产生持仓
      const p = posOf(sym).find(x => x && Math.abs(x.amt) > 0 && (x.amt > 0) === buy);
      const isEntryFilled = !!p;

      if(!isEntryFilled){
        // 入场单尚在挂单中未成交：坚决主动撤销入场单！彻底杜绝脱离监控后的裸成交隐患！
        log("Entry succeeded but SL failed after retries. Safely cancelling pending entry order " + entryOid);
        await cancelOrder(sym, entryOid, isBreakout, { escapeLock: true, skipCascade: true });
        toast("🛑【安全撤单】止损单未能在币安成功挂入，为防脱机裸仓风险已自动撤销入场单！", true);
        clearTradeLines();
        syncTradeLines();
        return;
      } else {
        // 入场单已成交（产生了真实持仓）：触发最高优先级报警，看门狗紧急接管
        wBeep();
        toast("🚨【紧急裸仓警报】入场单已成交但止损未能挂入！看门狗已紧急接管，请立即检查！", true);
      }
    }

    if(isBreakout){
      toast("【" + (buy ? "突破做多" : "跌破做空") + "条件单已挂入币安】触发价 @" + px(r.e, sym) + "，成交后看门狗自动补挂止损与止盈", true);
    } else if(slOk && tpOk){
      toast("【3单已全部挂入币安】入场 + 止损(市价)" + (tpOrd ? " + 止盈" : ""));
    } else {
      if(!tpOk) toast("⚠ 止盈单未能立刻挂入，成交后会自动补挂");
    }

    if(!PENDBR[sym]){
      PENDBR[sym] = { side, sl: r.sl, tp: r.tp, qty: +qty, slDone: slOk, slOid: oidOf(slRes), tpOid: oidOf(tpRes), ts: Date.now(), tpFbDone: tpOk, tpFbOid: oidOf(tpRes), oid: oidOf(eRes), isBreakout, items: [] };
    }
    if(!Array.isArray(PENDBR[sym].items)){
      const oldB = Object.assign({}, PENDBR[sym]);
      delete oldB.items;
      PENDBR[sym].items = (oldB.oid || oldB.tp != null || oldB.sl != null) ? [oldB] : [];
    }
    const bracketItem = {
      id: "br_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6),
      oid: oidOf(eRes),
      side,
      entry: +r.e,
      sl: r.sl,
      tp: r.tp,
      qty: +qty,
      slDone: slOk,
      slOid: oidOf(slRes),
      tpFbDone: tpOk,
      tpFbOid: oidOf(tpRes),
      tpOid: oidOf(tpRes),
      isBreakout,
      ts: Date.now()
    };
    PENDBR[sym].items.push(bracketItem);
    PENDBR[sym].side = side;
    PENDBR[sym].ts = Date.now();
    const safeSl = PENDBR[sym].items.reduce((acc, it) => {
      if(it.sl == null) return acc;
      if(acc == null) return +it.sl;
      return buy ? Math.min(acc, +it.sl) : Math.max(acc, +it.sl);
    }, r.sl != null ? +r.sl : null);
    PENDBR[sym].sl = safeSl;
    PENDBR[sym].tp = r.tp;
    PENDBR[sym].qty = PENDBR[sym].items.reduce((sum, it) => sum + (+it.qty || 0), 0);
    PENDBR[sym].oid = oidOf(eRes);
    PENDBR[sym].slDone = slOk;
    PENDBR[sym].slOid = oidOf(slRes);
    PENDBR[sym].tpFbDone = tpOk;
    PENDBR[sym].tpOid = oidOf(tpRes);
    savePendBr();endFlow();
  }finally{SUBMITTING=false;try{render();}catch(e){}load(true);}
});

addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"){if(e.key==="Escape")close();return;}
  if(e.key==="Escape"){if(F.on)endFlow();else close();}
  if(e.key==="k"||e.key==="/"){e.preventDefault();open("shList");}
  if(e.key==="ArrowLeft")step(-1);
  if(e.key==="ArrowRight")step(1);
  if(e.key==="o"||e.key==="O"){F.on?endFlow():startFlow();}
  if(e.key==="t"||e.key==="T")cycleTheme();
  if(e.key==="w"||e.key==="W")wToggle();
});

/* ================= 架构抽象层 ================= */
window.BN={S,F,DATA:{pub,priv,syncTime,loadUniverse,tickers,loadBrackets,kline,load,reconcile,
  findOrphans,sweepOrphans,subCoin,startUserStream,applyAcct,handleUserStreamEvent},
  TRADE:{core:TradeCore,alignPx,alignSz,sizing,send,ensureLev,closePos,cancelOrder,placeOrder,modifyOrderPrice,
    cancelAllOrders,closeAllPositions,sweepOrphans,cascadeCancelLinkedBrackets,
    checkRiskGates,slWatchdog,step,pick,open,close,posView,render,endFlow,startFlow,pool,flowRrInfo,clearTradeLines,syncTradeLines,
    dryRun:(on=true)=>{DRY_RUN=!!on;toast("DRY_RUN = "+DRY_RUN);return DRY_RUN;},
    setTestnet:async (on=true)=>{await switchTestnet(on);return IS_TESTNET;},
    pendbr:()=>PENDBR},
  ver:VER,LOG,log,dump:()=>LOG.join("\n"),
  debug:(v=true)=>{window.__BNDEBUG=!!v;return "debug="+!!v;},
  time:()=>({offsetMs:TOFF,serverNow:now()}),
  pendbr:()=>PENDBR,
  keys:()=>openKey(),
  $: $,
  chartView:()=>CHART_VIEW_STATE,
  tvChart:()=>tvChart,
  AUDIO:{play15mAlert,play1hAlert,checkCandleAlerts,wBeep},
  countdown:updateCloseCountdown,
  QR:{parseKeyQrData,decodeQrFromCanvas,decodeQrFromImageBlob,fillDecodedKey,startCameraScan,stopCameraScan},
  setProxy:(http,ws)=>{
    try{localStorage.setItem("bn_proxy",JSON.stringify({http:http||"",ws:ws||""}));}
    catch(e){return "存不进去："+e.message;}
    return "已保存，刷新页面生效 · http="+(http||"直连")+" ws="+(ws||"直连");}};
window.TradeCore = TradeCore;

addEventListener("error",e=>{try{log("window error "+((e&&e.message)||e));}catch(_){}});
addEventListener("unhandledrejection",e=>{try{const r=(e||{}).reason;log("unhandled "+((r&&r.message)||r));}catch(_){}});

/* ================= 启动流程 ================= */
async function boot(){
  initLeaderElection();
  await syncTime();
  initTradingViewChart();
  applyTheme();
  updateCloseCountdown();
  try{await loadUniverse();sock();setInterval(tick,TICKER_MS);}
  catch(e){toast("行情加载失败，交易已锁定");log("boot universe err "+e.message);}
  await kline(true);head();
  setTimeout(preloadTopOpportunities, 500);
  await bootKeys();
  avHint();
  if(HASKEY)await startPrivate();
  else if(!readRec())toast("未配置 API Key：只看行情。点持仓面板右上角就能填");
  ACCT_LOADING=false;
  setInterval(syncTime,3e5);
  posView();render();
}
loadPref();
boot().catch(e=>{log("boot err "+((e&&e.message)||e));toast("启动出错："+((e&&e.message)||e));});
</script>
