<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2EFE9">
<title>BN Chart (TradingView 引擎版)</title>
<!-- 引入 TradingView 官方开源 Lightweight Charts 图表库（优先同域本地/高速 CDN） -->
<script src="./lightweight-charts.standalone.production.js"></script>
<script>
if (typeof LightweightCharts === "undefined") {
  document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"><\/script>');
}
</script>
<style>
/* 极致护眼配色（iPad/高亮显示屏、长时间盯盘）：
   1) 日间：温润暖羊皮纸底色 #F4F1EA，消灭 255 纯白刺眼蓝光；
   2) 夜间：深邃温润暖灰底色 #171614，消灭纯黑与高亮文字的刺眼眩光；
   3) K 线与指标：选用低饱和松石绿与陶土暖红，柔和不刺眼，久看眼睛不酸胀；
   4) 字体：中性炭黑与暖象牙白，维持 10:1 舒适阅读对比度。 */
:root{--bg:#F4F1EA;--surface:#FAF8F3;--raised:#EAE5DC;--text:#332F28;--dim:rgba(51,47,40,.68);
  --faint:rgba(51,47,40,.45);--line:rgba(51,47,40,.12);
  --up:#3A755D;--down:#A85244;--blue:#3C5A78;--amber:#8B6A2B;
  --ink:#332F28;--onink:#FAF8F3;--cline:rgba(51,47,40,.50);--cbody:#332F28;
  --pop:rgba(250,248,243,.96);--fabbg:rgba(250,248,243,.92);
  --tint:rgba(51,47,40,.06);--cgrid:rgba(51,47,40,.04);--caim:rgba(51,47,40,.75);--chair:rgba(51,47,40,.28);
  color-scheme:light;--mono:"Menlo","Consolas",monospace}
html[data-theme="dark"]{--bg:#171614;--surface:#1F1D1A;--raised:#2C2925;--text:#DDD7CB;
  --dim:rgba(221,215,203,.68);--faint:rgba(221,215,203,.45);--line:rgba(221,215,203,.12);
  --up:#6CA88D;--down:#C27A68;--blue:#8CAECF;--amber:#D8B368;
  --ink:#DDD7CB;--onink:#171614;--cline:rgba(221,215,203,.48);--cbody:#B8B0A2;
  --pop:rgba(31,29,26,.96);--fabbg:rgba(31,29,26,.92);
  --tint:rgba(221,215,203,.07);--cgrid:rgba(221,215,203,.04);--caim:rgba(221,215,203,.70);
  --chair:rgba(221,215,203,.26);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* iPad 专属防整页缩放与滚动穿透 */
html, body {
  background:var(--bg);color:var(--text);
  width:100%;height:100%;height:100dvh;
  position:fixed;top:0;left:0;right:0;bottom:0;
  overflow:hidden;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit;background:none;border:none;outline:none;touch-action:auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}

/* ---- 全屏 TradingView 图表容器 ---- */
#tv_chart{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}

/* ---- 左右 20% 翻币区域视觉轻提示 ---- */
.edge-zone{position:fixed;top:0;bottom:0;width:20vw;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s ease;display:flex;align-items:center;justify-content:center}
.edge-zone.left{left:0}
.edge-zone.right{right:0}
.edge-hint{font-size:28px;color:var(--faint);font-weight:300;user-select:none;opacity:0.25}

/* ---- 左上角：品种与周期点击切换 ---- */
#tl{position:fixed;top:18px;left:22px;z-index:5;display:flex;flex-direction:row;gap:10px;align-items:center}
#name{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px;border-radius:9px;background:var(--fabbg);backdrop-filter:blur(8px);user-select:none;-webkit-user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:transform .12s,background .15s}
#name:hover{background:var(--raised)}
#name:active{transform:scale(0.96)}
#name .s{font-size:18px;font-weight:650;letter-spacing:-.01em}
#name .tf-badge{font-size:12px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:6px;background:var(--raised);color:var(--dim)}
#name .caret{font-size:12px;color:var(--faint);margin-left:2px}
#bStar{height:32px;min-width:34px;padding:0 7px;border-radius:9px;font-size:16px;line-height:1;
  color:var(--faint);background:var(--fabbg);box-shadow:0 2px 8px rgba(0,0,0,.04);backdrop-filter:blur(8px)}
#bStar.on{color:var(--amber);background:var(--raised)}

#lockbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;display:none;
  background:var(--ink);border:none;color:var(--onink);
  padding:7px 14px;border-radius:9px;font-size:12.5px}
#lockbar.on{display:block}
body.locked #tv_chart{opacity:.42}

/* ---- 左下角 TV 水印球二合一按钮 ---- */
#br{position:fixed;left:18px;bottom:20px;z-index:6;display:flex;align-items:center;gap:8px}
.fab{height:40px;min-width:40px;padding:0 14px;border-radius:11px;background:var(--fabbg);
  border:none;box-shadow:0 2px 10px rgba(46,43,38,.07);font-size:13.5px;color:var(--text);backdrop-filter:blur(8px);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;user-select:none;transition:transform .12s}
.fab:hover{background:var(--raised)}
.fab:active{transform:scale(0.96)}
.tv-btn{display:inline-flex;align-items:center;gap:8px;padding:0 14px;height:42px;border-radius:13px;font-weight:550;position:relative}
.tv-logo{font-family:var(--mono);font-size:11.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--ink);color:var(--onink);letter-spacing:0.04em}
.tv-badge{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--faint)}
.tv-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);display:none;position:absolute;top:6px;right:6px}
.tv-btn.hot .tv-dot{display:block}

/* ---- 面板与抽屉 ---- */
#mask{position:fixed;inset:0;background:rgba(46,43,38,.22);opacity:0;pointer-events:none;transition:.18s;z-index:8}
#mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--line);z-index:9;transform:translateX(102%);transition:transform .22s ease;
  display:flex;flex-direction:column;touch-action:pan-y}
.sheet.on{transform:none}
.sh{flex:none;display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sh b{font-size:15px;font-weight:600}
.sh .x{margin-left:auto;width:30px;height:30px;border-radius:8px;color:var(--faint);font-size:16px}
.sh .x:hover{background:var(--raised);color:var(--text)}
.tabs{display:flex;align-items:center;gap:6px}
.tab-btn{font-size:13.5px;font-weight:600;color:var(--faint);padding:5px 12px;border-radius:8px;transition:.15s}
.tab-btn.on{color:var(--text);background:var(--raised)}
.tab-content{display:none;flex:1;flex-direction:column;overflow:hidden}
.tab-content.on{display:flex}

.sbody{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 12px 18px;scrollbar-width:thin;scrollbar-color:var(--raised) transparent;touch-action:pan-y}
.sbody::-webkit-scrollbar{width:6px}.sbody::-webkit-scrollbar-thumb{background:var(--raised);border-radius:6px}
.filt{display:flex;align-items:center;gap:8px;padding:0 18px 10px;font-size:11.5px;color:var(--faint)}
.filt button{padding:3px 9px;border-radius:999px;border:none;font-size:11.5px;color:var(--faint)}
.filt button.on{background:var(--raised);color:var(--text);border-color:transparent}
.ci{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.ci:hover{background:var(--raised)}
.ci.on{background:var(--raised)}
.ci .n{font-size:13.5px;font-weight:550}
.ci .v{display:block;margin-top:1px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.ci .hold{margin-left:6px}
.ci .r{margin-left:auto;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ci .r .a{display:block;font-size:13px}
.ci .r .b{display:block;font-size:11px}
.hold{font-size:10px;padding:1px 5px;border-radius:5px;background:var(--raised);color:var(--text)}

.wi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer}
.wi:hover{background:var(--raised)}
.wi.due{background:var(--tint)}
.wi .n{font-size:13.5px;font-weight:550}
.wi .m{display:block;margin-top:1px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.wi .r{margin-left:auto;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.wi .cd{display:block;font-size:13px}
.wi .cd.due{color:var(--amber);font-weight:600}
.wi .dd{display:block;font-size:11px}
.wi .wx{margin-left:6px;width:26px;height:26px;border-radius:7px;color:var(--faint);font-size:13px}
.wi .wx:hover{background:var(--raised);color:var(--text)}
.none{padding:22px 10px;color:var(--faint);font-size:13px;line-height:1.7}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;font-weight:400;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 5px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);opacity:0;
  background:var(--raised);border-radius:9px;padding:9px 15px;font-size:13px;transition:.2s;pointer-events:none;z-index:20;
  max-width:78vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ---- 下单 HUD 面板 ---- */
.rrbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:3px}
#av{cursor:pointer}
#khud{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;width:380px;max-width:92vw;
  display:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.28);touch-action:auto}
#khud.on{display:block}
#khud .t{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);margin-bottom:14px}
#khud .t b{font-size:16px;color:var(--text);font-weight:600}
#khud .t .x{margin-left:auto;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px}
#khud input{display:block;width:100%;box-sizing:border-box;margin-bottom:8px;padding:11px 12px;
  font-family:var(--mono);font-size:16px;color:var(--text);background:var(--raised);
  border:1px solid var(--line);border-radius:10px}
#khud input:focus{outline:none;border-color:var(--blue)}
#kHint{font-size:11.5px;line-height:1.7;color:var(--faint);margin:10px 0 14px}
#khud .obar{display:flex;gap:8px}
#khud .obar button{flex:1;padding:11px;border-radius:10px;background:var(--raised);font-size:14px;color:var(--text)}
#khud .obar button.b{flex:2;background:var(--ink);color:var(--bg);font-weight:600}
#ohud{position:fixed;left:16px;bottom:80px;z-index:7;width:380px;display:none;
  background:var(--pop);border:none;border-radius:16px;box-shadow:0 8px 32px rgba(46,43,38,.15);
  padding:18px 20px;backdrop-filter:blur(10px);touch-action:pan-y}
#ohud.on{display:block}
#ohud .t{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--faint);margin-bottom:12px}
#ohud .t b{font-size:18px;color:var(--text);font-weight:600}
#ohud .t .x{margin-left:auto;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px}
.ol{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12.5px;color:var(--faint)}
.ol .v{margin-left:auto;font-family:var(--mono);color:var(--text);font-weight:550}
.ol.cur{color:var(--text);font-weight:600}
.ol i{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.ol i.e{background:var(--blue)}.ol i.s{background:var(--down)}.ol i.t{background:var(--up)}
.ol.cur i{box-shadow:0 0 0 3px var(--tint)}
#ohC{font-size:11px;color:var(--faint);line-height:1.55;margin:8px 0 2px}
#ohC b{color:var(--text);font-weight:600}
.obar{display:flex;gap:6px;margin-top:8px}
.obar button{flex:1;height:26px;border-radius:6px;background:var(--raised);font-size:11.5px;color:var(--dim)}
.obar button:hover{color:var(--text)}
#ohGo{height:34px;width:100%;margin-top:8px;border-radius:8px;font-size:13px;font-weight:650}
#ohGo.b{background:var(--up);color:var(--onink)}#ohGo.s{background:var(--down);color:var(--onink)}
#ohGo:disabled{opacity:.35;cursor:not-allowed}
#ohH{font-size:11px;color:var(--amber);margin-top:5px;min-height:14px;line-height:1.4}

/* ---- 图表取数 / 拖拽线 ---- */
#pline{position:fixed;left:0;right:0;height:0;display:none;z-index:10;pointer-events:none;
  border-top:1px dashed var(--cline)}
#pline.aim{border-top:1.5px solid var(--amber)}
#pbub{position:absolute;left:130px;top:-11px;font-family:var(--mono);font-size:12px;
  background:var(--raised);color:var(--text);border-radius:6px;padding:2px 8px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.1)}
#pline.aim #pbub{background:var(--ink);color:var(--onink);font-weight:650}

#dlayer{position:fixed;inset:0;z-index:4;pointer-events:none}
.dl{position:absolute;left:0;right:0;height:0;display:none;border:none !important}
.dl .grip{position:absolute;left:130px;top:-13px;font-size:12px;font-family:var(--mono);font-weight:600;
  border-radius:7px;padding:3px 10px;cursor:ns-resize;pointer-events:auto;touch-action:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.15);user-select:none;-webkit-user-select:none;transition:transform .08s}
.dl .grip:active, .dl .grip.dragging{transform:scale(1.06);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.dl.en .grip{background:var(--blue);color:var(--onink)}
.dl.sl .grip{background:var(--down);color:var(--onink)}
.dl.tp .grip{background:var(--up);color:var(--onink)}
.dl.dyn .grip{left:130px;right:auto;background:var(--pop);color:var(--text);
  border:1px solid var(--line);box-shadow:0 2px 8px rgba(46,43,38,.14)}
.dl.dyn.sl .grip{color:var(--down);border-color:var(--down)}.dl.dyn.tp .grip{color:var(--up);border-color:var(--up)}.dl.dyn.pos .grip{color:var(--blue);border-color:var(--blue)}
.dl .xbtn{position:absolute;left:340px;right:auto;top:-13px;width:24px;height:24px;line-height:22px;text-align:center;
  border-radius:7px;background:var(--pop);border:1px solid var(--line);box-shadow:0 1px 6px rgba(46,43,38,.16);color:var(--text);
  font-size:13px;cursor:pointer;pointer-events:auto;user-select:none}

@media(max-width:640px){
  #tl{top:14px;left:16px}
  #br{left:12px;bottom:14px}
  .fab{height:38px;font-size:13px;padding:0 12px}
  #ohud{left:12px;bottom:80px;width:calc(100vw - 24px);padding:14px 16px}
  #pbub,.dl .grip{left:80px}
  .dl.dyn .grip{left:80px}
  .dl .xbtn{left:250px}
}
</style>
<script>
/* 针对 iOS / iPadOS 的手势缩放拦截，彻底杜绝整页被双指缩放变形 */
(function(){
  try{
    var _m=localStorage.getItem("bn_theme")||"auto";
    var _d=_m==="dark"||(_m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme",_d?"dark":"light");
  }catch(e){}

  // 阻止 iOS Safari 默认的整页手势缩放 (gesture)
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, { passive: false });

  // 阻止双击缩放 (Double-tap zoom)
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if(now - lastTouchEnd <= 300){
      if(e.target && !e.target.closest('input, textarea, button')) {
        e.preventDefault();
      }
    }
    lastTouchEnd = now;
  }, { passive: false });
})();
</script>
</head>
<body>
<!-- TradingView 图表挂载节点 -->
<div id="tv_chart"></div>

<!-- 左右 20% 点击切币区域 -->
<div class="edge-zone left"><span class="edge-hint">‹</span></div>
<div class="edge-zone right"><span class="edge-hint">›</span></div>

<div id="tl">
  <div id="name" title="点击切换 5m / 1h 周期">
    <span class="s" id="nS">BTC</span>
    <span class="tf-badge" id="nTf">1h</span>
    <span class="caret">⇄</span>
  </div>
  <button id="bStar" title="标记这个机会（W）：等这根 K 线收盘再下单">☆</button>
</div>

<div id="br">
  <button class="fab tv-btn" id="bTv" title="持仓 & 机会">
    <span class="tv-logo">TV</span>
    <span id="tvTxt">持仓 / 机会</span>
    <span class="tv-dot" id="tvDot"></span>
  </button>
</div>

<div id="mask"></div>

<!-- 品种列表抽屉 -->
<aside class="sheet" id="shList">
  <div class="sh"><b>品种</b><span class="num" style="font-size:11.5px;color:var(--faint)" id="cnt"></span>
    <button class="x" data-close>✕</button></div>
  <div class="filt"><button class="on" id="fBtn">24h成交额 &gt; $1M</button><span>持仓品种始终显示</span></div>
  <div class="sbody" id="clist"></div>
</aside>

<!-- 二合一整合抽屉（持仓 + 机会） -->
<aside class="sheet" id="shTv">
  <div class="sh">
    <div class="tabs">
      <button class="tab-btn on" id="tabPosBtn">持仓</button>
      <button class="tab-btn" id="tabWatBtn">机会 <span class="num" id="wCntTab" style="font-size:11px"></span></button>
    </div>
    <span class="num" style="font-size:11.5px;color:var(--faint);margin-left:auto;margin-right:8px" id="av"></span>
    <button class="x" data-close>✕</button>
  </div>
  <div class="tab-content on" id="tabPosContent">
    <div class="sbody" id="pb"><div class="none">账户数据加载中…</div></div>
  </div>
  <div class="tab-content" id="tabWatContent">
    <div class="filt"><span>标记后等这根 K 线收盘，收盘会响一声提醒你下单</span></div>
    <div class="sbody" id="wlist"></div>
  </div>
</aside>

<div id="lockbar"></div>
<div id="dlayer">
  <div class="dl en" id="hEn"><span class="grip">入场</span></div>
  <div class="dl sl" id="hSl"><span class="grip">止损</span></div>
  <div class="dl tp" id="hTp"><span class="grip">止盈</span></div>
</div>
<div id="pline"><span id="pbub"></span></div>

<div id="ohud">
  <div class="t"><b id="ohT">BTC</b><span id="ohS">在图表上点击选入场价</span><button class="x" id="ohX">✕</button></div>
  <div class="ol" id="lE"><i class="e"></i>入场<span class="v">—</span></div>
  <div class="ol" id="lS"><i class="s"></i>止损<span class="v">—</span></div>
  <div class="ol" id="lT"><i class="t"></i>止盈<span class="v">—</span></div>
  <div id="ohC"></div>
  <div class="obar"><button id="ohR">风险1%</button><button id="ohSkip">跳过止盈</button></div>
  <button id="ohGo" class="b">确认</button>
  <div id="ohH"></div>

  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,

function sha256(data){
  const l=data.length;
  const bitLen=l*8;
  const padLen=((l+9+63)>>6)<<6;
  const b=new Uint8Array(padLen);
  b.set(data,0);
  b[l]=0x80;
  const dv=new DataView(b.buffer);
  dv.setUint32(padLen-8,Math.floor(bitLen/0x100000000),false);
  dv.setUint32(padLen-4,bitLen>>>0,false);

  const H=new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
  const W=new Uint32Array(64);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));

  for(let off=0;off<padLen;off+=64){
    for(let i=0;i<16;i++) W[i]=dv.getUint32(off+i*4,false);
    for(let i=16;i<64;i++){
      const s0=rotr(W[i-15],7)^rotr(W[i-15],18)^(W[i-15]>>>3);
      const s1=rotr(W[i-2],17)^rotr(W[i-2],19)^(W[i-2]>>>10);
      W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0;
    }
    let a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);

      const temp1=(h+S1+ch+K256[i]+W[i])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&bb)^(a&c)^(bb&c);
      const temp2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+temp1)>>>0;
      d=c;c=bb;bb=a;a=(temp1+temp2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }

  let key=typeof keyStr==="string"?utf8(keyStr):keyStr;

  if(key.length>64) key=sha256(key);
  const kPad=new Uint8Array(64);
  kPad.set(key,0);
  const iPad=new Uint8Array(64);
  const oPad=new Uint8Array(64);
  for(let i=0;i<64;i++){
    iPad[i]=kPad[i]^0x36;
    oPad[i]=kPad[i]^0x5c;
  }
  const inner=new Uint8Array(64+msg.length);
  inner.set(iPad,0);
  inner.set(msg,64);
  const innerHash=sha256(inner);

  const outer=new Uint8Array(64+32);
  outer.set(oPad,0);
  outer.set(innerHash,64);
  return sha256(outer);
}

function bnErr(j){
  const e=new Error((j&&j.msg)||("code "+((j&&j.code)||"?")));e.code=+((j||{}).code||0);return e;}
async function req(method,path,query,headers,ms){
  if(Date.now()<backoffUntil)throw new Error("backoff");
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;
  const tm=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},ms||15000);
  try{
    const r=await fetch(BASE+path+(query?"?"+query:""),{method,headers:headers||{},signal:ctl?ctl.signal:undefined});
    const j=await r.json().catch(()=>null);
    if(r.status===429||r.status===418||r.status===403){NET.fail++;
      backoffUntil=Math.max(backoffUntil,Date.now()+Math.min(60000,3000*NET.fail));
      throw bnErr(j||{msg:"HTTP "+r.status,code:-r.status});}
    if(j&&j.code!=null&&+j.code<0)throw bnErr(j);
    if(!r.ok)throw bnErr(j||{msg:"HTTP "+r.status});
    NET.info=Date.now();NET.fail=0;backoffUntil=0;return j;
  }catch(e){
    if(e.name==="AbortError")e.timeout=true;
    if(!e.code){NET.fail++;if(NET.fail>=3)backoffUntil=Math.max(backoffUntil,Date.now()+Math.min(30000,2000*NET.fail));}
    throw e;
  }finally{clearTimeout(tm);}
}

/* ================= API 密钥安全存储 ================= */
const KKEY="bn_key";
const CANCRYPT=!!(window.isSecureContext&&window.crypto&&window.crypto.subtle);

function setKeys(k,s){API_KEY=k||"";API_SECRET=s||"";HASKEY=!!(API_KEY&&API_SECRET);}

const b64=u=>btoa(String.fromCharCode.apply(null,new Uint8Array(u)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function passKey(pass,salt){
  const raw=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:210000,hash:"SHA-256"},
    raw,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encKeys(k,s,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await passKey(pass,salt),
    new TextEncoder().encode(JSON.stringify({k,s})));
  return {v:1,mode:"aes",salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function decKeys(rec,pass){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(rec.iv)},
    await passKey(pass,unb64(rec.salt)),unb64(rec.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function bootKeys(){
  if(API_KEY&&API_SECRET){HASKEY=true;return;}
  try{const c=JSON.parse(sessionStorage.getItem(KKEY)||"null");
    if(c&&c.k&&c.s){setKeys(c.k,c.s);return;}}catch(e){}
  const rec=readRec();if(!rec)return;
  if(rec.mode==="plain"&&rec.k&&rec.s){setKeys(rec.k,rec.s);return;}
  if(rec.mode==="aes")openKey("unlock");
}

  const unlock=$("#khud").dataset.mode==="unlock",pass=$("#kP").value.trim();

    try{
      const o=await decKeys(rec,pass);setKeys(o.k,o.s);
      try{sessionStorage.setItem(KKEY,JSON.stringify({k:o.k,s:o.s}));}catch(e){}
      closeKey();toast("已解锁，正在读账户");await startPrivate();
    }catch(e){toast("口令不对，解不开");}

  if(!k||!s){toast("Key 和 Secret 都要填");return;}
  try{

  setKeys(k,s);closeKey();toast(pass&&CANCRYPT?"已加密保存，正在读账户":"已保存到本机，正在读账户");
  await startPrivate();

function levFor(sym,notional){
  const b=S.brk[sym];if(!b||!b.length)return S.maxLev[sym]||LEV_DEF;
  for(let i=0;i<b.length;i++)if(notional<=b[i].cap)return b[i].lev;
  return b[b.length-1].lev;

let lastEmaValue = null;

function calcEmaArray(data, period = 20){
  if(!data || !data.length) return [];
  const k = 2 / (period + 1);
  const emaData = [];
  let ema = data[0].close;

  if(data.length >= period){
    let sum = 0;
    for(let i = 0; i < period; i++) sum += data[i].close;
    ema = sum / period;
    for(let i = 0; i < period; i++){
      emaData.push({ time: data[i].time, value: ema });
    }
    for(let i = period; i < data.length; i++){
      ema = data[i].close * k + ema * (1 - k);
      emaData.push({ time: data[i].time, value: ema });
    }
  } else {
    data.forEach((b, idx) => {
      if(idx === 0) ema = b.close;
      else ema = b.close * k + ema * (1 - k);
      emaData.push({ time: b.time, value: ema });
    });
  }
  lastEmaValue = ema;
  return emaData;
}

function updateChartCandles(rawBars, resetRange){
  if(!candleSeries || !rawBars.length) return;
  const map = new Map();
  rawBars.forEach(x => {
    const timeSec = Math.floor(x.t / 1000);
    map.set(timeSec, { time: timeSec, open: x.o, high: x.h, low: x.l, close: x.c });
  });
  const data = Array.from(map.values()).sort((a, b) => a.time - b.time);
  candleSeries.setData(data);

  if(data.length > 0){
    const emaData = calcEmaArray(data, 20);
    emaSeries.setData(emaData);

    // K线默认显示数量 100 根
    if(resetRange && tvChart){
      const total = data.length;
      const count = 100;
      tvChart.timeScale().setVisibleLogicalRange({
        from: Math.max(0, total - count),
        to: total + 4
      });
    }
  }
}

function useCandles(raw, resetRange){
  S.k=raw.slice();
  const i=S.k.length-1;if(i>=0)S.k[i]=Object.assign({},S.k[i]);
  updateChartCandles(S.k, resetRange);
}

async function kline(force){
  const reqSym = S.sym, reqTf = S.tf;
  const key=reqSym+"|"+reqTf,c=S.kc[key];
  if(c&&c.k.length){useCandles(c.k, force);}
  subCoin(reqSym,reqTf);
  if(!force&&c&&Date.now()-c.t<30000)return;
  try{
    const r=await pub("/fapi/v1/klines",{symbol:reqSym,interval:reqTf,limit:1500});
    const raw=(r||[]).map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}));
    if(raw.length){
      S.kc[key]={k:raw,t:Date.now()};
      // 防切币竞态条件：确认当前仍是请求的币种和周期
      if(S.sym === reqSym && S.tf === reqTf){
        useCandles(raw, true);
      }
    }
  }catch(e){log("klines err "+e.message);}
}

/* ================= 行情 WebSocket ================= */
let ws,WSOK=false,wsTry=0,wsEver=false,wsId=1,WSCONN=0,wsPend=false,ARRON=false;
const SUB={sym:null,tf:null};
function wsSend(o){try{if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true;}}catch(e){}return false;}
function subCoin(sym,tf){
  if(!sym||!tf)return;
  const low=sym.toLowerCase();
  if(SUB.sym&&(SUB.sym!==sym||SUB.tf!==tf))
    wsSend({method:"UNSUBSCRIBE",params:[SUB.sym.toLowerCase()+"@kline_"+SUB.tf],id:wsId++});
  if(SUB.sym&&SUB.sym!==sym){const o=SUB.sym.toLowerCase();
    wsSend({method:"UNSUBSCRIBE",params:[o+"@ticker",o+"@markPrice@1s"],id:wsId++});}
  if(!wsSend({method:"SUBSCRIBE",params:[low+"@kline_"+tf,low+"@ticker",low+"@markPrice@1s"],id:wsId++}))return;
  SUB.sym=sym;SUB.tf=tf;
  MIDGRACE=Date.now()+10000;
}
function subArr(on){
  on=!!on;if(ARRON===on)return;
  ARRON=on;wsSend({method:on?"SUBSCRIBE":"UNSUBSCRIBE",params:["!markPrice@arr@1s"],id:wsId++});
}
function sock(){
  WSCONN=Date.now();
  try{ws=new WebSocket(WSU);}catch(e){setTimeout(sock,3000);return;}
  ws.onopen=()=>{WSOK=true;wsTry=0;NET.ws=Date.now();SUB.sym=null;SUB.tf=null;
    if(ARRON)wsSend({method:"SUBSCRIBE",params:["!markPrice@arr@1s"],id:wsId++});
    subCoin(S.sym,S.tf);
    if(wsEver){tickers().then(head).catch(()=>{});kline(true);}
    wsEver=true;};
  ws.onerror=()=>{WSOK=false;};
  ws.onclose=()=>{WSOK=false;wsPend=true;
    setTimeout(()=>{wsPend=false;sock();},Math.min(30000,2000*Math.pow(2,wsTry++)));};
  ws.onmessage=ev=>{
    NET.ws=Date.now();
    let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    const d=m&&m.data!==undefined?m.data:m;
    if(Array.isArray(d)){
      if(!d.length||d[0].e!=="markPriceUpdate")return;
      NET.mid=Date.now();d.forEach(x=>{if(S.f[x.s])S.mid[x.s]=+x.p;});
      schedule();return;}
    if(!d||!d.e)return;
    if(d.e==="markPriceUpdate"){
      NET.mid=Date.now();if(S.f[d.s])S.mid[d.s]=+d.p;schedule();return;}
    if(d.e==="kline"){
      const x=d.k||{};if(d.s!==S.sym||x.i!==S.tf)return;
      const key=S.sym+"|"+S.tf,c=S.kc[key];if(!c||!c.k.length)return;
      const b={t:+x.t,o:+x.o,h:+x.h,l:+x.l,c:+x.c},last=c.k[c.k.length-1];
      if(last&&last.t===b.t)c.k[c.k.length-1]=b;else if(!last||b.t>last.t)c.k.push(b);
      c.t=Date.now();
      if(candleSeries){
        const timeSec = Math.floor(b.t / 1000);
        candleSeries.update({ time: timeSec, open: b.o, high: b.h, low: b.l, close: b.c });
        if(emaSeries && lastEmaValue != null){
          const k = 2 / 21;
          const liveEma = b.c * k + lastEmaValue * (1 - k);
          emaSeries.update({ time: timeSec, value: liveEma });
        }
      }
      schedule();return;}
    if(d.e==="24hrTicker"){
      if(!S.f[d.s])return;
      S.ctx[d.s]=Object.assign({},S.ctx[d.s]||{},{last:+d.c,chg:+d.P,volUsd:+d.q});
      const bar=S.k[S.k.length-1];if(d.s===S.sym&&bar&&+d.c)bar.c=+d.c;
      NET.info=Date.now();schedule();return;}
  };
}

async function load(silent){
  if(!HASKEY){if(!silent)toast("未配置 API Key / Secret，无法读取账户");return;}
  try{
    const tasks=[
      priv("GET","/fapi/v2/account",{}),
      priv("GET","/fapi/v2/positionRisk",{}),
      priv("GET","/fapi/v1/openOrders",{}).catch(()=>[]),
      priv("GET","/fapi/v1/openAlgoOrders",{}).catch(()=>[])
    ];
    if(S.dual==null)tasks.push(priv("GET","/fapi/v1/positionSide/dual",{}).catch(()=>null));
    const [acc,pos,stdOd,algoRes,dual]=await Promise.all(tasks);
    if(dual&&dual.dualSidePosition!=null)S.dual=!!dual.dualSidePosition;
    
    const algoArr = Array.isArray(algoRes) ? algoRes : (algoRes && Array.isArray(algoRes.openAlgoOrders) ? algoRes.openAlgoOrders : []);
    const normalizedAlgo = algoArr.map(o => ({
      symbol: o.symbol,
      orderId: o.algoId || o.orderId,
      algoId: o.algoId || o.orderId,
      isAlgo: true,
      side: o.side,
      positionSide: o.positionSide || "BOTH",
      type: o.algoType || o.orderType || o.type,
      stopPrice: o.stopPrice || o.triggerPrice || 0,
      price: o.price || 0,
      origQty: o.totalQty || o.quantity || o.origQty || 0,
      closePosition: o.closePosition === true || o.closePosition === "true",
      reduceOnly: o.reduceOnly === true || o.reduceOnly === "true",
      time: o.bookTime || o.time || o.createTime || Date.now()
    }));

    const od = [...(Array.isArray(stdOd)?stdOd:[]), ...normalizedAlgo];
    applyAcct(acc,pos,od);
    if(!silent){const a=acctView();
      toast("已加载：总资金 $"+money(a.equity)+" · 可用 $"+money(a.avail)+"，持仓已置顶");}
    sweepOrphans(true);
  }catch(e){
    log("load err "+e.code+" "+e.message);
    if(!silent)toast(keyHint(e)||("账户读取失败："+e.message));
  }
  render();posView();syncTradeLines();updateTvBtn();
}

function keyHint(e){
  const c=+((e||{}).code||0);
  if(c===-2015)return "API Key 无效 / 未开合约权限 / IP 不在白名单（-2015）";
  if(c===-2014||c===-1022)return "签名不通过：检查 Secret 是否粘错（-1022）";
  if(c===-1021)return "本机时间与交易所偏差过大，已重新校时，请重试（-1021）";
  return "";
}
function acctView(){const a=S.acct||{};
  return{equity:+a.equity||0,avail:+a.avail||0,used:+a.used||0,wallet:+a.wallet||0,upnl:+a.upnl||0};}
const equity=()=>acctView().equity;
const availMargin=()=>acctView().avail;

function ordInfo(o){
  const t=String(o.type||""),stop=+(o.stopPrice||o.triggerPrice||0),lim=+(o.price||0);
  const closeAll=o.closePosition===true||o.closePosition==="true";
  const ps=String(o.positionSide||"BOTH").toUpperCase();
  const side=String(o.side||"").toUpperCase();
  
  let ro = !!o.reduceOnly || closeAll;
  if(!ro && ps === "LONG" && side === "SELL") ro = true;
  if(!ro && ps === "SHORT" && side === "BUY") ro = true;
  if(!ro){
    const p = posOf(o.symbol).find(x => x.amt !== 0);
    if(p && ((p.amt > 0 && side === "SELL") || (p.amt < 0 && side === "BUY"))) ro = true;
  }

  const trail=/TRAILING/.test(t);
  const tp=/TAKE_PROFIT/.test(t),sl=/STOP/.test(t)&&!trail;
  const trig=trail||stop>0||/STOP|TAKE_PROFIT/.test(t);
  const isEntry=trig&&!ro;
  const kind=trail?"追踪止损":trig?(isEntry?"触发入场":tp?"止盈":(/MARKET/.test(t)?"市价止损":"止损")):(ro?"限价平仓":"限价");
  const size=Math.abs(+o.origQty||+o.quantity||+o.totalQty||0);
  const sizeTxt=closeAll?"全平":size>0?sz(size,o.symbol):"—";
  const price=trig?stop:lim;
  let priceTxt=price>0?px(price,o.symbol):"市价";
  if(trig&&lim>0&&stop>0&&!/MARKET/.test(t)&&Math.abs(lim-stop)/stop>1e-9)
    priceTxt=px(stop,o.symbol)+" → 限 "+px(lim,o.symbol);
  return{t,trig,ro,closeAll,tp,sl,trail,isEntry,kind,size,sizeTxt,price,priceTxt,
    sideTxt:side==="BUY"?"买":"卖"};
}
function acctWarn(){
  const w=[],a=acctView();
  if(!HASKEY)w.push("⚠ 未配置 API Key：点持仓右上角填入，现仅看行情");
  else if(a.equity<=0&&!ACCT_LOADING)w.push("⚠ 未读到账户余额（权限/白名单/无资金），下单已锁定");

/* 拖拽直接修改已挂出的订单价格（撤旧挂新） */
async function modifyOrderPrice(oldOrder, newPrice){
  if(!oldOrder || !newPrice || !(newPrice > 0)) return;
  const sym = oldOrder.symbol || S.sym;
  const oi = ordInfo(oldOrder);
  const alignedPx = alignPx(newPrice, sym);
  if(!(alignedPx > 0) || Math.abs(alignedPx - oi.price) < 1e-8) return;

  const curM = mid(sym);
  // 止损单防穿透校验：避免误拖导致交易所拒单 -2021
  if(oi.sl && curM > 0){
    const isLong = oldOrder.side === "SELL"; // 多头平仓止损是 SELL
    if(isLong && alignedPx >= curM){
      toast("⚠ 多仓止损价必须低于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    } else if(!isLong && alignedPx <= curM){
      toast("⚠ 空仓止损价必须高于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    }
  }

  toast("正在修改 " + disp(sym) + " " + oi.kind + " 价格至 " + px(alignedPx, sym) + "…");
  
  // 1. 撤销旧单
  await cancelOrder(sym, oldOrder.orderId || oldOrder.algoId, oldOrder.isAlgo);
  
  // 2. 构造新单
  const isTrig = oi.trig;
  const pxStr = fmtPx(alignedPx, sym);
  const newOrd = {
    symbol: sym,
    side: oldOrder.side,
    type: oldOrder.type || "LIMIT"
  };

  if(oldOrder.closePosition || (isTrig && !oldOrder.origQty)){
    newOrd.closePosition = "true";
  } else if(oldOrder.origQty){
    newOrd.quantity = fmtSz(oldOrder.origQty, sym);
  }

  if(oldOrder.positionSide) newOrd.positionSide = oldOrder.positionSide;
  if(oldOrder.reduceOnly && !newOrd.closePosition) newOrd.reduceOnly = "true";

  if(isTrig){
    newOrd.stopPrice = pxStr;
    newOrd.triggerPrice = pxStr;
    newOrd.workingType = WORK;
    newOrd.priceProtect = "true";
    if(/LIMIT|TAKE_PROFIT|STOP$/.test(oldOrder.type)) newOrd.price = pxStr;
  } else {
    newOrd.price = pxStr;
    newOrd.timeInForce = oldOrder.timeInForce || TIF;
  }

  const res = await placeOrder(newOrd, "改单挂入 " + disp(sym) + " @" + px(alignedPx, sym));
  if(okAll(res)){
    toast("已成功修改 " + disp(sym) + " " + oi.kind + " 至 " + px(alignedPx, sym));
  }
  load(true);
}

let ORPHAN_KEY="",ORPHAN_AT=0;
function findOrphans(){
  const out=[];
  if(!S.acct||!S.ordsAt)return out;
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    if(PENDBR&&PENDBR[sym])return;
    const l=(arr||[]).filter(Boolean);
    if(!l.length)return;
    if(l.some(o=>!ordInfo(o).ro))return;
    l.forEach(o=>out.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo}));});
  return out;
}
async function sweepOrphans(auto){
  const orphans=findOrphans();
  if(!orphans.length){
    let dupCount = 0;
    Object.values(S.ords||{}).forEach(arr=>{
      const sls=(arr||[]).filter(o=>ordInfo(o).sl);
      if(sls.length>1) dupCount += (sls.length - 1);
    });
    if(dupCount>0){
      if(!auto){
        await cleanDuplicateOrders();
        return dupCount;
      }
    }
    ORPHAN_KEY="";if(!auto)toast("没有无持仓的止盈/止损单");return 0;
  }
  if(auto){
    const key=orphans.map(o=>o.sym+":"+o.oid).sort().join(","),t=Date.now();
    if(key===ORPHAN_KEY&&t-ORPHAN_AT<6e5)return orphans.length;
    ORPHAN_KEY=key;ORPHAN_AT=t;
    toast("发现 "+orphans.length+" 张无持仓的孤儿单，可在「持仓」面板一键清理");
    return orphans.length;
  }
  const syms=[...new Set(orphans.map(o=>o.sym))];
  for(const sym of syms){
    await send("DELETE","/fapi/v1/allOpenOrders",{symbol:sym},"清理 "+disp(sym)+" 孤儿单",true).catch(()=>{});
    await send("DELETE","/fapi/v1/algoOpenOrders",{symbol:sym},"清理 "+disp(sym)+" 孤儿 Algo 单",true).catch(()=>{});
    delete S.ords[sym];
  }
  await cleanDuplicateOrders();
  ORPHAN_KEY="";posView();toast("已清理孤儿单与重复挂单");
  return orphans.length;
}

async function cleanDuplicateOrders(){
  let cleaned = 0;
  for(const sym of Object.keys(S.ords||{})){
    const sls = (S.ords[sym]||[]).filter(o => ordInfo(o).sl);
    if(sls.length > 1){
      const toCancel = sls.slice(1);
      for(const o of toCancel){
        await cancelOrder(sym, o.orderId || o.algoId, o.isAlgo);
        cleaned++;
      }
    }
  }
  if(cleaned > 0) toast("已自动清理 "+cleaned+" 张多余重复挂单");
}

let LAST_ERR=null;
const ERRH={"-5022":"只挂单（GTX）会立刻成交，被交易所拒单：价格往盘口外挪一点再试",
  "-2021":"触发价已被行情穿透，交易所拒挂",
  "-1111":"价格或数量精度不对（tick / stepSize）",
  "-1013":"不满足交易所的最小下单量或价格过滤器",
  "-4164":"名义价值低于交易所下限（约 5 USDC）",
  "-2019":"保证金不足",
  "-4131":"对手价太远，撮合保护拒单",
  "-2011":"撤单失败：这张单已经不在了",
  "-2027":"超出该杠杆档位下的最大可开名义价值",
  "-4061":"持仓模式不匹配（单向 / 双向）",
  "-4120":"请使用 Algo Order API 接口提交条件单"};
function errText(e){const c=e&&e.code!=null?String(e.code):"";
  return ERRH[c]?ERRH[c]+"（"+c+"）":((e&&(e.msg||e.message))||("错误 "+c));}

async function send(method,path,params,msg,silent){
  if(LOCK){toast("行情异常，交易已锁定："+LOCK);return null;}
  if(INFLIGHT){toast("上一笔请求还在处理，请稍候");return null;}
  if(!HASKEY){copyJson({method,path,params},msg+"：未配置 API Key/Secret → 已复制请求 JSON");return null;}
  INFLIGHT=true;LAST_ERR=null;try{render();}catch(e){}
  const t0=Date.now();
  try{
    const res=await priv(method,path,params);
    const errs=errsOf(res);
    if(errs.length){LAST_ERR=errs[0];toast("被拒："+errs.map(errText).join(" / ").slice(0,140));return res;}
    if(!silent)toast(msg+" 已提交");
    setTimeout(()=>{if(Date.now()-(NET.acct||0)>5000)load(true);else log("skip reload (user stream fresh)");},900);
    return res;
  }catch(e){
    if(e.code===-1021){await syncTime();toast("时间不同步已重新校时，请再点一次");return null;}
    if(e.code===-4061){S.dual=null;load(true);
      toast("持仓模式变了，已重新读取账户设置，请再点一次");return null;}
    if(e.timeout||!e.code){
      toast("提交无响应，正在对账…（"+(e.message||e)+"）");await reconcile(t0-5000);return null;}
    LAST_ERR=e;toast(keyHint(e)||("被拒："+errText(e)).slice(0,140));
    log("send err "+e.code+" "+e.message);
    return null;
  }finally{INFLIGHT=false;try{render();}catch(e){}load(true);}
}

async function placeOrder(ord, label, silent){
  const isAlgo = /STOP|TAKE_PROFIT|TRAILING/.test(ord.type);
  if(isAlgo){
    const trig = ord.triggerPrice || ord.stopPrice;
    const p = Object.assign({}, ord, { 
      algoType: "CONDITIONAL", 
      triggerPrice: trig,
      stopPrice: trig,
      orderType: ord.type
    });
    let res = await send("POST", "/fapi/v1/algoOrder", p, label, silent);
    if(res && (res.code === -4120 || res.code === -1102)){
      res = await send("POST", "/fapi/v1/order", ord, label, silent);
    }
    return res;
  } else {
    let res = await send("POST", "/fapi/v1/order", ord, label, silent);
    if(res && res.code === -4120){
      const trig = ord.triggerPrice || ord.stopPrice;
      const p = Object.assign({}, ord, { 
        algoType: "CONDITIONAL", 
        triggerPrice: trig,
        stopPrice: trig,
        orderType: ord.type
      });
      res = await send("POST", "/fapi/v1/algoOrder", p, label, silent);
    }
    return res;
  }
}

async function ensureLev(target){
  if(!HASKEY)return true;
  const sym=S.sym,cp=curPos(),want=Math.max(1,Math.round(target||S.lev));
  if(cp&&cp.amt!==0){
    const cur=cp.lev||0;
    if(cur>0&&cur!==S.lev){
      S.lev=cur;S.levSet[sym]=cur;savePref();
      toast("已有 "+disp(sym)+" 持仓，沿用现有 "+cur+"x"+(cp.iso?"（逐仓）":"")+"，请再确认一次");
      try{render();}catch(e){}
      return false;}
    return true;}
  if(S.levSet[sym]===want)return true;
  const res=await send("POST","/fapi/v1/leverage",{symbol:sym,leverage:want},"杠杆 "+want+"x",true);
  if(!res||+res.leverage!==want){log("setLeverage fail");return false;}
  S.levSet[sym]=want;return true;

async function closePos(key){
  const p=S.pos[key];if(!p)return;
  const sym=p.sym,lg=p.amt>0,q=alignSz(Math.abs(p.amt),sym);
  if(!(q>0)){toast("持仓数量小于最小下单精度");return;}
  const m=mid(sym);
  if(!isFinite(m)||m<=0){toast("无法获取市价，已取消平仓");return;}
  const lim=alignPx(lg?m*(1+CLOSE_OFF):m*(1-CLOSE_OFF),sym,lg?1:-1);
  const o={symbol:sym,side:lg?"SELL":"BUY",type:"LIMIT",timeInForce:TIF,
    price:fmtPx(lim,sym),quantity:fmtSz(q,sym)};
  if(S.dual)o.positionSide=p.side==="BOTH"?(lg?"LONG":"SHORT"):p.side;
  else o.reduceOnly="true";
  await send("POST","/fapi/v1/order",o,"挂单平仓 "+disp(sym)+" @ "+px(lim,sym));
}

async function firePendingBracket(sym){
  const b=PENDBR[sym];if(!b)return;
  if(BRBUSY.has(sym))return;
  const p=posOf(sym).find(x=>(x.amt>0)===(b.side==="BUY"));
  if(!p)return;
  BRBUSY.add(sym);
  try{
    const lg=p.amt>0,ps=p.side==="BOTH"?(lg?"LONG":"SHORT"):p.side;
    const live=(S.ords[sym]||[]).filter(Boolean).map(o=>ordInfo(o));
    const left=live.some(i=>!i.ro);

    const hasLiveSl = live.some(i=>i.sl && i.ro);
    if(hasLiveSl) b.slDone = true;

    const hasLiveTp = live.some(i=>i.tp && i.ro);
    if(hasLiveTp) b.tpFbDone = true;

    if(b.slDone && (b.tp == null || b.tpFbDone || b.tpOid)){
      delete PENDBR[sym];
      savePendBr();
      return;
    }

    const orders=[];let iSl=-1,iTp=-1,iFb=-1,tpQty=0;
    if(b.sl!=null&&!b.slDone&&!hasLiveSl){
      iSl=orders.length;
      orders.push(exitOrder(sym,lg,alignPx(b.sl,sym,lg?1:-1),ps,Math.abs(p.amt)));
    }
    if(b.tp!=null&&!left&&!b.tpOid){
      tpQty=alignSz(Math.abs(p.amt),sym);
      if(tpQty>0&&tpQty>(+b.tpQty||0)*1.000001){
        const t={symbol:sym,side:lg?"SELL":"BUY",type:"LIMIT",timeInForce:TIF,
          quantity:fmtSz(tpQty,sym),price:fmtPx(alignPx(b.tp,sym,lg?1:-1),sym)};
        if(S.dual)t.positionSide=ps;else t.reduceOnly="true";
        iTp=orders.length;orders.push(t);
      }
    }
    if(b.tp!=null&&PREATTACH_TP&&!b.tpFbDone&&!hasLiveTp){
      iFb=orders.length;
      orders.push(tpFallbackOrder(sym,lg,b.tp,ps,tpQty||Math.abs(p.amt)));
    }
    const done=()=>!left&&(b.sl==null||b.slDone)&&(b.tp==null||!!b.tpOid)&&(b.tp==null||!PREATTACH_TP||!!b.tpFbDone);
    if(!orders.length){if(done()){delete PENDBR[sym];savePendBr();}return;}
    const what=[iSl>=0?"止损市价单":"",iTp>=0?"止盈挂单":"",iFb>=0?"兜底止盈挂单":""].filter(Boolean).join("/");
    
    const results=[];
    for(const ord of orders){
      const res=await placeOrder(ord,"入场已成交，自动挂"+(ord.type.includes("STOP")?"止损":"止盈"),true);
      results.push(res);
    }
    const good=x=>x&&(x.orderId!=null||x.algoId!=null)&&!(x.code!=null&&+x.code<0);
    if(iSl>=0&&good(results[iSl]))b.slDone=true;
    if(iTp>=0&&good(results[iTp])){b.tpOid=results[iTp].algoId||results[iTp].orderId;b.tpQty=tpQty;}
    if(iFb>=0&&good(results[iFb])){b.tpFbDone=true;b.tpFbOid=results[iFb].algoId||results[iFb].orderId;}
    savePendBr();
    if(done()||(iSl>=0&&b.slDone)){
      delete PENDBR[sym];savePendBr();
      log("bracket ok "+sym);toast(disp(sym)+" "+what+"已挂上");
      return;
    }
    const errs=errsOf(results);
    if(errs.some(e=>+e.code===-2021)){
      delete PENDBR[sym];savePendBr();
      toast("⚠ "+disp(sym)+" 止损价已被行情穿透，交易所拒挂，当前是裸仓，请立即手动处理！");return;}
    b.tries=(b.tries||0)+1;savePendBr();
    log("bracket FAIL "+sym+" tries="+b.tries);
    if(b.tries>=BRACKET_MAX_TRY){
      delete PENDBR[sym];savePendBr();
      toast("⚠ "+disp(sym)+" 止损补挂已失败 "+b.tries+" 次，当前是裸仓，请立即手动挂止损！");
    }else{
      toast("⚠ "+disp(sym)+" 止损补挂失败（当前裸仓），"+Math.round(BRACKET_RETRY/1000)+"s 后重试");
      setTimeout(()=>{try{firePendingBracket(sym);}catch(e){log("bracket retry err "+e);}},BRACKET_RETRY);
    }
  }catch(e){
    b.tries=(b.tries||0)+1;savePendBr();log("bracket throw "+sym+" "+e);
    toast("⚠ "+disp(sym)+" 止损补挂异常（当前裸仓），将重试");
    setTimeout(()=>{try{firePendingBracket(sym);}catch(_){}},BRACKET_RETRY);
  }finally{BRBUSY.delete(sym);}
}

/* ================= 机会清单与 TV 按钮状态 ================= */
const WKEY="bn_watch";
let WATCH=[],_wsig="",WAC=null,WGEST=false;
function wLoad(){try{WATCH=JSON.parse(localStorage.getItem(WKEY)||"[]")||[];}catch(e){WATCH=[];}
  if(!Array.isArray(WATCH))WATCH=[];}
function wSave(){try{localStorage.setItem(WKEY,JSON.stringify(WATCH));}catch(e){}}
function tfMs(tf){return TFMS[tf]||36e5;}
function wDue(tf,from){const m=tfMs(tf);return Math.ceil(((from||Date.now())+1)/m)*m;}
function wFind(sym,tf){return WATCH.findIndex(w=>w.sym===sym&&w.tf===tf);}
function wHas(sym){return WATCH.some(w=>w.sym===sym);}
function wLeft(w){return w.due-Date.now();}
function cdTxt(ms){
  if(ms<=0)return "已收盘";
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=n=>String(n).padStart(2,"0");
  return h?h+":"+p(m)+":"+p(ss):m+":"+p(ss);}
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function wPrune(){const n=Date.now(),b=WATCH.length;
  WATCH=WATCH.filter(w=>w&&w.sym&&w.tf&&n-w.due<WATCH_KEEP);
  if(WATCH.length>WATCH_MAX)WATCH=WATCH.slice(-WATCH_MAX);
  return WATCH.length!==b;}
function wAudioInit(){try{if(!WAC)WAC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function wBeep(){
  if(!WGEST)return;
  try{wAudioInit();if(WAC){if(WAC.state==="suspended")WAC.resume();
    [0,190].forEach(d=>{const o=WAC.createOscillator(),g=WAC.createGain(),t=WAC.currentTime+d/1000;
      o.type="sine";o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
      o.connect(g);g.connect(WAC.destination);o.start(t);o.stop(t+0.2);});}}catch(e){log("beep err "+e.message);}
  try{if(WGEST&&navigator.vibrate)navigator.vibrate([90,60,90]);}catch(e){}}
function wToggle(sym,tf){
  sym=sym||S.sym;tf=tf||S.tf;
  const i=wFind(sym,tf);
  if(i>=0){WATCH.splice(i,1);wSave();wSync();toast("已取消标记 "+disp(sym)+" "+tf);return false;}
  const due=wDue(tf);
  WATCH.push({sym:sym,tf:tf,at:Date.now(),px:mid(sym)||0,due:due,fired:false});
  if(WATCH.length>WATCH_MAX)WATCH=WATCH.slice(-WATCH_MAX);
  wSave();wAudioInit();wSync();
  toast("已标记 "+disp(sym)+" "+tf+" · 收盘还有 "+cdTxt(due-Date.now()));
  return true;}
function wRemove(sym,tf){const i=wFind(sym,tf);if(i>=0){WATCH.splice(i,1);wSave();_wsig="";wSync();}}
async function wJump(sym,tf){
  const tfNew=tf&&tf!==S.tf;
  if(tfNew){S.tf=tf;applyPrefUI();}
  if(sym&&sym!==S.sym){await pick(sym);}
  else if(tfNew){savePref();await kline(true);head();}
  wSync();}

function updateTvBtn(){
  const tvBtn=$("#bTv"), tvTxt=$("#tvTxt"), tabWatBtn=$("#wCntTab");
  if(!tvBtn) return;
  const posCount = Object.keys(S.pos).length;
  const dueCount = WATCH.filter(w=>wLeft(w)<=0).length;
  const watCount = WATCH.length;

  tvBtn.classList.toggle("hot", dueCount > 0 || posCount > 0);
  
  let labelParts = [];
  if(posCount > 0) labelParts.push("持仓 " + posCount);
  if(watCount > 0) labelParts.push("机会 " + watCount);
  if(!labelParts.length) labelParts.push("持仓 / 机会");

  if(tvTxt) tvTxt.textContent = labelParts.join(" · ");
  if(tabWatBtn) tabWatBtn.textContent = watCount ? "(" + watCount + ")" : "";
}

function wSync(){
  const st=$("#bStar");
  if(st){const on=wFind(S.sym,S.tf)>=0;
    st.classList.toggle("on",on);st.textContent=on?"★":"☆";
    st.title=(on?"取消标记":"标记这个机会")+"（W）：等这根 K 线收盘再下单";}
  updateTvBtn();
  const sh=$("#shTv");
  if(sh&&sh.classList.contains("on"))wList(true);
}
function wList(soft){
  const box=$("#wlist");if(!box)return;
  const rows=WATCH.slice().sort((a,b)=>a.due-b.due),sig=rows.map(w=>w.sym+w.tf).join(",");
  if(soft&&sig===_wsig&&rows.length){
    rows.forEach(w=>{const el=box.querySelector('.wi[data-c="'+w.sym+'"][data-tf="'+w.tf+'"]');if(!el)return;
      const l=wLeft(w),cd=el.querySelector(".cd"),dd=el.querySelector(".dd"),p=mid(w.sym);
      el.classList.toggle("due",l<=0);
      if(cd){cd.textContent=l<=0?"收盘了 · 可下单":cdTxt(l);cd.classList.toggle("due",l<=0);}
      if(dd&&w.px>0&&p>0){const ch=(p-w.px)/w.px*100;
        dd.textContent=(ch>=0?"+":"")+ch.toFixed(2)+"%";dd.className="dd "+(ch>=0?"up":"down");}});
    return;}
  _wsig=sig;
  if(!rows.length){box.innerHTML='<div class="none">还没有标记机会。<br>看到机会但 K 线还没收盘时，点顶栏的 ☆（或按快捷键 W）记录，'
    +"收盘会响铃提醒下单。</div>";return;}
  box.innerHTML=rows.map(w=>{const l=wLeft(w),p=mid(w.sym),ch=w.px>0&&p>0?(p-w.px)/w.px*100:0;
    return '<div class="wi'+(l<=0?" due":"")+'" data-c="'+w.sym+'" data-tf="'+w.tf+'">'
      +'<span><span class="n">'+disp(w.sym)+'</span> <span class="hold">'+w.tf+'</span>'
      +'<span class="m">标记价 '+px(w.px,w.sym)+" · "+hhmm(w.at)+"</span></span>"
      +'<span class="r"><span class="cd'+(l<=0?" due":"")+'">'+(l<=0?"收盘了 · 可下单":cdTxt(l))+"</span>"
      +'<span class="dd '+(ch>=0?"up":"down")+'">'+(ch>=0?"+":"")+ch.toFixed(2)+"%</span></span>"
      +'<button class="wx" title="移除">✕</button></div>';}).join("");}
function wTick(){
  if(wPrune()){wSave();_wsig="";}
  const now=Date.now(),ring=[];
  WATCH.forEach(w=>{if(!w.fired&&now>=w.due){w.fired=true;ring.push(w);}});
  if(ring.length){wSave();_wsig="";wBeep();
    toast(ring.map(w=>disp(w.sym)+" "+w.tf).join("、")+(ring.length>1?" 都收盘了":" 收盘了")+"，可以下单了");}
  wSync();}
wLoad();if(wPrune())wSave();wSync();
setTimeout(()=>{wTick();setInterval(wTick,1000);},2500);
function wGest(){WGEST=true;wAudioInit();}
addEventListener("pointerdown",wGest,{once:true});
addEventListener("keydown",wGest,{once:true});
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wTick();});

function pool(){
  return S.uni.map(u=>{const c=S.ctx[u.name]||{};
    return{n:u.name,d:disp(u.name),p:mid(u.name),ch:+c.chg||0,vol:+c.volUsd||0,h:!!posOf(u.name).length};})
    .filter(x=>x.h||!S.filter||x.vol>VOL_MIN)
    .sort((a,b)=>(b.h-a.h)||(b.vol-a.vol));
}
let _sig="";
function list(soft){

  pick(l[(i+n+l.length)%l.length].n);}

/* ================= 下单：按止损自动算仓 ================= */
const F={on:false,step:0,e:null,sl:null,tp:null,risk:1};
function maxLev(){return S.maxLev[S.sym]||LEV_DEF;}
function useMaxLev(){S.lev=Math.min(maxLev(),LEVWANT>0?Math.round(LEVWANT):LEV_DEF);}
function flowSide(){return (F.e!=null&&F.sl!=null)?(F.sl<F.e?"buy":"sell"):S.side;}
function startFlow(){F.on=true;F.step=1;F.e=F.sl=F.tp=null;
  $("#ohud").classList.add("on");render();toast("请在图表上点击选择【入场价】");}
function endFlow(){F.on=false;F.step=0;F.e=F.sl=F.tp=null;
  $("#ohud").classList.remove("on");syncTradeLines();}
function sizing(){
  const f=fOf(S.sym);
  const base={equity:equity(),riskPct:F.risk,entry:F.e,sl:F.sl,tp:F.tp,
    lev:S.lev,maxLev:maxLev(),step:f.step||0.001,tick:f.tick||0.01,
    minQty:f.minQty||0,maxQty:f.maxQty||0,minNotional:f.minNotional||5,
    feeRate:(MAKER_FEE+TAKER_FEE)/2,
    availableMargin:availMargin()};
  let r=TradeCore.sizing(base);
  if(r.notional>0){
    const lv=Math.min(S.lev,levFor(S.sym,r.notional));
    if(lv!==r.lev){
      const r2=TradeCore.sizing(Object.assign({},base,{lev:lv,maxLev:Math.max(lv,1)}));
      if(lv<S.lev)r2.capped=(r2.capped?r2.capped+"；":"")+"名义超出 "+S.lev+"x 档位，按 "+lv+"x 计";
      r=r2;}}
  return r;
}
function stepTx(){return F.step===1?"在图上点击选入场价":F.step===2?"在图上点击选止损价":F.step===3?"在图上点击选止盈价":"确认";}

function render(){
  if(!F.on){syncTradeLines();return;}
  S.side=flowSide();
  $("#ohT").textContent=disp(S.sym);$("#ohS").textContent=stepTx();
  [["#lE","e"],["#lS","sl"],["#lT","tp"]].forEach(([id,k],i)=>{
    const el=$(id);el.classList.toggle("cur",F.step===i+1);
    el.querySelector(".v").textContent=F[k]==null?"—":px(F[k],S.sym);});
  const r=sizing(),c=$("#ohC");
  if(r.bad)c.innerHTML="止损 = 入场价，无效";
  else if(!r.size)c.innerHTML="总资金 $"+money(equity())+" · 本单风险 $"+nf(equity()*F.risk/100,2)+"（"+F.risk+"%）";
  else{let h='<b>'+sz(r.size,S.sym)+" "+disp(S.sym)+'</b> · 名义 $'+nf(r.notional,0)+' · 保证金 $'+nf(r.margin,0)+' · '+r.lev+'x';
    h+='<div>风险 $'+nf(r.riskUsd,2)+' / 总资金 $'+money(equity())+' · 止损距 '+nf(r.dist/r.e*100,2)+'%</div>';
    if(r.rr!=null){const w=r.rr/(1+r.rr)*100;
      h+='<div>盈亏比 <b style="color:'+(r.rr>=2?"var(--up)":"var(--dim)")+'">'+r.rr.toFixed(2)+'</b>'+
        '<div class="rrbar"><div style="width:'+(100-w)+'%;background:var(--down)"></div><div style="width:'+w+'%;background:var(--up)"></div></div></div>';}
    c.innerHTML=h;}
  $("#ohR").textContent="风险 $"+money(r.riskUsd!=null?r.riskUsd:equity()*F.risk/100)+" · "+F.risk+"%";
  $("#ohSkip").textContent=F.step===3?"跳过止盈":"重新选";
  const go=$("#ohGo"),buy=S.side==="buy";
  go.className=buy?"b":"s";
  go.textContent=(buy?"确认 · 做多":"确认 · 做空")+(r.size?" "+sz(r.size,S.sym):"");
  const busy=INFLIGHT||SUBMITTING;
  go.disabled=!r.ok||!!LOCK||busy||!HASKEY;
  if(busy)go.textContent="提交中…";
  $("#ohH").textContent=busy?"提交中，请勿重复点击"
    :!HASKEY?"未配置 API Key / Secret，无法下单"
    :LOCK?("⚠ "+LOCK+"，已锁单")
    :ACCT_LOADING?"账户加载中…"
    :!hasAcct()?"未读到账户资金，暂不可下单"
    :F.e==null?"点击图表选入场价"
    :F.sl==null?"再点一次选止损价"
    :(r.reasons&&r.reasons.length)?("⚠ "+r.reasons.join("；"))
    :r.capped?("⚠ "+r.capped):"";
  syncTradeLines();
}

/* ================= 同步图表价格线 ================= */
let LL_SIG="",LL_ITEMS=[];
function llSig(){
  const a=[S.sym, F.on ? "F:" + F.e + ":" + F.sl + ":" + F.tp : ""];
  Object.entries(S.pos).forEach(([k,p])=>{if(p.sym===S.sym)a.push("P"+k+":"+p.amt+":"+p.entry);});
  (S.ords[S.sym]||[]).forEach(o=>{if(!o)return;const oi=ordInfo(o);
    a.push("O"+(o.orderId||o.algoId)+":"+(oi.price||+(o.price||0))+":"+oi.kind+":"+oi.sizeTxt);});
  const pb = PENDBR[S.sym];
  if(pb) a.push("PB:" + pb.sl + ":" + pb.tp + ":" + pb.qty);
  return a.join("|");
}

function llPlace(){
  LL_ITEMS.forEach(it=>{
    if(it.dragging) return;
    const y=p2y(it.v);
    if(y==null || y < -30 || y > window.innerHeight + 30){
      it.el.style.display="none";
      return;
    }
    it.el.style.display="block";
    it.el.style.top=y+"px";
  });
}

function liveLines(force){
  const sig=llSig();
  if(!force&&sig===LL_SIG&&LL_ITEMS.every(it=>it.el.isConnected)){llPlace();return;}
  LL_SIG=sig;LL_ITEMS=[];
  document.querySelectorAll(".dl.dyn").forEach(el=>el.remove());
  const lay=$("#dlayer");
  if(!lay) return;

  // 1. 持仓线
  Object.entries(S.pos).filter(([k,p])=>p.sym===S.sym).forEach(([k,p])=>{
    const lg=p.amt>0,d=document.createElement("div");
    d.className="dl dyn pos en";
    d.innerHTML='<span class="grip" style="cursor:default">'+(lg?"多仓 ":"空仓 ")+sz(Math.abs(p.amt),p.sym)+" @ "+px(p.entry,p.sym)+'</span><span class="xbtn" title="平仓">✕</span>';
    lay.appendChild(d);LL_ITEMS.push({el:d,v:+p.entry});
    d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
      if(confirm("挂单平仓 "+disp(p.sym)+"（"+(lg?"多仓 ":"空仓 ")+sz(Math.abs(p.amt),p.sym)+"）？"))closePos(k);
    });
  });

  // 2. 挂单线（绑定拖拽改单逻辑）
  (S.ords[S.sym]||[]).forEach(o=>{
    const oi=ordInfo(o),v=oi.price||+(o.price||0);if(!v)return;
    const d=document.createElement("div");
    d.className="dl dyn "+(oi.isEntry?"en":oi.tp?"tp":oi.trig?"sl":"en");
    d.innerHTML='<span class="grip">'+oi.kind+" "+oi.sizeTxt+" @ "+px(v,o.symbol)+'</span><span class="xbtn" title="撤单">✕</span>';
    lay.appendChild(d);
    
    const itObj = {el:d, v:v, dragging:false};
    LL_ITEMS.push(itObj);

    // 绑定挂单拖拽改价
    const grip = d.querySelector(".grip");
    if(grip){
      let startY = 0, isDragging = false, currentPrice = v;
      grip.addEventListener("pointerdown", ev => {
        if(ev.button !== 0 && ev.pointerType === "mouse") return;
        isDragging = true;
        itObj.dragging = true;
        startY = ev.clientY;
        currentPrice = v;
        grip.classList.add("dragging");
        try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
        ev.stopPropagation();
        if(ev.cancelable) ev.preventDefault();
      }, { passive: false });

      grip.addEventListener("pointermove", ev => {
        if(!isDragging) return;
        const cy = ev.clientY;
        const p = y2p(cy);
        if(p == null || !isFinite(p) || p <= 0) return;
        const aligned = alignPx(p, o.symbol);
        if(aligned > 0){
          currentPrice = aligned;
          d.style.top = cy + "px";
          grip.textContent = "改价 → " + oi.kind + " @" + px(aligned, o.symbol);
        }
        ev.stopPropagation();
        if(ev.cancelable) ev.preventDefault();
      }, { passive: false });

      const onUp = ev => {
        if(!isDragging) return;
        isDragging = false;
        itObj.dragging = false;
        grip.classList.remove("dragging");
        try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
        ev.stopPropagation();
        if(ev.cancelable) ev.preventDefault();

        if(currentPrice > 0 && Math.abs(currentPrice - v) > 1e-8){
          modifyOrderPrice(o, currentPrice);
        } else {
          liveLines(true);
        }
      };

      grip.addEventListener("pointerup", onUp, { passive: false });
      grip.addEventListener("pointercancel", onUp, { passive: false });

    }

    d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();

    });

  // 3. 待成交挂单 (PENDBR)
  const pb = PENDBR[S.sym];

      const itObj = {el:d, v:+pb.sl, dragging:false};

      const grip = d.querySelector(".grip");

          try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
        }, { passive: false });
        grip.addEventListener("pointermove", ev => {
          if(!isDragging) return;

          if(p > 0){
            curP = alignPx(p, S.sym);

          }
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
        }, { passive: false });
        const onUp = ev => {
          if(!isDragging) return;
          isDragging = false; itObj.dragging = false; grip.classList.remove("dragging");
          try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
          if(curP > 0){
            pb.sl = curP; savePendBr(); syncTradeLines();
            toast("已修改待挂止损价格至 " + px(curP, S.sym));

        grip.addEventListener("pointerup", onUp, { passive: false });
        grip.addEventListener("pointercancel", onUp, { passive: false });
        grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
      }

      d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
        pb.sl=null;savePendBr();syncTradeLines();toast("已取消待挂止损");

    }
    const hasLiveTp = (S.ords[S.sym]||[]).some(o=>ordInfo(o).tp);
    if(pb.tp != null && !hasLiveTp){
      const d=document.createElement("div");
      d.className="dl dyn tp";
      d.innerHTML='<span class="grip">待挂止盈 @ '+px(pb.tp,S.sym)+'</span><span class="xbtn" title="取消待挂止盈">✕</span>';

          try{ grip.setPointerCapture(ev.pointerId); }catch(e){}

        }, { passive: false });
        grip.addEventListener("pointermove", ev => {
          if(!isDragging) return;

        pb.tp=null;savePendBr();syncTradeLines();toast("已取消待挂止盈");

  }

  llPlace();
}

function syncTradeLines(){
  if(!candleSeries) return;
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const blueColor = isDark ? "#8CAECF" : "#3C5A78";
  const upColor = isDark ? "#6CA88D" : "#3A755D";
  const downColor = isDark ? "#C27A68" : "#A85244";

  if(tradeLines.entry){ candleSeries.removePriceLine(tradeLines.entry); tradeLines.entry = null; }
  if(tradeLines.sl){ candleSeries.removePriceLine(tradeLines.sl); tradeLines.sl = null; }
  if(tradeLines.tp){ candleSeries.removePriceLine(tradeLines.tp); tradeLines.tp = null; }

  // 绘制新选点线及即时盈亏比
  if(F.on){
    let dist = (F.e != null && F.sl != null) ? Math.abs(F.e - F.sl) : 0;
    let slPct = (F.e != null && F.sl != null && F.e > 0) ? (dist / F.e * 100) : 0;
    let rr = (dist > 0 && F.tp != null && F.e != null) ? (Math.abs(F.tp - F.e) / dist) : null;

    if(F.e != null){
      tradeLines.entry = candleSeries.createPriceLine({
        price: F.e, color: blueColor, lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: "入场 " + px(F.e, S.sym)
      });
    }
    if(F.sl != null){
      const slTxt = "止损 " + px(F.sl, S.sym) + (slPct > 0 ? " (-" + slPct.toFixed(2) + "%)" : "");
      tradeLines.sl = candleSeries.createPriceLine({
        price: F.sl, color: downColor, lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: slTxt
      });
    }
    if(F.tp != null){
      const tpTxt = "止盈 " + px(F.tp, S.sym) + (rr != null ? " (1:" + rr.toFixed(2) + ")" : "");
      tradeLines.tp = candleSeries.createPriceLine({
        price: F.tp, color: upColor, lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: tpTxt
      });
    }
  }

  tradeLines.pos.forEach(l => candleSeries.removePriceLine(l));
  tradeLines.pos = [];
  tradeLines.ords.forEach(l => candleSeries.removePriceLine(l));
  tradeLines.ords = [];

  const pp = curPos();
  if(pp && +pp.entry > 0){
    const lg = pp.amt > 0;
    const posLine = candleSeries.createPriceLine({
      price: +pp.entry,
      color: blueColor,
      lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: false,
      title: "持仓 " + (lg ? "多 " : "空 ") + sz(Math.abs(pp.amt), pp.sym) + " @" + px(pp.entry, pp.sym)
    });
    tradeLines.pos.push(posLine);
  }

  (S.ords[S.sym] || []).forEach(o => {
    const oi = ordInfo(o);
    const v = oi.price || +(o.price || 0);
    if(!(v > 0)) return;
    const c = oi.isEntry ? blueColor : (oi.tp ? upColor : (oi.trig ? downColor : blueColor));
    const ordLine = candleSeries.createPriceLine({
      price: v,
      color: c,
      lineWidth: 1.5,
      lineStyle: LightweightCharts.LineStyle.Dotted,
      axisLabelVisible: false,
      title: oi.kind + " " + oi.sizeTxt + " @" + px(v, o.symbol)
    });
    tradeLines.ords.push(ordLine);
  });

  const pb = PENDBR[S.sym];
  if(pb){
    const hasLiveSl = (S.ords[S.sym]||[]).some(o=>ordInfo(o).sl);
    if(pb.sl != null && !hasLiveSl){
      const slLine = candleSeries.createPriceLine({
        price: pb.sl,
        color: downColor,
        lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: false,
        title: "待挂止损 @" + px(pb.sl, S.sym)
      });
      tradeLines.ords.push(slLine);
    }
    const hasLiveTp = (S.ords[S.sym]||[]).some(o=>ordInfo(o).tp);
    if(pb.tp != null && !hasLiveTp){
      const tpLine = candleSeries.createPriceLine({
        price: pb.tp,
        color: upColor,
        lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: false,
        title: "待挂止盈 @" + px(pb.tp, S.sym)
      });
      tradeLines.ords.push(tpLine);
    }
  }

  syncHandles();
  liveLines(true);
}

function syncHandles(){
  let dist = (F.e != null && F.sl != null) ? Math.abs(F.e - F.sl) : 0;
  let slPct = (F.e != null && F.sl != null && F.e > 0) ? (dist / F.e * 100) : 0;
  let rr = (dist > 0 && F.tp != null && F.e != null) ? (Math.abs(F.tp - F.e) / dist) : null;

  [["e","#hEn","入场",""],
   ["sl","#hSl","止损", slPct > 0 ? " (-" + slPct.toFixed(2) + "%)" : ""],
   ["tp","#hTp","止盈", rr != null ? " · R:R 1:" + rr.toFixed(2) : ""]
  ].forEach(([k,hd,lb,extra])=>{
    const el=$(hd);
    if(!el) return;
    const v=F.on?F[k]:null;
    const y=p2y(v);
    if(v==null || y==null || y < -30 || y > window.innerHeight + 30){
      el.style.display="none";
      return;
    }
    el.style.display="block";
    el.style.top=y+"px";
    const grip=el.querySelector(".grip");
    if(grip && !grip.classList.contains("dragging"))grip.textContent=lb+" "+px(v,S.sym)+extra;
  });
}

let lastCommitTime=0;
function pickPrice(p){
  if(!p || !isFinite(p) || p <= 0) return;
  const nowT = Date.now();
  if(nowT - lastCommitTime < 300) return;
  lastCommitTime = nowT;

  if(!F.on){
    F.on=true;F.step=1;F.e=F.sl=F.tp=null;
    $("#ohud").classList.add("on");
  }
  if(F.step<=1){
    F.e=p;F.step=2;
    toast("【入场已定】"+px(p,S.sym)+" · 请再次长按选【止损价】");
  }else if(F.step===2){
    F.sl=p;F.step=3;
    const dPct = (F.e != null && F.e > 0) ? (Math.abs(p - F.e) / F.e * 100).toFixed(2) : "";
    toast("【止损已定】"+px(p,S.sym)+" (-"+dPct+"%) · 再次长按选【止盈】或点【跳过】");
  }else if(F.step===3){
    F.tp=p;F.step=4;
    const dist = (F.e != null && F.sl != null) ? Math.abs(F.e - F.sl) : 0;
    const rr = dist > 0 ? (Math.abs(p - F.e) / dist).toFixed(2) : "";
    toast("【止盈已定】"+px(p,S.sym)+" (盈亏比 1:"+rr+") · 请在面板核对并点击【确认】");
  }else{
    const d=[["e",F.e],["sl",F.sl],["tp",F.tp]].filter(x=>x[1]!=null)
      .sort((a,b)=>Math.abs(a[1]-p)-Math.abs(b[1]-p))[0];
    if(d)F[d[0]]=p;
  }
  render();
}

/* ================= 瞄准选价 / 拖拽把手 / 右键选点 / 左右 20% 点击切币 ================= */
function y2p(y){
  if(!candleSeries) return null;
  return candleSeries.coordinateToPrice(y);
}
function p2y(p){
  if(!candleSeries || p==null) return null;
  return candleSeries.priceToCoordinate(p);
}

let aim=false, aimPrice=null, pT=null, pX=0, pY=0, pKill=false, pMulti=false;
let touchStartX=0, touchStartY=0, touchStartTime=0;

function guide(clientY){
  if(!aim){hideGuide();return null;}
  const p=y2p(clientY),l=$("#pline");
  if(p==null||!isFinite(p)||p<=0){l.style.display="none";aimPrice=null;return null;}
  aimPrice=p;
  let lb=!F.on||F.step<=1?"入场":F.step===2?"止损":F.step===3?"止盈":"调整";
  let extra="";
  if(F.on){
    if(F.step===2 && F.e!=null && F.e>0){
      const dPct=Math.abs(p - F.e)/F.e*100;
      extra = " (-" + dPct.toFixed(2) + "%)";
    }else if(F.step===3 && F.e!=null && F.sl!=null){
      const dist = Math.abs(F.e - F.sl);
      if(dist > 0){
        const rr = Math.abs(p - F.e) / dist;
        extra = " · R:R 1:" + rr.toFixed(2);
      }
    }
  }
  l.style.display="block";l.style.top=clientY+"px";
  $("#pbub").textContent=lb+" "+px(p,S.sym)+extra;
  return p;
}
function hideGuide(){$("#pline").style.display="none";aimPrice=null;}
function enterAim(){
  if(pKill||pMulti)return;
  aim=true;
  $("#pline").classList.add("aim");
  guide(pY);
  navigator.vibrate?.(15);
}
function resetPress(){
  clearTimeout(pT);pT=null;aim=false;pKill=false;pMulti=false;
  hideGuide();$("#pline").classList.remove("aim");
}

function onChart(t){
  if(!t||!t.closest)return false;
  if(t.closest(".grip")||t.closest(".xbtn")||t.closest(".sheet")||t.closest("#ohud")||t.closest("#khud")||t.closest("#tl")||t.closest("#br"))return false;
  if(t.closest("#tv_chart")||t.closest(".edge-zone"))return true;
  return t===document.body||t===document.documentElement;
}

const AIM_MS=240,H_TOL=12;

function bindGrip(hd,key){
  const grip=$(hd)?.querySelector(".grip");if(!grip)return;
  let isDragging=false;

  const onPointerDown = ev => {
    if(ev.button !== 0 && ev.pointerType === "mouse") return;
    isDragging = true;
    grip.classList.add("dragging");
    try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
  };

  const onPointerMove = ev => {
    if(!isDragging) return;
    const cy = ev.clientY;
    const p = y2p(cy);
    if(p == null || !isFinite(p) || p <= 0) return;
    const aligned = alignPx(p, S.sym);
    if(aligned > 0 && F[key] !== aligned){
      F[key] = aligned;
      render();
    }
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
  };

  const onPointerUp = ev => {
    if(!isDragging) return;
    isDragging = false;
    grip.classList.remove("dragging");
    try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
    render();
  };

  grip.addEventListener("pointerdown", onPointerDown, { passive: false });
  grip.addEventListener("pointermove", onPointerMove, { passive: false });
  grip.addEventListener("pointerup", onPointerUp, { passive: false });
  grip.addEventListener("pointercancel", onPointerUp, { passive: false });
  grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
}
bindGrip("#hEn","e");bindGrip("#hSl","sl");bindGrip("#hTp","tp");

// 鼠标长按与左右切币
addEventListener("mousedown",e=>{
  if(e.button!==0||!onChart(e.target))return;
  aim=false;aimPrice=null;pKill=false;pMulti=false;
  pX=e.clientX;pY=e.clientY;
  touchStartX=e.clientX;touchStartY=e.clientY;touchStartTime=Date.now();
  clearTimeout(pT);
  pT=setTimeout(enterAim,AIM_MS);
});
addEventListener("mousemove",e=>{
  if(!pT&&!aim)return;
  if(aim){guide(e.clientY);return;}
  const dx=Math.abs(e.clientX-pX),dy=Math.abs(e.clientY-pY);
  if(dx>H_TOL||dy>H_TOL){
    pKill=true;clearTimeout(pT);pT=null;hideGuide();
  }
});
addEventListener("mouseup",e=>{
  const wasAim = aim && !pKill && onChart(e.target);
  const p = aimPrice || y2p(e.clientY);
  const dt = Date.now() - touchStartTime;
  const dx = Math.abs(e.clientX - touchStartX);
  const dy = Math.abs(e.clientY - touchStartY);
  resetPress();

  if(wasAim && p != null && isFinite(p) && p > 0){
    pickPrice(p);
    return;
  }

  // 点击屏幕左右 20% 区域快速切币（无明显拖拽且非长按）
  if(!F.on && onChart(e.target) && dt < 280 && dx < 10 && dy < 10){
    if(document.querySelector(".sheet.on")) return;
    const w = window.innerWidth;
    if(e.clientX < w * 0.20){
      step(-1);
    }else if(e.clientX > w * 0.80){
      step(1);
    }
  }
});
addEventListener("contextmenu",e=>{
  if(!onChart(e.target))return;
  const p=y2p(e.clientY);
  if(p==null||!isFinite(p)||p<=0)return;
  e.preventDefault();
  pickPrice(p);
});

// 触屏长按与左右 20% 切币（优化多指触控防整页缩放）
addEventListener("touchstart",e=>{
  if(!onChart(e.target))return;
  pMulti=e.touches.length>1;pKill=pMulti;aim=false;aimPrice=null;
  const t=e.touches[0];if(!t)return;
  pX=t.clientX;pY=t.clientY;
  touchStartX=t.clientX;touchStartY=t.clientY;touchStartTime=Date.now();
  clearTimeout(pT);
  if(!pMulti)pT=setTimeout(enterAim,AIM_MS);
},{passive:false});

addEventListener("touchmove",e=>{
  if(e.touches.length>1){
    pMulti=pKill=true;clearTimeout(pT);aim=false;hideGuide();
    if(e.cancelable) e.preventDefault();
    return;
  }
  if(!pT&&!aim)return;
  const t=e.touches[0];if(!t)return;
  if(aim){
    guide(t.clientY);
    if(e.cancelable)e.preventDefault();
    return;
  }
  const dx=Math.abs(t.clientX-pX),dy=Math.abs(t.clientY-pY);
  if(dx>H_TOL||dy>H_TOL){
    pKill=true;clearTimeout(pT);hideGuide();
  }
},{passive:false});

addEventListener("touchend",e=>{
  clearTimeout(pT);
  const wasAim = aim && !pKill && !pMulti;
  const p = aimPrice;
  const dt = Date.now() - touchStartTime;
  const t = e.changedTouches?.[0];
  const dx = t ? Math.abs(t.clientX - touchStartX) : 0;
  const dy = t ? Math.abs(t.clientY - touchStartY) : 0;
  const cx = t ? t.clientX : touchStartX;

  resetPress();

  if(wasAim && p != null && isFinite(p) && p > 0){
    if(e.cancelable) e.preventDefault();
    pickPrice(p);
    return;
  }

  // 触屏点击左右 20% 区域切币
  if(!F.on && onChart(e.target) && dt < 280 && dx < 12 && dy < 12 && !pMulti){
    if(document.querySelector(".sheet.on")) return;
    const w = window.innerWidth;
    if(cx < w * 0.20){
      if(e.cancelable) e.preventDefault();
      step(-1);
    }else if(cx > w * 0.80){
      if(e.cancelable) e.preventDefault();
      step(1);
    }
  }
},{passive:false});
addEventListener("touchcancel",()=>{resetPress();});

/* ================= 行情健康检查 ================= */
function setLock(why){
  if(LOCK===why)return;
  const was=LOCK;LOCK=why;const b=$("#lockbar");
  if(b){b.textContent=why?"⚠ "+why+" · 交易已锁定":"";b.classList.toggle("on",!!why);}
  document.body.classList.toggle("locked",!!why);
  try{render();}catch(e){}
  if(why&&!was)try{onLocked();}catch(e){log("onLocked err "+e.message);}
}

async function onLocked(){
  if(!NET.mid&&!LOCK_CANCEL_COLDSTART){log("cold start lock, skip cancel");return;}
  const kill=[];
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    (arr||[]).filter(Boolean).forEach(o=>{if(!ordInfo(o).ro)kill.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo});});});
  if(!kill.length)return;
  if(!LOCK_CANCEL_ENTRY){toast("⚠ 行情已锁定，交易所还挂着 "+kill.length+" 张未成交入场单（保留不撤）");return;}
  toast("行情异常，正在撤掉 "+kill.length+" 张未成交入场单");
  for(const k of kill){
    try{await cancelOrder(k.sym,k.oid,k.isAlgo);log("lock-cancel "+k.sym);}
    catch(e){log("lock-cancel err "+e.message);}}
  load(true);
}

function lockCheck(){
  const t=Date.now(),ivl={"5m":3e5,"30m":18e5,"1h":36e5}[S.tf]||36e5;
  const age=NET.mid?t-NET.mid:Infinity;
  let why="";
  if(!S.uni.length)why="行情未加载";
  else if(t-T0>30000&&age>120000)
    why=NET.mid?"实时价中断超过 2 分钟":"实时价未接通";
  else if(NET.fail>=8)why="行情接口连续失败";
  else if(NET.info&&t-NET.info>120000)why="行情接口超过 2 分钟无响应";
  else if(!NET.info)why="行情尚未加载";
  else if(S.k.length&&t-S.k[S.k.length-1].t>ivl*4)why="K 线停更";
  setLock(why);
}

/* ================= TRADE 纯函数内核 ================= */
const TradeCore={
  dec(v){const n=+v;if(!isFinite(n)||n<=0)return 8;
    const s=n.toFixed(12).replace(/0+$/,""),i=s.indexOf(".");return i<0?0:Math.max(0,s.length-i-1);},
  alignSz(s,step){const st=+step>0?+step:1e-8,d=this.dec(st);
    return +(Math.floor((+s)/st+1e-9)*st).toFixed(d);},
  alignPx(p,tick,dir){const n=+p;if(!isFinite(n)||n<=0)return 0;
    const tk=+tick>0?+tick:0.01,d=this.dec(tk);
    const r=dir?(dir<0?Math.floor(n/tk+1e-9):Math.ceil(n/tk-1e-9)):Math.round(n/tk);
    if(!(r>0))return 0;return +(r*tk).toFixed(d);},
  sizing(i){
    const r={e:i.entry,sl:i.sl,tp:i.tp,risk:i.riskPct,reasons:[],ok:false};
    const lev=Math.max(1,Math.min(+i.lev||1,+i.maxLev||+i.lev||1));r.lev=lev;
    if(!(+i.equity>0))r.reasons.push("未加载账户资金");
    if(r.e==null||r.sl==null){r.reasons.push("入场或止损未选");return r;}
    const dist=Math.abs(r.e-r.sl);
    if(!dist||!isFinite(dist)){r.bad=true;r.reasons.push("止损 = 入场价，无效");return r;}
    r.dist=dist;
    const feeRt=(+i.feeRate||0)*2;
    const perUnit=dist+r.e*feeRt;
    const budget=(+i.equity||0)*(+i.riskPct||0)/100;
    r.budget=budget;
    let size=this.alignSz(perUnit>0?budget/perUnit:0,i.step);
    if(!(size>0)){r.size=0;r.reasons.push("数量小于最小下单精度（stepSize="+(i.step||0)+"）");return r;}
    const avail=i.availableMargin!=null?+i.availableMargin:+i.equity||0;
    let notional=size*r.e,margin=notional/lev;
    if(margin+notional*feeRt>avail){
      const maxSize=this.alignSz(avail*lev/(r.e*(1+lev*feeRt)),i.step);
      if(maxSize>0&&maxSize<size){size=maxSize;notional=size*r.e;margin=notional/lev;
        r.capped="可用保证金不足，已按可用保证金缩仓";}
      else if(!(maxSize>0)){r.size=0;r.reasons.push("可用保证金不足");return r;}
    }
    if(+i.maxQty>0&&size>+i.maxQty){
      size=this.alignSz(+i.maxQty,i.step);notional=size*r.e;margin=notional/lev;
      r.capped=(r.capped?r.capped+"；":"")+"已按品种单笔上限缩仓";}
    if(+i.minQty>0&&size<+i.minQty)r.reasons.push("数量 "+size+" 低于最小下单量 "+i.minQty);
    const minN=+i.minNotional||0;
    if(notional<minN)r.reasons.push("名义价值 "+notional.toFixed(2)+" 低于最小 "+minN);
    r.size=size;r.notional=notional;r.margin=margin;
    r.fee=notional*feeRt;
    r.riskUsd=size*dist+r.fee;
    if(i.tp!=null){const long=r.sl<r.e,good=long?(+i.tp>r.e):(+i.tp<r.e);
      if(!good)r.reasons.push("止盈方向错误（应在入场价的盈利一侧）");}
    r.rr=i.tp!=null?Math.abs(i.tp-r.e)/dist:null;
    r.ok=r.reasons.length===0&&size>0;
    return r;
  }
};
function alignSz(s,sym){return TradeCore.alignSz(s,fOf(sym).step||0.001);}
function alignPx(p,sym,dir){return TradeCore.alignPx(p,fOf(sym).tick||0.01,dir);}

/* ================= 确认下单流程 ================= */
$("#ohGo").addEventListener("click",async()=>{
  if(SUBMITTING||INFLIGHT){toast("正在提交，请稍候");return;}
  if(!HASKEY){toast("未配置 API Key / Secret，无法下单");return;}
  if(ACCT_LOADING){toast("账户加载中，请稍候再试");return;}
  if(!hasAcct()){toast("未读到账户资金，无法下单");return;}
  const r=sizing();
  if(!r.ok){toast((r.reasons&&r.reasons[0])||"入场或止损无效");return;}
  const sym=S.sym,qty=fmtSz(alignSz(r.size,sym),sym);
  if(!(+qty>0)){toast("数量小于最小下单精度（stepSize="+(fOf(sym).step||0)+"）");return;}
  const buy=S.side==="buy",m=mid(sym);
  if(!isFinite(m)||m<=0){toast("无法获取市价，已阻止下单");return;}
  const side=buy?"BUY":"SELL",ps=buy?"LONG":"SHORT";
  const stopEntry=buy?(m<r.e):(m>r.e);
  const ePx=fmtPx(alignPx(r.e,sym,buy?-1:1),sym);
  const entry=stopEntry
    ?{symbol:sym,side,type:"STOP",stopPrice:ePx,price:ePx,timeInForce:TIF,quantity:qty,
      workingType:WORK,priceProtect:"true"}
    :{symbol:sym,side,type:"LIMIT",timeInForce:TIF,quantity:qty,price:ePx};
  if(S.dual)entry.positionSide=ps;
  if(LOCK){toast("行情异常，交易已锁定："+LOCK);return;}
  SUBMITTING=true;try{render();}catch(e){}
  try{
    if(!await ensureLev(r.lev)){toast("杠杆设置未确认成功，已阻止下单");return;}
    const slOrd=exitOrder(sym,buy,alignPx(r.sl,sym,buy?1:-1),ps,qty);
    const tpOrd=(r.tp!=null)?tpPostOnlyOrder(sym,buy,r.tp,ps,qty):null;
    const label=(stopEntry?(buy?"突破挂多 ":"突破挂空 "):(buy?"挂单做多 ":"挂单做空 "))+qty+" "+disp(sym);
    
    const good=x=>x&&(x.orderId!=null||x.algoId!=null)&&!(x.code!=null&&+x.code<0);
    const oidOf=x=>x?(x.algoId!=null?x.algoId:x.orderId):null;

    let eRes=null,slRes=null,tpRes=null;
    
    // 1. 提交入场只挂单（LIMIT GTX）
    eRes=await placeOrder(entry,label);
    
    if(!good(eRes)&&!stopEntry){
      const code=eRes&&eRes.code!=null?+eRes.code:(LAST_ERR&&LAST_ERR.code!=null?+LAST_ERR.code:0);
      if(code===-5022){
        const tk=(fOf(sym).tick||0)*NUDGE_TICKS;
        if(tk>0){
          const np=alignPx(buy?(+entry.price-tk):(+entry.price+tk),sym,buy?-1:1);
          entry.price=fmtPx(np,sym);
          if(entry.stopPrice)entry.stopPrice=entry.price;
          toast("只挂单会立刻成交，已把价格挪到 "+px(np,sym)+" 重试");
          eRes=await placeOrder(entry,label);
        }
      }
    }
    
    const eOk=good(eRes);
    if(eOk){
      // 2. 瞬间在币安后台立刻挂上市价止损单
      slRes=await placeOrder(slOrd,"预挂止损(市价)",true).catch(()=>null);
      // 3. 瞬间在币安后台立刻挂上限价只挂单止盈单
      if(tpOrd){
        tpRes=await placeOrder(tpOrd,"预挂止盈(只挂单)",true).catch(()=>null);
      }
    }else{
      toast("⚠ 入场单提交失败："+errText(LAST_ERR||eRes));
      return;
    }
    
    const slOk=good(slRes),tpOk=tpOrd?good(tpRes):true;
    if(slOk && tpOk){
      toast("【3单已全部挂入币安】入场(只挂单) + 止损(市价) " + (tpOrd ? "+ 止盈(只挂单)" : ""));
    } else {
      if(!slOk) toast("⚠ 止损单未能立刻挂入，成交后会自动补挂");
      if(!tpOk) toast("⚠ 止盈单未能立刻挂入，成交后会自动补挂");
    }

    PENDBR[sym]={side,sl:r.sl,tp:r.tp,qty:+qty,slDone:slOk,ts:Date.now(),
      tpFbDone:tpOk,tpFbOid:oidOf(tpRes),
      oid:oidOf(eRes)};
    savePendBr();endFlow();
  }finally{SUBMITTING=false;try{render();}catch(e){}load(true);}
});
