<!-- 内置 TradeCore 纯函数内核（支持纯单 HTML 独立运行，零外部依赖） -->
<script>
(function(root, factory) {
  if (typeof define === 'function' && define.amd) {
    define([], factory);
  } else if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.TradeCore = factory();
  }
}(typeof self !== 'undefined' ? self : this, function() {
  "use strict";

  const TradeCore = {
    dec(v) {
      const n = +v;
      if (!isFinite(n) || n <= 0) return 8;
      const s = n.toFixed(12).replace(/0+$/, "");
      const i = s.indexOf(".");
      return i < 0 ? 0 : Math.max(0, s.length - i - 1);
    },

    alignSz(s, step) {
      const st = +step > 0 ? +step : 1e-8;
      const d = this.dec(st);
      return +(Math.floor((+s) / st + 1e-9) * st).toFixed(d);
    },

    alignPx(p, tick, dir) {
      const n = +p;
      if (!isFinite(n) || n <= 0) return 0;
      const tk = +tick > 0 ? +tick : 0.01;
      const d = this.dec(tk);
      const r = dir ? (dir < 0 ? Math.floor(n / tk + 1e-9) : Math.ceil(n / tk - 1e-9)) : Math.round(n / tk);
      if (!(r > 0)) return 0;
      return +(r * tk).toFixed(d);
    },

    estLiqPrice(entry, lev, isLong, mmr = 0.004) {
      const e = +entry;
      const l = Math.max(1, +lev);
      if (!(e > 0)) return 0;
      if (isLong) {
        return Math.max(0, e * (1 - 1 / l + mmr));
      } else {
        return e * (1 + 1 / l - mmr);
      }
    },

    checkLiqSafety(entry, sl, lev, isLong, minRatio = 1.5, mmr = 0.004) {
      const e = +entry, s = +sl, l = Math.max(1, +lev);
      if (!(e > 0) || !(s > 0)) return { safe: false, reason: "价格无效" };
      const slDist = Math.abs(e - s);
      if (slDist <= 0) return { safe: false, reason: "止损价不能等于入场价" };
      
      const liq = this.estLiqPrice(e, l, isLong, mmr);
      const liqDist = Math.abs(liq - e);

      if (isLong && s <= liq) {
        return { safe: false, safeRatio: 0, liq, liqDist, slDist, reason: "止损价 (" + s + ") 低于或等于强平价 (" + liq.toFixed(4) + ")，会先爆仓后止损！" };
      }
      if (!isLong && s >= liq) {
        return { safe: false, safeRatio: 0, liq, liqDist, slDist, reason: "止损价 (" + s + ") 高于或等于强平价 (" + liq.toFixed(4) + ")，会先爆仓后止损！" };
      }

      const ratio = liqDist / slDist;
      if (ratio < minRatio) {
        return {
          safe: false,
          safeRatio: ratio,
          liq,
          liqDist,
          slDist,
          reason: "强平距离 (" + liqDist.toFixed(4) + ") 不足止损距离 (" + slDist.toFixed(4) + ") 的 " + minRatio + " 倍（当前 " + ratio.toFixed(2) + "x），存在插针爆仓风险！"
        };
      }
      return { safe: true, safeRatio: ratio, liq, liqDist, slDist };
    },

    maxSafeLev(entry, sl, isLong, minRatio = 1.5, mmr = 0.004, hardCap = 125) {
      const e = +entry, s = +sl;
      const slDist = Math.abs(e - s);
      if (!(e > 0) || slDist <= 0) return Math.min(20, hardCap);
      const denominator = (minRatio * slDist / e) + mmr;
      if (denominator <= 0) return hardCap;
      const maxL = Math.floor(1 / denominator);
      return Math.max(1, Math.min(maxL, hardCap));
    },

    riskBudgetSl(entry, qty, equity, riskPct = 1.0, isLong = true) {
      const e = +entry, q = Math.abs(+qty), eq = +equity;
      if (!(e > 0) || !(q > 0) || !(eq > 0)) return null;
      const budget = eq * (riskPct / 100);
      const deltaP = budget / q;
      if (isLong) {
        const sl = e - deltaP;
        return sl > 0 ? sl : e * 0.985;
      } else {
        return e + deltaP;
      }
    },

    sizing(i) {
      const r = { e: i.entry, sl: i.sl, tp: i.tp, risk: i.riskPct, reasons: [], ok: false };
      const isLong = i.sl != null && i.entry != null ? (+i.sl < +i.entry) : true;

      let lev = Math.max(1, Math.min(+i.lev || 1, +i.maxLev || +i.lev || 1));
      if (!i.equity || !(+i.equity > 0)) r.reasons.push("未加载账户资金");
      if (r.e == null || r.sl == null) {
        r.reasons.push("入场或止损未选");
        r.lev = lev;
        return r;
      }

      const alignedE = this.alignPx(r.e, i.tick, isLong ? -1 : 1);
      const alignedSl = this.alignPx(r.sl, i.tick, isLong ? 1 : -1);
      r.e = alignedE;
      r.sl = alignedSl;

      const dist = Math.abs(r.e - r.sl);
      if (!dist || !isFinite(dist) || dist <= 0) {
        r.bad = true;
        r.reasons.push("止损 = 入场价，无效");
        r.lev = lev;
        return r;
      }
      r.dist = dist;

      const liqCheck = this.checkLiqSafety(r.e, r.sl, lev, isLong, 1.5);
      if (!liqCheck.safe) {
        const safeLev = this.maxSafeLev(r.e, r.sl, isLong, 1.5, 0.004, +i.maxLev || 125);
        if (safeLev < lev) {
          lev = safeLev;
          r.capped = (r.capped ? r.capped + "；" : "") + "止损较远，为防爆仓已自动降杠杆至 " + lev + "x";
        } else {
          r.reasons.push(liqCheck.reason);
        }
      }
      r.lev = lev;
      r.liq = this.estLiqPrice(r.e, lev, isLong);

      const feeRt = (+i.feeRate || 0) * 2;
      const perUnit = dist + r.e * feeRt;
      const budget = (+i.equity || 0) * (+i.riskPct || 0) / 100;
      r.budget = budget;
      let size = this.alignSz(perUnit > 0 ? budget / perUnit : 0, i.step);
      if (!(size > 0)) {
        r.size = 0;
        r.reasons.push("数量小于最小下单精度（stepSize=" + (i.step || 0) + "）");
        return r;
      }

      const avail = i.availableMargin != null ? +i.availableMargin : +i.equity || 0;
      let notional = size * r.e;
      let margin = notional / lev;
      if (margin + notional * feeRt > avail) {
        const maxSize = this.alignSz(avail * lev / (r.e * (1 + lev * feeRt)), i.step);
        if (maxSize > 0 && maxSize < size) {
          size = maxSize;
          notional = size * r.e;
          margin = notional / lev;
          r.capped = (r.capped ? r.capped + "；" : "") + "可用保证金不足，已按可用保证金缩仓";
        } else if (!(maxSize > 0)) {
          r.size = 0;
          r.reasons.push("可用保证金不足");
          return r;
        }
      }

      if (+i.maxQty > 0 && size > +i.maxQty) {
        size = this.alignSz(+i.maxQty, i.step);
        notional = size * r.e;
        margin = notional / lev;
        r.capped = (r.capped ? r.capped + "；" : "") + "已按品种单笔上限缩仓";
      }
      if (+i.minQty > 0 && size < +i.minQty) {
        r.reasons.push("数量 " + size + " 低于最小下单量 " + i.minQty);
      }
      const minN = +i.minNotional || 0;
      if (notional < minN) {
        r.reasons.push("名义价值 " + notional.toFixed(2) + " 低于最小 " + minN);
      }

      r.size = size;
      r.notional = notional;
      r.margin = margin;
      r.fee = notional * feeRt;
      r.riskUsd = size * dist + r.fee;

      if (i.tp != null) {
        const alignedTp = this.alignPx(i.tp, i.tick, isLong ? 1 : -1);
        r.tp = alignedTp;
        const good = isLong ? (alignedTp > r.e) : (alignedTp < r.e);
        if (!good) {
          r.reasons.push("止盈方向错误（应在入场价的盈利一侧）");
        } else {
          r.rr = Math.abs(alignedTp - r.e) / dist;
          r.profitUsd = Math.max(0, (size * Math.abs(alignedTp - r.e)) - r.fee);
        }
      }

      r.ok = r.reasons.length === 0 && size > 0;
      return r;
    }
  };

  return TradeCore;
}));
</script>

#tv_chart a, #tv-attr-logo, .tv-attr-logo, a[href*="tradingview"] {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

/* 极致护眼配色（iPad/高亮显示屏、长时间盯盘）：
   1) 日间：温润暖羊皮纸底色 #F4F1EA，消灭 255 纯白刺眼蓝光；
   2) 夜间：深邃温润暖灰底色 #171614，消灭纯黑与高亮文字的刺眼眩光；
   3) K 线与指标：选用低饱和松石绿与陶土暖红，柔和不刺眼，久看眼睛不酸胀；
   4) 字体：中性炭黑与暖象牙白，维持 10:1 舒适阅读对比度。 */
:root{--bg:#F4F1EA;--surface:#FAF8F3;--raised:#EAE5DC;--text:#332F28;--dim:rgba(51,47,40,.68);
  --faint:rgba(51,47,40,.45);--line:rgba(51,47,40,.12);
  --up:#3A755D;--down:#A85244;--blue:#3C5A78;--amber:#8B6A2B;
  --ink:#332F28;--onink:#FAF8F3;--cline:rgba(51,47,40,.50);--cbody:#332F28;
  --pop:rgba(250,248,243,.96);--fabbg:rgba(250,248,243,.92);
  --tint:rgba(51,47,40,.06);--cgrid:rgba(51,47,40,.04);--caim:rgba(51,47,40,.75);--chair:rgba(51,47,40,.28);
  color-scheme:light;--mono:"Menlo","Consolas",monospace}
html[data-theme="dark"]{--bg:#171614;--surface:#1F1D1A;--raised:#2C2925;--text:#DDD7CB;
  --dim:rgba(221,215,203,.68);--faint:rgba(221,215,203,.45);--line:rgba(221,215,203,.12);
  --up:#6CA88D;--down:#C27A68;--blue:#8CAECF;--amber:#D8B368;
  --ink:#DDD7CB;--onink:#171614;--cline:rgba(221,215,203,.48);--cbody:#B8B0A2;
  --pop:rgba(31,29,26,.96);--fabbg:rgba(31,29,26,.92);
  --tint:rgba(221,215,203,.07);--cgrid:rgba(221,215,203,.04);--caim:rgba(221,215,203,.70);
  --chair:rgba(221,215,203,.26);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* iPad 专属防整页缩放与滚动穿透 */
html, body {
  background:var(--bg);color:var(--text);
  width:100%;height:100%;height:100dvh;
  position:fixed;top:0;left:0;right:0;bottom:0;
  overflow:hidden;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;
}

input{font:inherit;color:inherit;background:none;border:none;outline:none;touch-action:auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}

/* ---- 全屏 TradingView 图表容器 ---- */
#tv_chart{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}

/* ---- 左右 20% 翻币区域视觉轻提示 ---- */
.edge-zone{position:fixed;top:0;bottom:0;width:20vw;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s ease;display:flex;align-items:center;justify-content:center}
.edge-zone.left{left:0}
.edge-zone.right{right:0}
.edge-hint{font-size:28px;color:var(--faint);font-weight:300;user-select:none;opacity:0.25}

/* ---- 左上角：品种与周期点击切换 ---- */
#tl{position:fixed;top:18px;left:22px;z-index:5;display:flex;flex-direction:row;gap:10px;align-items:center}
#name{display:flex;align-items:center;gap:8px;padding:4px 0;background:none;user-select:none;-webkit-user-select:none}
#name .s{font-size:18px;font-weight:650;letter-spacing:-.01em;cursor:pointer;padding:2px 6px;border-radius:7px;transition:all .15s}
#name .s:hover{background:var(--raised);color:var(--ink)}
#name .s:active{transform:scale(0.96)}

/* ---- 右上角：K线收盘倒计时 ---- */
#tr{position:fixed;top:18px;right:22px;z-index:5;display:flex;flex-direction:row;gap:8px;align-items:center}
#cdTimer{
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  font-size:16px;
  font-weight:650;
  color:var(--faint);
  letter-spacing:-.01em;
  padding:2px 6px;
  border-radius:7px;
  user-select:none;
  -webkit-user-select:none;
  transition:all .15s;
}
#cdTimer:hover{background:var(--raised);color:var(--ink)}
#cdTimer.ending{color:var(--amber);font-weight:700}

#lockbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;display:none;
  background:var(--ink);border:none;color:var(--onink);
  padding:7px 14px;border-radius:9px;font-size:12.5px}
#lockbar.on{display:block}

/* ---- 左下角悬浮空白气泡按钮 ---- */
#br{position:fixed;left:18px;bottom:20px;z-index:6;display:flex;align-items:center;gap:8px}
.fab{height:38px;width:38px;min-width:38px;padding:0;border-radius:12px;background:var(--fabbg);
  border:none;box-shadow:0 2px 10px rgba(46,43,38,.07);backdrop-filter:blur(8px);
  display:inline-flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;transition:transform .12s,background .15s}
.fab:hover{background:var(--raised)}

.tv-btn{position:relative}

#mask{position:fixed;inset:0;background:rgba(46,43,38,.22);opacity:0;pointer-events:none;transition:.18s;z-index:8}

.sheet{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--line);z-index:9;transform:translateX(102%);transition:transform .22s ease;
  display:flex;flex-direction:column;touch-action:pan-y}
.sheet.on{transform:none}
.sh{flex:none;display:flex;align-items:center;gap:10px;padding:16px 18px 10px}

.sh .x:hover{background:var(--raised);color:var(--text)}
.tabs{display:flex;align-items:center;gap:6px}
.tab-btn{font-size:13.5px;font-weight:600;color:var(--faint);padding:5px 12px;border-radius:8px;transition:.15s}
.tab-btn.on{color:var(--text);background:var(--raised)}
.tab-content{display:none;flex:1;flex-direction:column;overflow:hidden}
.tab-content.on{display:flex}

.sbody{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 12px 18px;scrollbar-width:thin;scrollbar-color:var(--raised) transparent;touch-action:pan-y}

.filt{display:flex;align-items:center;gap:8px;padding:0 18px 10px;font-size:11.5px;color:var(--faint)}
.filt button{padding:3px 9px;border-radius:999px;border:none;font-size:11.5px;color:var(--faint)}
.filt button.on{background:var(--raised);color:var(--text);border-color:transparent}
.ci{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.ci:hover{background:var(--raised)}
.ci.on{background:var(--raised)}
.ci .n{font-size:13.5px;font-weight:550}
.ci .v{display:block;margin-top:1px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.ci .hold{margin-left:6px}

.ci .r .a{display:block;font-size:13px}

  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, { passive: false });

  // 阻止双击缩放 (Double-tap zoom)
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if(now - lastTouchEnd <= 300){
      if(e.target && !e.target.closest('input, textarea, button')) {
        e.preventDefault();
      }
    }
    lastTouchEnd = now;
  }, { passive: false });
})();

function hmac(keyStr,msgStr){

  kPad.set(key,0);

  const oPad=new Uint8Array(64);
  for(let i=0;i<64;i++){
    iPad[i]=kPad[i]^0x36;

  outer.set(oPad,0);
  outer.set(innerHash,64);

let TOFF=0;
const now=()=>Date.now()+TOFF;
let backoffUntil=0;
async function syncTime(){
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;
  const tm=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},8000);
  try{const r=await fetch(BASE+"/fapi/v1/time",{signal:ctl?ctl.signal:undefined});const j=await r.json().catch(()=>null);
    if(j&&j.serverTime){TOFF=+j.serverTime-Date.now();log("time offset "+TOFF+"ms");}}
  catch(e){log("syncTime err "+e);}
  finally{clearTimeout(tm);}
}
function qs(o){return Object.keys(o).filter(k=>o[k]!==undefined&&o[k]!==null&&o[k]!=="")
  .map(k=>encodeURIComponent(k)+"="+encodeURIComponent(o[k])).join("&");}
function bnErr(j){
  const e=new Error((j&&j.msg)||("code "+((j&&j.code)||"?")));e.code=+((j||{}).code||0);return e;}
async function req(method,path,query,headers,ms,opt={}){
  const isEscape = !!opt.escapeLock || opt.isExit || method === "DELETE";
  if(!isEscape && Date.now()<backoffUntil)throw new Error("backoff");
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;
  const tm=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},ms||15000);
  try{
    const r=await fetch(BASE+path+(query?"?"+query:""),{method,headers:headers||{},signal:ctl?ctl.signal:undefined});
    const j=await r.json().catch(()=>null);
    if(r.status===429||r.status===418||r.status===403){NET.fail++;
      const banMatch = (j && j.msg) ? String(j.msg).match(/banned until (\d+)/) : null;
      if(banMatch && +banMatch[1] > Date.now()){
        backoffUntil = Math.max(backoffUntil, +banMatch[1]);
      } else {
        backoffUntil=Math.max(backoffUntil,Date.now()+Math.min(60000,3000*NET.fail));
      }
      throw bnErr(j||{msg:"HTTP "+r.status,code:-r.status});}
    if(j&&j.msg&&j.msg.includes("restricted location")){
      toast("⚠ 币安区域限制：检测到美国/受限节点，请将梯子切换至【台湾/日本/韩国】等非美国节点！");
      throw new Error("币安受限地区IP (Restricted Location)");
    }
    if(j&&j.code!=null&&+j.code<0)throw bnErr(j);
    if(!r.ok)throw bnErr(j||{msg:"HTTP "+r.status});
    NET.info=Date.now();NET.fail=0;backoffUntil=0;return j;
  }catch(e){
    if(e.name==="AbortError")e.timeout=true;
    if(!e.code){NET.fail++;if(NET.fail>=3)backoffUntil=Math.max(backoffUntil,Date.now()+Math.min(30000,2000*NET.fail));}
    throw e;
  }finally{clearTimeout(tm);}
}

let _qrStream = null;

function parseKeyQrData(text){
  if(!text || typeof text !== "string") return null;
  text = text.trim();

  // 1. JSON 格式: {"apiKey":"...", "secretKey":"...", "comment":"..."}
  if(text.startsWith("{") && text.endsWith("}")){
    try{
      const obj = JSON.parse(text);
      if(obj && typeof obj === "object"){
        const k = obj.apiKey || obj.apikey || obj.api_key || obj.key || obj.accessKey || "";
        const s = obj.secretKey || obj.secretkey || obj.secret_key || obj.secret || obj.apiSecret || obj.api_secret || "";
        if(k && s) return { key: String(k).trim(), secret: String(s).trim() };
      }
    }catch(e){}
  }

  // 2. URL 查询串 / Scheme 格式
  if(text.includes("=") && (text.includes("&") || text.includes("?"))){
    try{
      const q = text.includes("?") ? text.split("?")[1] : text;
      const params = new URLSearchParams(q);
      const k = params.get("apiKey") || params.get("key") || params.get("api_key");
      const s = params.get("secretKey") || params.get("secret") || params.get("api_secret");
      if(k && s) return { key: k.trim(), secret: s.trim() };
    }catch(e){}
  }

  // 3. 换行、竖线或逗号分隔的两个密钥串
  const lines = text.split(/[\r\n|,]+/).map(s=>s.trim()).filter(Boolean);
  if(lines.length === 2 && lines[0].length >= 20 && lines[1].length >= 20){
    return { key: lines[0], secret: lines[1] };
  }

  return null;
}

function decodeQrFromCanvas(canvas){
  if(!canvas) return null;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  if(!ctx) return null;
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  if(typeof jsQR === "function"){
    try{
      const res = jsQR(imgData.data, canvas.width, canvas.height, {
        inversionAttempts: "attemptBoth"
      });
      if(res && res.data) return res.data;
    }catch(e){ log("jsQR err: " + e.message); }
  }
  return null;
}

function decodeQrFromImageBlob(blob){
  return new Promise((resolve) => {
    if(!blob) return resolve(null);
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      try{
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const text = decodeQrFromCanvas(canvas);
        URL.revokeObjectURL(url);
        resolve(parseKeyQrData(text));
      }catch(e){
        URL.revokeObjectURL(url);
        resolve(null);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      resolve(null);
    };
    img.src = url;
  });
}

async function startCameraScan(){
  const camBox = $("#kCameraBox");
  const video = $("#kVideo");
  if(!camBox || !video) return;

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("当前浏览器环境不支持摄像头扫码，已为您打开图片选取");
    const fi = $("#kQrFile");
    if(fi) fi.click();
    return;
  }

  stopCameraScan();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    _qrStream = stream;
    video.srcObject = stream;
    await video.play();
    camBox.classList.add("on");

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    function scanLoop(){
      if(!_qrStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const text = decodeQrFromCanvas(canvas);
        if(text){
          const parsed = parseKeyQrData(text);
          if(parsed){
            stopCameraScan();
            fillDecodedKey(parsed);
            return;
          }
        }
      }
      _qrAnimId = requestAnimationFrame(scanLoop);
    }
    _qrAnimId = requestAnimationFrame(scanLoop);
  }catch(err){
    stopCameraScan();
    log("camera scan err: " + (err && err.message));
    toast("无法启动摄像头（未授权或无设备），已打开图片选取");
    const fi = $("#kQrFile");
    if(fi) fi.click();
  }
}

function calcNatrFromCandles(klineList){
  if(!klineList || klineList.length < 16) return null;
  // 丢弃最新一根尚未收盘的 K 线，避免盘中跳动
  const closed = klineList.slice(0, -1);
  if(closed.length < 15) return null;

  const trs = [];
  for(let i = 1; i < closed.length; i++){
    const cur = closed[i], prev = closed[i - 1];
    const h = +(cur.h != null ? cur.h : cur[2]);
    const l = +(cur.l != null ? cur.l : cur[3]);
    const pc = +(prev.c != null ? prev.c : prev[4]);
    trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
  }
  if(trs.length < 14) return null;

  // Wilder RMA: 初始取前 14 根简单均值，之后递归平滑
  let atr = trs.slice(0, 14).reduce((a, b) => a + b, 0) / 14.0;
  for(let i = 14; i < trs.length; i++){
    atr = (atr * 13.0 + trs[i]) / 14.0;
  }
  const lastC = closed[closed.length - 1];
  const close = +(lastC.c != null ? lastC.c : lastC[4]);
  return close > 0 ? +((atr / close) * 100).toFixed(3) : null;
}

async function fetchSymbolNatr(sym, tf = "15m"){
  if(Date.now() < backoffUntil) return null;
  try{
    if(sym === S.sym && S.kc[sym + "|15m"]?.k?.length >= 20){
      const natr = calcNatrFromCandles(S.kc[sym + "|15m"].k);
      if(!S.ctx[sym]) S.ctx[sym] = {};
      S.ctx[sym]["natr_15m"] = natr;
      return natr;
    }
    const r = await pub("/fapi/v1/klines", { symbol: sym, interval: "15m", limit: 30 }, 8000);
    if(Array.isArray(r) && r.length >= 16){
      const natr = calcNatrFromCandles(r);
      if(!S.ctx[sym]) S.ctx[sym] = {};
      S.ctx[sym]["natr_15m"] = natr;
      return natr;
    }
  }catch(e){}
  return null;
}

async function refreshNatrs(tf = "15m", force = false){
  if(Date.now() < backoffUntil) return;
  if(_natrFetching) return;
  if(!force && Date.now() - _natrAt < NATR_REFRESH_MS) return;
  _natrFetching = true;
  try{
    const targets = S.uni.filter(u => {
      const c = S.ctx[u.name] || {};
      return (+c.volUsd >= VOL_MIN) || (u.name === S.sym) || (posOf(u.name).length > 0) || wHas(u.name);
    });
    targets.sort((a,b) => (+((S.ctx[b.name]||{}).volUsd)||0) - (+((S.ctx[a.name]||{}).volUsd)||0));
    if(!targets.length) return;
    const CONCURRENCY = 4; // 提升并发度快速获取头部标的 NATR
    for(let i = 0; i < targets.length; i += CONCURRENCY){
      if(Date.now() < backoffUntil) break;
      const chunk = targets.slice(i, i + CONCURRENCY);
      await Promise.all(chunk.map(u => fetchSymbolNatr(u.name, "15m")));
      if(i + CONCURRENCY < targets.length){
        await new Promise(r => setTimeout(r, 40));
      }
    }
    _natrAt = Date.now();
    saveNatrCache();
    head();
    if($("#shList").classList.contains("on")) list(true);
  } finally {
    _natrFetching = false;
  }
}

let lastEmaValue = null;

function calcEmaArray(data, period = 20){
  if(!data || !data.length) return [];
  const k = 2 / (period + 1);
  const emaData = [];
  let ema = data[0].close;
  data.forEach((b, idx) => {
    if(idx === 0) ema = b.close;
    else ema = b.close * k + ema * (1 - k);
    emaData.push({ time: b.time, value: ema });
  });
  lastEmaValue = ema;
  return emaData;
}

function updateChartCandles(rawBars, resetRange){
  if(!candleSeries || !rawBars.length) return;
  const map = new Map();
  rawBars.forEach(x => {
    const timeSec = Math.floor(x.t / 1000);
    map.set(timeSec, { time: timeSec, open: x.o, high: x.h, low: x.l, close: x.c });
  });
  const data = Array.from(map.values()).sort((a, b) => a.time - b.time);

  _programmaticRangeTime = Date.now() + 300;
  candleSeries.setData(data);

  if(data.length > 0){
    const emaData = calcEmaArray(data, 20);
    emaSeries.setData(emaData);

    // K线视口：保持并记忆用户自定义的缩放根数与拖拽平移偏移量（绝不强制覆盖右对齐）
    if(resetRange && tvChart){
      const total = data.length;
      const count = Math.max(15, Math.min(total, CHART_VIEW_STATE.count || 100));
      const rightOffset = (typeof CHART_VIEW_STATE.rightOffset === "number") ? CHART_VIEW_STATE.rightOffset : -4;

      let to = total - rightOffset;
      // 边界容错：防止因币种K线总数极少导致显示越界
      if(to < 10 || to > total + Math.max(100, count * 2)){
        to = total + 4;
      }
      const from = to - count;

      _programmaticRangeTime = Date.now() + 300;
      tvChart.timeScale().setVisibleLogicalRange({ from, to });
    }
  }
}

function useCandles(raw, resetRange){

  const i=S.k.length-1;if(i>=0)S.k[i]=Object.assign({},S.k[i]);

  syncTradeLines();
}

async function kline(force){
  const reqSym = S.sym, reqTf = S.tf;
  const key=reqSym+"|"+reqTf,c=S.kc[key];
  if(c&&c.k.length){useCandles(c.k, force);}
  subCoin(reqSym,reqTf);
  if(!force&&c&&Date.now()-c.t<30000)return;
  try{
    const r=await pub("/fapi/v1/klines",{symbol:reqSym,interval:reqTf,limit:500});
    const raw=(Array.isArray(r)?r:[]).map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}));
    if(raw.length){
      const hasDrawn = !!(c && c.k && c.k.length > 0);
      S.kc[key]={k:raw,t:Date.now()};
      // 防切币竞态条件：确认当前仍是请求的币种和周期
      if(S.sym === reqSym && S.tf === reqTf){
        // 若已用缓存绘制过，网络拉回时仅静默更新数据，绝不破坏用户刚刚调整的视口位置
        useCandles(raw, !hasDrawn);
        if(reqTf === "15m" && raw.length >= 16){
          if(!S.ctx[reqSym]) S.ctx[reqSym] = {};
          S.ctx[reqSym]["natr_15m"] = calcNatrFromCandles(raw);
          head();
        }
      }
    }
  }catch(e){log("klines err "+e.message);}
}

let ws,WSOK=false,wsTry=0,wsEver=false,wsId=1,WSCONN=0,wsPend=false,ARRON=false;
const SUB={sym:null,tf:null};
function wsSend(o){try{if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true;}}catch(e){}return false;}
function subCoin(sym,tf){
  if(!sym||!tf)return;
  const low=sym.toLowerCase();
  if(SUB.sym&&(SUB.sym!==sym||SUB.tf!==tf))
    wsSend({method:"UNSUBSCRIBE",params:[SUB.sym.toLowerCase()+"@kline_"+SUB.tf],id:wsId++});
  if(SUB.sym&&SUB.sym!==sym){const o=SUB.sym.toLowerCase();
    wsSend({method:"UNSUBSCRIBE",params:[o+"@ticker",o+"@markPrice@1s"],id:wsId++});}
  if(!wsSend({method:"SUBSCRIBE",params:[low+"@kline_"+tf,low+"@ticker",low+"@markPrice@1s"],id:wsId++}))return;
  SUB.sym=sym;SUB.tf=tf;
  MIDGRACE=Date.now()+10000;
}
function subArr(on){
  on=!!on;if(ARRON===on)return;
  ARRON=on;wsSend({method:on?"SUBSCRIBE":"UNSUBSCRIBE",params:["!markPrice@arr@1s"],id:wsId++});
}
function sock(){
  WSCONN=Date.now();
  try{ws=new WebSocket(WSU);}catch(e){setTimeout(sock,3000);return;}
  ws.onopen=()=>{WSOK=true;wsTry=0;NET.ws=Date.now();SUB.sym=null;SUB.tf=null;
    if(ARRON)wsSend({method:"SUBSCRIBE",params:["!markPrice@arr@1s"],id:wsId++});
    subCoin(S.sym,S.tf);
    if(wsEver){tickers().then(head).catch(()=>{});kline(true);}
    wsEver=true;};
  ws.onerror=()=>{WSOK=false;};
  ws.onclose=()=>{WSOK=false;wsPend=true;
    setTimeout(()=>{wsPend=false;sock();},Math.min(30000,2000*Math.pow(2,wsTry++)));};
  ws.onmessage=ev=>{
    NET.ws=Date.now();
    let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    const d=m&&m.data!==undefined?m.data:m;
    if(Array.isArray(d)){
      if(!d.length||d[0].e!=="markPriceUpdate")return;
      NET.mid=Date.now();d.forEach(x=>{if(S.f[x.s])S.mid[x.s]=+x.p;});
      schedule();return;}
    if(!d||!d.e)return;
    if(d.e==="markPriceUpdate"){
      NET.mid=Date.now();if(S.f[d.s])S.mid[d.s]=+d.p;schedule();return;}
    if(d.e==="kline"){
      const x=d.k||{};if(d.s!==S.sym||x.i!==S.tf)return;
      const key=S.sym+"|"+S.tf,c=S.kc[key];if(!c||!c.k.length)return;
      const b={t:+x.t,o:+x.o,h:+x.h,l:+x.l,c:+x.c},last=c.k[c.k.length-1];
      if(last&&last.t===b.t)c.k[c.k.length-1]=b;else if(!last||b.t>last.t)c.k.push(b);
      c.t=Date.now();
      if(candleSeries){
        const timeSec = Math.floor(b.t / 1000);
        candleSeries.update({ time: timeSec, open: b.o, high: b.h, low: b.l, close: b.c });
        if(emaSeries && lastEmaValue != null){
          const k = 2 / 21;
          const liveEma = b.c * k + lastEmaValue * (1 - k);
          emaSeries.update({ time: timeSec, value: liveEma });
        }
        if(S.tf === "15m" && c.k.length >= 16){
          if(!S.ctx[S.sym]) S.ctx[S.sym] = {};
          S.ctx[S.sym]["natr_15m"] = calcNatrFromCandles(c.k);
          head();
        }
      }
      schedule();return;}
    if(d.e==="24hrTicker"){
      if(!S.f[d.s])return;
      S.ctx[d.s]=Object.assign({},S.ctx[d.s]||{},{last:+d.c,chg:+d.P,volUsd:+d.q});
      const bar=S.k[S.k.length-1];if(d.s===S.sym&&bar&&+d.c)bar.c=+d.c;
      NET.info=Date.now();schedule();return;}
  };
}

async function midPoll(){

  try{

    if(!Array.isArray(r)){midFail++;return;}
    let n=0;r.forEach(x=>{const s=x&&(x.symbol||x.s),v=+(x&&(x.price!=null?x.price:x.p));
      if(s&&S.f[s]&&v>0){S.mid[s]=v;n++;}});

    if(MIDSRC!=="rest"&&Date.now()>MIDGRACE){MIDSRC="rest";log("mid 改走轮询");}
    schedule();
  }catch(e){midFail++;log("midPoll err "+(e.message||e));}

function handleUserStreamEvent(d){
  if(!d||!d.e)return;
  if(d.e==="listenKeyExpired"){log("listenKey expired");startUserStream(true);return;}
  if(d.e==="ORDER_TRADE_UPDATE"||d.e==="ALGO_ORDER_TRADE_UPDATE"){
    const o=d.o||d.a||{};
    const isExit = o.R===true || o.R==="true" || o.cp===true || o.cp==="true";
    const isEntry = !isExit;
    const isStopLoss = isExit && (o.ot==="STOP_MARKET" || o.ot==="STOP");

    // 1. 入场单（普通只挂单 LIMIT 或 突破追单 STOP_MARKET）成交：坚决保留待挂记录并触发补挂！
    if((o.X==="FILLED"||o.X==="PARTIALLY_FILLED") && isEntry && PENDBR[o.s]){
      setTimeout(()=>firePendingBracket(o.s),600);
    }

    // 2. 止损成交保护：只有当明确为平仓止损单（减仓单）成交时，才判定仓位已止损清空，撤除同品种挂单并清理 PENDBR
    if(o.X==="FILLED" && isStopLoss){
      cancelAllEntryOrders(o.s);
      if(PENDBR[o.s]){ delete PENDBR[o.s]; savePendBr(); }
      toast("✔ "+disp(o.s)+" 止损单已触发成交，已自动撤除同品种全部残留入场挂单", true);
    }

    // 3. 入场单撤销保护：入场单被撤销或过期时，若当前无持仓且无其他入场单，联动撤销预挂的止盈与止损单！
    if((o.X==="CANCELED"||o.X==="EXPIRED") && isEntry && o.ot!=="TAKE_PROFIT_MARKET"){
      if(posOf(o.s).length===0){
        const otherEntries=(S.ords[o.s]||[]).filter(x=>String(x.orderId||x.algoId)!==String(o.i||o.aid)&&!ordInfo(x).ro);
        if(otherEntries.length===0){
          send("DELETE","/fapi/v1/allOpenOrders",{symbol:o.s},"入场单已撤，联动撤销止盈",true,{escapeLock:true,skipLoad:true,skipCascade:true}).catch(()=>null);
          send("DELETE","/fapi/v1/algoOpenOrders",{symbol:o.s},"入场单已撤，联动撤销止损",true,{escapeLock:true,skipLoad:true,skipCascade:true}).catch(()=>null);
          delete S.ords[o.s];
          if(PENDBR[o.s]){delete PENDBR[o.s];savePendBr();}
          clearTradeLines();syncTradeLines();posView();
        }
      }
    }
    schedAcct();return;}
  if(d.e==="ACCOUNT_UPDATE"){
    (((d.a||{}).P)||[]).forEach(p=>{
      const k=posKey(p.s,p.ps),amt=+p.pa;
      if(!amt){delete S.pos[k];return;}
      S.pos[k]=Object.assign(S.pos[k]||{sym:p.s,side:p.ps||"BOTH"},
        {amt,entry:+p.ep,upnl:+p.up});});
    NET.acct=Date.now();schedAcct();
    if($("#shTv").classList.contains("on"))posView();
    schedule();return;}
}

async function startUserStream(forceNew){
  if(!HASKEY)return;
  try{
    if(!LKEY||forceNew){
      const r=await keyReq("POST","/fapi/v1/listenKey");
      if(!r||!r.listenKey){log("no listenKey");return;}
      LKEY=r.listenKey;}
    try{if(uws)uws.close();}catch(e){}
    uws=new WebSocket(WSU+"/"+LKEY);
    uws.onopen=()=>log("user stream open");
    uws.onclose=()=>{setTimeout(()=>startUserStream(false),4000);};
    uws.onerror=()=>{};
    uws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data);}catch(e){return;}
      const d=m&&m.data!==undefined?m.data:m;
      handleUserStreamEvent(d);
    };
    clearInterval(lkT);lkT=setInterval(()=>{keyReq("PUT","/fapi/v1/listenKey").catch(e=>log("keepalive err "+e.message));},1500000);
  }catch(e){log("userStream err "+e.message);setTimeout(()=>startUserStream(true),10000);}
}

function posKey(sym,side){return (!side||side==="BOTH")?sym:sym+":"+side;}
function posOf(sym){return Object.values(S.pos).filter(p=>p.sym===sym);}
function curPos(){return posOf(S.sym)[0]||null;}
function applyAcct(acc,pos,od){
  if(acc && !Array.isArray(acc) && (+acc.totalMarginBalance > 0 || +acc.totalWalletBalance > 0))S.acct={equity:+acc.totalMarginBalance||+acc.totalWalletBalance||0,
    avail:+acc.availableBalance||0,used:+acc.totalInitialMargin||0,
    wallet:+acc.totalWalletBalance||0,upnl:+acc.totalUnrealizedProfit||0};
  if(pos){S.pos={};
    (pos||[]).forEach(p=>{
      if(p&&p.symbol&&+p.leverage>0)S.levSet[p.symbol]=+p.leverage;
      const amt=+p.positionAmt;if(!amt)return;
      const k=posKey(p.symbol,p.positionSide);
      S.pos[k]={sym:p.symbol,side:p.positionSide||"BOTH",amt,entry:+p.entryPrice,
        liq:+p.liquidationPrice,upnl:+p.unRealizedProfit,lev:+p.leverage||0,
        iso:p.marginType==="isolated"||p.isolated===true};});}
  if(od){S.ords={};S.ordsAt=Date.now();
    (od||[]).forEach(o=>{if(o&&o.symbol)(S.ords[o.symbol]=S.ords[o.symbol]||[]).push(o);});
    try{prunePendBr();}catch(e){log("prune err "+e.message);}
    sweepStaleEntries().catch(e=>log("ttl err "+e.message));}
  if(pos)Object.keys(PENDBR).forEach(s=>firePendingBracket(s));
  NET.acct=Date.now();
  updateTvBtn();
}

async function load(silent, symOnly){
  if(!HASKEY){if(!silent)toast("未配置 API Key / Secret，无法读取账户");return;}
  try{
    const orderParams = symOnly ? { symbol: symOnly } : {};
    let ordsFailed = false;
    const tasks=[
      priv("GET","/fapi/v2/account",{}, 15000, { escapeLock: true }),
      priv("GET","/fapi/v2/positionRisk",{}, 15000, { escapeLock: true }),
      priv("GET","/fapi/v1/openOrders", orderParams, 15000, { escapeLock: true }).catch(e => { ordsFailed = true; log("openOrders err: " + (e&&e.message)); return null; }),
      priv("GET","/fapi/v1/openAlgoOrders", orderParams, 15000, { escapeLock: true }).catch(e => { ordsFailed = true; log("openAlgoOrders err: " + (e&&e.message)); return null; })
    ];
    if(S.dual==null)tasks.push(priv("GET","/fapi/v1/positionSide/dual",{}, 15000, { escapeLock: true }).catch(()=>null));
    const [acc,pos,stdOd,algoRes,dual]=await Promise.all(tasks);
    if(dual&&dual.dualSidePosition!=null)S.dual=!!dual.dualSidePosition;

    if(ordsFailed || stdOd === null || algoRes === null){
      // 挂单查询失败：坚决保留上次状态，标记数据过期/未知，绝不能把网络故障误判为“没有订单”！
      S.ordsStale = true;
      S.ordsStaleAt = Date.now();
      applyAcct(acc, pos, null); // 只更新资金与持仓，绝不冲掉现有挂单
      render(); posView(); syncTradeLines(); updateTvBtn();
      return;
    }

    S.ordsStale = false;
    S.ordsStaleAt = 0;
    
    const algoArr = Array.isArray(algoRes) ? algoRes : (algoRes && Array.isArray(algoRes.openAlgoOrders) ? algoRes.openAlgoOrders : []);
    const normalizedAlgo = algoArr.map(o => {
      const oType = o.orderType || o.type || o.algoType || "STOP_MARKET";
      return {
        symbol: o.symbol,
        orderId: o.algoId || o.orderId,
        algoId: o.algoId || o.orderId,
        isAlgo: true,
        side: o.side,
        positionSide: o.positionSide || "BOTH",
        type: oType,
        orderType: oType,
        algoType: o.algoType || "CONDITIONAL",
        stopPrice: o.stopPrice || o.triggerPrice || 0,
        price: o.price || 0,
        origQty: o.totalQty || o.quantity || o.origQty || 0,
        closePosition: o.closePosition === true || o.closePosition === "true",
        reduceOnly: o.reduceOnly === true || o.reduceOnly === "true",
        time: o.bookTime || o.time || o.createTime || Date.now()
      };
    });

    const od = [...(Array.isArray(stdOd)?stdOd:[]), ...normalizedAlgo];
    if(symOnly && S.ords){
      // 增量合并当前标的的挂单，同时绝不丢弃账户资金与持仓数据！
      applyAcct(acc,pos,null);
      S.ords[symOnly] = od.filter(o => !o.symbol || o.symbol === symOnly);
      od.forEach(o => {
        if(o && o.symbol && o.symbol !== symOnly){
          if(!S.ords[o.symbol]) S.ords[o.symbol] = [];
          if(!S.ords[o.symbol].some(x => String(x.orderId||x.algoId) === String(o.orderId||o.algoId))){
            S.ords[o.symbol].push(o);
          }
        }
      });
      S.ordsAt = Date.now();
      try{prunePendBr();}catch(e){log("prune err "+e.message);}
      sweepStaleEntries().catch(e=>log("ttl err "+e.message));
    } else {
      applyAcct(acc,pos,od);
    }
    if(!silent){const a=acctView();
      toast("已加载：总资金 $"+money(a.equity)+" · 可用 $"+money(a.avail)+"，持仓已置顶");}
    sweepOrphans(true);
  }catch(e){
    log("load err "+e.code+" "+e.message);
    if(!silent)toast(keyHint(e)||("账户读取失败："+e.message));
  }
  render();posView();syncTradeLines();updateTvBtn();
}

function keyHint(e){
  const c=+((e||{}).code||0);
  const msg=String((e||{}).message || (e||{}).msg || "");
  if(msg.includes("banned until") || msg.includes("Way too many requests") || c===-1003 || c===-429 || c===-418){
    const m = msg.match(/banned until (\d+)/);
    const sec = m ? Math.max(0, Math.round((+m[1] - Date.now())/1000)) : 120;
    const min = Math.ceil(sec / 60);
    return "🚨 梯子节点请求过频被币安临时限流（约需等待 " + min + " 分钟解封，或在梯子/Clash切换到其他节点立即恢复）";
  }
  if(c===-2015){
    if(CURRENT_NET_GEO && CURRENT_NET_GEO.loc === "US"){
      return "🚨 币安拒止（-2015）：当前梯子出口为【美国节点 (US / " + CURRENT_NET_GEO.ip + ")】！币安合约严禁美国 IP。请将梯子/Clash切换为【台湾/日本/香港】！";
    }
    detectNetGeo().catch(()=>{});
    const ipMatch = msg.match(/request ip:\s*([0-9a-fA-F.:]+)/i);
    const ipTip = ipMatch ? "（请求IP: " + ipMatch[1] + "）" : "";
    return "API Key 无效 / 未开合约权限 / IP 不在白名单 " + ipTip + "（-2015）";
  }
  if(c===-2014||c===-1022)return "签名不通过：检查 Secret 是否粘错（-1022）";
  if(c===-1021)return "本机时间与交易所偏差过大，已重新校时，请重试（-1021）";
  if(c===-4411||/TradFi-Perps agreement/i.test(msg))return "未签署 TradFi 协议：该品种（如美股/大宗）需先在币安 App 或网页端打开并同意协议（-4411）";
  return "";
}

function ordInfo(o){
  const t=String(o.type||""),stop=+(o.stopPrice||o.triggerPrice||0),lim=+(o.price||0);
  const closeAll=o.closePosition===true||o.closePosition==="true";
  const ps=String(o.positionSide||"BOTH").toUpperCase();
  const side=String(o.side||"").toUpperCase();
  
  // 严格依据交易所返回的 reduceOnly 与 closePosition，绝不凭持仓方向盲目猜测！
  let ro = !!o.reduceOnly || o.reduceOnly === "true" || closeAll;
  if(!ro && S.dual){
    if(ps === "LONG" && side === "SELL") ro = true;
    if(ps === "SHORT" && side === "BUY") ro = true;
  }

  const trail=/TRAILING/.test(t);
  const isAlgoTp=/TAKE_PROFIT/.test(t);
  const isCidTp=String(o.clientOrderId||o.newClientOrderId||"").startsWith("tp_");
  const isSl=/STOP/.test(t)&&!trail;
  const isProfitLimit=ro&&!isSl&&!trail&&lim>0&&(()=>{
    const p=posOf(o.symbol)[0];
    const curM=mid(o.symbol);
    if(p&&Math.abs(p.amt)>0){
      return p.amt>0?(side==="SELL"&&lim>p.entry):(side==="BUY"&&lim<p.entry);
    }
    if(curM>0){
      return side==="SELL"?lim>curM:lim<curM;
    }
    return false;
  })();
  const tp=isAlgoTp||isCidTp||isProfitLimit;
  const sl=isSl;
  const trig=trail||stop>0||/STOP|TAKE_PROFIT/.test(t);
  const isEntry=!ro;
  const kind=trail?"追踪止损":trig?(isEntry?"突破入场":tp?"止盈":(/MARKET/.test(t)?"市价止损 (MARK)":"止损 (MARK)")):(tp?"止盈":ro?"限价平仓":"限价入场");
  const size=Math.abs(+o.origQty||+o.quantity||+o.totalQty||0);
  const sizeTxt=closeAll?"全平":size>0?sz(size,o.symbol):"—";
  const price=trig?stop:lim;
  let priceTxt=price>0?px(price,o.symbol):"市价";
  if(trig&&lim>0&&stop>0&&!/MARKET/.test(t)&&Math.abs(lim-stop)/stop>1e-9)
    priceTxt=px(stop,o.symbol)+" → 限 "+px(lim,o.symbol);
  return{t,trig,ro,closeAll,tp,sl,trail,isEntry,kind,size,sizeTxt,price,priceTxt,
    sideTxt:side==="BUY"?"买":"卖"};
}

function ordAge(o){const t=+o.time||+o.updateTime||0;if(!t)return "—";

  if(s<86400)return (s/3600).toFixed(1)+"h";
  return Math.round(s/86400)+"d";}

/* 入场单撤单联动：撤销入场单时，同时撤销关联预挂的止损与止盈单（防残留孤儿单） */
async function cascadeCancelLinkedBrackets(sym, entryOid, options = {}){
  const hasPos = posOf(sym).length > 0;
  const pb = PENDBR[sym];
  const ordList = S.ords[sym] || [];

  if(!hasPos){
    // 无持仓场景：检查同币种是否还有其他未成交的入场单
    const otherEntries = ordList.filter(o => String(o.orderId || o.algoId) !== String(entryOid) && !ordInfo(o).ro);
    if(otherEntries.length === 0){
      // 没有任何其他入场单：同品种下所有预挂的止盈止损单均已失去母单保护，立即全部并发撤销！
      const tasks = [];
      tasks.push(send("DELETE", "/fapi/v1/allOpenOrders", { symbol: sym }, "联动撤销 " + disp(sym) + " 预挂止盈单", true, { escapeLock: true, skipLoad: true, skipCascade: true }).catch(()=>null));
      tasks.push(send("DELETE", "/fapi/v1/algoOpenOrders", { symbol: sym }, "联动撤销 " + disp(sym) + " 预挂止损单", true, { escapeLock: true, skipLoad: true, skipCascade: true }).catch(()=>null));
      
      await Promise.allSettled(tasks);
      
      delete S.ords[sym];
      if(PENDBR[sym]){ delete PENDBR[sym]; savePendBr(); }
      clearTradeLines();
      syncTradeLines();
      posView();
      updateTvBtn();
      if(!options.silent){
        toast("✔ 已撤销入场单，并已联动撤销同品种预挂的止盈与止损单", true);
      }
      return;
    }
  }

  // 若有持仓或存在其他入场单：仅撤除与当前被撤入场单绑定的独立止盈/止损
  if(pb){
    const items = Array.isArray(pb.items) ? pb.items : [];
    const itIdx = items.findIndex(x => String(x.oid) === String(entryOid));
    const targetItem = itIdx >= 0 ? items[itIdx] : (String(pb.oid) === String(entryOid) ? pb : null);
    
    if(targetItem){
      const tasks = [];
      const tpOid = targetItem.tpOid || targetItem.tpFbOid;
      if(tpOid){
        tasks.push(cancelOrder(sym, tpOid, false, { escapeLock: true, skipLoad: true, silent: true, skipCascade: true }));
      }
      if(!hasPos && (targetItem.slOid || targetItem.slDone)){
        if(targetItem.slOid){
          tasks.push(cancelOrder(sym, targetItem.slOid, true, { escapeLock: true, skipLoad: true, silent: true, skipCascade: true }));
        } else {
          tasks.push(send("DELETE", "/fapi/v1/algoOpenOrders", { symbol: sym }, "撤销关联止损单", true, { escapeLock: true, skipLoad: true, skipCascade: true }).catch(()=>null));
        }
      }
      if(tasks.length > 0) await Promise.allSettled(tasks);
      
      if(itIdx >= 0){
        items.splice(itIdx, 1);
        if(items.length === 0 && !hasPos) delete PENDBR[sym];
        savePendBr();
      }
    }
  }

  clearTradeLines();
  syncTradeLines();
  posView();
  updateTvBtn();
  if(!options.silent){
    toast("✔ 已撤销入场单，并联动撤销关联的止盈/止损挂单", true);
  }
}

async function cancelOrder(sym,oid,isAlgo,opt={}){
  if(!HASKEY && !DRY_RUN){
    toast("⚠ 未配置 API Key，无法向交易所撤单！请先配置 API Key。", true);
    if(typeof openKey === "function") openKey();
    return null;
  }
  if(!oid || oid === "undefined" || oid === "null"){
    toast("⚠ 订单缺少有效编号 (orderId/algoId)，无法向交易所发起撤单", true);
    return null;
  }

  const options = (typeof opt === "object" && opt !== null) ? opt : {};
  const targetAlgoId = (typeof opt === "string" || typeof opt === "number") ? opt : options.algoId;
  const useAlgo = isAlgo || targetAlgoId != null;

  // 1. 判断待撤订单是否为“入场单”（非 reduceOnly 订单或待入场记录关联的入场单）
  const ordList = S.ords[sym] || [];
  const targetOrd = ordList.find(o => String(o.orderId || o.algoId) === String(oid));
  const isEntryOrder = targetOrd ? !ordInfo(targetOrd).ro : (PENDBR[sym] && (String(PENDBR[sym].oid) === String(oid) || (PENDBR[sym].items || []).some(it => String(it.oid) === String(oid))));

  if(!options.silent) toast("正在向交易所撤销 " + disp(sym) + " 挂单 #" + oid + "…", true);

  // 2. 发起首选路径撤单
  let path = useAlgo ? "/fapi/v1/algoOrder" : "/fapi/v1/order";
  let params = useAlgo ? { symbol: sym, algoId: targetAlgoId || oid } : { symbol: sym, orderId: oid };
  let res = await send("DELETE", path, params, "撤单 " + disp(sym), true, { escapeLock: true, ...options });
  
  let errCode = (res && res.code != null ? +res.code : (res && res._err && res._err.code != null ? +res._err.code : (LAST_ERR ? +LAST_ERR.code : 0)));
  
  // 3. 双向智能兜底重试：若接口不匹配（-4120/-1102/-2011/-4003），互换标准单/条件单接口重试一次
  if(!okAll(res) && (errCode === -2011 || errCode === -4120 || errCode === -1102 || errCode === -4003)){
    path = useAlgo ? "/fapi/v1/order" : "/fapi/v1/algoOrder";
    params = useAlgo ? { symbol: sym, orderId: oid } : { symbol: sym, algoId: targetAlgoId || oid };
    res = await send("DELETE", path, params, "撤单 " + disp(sym), true, { escapeLock: true, ...options });
    errCode = (res && res.code != null ? +res.code : (res && res._err && res._err.code != null ? +res._err.code : (LAST_ERR ? +LAST_ERR.code : 0)));
  }

  // 4. 结果处理与联动撤除关联止损/止盈
  const success = okAll(res) || errCode === -2011 || (LAST_ERR && LAST_ERR.code === -2011) || (res && res.code === -2011);
  if(success){
    // 成功撤单
    if(S.ords[sym]) S.ords[sym] = S.ords[sym].filter(o => String(o.orderId || o.algoId) !== String(oid));
    
    // 【入场单撤单联动】：撤销入场单时，自动同时撤销同组或同品种预挂的止盈与止损挂单
    if(isEntryOrder && !options.skipCascade){
      await cascadeCancelLinkedBrackets(sym, oid, options);
    } else {
      posView(); syncTradeLines(); updateTvBtn();
      if(!options.silent){
        if(errCode === -2011 || (res && res.code === -2011)){
          toast("交易所已无该订单（已成交或已在交易所撤销），已同步清理本地挂单显示", true);
        } else {
          toast("✔ 撤单成功：已撤销 " + disp(sym) + " 挂单 #" + oid, true);
        }
      }
    }
    return res || { code: 200, msg: "success" };
  } else {
    // 真正失败：给出详细明确的失败原因，绝不静默！
    const failReason = keyHint(LAST_ERR || res) || errText(LAST_ERR || res) || ((res && res.msg) || (LAST_ERR && LAST_ERR.message) || "交易所拒绝请求");
    if(!options.silent) toast("⚠ 撤单失败：" + failReason + (errCode ? "（" + errCode + "）" : ""), true);
    return res;
  }
}

/* 拖拽直接修改已挂出的订单价格（先保单、安全撤挂、绝不丢止损） */
async function modifyOrderPrice(oldOrder, newPrice){
  if(!oldOrder || !newPrice || !(newPrice > 0)) return;
  const sym = oldOrder.symbol || S.sym;
  const oi = ordInfo(oldOrder);
  const alignedPx = alignPx(newPrice, sym);
  if(!(alignedPx > 0) || Math.abs(alignedPx - oi.price) < 1e-8) return;

  const curM = mid(sym);
  const isBuy = oldOrder.side === "BUY";
  const isSell = oldOrder.side === "SELL";

  // 止损单防穿透校验：
  // 1) 多头平仓止损是 SELL 单，触发价必须严格低于当前市价
  // 2) 空头平仓止损是 BUY 单，触发价必须严格高于当前市价
  if(oi.sl && curM > 0){
    if(isSell && alignedPx >= curM){
      toast("⚠ 多仓止损价 (" + px(alignedPx, sym) + ") 必须低于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    } else if(isBuy && alignedPx <= curM){
      toast("⚠ 空仓止损价 (" + px(alignedPx, sym) + ") 必须高于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    }
  }

  // 止盈单防穿透校验：
  // 1) 多头平仓止盈是 SELL 单，限价/触发价必须高于当前市价
  // 2) 空头平仓止盈是 BUY 单，限价/触发价必须低于当前市价
  if(oi.tp && curM > 0){
    if(isSell && alignedPx <= curM){
      toast("⚠ 多仓止盈价 (" + px(alignedPx, sym) + ") 必须高于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    } else if(isBuy && alignedPx >= curM){
      toast("⚠ 空仓止盈价 (" + px(alignedPx, sym) + ") 必须低于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    }
  }

  toast("正在修改 " + disp(sym) + " " + oi.kind + " 价格至 " + px(alignedPx, sym) + "…");

  // 构造新单参数
  const isTrig = oi.trig;
  const pxStr = fmtPx(alignedPx, sym);
  const orderType = oldOrder.type || (isTrig ? "STOP_MARKET" : "LIMIT");
  const newOrd = {
    symbol: sym,
    side: oldOrder.side,
    type: orderType
  };

  // 确定数量与减仓属性
  let q = +oldOrder.origQty || +oldOrder.quantity || +oldOrder.totalQty || 0;
  if(!(q > 0)){
    const p = posOf(sym).find(x => oldOrder.side === (x.amt > 0 ? "SELL" : "BUY"));
    if(p && Math.abs(p.amt) > 0) q = Math.abs(p.amt);
  }

  if(oldOrder.positionSide) newOrd.positionSide = oldOrder.positionSide;
  
  if(oldOrder.closePosition && !q){
    newOrd.closePosition = "true";
  } else if(q > 0){
    newOrd.quantity = fmtSz(alignSz(q, sym), sym);
    if(!S.dual && oi.ro) newOrd.reduceOnly = "true";
  } else if(isTrig && oi.ro){
    newOrd.closePosition = "true";
  }

  if(oi.isEntry && curM > 0){
    const shouldBeBreakout = (isBuy && alignedPx > curM) || (isSell && alignedPx < curM);
    if(shouldBeBreakout){
      newOrd.type = "STOP_MARKET";
      newOrd.stopPrice = pxStr;
      newOrd.triggerPrice = pxStr;
      newOrd.workingType = oldOrder.workingType || WORK;
      newOrd.priceProtect = "true";
      delete newOrd.price;
      delete newOrd.timeInForce;
    } else {
      newOrd.type = "LIMIT";
      newOrd.price = pxStr;
      newOrd.timeInForce = oldOrder.timeInForce || TIF;
      delete newOrd.stopPrice;
      delete newOrd.triggerPrice;
    }
  } else if(isTrig){
    newOrd.stopPrice = pxStr;
    newOrd.workingType = oldOrder.workingType || WORK;
    newOrd.priceProtect = "true";
    if(/LIMIT|TAKE_PROFIT$|STOP$/.test(orderType)) newOrd.price = pxStr;
  } else {
    newOrd.price = pxStr;
    newOrd.timeInForce = oldOrder.timeInForce || TIF;
  }

  // 安全修改流程：
  if(oi.isEntry){
    // 入场单：坚决【先撤后挂】！防止双单在穿透瞬间同时成交导致加倍仓位！
    await cancelOrder(sym, oldOrder.orderId || oldOrder.algoId, oldOrder.isAlgo, { escapeLock: true, skipCascade: true });
    let res = await placeOrder(newOrd, "改单挂入 " + disp(sym) + " @" + px(alignedPx, sym));
    const isGood = res && (res.orderId != null || res.algoId != null) && !(res.code != null && +res.code < 0);
    if(isGood){
      const oldOidStr = String(oldOrder.orderId || oldOrder.algoId);
      const newOid = res.orderId != null ? res.orderId : res.algoId;
      if(PENDBR[sym]){
        if(String(PENDBR[sym].oid) === oldOidStr) PENDBR[sym].oid = newOid;
        (PENDBR[sym].items || []).forEach(it => {
          if(String(it.oid) === oldOidStr) it.oid = newOid;
        });
        savePendBr();
      }
      toast("已成功修改 " + disp(sym) + " " + oi.kind + " 至 " + px(alignedPx, sym));
    } else {
      toast("⚠ 入场单撤销成功，但新单提交被拒：" + errText(LAST_ERR || res));
    }
  } else {
    // 保护单（止损 / 止盈）：坚决【先挂后撤】！绝不留保护真空！
    let res = await placeOrder(newOrd, "改单挂入 " + disp(sym) + " @" + px(alignedPx, sym), false, { escapeLock: true });
    const isGood = res && (res.orderId != null || res.algoId != null) && !(res.code != null && +res.code < 0);
    if(isGood){
      await cancelOrder(sym, oldOrder.orderId || oldOrder.algoId, oldOrder.isAlgo, { escapeLock: true });
      toast("已成功修改 " + disp(sym) + " " + oi.kind + " 至 " + px(alignedPx, sym));
    } else {
      const errCode = (LAST_ERR && +LAST_ERR.code) || (res && +res.code) || 0;
      if(errCode === -2022 || errCode === -4013 || errCode === -1013){
        log("modifyOrderPrice: retry cancel-and-replace for " + sym);
        await cancelOrder(sym, oldOrder.orderId || oldOrder.algoId, oldOrder.isAlgo, { escapeLock: true });
        res = await placeOrder(newOrd, "改单挂入 " + disp(sym) + " @" + px(alignedPx, sym), false, { escapeLock: true });
        const retryGood = res && (res.orderId != null || res.algoId != null) && !(res.code != null && +res.code < 0);
        if(retryGood){
          toast("已成功修改 " + disp(sym) + " " + oi.kind + " 至 " + px(alignedPx, sym));
        } else {
          toast("⚠ 新单挂入被拒，正在恢复原止损单…");
          const restoreOrd = Object.assign({}, newOrd, {
            stopPrice: fmtPx(oi.price, sym),
            price: (/LIMIT|TAKE_PROFIT$|STOP$/.test(orderType)) ? fmtPx(oi.price, sym) : undefined
          });
          await placeOrder(restoreOrd, "恢复原止损 " + disp(sym), false, { escapeLock: true });
        }
      } else {
        const errMsg = (LAST_ERR && (LAST_ERR.msg || LAST_ERR.message)) || "交易所拒绝新单";
        toast("⚠ 修改失败：" + errMsg + "，已保留原单 @" + px(oi.price, sym));
        liveLines(true);
      }
    }
  }

  load(true, sym);
}

let ORPHAN_KEY="",ORPHAN_AT=0;
function findOrphans(){
  const out=[];
  if(!S.acct||!S.ordsAt)return out;
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    if(PENDBR&&PENDBR[sym])return;
    const l=(arr||[]).filter(Boolean);
    if(!l.length)return;
    if(l.some(o=>!ordInfo(o).ro))return;
    l.forEach(o=>out.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo}));});
  return out;
}
async function sweepOrphans(auto){
  const orphans=findOrphans();
  if(!orphans.length){
    let dupCount = 0;
    Object.values(S.ords||{}).forEach(arr=>{
      const sls=(arr||[]).filter(o=>ordInfo(o).sl);
      if(sls.length>1) dupCount += (sls.length - 1);
    });
    if(dupCount>0){
      if(!auto){
        const cleaned = await cleanDuplicateOrders();
        clearTradeLines();
        syncTradeLines();
        posView();
        load(true);
        return cleaned;
      }
    }
    ORPHAN_KEY="";if(!auto)toast("没有无持仓的止盈/止损单");return 0;
  }
  if(auto){
    const key=orphans.map(o=>o.sym+":"+o.oid).sort().join(","),t=Date.now();
    if(key===ORPHAN_KEY&&t-ORPHAN_AT<6e5)return orphans.length;
    ORPHAN_KEY=key;ORPHAN_AT=t;
    toast("发现 "+orphans.length+" 张无持仓的孤儿单，可在「持仓」面板一键清理");
    return orphans.length;
  }
  const syms=[...new Set(orphans.map(o=>o.sym))];
  const tasks = [];
  for(const sym of syms){
    tasks.push(send("DELETE","/fapi/v1/allOpenOrders",{symbol:sym},"清理 "+disp(sym)+" 孤儿单",true,{escapeLock:true,skipLoad:true}).catch(()=>{}));
    tasks.push(send("DELETE","/fapi/v1/algoOpenOrders",{symbol:sym},"清理 "+disp(sym)+" 孤儿 Algo 单",true,{escapeLock:true,skipLoad:true}).catch(()=>{}));
    delete S.ords[sym];
  }
  await Promise.allSettled(tasks);
  const dupCleaned = await cleanDuplicateOrders();
  ORPHAN_KEY="";
  clearTradeLines();
  syncTradeLines();
  posView();
  updateTvBtn();
  toast("✔ 已清理 "+orphans.length+" 张孤儿单"+(dupCleaned ? "与 "+dupCleaned+" 张重复挂单" : ""));
  load(true);
  return orphans.length + dupCleaned;
}

async function cleanDuplicateOrders(){
  let cleaned = 0;
  const tasks = [];
  for(const sym of Object.keys(S.ords||{})){
    const sls = (S.ords[sym]||[]).filter(o => ordInfo(o).sl);
    if(sls.length > 1){
      const p = posOf(sym)[0];
      const isLong = p ? p.amt > 0 : true;
      sls.sort((a,b)=>{
        const pA = +(a.stopPrice || a.triggerPrice || 0);
        const pB = +(b.stopPrice || b.triggerPrice || 0);
        const cpA = a.closePosition === true || a.closePosition === "true" ? 1 : 0;
        const cpB = b.closePosition === true || b.closePosition === "true" ? 1 : 0;
        if(cpA !== cpB) return cpB - cpA;
        return isLong ? (pB - pA) : (pA - pB);
      });
      const toCancel = sls.slice(1);
      for(const o of toCancel){
        tasks.push(
          cancelOrder(sym, o.orderId || o.algoId, o.isAlgo, { escapeLock: true, skipLoad: true, silent: true })
            .then(res => { if(okAll(res) || (res && res.code === 200)) cleaned++; })
        );
      }
    }
  }
  if(tasks.length > 0){
    await Promise.allSettled(tasks);
  }
  if(cleaned > 0) toast("已自动清理 "+cleaned+" 张多余重复挂单（保留最保守止损）");
  return cleaned;
}

/* 一键全撤所有挂单（支持并发全撤所有币种的普通入场单与条件止盈止损单） */
async function cancelAllOrders(confirmFirst = true){
  if(!HASKEY && !DRY_RUN){
    toast("⚠ 未配置 API Key，无法向交易所发起撤单！", true);
    if(typeof openKey === "function") openKey();
    return 0;
  }
  const allOrds = [];
  Object.values(S.ords || {}).forEach(arr => (arr || []).forEach(o => { if(o) allOrds.push(o); }));
  const pbKeys = Object.keys(PENDBR || {});
  if(!allOrds.length && !pbKeys.length){
    toast("当前没有任何挂单或待入场单", true);
    return 0;
  }
  const totalCount = allOrds.length || pbKeys.length;
  if(confirmFirst){
    const ok = confirm("确认撤销当前全部 " + totalCount + " 个挂单？\n（将撤销所有币种的普通入场单与条件止盈止损单）");
    if(!ok) return 0;
  }

  toast("正在并发全撤所有挂单，请稍候…", true);

  const syms = [...new Set([...Object.keys(S.ords || {}), ...pbKeys])].filter(Boolean);
  const tasks = [];
  for(const sym of syms){
    tasks.push(
      send("DELETE", "/fapi/v1/allOpenOrders", { symbol: sym }, "全撤 " + disp(sym) + " 标准挂单", true, { escapeLock: true, skipLoad: true, ms: 8000 })
        .catch(err => ({ _err: err, sym, type: "standard" }))
    );
    tasks.push(
      send("DELETE", "/fapi/v1/algoOpenOrders", { symbol: sym }, "全撤 " + disp(sym) + " 条件挂单", true, { escapeLock: true, skipLoad: true, ms: 8000 })
        .catch(err => ({ _err: err, sym, type: "algo" }))
    );
  }

  await Promise.allSettled(tasks);

  // 清除本地待入场与挂单状态
  PENDBR = {};
  savePendBr();
  S.ords = {};
  S.ordsAt = Date.now();
  ORPHAN_KEY = "";

  // 彻底清除图表上所有残留挂单线并刷新 UI
  clearTradeLines();
  syncTradeLines();
  posView();
  updateTvBtn();

  toast("✔ 已全撤所有挂单（涉及 " + syms.length + " 个币种，共 " + totalCount + " 笔挂单）", true);

  // 异步对账确认
  load(true);
  return totalCount;
}

/* ================= 提交层与订单路由 ================= */
let LAST_ERR=null;
const ERRH={"-5022":"只挂单（GTX）会立刻成交被拒（已自动调整至盘口价重试）",
  "-2021":"触发价已被行情穿透，交易所拒挂",
  "-1111":"价格或数量精度不对（tick / stepSize）",
  "-1013":"不满足交易所的最小下单量或价格过滤器",
  "-4164":"名义价值低于交易所下限（约 5 USDC）",
  "-2019":"保证金不足",
  "-4131":"对手价太远，撮合保护拒单",
  "-2011":"撤单失败：这张单已经不在了",
  "-2027":"超出该杠杆档位下的最大可开名义价值",
  "-4061":"持仓模式不匹配（请在币安设置单向/双向持仓）",
  "-1115":"订单有效方式（timeInForce）不合法",
  "-1102":"缺少必要参数或参数格式不符",
  "-2022":"ReduceOnly 减仓单冲突被拒",
  "-4028":"所选杠杆倍数超过该币种允许的最大上限",
  "-4120":"请使用 Algo Order API 接口提交条件单",
  "-4411":"未签署 TradFi 协议：该品种（如美股/大宗）需先在币安 App 或网页端打开并同意协议"};
function errText(e){
  const c=e&&e.code!=null?String(e.code):"";
  const m=(e&&(e.msg||e.message))||"";
  if(ERRH[c]) return ERRH[c]+"（"+c+"）";
  if(/TradFi-Perps agreement/i.test(m)) return "未签署 TradFi 协议：该品种需先在币安 App 或网页端同意协议（-4411）";
  return m || ("错误 "+c);
}

async function send(method,path,params,msg,silent,opt={}){
  const isEscape = !!opt.escapeLock || opt.isExit || (params && (params.closePosition === "true" || params.reduceOnly === "true")) || method === "DELETE";
  if(LOCK && !isEscape){toast("行情异常，交易已锁定："+LOCK);return null;}
  if(INFLIGHT && !isEscape){toast("上一笔请求还在处理，请稍候");return null;}
  if(DRY_RUN){
    console.log("[DRY RUN] send:", method, path, params);
    toast("【演练模式 DRY_RUN】"+msg+"：已记录请求（未真实下单）");
    return {orderId:888888,algoId:888888,clientOrderId:params.newClientOrderId||params.clientAlgoId||"dryrun"};
  }
  if(!HASKEY){copyJson({method,path,params},msg+"：未配置 API Key/Secret → 已复制请求 JSON");return null;}
  INFLIGHT=true;LAST_ERR=null;try{render();}catch(e){}
  const t0=Date.now();
  try{
    const res=await priv(method,path,params,opt.ms,opt);
    const errs=errsOf(res);
    if(errs.length){LAST_ERR=errs[0];toast("被拒："+errs.map(errText).join(" / ").slice(0,140));return res;}
    if(!silent)toast(msg+" 已提交");
    return res;
  }catch(e){
    if(e.code===-1021){await syncTime();toast("时间不同步已重新校时，请再点一次");return null;}
    if(e.code===-4061){S.dual=null;load(true);
      toast("持仓模式变了，已重新读取账户设置，请再点一次");return null;}
    if(e.timeout||!e.code){
      toast("提交无响应，正在精准对账…（"+(e.message||e)+"）");
      const cid = params && (params.newClientOrderId || params.clientAlgoId);
      if(cid){
        const isAlgo = path.includes("algo");
        try{
          const check = await priv("GET", isAlgo ? "/fapi/v1/algoOrder" : "/fapi/v1/order",
            isAlgo ? {symbol:params.symbol,clientAlgoId:cid} : {symbol:params.symbol,origClientOrderId:cid},
            5000, {escapeLock:true});
          if(check && (check.orderId || check.algoId)){
            toast("精准对账成功：订单已在交易所 (" + (check.status || check.algoStatus || "已挂入") + ")");
            return check;
          }
        }catch(recErr){
          log("cid recon err " + recErr.message);
        }
      }
      await reconcile(t0-5000);
      return null;
    }
    LAST_ERR=e;toast(keyHint(e)||("被拒："+errText(e)).slice(0,140));
    log("send err "+e.code+" "+e.message);
    return null;
  }finally{
    INFLIGHT=false;
    try{render();}catch(e){}
    if(!opt.skipLoad) load(true, params && params.symbol);
  }
}

async function placeOrder(ord, label, silent, opt={}){
  const escapeOpt = Object.assign({}, opt);
  if(ord.closePosition === true || ord.closePosition === "true" || ord.reduceOnly === true || ord.reduceOnly === "true"){
    escapeOpt.escapeLock = true;
  }
  const cid = ord.newClientOrderId || ord.clientAlgoId || ("bn" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));

  // 1. 判断是否为条件单（止损/止盈/突破单）
  // 币安新规：所有条件单必须通过 POST /fapi/v1/algoOrder (algoType="CONDITIONAL", triggerPrice)
  const isAlgo = /STOP|TAKE_PROFIT|TRAILING/.test(ord.type) || ord.algoType === "CONDITIONAL" || ord.isAlgo;
  
  if(isAlgo){
    const trig = ord.triggerPrice || ord.stopPrice;
    const cleanType = ord.type || ord.orderType || "STOP_MARKET";
    const p = {
      algoType: "CONDITIONAL",
      symbol: ord.symbol,
      side: ord.side,
      type: cleanType,
      triggerPrice: String(trig),
      clientAlgoId: cid,
      newClientOrderId: cid
    };
    if(ord.positionSide) p.positionSide = ord.positionSide;
    
    if(ord.closePosition === true || ord.closePosition === "true"){
      p.closePosition = "true";
      delete p.quantity;
      delete p.reduceOnly;
    } else if(ord.quantity){
      p.quantity = String(ord.quantity);
      if(ord.reduceOnly === true || ord.reduceOnly === "true") p.reduceOnly = "true";
    } else {
      p.closePosition = "true";
      delete p.quantity;
      delete p.reduceOnly;
    }

    if(ord.price && /LIMIT|TAKE_PROFIT$|STOP$/.test(cleanType)){
      p.price = String(ord.price);
    }
    if(ord.workingType) p.workingType = ord.workingType;
    if(ord.priceProtect) p.priceProtect = String(ord.priceProtect).toUpperCase();

    let res = await send("POST", "/fapi/v1/algoOrder", p, label, silent, escapeOpt);
    
    // 双向兼容：如果报不支持 algoOrder，则回退到传统 /fapi/v1/order
    if(!okAll(res) && LAST_ERR && (LAST_ERR.code === -4120 || LAST_ERR.code === -1102 || LAST_ERR.code === -4003)){
      log("placeOrder fallback to /fapi/v1/order for " + ord.symbol);
      const cleanOrd = Object.assign({}, ord);
      delete cleanOrd.isAlgo;
      delete cleanOrd.algoType;
      delete cleanOrd.orderType;
      cleanOrd.stopPrice = trig;
      delete cleanOrd.triggerPrice;
      cleanOrd.newClientOrderId = cid;
      res = await send("POST", "/fapi/v1/order", cleanOrd, label, silent, escapeOpt);
    }
    return res;
  } else {
    // 2. 普通限价单/市价单：通过官方标准 POST /fapi/v1/order
    const cleanOrd = Object.assign({}, ord);
    delete cleanOrd.isAlgo;
    delete cleanOrd.algoType;
    delete cleanOrd.orderType;
    delete cleanOrd.triggerPrice;
    cleanOrd.newClientOrderId = cid;

    let res = await send("POST", "/fapi/v1/order", cleanOrd, label, silent, escapeOpt);
    
    // 双向兼容：若报 -4120 则自动切换到 algoOrder 重试
    if(!okAll(res) && LAST_ERR && LAST_ERR.code === -4120){
      log("placeOrder retry on /fapi/v1/algoOrder for " + ord.symbol);
      const trig = ord.triggerPrice || ord.stopPrice || ord.price;
      const p = {
        algoType: "CONDITIONAL",
        symbol: ord.symbol,
        side: ord.side,
        type: ord.type || "STOP_MARKET",
        triggerPrice: String(trig),
        clientAlgoId: cid,
        newClientOrderId: cid
      };
      if(ord.positionSide) p.positionSide = ord.positionSide;
      if(ord.quantity) p.quantity = String(ord.quantity);
      if(ord.price) p.price = String(ord.price);
      res = await send("POST", "/fapi/v1/algoOrder", p, label, silent, escapeOpt);
    }
    return res;
  }
}

async function reconcile(sinceMs){
  if(!HASKEY){toast("未配置 API Key，无法对账，请手动核对");return null;}
  await new Promise(r=>setTimeout(r,1500));
  const t0=sinceMs||Date.now()-120000;

      priv("GET","/fapi/v2/account",{}),priv("GET","/fapi/v2/positionRisk",{}),
      priv("GET","/fapi/v1/openOrders",{}),
      priv("GET","/fapi/v1/userTrades",{symbol:S.sym,startTime:Math.floor(t0)}).catch(()=>[])]);
    applyAcct(acc,pos,od);posView();render();syncTradeLines();

async function ensureLev(target){
  if(!HASKEY) return true;
  const sym = S.sym;
  const cp = curPos();
  let want = Math.max(1, Math.round(target || S.lev || LEV_DEF));
  
  // 1. 若当前品种已有持仓，自动沿用已有持仓的杠杆倍数
  if(cp && cp.amt !== 0){
    const cur = cp.lev || 0;
    if(cur > 0 && cur !== want){
      S.lev = cur;
      S.levSet[sym] = cur;
      savePref();
    }
    return true;
  }

  // 2. 如果已确认设置过该倍数，直接放行
  if(S.levSet[sym] === want) return true;

  // 3. 检查品种最大允许杠杆并自动适配
  const maxL = S.maxLev[sym] || (fOf(sym).maxLev) || 125;
  if(want > maxL){
    want = maxL;
    S.lev = want;
  }

  // 4. 调用币安官方接口调整杠杆
  try {
    const res = await send("POST", "/fapi/v1/leverage", { symbol: sym, leverage: want }, "设置杠杆 " + want + "x", true);
    if(res && (+res.leverage > 0)){
      S.levSet[sym] = +res.leverage;
      S.lev = +res.leverage;
      return true;
    }
    
    // 检查具体报错原因
    if(LAST_ERR){
      const errC = +LAST_ERR.code;
      if(errC === -2015 || errC === -1002){
        toast("⚠ 失败：API Key 缺少合约交易权限或 IP 未加白名单（" + errC + "）");
        return false;
      }
      if(errC === -4028){
        toast("⚠ 杠杆 " + want + "x 超过该品种上限，已调整重试");
        return true;
      }
    }
    
    // 降级保护：如果账户本身已有当前杠杆，不阻断下单
    if(S.levSet[sym] && S.levSet[sym] > 0){
      log("ensureLev fallback to existing leverage " + S.levSet[sym]);
      return true;
    }
    return true; // 放行下单，交由下单接口撮合
  } catch(e) {
    log("ensureLev err " + (e && e.message));
    return true;
  }
}
async function closePos(key, isMarket = false){
  const p=S.pos[key];if(!p)return;
  const sym=p.sym,lg=p.amt>0,q=alignSz(Math.abs(p.amt),sym);
  if(!(q>0)){toast("持仓数量小于最小下单精度");return;}
  const ps=p.side==="BOTH"?(lg?"LONG":"SHORT"):p.side;

  if(isMarket){
    p.closing = "pending";
    posView();
    // 修正：币安普通市价平仓必须带 quantity 与 reduceOnly，绝不对普通市价单使用 closePosition
    const o={symbol:sym,side:lg?"SELL":"BUY",type:"MARKET",quantity:fmtSz(q,sym)};
    if(S.dual)o.positionSide=ps;
    else o.reduceOnly="true";
    try{
      const res = await send("POST","/fapi/v1/order",o,"市价强平 "+disp(sym),false,{escapeLock:true,isExit:true});
      if(res && res.code != null && +res.code < 0){
        p.closing = "failed";
        p.closeErr = errText(res);
        posView();
        toast("⚠ " + disp(sym) + " 市价平仓失败：" + p.closeErr, true);
      } else {
        if(DRY_RUN){ delete S.pos[key]; posView(); syncTradeLines(); updateTvBtn(); }
        else { toast("✔ 已发出 " + disp(sym) + " 市价平仓指令，等待对账清零…", true); load(true); }
      }
    }catch(err){
      p.closing = "failed";
      p.closeErr = err && err.message ? err.message : "网络超时";
      posView();
      toast("⚠ " + disp(sym) + " 市价平仓异常：" + p.closeErr, true);
    }
    return;
  }

  const m=mid(sym);
  if(!isFinite(m)||m<=0){toast("无法获取市价，已取消平仓");return;}
  const lim=alignPx(lg?m*(1+CLOSE_OFF):m*(1-CLOSE_OFF),sym,lg?1:-1);
  const o={symbol:sym,side:lg?"SELL":"BUY",type:"LIMIT",timeInForce:TIF,
    price:fmtPx(lim,sym),quantity:fmtSz(q,sym)};
  if(S.dual)o.positionSide=ps;
  else o.reduceOnly="true";
  await send("POST","/fapi/v1/order",o,"挂单平仓 "+disp(sym)+" @ "+px(lim,sym), false, { escapeLock: true, isExit: true });

  // 3.5 秒后若持仓仍在，醒目提示建议市价强平
  setTimeout(()=>{
    const curP=S.pos[key];
    if(curP&&Math.abs(curP.amt)>0){
      toast("⚠ "+disp(sym)+" 限价挂单平仓尚未成交，行情剧烈时建议点击【市价平】！", true);
    }
  }, 3500);
}

/* 一键市价全平（并发向币安发出全部活跃持仓的市价紧急全平减仓指令） */
async function closeAllPositions(confirmFirst = true){
  if(!HASKEY && !DRY_RUN){
    toast("⚠ 未配置 API Key，无法向交易所发起平仓！", true);
    if(typeof openKey === "function") openKey();
    return 0;
  }
  const activeEntries = Object.entries(S.pos || {}).filter(([_, p]) => p && Math.abs(p.amt) > 0);
  if(!activeEntries.length){
    toast("当前没有任何持仓", true);
    return 0;
  }
  if(confirmFirst){
    const ok = confirm("⚠ 紧急全平确认：\n确认以市价全平当前全部 " + activeEntries.length + " 个持仓？\n（将以对手方市价立即撮合清仓脱身）");
    if(!ok) return 0;
  }

  toast("正在并发市价全平 " + activeEntries.length + " 个持仓…", true);

  // 1. 状态机：标记为平仓中，界面立即渲染并禁用重复点击
  for(const [k, p] of activeEntries){
    p.closing = "pending";
  }
  posView();

  const tasks = [];
  for(const [k, p] of activeEntries){
    const sym = p.sym, lg = p.amt > 0, q = alignSz(Math.abs(p.amt), sym);
    if(!(q > 0)){
      p.closing = "failed";
      p.closeErr = "数量无效";
      continue;
    }
    const ps = p.side === "BOTH" ? (lg ? "LONG" : "SHORT") : p.side;
    // 修正：币安普通市价平仓必须带 quantity 与 reduceOnly，绝不对普通市价单使用 closePosition
    const o = { symbol: sym, side: lg ? "SELL" : "BUY", type: "MARKET", quantity: fmtSz(q, sym) };
    if(S.dual) o.positionSide = ps;
    else o.reduceOnly = "true";
    tasks.push(
      send("POST", "/fapi/v1/order", o, "市价全平 " + disp(sym), true, { escapeLock: true, isExit: true, skipLoad: true, ms: 8000 })
        .then(res => {
          const ok = okAll(res);
          if(!ok){
            p.closing = "failed";
            p.closeErr = errText(res);
          }
          return { k, p, sym, res, ok };
        })
        .catch(err => {
          p.closing = "failed";
          p.closeErr = err && err.message ? err.message : "网络失败";
          return { k, p, sym, err, ok: false };
        })
    );
  }

  const results = await Promise.allSettled(tasks);
  const successCount = results.filter(r => r.status === "fulfilled" && r.value && r.value.ok).length;

  // 严禁乐观删除！
  // 演练模式下（DRY_RUN）模拟清空成功持仓；平仓失败的持仓坚决保留在界面中！
  if(DRY_RUN){
    activeEntries.forEach(([k, p]) => {
      if(p.closing !== "failed") delete S.pos[k];
    });
  }

  posView();
  syncTradeLines();
  updateTvBtn();

  if(successCount === activeEntries.length){
    toast("✔ 已成功发出全部 " + activeEntries.length + " 个持仓市价全平指令，等待对账确认…", true);
  } else {
    toast("⚠ 已发出 " + activeEntries.length + " 个持仓全平请求（成功 " + successCount + " 个，失败 " + (activeEntries.length - successCount) + " 个，未平仓位已保留）", true);
  }

  load(true);
  return activeEntries.length;
}

let PENDBR;try{PENDBR=JSON.parse(localStorage.getItem("bn_pendbr")||"{}")||{};}catch(e){PENDBR={};}

function prunePendBr(){
  if(!S.acct||!S.ordsAt)return;
  let ch=false;
  const now = Date.now();
  Object.keys(PENDBR).forEach(sym=>{
    const b=PENDBR[sym]||{};
    if(!Array.isArray(b.items)){
      const oldB = Object.assign({}, b);
      delete oldB.items;
      b.items = (oldB.oid || oldB.tp != null || oldB.sl != null) ? [oldB] : [];
    }
    const hasPos = posOf(sym).length > 0;
    const openOids = new Set((S.ords[sym]||[]).map(o => String(o.orderId || o.algoId)));

    if(!hasPos){
      if(S.ordsAt <= (b.ts||0) + 20000) return;
      const hasEntry = (S.ords[sym]||[]).filter(Boolean).some(o=>!ordInfo(o).ro);
      const stale = now - (b.ts||0) > PENDBR_TTL;
      if(hasEntry && !stale) return;
      delete PENDBR[sym]; ch=true;
      log("pendbr pruned "+sym+(stale?" (ttl)":" (entry gone)"));
    } else {
      const origLen = b.items.length;
      b.items = b.items.filter(it => {
        const entryStillPending = it.oid && openOids.has(String(it.oid));
        const tpPending = it.tp != null && !it.tpFbDone && !it.tpOid;
        const slPending = it.sl != null && !it.slDone;
        return entryStillPending || tpPending || slPending;
      });
      if(b.items.length !== origLen) ch = true;
      if(b.items.length === 0){
        delete PENDBR[sym]; ch = true;
        log("pendbr all items done for "+sym);
      }
    }
  });
  if(ch)savePendBr();
}

async function sweepStaleEntries(){
  if(!S.acct||!S.ordsAt)return;
  const away=AWAY_TTL>0&&LAST_ALIVE>0&&AWAY>=AWAY_TTL;
  if(!ENTRY_TTL&&!away)return;
  const tNow=Date.now(),kill=[];
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    (arr||[]).filter(Boolean).forEach(o=>{
      if(ordInfo(o).ro)return;
      const t=+o.time||+o.updateTime||0;if(!t)return;
      if(away&&t<LAST_ALIVE){kill.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo,why:"away"});return;}
      if(ENTRY_TTL&&tNow-t>ENTRY_TTL)kill.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo,why:"ttl"});});});
  for(const k of kill){
    await cancelOrder(k.sym,k.oid,k.isAlgo);

      ?" 入场单在网页关闭的 "+durTxt(AWAY)+" 里没成交，已自动撤单"
      :" 入场单挂了 "+durTxt(ENTRY_TTL)+" 没成交，已自动撤单"));}
}

  return o;
}

async function firePendingBracket(sym){
  if(BC_CH && !IS_LEADER) return;
  const b=PENDBR[sym];if(!b)return;
  if(BRBUSY.has(sym))return;
  const p=posOf(sym).find(x=>(x.amt>0)===(b.side==="BUY"));
  if(!p)return;
  BRBUSY.add(sym);
  try{
    const lg=p.amt>0,ps=p.side==="BOTH"?(lg?"LONG":"SHORT"):p.side;
    const live=(S.ords[sym]||[]).filter(Boolean).map(o=>ordInfo(o));
    const left=live.some(i=>!i.ro);

    // 严禁反向信任本地旧标志，严格由交易所实况 live 订单推导！
    const hasLiveSl = live.some(i=>i.sl && i.ro);
    b.slDone = hasLiveSl;

    const liveTps = live.filter(i=>i.tp && i.ro);
    const hasLiveTp = liveTps.length > 0;
    if(hasLiveTp) b.tpFbDone = true;

    if(!Array.isArray(b.items)){
      const oldB = Object.assign({}, b);
      delete oldB.items;
      b.items = (oldB.oid || oldB.tp != null || oldB.sl != null) ? [oldB] : [];
    }

    // 1. 止损补挂：若当前无有效实况止损单，挂出保护全仓的止损（取各单中最保守价）
    let slOrder = null;
    if(b.sl!=null && !hasLiveSl){
      const safeSl = b.items.reduce((acc, it) => {
        if(it.sl == null) return acc;
        if(acc == null) return +it.sl;
        return lg ? Math.min(acc, +it.sl) : Math.max(acc, +it.sl);
      }, +b.sl);
      slOrder = exitOrder(sym, lg, alignPx(safeSl, sym, lg?1:-1), ps, Math.abs(p.amt));
    }

    // 2. 独立止盈补挂：多笔不同入场独立按其自身数量与止盈价补挂
    const totalLiveTpQty = liveTps.reduce((sum, o) => sum + (+o.size || 0), 0);
    const totalPosQty = Math.abs(p.amt);
    let remainingCapacity = Math.max(0, alignSz(totalPosQty - totalLiveTpQty, sym));

    const tpTasks = [];
    const openOids = new Set((S.ords[sym]||[]).map(o => String(o.orderId || o.algoId)));

    for(const it of b.items){
      if(it.tp == null) continue;
      // 检查此 item 是否已在币安挂出
      const itemLive = liveTps.some(o => (it.tpOid && String(o.oid || o.orderId) === String(it.tpOid)) || Math.abs(o.price - it.tp) < 1e-6);
      if(itemLive){
        it.tpFbDone = true;
        continue;
      }
      // 若该 item 对应的入场单还在未成交挂单中且容量不足，则等待成交
      const entryStillPending = it.oid && openOids.has(String(it.oid));
      if(entryStillPending && remainingCapacity < (+it.qty || 0)){
        continue;
      }
      const reqQty = alignSz(+it.qty || remainingCapacity, sym);
      const curQty = Math.min(reqQty, remainingCapacity);
      if(curQty > 0){
        const tpOrd = {
          symbol: sym,
          side: lg ? "SELL" : "BUY",
          type: "LIMIT",
          timeInForce: TIF,
          quantity: fmtSz(curQty, sym),
          price: fmtPx(alignPx(it.tp, sym, lg ? 1 : -1), sym),
          newClientOrderId: "tp_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)
        };
        if(S.dual) tpOrd.positionSide = ps;
        else tpOrd.reduceOnly = "true";
        tpTasks.push({ item: it, ord: tpOrd, qty: curQty });
        remainingCapacity = Math.max(0, alignSz(remainingCapacity - curQty, sym));
      }
    }

    if(!slOrder && !tpTasks.length){
      const allItemsDone = b.items.every(it => {
        const entryGone = !it.oid || !openOids.has(String(it.oid));
        const tpDone = it.tp == null || it.tpFbDone || !!it.tpOid;
        return entryGone && tpDone;
      });
      if(allItemsDone && hasLiveSl){
        delete PENDBR[sym];
        savePendBr();
      }
      return;
    }

    const good = x => x && (x.orderId != null || x.algoId != null) && !(x.code != null && +x.code < 0);

    // 挂止损
    if(slOrder){
      const res = await placeOrder(slOrder, "入场已成交，自动挂止损", true, {escapeLock: true});
      if(good(res)){
        b.slDone = true;
        b.items.forEach(it => it.slDone = true);
        savePendBr();
      }
    }

    // 挂各笔独立止盈
    for(const task of tpTasks){
      const res = await placeOrder(task.ord, "入场已成交，自动挂独立止盈", true, {escapeLock: true});
      if(good(res)){
        task.item.tpFbDone = true;
        task.item.tpOid = res.algoId || res.orderId;
        task.item.tpQty = task.qty;
        savePendBr();
        toast(disp(sym) + " 独立止盈 " + sz(task.qty, sym) + " @" + px(task.item.tp, sym) + " 已挂入");
      }
    }
    savePendBr();

    const allItemsDone = b.items.every(it => {
      const entryGone = !it.oid || !openOids.has(String(it.oid));
      const tpDone = it.tp == null || it.tpFbDone || !!it.tpOid;
      return entryGone && tpDone;
    });
    if(allItemsDone && hasLiveSl){
      delete PENDBR[sym];
      savePendBr();
      log("bracket all ok for " + sym);
    }
  }catch(e){
    b.tries=(b.tries||0)+1;savePendBr();log("bracket throw "+sym+" "+e);
    toast("⚠ "+disp(sym)+" 止损补挂异常（当前裸仓），将重试");
    setTimeout(()=>{try{firePendingBracket(sym);}catch(_){}},BRACKET_RETRY);
  }finally{BRBUSY.delete(sym);}
}

/* ================= 独立裸仓看门狗（每 10 秒巡检：声光报警 + 自动保底补挂） ================= */
const WDBUSY = new Set();
async function slWatchdog(){
  if((!HASKEY && !DRY_RUN) || (BC_CH && !IS_LEADER)) return;
  const positions = Object.values(S.pos || {}).filter(p => p && Math.abs(p.amt) > 0);

  }
  if(S.ordsStale && Date.now() - (S.ordsStaleAt || 0) < 30000){
    log("slWatchdog: skip due to ordsStale (network fault tolerance)");
    return;
  }
  let nakedSyms = [];
  for(const p of positions){
    const sym = p.sym;
    if(WDBUSY.has(sym)) continue;
    const lg = p.amt > 0;
    const live = (S.ords[sym] || []).filter(Boolean).map(o => ordInfo(o));
    let hasLiveSl = live.some(i => i.sl && i.ro);

    // 实时复核：防止推送延迟导致重复补挂
    if(!hasLiveSl){

          priv("GET", "/fapi/v1/openOrders", { symbol: sym }, 5000, { escapeLock: true }).catch(e => { checkFailed = true; return null; }),
          priv("GET", "/fapi/v1/openAlgoOrders", { symbol: sym }, 5000, { escapeLock: true }).catch(e => { checkFailed = true; return null; })
        ];

        if(checkFailed || cStd === null || cAlgo === null){
          // 网络查询异常，不能判定为无挂单，暂缓报警
          continue;
        }
        const checkAll = [...(Array.isArray(cStd) ? cStd : []), ...(Array.isArray(cAlgo) ? cAlgo : [])];
        if(checkAll.some(o => ordInfo(o).sl && ordInfo(o).ro)){
          hasLiveSl = true;
          S.ords[sym] = checkAll;
        }
      }catch(chkErr){
        continue;
      }
    }

    if(!hasLiveSl){
      WDBUSY.add(sym);
      try{
        nakedSyms.push(sym);

        wBeep();
        // 科学止损推导梯队：1) PENDBR 记录 -> 2) 1% 风险预算反推 -> 3) 紧急市价平仓
        let slPx = null;
        if(PENDBR[sym] && PENDBR[sym].sl && +PENDBR[sym].sl > 0){
          slPx = +PENDBR[sym].sl;
        } else {
          slPx = TradeCore.riskBudgetSl(p.entry, Math.abs(p.amt), equity(), F.risk || 1.0, lg);
        }

        if(slPx && slPx > 0){
          slPx = alignPx(slPx, sym, lg ? -1 : 1);
          const ps = p.side === "BOTH" ? (lg ? "LONG" : "SHORT") : p.side;
          const slOrd = exitOrder(sym, lg, slPx, ps, Math.abs(p.amt));
          log("watchdog auto sl " + sym + " @" + slPx);
          toast("⚠ 看门狗发现裸仓！正在为 " + disp(sym) + " 自动补挂市价止损单 @" + px(slPx, sym), true);
          await placeOrder(slOrd, "看门狗补止损", true, { escapeLock: true });
          await load(true, sym);
        } else {
          // 极端异常无有效止损价，直接市价强平避险
          toast("⚠ " + disp(sym) + " 裸仓且无法计算安全止损，执行紧急市价平仓避险！", true);
          await closePos(posKey(sym, p.side), true);
        }
      }catch(err){
        log("watchdog err " + err.message);
      }finally{
        WDBUSY.delete(sym);
      }
    }
  }
  if(nakedSyms.length){
    if(elAlert){
      elAlert.style.display = "block";
      elAlert.textContent = "⚠ 严重警告：发现裸仓！【" + nakedSyms.map(disp).join("、") + "】未设止损保护！正在自动补挂…";
    }
  } else {
    if(elAlert) elAlert.style.display = "none";
  }
}
