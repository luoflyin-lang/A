<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2EFE9">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https: wss:; img-src 'self' data:; font-src 'self';">
<title>BN Chart</title>
<!-- 引入 TradeCore 纯函数内核 -->
<script src="./trade-core.js"></script>
<!-- 引入 Lightweight Charts 图表库（优先同域本地/安全 CDN） -->
<script src="./lightweight-charts.standalone.production.js"></script>
<script>
if (typeof LightweightCharts === "undefined") {
  document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"><\/script>');
}
</script>
<style>
/* 彻底隐藏任何 TV / TradingView 插件标志与水印链接（保留图表主体） */
#tv_chart a, #tv-attr-logo, .tv-attr-logo, a[href*="tradingview"] {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

/* 极致护眼配色（iPad/高亮显示屏、长时间盯盘）：
   1) 日间：温润暖羊皮纸底色 #F4F1EA，消灭 255 纯白刺眼蓝光；
   2) 夜间：深邃温润暖灰底色 #171614，消灭纯黑与高亮文字的刺眼眩光；
   3) K 线与指标：选用低饱和松石绿与陶土暖红，柔和不刺眼，久看眼睛不酸胀；
   4) 字体：中性炭黑与暖象牙白，维持 10:1 舒适阅读对比度。 */
:root{--bg:#F4F1EA;--surface:#FAF8F3;--raised:#EAE5DC;--text:#332F28;--dim:rgba(51,47,40,.68);
  --faint:rgba(51,47,40,.45);--line:rgba(51,47,40,.12);
  --up:#3A755D;--down:#A85244;--blue:#3C5A78;--amber:#8B6A2B;
  --ink:#332F28;--onink:#FAF8F3;--cline:rgba(51,47,40,.50);--cbody:#332F28;
  --pop:rgba(250,248,243,.96);--fabbg:rgba(250,248,243,.92);
  --tint:rgba(51,47,40,.06);--cgrid:rgba(51,47,40,.04);--caim:rgba(51,47,40,.75);--chair:rgba(51,47,40,.28);
  color-scheme:light;--mono:"Menlo","Consolas",monospace}
html[data-theme="dark"]{--bg:#171614;--surface:#1F1D1A;--raised:#2C2925;--text:#DDD7CB;
  --dim:rgba(221,215,203,.68);--faint:rgba(221,215,203,.45);--line:rgba(221,215,203,.12);
  --up:#6CA88D;--down:#C27A68;--blue:#8CAECF;--amber:#D8B368;
  --ink:#DDD7CB;--onink:#171614;--cline:rgba(221,215,203,.48);--cbody:#B8B0A2;
  --pop:rgba(31,29,26,.96);--fabbg:rgba(31,29,26,.92);
  --tint:rgba(221,215,203,.07);--cgrid:rgba(221,215,203,.04);--caim:rgba(221,215,203,.70);
  --chair:rgba(221,215,203,.26);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* iPad 专属防整页缩放与滚动穿透 */
html, body {
  background:var(--bg);color:var(--text);
  width:100%;height:100%;height:100dvh;
  position:fixed;top:0;left:0;right:0;bottom:0;
  overflow:hidden;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit;background:none;border:none;outline:none;touch-action:auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}

/* ---- 全屏 TradingView 图表容器 ---- */
#tv_chart{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}

/* ---- 左右 20% 翻币区域视觉轻提示 ---- */
.edge-zone{position:fixed;top:0;bottom:0;width:20vw;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s ease;display:flex;align-items:center;justify-content:center}
.edge-zone.left{left:0}
.edge-zone.right{right:0}
.edge-hint{font-size:28px;color:var(--faint);font-weight:300;user-select:none;opacity:0.25}

/* ---- 左上角：品种与周期点击切换 ---- */
#tl{position:fixed;top:18px;left:22px;z-index:5;display:flex;flex-direction:row;gap:10px;align-items:center}
#name{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0;background:none;user-select:none;-webkit-user-select:none;transition:transform .12s,opacity .15s}
#name:hover{opacity:.8}
#name:active{transform:scale(0.96)}
#name .s{font-size:18px;font-weight:650;letter-spacing:-.01em}
#name .tf-badge{font-size:12px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:6px;background:var(--raised);color:var(--dim)}
#name .caret{font-size:12px;color:var(--faint);margin-left:2px}
#bStar{height:32px;min-width:34px;padding:0 7px;border-radius:9px;font-size:16px;line-height:1;
  color:var(--faint);background:var(--fabbg);box-shadow:0 2px 8px rgba(0,0,0,.04);backdrop-filter:blur(8px);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s,transform .12s}
#bStar:hover{background:var(--raised)}
#bStar:active{transform:scale(0.94)}
#bStar.on{color:var(--amber);background:var(--raised)}

#lockbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;display:none;
  background:var(--ink);border:none;color:var(--onink);
  padding:7px 14px;border-radius:9px;font-size:12.5px}
#lockbar.on{display:block}
body.locked #tv_chart{opacity:.42}

/* ---- 左下角悬浮空白气泡按钮 ---- */
#br{position:fixed;left:18px;bottom:20px;z-index:6;display:flex;align-items:center;gap:8px}
.fab{height:38px;width:38px;min-width:38px;padding:0;border-radius:12px;background:var(--fabbg);
  border:none;box-shadow:0 2px 10px rgba(46,43,38,.07);backdrop-filter:blur(8px);
  display:inline-flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;transition:transform .12s,background .15s}
.fab:hover{background:var(--raised)}
.fab:active{transform:scale(0.94)}
.tv-btn{position:relative}
.tv-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);display:none;position:absolute;top:6px;right:6px}
.tv-btn.hot .tv-dot{display:block}

/* ---- 面板与抽屉 ---- */
#mask{position:fixed;inset:0;background:rgba(46,43,38,.22);opacity:0;pointer-events:none;transition:.18s;z-index:8}
#mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--line);z-index:9;transform:translateX(102%);transition:transform .22s ease;
  display:flex;flex-direction:column;touch-action:pan-y}
.sheet.on{transform:none}
.sh{flex:none;display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sh b{font-size:15px;font-weight:600}
.sh .x{margin-left:auto;width:30px;height:30px;border-radius:8px;color:var(--faint);font-size:16px}
.sh .x:hover{background:var(--raised);color:var(--text)}
.tabs{display:flex;align-items:center;gap:6px}
.tab-btn{font-size:13.5px;font-weight:600;color:var(--faint);padding:5px 12px;border-radius:8px;transition:.15s}
.tab-btn.on{color:var(--text);background:var(--raised)}
.tab-content{display:none;flex:1;flex-direction:column;overflow:hidden}
.tab-content.on{display:flex}

.sbody{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 12px 18px;scrollbar-width:thin;scrollbar-color:var(--raised) transparent;touch-action:pan-y}
.sbody::-webkit-scrollbar{width:6px}.sbody::-webkit-scrollbar-thumb{background:var(--raised);border-radius:6px}
.filt{display:flex;align-items:center;gap:8px;padding:0 18px 10px;font-size:11.5px;color:var(--faint)}
.filt button{padding:3px 9px;border-radius:999px;border:none;font-size:11.5px;color:var(--faint)}
.filt button.on{background:var(--raised);color:var(--text);border-color:transparent}
.ci{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.ci:hover{background:var(--raised)}
.ci.on{background:var(--raised)}
.ci .n{font-size:13.5px;font-weight:550}
.ci .v{display:block;margin-top:1px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.ci .hold{margin-left:6px}
.ci .ttag{font-size:9.5px;padding:1px 5px;border-radius:4px;margin-left:4px;font-weight:600;font-family:var(--mono)}
.ci .ttag.tradfi{background:rgba(217,119,6,.15);color:#D97706}
.ci .ttag.usdc{background:rgba(37,99,235,.15);color:#2563EB}
.ci .natr-hot{color:var(--up);font-weight:650}
.ci .r{margin-left:auto;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ci .r .a{display:block;font-size:13px}
.ci .r .b{display:block;font-size:11px}
.hold{font-size:10px;padding:1px 5px;border-radius:5px;background:var(--raised);color:var(--text)}
#nNatr{font-size:11px;font-family:var(--mono);font-weight:600;padding:2px 6px;border-radius:6px;background:var(--raised);color:var(--dim);margin-left:2px}

.wi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer}
.wi:hover{background:var(--raised)}
.wi.due{background:var(--tint)}
.wi .n{font-size:13.5px;font-weight:550}
.wi .m{display:block;margin-top:1px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.wi .r{margin-left:auto;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.wi .cd{display:block;font-size:13px}
.wi .cd.due{color:var(--amber);font-weight:600}
.wi .dd{display:block;font-size:11px}
.wi .wx{margin-left:6px;width:26px;height:26px;border-radius:7px;color:var(--faint);font-size:13px}
.wi .wx:hover{background:var(--raised);color:var(--text)}
.none{padding:22px 10px;color:var(--faint);font-size:13px;line-height:1.7}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;font-weight:400;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 5px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);opacity:0;
  background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.22);
  border-radius:10px;padding:10px 18px;font-size:13px;font-weight:550;transition:.2s;pointer-events:none;z-index:100;
  max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ---- 下单 HUD 面板 ---- */
.rrbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:3px}
#av{cursor:pointer}
#khud{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;width:380px;max-width:92vw;
  display:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.28);touch-action:auto}
#khud.on{display:block}
#khud .t{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);margin-bottom:14px}
#khud .t b{font-size:16px;color:var(--text);font-weight:600}
#khud .t .x{margin-left:auto;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px}
#khud input{display:block;width:100%;box-sizing:border-box;margin-bottom:8px;padding:11px 12px;
  font-family:var(--mono);font-size:16px;color:var(--text);background:var(--raised);
  border:1px solid var(--line);border-radius:10px}
#khud input:focus{outline:none;border-color:var(--blue)}
#kHint{font-size:11.5px;line-height:1.7;color:var(--faint);margin:10px 0 14px}
#khud .obar{display:flex;gap:8px}
#khud .obar button{flex:1;padding:11px;border-radius:10px;background:var(--raised);font-size:14px;color:var(--text)}
#khud .obar button.b{flex:2;background:var(--ink);color:var(--bg);font-weight:600}
#ohud{position:fixed;left:16px;bottom:80px;z-index:7;width:380px;display:none;
  background:var(--pop);border:none;border-radius:16px;box-shadow:0 8px 32px rgba(46,43,38,.15);
  padding:18px 20px;backdrop-filter:blur(10px);touch-action:pan-y}
#ohud.on{display:block}
#ohud .t{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--faint);margin-bottom:12px}
#ohud .t b{font-size:18px;color:var(--text);font-weight:600}
#ohud .t .x{margin-left:auto;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px}
.ol{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12.5px;color:var(--faint)}
.ol .v{margin-left:auto;font-family:var(--mono);color:var(--text);font-weight:550}
.ol.cur{color:var(--text);font-weight:600}
.ol i{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.ol i.e{background:var(--blue)}.ol i.s{background:var(--down)}.ol i.t{background:var(--up)}
.ol.cur i{box-shadow:0 0 0 3px var(--tint)}
#ohC{font-size:11px;color:var(--faint);line-height:1.55;margin:8px 0 2px}
#ohC b{color:var(--text);font-weight:600}
.obar{display:flex;gap:6px;margin-top:8px}
.obar button{flex:1;height:26px;border-radius:6px;background:var(--raised);font-size:11.5px;color:var(--dim)}
.obar button:hover{color:var(--text)}
#ohGo{height:34px;width:100%;margin-top:8px;border-radius:8px;font-size:13px;font-weight:650}
#ohGo.b{background:var(--up);color:var(--onink)}#ohGo.s{background:var(--down);color:var(--onink)}
#ohGo:disabled{opacity:.35;cursor:not-allowed}
#ohH{font-size:11px;color:var(--amber);margin-top:5px;min-height:14px;line-height:1.4}

/* ---- 图表取数 / 拖拽线 ---- */
#pline{position:fixed;left:0;right:0;height:0;display:none;z-index:10;pointer-events:none;
  border-top:1px dashed var(--cline)}
#pline.aim{border-top:1.5px solid var(--amber)}
#pbub{position:absolute;left:130px;top:-11px;font-family:var(--mono);font-size:12px;
  background:var(--raised);color:var(--text);border-radius:6px;padding:2px 8px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.1)}
#pline.aim #pbub{background:var(--ink);color:var(--onink);font-weight:650}

#dlayer{position:fixed;inset:0;z-index:4;pointer-events:none}
.dl{position:absolute;left:0;right:0;height:0;display:none;border:none !important}
.dl .grip{position:absolute;left:130px;top:-13px;font-size:12px;font-family:var(--mono);font-weight:600;
  border-radius:7px;padding:3px 10px;cursor:ns-resize;pointer-events:auto;touch-action:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.15);user-select:none;-webkit-user-select:none;transition:transform .08s}
.dl .grip:active, .dl .grip.dragging{transform:scale(1.06);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.dl.en .grip{background:var(--blue);color:var(--onink)}
.dl.sl .grip{background:var(--down);color:var(--onink)}
.dl.tp .grip{background:var(--up);color:var(--onink)}
.dl.dyn .grip{left:130px;right:auto;background:var(--pop);color:var(--text);
  border:1px solid var(--line);box-shadow:0 2px 8px rgba(46,43,38,.14)}
.dl.dyn.sl .grip{color:var(--down);border-color:var(--down)}.dl.dyn.tp .grip{color:var(--up);border-color:var(--up)}.dl.dyn.pos .grip{color:var(--blue);border-color:var(--blue)}
.dl.dragging{border-top:1.5px dashed var(--amber) !important;display:block !important;z-index:15}
.dl.dragging.sl{border-top:1.5px dashed var(--down) !important}
.dl.dragging.tp{border-top:1.5px dashed var(--up) !important}
.dl.dragging.en{border-top:1.5px dashed var(--blue) !important}
.dl .xbtn{position:absolute;left:340px;right:auto;top:-13px;width:24px;height:24px;line-height:22px;text-align:center;
  border-radius:7px;background:var(--pop);border:1px solid var(--line);box-shadow:0 1px 6px rgba(46,43,38,.16);color:var(--text);
  font-size:13px;cursor:pointer;pointer-events:auto;user-select:none}

@media(max-width:640px){
  #tl{top:14px;left:16px}
  #br{left:12px;bottom:14px}
  .fab{height:38px;font-size:13px;padding:0 12px}
  #ohud{left:12px;bottom:80px;width:calc(100vw - 24px);padding:14px 16px}
  #pbub,.dl .grip{left:80px}
  .dl.dyn .grip{left:80px}
  .dl .xbtn{left:250px}
}
</style>
<script>
/* 针对 iOS / iPadOS 的手势缩放拦截，彻底杜绝整页被双指缩放变形 */
(function(){
  try{
    var _m=localStorage.getItem("bn_theme")||"auto";
    var _d=_m==="dark"||(_m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme",_d?"dark":"light");
  }catch(e){}

  // 阻止 iOS Safari 默认的整页手势缩放 (gesture)
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, { passive: false });

  // 阻止双击缩放 (Double-tap zoom)
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if(now - lastTouchEnd <= 300){
      if(e.target && !e.target.closest('input, textarea, button')) {
        e.preventDefault();
      }
    }
    lastTouchEnd = now;
  }, { passive: false });
})();
</script>
</head>
<body>
<!-- TradingView 图表挂载节点 -->
<div id="tv_chart"></div>

<!-- 左右 20% 点击切币区域 -->
<div class="edge-zone left"><span class="edge-hint">‹</span></div>
<div class="edge-zone right"><span class="edge-hint">›</span></div>

<div id="nakedAlert" style="display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:100;background:#A85244;color:#FFF;padding:8px 16px;border-radius:10px;font-weight:600;font-size:12.5px;box-shadow:0 4px 20px rgba(0,0,0,0.3);text-align:center;pointer-events:none"></div>

<div id="tl">
  <div id="name" title="点击切换 15m / 1h 周期">
    <span class="s" id="nS">BTC</span>
    <span class="tf-badge" id="nTf">15m</span>
    <span class="natr-badge" id="nNatr" style="display:none">15m NATR --</span>
    <span class="caret">⇄</span>
  </div>
  <button id="bStar" title="标记这个机会（W）：等这根 K 线收盘再下单">☆</button>
</div>

<div id="br">
  <button class="fab tv-btn" id="bTv" title="持仓 & 机会">
    <span class="tv-dot" id="tvDot"></span>
  </button>
</div>

<div id="mask"></div>

<!-- 品种列表抽屉 -->
<aside class="sheet" id="shList">
  <div class="sh">
    <b>免挂单费品种</b>
    <div class="tf-seg" id="listTfSeg" style="display:inline-flex;background:var(--raised);padding:2px;border-radius:8px;gap:2px;margin-left:6px">
      <button class="tf-btn" data-tf="15m" style="border:none;background:transparent;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer;transition:all .15s">15m</button>
      <button class="tf-btn" data-tf="1h" style="border:none;background:transparent;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer;transition:all .15s">1h</button>
    </div>
    <span class="num" style="font-size:11.5px;color:var(--faint);margin-left:auto" id="cnt"></span>
    <button class="x" data-close>✕</button>
  </div>
  <div class="filt"><button class="on" id="fBtn">15m NATR &gt; 0.5% · 额 &gt; $20M</button><span>免挂单费 (USDC / TradFi)</span></div>

function sha256(data){
  const l=data.length;

  b[l]=0x80;

    for(let i=16;i<64;i++){
      const s0=rotr(W[i-15],7)^rotr(W[i-15],18)^(W[i-15]>>>3);
      const s1=rotr(W[i-2],17)^rotr(W[i-2],19)^(W[i-2]>>>10);
      W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0;
    }
    let a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^((~e)&g);
      const temp1=(h+S1+ch+K256[i]+W[i])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&bb)^(a&c)^(bb&c);
      const temp2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+temp1)>>>0;
      d=c;c=bb;bb=a;a=(temp1+temp2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }

  const rdv=new DataView(res.buffer);
  for(let i=0;i<8;i++) rdv.setUint32(i*4,H[i],false);

}
function hmac(keyStr,msgStr){
  let key=typeof keyStr==="string"?utf8(keyStr):keyStr;

  if(key.length>64) key=sha256(key);
  const kPad=new Uint8Array(64);
  kPad.set(key,0);
  const iPad=new Uint8Array(64);
  const oPad=new Uint8Array(64);
  for(let i=0;i<64;i++){
    iPad[i]=kPad[i]^0x36;
    oPad[i]=kPad[i]^0x5c;
  }
  const inner=new Uint8Array(64+msg.length);
  inner.set(iPad,0);
  inner.set(msg,64);
  const innerHash=sha256(inner);

  const outer=new Uint8Array(64+32);
  outer.set(oPad,0);
  outer.set(innerHash,64);
  return sha256(outer);
}

let TOFF=0;

async function syncTime(){
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;
  const tm=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},8000);
  try{const r=await fetch(BASE+"/fapi/v1/time",{signal:ctl?ctl.signal:undefined});const j=await r.json().catch(()=>null);

}
function qs(o){return Object.keys(o).filter(k=>o[k]!==undefined&&o[k]!==null&&o[k]!=="")
  .map(k=>encodeURIComponent(k)+"="+encodeURIComponent(o[k])).join("&");}
function bnErr(j){
  const e=new Error((j&&j.msg)||("code "+((j&&j.code)||"?")));e.code=+((j||{}).code||0);return e;}
async function req(method,path,query,headers,ms,opt={}){
  const isEscape = !!opt.escapeLock || opt.isExit || method === "DELETE";
  if(!isEscape && Date.now()<backoffUntil)throw new Error("backoff");
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;
  const tm=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},ms||15000);
  try{
    const r=await fetch(BASE+path+(query?"?"+query:""),{method,headers:headers||{},signal:ctl?ctl.signal:undefined});
    const j=await r.json().catch(()=>null);
    if(r.status===429||r.status===418||r.status===403){NET.fail++;
      backoffUntil=Math.max(backoffUntil,Date.now()+Math.min(60000,3000*NET.fail));
      throw bnErr(j||{msg:"HTTP "+r.status,code:-r.status});}
    if(j&&j.msg&&j.msg.includes("restricted location")){
      toast("⚠ 币安区域限制：检测到美国/受限节点，请将梯子切换至【台湾/日本/韩国】等非美国节点！");
      throw new Error("币安受限地区IP (Restricted Location)");
    }
    if(j&&j.code!=null&&+j.code<0)throw bnErr(j);
    if(!r.ok)throw bnErr(j||{msg:"HTTP "+r.status});
    NET.info=Date.now();NET.fail=0;backoffUntil=0;return j;
  }catch(e){
    if(e.name==="AbortError")e.timeout=true;
    if(!e.code){NET.fail++;if(NET.fail>=3)backoffUntil=Math.max(backoffUntil,Date.now()+Math.min(30000,2000*NET.fail));}
    throw e;
  }finally{clearTimeout(tm);}
}

function calcNatrFromCandles(klineList){
  if(!klineList || klineList.length < 16) return null;
  // 丢弃最新一根尚未收盘的 K 线，避免盘中跳动
  const closed = klineList.slice(0, -1);
  if(closed.length < 15) return null;

  const trs = [];
  for(let i = 1; i < closed.length; i++){
    const cur = closed[i], prev = closed[i - 1];
    const h = +(cur.h != null ? cur.h : cur[2]);
    const l = +(cur.l != null ? cur.l : cur[3]);
    const pc = +(prev.c != null ? prev.c : prev[4]);
    trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
  }
  if(trs.length < 14) return null;

  // Wilder RMA: 初始取前 14 根简单均值，之后递归平滑
  let atr = trs.slice(0, 14).reduce((a, b) => a + b, 0) / 14.0;
  for(let i = 14; i < trs.length; i++){
    atr = (atr * 13.0 + trs[i]) / 14.0;
  }
  const lastC = closed[closed.length - 1];
  const close = +(lastC.c != null ? lastC.c : lastC[4]);
  return close > 0 ? +((atr / close) * 100).toFixed(3) : null;
}

const _natrFetching = { "15m": false, "1h": false };

const NATR_REFRESH_MS = 60000;

async function fetchSymbolNatr(sym, tf = S.tf){
  try{
    if(sym === S.sym && S.tf === tf && S.kc[sym + "|" + tf]?.k?.length >= 20){
      const natr = calcNatrFromCandles(S.kc[sym + "|" + tf].k);
      if(!S.ctx[sym]) S.ctx[sym] = {};
      S.ctx[sym]["natr_" + tf] = natr;
      return natr;
    }
    const r = await pub("/fapi/v1/klines", { symbol: sym, interval: tf, limit: 30 }, 8000);
    if(Array.isArray(r) && r.length >= 16){
      const natr = calcNatrFromCandles(r);
      if(!S.ctx[sym]) S.ctx[sym] = {};
      S.ctx[sym]["natr_" + tf] = natr;
      return natr;
    }
  }catch(e){}
  return null;
}

async function refreshNatrs(tf = S.tf, force = false){
  if(tf !== "15m" && tf !== "1h") tf = "15m";
  if(_natrFetching[tf]) return;
  if(!force && Date.now() - (_natrAt[tf] || 0) < NATR_REFRESH_MS) return;
  _natrFetching[tf] = true;
  try{
    const targets = S.uni.filter(u => {
      const c = S.ctx[u.name] || {};
      return (+c.volUsd >= VOL_MIN) || (u.name === S.sym) || (posOf(u.name).length > 0) || wHas(u.name);
    });
    if(!targets.length) return;
    const CONCURRENCY = 6;
    for(let i = 0; i < targets.length; i += CONCURRENCY){
      const chunk = targets.slice(i, i + CONCURRENCY);
      await Promise.all(chunk.map(u => fetchSymbolNatr(u.name, tf)));
    }
    _natrAt[tf] = Date.now();
    head();
    if($("#shList").classList.contains("on")) list(true);
  } finally {
    _natrFetching[tf] = false;
  }
}

let lastEmaValue = null;

function calcEmaArray(data, period = 20){
  if(!data || !data.length) return [];
  const k = 2 / (period + 1);
  const emaData = [];
  let ema = data[0].close;
  data.forEach((b, idx) => {
    if(idx === 0) ema = b.close;
    else ema = b.close * k + ema * (1 - k);
    emaData.push({ time: b.time, value: ema });
  });
  lastEmaValue = ema;
  return emaData;
}

function updateChartCandles(rawBars, resetRange){
  if(!candleSeries || !rawBars.length) return;
  const map = new Map();
  rawBars.forEach(x => {
    const timeSec = Math.floor(x.t / 1000);
    map.set(timeSec, { time: timeSec, open: x.o, high: x.h, low: x.l, close: x.c });
  });
  const data = Array.from(map.values()).sort((a, b) => a.time - b.time);

  _programmaticRangeTime = Date.now() + 300;
  candleSeries.setData(data);

  if(data.length > 0){
    const emaData = calcEmaArray(data, 20);
    emaSeries.setData(emaData);

    // K线视口：保持并记忆用户自定义的缩放根数与拖拽平移偏移量（绝不强制覆盖右对齐）
    if(resetRange && tvChart){
      const total = data.length;
      const count = Math.max(15, Math.min(total, CHART_VIEW_STATE.count || 100));
      const rightOffset = (typeof CHART_VIEW_STATE.rightOffset === "number") ? CHART_VIEW_STATE.rightOffset : -4;

      let to = total - rightOffset;
      // 边界容错：防止因币种K线总数极少导致显示越界
      if(to < 10 || to > total + Math.max(100, count * 2)){
        to = total + 4;
      }
      const from = to - count;

      _programmaticRangeTime = Date.now() + 300;
      tvChart.timeScale().setVisibleLogicalRange({ from, to });
    }
  }
}

function useCandles(raw, resetRange){

async function kline(force){
  const reqSym = S.sym, reqTf = S.tf;
  const key=reqSym+"|"+reqTf,c=S.kc[key];

  subCoin(reqSym,reqTf);
  if(!force&&c&&Date.now()-c.t<30000)return;
  try{
    const r=await pub("/fapi/v1/klines",{symbol:reqSym,interval:reqTf,limit:500});
    const raw=(Array.isArray(r)?r:[]).map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}));
    if(raw.length){
      const hasDrawn = !!(c && c.k && c.k.length > 0);
      S.kc[key]={k:raw,t:Date.now()};
      // 防切币竞态条件：确认当前仍是请求的币种和周期
      if(S.sym === reqSym && S.tf === reqTf){
        // 若已用缓存绘制过，网络拉回时仅静默更新数据，绝不破坏用户刚刚调整的视口位置
        useCandles(raw, !hasDrawn);
        if((reqTf === "15m" || reqTf === "1h") && raw.length >= 16){
          if(!S.ctx[reqSym]) S.ctx[reqSym] = {};
          S.ctx[reqSym]["natr_" + reqTf] = calcNatrFromCandles(raw);
          head();
        }
      }
    }
  }catch(e){log("klines err "+e.message);}
}

let ws,WSOK=false,wsTry=0,wsEver=false,wsId=1,WSCONN=0,wsPend=false,ARRON=false;
const SUB={sym:null,tf:null};
function wsSend(o){try{if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true;}}catch(e){}return false;}
function subCoin(sym,tf){
  if(!sym||!tf)return;
  const low=sym.toLowerCase();
  if(SUB.sym&&(SUB.sym!==sym||SUB.tf!==tf))
    wsSend({method:"UNSUBSCRIBE",params:[SUB.sym.toLowerCase()+"@kline_"+SUB.tf],id:wsId++});
  if(SUB.sym&&SUB.sym!==sym){const o=SUB.sym.toLowerCase();
    wsSend({method:"UNSUBSCRIBE",params:[o+"@ticker",o+"@markPrice@1s"],id:wsId++});}
  if(!wsSend({method:"SUBSCRIBE",params:[low+"@kline_"+tf,low+"@ticker",low+"@markPrice@1s"],id:wsId++}))return;
  SUB.sym=sym;SUB.tf=tf;
  MIDGRACE=Date.now()+10000;
}
function subArr(on){
  on=!!on;if(ARRON===on)return;
  ARRON=on;wsSend({method:on?"SUBSCRIBE":"UNSUBSCRIBE",params:["!markPrice@arr@1s"],id:wsId++});
}
function sock(){
  WSCONN=Date.now();
  try{ws=new WebSocket(WSU);}catch(e){setTimeout(sock,3000);return;}
  ws.onopen=()=>{WSOK=true;wsTry=0;NET.ws=Date.now();SUB.sym=null;SUB.tf=null;
    if(ARRON)wsSend({method:"SUBSCRIBE",params:["!markPrice@arr@1s"],id:wsId++});
    subCoin(S.sym,S.tf);
    if(wsEver){tickers().then(head).catch(()=>{});kline(true);}
    wsEver=true;};
  ws.onerror=()=>{WSOK=false;};
  ws.onclose=()=>{WSOK=false;wsPend=true;
    setTimeout(()=>{wsPend=false;sock();},Math.min(30000,2000*Math.pow(2,wsTry++)));};
  ws.onmessage=ev=>{
    NET.ws=Date.now();
    let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    const d=m&&m.data!==undefined?m.data:m;
    if(Array.isArray(d)){
      if(!d.length||d[0].e!=="markPriceUpdate")return;
      NET.mid=Date.now();d.forEach(x=>{if(S.f[x.s])S.mid[x.s]=+x.p;});
      schedule();return;}
    if(!d||!d.e)return;
    if(d.e==="markPriceUpdate"){
      NET.mid=Date.now();if(S.f[d.s])S.mid[d.s]=+d.p;schedule();return;}
    if(d.e==="kline"){
      const x=d.k||{};if(d.s!==S.sym||x.i!==S.tf)return;
      const key=S.sym+"|"+S.tf,c=S.kc[key];if(!c||!c.k.length)return;
      const b={t:+x.t,o:+x.o,h:+x.h,l:+x.l,c:+x.c},last=c.k[c.k.length-1];
      if(last&&last.t===b.t)c.k[c.k.length-1]=b;else if(!last||b.t>last.t)c.k.push(b);
      c.t=Date.now();
      if(candleSeries){
        const timeSec = Math.floor(b.t / 1000);
        candleSeries.update({ time: timeSec, open: b.o, high: b.h, low: b.l, close: b.c });
        if(emaSeries && lastEmaValue != null){
          const k = 2 / 21;
          const liveEma = b.c * k + lastEmaValue * (1 - k);
          emaSeries.update({ time: timeSec, value: liveEma });
        }
        if((S.tf === "15m" || S.tf === "1h") && c.k.length >= 16){
          if(!S.ctx[S.sym]) S.ctx[S.sym] = {};
          S.ctx[S.sym]["natr_" + S.tf] = calcNatrFromCandles(c.k);
          head();
        }
      }
      schedule();return;}
    if(d.e==="24hrTicker"){
      if(!S.f[d.s])return;
      S.ctx[d.s]=Object.assign({},S.ctx[d.s]||{},{last:+d.c,chg:+d.P,volUsd:+d.q});
      const bar=S.k[S.k.length-1];if(d.s===S.sym&&bar&&+d.c)bar.c=+d.c;
      NET.info=Date.now();schedule();return;}
  };
}

  else if(st===0&&t-WSCONN>15000)wsRecycle("握手超过 15s 没完成");

},5000);

async function midPoll(){
  if(!S.uni.length)return;
  const age=NET.mid?Date.now()-NET.mid:Infinity;
  if(age<(MIDSRC==="rest"?MID_BACK:MID_STALE)){
    if(MIDSRC==="rest"){MIDSRC="ws";log("mid 回到推送");}
    return;}
  try{
    const r=await pub("/fapi/v1/ticker/price");
    if(!Array.isArray(r)){midFail++;return;}
    let n=0;r.forEach(x=>{const s=x&&(x.symbol||x.s),v=+(x&&(x.price!=null?x.price:x.p));
      if(s&&S.f[s]&&v>0){S.mid[s]=v;n++;}});
    if(!n){midFail++;log("midPoll 一个品种都没匹配上");
      return;}
    midFail=0;
    NET.mid=Date.now();
    if(MIDSRC!=="rest"&&Date.now()>MIDGRACE){MIDSRC="rest";log("mid 改走轮询");}
    schedule();
  }catch(e){midFail++;log("midPoll err "+(e.message||e));}
}

let uws=null,LKEY="",lkT=null,acctT=null;
function schedAcct(){if(acctT)return;acctT=setTimeout(()=>{acctT=null;load(true);},700);}
async function startUserStream(force){
  if(!HASKEY)return;
  try{
    if(force||!LKEY){const j=await keyReq("POST","/fapi/v1/listenKey");LKEY=(j||{}).listenKey||"";}
    if(!LKEY){log("listenKey empty");return;}
    try{if(uws)uws.close();}catch(e){}
    uws=new WebSocket(WSU+"/"+LKEY);
    uws.onopen=()=>log("user stream open");
    uws.onclose=()=>{setTimeout(()=>startUserStream(false),4000);};
    uws.onerror=()=>{};
    uws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data);}catch(e){return;}
      const d=m&&m.data!==undefined?m.data:m;if(!d||!d.e)return;
      if(d.e==="listenKeyExpired"){log("listenKey expired");startUserStream(true);return;}
      if(d.e==="ORDER_TRADE_UPDATE"||d.e==="ALGO_ORDER_TRADE_UPDATE"){
        const o=d.o||d.a||{};
        if((o.X==="FILLED"||o.X==="PARTIALLY_FILLED")&&PENDBR[o.s])setTimeout(()=>firePendingBracket(o.s),600);
        // 止损成交保护：止损单成交说明仓位已被清空，立即撤销同品种所有非减仓入场挂单，防止后续成交产生裸仓！
        if(o.X==="FILLED"&&(o.ot==="STOP_MARKET"||o.cp===true||(o.R===true&&o.ot!=="LIMIT"))){
          cancelAllEntryOrders(o.s);
          if(PENDBR[o.s]){ delete PENDBR[o.s]; savePendBr(); }
        }
        schedAcct();return;}
      if(d.e==="ACCOUNT_UPDATE"){
        (((d.a||{}).P)||[]).forEach(p=>{
          const k=posKey(p.s,p.ps),amt=+p.pa;
          if(!amt){delete S.pos[k];return;}
          S.pos[k]=Object.assign(S.pos[k]||{sym:p.s,side:p.ps||"BOTH"},
            {amt,entry:+p.ep,upnl:+p.up});});
        NET.acct=Date.now();schedAcct();
        if($("#shTv").classList.contains("on"))posView();
        schedule();return;}
    };
    clearInterval(lkT);lkT=setInterval(()=>{keyReq("PUT","/fapi/v1/listenKey").catch(e=>log("keepalive err "+e.message));},1500000);
  }catch(e){log("userStream err "+e.message);setTimeout(()=>startUserStream(true),10000);}
}

    avail:+acc.availableBalance||0,used:+acc.totalInitialMargin||0,

async function load(silent, symOnly){
  if(!HASKEY){if(!silent)toast("未配置 API Key / Secret，无法读取账户");return;}
  try{
    const orderParams = symOnly ? { symbol: symOnly } : {};
    const tasks=[
      priv("GET","/fapi/v2/account",{}, 15000, { escapeLock: true }),
      priv("GET","/fapi/v2/positionRisk",{}, 15000, { escapeLock: true }),
      priv("GET","/fapi/v1/openOrders", orderParams, 15000, { escapeLock: true }).catch(()=>[]),
      priv("GET","/fapi/v1/openAlgoOrders", orderParams, 15000, { escapeLock: true }).catch(()=>[])
    ];
    if(S.dual==null)tasks.push(priv("GET","/fapi/v1/positionSide/dual",{}, 15000, { escapeLock: true }).catch(()=>null));
    const [acc,pos,stdOd,algoRes,dual]=await Promise.all(tasks);
    if(dual&&dual.dualSidePosition!=null)S.dual=!!dual.dualSidePosition;
    
    const algoArr = Array.isArray(algoRes) ? algoRes : (algoRes && Array.isArray(algoRes.openAlgoOrders) ? algoRes.openAlgoOrders : []);
    const normalizedAlgo = algoArr.map(o => {
      const oType = o.orderType || o.type || o.algoType || "STOP_MARKET";
      return {
        symbol: o.symbol,
        orderId: o.algoId || o.orderId,
        algoId: o.algoId || o.orderId,
        isAlgo: true,
        side: o.side,
        positionSide: o.positionSide || "BOTH",
        type: oType,
        orderType: oType,
        algoType: o.algoType || "CONDITIONAL",
        stopPrice: o.stopPrice || o.triggerPrice || 0,
        price: o.price || 0,
        origQty: o.totalQty || o.quantity || o.origQty || 0,
        closePosition: o.closePosition === true || o.closePosition === "true",
        reduceOnly: o.reduceOnly === true || o.reduceOnly === "true",
        time: o.bookTime || o.time || o.createTime || Date.now()
      };
    });

    const od = [...(Array.isArray(stdOd)?stdOd:[]), ...normalizedAlgo];
    if(symOnly && S.ords){
      // 增量合并当前标的的挂单，同时绝不丢弃账户资金与持仓数据！
      applyAcct(acc,pos,null);
      S.ords[symOnly] = od;
      S.ordsAt = Date.now();
      try{prunePendBr();}catch(e){log("prune err "+e.message);}
      sweepStaleEntries().catch(e=>log("ttl err "+e.message));
    } else {
      applyAcct(acc,pos,od);
    }
    if(!silent){const a=acctView();
      toast("已加载：总资金 $"+money(a.equity)+" · 可用 $"+money(a.avail)+"，持仓已置顶");}
    sweepOrphans(true);
  }catch(e){
    log("load err "+e.code+" "+e.message);
    if(!silent)toast(keyHint(e)||("账户读取失败："+e.message));
  }
  render();posView();syncTradeLines();updateTvBtn();
}

function keyHint(e){
  const c=+((e||{}).code||0);
  if(c===-2015)return "API Key 无效 / 未开合约权限 / IP 不在白名单（-2015）";
  if(c===-2014||c===-1022)return "签名不通过：检查 Secret 是否粘错（-1022）";
  if(c===-1021)return "本机时间与交易所偏差过大，已重新校时，请重试（-1021）";
  return "";
}

function ordInfo(o){
  const t=String(o.type||""),stop=+(o.stopPrice||o.triggerPrice||0),lim=+(o.price||0);
  const closeAll=o.closePosition===true||o.closePosition==="true";
  const ps=String(o.positionSide||"BOTH").toUpperCase();
  const side=String(o.side||"").toUpperCase();
  
  // 严格依据交易所返回的 reduceOnly 与 closePosition，绝不凭持仓方向盲目猜测！
  let ro = !!o.reduceOnly || o.reduceOnly === "true" || closeAll;
  if(!ro && S.dual){
    if(ps === "LONG" && side === "SELL") ro = true;
    if(ps === "SHORT" && side === "BUY") ro = true;
  }

  const trail=/TRAILING/.test(t);
  const tp=/TAKE_PROFIT/.test(t),sl=/STOP/.test(t)&&!trail;
  const trig=trail||stop>0||/STOP|TAKE_PROFIT/.test(t);
  const isEntry=trig&&!ro;
  const kind=trail?"追踪止损":trig?(isEntry?"触发入场":tp?"止盈":(/MARKET/.test(t)?"市价止损 (MARK)":"止损 (MARK)")):(ro?"限价平仓":"限价");
  const size=Math.abs(+o.origQty||+o.quantity||+o.totalQty||0);
  const sizeTxt=closeAll?"全平":size>0?sz(size,o.symbol):"—";
  const price=trig?stop:lim;
  let priceTxt=price>0?px(price,o.symbol):"市价";
  if(trig&&lim>0&&stop>0&&!/MARKET/.test(t)&&Math.abs(lim-stop)/stop>1e-9)
    priceTxt=px(stop,o.symbol)+" → 限 "+px(lim,o.symbol);
  return{t,trig,ro,closeAll,tp,sl,trail,isEntry,kind,size,sizeTxt,price,priceTxt,
    sideTxt:side==="BUY"?"买":"卖"};
}

async function cancelOrder(sym,oid,isAlgo,opt={}){
  if(!HASKEY && !DRY_RUN){
    toast("⚠ 未配置或未解锁 API Key，无法向交易所撤单！请先点击资金栏解锁。", true);
    const rec = readRec();
    if(typeof openKey === "function") openKey(rec && rec.mode === "aes" ? "unlock" : "set");
    return null;
  }
  if(!oid || oid === "undefined" || oid === "null"){
    toast("⚠ 订单缺少有效编号 (orderId/algoId)，无法向交易所发起撤单", true);
    return null;
  }

  const options = (typeof opt === "object" && opt !== null) ? opt : {};
  const targetAlgoId = (typeof opt === "string" || typeof opt === "number") ? opt : options.algoId;
  const useAlgo = isAlgo || targetAlgoId != null;

  toast("正在向交易所撤销 " + disp(sym) + " 挂单 #" + oid + "…", true);

  // 1. 发起首选路径撤单
  let path = useAlgo ? "/fapi/v1/algoOrder" : "/fapi/v1/order";
  let params = useAlgo ? { symbol: sym, algoId: targetAlgoId || oid } : { symbol: sym, orderId: oid };
  let res = await send("DELETE", path, params, "撤单 " + disp(sym), true, { escapeLock: true, ...options });
  
  let errCode = (res && res.code != null ? +res.code : (res && res._err && res._err.code != null ? +res._err.code : (LAST_ERR ? +LAST_ERR.code : 0)));
  
  // 2. 双向智能兜底重试：若接口不匹配（-4120/-1102/-2011/-4003），互换标准单/条件单接口重试一次
  if(!okAll(res) && (errCode === -2011 || errCode === -4120 || errCode === -1102 || errCode === -4003)){
    path = useAlgo ? "/fapi/v1/order" : "/fapi/v1/algoOrder";
    params = useAlgo ? { symbol: sym, orderId: oid } : { symbol: sym, algoId: targetAlgoId || oid };
    res = await send("DELETE", path, params, "撤单 " + disp(sym), true, { escapeLock: true, ...options });
    errCode = (res && res.code != null ? +res.code : (res && res._err && res._err.code != null ? +res._err.code : (LAST_ERR ? +LAST_ERR.code : 0)));
  }

  // 3. 结果处理与清晰反馈
  if(okAll(res)){
    // 成功撤单
    if(S.ords[sym]) S.ords[sym] = S.ords[sym].filter(o => String(o.orderId || o.algoId) !== String(oid));
    posView(); syncTradeLines(); updateTvBtn();
    toast("✔ 撤单成功：已撤销 " + disp(sym) + " 挂单 #" + oid, true);
    return res;
  } else if(errCode === -2011 || (LAST_ERR && LAST_ERR.code === -2011) || (res && res.code === -2011)){
    // -2011 Unknown order sent：说明交易所撮合引擎中该订单已不存在（已撤销或已成交）
    if(S.ords[sym]) S.ords[sym] = S.ords[sym].filter(o => String(o.orderId || o.algoId) !== String(oid));
    posView(); syncTradeLines(); updateTvBtn();
    toast("交易所已无该订单（已成交或已在交易所撤销），已同步清理本地挂单显示", true);
    return { code: 200, msg: "already_cleared" };
  } else {
    // 真正失败：给出详细明确的失败原因，绝不静默！
    const failReason = keyHint(LAST_ERR || res) || errText(LAST_ERR || res) || ((res && res.msg) || (LAST_ERR && LAST_ERR.message) || "交易所拒绝请求");
    toast("⚠ 撤单失败：" + failReason + (errCode ? "（" + errCode + "）" : ""), true);
    return res;
  }
}

/* 拖拽直接修改已挂出的订单价格（先保单、安全撤挂、绝不丢止损） */
async function modifyOrderPrice(oldOrder, newPrice){
  if(!oldOrder || !newPrice || !(newPrice > 0)) return;
  const sym = oldOrder.symbol || S.sym;
  const oi = ordInfo(oldOrder);
  const alignedPx = alignPx(newPrice, sym);
  if(!(alignedPx > 0) || Math.abs(alignedPx - oi.price) < 1e-8) return;

  const curM = mid(sym);
  const isBuy = oldOrder.side === "BUY";
  const isSell = oldOrder.side === "SELL";

  // 止损单防穿透校验：
  // 1) 多头平仓止损是 SELL 单，触发价必须严格低于当前市价
  // 2) 空头平仓止损是 BUY 单，触发价必须严格高于当前市价
  if(oi.sl && curM > 0){
    if(isSell && alignedPx >= curM){
      toast("⚠ 多仓止损价 (" + px(alignedPx, sym) + ") 必须低于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    } else if(isBuy && alignedPx <= curM){
      toast("⚠ 空仓止损价 (" + px(alignedPx, sym) + ") 必须高于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    }
  }

  // 止盈单防穿透校验：
  // 1) 多头平仓止盈是 SELL 单，限价/触发价必须高于当前市价
  // 2) 空头平仓止盈是 BUY 单，限价/触发价必须低于当前市价
  if(oi.tp && curM > 0){
    if(isSell && alignedPx <= curM){
      toast("⚠ 多仓止盈价 (" + px(alignedPx, sym) + ") 必须高于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    } else if(isBuy && alignedPx >= curM){
      toast("⚠ 空仓止盈价 (" + px(alignedPx, sym) + ") 必须低于当前市价 " + px(curM, sym));
      liveLines(true);
      return;
    }
  }

  toast("正在修改 " + disp(sym) + " " + oi.kind + " 价格至 " + px(alignedPx, sym) + "…");

  // 构造新单参数
  const isTrig = oi.trig;
  const pxStr = fmtPx(alignedPx, sym);
  const orderType = oldOrder.type || (isTrig ? "STOP_MARKET" : "LIMIT");
  const newOrd = {
    symbol: sym,
    side: oldOrder.side,
    type: orderType
  };

  // 确定数量与减仓属性
  let q = +oldOrder.origQty || +oldOrder.quantity || +oldOrder.totalQty || 0;
  if(!(q > 0)){
    const p = posOf(sym).find(x => oldOrder.side === (x.amt > 0 ? "SELL" : "BUY"));
    if(p && Math.abs(p.amt) > 0) q = Math.abs(p.amt);
  }

  if(oldOrder.positionSide) newOrd.positionSide = oldOrder.positionSide;
  
  if(oldOrder.closePosition && !q){
    newOrd.closePosition = "true";
  } else if(q > 0){
    newOrd.quantity = fmtSz(alignSz(q, sym), sym);
    if(!S.dual) newOrd.reduceOnly = "true";
  } else if(isTrig){
    newOrd.closePosition = "true";
  }

  if(isTrig){
    newOrd.stopPrice = pxStr;
    newOrd.workingType = oldOrder.workingType || WORK;
    newOrd.priceProtect = "true";
    if(/LIMIT|TAKE_PROFIT$|STOP$/.test(orderType)) newOrd.price = pxStr;
  } else {
    newOrd.price = pxStr;
    newOrd.timeInForce = oldOrder.timeInForce || TIF;
  }

  // 安全修改流程：
  if(oi.isEntry){
    // 入场单：坚决【先撤后挂】！防止双单在穿透瞬间同时成交导致加倍仓位！
    await cancelOrder(sym, oldOrder.orderId || oldOrder.algoId, oldOrder.isAlgo, { escapeLock: true });
    let res = await placeOrder(newOrd, "改单挂入 " + disp(sym) + " @" + px(alignedPx, sym));
    const isGood = res && (res.orderId != null || res.algoId != null) && !(res.code != null && +res.code < 0);
    if(isGood){
      toast("已成功修改 " + disp(sym) + " " + oi.kind + " 至 " + px(alignedPx, sym));
    } else {
      toast("⚠ 入场单撤销成功，但新单提交被拒：" + errText(LAST_ERR || res));
    }
  } else {
    // 保护单（止损 / 止盈）：坚决【先挂后撤】！绝不留保护真空！
    let res = await placeOrder(newOrd, "改单挂入 " + disp(sym) + " @" + px(alignedPx, sym), false, { escapeLock: true });
    const isGood = res && (res.orderId != null || res.algoId != null) && !(res.code != null && +res.code < 0);
    if(isGood){
      await cancelOrder(sym, oldOrder.orderId || oldOrder.algoId, oldOrder.isAlgo, { escapeLock: true });
      toast("已成功修改 " + disp(sym) + " " + oi.kind + " 至 " + px(alignedPx, sym));
    } else {
      const errCode = (LAST_ERR && +LAST_ERR.code) || (res && +res.code) || 0;
      if(errCode === -2022 || errCode === -4013 || errCode === -1013){
        log("modifyOrderPrice: retry cancel-and-replace for " + sym);
        await cancelOrder(sym, oldOrder.orderId || oldOrder.algoId, oldOrder.isAlgo, { escapeLock: true });
        res = await placeOrder(newOrd, "改单挂入 " + disp(sym) + " @" + px(alignedPx, sym), false, { escapeLock: true });
        const retryGood = res && (res.orderId != null || res.algoId != null) && !(res.code != null && +res.code < 0);
        if(retryGood){
          toast("已成功修改 " + disp(sym) + " " + oi.kind + " 至 " + px(alignedPx, sym));
        } else {
          toast("⚠ 新单挂入被拒，正在恢复原止损单…");
          const restoreOrd = Object.assign({}, newOrd, {
            stopPrice: fmtPx(oi.price, sym),
            price: (/LIMIT|TAKE_PROFIT$|STOP$/.test(orderType)) ? fmtPx(oi.price, sym) : undefined
          });
          await placeOrder(restoreOrd, "恢复原止损 " + disp(sym), false, { escapeLock: true });
        }
      } else {
        const errMsg = (LAST_ERR && (LAST_ERR.msg || LAST_ERR.message)) || "交易所拒绝新单";
        toast("⚠ 修改失败：" + errMsg + "，已保留原单 @" + px(oi.price, sym));
        liveLines(true);
      }
    }
  }

  load(true, sym);
}

let ORPHAN_KEY="",ORPHAN_AT=0;
function findOrphans(){
  const out=[];
  if(!S.acct||!S.ordsAt)return out;
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    if(PENDBR&&PENDBR[sym])return;
    const l=(arr||[]).filter(Boolean);
    if(!l.length)return;
    if(l.some(o=>!ordInfo(o).ro))return;
    l.forEach(o=>out.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo}));});
  return out;
}
async function sweepOrphans(auto){
  const orphans=findOrphans();
  if(!orphans.length){
    let dupCount = 0;
    Object.values(S.ords||{}).forEach(arr=>{
      const sls=(arr||[]).filter(o=>ordInfo(o).sl);
      if(sls.length>1) dupCount += (sls.length - 1);
    });
    if(dupCount>0){
      if(!auto){
        await cleanDuplicateOrders();
        return dupCount;
      }
    }
    ORPHAN_KEY="";if(!auto)toast("没有无持仓的止盈/止损单");return 0;
  }
  if(auto){
    const key=orphans.map(o=>o.sym+":"+o.oid).sort().join(","),t=Date.now();
    if(key===ORPHAN_KEY&&t-ORPHAN_AT<6e5)return orphans.length;
    ORPHAN_KEY=key;ORPHAN_AT=t;
    toast("发现 "+orphans.length+" 张无持仓的孤儿单，可在「持仓」面板一键清理");
    return orphans.length;
  }
  const syms=[...new Set(orphans.map(o=>o.sym))];
  for(const sym of syms){
    await send("DELETE","/fapi/v1/allOpenOrders",{symbol:sym},"清理 "+disp(sym)+" 孤儿单",true,{escapeLock:true}).catch(()=>{});
    await send("DELETE","/fapi/v1/algoOpenOrders",{symbol:sym},"清理 "+disp(sym)+" 孤儿 Algo 单",true,{escapeLock:true}).catch(()=>{});
    delete S.ords[sym];
  }
  await cleanDuplicateOrders();
  ORPHAN_KEY="";posView();toast("已清理孤儿单与重复挂单");
  return orphans.length;
}

async function cleanDuplicateOrders(){
  let cleaned = 0;
  for(const sym of Object.keys(S.ords||{})){
    const sls = (S.ords[sym]||[]).filter(o => ordInfo(o).sl);
    if(sls.length > 1){
      const p = posOf(sym)[0];
      const isLong = p ? p.amt > 0 : true;
      sls.sort((a,b)=>{
        const pA = +(a.stopPrice || a.triggerPrice || 0);
        const pB = +(b.stopPrice || b.triggerPrice || 0);
        const cpA = a.closePosition === true || a.closePosition === "true" ? 1 : 0;
        const cpB = b.closePosition === true || b.closePosition === "true" ? 1 : 0;
        if(cpA !== cpB) return cpB - cpA;
        return isLong ? (pB - pA) : (pA - pB);
      });
      const toCancel = sls.slice(1);
      for(const o of toCancel){
        await cancelOrder(sym, o.orderId || o.algoId, o.isAlgo, { escapeLock: true });
        cleaned++;
      }
    }
  }
  if(cleaned > 0) toast("已自动清理 "+cleaned+" 张多余重复挂单（保留最保守止损）");
}

/* ================= 提交层与订单路由 ================= */
let LAST_ERR=null;
const ERRH={"-5022":"只挂单（GTX）会立刻成交被拒（已自动调整至盘口价重试）",
  "-2021":"触发价已被行情穿透，交易所拒挂",
  "-1111":"价格或数量精度不对（tick / stepSize）",
  "-1013":"不满足交易所的最小下单量或价格过滤器",
  "-4164":"名义价值低于交易所下限（约 5 USDC）",
  "-2019":"保证金不足",
  "-4131":"对手价太远，撮合保护拒单",
  "-2011":"撤单失败：这张单已经不在了",
  "-2027":"超出该杠杆档位下的最大可开名义价值",
  "-4061":"持仓模式不匹配（请在币安设置单向/双向持仓）",
  "-1115":"订单有效方式（timeInForce）不合法",
  "-1102":"缺少必要参数或参数格式不符",
  "-2022":"ReduceOnly 减仓单冲突被拒",
  "-4028":"所选杠杆倍数超过该币种允许的最大上限",
  "-4120":"请使用 Algo Order API 接口提交条件单"};
function errText(e){const c=e&&e.code!=null?String(e.code):"";
  return ERRH[c]?ERRH[c]+"（"+c+"）":((e&&(e.msg||e.message))||("错误 "+c));}

async function send(method,path,params,msg,silent,opt={}){
  const isEscape = !!opt.escapeLock || opt.isExit || (params && (params.closePosition === "true" || params.reduceOnly === "true")) || method === "DELETE";
  if(LOCK && !isEscape){toast("行情异常，交易已锁定："+LOCK);return null;}
  if(INFLIGHT && !isEscape){toast("上一笔请求还在处理，请稍候");return null;}
  if(DRY_RUN){
    console.log("[DRY RUN] send:", method, path, params);
    toast("【演练模式 DRY_RUN】"+msg+"：已记录请求（未真实下单）");
    return {orderId:888888,algoId:888888,clientOrderId:params.newClientOrderId||params.clientAlgoId||"dryrun"};
  }
  if(!HASKEY){copyJson({method,path,params},msg+"：未配置 API Key/Secret → 已复制请求 JSON");return null;}
  INFLIGHT=true;LAST_ERR=null;try{render();}catch(e){}
  const t0=Date.now();
  try{
    const res=await priv(method,path,params,opt.ms,opt);
    const errs=errsOf(res);
    if(errs.length){LAST_ERR=errs[0];toast("被拒："+errs.map(errText).join(" / ").slice(0,140));return res;}
    if(!silent)toast(msg+" 已提交");
    return res;
  }catch(e){
    if(e.code===-1021){await syncTime();toast("时间不同步已重新校时，请再点一次");return null;}
    if(e.code===-4061){S.dual=null;load(true);
      toast("持仓模式变了，已重新读取账户设置，请再点一次");return null;}
    if(e.timeout||!e.code){
      toast("提交无响应，正在精准对账…（"+(e.message||e)+"）");
      const cid = params && (params.newClientOrderId || params.clientAlgoId);
      if(cid){
        const isAlgo = path.includes("algo");
        try{
          const check = await priv("GET", isAlgo ? "/fapi/v1/algoOrder" : "/fapi/v1/order",
            isAlgo ? {symbol:params.symbol,clientAlgoId:cid} : {symbol:params.symbol,origClientOrderId:cid},
            5000, {escapeLock:true});
          if(check && (check.orderId || check.algoId)){
            toast("精准对账成功：订单已在交易所 (" + (check.status || check.algoStatus || "已挂入") + ")");
            return check;
          }
        }catch(recErr){
          log("cid recon err " + recErr.message);
        }
      }
      await reconcile(t0-5000);
      return null;
    }
    LAST_ERR=e;toast(keyHint(e)||("被拒："+errText(e)).slice(0,140));
    log("send err "+e.code+" "+e.message);
    return null;
  }finally{
    INFLIGHT=false;
    try{render();}catch(e){}
    load(true, params && params.symbol);
  }
}

async function placeOrder(ord, label, silent, opt={}){
  const escapeOpt = Object.assign({}, opt);
  if(ord.closePosition === true || ord.closePosition === "true" || ord.reduceOnly === true || ord.reduceOnly === "true"){
    escapeOpt.escapeLock = true;
  }
  const cid = ord.newClientOrderId || ord.clientAlgoId || ("bn" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));

  // 1. 判断是否为条件单（止损/止盈/突破单）
  // 币安新规：所有条件单必须通过 POST /fapi/v1/algoOrder (algoType="CONDITIONAL", triggerPrice)
  const isAlgo = /STOP|TAKE_PROFIT|TRAILING/.test(ord.type) || ord.algoType === "CONDITIONAL" || ord.isAlgo;
  
  if(isAlgo){
    const trig = ord.triggerPrice || ord.stopPrice;
    const cleanType = ord.type || ord.orderType || "STOP_MARKET";
    const p = {
      algoType: "CONDITIONAL",
      symbol: ord.symbol,
      side: ord.side,
      type: cleanType,
      triggerPrice: String(trig),
      clientAlgoId: cid,
      newClientOrderId: cid
    };
    if(ord.positionSide) p.positionSide = ord.positionSide;
    
    if(ord.closePosition === true || ord.closePosition === "true"){
      p.closePosition = "true";
      delete p.quantity;
      delete p.reduceOnly;
    } else if(ord.quantity){
      p.quantity = String(ord.quantity);
      if(ord.reduceOnly === true || ord.reduceOnly === "true") p.reduceOnly = "true";
    } else {
      p.closePosition = "true";
      delete p.quantity;
      delete p.reduceOnly;
    }

    if(ord.price && /LIMIT|TAKE_PROFIT$|STOP$/.test(cleanType)){
      p.price = String(ord.price);
    }
    if(ord.workingType) p.workingType = ord.workingType;
    if(ord.priceProtect) p.priceProtect = String(ord.priceProtect).toUpperCase();

    let res = await send("POST", "/fapi/v1/algoOrder", p, label, silent, escapeOpt);
    
    // 双向兼容：如果报不支持 algoOrder，则回退到传统 /fapi/v1/order
    if(!okAll(res) && LAST_ERR && (LAST_ERR.code === -4120 || LAST_ERR.code === -1102 || LAST_ERR.code === -4003)){
      log("placeOrder fallback to /fapi/v1/order for " + ord.symbol);
      const cleanOrd = Object.assign({}, ord);
      delete cleanOrd.isAlgo;
      delete cleanOrd.algoType;
      delete cleanOrd.orderType;
      cleanOrd.stopPrice = trig;
      delete cleanOrd.triggerPrice;
      cleanOrd.newClientOrderId = cid;
      res = await send("POST", "/fapi/v1/order", cleanOrd, label, silent, escapeOpt);
    }
    return res;
  } else {
    // 2. 普通限价单/市价单：通过官方标准 POST /fapi/v1/order
    const cleanOrd = Object.assign({}, ord);
    delete cleanOrd.isAlgo;
    delete cleanOrd.algoType;
    delete cleanOrd.orderType;
    delete cleanOrd.triggerPrice;
    cleanOrd.newClientOrderId = cid;

    let res = await send("POST", "/fapi/v1/order", cleanOrd, label, silent, escapeOpt);
    
    // 双向兼容：若报 -4120 则自动切换到 algoOrder 重试
    if(!okAll(res) && LAST_ERR && LAST_ERR.code === -4120){
      log("placeOrder retry on /fapi/v1/algoOrder for " + ord.symbol);
      const trig = ord.triggerPrice || ord.stopPrice || ord.price;
      const p = {
        algoType: "CONDITIONAL",
        symbol: ord.symbol,
        side: ord.side,
        type: ord.type || "STOP_MARKET",
        triggerPrice: String(trig),
        clientAlgoId: cid,
        newClientOrderId: cid
      };
      if(ord.positionSide) p.positionSide = ord.positionSide;
      if(ord.quantity) p.quantity = String(ord.quantity);
      if(ord.price) p.price = String(ord.price);
      res = await send("POST", "/fapi/v1/algoOrder", p, label, silent, escapeOpt);
    }
    return res;
  }
}

async function reconcile(sinceMs){
  if(!HASKEY){toast("未配置 API Key，无法对账，请手动核对");return null;}
  await new Promise(r=>setTimeout(r,1500));
  const t0=sinceMs||Date.now()-120000;
  try{
    const [acc,pos,od,tr]=await Promise.all([
      priv("GET","/fapi/v2/account",{}),priv("GET","/fapi/v2/positionRisk",{}),
      priv("GET","/fapi/v1/openOrders",{}),
      priv("GET","/fapi/v1/userTrades",{symbol:S.sym,startTime:Math.floor(t0)}).catch(()=>[])]);
    applyAcct(acc,pos,od);posView();render();syncTradeLines();
    const hits=(tr||[]).filter(f=>+f.time>=t0);
    toast(hits.length?("对账："+disp(S.sym)+" 期间有 "+hits.length+" 笔成交，持仓已刷新")
      :"对账：未发现新成交，持仓/挂单已刷新");
    return{acc,pos,od,fills:hits};
  }catch(e){toast("对账失败，请到币安 App 手动核对后再重试");return null;}
}
async function ensureLev(target){
  if(!HASKEY) return true;
  const sym = S.sym;
  const cp = curPos();
  let want = Math.max(1, Math.round(target || S.lev || LEV_DEF));
  
  // 1. 若当前品种已有持仓，自动沿用已有持仓的杠杆倍数
  if(cp && cp.amt !== 0){
    const cur = cp.lev || 0;
    if(cur > 0 && cur !== want){
      S.lev = cur;
      S.levSet[sym] = cur;
      savePref();
    }
    return true;
  }

  // 2. 如果已确认设置过该倍数，直接放行
  if(S.levSet[sym] === want) return true;

  // 3. 检查品种最大允许杠杆并自动适配
  const maxL = S.maxLev[sym] || (fOf(sym).maxLev) || 125;
  if(want > maxL){
    want = maxL;
    S.lev = want;
  }

  // 4. 调用币安官方接口调整杠杆
  try {
    const res = await send("POST", "/fapi/v1/leverage", { symbol: sym, leverage: want }, "设置杠杆 " + want + "x", true);
    if(res && (+res.leverage > 0)){
      S.levSet[sym] = +res.leverage;
      S.lev = +res.leverage;
      return true;
    }
    
    // 检查具体报错原因
    if(LAST_ERR){
      const errC = +LAST_ERR.code;
      if(errC === -2015 || errC === -1002){
        toast("⚠ 失败：API Key 缺少合约交易权限或 IP 未加白名单（" + errC + "）");
        return false;
      }
      if(errC === -4028){
        toast("⚠ 杠杆 " + want + "x 超过该品种上限，已调整重试");
        return true;
      }
    }
    
    // 降级保护：如果账户本身已有当前杠杆，不阻断下单
    if(S.levSet[sym] && S.levSet[sym] > 0){
      log("ensureLev fallback to existing leverage " + S.levSet[sym]);
      return true;
    }
    return true; // 放行下单，交由下单接口撮合
  } catch(e) {
    log("ensureLev err " + (e && e.message));
    return true;
  }
}
async function closePos(key, isMarket = false){
  const p=S.pos[key];if(!p)return;
  const sym=p.sym,lg=p.amt>0,q=alignSz(Math.abs(p.amt),sym);
  if(!(q>0)){toast("持仓数量小于最小下单精度");return;}
  const ps=p.side==="BOTH"?(lg?"LONG":"SHORT"):p.side;

  if(isMarket){
    const o={symbol:sym,side:lg?"SELL":"BUY",type:"MARKET"};
    if(!S.dual)o.closePosition="true";
    else{o.positionSide=ps;o.quantity=fmtSz(q,sym);}
    await send("POST","/fapi/v1/order",o,"市价强平 "+disp(sym),false,{escapeLock:true,isExit:true});
    return;
  }

  const m=mid(sym);
  if(!isFinite(m)||m<=0){toast("无法获取市价，已取消平仓");return;}
  const lim=alignPx(lg?m*(1+CLOSE_OFF):m*(1-CLOSE_OFF),sym,lg?1:-1);
  const o={symbol:sym,side:lg?"SELL":"BUY",type:"LIMIT",timeInForce:TIF,
    price:fmtPx(lim,sym),quantity:fmtSz(q,sym)};
  if(S.dual)o.positionSide=ps;
  else o.reduceOnly="true";
  await send("POST","/fapi/v1/order",o,"挂单平仓 "+disp(sym)+" @ "+px(lim,sym), false, { escapeLock: true, isExit: true });

  // 3.5 秒后若持仓仍在，醒目提示建议市价强平
  setTimeout(()=>{
    const curP=S.pos[key];
    if(curP&&Math.abs(curP.amt)>0){
      toast("⚠ "+disp(sym)+" 限价挂单平仓尚未成交，行情剧烈时建议点击【市价平】！", true);
    }
  }, 3500);
}

/* ================= 突破入场成交后自动补挂止损/止盈 ================= */
let PENDBR;try{PENDBR=JSON.parse(localStorage.getItem("bn_pendbr")||"{}")||{};}catch(e){PENDBR={};}
if(typeof PENDBR!=="object"||Array.isArray(PENDBR))PENDBR={};
function savePendBr(){try{localStorage.setItem("bn_pendbr",JSON.stringify(PENDBR));}catch(e){}}
function prunePendBr(){
  if(!S.acct||!S.ordsAt)return;
  let ch=false;
  Object.keys(PENDBR).forEach(sym=>{
    const b=PENDBR[sym]||{};
    if(posOf(sym).length)return;
    if(S.ordsAt<=(b.ts||0)+20000)return;
    const hasEntry=(S.ords[sym]||[]).filter(Boolean).some(o=>!ordInfo(o).ro);
    const stale=Date.now()-(b.ts||0)>PENDBR_TTL;
    if(hasEntry&&!stale)return;
    delete PENDBR[sym];ch=true;
    log("pendbr pruned "+sym+(stale?" (ttl)":" (entry gone)"));});
  if(ch)savePendBr();
}

async function sweepStaleEntries(){
  if(!S.acct||!S.ordsAt)return;
  const away=AWAY_TTL>0&&LAST_ALIVE>0&&AWAY>=AWAY_TTL;
  if(!ENTRY_TTL&&!away)return;
  const tNow=Date.now(),kill=[];
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    (arr||[]).filter(Boolean).forEach(o=>{
      if(ordInfo(o).ro)return;
      const t=+o.time||+o.updateTime||0;if(!t)return;
      if(away&&t<LAST_ALIVE){kill.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo,why:"away"});return;}
      if(ENTRY_TTL&&tNow-t>ENTRY_TTL)kill.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo,why:"ttl"});});});
  for(const k of kill){
    await cancelOrder(k.sym,k.oid,k.isAlgo);
    toast(disp(k.sym)+(k.why==="away"
      ?" 入场单在网页关闭的 "+durTxt(AWAY)+" 里没成交，已自动撤单"
      :" 入场单挂了 "+durTxt(ENTRY_TTL)+" 没成交，已自动撤单"));}
}
const BRBUSY=new Set();

function exitOrder(sym,lg,price,ps,qty){
  const pxStr=fmtPx(price,sym);
  const o={
    symbol:sym,
    side:lg?"SELL":"BUY",
    type:"STOP_MARKET",
    stopPrice:pxStr,
    triggerPrice:pxStr,
    workingType:WORK,
    priceProtect:"true"
  };
  if(!S.dual){
    o.closePosition="true";
  }else{
    let q=qty;
    if(!(q>0)){
      const p=posOf(sym).find(x=>(x.amt>0)===lg);
      if(p)q=Math.abs(p.amt);
      else if(PENDBR[sym]&&PENDBR[sym].qty)q=PENDBR[sym].qty;
    }
    if(q>0)o.quantity=fmtSz(alignSz(q,sym),sym);
    o.positionSide=ps||(lg?"LONG":"SHORT");
  }
  return o;
}

function tpPostOnlyOrder(sym,lg,tp,ps,qty){
  const pxStr=fmtPx(alignPx(tp,sym,lg?1:-1),sym);
  const o={
    symbol:sym,
    side:lg?"SELL":"BUY",
    type:"LIMIT",
    price:pxStr,
    timeInForce:"GTX"
  };
  let q=qty;
  if(!(q>0)){
    const p=posOf(sym).find(x=>(x.amt>0)===lg);
    if(p)q=Math.abs(p.amt);
    else if(PENDBR[sym]&&PENDBR[sym].qty)q=PENDBR[sym].qty;
  }
  if(q>0)o.quantity=fmtSz(alignSz(q,sym),sym);
  if(S.dual)o.positionSide=ps||(lg?"LONG":"SHORT");
  else o.reduceOnly="true";
  return o;
}

async function firePendingBracket(sym){
  if(BC_CH && !IS_LEADER) return;
  const b=PENDBR[sym];if(!b)return;
  if(BRBUSY.has(sym))return;
  const p=posOf(sym).find(x=>(x.amt>0)===(b.side==="BUY"));
  if(!p)return;
  BRBUSY.add(sym);
  try{
    const lg=p.amt>0,ps=p.side==="BOTH"?(lg?"LONG":"SHORT"):p.side;
    const live=(S.ords[sym]||[]).filter(Boolean).map(o=>ordInfo(o));
    const left=live.some(i=>!i.ro);

    // 严禁反向信任本地旧标志，严格由交易所实况 live 订单推导！
    const hasLiveSl = live.some(i=>i.sl && i.ro);
    b.slDone = hasLiveSl;

    const hasLiveTp = live.some(i=>i.tp && i.ro);
    if(hasLiveTp) b.tpFbDone = true;

    const orders=[];let iSl=-1,iTp=-1,iFb=-1,tpQty=0;
    if(b.sl!=null&&!hasLiveSl){
      iSl=orders.length;
      orders.push(exitOrder(sym,lg,alignPx(b.sl,sym,lg?1:-1),ps,Math.abs(p.amt)));
    }
    if(b.tp!=null&&!left&&!b.tpOid){
      tpQty=alignSz(Math.abs(p.amt),sym);
      if(tpQty>0&&tpQty>(+b.tpQty||0)*1.000001){
        const t={symbol:sym,side:lg?"SELL":"BUY",type:"LIMIT",timeInForce:TIF,
          quantity:fmtSz(tpQty,sym),price:fmtPx(alignPx(b.tp,sym,lg?1:-1),sym)};
        if(S.dual)t.positionSide=ps;else t.reduceOnly="true";
        iTp=orders.length;orders.push(t);
      }
    }
    if(b.tp!=null&&PREATTACH_TP&&!b.tpFbDone&&!hasLiveTp){
      iFb=orders.length;
      orders.push(tpPostOnlyOrder(sym,lg,b.tp,ps,tpQty||Math.abs(p.amt)));
    }
    const done=()=>!left && hasLiveSl && (b.tp==null || !!b.tpOid || !PREATTACH_TP || hasLiveTp);
    if(!orders.length){
      if(done()){delete PENDBR[sym];savePendBr();}
      return;
    }
    const what=[iSl>=0?"止损市价单":"",iTp>=0?"止盈挂单":"",iFb>=0?"兜底止盈挂单":""].filter(Boolean).join("/");
    
    const results=[];
    for(const ord of orders){
      const res=await placeOrder(ord,"入场已成交，自动挂"+(ord.type.includes("STOP")?"止损":"止盈"),true,{escapeLock:true});
      results.push(res);
    }
    const good=x=>x&&(x.orderId!=null||x.algoId!=null)&&!(x.code!=null&&+x.code<0);
    if(iSl>=0&&good(results[iSl]))b.slDone=true;
    if(iTp>=0&&good(results[iTp])){b.tpOid=results[iTp].algoId||results[iTp].orderId;b.tpQty=tpQty;}
    if(iFb>=0&&good(results[iFb])){b.tpFbDone=true;b.tpFbOid=results[iFb].algoId||results[iFb].orderId;}
    savePendBr();
    if(done()||(iSl>=0&&b.slDone)){
      delete PENDBR[sym];savePendBr();
      log("bracket ok "+sym);toast(disp(sym)+" "+what+"已挂上");
      return;
    }
    const errs=errsOf(results);
    if(errs.some(e=>+e.code===-2021)){
      delete PENDBR[sym];savePendBr();
      toast("⚠ "+disp(sym)+" 止损价已被行情穿透，交易所拒挂，当前是裸仓，请立即手动处理！");return;}
    b.tries=(b.tries||0)+1;savePendBr();
    log("bracket FAIL "+sym+" tries="+b.tries);
    if(b.tries>=BRACKET_MAX_TRY){
      delete PENDBR[sym];savePendBr();
      toast("⚠ "+disp(sym)+" 止损补挂已失败 "+b.tries+" 次，当前是裸仓，请立即手动挂止损！");
    }else{
      toast("⚠ "+disp(sym)+" 止损补挂失败（当前裸仓），"+Math.round(BRACKET_RETRY/1000)+"s 后重试");
      setTimeout(()=>{try{firePendingBracket(sym);}catch(e){log("bracket retry err "+e);}},BRACKET_RETRY);
    }
  }catch(e){
    b.tries=(b.tries||0)+1;savePendBr();log("bracket throw "+sym+" "+e);
    toast("⚠ "+disp(sym)+" 止损补挂异常（当前裸仓），将重试");
    setTimeout(()=>{try{firePendingBracket(sym);}catch(_){}},BRACKET_RETRY);
  }finally{BRBUSY.delete(sym);}
}

/* ================= 独立裸仓看门狗（每 10 秒巡检：声光报警 + 自动保底补挂） ================= */
const WDBUSY = new Set();
async function slWatchdog(){
  if((!HASKEY && !DRY_RUN) || (BC_CH && !IS_LEADER)) return;
  const positions = Object.values(S.pos || {}).filter(p => p && Math.abs(p.amt) > 0);
  const elAlert = $("#nakedAlert");
  if(!positions.length){
    if(elAlert) elAlert.style.display = "none";
    return;
  }
  let nakedSyms = [];
  for(const p of positions){
    const sym = p.sym;
    if(WDBUSY.has(sym)) continue;
    const lg = p.amt > 0;
    const live = (S.ords[sym] || []).filter(Boolean).map(o => ordInfo(o));
    let hasLiveSl = live.some(i => i.sl && i.ro);

    // 实时复核：防止推送延迟导致重复补挂
    if(!hasLiveSl){
      try{
        const checkTasks = [
          priv("GET", "/fapi/v1/openOrders", { symbol: sym }, 5000, { escapeLock: true }).catch(() => []),
          priv("GET", "/fapi/v1/openAlgoOrders", { symbol: sym }, 5000, { escapeLock: true }).catch(() => [])
        ];
        const [cStd, cAlgo] = await Promise.all(checkTasks);
        const checkAll = [...(Array.isArray(cStd) ? cStd : []), ...(Array.isArray(cAlgo) ? cAlgo : [])];
        if(checkAll.some(o => ordInfo(o).sl && ordInfo(o).ro)){
          hasLiveSl = true;
          S.ords[sym] = checkAll;
        }
      }catch(chkErr){}
    }

    if(!hasLiveSl){
      WDBUSY.add(sym);
      try{
        nakedSyms.push(sym);
        console.warn("[WATCHDOG NAKED POSITION]", sym, p);
        wBeep();
        // 科学止损推导梯队：1) PENDBR 记录 -> 2) 1% 风险预算反推 -> 3) 紧急市价平仓
        let slPx = null;
        if(PENDBR[sym] && PENDBR[sym].sl && +PENDBR[sym].sl > 0){
          slPx = +PENDBR[sym].sl;
        } else {
          slPx = TradeCore.riskBudgetSl(p.entry, Math.abs(p.amt), equity(), F.risk || 1.0, lg);
        }

        if(slPx && slPx > 0){
          slPx = alignPx(slPx, sym, lg ? -1 : 1);
          const ps = p.side === "BOTH" ? (lg ? "LONG" : "SHORT") : p.side;
          const slOrd = exitOrder(sym, lg, slPx, ps, Math.abs(p.amt));
          log("watchdog auto sl " + sym + " @" + slPx);
          toast("⚠ 看门狗发现裸仓！正在为 " + disp(sym) + " 自动补挂市价止损单 @" + px(slPx, sym), true);
          await placeOrder(slOrd, "看门狗补止损", true, { escapeLock: true });
          await load(true, sym);
        } else {
          // 极端异常无有效止损价，直接市价强平避险
          toast("⚠ " + disp(sym) + " 裸仓且无法计算安全止损，执行紧急市价平仓避险！", true);
          await closePos(posKey(sym, p.side), true);
        }
      }catch(err){
        log("watchdog err " + err.message);
      }finally{
        WDBUSY.delete(sym);
      }
    }
  }
  if(nakedSyms.length){
    if(elAlert){
      elAlert.style.display = "block";
      elAlert.textContent = "⚠ 严重警告：发现裸仓！【" + nakedSyms.map(disp).join("、") + "】未设止损保护！正在自动补挂…";
    }
  } else {
    if(elAlert) elAlert.style.display = "none";
  }
}
setInterval(slWatchdog, 10000);

/* ================= 机会清单与 TV 按钮状态 ================= */
const WKEY="bn_watch";
let WATCH=[],_wsig="",WAC=null,WGEST=false;
function wLoad(){try{WATCH=JSON.parse(localStorage.getItem(WKEY)||"[]")||[];}catch(e){WATCH=[];}
  if(!Array.isArray(WATCH))WATCH=[];}
function wSave(){try{localStorage.setItem(WKEY,JSON.stringify(WATCH));}catch(e){}}
function tfMs(tf){return TFMS[tf]||36e5;}
function wDue(tf,from){const m=tfMs(tf);return Math.ceil(((from||Date.now())+1)/m)*m;}
function wFind(sym,tf){return WATCH.findIndex(w=>w.sym===sym&&w.tf===tf);}
function wHas(sym){return WATCH.some(w=>w.sym===sym);}
function wLeft(w){return w.due-Date.now();}
function cdTxt(ms){
  if(ms<=0)return "已收盘";
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=n=>String(n).padStart(2,"0");
  return h?h+":"+p(m)+":"+p(ss):m+":"+p(ss);}
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function wPrune(){const n=Date.now(),b=WATCH.length;
  WATCH=WATCH.filter(w=>w&&w.sym&&w.tf&&n-w.due<WATCH_KEEP);
  if(WATCH.length>WATCH_MAX)WATCH=WATCH.slice(-WATCH_MAX);
  return WATCH.length!==b;}
function wAudioInit(){try{if(!WAC)WAC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function wBeep(){
  if(!WGEST)return;
  try{wAudioInit();if(WAC){if(WAC.state==="suspended")WAC.resume();
    [0,190].forEach(d=>{const o=WAC.createOscillator(),g=WAC.createGain(),t=WAC.currentTime+d/1000;
      o.type="sine";o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
      o.connect(g);g.connect(WAC.destination);o.start(t);o.stop(t+0.2);});}}catch(e){log("beep err "+e.message);}
  try{if(WGEST&&navigator.vibrate)navigator.vibrate([90,60,90]);}catch(e){}}
function wToggle(sym,tf){
  sym=sym||S.sym;tf=tf||S.tf;
  const i=wFind(sym,tf);
  if(i>=0){WATCH.splice(i,1);wSave();wSync();toast("已取消标记 "+disp(sym)+" "+tf);return false;}
  const due=wDue(tf);
  WATCH.push({sym:sym,tf:tf,at:Date.now(),px:mid(sym)||0,due:due,fired:false});
  if(WATCH.length>WATCH_MAX)WATCH=WATCH.slice(-WATCH_MAX);
  wSave();wAudioInit();wSync();
  toast("已标记 "+disp(sym)+" "+tf+" · 收盘还有 "+cdTxt(due-Date.now()));
  return true;}
function wRemove(sym,tf){const i=wFind(sym,tf);if(i>=0){WATCH.splice(i,1);wSave();_wsig="";wSync();}}
async function wJump(sym,tf){
  const tfNew=tf&&tf!==S.tf;
  if(tfNew){S.tf=tf;applyPrefUI();}
  if(sym&&sym!==S.sym){await pick(sym);}
  else if(tfNew){savePref();await kline(true);head();}
  wSync();}

      +'<span class="dd '+(ch>=0?"up":"down")+'">'+(ch>=0?"+":"")+ch.toFixed(2)+"%</span></span>"
      +'<button class="wx" title="移除">✕</button></div>';}).join("");}
function wTick(){
  if(wPrune()){wSave();_wsig="";}
  const now=Date.now(),ring=[];
  WATCH.forEach(w=>{if(!w.fired&&now>=w.due){w.fired=true;ring.push(w);}});

    toast(ring.map(w=>disp(w.sym)+" "+w.tf).join("、")+(ring.length>1?" 都收盘了":" 收盘了")+"，可以下单了");}
  wSync();}

function pool(){
  return S.uni.map(u=>{const c=S.ctx[u.name]||{},f=S.f[u.name]||{};
    const natr = getNatr(u.name, S.tf);
    return{n:u.name,d:disp(u.name),p:mid(u.name),ch:+c.chg||0,vol:+c.volUsd||0,
      natr:natr!=null?+natr:null,type:f.type||"USDC",h:!!posOf(u.name).length};})
    .filter(x=>{
      if(x.h)return true;
      if(!S.filter)return true;
      if(x.vol < VOL_MIN)return false;
      if(x.natr == null)return false;
      if(x.natr < NATR_MIN)return false;
      // 若当前为 1h 周期，且该品种已满足 15m 筛选标准（15m NATR >= 0.5%），则在 1h 中自动去重不显示
      if(S.tf === "1h"){
        const natr15m = getNatr(x.n, "15m");
        if(natr15m != null && natr15m >= NATR_MIN) return false;
      }
      return true;
    })
    .sort((a,b)=>(b.h-a.h)||(b.vol-a.vol));
}

}

async function pick(sym){if(!sym)return;close();if(sym===S.sym)return;S.sym=sym;
  if(F.on)endFlow();useMaxLev();savePref();await kline(true);head();wSync();}
function step(n){
  const l=pool();
  const listToUse = l.length ? l : (S.uni || []).map(u => ({ n: u.name }));
  if(!listToUse.length) return;
  let i=listToUse.findIndex(x=>x.n===S.sym);if(i<0)i=0;
  const nextSym = listToUse[(i+n+listToUse.length)%listToUse.length].n;
  pick(nextSym);
}

/* ================= 下单：按止损自动算仓 ================= */
const F={on:false,step:0,e:null,sl:null,tp:null,risk:1};
function maxLev(){return S.maxLev[S.sym]||LEV_DEF;}
function useMaxLev(){S.lev=Math.min(maxLev(),LEVWANT>0?Math.round(LEVWANT):LEV_DEF);}
function flowSide(){return (F.e!=null&&F.sl!=null)?(F.sl<F.e?"buy":"sell"):S.side;}
function startFlow(){F.on=true;F.step=1;F.e=F.sl=F.tp=null;
  $("#ohud").classList.add("on");render();toast("请在图表上点击选择【入场价】");}
function endFlow(){F.on=false;F.step=0;F.e=F.sl=F.tp=null;
  $("#ohud").classList.remove("on");syncTradeLines();}
function sizing(entryOverride, slOverride){
  const f=fOf(S.sym);
  const curM = mid(S.sym);
  const buy = flowSide() === "buy";
  const tk = f.tick || 0.01;

  let rawE = entryOverride != null ? entryOverride : F.e;
  let rawSl = slOverride != null ? slOverride : F.sl;

  // 严格先对齐价格与盘口微调，再计算仓位与名义价值，杜绝 1% 真实风险偏离！
  if(rawE != null && curM > 0){
    let alignedE = alignPx(rawE, S.sym, buy ? -1 : 1);
    if(buy && alignedE >= curM) alignedE = alignPx(curM - tk, S.sym, -1);
    else if(!buy && alignedE <= curM) alignedE = alignPx(curM + tk, S.sym, 1);
    rawE = alignedE;
  }
  if(rawSl != null){
    rawSl = alignPx(rawSl, S.sym, buy ? 1 : -1);
  }

  const base={equity:equity(),riskPct:F.risk,entry:rawE,sl:rawSl,tp:F.tp,
    lev:S.lev,maxLev:maxLev(),step:f.step||0.001,tick:f.tick||0.01,
    minQty:f.minQty||0,maxQty:f.maxQty||0,minNotional:f.minNotional||5,
    feeRate:(MAKER_FEE+TAKER_FEE)/2,
    availableMargin:availMargin()};
  let r=TradeCore.sizing(base);
  if(r.notional>0){
    const lv=Math.min(S.lev,levFor(S.sym,r.notional));
    if(lv!==r.lev){
      const r2=TradeCore.sizing(Object.assign({},base,{lev:lv,maxLev:Math.max(lv,1)}));
      if(lv<S.lev)r2.capped=(r2.capped?r2.capped+"；":"")+"名义超出 "+S.lev+"x 档位，按 "+lv+"x 计";
      r=r2;}}
  return r;
}
function stepTx(){return F.step===1?"在图上点击选入场价":F.step===2?"在图上点击选止损价":F.step===3?"在图上点击选止盈价":"确认";}

function render(){
  if(!F.on){syncTradeLines();return;}
  S.side=flowSide();
  $("#ohT").textContent=disp(S.sym);$("#ohS").textContent=stepTx();
  [["#lE","e"],["#lS","sl"],["#lT","tp"]].forEach(([id,k],i)=>{
    const el=$(id);el.classList.toggle("cur",F.step===i+1);
    el.querySelector(".v").textContent=F[k]==null?"—":px(F[k],S.sym);});
  const r=sizing(),c=$("#ohC");
  if(r.bad)c.innerHTML="止损 = 入场价，无效";
  else if(!r.size)c.innerHTML="总资金 $"+money(equity())+" · 本单风险 $"+nf(equity()*F.risk/100,2)+"（"+F.risk+"%）";
  else{let h='<b>'+sz(r.size,S.sym)+" "+disp(S.sym)+'</b> · 名义 $'+nf(r.notional,0)+' · 保证金 $'+nf(r.margin,0)+' · '+r.lev+'x';
    h+='<div>风险 $'+nf(r.riskUsd,2)+' / 总资金 $'+money(equity())+' · 止损距 '+nf(r.dist/r.e*100,2)+'%</div>';
    if(r.rr!=null){const w=r.rr/(1+r.rr)*100;
      h+='<div>盈亏比 <b style="color:'+(r.rr>=2?"var(--up)":"var(--dim)")+'">'+r.rr.toFixed(2)+'</b>'+
        '<div class="rrbar"><div style="width:'+(100-w)+'%;background:var(--down)"></div><div style="width:'+w+'%;background:var(--up)"></div></div></div>';}
    c.innerHTML=h;}
  $("#ohR").textContent="风险 $"+money(r.riskUsd!=null?r.riskUsd:equity()*F.risk/100)+" · "+F.risk+"%";
  $("#ohSkip").textContent=F.step===3?"跳过止盈":"重新选";
  const go=$("#ohGo"),buy=S.side==="buy";
  go.className=buy?"b":"s";
  go.textContent=(buy?"确认 · 做多":"确认 · 做空")+(r.size?" "+sz(r.size,S.sym):"");
  const busy=INFLIGHT||SUBMITTING;
  go.disabled=!r.ok||(!DRY_RUN&&!!LOCK)||busy||(!DRY_RUN&&!HASKEY);
  if(busy)go.textContent="提交中…";
  $("#ohH").textContent=busy?"提交中，请勿重复点击"
    :!HASKEY?"未配置 API Key / Secret，无法下单"
    :LOCK?("⚠ "+LOCK+"，已锁单")
    :ACCT_LOADING?"账户加载中…"
    :!hasAcct()?"未读到账户资金，暂不可下单"
    :F.e==null?"点击图表选入场价"
    :F.sl==null?"再点一次选止损价"
    :(r.reasons&&r.reasons.length)?("⚠ "+r.reasons.join("；"))
    :r.capped?("⚠ "+r.capped):"";
  syncTradeLines();
}
