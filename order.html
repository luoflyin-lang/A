let LL_SIG="",LL_ITEMS=[];
function llSig(){
  const a=[S.sym, F.on ? "F:" + F.e + ":" + F.sl + ":" + F.tp : ""];
  Object.entries(S.pos).forEach(([k,p])=>{if(p.sym===S.sym)a.push("P"+k+":"+p.amt+":"+p.entry);});
  (S.ords[S.sym]||[]).forEach(o=>{if(!o)return;const oi=ordInfo(o);
    a.push("O"+(o.orderId||o.algoId)+":"+(oi.price||+(o.price||0))+":"+oi.kind+":"+oi.sizeTxt);});
  const pb = PENDBR[S.sym];
  if(pb) a.push("PB:" + pb.sl + ":" + pb.tp + ":" + pb.qty);
  return a.join("|");
}

function llPlace(){
  LL_ITEMS.forEach(it=>{
    if(it.dragging) return;
    const y=p2y(it.v);
    if(y==null || y < -30 || y > window.innerHeight + 30){
      it.el.style.display="none";
      return;
    }
    it.el.style.display="block";
    it.el.style.top=y+"px";
  });
}

function liveLines(force){
  const sig=llSig();
  if(!force&&sig===LL_SIG&&LL_ITEMS.every(it=>it.el.isConnected)){llPlace();return;}
  LL_SIG=sig;LL_ITEMS=[];
  document.querySelectorAll(".dl.dyn").forEach(el=>el.remove());
  const lay=$("#dlayer");
  if(!lay) return;

  // 1. 持仓线
  Object.entries(S.pos).filter(([k,p])=>p.sym===S.sym).forEach(([k,p])=>{
    const lg=p.amt>0,d=document.createElement("div");
    d.className="dl dyn pos en";
    d.innerHTML='<span class="grip" style="cursor:default">'+(lg?"多仓 ":"空仓 ")+sz(Math.abs(p.amt),p.sym)+" @ "+px(p.entry,p.sym)+'</span><span class="xbtn" title="平仓">✕</span>';
    lay.appendChild(d);LL_ITEMS.push({el:d,v:+p.entry});
    d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
      if(confirm("挂单平仓 "+disp(p.sym)+"（"+(lg?"多仓 ":"空仓 ")+sz(Math.abs(p.amt),p.sym)+"）？"))closePos(k);
    });
  });

  // 2. 挂单线（绑定拖拽改单逻辑）
  (S.ords[S.sym]||[]).forEach(o=>{
    const oi=ordInfo(o),v=oi.price||+(o.price||0);if(!v)return;
    const d=document.createElement("div");
    d.className="dl dyn "+(oi.isEntry?"en":oi.tp?"tp":oi.trig?"sl":"en");
    d.innerHTML='<span class="grip">'+oi.kind+" "+oi.sizeTxt+" @ "+px(v,o.symbol)+'</span><span class="xbtn" title="撤单">✕</span>';
    lay.appendChild(d);
    
    const itObj = {el:d, v:v, dragging:false};
    LL_ITEMS.push(itObj);

    // 绑定挂单拖拽改价
    const grip = d.querySelector(".grip");
    if(grip){
      let startY = 0, isDragging = false, currentPrice = v;
      grip.addEventListener("pointerdown", ev => {
        if(ev.button !== 0 && ev.pointerType === "mouse") return;
        isDragging = true;
        itObj.dragging = true;
        startY = ev.clientY;
        currentPrice = v;
        d.classList.add("dragging");
        grip.classList.add("dragging");
        try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
        ev.stopPropagation();
        if(ev.cancelable) ev.preventDefault();
      }, { passive: false });

      grip.addEventListener("pointermove", ev => {
        if(!isDragging) return;
        const cy = ev.clientY;
        const p = y2p(cy);
        if(p == null || !isFinite(p) || p <= 0) return;
        const aligned = alignPx(p, o.symbol);
        if(aligned > 0){
          currentPrice = aligned;
          d.style.top = cy + "px";
          const curM = mid(o.symbol);
          const diffPct = (curM > 0) ? ((aligned - curM) / curM * 100) : 0;
          const pctTxt = curM > 0 ? " (" + (diffPct > 0 ? "+" : "") + diffPct.toFixed(2) + "%)" : "";
          grip.textContent = "改价 → " + oi.kind + " @" + px(aligned, o.symbol) + pctTxt;
        }
        ev.stopPropagation();
        if(ev.cancelable) ev.preventDefault();
      }, { passive: false });

      const onUp = ev => {
        if(!isDragging) return;
        isDragging = false;
        itObj.dragging = false;
        d.classList.remove("dragging");
        grip.classList.remove("dragging");
        try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
        ev.stopPropagation();
        if(ev.cancelable) ev.preventDefault();

        if(currentPrice > 0 && Math.abs(currentPrice - v) > 1e-8){
          modifyOrderPrice(o, currentPrice);
        } else {
          liveLines(true);
        }
      };

      grip.addEventListener("pointerup", onUp, { passive: false });
      grip.addEventListener("pointercancel", onUp, { passive: false });
      grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
    }

    d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
      cancelOrder(o.symbol,o.orderId||o.algoId,o.isAlgo);
    });
  });

  // 3. 待成交挂单 (PENDBR)
  const pb = PENDBR[S.sym];
  if(pb){
    const hasLiveSl = (S.ords[S.sym]||[]).some(o=>ordInfo(o).sl);
    if(pb.sl != null && !hasLiveSl){
      const d=document.createElement("div");
      d.className="dl dyn sl";
      d.innerHTML='<span class="grip">待挂止损 @ '+px(pb.sl,S.sym)+'</span><span class="xbtn" title="取消待挂止损">✕</span>';
      lay.appendChild(d);
      const itObj = {el:d, v:+pb.sl, dragging:false};
      LL_ITEMS.push(itObj);

      const grip = d.querySelector(".grip");
      if(grip){
        let isDragging = false, curP = +pb.sl;
        grip.addEventListener("pointerdown", ev => {
          isDragging = true; itObj.dragging = true; 
          d.classList.add("dragging"); grip.classList.add("dragging");
          try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
        }, { passive: false });
        grip.addEventListener("pointermove", ev => {
          if(!isDragging) return;
          const p = y2p(ev.clientY);
          if(p > 0){
            curP = alignPx(p, S.sym);
            d.style.top = ev.clientY + "px";
            grip.textContent = "待挂止损 → " + px(curP, S.sym);
          }
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
        }, { passive: false });
        const onUp = ev => {
          if(!isDragging) return;
          isDragging = false; itObj.dragging = false; 
          d.classList.remove("dragging"); grip.classList.remove("dragging");
          try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
          if(curP > 0){
            pb.sl = curP; savePendBr(); syncTradeLines();
            toast("已修改待挂止损价格至 " + px(curP, S.sym));
          }
        };
        grip.addEventListener("pointerup", onUp, { passive: false });
        grip.addEventListener("pointercancel", onUp, { passive: false });
        grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
      }

      d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
        pb.sl=null;savePendBr();syncTradeLines();toast("已取消待挂止损");
      });
    }
    const hasLiveTp = (S.ords[S.sym]||[]).some(o=>ordInfo(o).tp);
    if(pb.tp != null && !hasLiveTp){
      const d=document.createElement("div");
      d.className="dl dyn tp";
      d.innerHTML='<span class="grip">待挂止盈 @ '+px(pb.tp,S.sym)+'</span><span class="xbtn" title="取消待挂止盈">✕</span>';
      lay.appendChild(d);
      const itObj = {el:d, v:+pb.tp, dragging:false};
      LL_ITEMS.push(itObj);

      const grip = d.querySelector(".grip");
      if(grip){
        let isDragging = false, curP = +pb.tp;
        grip.addEventListener("pointerdown", ev => {
          isDragging = true; itObj.dragging = true; 
          d.classList.add("dragging"); grip.classList.add("dragging");
          try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
        }, { passive: false });
        grip.addEventListener("pointermove", ev => {
          if(!isDragging) return;
          const p = y2p(ev.clientY);
          if(p > 0){
            curP = alignPx(p, S.sym);
            d.style.top = ev.clientY + "px";
            grip.textContent = "待挂止盈 → " + px(curP, S.sym);
          }
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
        }, { passive: false });
        const onUp = ev => {
          if(!isDragging) return;
          isDragging = false; itObj.dragging = false; 
          d.classList.remove("dragging"); grip.classList.remove("dragging");
          try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
          ev.stopPropagation(); if(ev.cancelable) ev.preventDefault();
          if(curP > 0){
            pb.tp = curP; savePendBr(); syncTradeLines();
            toast("已修改待挂止盈价格至 " + px(curP, S.sym));
          }
        };
        grip.addEventListener("pointerup", onUp, { passive: false });
        grip.addEventListener("pointercancel", onUp, { passive: false });
        grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
      }

      d.querySelector(".xbtn").addEventListener("click",ev=>{ev.stopPropagation();
        pb.tp=null;savePendBr();syncTradeLines();toast("已取消待挂止盈");
      });
    }
  }

  llPlace();
}

function syncTradeLines(){
  if(!candleSeries) return;
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const blueColor = isDark ? "#8CAECF" : "#3C5A78";
  const upColor = isDark ? "#6CA88D" : "#3A755D";
  const downColor = isDark ? "#C27A68" : "#A85244";

  if(tradeLines.entry){ candleSeries.removePriceLine(tradeLines.entry); tradeLines.entry = null; }
  if(tradeLines.sl){ candleSeries.removePriceLine(tradeLines.sl); tradeLines.sl = null; }
  if(tradeLines.tp){ candleSeries.removePriceLine(tradeLines.tp); tradeLines.tp = null; }

  // 绘制新选点线及即时盈亏比
  if(F.on){
    let dist = (F.e != null && F.sl != null) ? Math.abs(F.e - F.sl) : 0;
    let slPct = (F.e != null && F.sl != null && F.e > 0) ? (dist / F.e * 100) : 0;
    let rr = (dist > 0 && F.tp != null && F.e != null) ? (Math.abs(F.tp - F.e) / dist) : null;

    if(F.e != null){
      tradeLines.entry = candleSeries.createPriceLine({
        price: F.e, color: blueColor, lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: "入场 " + px(F.e, S.sym)
      });
    }
    if(F.sl != null){
      const slTxt = "止损 " + px(F.sl, S.sym) + (slPct > 0 ? " (-" + slPct.toFixed(2) + "%)" : "");
      tradeLines.sl = candleSeries.createPriceLine({
        price: F.sl, color: downColor, lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: slTxt
      });
    }
    if(F.tp != null){
      const tpTxt = "止盈 " + px(F.tp, S.sym) + (rr != null ? " (1:" + rr.toFixed(2) + ")" : "");
      tradeLines.tp = candleSeries.createPriceLine({
        price: F.tp, color: upColor, lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: tpTxt
      });
    }
  }

  tradeLines.pos.forEach(l => candleSeries.removePriceLine(l));
  tradeLines.pos = [];
  tradeLines.ords.forEach(l => candleSeries.removePriceLine(l));
  tradeLines.ords = [];

  const pp = curPos();
  if(pp && +pp.entry > 0){
    const lg = pp.amt > 0;
    const posLine = candleSeries.createPriceLine({
      price: +pp.entry,
      color: blueColor,
      lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: false,
      title: "持仓 " + (lg ? "多 " : "空 ") + sz(Math.abs(pp.amt), pp.sym) + " @" + px(pp.entry, pp.sym)
    });
    tradeLines.pos.push(posLine);
  }

  (S.ords[S.sym] || []).forEach(o => {
    const oi = ordInfo(o);
    const v = oi.price || +(o.price || 0);
    if(!(v > 0)) return;
    const c = oi.isEntry ? blueColor : (oi.tp ? upColor : (oi.trig ? downColor : blueColor));
    const ordLine = candleSeries.createPriceLine({
      price: v,
      color: c,
      lineWidth: 1.5,
      lineStyle: LightweightCharts.LineStyle.Dotted,
      axisLabelVisible: false,
      title: oi.kind + " " + oi.sizeTxt + " @" + px(v, o.symbol)
    });
    tradeLines.ords.push(ordLine);
  });

  const pb = PENDBR[S.sym];
  if(pb){
    const hasLiveSl = (S.ords[S.sym]||[]).some(o=>ordInfo(o).sl);
    if(pb.sl != null && !hasLiveSl){
      const slLine = candleSeries.createPriceLine({
        price: pb.sl,
        color: downColor,
        lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: false,
        title: "待挂止损 @" + px(pb.sl, S.sym)
      });
      tradeLines.ords.push(slLine);
    }
    const hasLiveTp = (S.ords[S.sym]||[]).some(o=>ordInfo(o).tp);
    if(pb.tp != null && !hasLiveTp){
      const tpLine = candleSeries.createPriceLine({
        price: pb.tp,
        color: upColor,
        lineWidth: 1.5,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: false,
        title: "待挂止盈 @" + px(pb.tp, S.sym)
      });
      tradeLines.ords.push(tpLine);
    }
  }

  syncHandles();
  liveLines(true);
}

function syncHandles(){
  let dist = (F.e != null && F.sl != null) ? Math.abs(F.e - F.sl) : 0;
  let slPct = (F.e != null && F.sl != null && F.e > 0) ? (dist / F.e * 100) : 0;
  let rr = (dist > 0 && F.tp != null && F.e != null) ? (Math.abs(F.tp - F.e) / dist) : null;

  [["e","#hEn","入场",""],
   ["sl","#hSl","止损", slPct > 0 ? " (-" + slPct.toFixed(2) + "%)" : ""],
   ["tp","#hTp","止盈", rr != null ? " · R:R 1:" + rr.toFixed(2) : ""]
  ].forEach(([k,hd,lb,extra])=>{
    const el=$(hd);
    if(!el) return;
    const v=F.on?F[k]:null;
    const y=p2y(v);
    if(v==null || y==null || y < -30 || y > window.innerHeight + 30){
      el.style.display="none";
      return;
    }
    el.style.display="block";
    el.style.top=y+"px";
    const grip=el.querySelector(".grip");
    if(grip && !grip.classList.contains("dragging"))grip.textContent=lb+" "+px(v,S.sym)+extra;
  });
}

let lastCommitTime=0;
function pickPrice(p){
  if(!p || !isFinite(p) || p <= 0) return;
  const nowT = Date.now();
  if(nowT - lastCommitTime < 300) return;
  lastCommitTime = nowT;

  if(!F.on){
    F.on=true;F.step=1;F.e=F.sl=F.tp=null;
    $("#ohud").classList.add("on");
  }
  if(F.step<=1){
    F.e=p;F.step=2;
    toast("【入场已定】"+px(p,S.sym)+" · 请再次长按选【止损价】");
  }else if(F.step===2){
    F.sl=p;F.step=3;
    const dPct = (F.e != null && F.e > 0) ? (Math.abs(p - F.e) / F.e * 100).toFixed(2) : "";
    toast("【止损已定】"+px(p,S.sym)+" (-"+dPct+"%) · 再次长按选【止盈】或点【跳过】");
  }else if(F.step===3){
    F.tp=p;F.step=4;
    const dist = (F.e != null && F.sl != null) ? Math.abs(F.e - F.sl) : 0;
    const rr = dist > 0 ? (Math.abs(p - F.e) / dist).toFixed(2) : "";
    toast("【止盈已定】"+px(p,S.sym)+" (盈亏比 1:"+rr+") · 请在面板核对并点击【确认】");
  }else{
    const d=[["e",F.e],["sl",F.sl],["tp",F.tp]].filter(x=>x[1]!=null)
      .sort((a,b)=>Math.abs(a[1]-p)-Math.abs(b[1]-p))[0];
    if(d)F[d[0]]=p;
  }
  render();
}

function y2p(y){
  if(!candleSeries) return null;
  return candleSeries.coordinateToPrice(y);
}
function p2y(p){
  if(!candleSeries || p==null) return null;

let aim=false, aimPrice=null, pT=null, pX=0, pY=0, pKill=false, pMulti=false;
let touchStartX=0, touchStartY=0, touchStartTime=0;

function guide(clientY){
  if(!aim){hideGuide();return null;}
  const p=y2p(clientY),l=$("#pline");
  if(p==null||!isFinite(p)||p<=0){l.style.display="none";aimPrice=null;return null;}
  aimPrice=p;
  let lb=!F.on||F.step<=1?"入场":F.step===2?"止损":F.step===3?"止盈":"调整";
  let extra="";
  if(F.on){
    if(F.step===2 && F.e!=null && F.e>0){
      const dPct=Math.abs(p - F.e)/F.e*100;
      extra = " (-" + dPct.toFixed(2) + "%)";
    }else if(F.step===3 && F.e!=null && F.sl!=null){
      const dist = Math.abs(F.e - F.sl);
      if(dist > 0){
        const rr = Math.abs(p - F.e) / dist;
        extra = " · R:R 1:" + rr.toFixed(2);
      }
    }
  }
  l.style.display="block";l.style.top=clientY+"px";
  $("#pbub").textContent=lb+" "+px(p,S.sym)+extra;
  return p;
}
function hideGuide(){$("#pline").style.display="none";aimPrice=null;}

  if(pKill||pMulti)return;

function onChart(t){

  if(t.closest("#tv_chart")||t.closest(".edge-zone"))return true;
  return t===document.body||t===document.documentElement;
}

const AIM_MS=240,H_TOL=12;

function bindGrip(hd,key){
  const grip=$(hd)?.querySelector(".grip");if(!grip)return;
  let isDragging=false;

  const onPointerDown = ev => {
    if(ev.button !== 0 && ev.pointerType === "mouse") return;
    isDragging = true;
    grip.classList.add("dragging");
    try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
  };

  const onPointerMove = ev => {
    if(!isDragging) return;
    const cy = ev.clientY;
    const p = y2p(cy);
    if(p == null || !isFinite(p) || p <= 0) return;
    const aligned = alignPx(p, S.sym);
    if(aligned > 0 && F[key] !== aligned){
      F[key] = aligned;
      render();
    }
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
  };

  const onPointerUp = ev => {
    if(!isDragging) return;
    isDragging = false;
    grip.classList.remove("dragging");
    try{ grip.releasePointerCapture(ev.pointerId); }catch(e){}
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
    render();
  };

  grip.addEventListener("pointerdown", onPointerDown, { passive: false });
  grip.addEventListener("pointermove", onPointerMove, { passive: false });
  grip.addEventListener("pointerup", onPointerUp, { passive: false });
  grip.addEventListener("pointercancel", onPointerUp, { passive: false });
  grip.addEventListener("touchstart", e => e.stopPropagation(), { passive: false });
}
bindGrip("#hEn","e");bindGrip("#hSl","sl");bindGrip("#hTp","tp");

addEventListener("touchend",e=>{
  clearTimeout(pT);
  const wasAim = aim && !pKill && !pMulti;
  const p = aimPrice;
  const dt = Date.now() - touchStartTime;
  const t = e.changedTouches?.[0];
  const dx = t ? Math.abs(t.clientX - touchStartX) : 0;
  const dy = t ? Math.abs(t.clientY - touchStartY) : 0;
  const cx = t ? t.clientX : touchStartX;

  resetPress();

  // 触屏手势切币：支持横向滑动切币（滑幅 > 45px，垂直偏离 < 30px）或点击左右 15% 边缘
  const isSwipeLeft = (t && (touchStartX - t.clientX > 45) && dy < 30 && dt < 350);
  const isSwipeRight = (t && (t.clientX - touchStartX > 45) && dy < 30 && dt < 350);
  if(!F.on && onChart(e.target) && !pMulti && !document.querySelector(".sheet.on")){
    if(isSwipeLeft){

      step(1);
    }else if(isSwipeRight){
      if(e.cancelable) e.preventDefault();
      step(-1);
    }else if(dt < 280 && dx < 12 && dy < 12){
      const w = window.innerWidth;
      if(cx < w * 0.15){
        if(e.cancelable) e.preventDefault();
        step(-1);
      }else if(cx > w * 0.85){
        if(e.cancelable) e.preventDefault();
        step(1);
      }
    }
  }
},{passive:false});

function setLock(why){
  if(LOCK===why)return;
  const was=LOCK;LOCK=why;const b=$("#lockbar");
  if(b){b.textContent=why?"⚠ "+why+" · 交易已锁定":"";b.classList.toggle("on",!!why);}
  document.body.classList.toggle("locked",!!why);
  try{render();}catch(e){}
  if(why&&!was)try{onLocked();}catch(e){log("onLocked err "+e.message);}
}

async function onLocked(){
  if(!NET.mid&&!LOCK_CANCEL_COLDSTART){log("cold start lock, skip cancel");return;}
  const kill=[];
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    (arr||[]).filter(Boolean).forEach(o=>{if(!ordInfo(o).ro)kill.push({sym,oid:o.orderId||o.algoId,isAlgo:!!o.isAlgo});});});
  if(!kill.length)return;
  if(!LOCK_CANCEL_ENTRY){toast("⚠ 行情已锁定，交易所还挂着 "+kill.length+" 张未成交入场单（保留不撤）");return;}
  toast("行情异常，正在撤掉 "+kill.length+" 张未成交入场单");
  for(const k of kill){
    try{await cancelOrder(k.sym,k.oid,k.isAlgo);log("lock-cancel "+k.sym);}
    catch(e){log("lock-cancel err "+e.message);}}
  load(true);
}

function lockCheck(){
  const t=Date.now(),ivl=(S.tf==="1h"?36e5:9e5);
  const age=NET.mid?t-NET.mid:Infinity;
  let why="";
  if(!S.uni.length)why="行情未加载";
  else if(t-T0>30000&&age>120000)
    why=NET.mid?"实时价中断超过 2 分钟":"实时价未接通";
  else if(NET.fail>=8)why="行情接口连续失败";
  else if(NET.info&&t-NET.info>120000)why="行情接口超过 2 分钟无响应";
  else if(!NET.info)why="行情尚未加载";
  else if(S.k.length&&t-S.k[S.k.length-1].t>ivl*4)why="K 线停更";
  setLock(why);
}

/* ================= TRADE 纯函数内核与全局风控闸门 ================= */
function alignSz(s,sym){return TradeCore.alignSz(s,fOf(sym).step||0.001);}
function alignPx(p,sym,dir){return TradeCore.alignPx(p,fOf(sym).tick||0.01,dir);}

function checkRiskGates(sym, newRiskUsd){
  const eq = equity();
  if(!eq || eq <= 0) return { pass: true };

  // 1. 单日最大亏损熔断
  const upnl = (+((S.acct||{}).upnl) || 0);
  const maxLossUsd = eq * (MAX_DAILY_LOSS_PCT / 100);
  if(upnl < -maxLossUsd){
    return { pass: false, reason: "今日持仓浮亏 (" + money(Math.abs(upnl)) + ") 超过单日限额 " + MAX_DAILY_LOSS_PCT + "% ($" + money(maxLossUsd) + ")，已触发日内熔断锁单！" };
  }

  // 2. 并发持仓总风险上限 (3%)
  let totalRiskUsd = newRiskUsd || 0;
  Object.values(S.pos || {}).forEach(p => {
    if(p && Math.abs(p.amt) > 0){
      const liveSl = (S.ords[p.sym] || []).map(ordInfo).find(i => i.sl && i.ro);
      const slPx = liveSl ? liveSl.price : (PENDBR[p.sym]?.sl || (p.amt > 0 ? p.entry * 0.98 : p.entry * 1.02));
      totalRiskUsd += Math.abs(p.entry - slPx) * Math.abs(p.amt);
    }
  });
  const maxTotalRisk = eq * (MAX_TOTAL_RISK_PCT / 100);
  if(totalRiskUsd > maxTotalRisk){
    return { pass: false, reason: "当前全部持仓总风险 ($" + money(totalRiskUsd) + ") 超过并发限额 " + MAX_TOTAL_RISK_PCT + "% ($" + money(maxTotalRisk) + ")，请降低敞口！" };
  }

  // 3. 连亏冷静期 (3笔亏损后冷静 30 分钟)
  const coolUntil = +localStorage.getItem("bn_cooldown_until") || 0;
  if(Date.now() < coolUntil){
    const leftSec = Math.round((coolUntil - Date.now()) / 1000);
    return { pass: false, reason: "连亏保护中：系统处于只读冷静期（剩余 " + leftSec + " 秒），暂停新开仓！" };
  }

  return { pass: true };
}

    if(p&&confirm("【市价紧急强平】"+disp(p.sym)+"（"+(p.amt>0?"多":"空")+" "+sz(Math.abs(p.amt),p.sym)+"）？\n将以市价立刻全平，确保保命脱身！"))closePos(m.dataset.x, true);
    return;}
  if(c){
    e.stopPropagation();
    const origText = c.textContent;
    c.disabled = true;
    c.textContent = "撤单中…";
    cancelOrder(c.dataset.x, c.dataset.o, c.dataset.a==="1")
      .finally(()=>{
        try{
          c.disabled = false;
          c.textContent = origText;
        }catch(_){}
      });
    return;
  }
  const r=e.target.closest("tr[data-c]");if(r)pick(r.dataset.c);});
$("#fBtn").addEventListener("click",e=>{S.filter=!S.filter;savePref();e.target.classList.toggle("on",S.filter);
  e.target.textContent=S.filter?(S.tf+" NATR > 0.5% · 额 > $20M"):"全部 0 挂单费品种";list();});
$("#ohX").addEventListener("click",endFlow);
$("#ohR").addEventListener("click",()=>{F.risk=F.risk===1?.25:1;savePref();render();});
$("#ohSkip").addEventListener("click",()=>{if(F.step===3){F.tp=null;F.step=4;}else{F.step=1;F.e=F.sl=F.tp=null;}render();});

/* ================= 确认下单流程 ================= */
$("#ohGo").addEventListener("click",async()=>{
  if(SUBMITTING||INFLIGHT){toast("正在提交，请稍候");return;}
  if(!DRY_RUN && !HASKEY){toast("未配置 API Key / Secret，无法下单");return;}
  if(!DRY_RUN && ACCT_LOADING){toast("账户加载中，请稍候再试");return;}
  if(!hasAcct()){toast("未读到账户资金，无法下单");return;}
  const r=sizing();
  if(!r.ok){toast((r.reasons&&r.reasons[0])||"入场或止损无效");return;}

  // 全局三大风控闸门校验（单日最大亏损、并发总风险上限、连亏冷静期）
  const gateCheck = checkRiskGates(S.sym, r.riskUsd);
  if(!gateCheck.pass){
    toast("⚠ 触发风控拦截：" + gateCheck.reason, true);
    return;
  }

  const sym=S.sym,qty=fmtSz(alignSz(r.size,sym),sym);
  if(!(+qty>0)){toast("数量小于最小下单精度（stepSize="+(fOf(sym).step||0)+"）");return;}
  const buy=S.side==="buy",m=mid(sym);
  if(!isFinite(m)||m<=0){toast("无法获取市价，已阻止下单");return;}
  const side=buy?"BUY":"SELL",ps=buy?"LONG":"SHORT";
  
  // 统一策略：入场永远是只挂单（LIMIT GTX），享受 0% 挂单手续费，绝不以市价吃单！
  const ePx = fmtPx(r.e, sym);
  const entry = {
    symbol: sym,
    side: side,
    type: "LIMIT",
    price: ePx,
    quantity: qty,
    timeInForce: TIF // "GTX" 只挂单
  };
  if(S.dual)entry.positionSide=ps;
  if(LOCK){toast("行情异常，交易已锁定："+LOCK);return;}
  SUBMITTING=true;try{render();}catch(e){}
  try{
    if(!await ensureLev(r.lev)) return;
    const slOrd=exitOrder(sym,buy,alignPx(r.sl,sym,buy?1:-1),ps,qty);
    const tpOrd=(r.tp!=null)?tpPostOnlyOrder(sym,buy,r.tp,ps,qty):null;
    const label=(buy?"挂单做多 ":"挂单做空 ")+qty+" "+disp(sym)+" @"+ePx;
    
    const good=x=>x&&(x.orderId!=null||x.algoId!=null)&&!(x.code!=null&&+x.code<0);
    const oidOf=x=>x?(x.algoId!=null?x.algoId:x.orderId):null;

    let eRes=null,slRes=null,tpRes=null;
    
    // 1. 提交只挂单入场单
    eRes=await placeOrder(entry,label);
    
    // 若限价只挂单（GTX）遇 -5022 盘口穿透，智能向盘口外微调并重试
    if(!good(eRes)){
      const code=eRes&&eRes.code!=null?+eRes.code:(LAST_ERR&&LAST_ERR.code!=null?+LAST_ERR.code:0);
      if(code===-5022){
        const curM=mid(sym);
        const tkSafe=(fOf(sym).tick||0.01);
        if(tkSafe>0&&curM>0){
          const safePx=buy?Math.min(+entry.price,curM-tkSafe):Math.max(+entry.price,curM+tkSafe);
          const np=alignPx(safePx,sym,buy?-1:1);
          entry.price=fmtPx(np,sym);
          toast("只挂单会立刻成交，已将价格微调至 "+px(np,sym)+" 重试");
          eRes=await placeOrder(entry,label);
        }
      }
    }
    
    const eOk=good(eRes);
    if(eOk){
      // 2. 预挂市价止损单
      slRes=await placeOrder(slOrd,"预挂止损(市价)",true).catch(()=>null);
      // 3. 预挂止盈单
      if(tpOrd){
        tpRes=await placeOrder(tpOrd,"预挂止盈",true).catch(()=>null);
      }
    }else{
      toast("⚠ 入场单提交失败："+errText(LAST_ERR||eRes));
      return;
    }
    
    const slOk=good(slRes),tpOk=tpOrd?good(tpRes):true;
    if(slOk && tpOk){
      toast("【3单已全部挂入币安】入场 + 止损(市价)" + (tpOrd ? " + 止盈" : ""));
    } else {
      if(!slOk) toast("⚠ 止损单未能立刻挂入，成交后会自动补挂");
      if(!tpOk) toast("⚠ 止盈单未能立刻挂入，成交后会自动补挂");
    }

    PENDBR[sym]={side,sl:r.sl,tp:r.tp,qty:+qty,slDone:slOk,ts:Date.now(),
      tpFbDone:tpOk,tpFbOid:oidOf(tpRes),
      oid:oidOf(eRes)};
    savePendBr();endFlow();
  }finally{SUBMITTING=false;try{render();}catch(e){}load(true);}
});

addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"){if(e.key==="Escape")close();return;}
  if(e.key==="Escape"){if(F.on)endFlow();else close();}
  if(e.key==="k"||e.key==="/"){e.preventDefault();open("shList");}
  if(e.key==="ArrowLeft")step(-1);
  if(e.key==="ArrowRight")step(1);
  if(e.key==="o"||e.key==="O"){F.on?endFlow():startFlow();}
  if(e.key==="t"||e.key==="T")cycleTheme();
  if(e.key==="w"||e.key==="W")wToggle();
});

/* ================= 架构抽象层 ================= */
window.BN={S,F,DATA:{pub,priv,syncTime,loadUniverse,tickers,loadBrackets,kline,load,reconcile,
  findOrphans,sweepOrphans,subCoin,startUserStream,applyAcct},
  TRADE:{core:TradeCore,alignPx,alignSz,sizing,send,ensureLev,closePos,cancelOrder,placeOrder,modifyOrderPrice,
    checkRiskGates,slWatchdog,step,pick,open,close,posView,render,endFlow,startFlow,pool,
    dryRun:(on=true)=>{DRY_RUN=!!on;toast("DRY_RUN = "+DRY_RUN);return DRY_RUN;},
    setTestnet:async (on=true)=>{await switchTestnet(on);return IS_TESTNET;}},
  ver:VER,LOG,log,dump:()=>LOG.join("\n"),
  debug:(v=true)=>{window.__BNDEBUG=!!v;return "debug="+!!v;},
  time:()=>({offsetMs:TOFF,serverNow:now()}),
  pendbr:()=>PENDBR,
  keys:()=>openKey("set"),
  $: $,
  chartView:()=>CHART_VIEW_STATE,
  tvChart:()=>tvChart,
  setProxy:(http,ws)=>{
    try{localStorage.setItem("bn_proxy",JSON.stringify({http:http||"",ws:ws||""}));}
    catch(e){return "存不进去："+e.message;}
    return "已保存，刷新页面生效 · http="+(http||"直连")+" ws="+(ws||"直连");}};
window.TradeCore = TradeCore;

addEventListener("error",e=>{try{log("window error "+((e&&e.message)||e));}catch(_){}});
addEventListener("unhandledrejection",e=>{try{const r=(e||{}).reason;log("unhandled "+((r&&r.message)||r));}catch(_){}});

/* ================= 启动流程 ================= */
async function boot(){
  initLeaderElection();
  await syncTime();
  initTradingViewChart();
  applyTheme();
  const kInit = kline(true);
  try{await loadUniverse();sock();setInterval(tick,TICKER_MS);}
  catch(e){toast("行情加载失败，交易已锁定");log("boot universe err "+e.message);}
  await kInit;head();
  await bootKeys();
  avHint();
  if(HASKEY)await startPrivate();
  else if(!readRec())toast("未配置 API Key：只看行情。点持仓面板右上角就能填");
  ACCT_LOADING=false;
  setInterval(syncTime,3e5);
  posView();render();
}
loadPref();
boot().catch(e=>{log("boot err "+((e&&e.message)||e));toast("启动出错："+((e&&e.message)||e));});
</script>
