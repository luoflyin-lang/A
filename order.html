<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2EFE9">
<title>BN Chart v9.5</title>
<style>
/* 护眼配色（iPad LED 直射光屏、长时间盯盘）：
   1) 不用纯白底——纯白在 LED 上等于把最大亮度糊在脸上，换成暖白纸底 #F2EFE9；
   2) 不用纯黑字，暖炭黑 12:1 对比度，够清晰又不硬边；
   3) 色相统一往暖偏、饱和度压低，蓝光少，眼睛不容易发酸；
   4) K 线保持中性灰（阳线空心、阴线实心），只有入场/止损/止盈用低饱和语义色。
   换主题只改这一块 + 下面的 dark 块，JS 里的图表颜色也是从这里读的。 */
:root{--bg:#F2EFE9;--surface:#F7F4EE;--raised:#E7E2D8;--text:#2E2B26;--dim:rgba(46,43,38,.66);
  --faint:rgba(46,43,38,.44);--line:rgba(46,43,38,.14);
  --up:#3C6B58;--down:#9A5240;--blue:#3E5C7E;--amber:#7C5E22;
  --ink:#3A362F;--onink:#F7F4EE;--cline:rgba(46,43,38,.55);--cbody:#3A362F;
  --pop:rgba(247,244,238,.96);--fabbg:rgba(247,244,238,.92);
  --tint:rgba(46,43,38,.05);--cgrid:rgba(46,43,38,.42);--caim:rgba(46,43,38,.75);--chair:rgba(46,43,38,.28);
  color-scheme:light;--mono:"Menlo","Consolas",monospace}
/* 夜间主题：暖深灰底 #1A1815，故意不用纯黑、也不用纯白字——
   纯黑底配亮白字在 mini-LED / OLED 上会泛光（halation），字看着发毛，散光、近视尤其明显；
   暗底下语义色要提亮、降饱和，否则红绿会“发荧光”。
   默认跟随系统（iPad 自带日落自动切），也可以点右上角时间 / 按 t 手动切。*/
html[data-theme="dark"]{--bg:#1A1815;--surface:#221F1A;--raised:#2E2A24;--text:#E6E1D6;
  --dim:rgba(230,225,214,.66);--faint:rgba(230,225,214,.44);--line:rgba(230,225,214,.16);
  --up:#7FB79A;--down:#D08A72;--blue:#93B2D0;--amber:#D3AF68;
  --ink:#E6E1D6;--onink:#1A1815;--cline:rgba(230,225,214,.50);--cbody:#B9B3A6;
  --pop:rgba(34,31,26,.96);--fabbg:rgba(34,31,26,.92);
  --tint:rgba(230,225,214,.07);--cgrid:rgba(230,225,214,.34);--caim:rgba(230,225,214,.70);
  --chair:rgba(230,225,214,.26);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:none;outline:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}

/* ---- 全屏图表 ---- */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---- 左上角 ---- */
#tl{position:fixed;top:18px;left:22px;z-index:5;display:flex;flex-direction:row;gap:12px;align-items:center}
#clk{position:fixed;top:18px;right:22px;z-index:5;cursor:pointer;user-select:none;-webkit-user-select:none;font-family:var(--mono);font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
#name{display:flex;align-items:baseline;gap:10px;cursor:pointer;padding:2px 0}
#name .s{font-size:19px;font-weight:650;letter-spacing:-.01em}
#name .caret{font-size:11px;color:var(--faint)}
.tfs{display:inline-flex;background:var(--tint);border:none;border-radius:9px;padding:2px;backdrop-filter:blur(8px)}
.tfs button{height:28px;padding:0 14px;border-radius:7px;font-size:13px;color:var(--faint)}
.tfs button.on{background:var(--raised);color:var(--text)}
#lockbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;display:none;
  background:var(--ink);border:none;color:var(--onink);
  padding:7px 14px;border-radius:9px;font-size:12.5px}
#lockbar.on{display:block}
body.locked #cv{opacity:.42}

/* ---- 角落按钮 ---- */
#br{position:fixed;left:16px;bottom:20px;z-index:6;display:flex;align-items:center;gap:8px}
#brr{position:fixed;right:16px;bottom:20px;z-index:6;display:flex;align-items:center;gap:8px}
.fab{height:40px;min-width:40px;padding:0 14px;border-radius:11px;background:var(--fabbg);
  border:none;box-shadow:0 2px 10px rgba(46,43,38,.07);font-size:13.5px;color:var(--text);backdrop-filter:blur(8px);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.fab:hover{background:var(--raised)}
.fab.icon{padding:0;width:60px;height:60px;border-radius:15px;font-size:25px;color:var(--dim)}

/* ---- 面板 ---- */
#mask{position:fixed;inset:0;background:rgba(46,43,38,.22);opacity:0;pointer-events:none;transition:.18s;z-index:8}
#mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--line);z-index:9;transform:translateX(102%);transition:transform .22s ease;
  display:flex;flex-direction:column}
.sheet.on{transform:none}
.sh{flex:none;display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sh b{font-size:15px;font-weight:600}
.sh .x{margin-left:auto;width:30px;height:30px;border-radius:8px;color:var(--faint);font-size:16px}
.sh .x:hover{background:var(--raised);color:var(--text)}
.sbody{flex:1;overflow:auto;padding:0 12px 18px;scrollbar-width:thin;scrollbar-color:var(--raised) transparent}
.sbody::-webkit-scrollbar{width:6px}.sbody::-webkit-scrollbar-thumb{background:var(--raised);border-radius:6px}
.filt{display:flex;align-items:center;gap:8px;padding:0 18px 10px;font-size:11.5px;color:var(--faint)}
.filt button{padding:3px 9px;border-radius:999px;border:none;font-size:11.5px;color:var(--faint)}
.filt button.on{background:var(--raised);color:var(--text);border-color:transparent}
.ci{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.ci:hover{background:var(--raised)}
.ci.on{background:var(--raised)}
.ci .n{font-size:13.5px;font-weight:550}
.ci .v{display:block;margin-top:1px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.ci .hold{margin-left:6px}
.ci .r{margin-left:auto;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ci .r .a{display:block;font-size:13px}
.ci .r .b{display:block;font-size:11px}
.hold{font-size:10px;padding:1px 5px;border-radius:5px;background:var(--raised);color:var(--text)}
#bStar{height:28px;min-width:30px;padding:0 7px;border-radius:8px;font-size:16px;line-height:1;
  color:var(--faint);background:var(--tint)}
#bStar.on{color:var(--amber);background:var(--raised)}
.fab.hot{color:var(--amber)}
.wi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer}
.wi:hover{background:var(--raised)}
.wi.due{background:var(--tint)}
.wi .n{font-size:13.5px;font-weight:550}
.wi .m{display:block;margin-top:1px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.wi .r{margin-left:auto;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.wi .cd{display:block;font-size:13px}
.wi .cd.due{color:var(--amber);font-weight:600}
.wi .dd{display:block;font-size:11px}
.wi .wx{margin-left:6px;width:26px;height:26px;border-radius:7px;color:var(--faint);font-size:13px}
.wi .wx:hover{background:var(--raised);color:var(--text)}
.none{padding:22px 10px;color:var(--faint);font-size:13px;line-height:1.7}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;font-weight:400;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 5px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);opacity:0;
  background:var(--raised);border-radius:9px;padding:9px 15px;font-size:13px;transition:.2s;pointer-events:none;z-index:20;
  max-width:78vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* ---- 图表取数 / 拖拽线 ---- */
#pline{position:fixed;left:0;right:0;height:0;display:none;z-index:4;pointer-events:none;
  border-top:1px dashed var(--cline)}   /* 颜色走主题变量，日间夜间都看得见 */
#pline.aim{border-top:1.5px solid var(--amber)}
#pbub{position:absolute;left:460px;top:-11px;font-family:var(--mono);font-size:12px;
  background:var(--raised);color:var(--text);border-radius:6px;padding:2px 7px;white-space:nowrap}
#pline.aim #pbub{background:var(--ink);color:var(--onink);font-weight:650}
#dlayer{position:fixed;inset:0;z-index:4;pointer-events:none}
.dl{position:absolute;left:0;right:0;height:0;display:none}
.dl.sl{border-top:1px dashed var(--down)}
.dl.tp{border-top:1px dashed var(--up)}
.dl.en{border-top:1px dashed var(--blue)}
.dl.en .grip{background:var(--blue);color:var(--onink)}
.dl .grip{position:absolute;left:460px;top:-11px;font-size:11px;font-family:var(--mono);
  border-radius:6px;padding:2px 8px;cursor:ns-resize;pointer-events:auto;touch-action:none;white-space:nowrap}
.dl.sl .grip{background:var(--down);color:var(--onink)}
.dl.tp .grip{background:var(--up);color:var(--onink)}
.dl.dyn .grip{left:auto;right:54px;background:var(--pop);color:var(--text);
  border:none;box-shadow:0 1px 6px rgba(46,43,38,.14)}
.dl.dyn.sl .grip{color:var(--down)}.dl.dyn.tp .grip{color:var(--up)}.dl.dyn.pos .grip{color:var(--blue)}
.dl .xbtn{position:absolute;right:16px;top:-11px;width:22px;height:22px;line-height:20px;text-align:center;
  border-radius:6px;background:var(--pop);border:none;box-shadow:0 1px 6px rgba(46,43,38,.16);color:var(--text);
  font-size:12px;cursor:pointer;pointer-events:auto}
/* ---- 左下角迷你下单气泡 ---- */
.rrbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:3px}
#av{cursor:pointer}
#khud{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;width:380px;max-width:92vw;
  display:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.28)}
#khud.on{display:block}
#khud .t{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);margin-bottom:14px}
#khud .t b{font-size:16px;color:var(--text);font-weight:600}
#khud .t .x{margin-left:auto;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px}
#khud input{display:block;width:100%;box-sizing:border-box;margin-bottom:8px;padding:11px 12px;
  font-family:var(--mono);font-size:16px;color:var(--text);background:var(--raised);
  border:1px solid var(--line);border-radius:10px}
#khud input:focus{outline:none;border-color:var(--blue)}
#kHint{font-size:11.5px;line-height:1.7;color:var(--faint);margin:10px 0 14px}
#khud .obar{display:flex;gap:8px}
#khud .obar button{flex:1;padding:11px;border-radius:10px;background:var(--raised);font-size:14px;color:var(--text)}
#khud .obar button.b{flex:2;background:var(--ink);color:var(--bg);font-weight:600}
#ohud{position:fixed;left:16px;bottom:92px;z-index:7;width:428px;display:none;
  background:var(--pop);border:none;border-radius:16px;box-shadow:0 8px 32px rgba(46,43,38,.15);
  padding:20px 22px;backdrop-filter:blur(10px)}
#ohud.on{display:block}
#ohud .t{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--faint);margin-bottom:12px}
#ohud .t b{font-size:18px;color:var(--text);font-weight:600}
#ohud .t .x{margin-left:auto;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px}
.ol{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11.5px;color:var(--faint)}
.ol .v{margin-left:auto;font-family:var(--mono);color:var(--text)}
.ol.cur{color:var(--text)}
.ol i{width:5px;height:5px;border-radius:50%;display:block;flex:none}
.ol i.e{background:var(--blue)}.ol i.s{background:var(--down)}.ol i.t{background:var(--up)}
.ol.cur i{box-shadow:0 0 0 3px var(--tint)}
#ohC{font-size:10.5px;color:var(--faint);line-height:1.55;margin:6px 0 0}
#ohC b{color:var(--text);font-weight:600}
.obar{display:flex;gap:4px;margin-top:6px}
.obar button{flex:1;height:24px;border-radius:6px;background:var(--raised);font-size:11px;color:var(--dim)}
.obar button:hover{color:var(--text)}
#ohGo{height:30px;width:100%;margin-top:6px;border-radius:8px;font-size:12.5px;font-weight:650}
#ohGo.b{background:var(--up);color:var(--onink)}#ohGo.s{background:var(--down);color:var(--onink)}
#ohGo:disabled{opacity:.35;cursor:not-allowed}
#ohH{font-size:10.5px;color:var(--amber);margin-top:5px;min-height:13px;line-height:1.4}
@media(max-width:640px){
  #tl{top:14px;left:16px}
  #br{left:12px;right:auto;bottom:14px;gap:6px}
  #brr{right:12px;bottom:14px;gap:6px}
  .fab{height:38px;font-size:13px;padding:0 12px}
  .fab.icon{width:57px;height:57px;border-radius:14px;font-size:24px}
  #ohud{left:12px;bottom:80px;width:198px;padding:9px 10px}
  #pbub,.dl .grip{left:220px}
}
</style>
<!-- 主题必须在首屏绘制前定下来，否则夜里打开会先闪一下白屏 -->
<script>try{var _m=localStorage.getItem("bn_theme")||"auto";
var _d=_m==="dark"||(_m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.setAttribute("data-theme",_d?"dark":"light");}catch(e){}</script>
</head>
<body>
<canvas id="cv"></canvas>

<div id="tl">
  <div id="name"><span class="s" id="nS">BTC</span><span class="caret">▾</span></div>
  <div class="tfs"><button data-tf="5m">5m</button><button class="on" data-tf="1h">1h</button></div>
  <button id="bStar" title="标记这个机会（W）：等这根 K 线收盘再下单">☆</button>
</div>

<div id="clk" title="点击切换配色 · 长按看版本">--:--</div>

<div id="br">
  <button class="fab" id="bPos">持仓</button>
  <button class="fab" id="bWat">机会</button>
</div>
<div id="brr">
  <button class="fab icon" id="prev" title="上一个品种">‹</button>
  <button class="fab icon" id="next" title="下一个品种">›</button>
</div>

<div id="mask"></div>

<aside class="sheet" id="shList">
  <div class="sh"><b>品种</b><span class="num" style="font-size:11.5px;color:var(--faint)" id="cnt"></span>
    <button class="x" data-close>✕</button></div>
  <div class="filt"><button class="on" id="fBtn">24h成交额 &gt; $1M</button><span>持仓品种始终显示</span></div>
  <div class="sbody" id="clist"></div>
</aside>

<aside class="sheet" id="shPos">
  <div class="sh"><b>持仓</b><span class="num" style="font-size:11.5px;color:var(--faint)" id="av"></span>
    <button class="x" data-close>✕</button></div>
  <div class="sbody" id="pb"><div class="none">账户数据加载中…</div></div>
</aside>

<aside class="sheet" id="shWat">
  <div class="sh"><b>机会</b><span class="num" style="font-size:11.5px;color:var(--faint)" id="wCnt"></span>
    <button class="x" data-close>✕</button></div>
  <div class="filt"><span>标记后等这根 K 线收盘，收盘会响一声提醒你下单</span></div>
  <div class="sbody" id="wlist"></div>
</aside>

<div id="lockbar"></div>
<div id="dlayer">
  <div class="dl en" id="hEn"><span class="grip">入场</span></div>
  <div class="dl sl" id="hSl"><span class="grip">止损</span></div>
  <div class="dl tp" id="hTp"><span class="grip">止盈</span></div>
</div>

<div id="ohud">
  <div class="t"><b id="ohT">BTC</b><span id="ohS">选入场价</span><button class="x" id="ohX">✕</button></div>
  <div class="ol" id="lE"><i class="e"></i>入场<span class="v">—</span></div>
  <div class="ol" id="lS"><i class="s"></i>止损<span class="v">—</span></div>
  <div class="ol" id="lT"><i class="t"></i>止盈<span class="v">—</span></div>
  <div id="ohC"></div>
  <div class="obar"><button id="ohR">风险1%</button><button id="ohSkip">跳过止盈</button></div>
  <button id="ohGo" class="b">确认</button>
  <div id="ohH"></div>
</div>
<div id="pline"><span id="pbub"></span></div>
<div id="khud">
  <div class="t"><b>API 密钥</b><span id="kSt"></span><button class="x" id="kX">✕</button></div>
  <input id="kK" type="password" placeholder="API Key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <input id="kS" type="password" placeholder="Secret" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <input id="kP" type="password" placeholder="口令（留空 = 不加密）" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="kHint"></div>
  <div class="obar"><button id="kSave" class="b">保存</button><button id="kWipe">清除</button></div>
</div>
<div id="toast"></div>
<script>
"use strict";
/* ==========================================================
   币安 USDC 本位合约（USDⓈ-M Futures）版 · 下单一律 GTX 只挂单，只有止损触发时才吃单
   护眼双主题：日间暖白纸底 / 夜间暖深灰底，默认跟随系统，点右上角时间或按 t 切换
   ↓↓↓ 密钥不要写进这个文件 ↓↓↓
   API_KEY / API_SECRET : 永远保持空字符串！这份文件要公开托管（GitHub Pages），
       写进代码 = 等于把密钥贴到公网，而且会永久留在 git 历史里，删文件也删不掉
       · 正确做法：打开页面 → 持仓面板右上角「未配置 API Key · 点这里设置」→ 填进去
       · 密钥只写进你这台设备的浏览器；填了口令就先 AES-GCM 加密再存
       · 创建密钥时只勾「允许合约」，永远不要勾提现
   PROXY / PROXY_WS     : 直连被 CORS / 地区限制拦住时填中转地址；
       也可以在控制台跑 BN.setProxy("https://中转","wss://中转")，换地址不用重新部署
   ========================================================== */
let API_KEY="";                 // 留空，在页面里填
let API_SECRET="";              // 留空，在页面里填
const PROXY="";                 // 例："http://127.0.0.1:8787"
const PROXY_WS="";              // 例："ws://127.0.0.1:8788"
/* ========================================================== */
let BASE=PROXY||"https://fapi.binance.com";
let WSU=(PROXY_WS||"wss://fstream.binance.com")+"/ws";
try{const _px=JSON.parse(localStorage.getItem("bn_proxy")||"null");   // 中转地址也存本机：换地址不用改代码重新部署
  if(_px&&_px.http)BASE=_px.http;
  if(_px&&_px.ws)WSU=_px.ws+"/ws";}catch(e){}
const QUOTE="USDC";             // 只看 USDC 本位永续；改 "USDT" 看 USDT 本位

async function syncTime(){
  /* 必须自带超时：boot() 第一步就 await 它。代理挂死时 fetch 可能永远不 resolve，

    if(j&&j.serverTime){TOFF=+j.serverTime-Date.now();log("time offset "+TOFF+"ms");}}

}
function qs(o){return Object.keys(o).filter(k=>o[k]!==undefined&&o[k]!==null&&o[k]!=="")
  .map(k=>encodeURIComponent(k)+"="+encodeURIComponent(o[k])).join("&");}
function bnErr(j){                            // 币安错误体统一成 Error（带 code，便于按错误码分支）
  const e=new Error((j&&j.msg)||("code "+((j&&j.code)||"?")));e.code=+((j||{}).code||0);return e;}
async function req(method,path,query,headers,ms){
  if(Date.now()<backoffUntil)throw new Error("backoff");
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;
  const tm=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},ms||15000);
  try{
    const r=await fetch(BASE+path+(query?"?"+query:""),{method,headers:headers||{},signal:ctl?ctl.signal:undefined});
    const j=await r.json().catch(()=>null);
    if(r.status===429||r.status===418||r.status===403){NET.fail++;
      backoffUntil=Math.max(backoffUntil,Date.now()+Math.min(60000,3000*NET.fail));
      throw bnErr(j||{msg:"HTTP "+r.status,code:-r.status});}
    if(j&&j.code!=null&&+j.code<0)throw bnErr(j);
    if(!r.ok)throw bnErr(j||{msg:"HTTP "+r.status});
    NET.info=Date.now();NET.fail=0;backoffUntil=0;return j;
  }catch(e){
    if(e.name==="AbortError")e.timeout=true;
    if(!e.code){NET.fail++;if(NET.fail>=3)backoffUntil=Math.max(backoffUntil,Date.now()+Math.min(30000,2000*NET.fail));}
    throw e;
  }finally{clearTimeout(tm);}
}

  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await passKey(pass,salt),
    new TextEncoder().encode(JSON.stringify({k,s})));
  return {v:1,mode:"aes",salt:b64(salt),iv:b64(iv),ct:b64(ct)};

/* listenKey 属于 USER_STREAM：只要 API Key 头，不要签名也不要参数 */
async function keyReq(method,path){

  const tm=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},15000);
  try{

    const j=await r.json().catch(()=>null);

function okAll(res){                          // batchOrders 会逐单返回，必须逐单查错

function errsOf(res){

}

/* ================= 行情：品种 / 24h / 杠杆档位 / K 线 ================= */
let _uniAt=0;
async function loadUniverse(){
  const ex=await pub("/fapi/v1/exchangeInfo");
  const uni=[],f={};
  (ex.symbols||[]).forEach(s=>{
    if(s.status!=="TRADING"||s.contractType!=="PERPETUAL"||s.quoteAsset!==QUOTE)return;
    const ft={};(s.filters||[]).forEach(x=>ft[x.filterType]=x);
    f[s.symbol]={base:s.baseAsset,
      tick:+((ft.PRICE_FILTER||{}).tickSize)||0.01,
      step:+((ft.LOT_SIZE||{}).stepSize)||0.001,
      minQty:+((ft.LOT_SIZE||{}).minQty)||0,
      maxQty:+((ft.LOT_SIZE||{}).maxQty)||0,
      minNotional:+((ft.MIN_NOTIONAL||{}).notional)||5};
    uni.push({name:s.symbol});
  });
  if(!uni.length)throw new Error("exchangeInfo 无可用品种");
  S.f=f;S.uni=uni;_uniAt=Date.now();
  if(!S.f[S.sym])S.sym=S.f["BTC"+QUOTE]?"BTC"+QUOTE:uni[0].name;
  await tickers();
  return uni.length;
}
async function tickers(){                     // 一次拿到全品种 24h 涨跌与成交额（成交额用于流动性筛选）
  const t=await pub("/fapi/v1/ticker/24hr");
  (Array.isArray(t)?t:[]).forEach(x=>{
    if(!S.f[x.symbol])return;
    S.ctx[x.symbol]=Object.assign({},S.ctx[x.symbol]||{},
      {last:+x.lastPrice,chg:+x.priceChangePercent,volUsd:+x.quoteVolume});
    if(S.mid[x.symbol]==null)S.mid[x.symbol]=+x.lastPrice;});
}
async function loadBrackets(){                // 杠杆档位：名义越大可用杠杆越低，用来避免下单被拒
  try{const b=await priv("GET","/fapi/v1/leverageBracket",{});
    (b||[]).forEach(x=>{
      const arr=(x.brackets||[]).map(k=>({cap:+k.notionalCap,lev:+k.initialLeverage}))
        .sort((m,n)=>m.cap-n.cap);
      if(arr.length){S.brk[x.symbol]=arr;S.maxLev[x.symbol]=arr[0].lev;}});
    useMaxLev();}
  catch(e){log("leverageBracket err "+e.message);}
}
function levFor(sym,notional){                // 该名义价值下交易所允许的最高杠杆
  const b=S.brk[sym];if(!b||!b.length)return S.maxLev[sym]||LEV_DEF;
  for(let i=0;i<b.length;i++)if(notional<=b[i].cap)return b[i].lev;
  return b[b.length-1].lev;

function useCandles(raw){S.k=raw.slice();const i=S.k.length-1;if(i>=0)S.k[i]=Object.assign({},S.k[i]);}
async function kline(force){
  const key=S.sym+"|"+S.tf,c=S.kc[key];       // 切品种不重置视窗：缩放与位置跟着走
  if(c&&c.k.length){useCandles(c.k);draw();}
  subCoin(S.sym,S.tf);
  if(!force&&c&&Date.now()-c.t<30000)return;
  try{const r=await pub("/fapi/v1/klines",{symbol:S.sym,interval:S.tf,limit:1500});
    const raw=(r||[]).map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}));
    if(raw.length){S.kc[key]={k:raw,t:Date.now()};useCandles(raw);}}

async function tick(){try{

/* ================= 行情 WebSocket ================= */
let ws,WSOK=false,wsTry=0,wsEver=false,wsId=1,WSCONN=0,wsPend=false,ARRON=false;
const SUB={sym:null,tf:null};
function wsSend(o){try{if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true;}}catch(e){}return false;}
function subCoin(sym,tf){
  if(!sym||!tf)return;
  const low=sym.toLowerCase();
  if(SUB.sym&&(SUB.sym!==sym||SUB.tf!==tf))
    wsSend({method:"UNSUBSCRIBE",params:[SUB.sym.toLowerCase()+"@kline_"+SUB.tf],id:wsId++});
  if(SUB.sym&&SUB.sym!==sym){const o=SUB.sym.toLowerCase();
    wsSend({method:"UNSUBSCRIBE",params:[o+"@ticker",o+"@markPrice@1s"],id:wsId++});}
  /* 当前品种单独再订一条 markPrice：!markPrice@arr 是全市场推送（几百个品种每秒一包），
     弱网、走代理或手机网络下经常根本推不过来；单品种这条很轻，
     保证下单用的价一定是活的。*/
  if(!wsSend({method:"SUBSCRIBE",params:[low+"@kline_"+tf,low+"@ticker",low+"@markPrice@1s"],id:wsId++}))return;
  SUB.sym=sym;SUB.tf=tf;
  MIDGRACE=Date.now()+10000;   // 新品种的价还在路上，给 10 秒宽限，别急着判定推送不通
}
/* 全市场标记价 !markPrice@arr@1s 是几百个品种每秒一包：流量、耗电、断流风险都来自它。
   只有币种列表面板真的要看全品种价，所以改成按需订阅，平时只留当前品种那条。*/
function subArr(on){
  on=!!on;if(ARRON===on)return;
  ARRON=on;wsSend({method:on?"SUBSCRIBE":"UNSUBSCRIBE",params:["!markPrice@arr@1s"],id:wsId++});
  log("arr stream "+(on?"on":"off"));
}
function sock(){
  WSCONN=Date.now();
  try{ws=new WebSocket(WSU);}catch(e){setTimeout(sock,3000);return;}
  ws.onopen=()=>{WSOK=true;wsTry=0;NET.ws=Date.now();SUB.sym=null;SUB.tf=null;
    if(ARRON)wsSend({method:"SUBSCRIBE",params:["!markPrice@arr@1s"],id:wsId++});   // 只有币种列表打开时才需要全品种价
    subCoin(S.sym,S.tf);
    if(wsEver){tickers().then(head).catch(()=>{});kline(true);}            // 重连后强制校准一次
    wsEver=true;};
  ws.onerror=()=>{WSOK=false;};        // onerror 后浏览器一定会再发 onclose，重连交给它
  ws.onclose=()=>{WSOK=false;wsPend=true;
    setTimeout(()=>{wsPend=false;sock();},Math.min(30000,2000*Math.pow(2,wsTry++)));};
  ws.onmessage=ev=>{
    NET.ws=Date.now();
    let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    const d=m&&m.data!==undefined?m.data:m;
    if(Array.isArray(d)){                                                  // markPriceUpdate 数组
      if(!d.length||d[0].e!=="markPriceUpdate")return;
      NET.mid=Date.now();d.forEach(x=>{if(S.f[x.s])S.mid[x.s]=+x.p;});
      schedule();return;}
    if(!d||!d.e)return;
    if(d.e==="markPriceUpdate"){                                        // 单品种标记价（全市场数组版在上面）
      NET.mid=Date.now();if(S.f[d.s])S.mid[d.s]=+d.p;schedule();return;}
    if(d.e==="kline"){
      const x=d.k||{};if(d.s!==S.sym||x.i!==S.tf)return;
      const key=S.sym+"|"+S.tf,c=S.kc[key];if(!c||!c.k.length)return;
      const b={t:+x.t,o:+x.o,h:+x.h,l:+x.l,c:+x.c},last=c.k[c.k.length-1];
      if(last&&last.t===b.t)c.k[c.k.length-1]=b;else if(!last||b.t>last.t)c.k.push(b);
      c.t=Date.now();useCandles(c.k);schedule();return;}
    if(d.e==="24hrTicker"){                                                // 当前品种：最新价 + 24h 涨跌
      if(!S.f[d.s])return;
      S.ctx[d.s]=Object.assign({},S.ctx[d.s]||{},{last:+d.c,chg:+d.P,volUsd:+d.q});
      const bar=S.k[S.k.length-1];if(d.s===S.sym&&bar&&+d.c)bar.c=+d.c;
      NET.info=Date.now();schedule();return;}
  };
}

/* WS 假连接兜底：手机切后台、Wi-Fi 切 5G、节点换线之后，socket 经常是 readyState 还为 1，
   但一条消息也不来，浏览器也不报 close。所以自己盯最后一条消息的时间，超时就掐掉重连。*/
function wsRecycle(why){
  log("ws recycle: "+why);wsTry=0;WSOK=false;
  MIDGRACE=Date.now()+12000;            // 重连期间流有空档，先别切状态
  try{if(ws)ws.close();}catch(e){}      // close 会触发 onclose → 自动重连
}
setInterval(()=>{
  if(!ws)return;
  const st=ws.readyState,t=Date.now();
  if(st===1&&NET.ws&&t-NET.ws>WS_SILENT)wsRecycle("静默 "+Math.round(WS_SILENT/1000)+"s");
  else if(st===0&&t-WSCONN>15000)wsRecycle("握手超过 15s 没完成");   // 代理挂死时会卡在 CONNECTING
  else if(st===3&&!wsPend)sock();                              // onclose 没排上重连时补一次
},5000);
/* 实时价轮询兜底：推送完全不通时，每 MID_POLL 拉一次全品种最新价（权重 2，很轻），
   保证还能看价、还能下单——而不是直接锁死面板。*/
async function midPoll(){
  if(!S.uni.length)return;
  /* 迟滞：掉到轮询要 MID_STALE 那么久没动静，回到推送只要 MID_BACK 内有新价。
     两个阈值不一样，推送延迟在阈值附近拖一拖时状态才不会来回横跳。
     来源切换不再弹提示：右上角时间旁边本来就会显示「· 轮询」，弹窗纯属噪音。*/
  const age=NET.mid?Date.now()-NET.mid:Infinity;
  if(age<(MIDSRC==="rest"?MID_BACK:MID_STALE)){
    if(MIDSRC==="rest"){MIDSRC="ws";log("mid 回到推送");
      try{tickClock();}catch(e){}}
    return;}
  try{
    const r=await pub("/fapi/v1/ticker/price");
    if(!Array.isArray(r)){midFail++;return;}
    /* 坑：REST 返回的字段是 symbol / price，WS 推送才是 s / p。
       上一版按 WS 字段写，结果一个品种也匹配不上，NET.mid 永远是 0 → 照旧锁单。
       现在两种字段都认，而且匹配不上会叫出来，不再默默失败。*/
    let n=0;r.forEach(x=>{const s=x&&(x.symbol||x.s),v=+(x&&(x.price!=null?x.price:x.p));
      if(s&&S.f[s]&&v>0){S.mid[s]=v;n++;}});
    if(!n){midFail++;log("midPoll 一个品种都没匹配上，字段可能又变了");
      if(midFail===3)toast("⚠ 实时价轮询数据对不上，请看日志");
      return;}
    midFail=0;
    NET.mid=Date.now();
    /* 换币种、刚重连的头几秒，新的 markPrice 流还在路上。这时照样轮询补价（不能锁单），
       但不改状态、不闪标记，免得切一次币就闪一次「· 轮询」。*/
    if(MIDSRC!=="rest"&&Date.now()>MIDGRACE){MIDSRC="rest";log("mid 改走轮询");
      try{tickClock();}catch(e){}}
    schedule();
  }catch(e){midFail++;log("midPoll err "+(e.message||e));
    if(midFail===3)toast("⚠ 实时价轮��也失败了，请检查网络或节点");}
}
setInterval(midPoll,MID_POLL);
/* 回到前台：iOS 会把后台页面的 WS 挂起，回来时先自查一遍，别等超时 */
addEventListener("visibilitychange",()=>{
  if(document.hidden)return;
  if(!ws||ws.readyState===3){wsTry=0;wsPend=false;sock();}
  else if(ws.readyState===1&&NET.ws&&Date.now()-NET.ws>8000)wsRecycle("回到前台后推送已停");
  MIDGRACE=Math.max(MIDGRACE,Date.now()+8000);   // 后台期间肯定没推送，回来先给点时间
  midPoll();try{kline(true);}catch(e){}
});

/* ================= 用户数据流（账户推送） ================= */
let uws=null,LKEY="",lkT=null,acctT=null;
function schedAcct(){if(acctT)return;acctT=setTimeout(()=>{acctT=null;load(true);},700);}
async function startUserStream(force){
  if(!HASKEY)return;
  try{
    if(force||!LKEY){const j=await keyReq("POST","/fapi/v1/listenKey");LKEY=(j||{}).listenKey||"";}
    if(!LKEY){log("listenKey empty");return;}
    try{if(uws)uws.close();}catch(e){}
    uws=new WebSocket(WSU+"/"+LKEY);            // 跟行情走同一个中转地址，不要再读 PROXY_WS
    uws.onopen=()=>log("user stream open");
    uws.onclose=()=>{setTimeout(()=>startUserStream(false),4000);};
    uws.onerror=()=>{};
    uws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data);}catch(e){return;}
      const d=m&&m.data!==undefined?m.data:m;if(!d||!d.e)return;
      if(d.e==="listenKeyExpired"){log("listenKey expired");startUserStream(true);return;}
      if(d.e==="ORDER_TRADE_UPDATE"){
        const o=d.o||{};
        if((o.X==="FILLED"||o.X==="PARTIALLY_FILLED")&&PENDBR[o.s])setTimeout(()=>firePendingBracket(o.s),600);
        schedAcct();return;}
      if(d.e==="ACCOUNT_UPDATE"){
        (((d.a||{}).P)||[]).forEach(p=>{                    // 先本地补一刀让界面不迟滞，真值仍以 REST 为准
          const k=posKey(p.s,p.ps),amt=+p.pa;
          if(!amt){delete S.pos[k];return;}
          S.pos[k]=Object.assign(S.pos[k]||{sym:p.s,side:p.ps||"BOTH"},
            {amt,entry:+p.ep,upnl:+p.up});});
        NET.acct=Date.now();schedAcct();
        if($("#shPos").classList.contains("on"))posView();
        schedule();return;}
    };
    clearInterval(lkT);lkT=setInterval(()=>{keyReq("PUT","/fapi/v1/listenKey").catch(e=>log("keepalive err "+e.message));},1500000);
  }catch(e){log("userStream err "+e.message);setTimeout(()=>startUserStream(true),10000);}
}

/* ================= 账户 / 持仓 / 挂单 ================= */
function posKey(sym,side){return (!side||side==="BOTH")?sym:sym+":"+side;}
function posOf(sym){return Object.values(S.pos).filter(p=>p.sym===sym);}
function curPos(){return posOf(S.sym)[0]||null;}
function applyAcct(acc,pos,od){
  if(acc)S.acct={equity:+acc.totalMarginBalance||+acc.totalWalletBalance||0,
    avail:+acc.availableBalance||0,used:+acc.totalInitialMargin||0,
    wallet:+acc.totalWalletBalance||0,upnl:+acc.totalUnrealizedProfit||0};
  if(pos){S.pos={};
    (pos||[]).forEach(p=>{const amt=+p.positionAmt;if(!amt)return;
      const k=posKey(p.symbol,p.positionSide);
      S.pos[k]={sym:p.symbol,side:p.positionSide||"BOTH",amt,entry:+p.entryPrice,
        liq:+p.liquidationPrice,upnl:+p.unRealizedProfit,lev:+p.leverage||0,
        iso:p.marginType==="isolated"||p.isolated===true};
      if(+p.leverage>0)S.levSet[p.symbol]=+p.leverage;});}
  if(od){S.ords={};S.ordsAt=Date.now();
    (od||[]).forEach(o=>{if(o&&o.symbol)(S.ords[o.symbol]=S.ords[o.symbol]||[]).push(o);});
    try{prunePendBr();}catch(e){log("prune err "+e.message);}
    sweepStaleEntries().catch(e=>log("ttl err "+e.message));}
  /* 补挂止损必须等挂单快照也更新完：它要靠 S.ords 判断“止损是不是已经挂着了”，
     用上一轮的旧快照判断，可能会重复挂一张。所以从 if(pos) 块里挪到这儿。*/
  if(pos)Object.keys(PENDBR).forEach(s=>firePendingBracket(s));
  NET.acct=Date.now();
}
async function load(silent){
  if(!HASKEY){if(!silent)toast("未配置 API Key / Secret，无法读取账户");return;}
  try{
    const tasks=[priv("GET","/fapi/v2/account",{}),priv("GET","/fapi/v2/positionRisk",{}),
      priv("GET","/fapi/v1/openOrders",{})];
    if(S.dual==null)tasks.push(priv("GET","/fapi/v1/positionSide/dual",{}).catch(()=>null));
    const [acc,pos,od,dual]=await Promise.all(tasks);
    if(dual&&dual.dualSidePosition!=null)S.dual=!!dual.dualSidePosition;
    applyAcct(acc,pos,od);
    if(!silent){const a=acctView();
      toast("已加载：总资金 $"+money(a.equity)+" · 可用 $"+money(a.avail)+"，持仓已置顶");}
    sweepOrphans(true);
  }catch(e){
    log("load err "+e.code+" "+e.message);
    if(!silent)toast(keyHint(e)||("账户读取失败："+e.message));
  }
  render();posView();draw();
}
function keyHint(e){                          // 把最常见的三种权限/环境错误说清楚，不要只丢错误码
  const c=+((e||{}).code||0);
  if(c===-2015)return "API Key 无效 / 未开合约权限 / IP 不在白名单（-2015）";
  if(c===-2014||c===-1022)return "签名不通过：检查 Secret 是否粘错（-1022）";
  if(c===-1021)return "本机时间与交易所偏差过大，已重新校时，请重试（-1021）";
  return "";
}
function acctView(){const a=S.acct||{};
  return{equity:+a.equity||0,avail:+a.avail||0,used:+a.used||0,wallet:+a.wallet||0,upnl:+a.upnl||0};}
const equity=()=>acctView().equity;
const availMargin=()=>acctView().avail;
const hasAcct=()=>equity()>0;
/* 挂单类型/数量/价格的统一解析：字段不全时也能显示正确文案 */
function ordInfo(o){
  const t=String(o.type||""),stop=+(o.stopPrice||0),lim=+(o.price||0);
  const closeAll=o.closePosition===true||o.closePosition==="true";
  const ro=!!o.reduceOnly||closeAll;
  const trail=/TRAILING/.test(t);
  const tp=/TAKE_PROFIT/.test(t),sl=/STOP/.test(t)&&!trail;
  const trig=trail||stop>0||/STOP|TAKE_PROFIT/.test(t);
  const isEntry=trig&&!ro;
  const kind=trail?"追踪止损":trig?(isEntry?"触发入场":tp?"止盈":"止损"):(ro?"限价平仓":"限价");
  const size=Math.abs(+o.origQty||0);
  const sizeTxt=closeAll?"全平":size>0?sz(size,o.symbol):"—";
  const price=trig?stop:lim;

    priceTxt=px(stop,o.symbol)+" → 限 "+px(lim,o.symbol);
  return{t,trig,ro,closeAll,tp,sl,trail,isEntry,kind,size,sizeTxt,price,priceTxt,
    sideTxt:o.side==="BUY"?"买":"卖"};
}

/* 孤儿单：没有持仓、也没有在等成交的入场单，却还挂着止盈止损 */
let ORPHAN_KEY="",ORPHAN_AT=0;
function findOrphans(){
  const out=[];
  if(!S.acct||!S.ordsAt)return out;
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    if(PENDBR&&PENDBR[sym])return;
    const l=(arr||[]).filter(Boolean);
    if(!l.length)return;
    if(l.some(o=>!ordInfo(o).ro))return;      // 还有开仓单挂着（含触发入场单），等它成交
    l.forEach(o=>out.push({sym,oid:o.orderId}));});
  return out;
}
async function sweepOrphans(auto){
  const orphans=findOrphans();
  if(!orphans.length){ORPHAN_KEY="";if(!auto)toast("没有无持仓的止盈/止损单");return 0;}
  if(auto){
    const key=orphans.map(o=>o.sym+":"+o.oid).sort().join(","),t=Date.now();
    if(key===ORPHAN_KEY&&t-ORPHAN_AT<6e5)return orphans.length;
    ORPHAN_KEY=key;ORPHAN_AT=t;
    toast("发现 "+orphans.length+" 张无持仓的止盈/止损单，可在「持仓」面板一键清理");
    return orphans.length;}
  const syms=[...new Set(orphans.map(o=>o.sym))];
  for(const sym of syms){                     // 该品种的挂单已确认全是平仓单，整体撤掉最稳
    await send("DELETE","/fapi/v1/allOpenOrders",{symbol:sym},"清理 "+disp(sym)+" 孤儿单",true);
    delete S.ords[sym];}

}

/* ================= 提交层 ================= */
/* 常见拒单码的人话解释；LAST_ERR 让调用方能判断是不是只挂单被拒 */
let LAST_ERR=null;
const ERRH={"-5022":"只挂单（GTX）会立刻成交，被交易所拒单：价格往盘口外挪一点再试",
  "-2021":"触发价已被行情穿透，交易所拒挂",
  "-1111":"价格或数量精度不对（tick / stepSize）",
  "-1013":"不满足交易所的最小下单量或价格过滤器",
  "-4164":"名义价值低于交易所下限（约 5 USDC）",
  "-2019":"保证金不足",
  "-4131":"对手价太远，撮合保护拒单",
  "-2011":"撤单失败：这张单已经不在了",
  "-2027":"超出该杠杆档位下的最大可开名义价值",
  "-4061":"持仓模式不匹配（单向 / 双向）"};
function errText(e){const c=e&&e.code!=null?String(e.code):"";
  return ERRH[c]?ERRH[c]+"（"+c+"）":((e&&(e.msg||e.message))||("错误 "+c));}
async function send(method,path,params,msg,silent){
  if(LOCK){toast("行情异常，交易已锁定："+LOCK);return null;}
  if(INFLIGHT){toast("上一笔请求还在处理，请稍候");return null;}
  if(!HASKEY){copyJson({method,path,params},msg+"：未配置 API Key/Secret → 已复制请求 JSON");return null;}
  INFLIGHT=true;LAST_ERR=null;try{render();}catch(e){}
  const t0=Date.now();
  try{
    const res=await priv(method,path,params);
    const errs=errsOf(res);
    if(errs.length){LAST_ERR=errs[0];toast("被拒："+errs.map(errText).join(" / ").slice(0,140));return res;}
    if(!silent)toast(msg+" 已提交");
    setTimeout(()=>{if(Date.now()-(NET.acct||0)>5000)load(true);else log("skip reload (user stream fresh)");},900);
    return res;
  }catch(e){
    if(e.code===-1021){await syncTime();toast("时间不同步已重新校时，请再点一次");return null;}
    if(e.code===-4061){S.dual=null;load(true);          // 你在 App 里改过单向/双向：重新读一次设置
      toast("持仓模式变了，已重新读取账户设置，请再点一次");return null;}
    if(e.timeout||!e.code){                    // 超时 ≠ 没成交，必须回读确认
      toast("提交无响应，正在对账…（"+(e.message||e)+"）");await reconcile(t0-5000);return null;}
    LAST_ERR=e;toast(keyHint(e)||("被拒："+errText(e)).slice(0,140));
    log("send err "+e.code+" "+e.message);
    return null;
  }finally{INFLIGHT=false;try{render();}catch(e){}}
}
async function reconcile(sinceMs){
  if(!HASKEY){toast("未配置 API Key，无法对账，请手动核对");return null;}
  await new Promise(r=>setTimeout(r,1500));    // 给交易所一点落库时间
  const t0=sinceMs||Date.now()-120000;
  try{
    const [acc,pos,od,tr]=await Promise.all([
      priv("GET","/fapi/v2/account",{}),priv("GET","/fapi/v2/positionRisk",{}),
      priv("GET","/fapi/v1/openOrders",{}),
      priv("GET","/fapi/v1/userTrades",{symbol:S.sym,startTime:Math.floor(t0)}).catch(()=>[])]);
    applyAcct(acc,pos,od);posView();render();draw();
    const hits=(tr||[]).filter(f=>+f.time>=t0);
    toast(hits.length?("对账："+disp(S.sym)+" 期间有 "+hits.length+" 笔成交，持仓已刷新")
      :"对账：未发现新成交，持仓/挂单已刷新");
    return{acc,pos,od,fills:hits};
  }catch(e){toast("对账失败，请到币安 App 手动核对后再重试");return null;}
}
/* 杠杆必须真的设置成功，否则保证金估算与实际不符 → 阻止下单。
   已有持仓时绝不改杠杆：会改变已有仓位的强平价。也绝不动全仓/逐仓设置。*/
async function ensureLev(target){
  if(!HASKEY)return true;
  const sym=S.sym,cp=curPos(),want=Math.max(1,Math.round(target||S.lev));
  if(cp&&cp.amt!==0){
    const cur=cp.lev||0;
    if(cur>0&&cur!==S.lev){
      S.lev=cur;S.levSet[sym]=cur;savePref();
      toast("已有 "+disp(sym)+" 持仓，沿用现有 "+cur+"x"+(cp.iso?"（逐仓）":"")+"，请再确认一次");
      try{render();}catch(e){}
      return false;}
    return true;}
  if(S.levSet[sym]===want)return true;
  const res=await send("POST","/fapi/v1/leverage",{symbol:sym,leverage:want},"杠杆 "+want+"x",true);
  if(!res||+res.leverage!==want){log("setLeverage fail");return false;}
  S.levSet[sym]=want;return true;
}
async function closePos(key){
  const p=S.pos[key];if(!p)return;
  const sym=p.sym,lg=p.amt>0,q=alignSz(Math.abs(p.amt),sym);
  if(!(q>0)){toast("持仓数量小于最小下单精度");return;}
  const m=mid(sym);
  if(!isFinite(m)||m<=0){toast("无法获取市价，已取消平仓");return;}
  // 只挂单平仓：挂在现价外 CLOSE_OFF 等对手来吃。不成交就一直挂着，可在持仓面板撤单或直接拖动改价。
  const lim=alignPx(lg?m*(1+CLOSE_OFF):m*(1-CLOSE_OFF),sym,lg?1:-1);
  const o={symbol:sym,side:lg?"SELL":"BUY",type:"LIMIT",timeInForce:TIF,
    price:fmtPx(lim,sym),quantity:fmtSz(q,sym)};
  if(S.dual)o.positionSide=p.side==="BOTH"?(lg?"LONG":"SHORT"):p.side;
  else o.reduceOnly="true";

}
async function modifyOrder(o,newPx){
  const sym=o.symbol,oi=ordInfo(o),p=alignPx(newPx,sym),pS=fmtPx(p,sym);
  if(!(p>0)){toast("价格无效");return;}
  if(!oi.trig&&/LIMIT/.test(oi.t)){

      quantity:o.origQty,price:pS,timeInForce:o.timeInForce||TIF},"改单 → "+px(p,sym));
    return;}
  // 触发单不支持改单：只能撤旧 + 重挂。两步之间不是原子的，失败会强提醒。
  const del=await send("DELETE","/fapi/v1/order",{symbol:sym,orderId:o.orderId},"撤旧单",true);
  if(!okAll(del)){toast("撤单失败，未改单");return;}
  const b={symbol:sym,side:o.side,type:oi.t,stopPrice:pS,workingType:o.workingType||WORK,priceProtect:"true"};
  if(oi.closeAll)b.closePosition="true";
  else{b.quantity=o.origQty;if(!S.dual&&o.reduceOnly)b.reduceOnly="true";}
  if(S.dual&&o.positionSide)b.positionSide=o.positionSide;
  if(!/MARKET/.test(oi.t)){b.price=pS;b.timeInForce=o.timeInForce||TIF;}
  const res=await send("POST","/fapi/v1/order",b,"改单 → "+px(p,sym));
  if(!okAll(res))toast("⚠ 旧单已撤但新单失败，当前可能裸仓，请立即检查！");
}

/* loadPref() 的调用在文件末尾 boot() 之前：这里 S / F 还没初始化完，提前调会直接报错白屏 */
/* ================= 心跳：算出“网页关了多久” ================= */
/* 页面关着的时候一行代码都跑不了，所以“关够久才撤单”只能等下次打开时结算：
   开着时每 ALIVE_MS 写一次时间戳，启动时 now - 上次心跳 = 这次离开了多久。
   刷新页面只隔几秒，不会误判；设备休眠一整夜等价于关着，正是要撤的情况。*/
const AKEY="bn_alive";
let AWAY=0,LAST_ALIVE=0;
function beat(){try{localStorage.setItem(AKEY,String(Date.now()));}catch(e){}}
function durTxt(ms){const m=Math.round(ms/6e4);
  return m<60?m+" 分钟":(Math.round(m/6)/10)+" 小时";}
(function readAway(){
  let t=0;try{t=+localStorage.getItem(AKEY)||0;}catch(e){}
  LAST_ALIVE=t;
  AWAY=t>0?Math.max(0,Date.now()-t):0;   // 没心跳记录（第一次用）就当没离开，宁可不撤
  beat();
})();
setInterval(beat,ALIVE_MS);
addEventListener("pagehide",beat);
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")beat();});

/* ================= 突破入场成交后自动补挂止损/止盈 ================= */
let PENDBR;try{PENDBR=JSON.parse(localStorage.getItem("bn_pendbr")||"{}")||{};}catch(e){PENDBR={};}
if(typeof PENDBR!=="object"||Array.isArray(PENDBR))PENDBR={};   // 存进去过 "null" / 坏数据时，Object.keys 会直接抛
function savePendBr(){try{localStorage.setItem("bn_pendbr",JSON.stringify(PENDBR));}catch(e){}}
/* 清掉失效的待补挂记录：没仓位、入场单也不在了（被撤/被拒），或者放超过 PENDBR_TTL。
   不清的话 findOrphans 会因为 PENDBR[sym] 而永久跳过这个品种，孤儿单巡检等于被悄悄关掉。*/
function prunePendBr(){
  if(!S.acct||!S.ordsAt)return;
  let ch=false;
  Object.keys(PENDBR).forEach(sym=>{
    const b=PENDBR[sym]||{};
    if(posOf(sym).length)return;                 // 有仓位 → 交给 firePendingBracket
    if(S.ordsAt<=(b.ts||0)+20000)return;         // 挂单快照比记录还旧，别急着判死
    const hasEntry=(S.ords[sym]||[]).filter(Boolean).some(o=>!ordInfo(o).ro);
    const stale=Date.now()-(b.ts||0)>PENDBR_TTL;
    if(hasEntry&&!stale)return;
    delete PENDBR[sym];ch=true;
    log("pendbr pruned "+sym+(stale?" (ttl)":" (entry gone)"));});
  if(ch)savePendBr();
}
/* 只挂单可能一直挂不上，挂太久的入场单自动撤掉，别让忘记的老单半夜被行情填掉 */
async function sweepStaleEntries(){
  if(!S.acct||!S.ordsAt)return;
  const away=AWAY_TTL>0&&LAST_ALIVE>0&&AWAY>=AWAY_TTL;   // 这次打开之前，网页确实关够久了
  if(!ENTRY_TTL&&!away)return;
  const tNow=Date.now(),kill=[];               // 别叫 now：会遮住全局 now()（带服务器时间偏移的签名时间源）
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;                 // 已有仓位就别动，可能是加仓单
    (arr||[]).filter(Boolean).forEach(o=>{
      if(ordInfo(o).ro)return;                   // 只撤开仓单，止损止盈不碰
      const t=+o.time||+o.updateTime||0;if(!t)return;
      /* 关页面之前就挂着、关着的这段时间也没成交 → 撤。只认关之前下的单，
         这次打开后新下的不算，否则刚下就被自己撤了。*/
      if(away&&t<LAST_ALIVE){kill.push({sym,oid:o.orderId,why:"away"});return;}
      if(ENTRY_TTL&&tNow-t>ENTRY_TTL)kill.push({sym,oid:o.orderId,why:"ttl"});});});
  for(const k of kill){
    await send("DELETE","/fapi/v1/order",{symbol:k.sym,orderId:k.oid},"超时撤单",true);
    toast(disp(k.sym)+(k.why==="away"
      ?" 入场单在网页关闭的 "+durTxt(AWAY)+" 里没成交，已自动撤单"
      :" 入场单挂了 "+durTxt(ENTRY_TTL)+" 没成交，已自动撤单"));}
}
const BRBUSY=new Set();                       // 内存标记，不落盘，否则刷新后会永久卡住
/* 止损只能用触发市价单：触发那一刻必须出得去。这是全程唯一会吃单的地方 */
function exitOrder(sym,lg,price,ps){
  const o={symbol:sym,side:lg?"SELL":"BUY",type:"STOP_MARKET",stopPrice:fmtPx(price,sym),
    closePosition:"true",workingType:WORK,priceProtect:"true"};
  if(S.dual)o.positionSide=ps||(lg?"LONG":"SHORT");
  return o;                                   // closePosition 跟随仓位缩量，仓位归零后交易所自动撤销
}
/* 兜底止盈：TAKE_PROFIT_MARKET + closePosition，和止损同一套机制，没仓位也能先挂着。
   触发价故意放在目标价之外 TP_FB_OFF：正常行情下由页面挂的 GTX 限价止盈先成交（挂单费），
   只有价格直接穿过去、或者你根本没开页面时，这张才会触发吃单平掉。*/
function tpFallbackOrder(sym,lg,tp,ps){
  const raw=lg?tp*(1+TP_FB_OFF):tp*(1-TP_FB_OFF);
  const o={symbol:sym,side:lg?"SELL":"BUY",type:"TAKE_PROFIT_MARKET",
    stopPrice:fmtPx(alignPx(raw,sym,lg?1:-1),sym),
    closePosition:"true",workingType:WORK,priceProtect:"true"};
  if(S.dual)o.positionSide=ps||(lg?"LONG":"SHORT");
  return o;
}
async function firePendingBracket(sym){
  const b=PENDBR[sym];if(!b)return;
  if(BRBUSY.has(sym))return;
  const p=posOf(sym).find(x=>(x.amt>0)===(b.side==="BUY"));
  if(!p)return;                               // 还没成交，或者方向对不上（比如反手了）
  BRBUSY.add(sym);
  try{
    const lg=p.amt>0,ps=p.side==="BOTH"?(lg?"LONG":"SHORT"):p.side;
    const live=(S.ords[sym]||[]).filter(Boolean).map(o=>ordInfo(o));
    const left=live.some(i=>!i.ro);        // 入场单还有剩量挂着 = 只部分成交
    /* 预挂的触发单可能在入场成交之前就被行情扫到，那一刻没有仓位，交易所会直接作废它。
       所以成交时按真实挂单快照复核一遍：该在的不在了，就当没挂过，重新补上。
       快照必须比下单时间新，否则可能是旧快照，误判会挂出重复的止损。
       注意：突破入场单本身也是 STOP 类型，所以必须同时要求 ro（只减仓/closePosition）。*/
    if(S.ordsAt>(b.ts||0)+1000){
      if(b.slDone&&!live.some(i=>i.sl&&i.ro)){b.slDone=false;log("pendbr 止损不见了，重挂 "+sym);}
      if(b.tpFbDone&&!live.some(i=>i.tp&&i.ro)){b.tpFbDone=false;log("pendbr 兜底止盈不见了，重挂 "+sym);}
      if(b.tpOid&&!live.some(i=>i.ro&&!i.sl&&!i.tp)){b.tpOid=null;b.tpQty=0;
        log("pendbr 限价止盈不见了，重挂 "+sym);}
    }
    const orders=[];let iSl=-1,iTp=-1,iFb=-1,tpQty=0;
    if(b.sl!=null&&!b.slDone){iSl=orders.length;
      orders.push(exitOrder(sym,lg,alignPx(b.sl,sym,lg?1:-1),ps));}
    /* 止盈数量必须等于当前仓位：入场还有剩量就先不挂，等成交完再挂；
       已经挂了但仓位又变大（剩量后来成交）就撤掉重挂，避免止盈只盖住一部分。*/
    if(b.tp!=null&&!left){
      tpQty=alignSz(Math.abs(p.amt),sym);
      if(tpQty>0&&tpQty>(+b.tpQty||0)*1.000001){
        if(b.tpOid){await send("DELETE","/fapi/v1/order",{symbol:sym,orderId:b.tpOid},"止盈数量已变，重挂",true);
          b.tpOid=null;b.tpQty=0;savePendBr();}
        const t={symbol:sym,side:lg?"SELL":"BUY",type:"LIMIT",timeInForce:TIF,
          quantity:fmtSz(tpQty,sym),price:fmtPx(alignPx(b.tp,sym,lg?1:-1),sym)};
        if(S.dual)t.positionSide=ps;else t.reduceOnly="true";
        iTp=orders.length;orders.push(t);}}
    if(b.tp!=null&&PREATTACH_TP&&!b.tpFbDone){          // 兜底止盈不看剩量，closePosition 自己跟仓位
      iFb=orders.length;orders.push(tpFallbackOrder(sym,lg,b.tp,ps));}
    const done=()=>!left&&(b.sl==null||b.slDone)&&(b.tp==null||!!b.tpOid)
      &&(b.tp==null||!PREATTACH_TP||!!b.tpFbDone);
    if(!orders.length){if(done()){delete PENDBR[sym];savePendBr();}return;}
    const what=[iSl>=0?"止损":"",iTp>=0?"止盈":"",iFb>=0?"兜底止盈":""].filter(Boolean).join("/");
    const res=await send("POST","/fapi/v1/batchOrders",{batchOrders:JSON.stringify(orders)},
      "入场已成交，自动挂"+what,true);
    const arr=Array.isArray(res)?res:[];
    const good=x=>x&&x.orderId!=null&&!(x.code!=null&&+x.code<0);
    if(iSl>=0&&good(arr[iSl]))b.slDone=true;
    if(iTp>=0&&good(arr[iTp])){b.tpOid=arr[iTp].orderId;b.tpQty=tpQty;}
    if(iFb>=0&&good(arr[iFb])){b.tpFbDone=true;b.tpFbOid=arr[iFb].orderId;}
    savePendBr();
    if(!(iSl>=0&&!b.slDone)){                 // 止损挂上了，或者本来就已经挂着
      log("bracket ok "+sym);toast(disp(sym)+" "+what+"已挂上");
      if(done()){delete PENDBR[sym];savePendBr();}
      return;}
    const errs=errsOf(res);
    if(errs.some(e=>+e.code===-2021)){         // 触发价已被穿透：重试没意义，必须人工处理
      delete PENDBR[sym];savePendBr();
      toast("⚠ "+disp(sym)+" 止损价已被行情穿透，交易所拒挂，当前是裸仓，请立即手动处理！");return;}
    b.tries=(b.tries||0)+1;savePendBr();
    log("bracket FAIL "+sym+" tries="+b.tries);
    if(b.tries>=BRACKET_MAX_TRY)toast("⚠ "+disp(sym)+" 止损补挂已失败 "+b.tries+" 次，当前是裸仓，请立即手动挂止损！");
    else{toast("⚠ "+disp(sym)+" 止损补挂失败（当前裸仓），"+Math.round(BRACKET_RETRY/1000)+"s 后重试");
      setTimeout(()=>{try{firePendingBracket(sym);}catch(e){log("bracket retry err "+e);}},BRACKET_RETRY);}
  }catch(e){
    b.tries=(b.tries||0)+1;savePendBr();log("bracket throw "+sym+" "+e);
    toast("⚠ "+disp(sym)+" 止损补挂异常（当前裸仓），将重试");
    setTimeout(()=>{try{firePendingBracket(sym);}catch(_){}},BRACKET_RETRY);
  }finally{BRBUSY.delete(sym);}
}

/* ================= 图表 ================= */
const cv=$("#cv"),g=cv.getContext("2d");let W=0,H=0,hv=null,geo={bw:1,cw:0};
const VIEW_MIN=25,VIEW_MAX=900,VIEW_DEF=110;  // 右端锁定后看更早的行情只能靠缩小，所以上限放大
let VW={n:VIEW_DEF,off:0},panning=false,pOff0=0,pinch0=0,pinchN=0;
function clampView(){const t=S.k.length||1;
  VW.n=Math.max(VIEW_MIN,Math.min(VIEW_MAX,Math.min(Math.round(VW.n),t)));
  /* 右端锁定：off 恒为 0。所有平移、缩放最后都过这里，所以不管怎么划拉、怎么捉，
     最新一根 K 线总在右侧留白旁边。想看更早的行情就双指缩小（最多 VIEW_MAX 根）；
     想恢复自由平移把 RIGHT_LOCK 改成 false 就行。*/
  VW.off=RIGHT_LOCK?0:Math.max(0,Math.min(t-VW.n,Math.round(VW.off)));}
function resetView(){VW.n=VIEW_DEF;VW.off=0;clampView();draw();}
function panBy(bars){VW.off+=bars;clampView();draw();}
function zoomBy(f,ax){const t=S.k.length;if(!t)return;
  const old=VW.n,endIdx=t-VW.off;
  let n=Math.max(VIEW_MIN,Math.min(VIEW_MAX,Math.min(Math.round(old*f),t)));
  const pl=geo.PL||0,cwv=geo.cw||W||1;        // 旧版写死 24（老左边距的残留），PL 现在恒为 0，缩放锚点会偏几像素
  const r=ax==null?1:Math.max(0,Math.min(1,(ax-pl)/Math.max(1,cwv-pl)));
  const anchor=endIdx-old+r*old;
  VW.off=t-Math.round(anchor+(1-r)*n);VW.n=n;clampView();draw();}
function fit(){const dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);draw();}
let _raf=0;
function schedule(){                          // 行情推送合并到一帧里重绘
  if(_raf)return;
  _raf=requestAnimationFrame(()=>{_raf=0;head();draw();
    if($("#shList").classList.contains("on"))list(true);});}
/* 图表颜色统一从 :root 读，缓存一次；换主题不用翻 JS */
const CO={};
function co(n){if(CO[n]==null)CO[n]=getComputedStyle(document.documentElement)
  .getPropertyValue("--"+n).trim()||"#2E2B26";return CO[n];}
/* 双主题：白天暖白纸底（亮环境下深字浅底更省力）、夜里暖深灰底（屏幕总光通量小）。
   默认跟随系统，点右上角时间或按 t 循环：跟随系统 → 日间 → 夜间。
   注意 co() 有缓存，切主题必须先清缓存再重画，否则画布还是旧颜色。*/
const THKEY="bn_theme",THMQ=matchMedia("(prefers-color-scheme: dark)");
const THNAME={auto:"跟随系统",light:"日间 暖白纸",dark:"夜间 暖深灰"};
let THMODE="auto";try{THMODE=localStorage.getItem(THKEY)||"auto";}catch(e){}
function applyTheme(){
  const dark=THMODE==="dark"||(THMODE==="auto"&&THMQ.matches);
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  Object.keys(CO).forEach(k=>delete CO[k]);          // 丢掉颜色缓存
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute("content",dark?"#1A1815":"#F2EFE9");
  const c=$("#clk");if(c)c.title="配色："+THNAME[THMODE]+"（点击切换）";
  try{draw();}catch(e){}
  try{render();}catch(e){}
}
function cycleTheme(){
  THMODE=THMODE==="auto"?"light":(THMODE==="light"?"dark":"auto");
  try{localStorage.setItem(THKEY,THMODE);}catch(e){}
  applyTheme();toast("配色："+THNAME[THMODE]);
}
try{THMQ.addEventListener("change",()=>{if(THMODE==="auto")applyTheme();});}catch(e){}
/* 右上角时间：点一下切配色，长按 600ms 报版本号（手机上没法 hover 看 title）*/
let clkT=null,clkLong=false;
try{const _clk=$("#clk");
  _clk.addEventListener("click",()=>{if(clkLong){clkLong=false;return;}cycleTheme();});
  _clk.addEventListener("pointerdown",()=>{clkLong=false;clearTimeout(clkT);
    clkT=setTimeout(()=>{clkLong=true;toast("BN Chart "+VER);},600);});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>_clk.addEventListener(ev,()=>clearTimeout(clkT)));
}catch(e){}
applyTheme();
function draw(){
  if(!W||!H||!S.k.length)return;
  const PL=0,PT=0,PB=0,ch=H-PT-PB;      // 右侧留白 PR 要等 bw 算出来才能定
  clampView();
  const _t=S.k.length,_e=_t-VW.off,d=S.k.slice(Math.max(0,_e-VW.n),_e);
  if(!d.length)return;
  const hi=Math.max(...d.map(x=>x.h)),lo=Math.min(...d.map(x=>x.l)),pd=(hi-lo)*.12||1;
  const T=hi+pd,B=lo-pd,y=p=>PT+(T-p)/(T-B)*ch;
  /* 右边留 RPAD_BARS 根 K 线宽的空白：最新一根不贴屏幕边，拖价、看最新价都舒服很多 */
  const bw=(W-PL)/(d.length+RPAD_BARS),PR=bw*RPAD_BARS,cw=W-PR;
  const bd=Math.max(1.5,Math.min(bw*.62,14));
  geo={bw,cw,PL,T,B,PT,ch};
  g.clearRect(0,0,W,H);g.font='11px "Menlo",monospace';g.textBaseline="middle";
  // 黑白 K 线：涨=空心（白底黑框），跌=实心（实黑）
  d.forEach((x,i)=>{const cx=PL+i*bw+bw/2,up=x.c>=x.o;
    g.strokeStyle=co("cline");g.lineWidth=1;
    g.beginPath();g.moveTo(Math.round(cx)+.5,y(x.h));g.lineTo(Math.round(cx)+.5,y(x.l));g.stroke();
    const a=y(x.o),b=y(x.c),ty=Math.min(a,b),hh=Math.max(1,Math.abs(b-a));
    if(up){g.fillStyle=co("bg");g.fillRect(cx-bd/2,ty,bd,hh);
      g.strokeRect(Math.round(cx-bd/2)+.5,Math.round(ty)+.5,Math.round(bd),Math.round(hh));}
    else{g.fillStyle=co("cbody");g.fillRect(cx-bd/2,ty,bd,hh);}});
  const L=d[d.length-1],ly=y(L.c);
  g.setLineDash([3,3]);g.strokeStyle=co("cgrid");
  g.beginPath();g.moveTo(PL,ly);g.lineTo(cw,ly);g.stroke();g.setLineDash([]);   // 横线也停在留白左侧，右边保持干净
  const pp=curPos();
  if(pp&&+pp.entry){const ey=y(+pp.entry);
    if(ey>PT&&ey<PT+ch){g.setLineDash([2,4]);g.strokeStyle=co("caim");
      g.beginPath();g.moveTo(PL,ey);g.lineTo(cw,ey);g.stroke();g.setLineDash([]);
      g.fillStyle=co("blue");g.textAlign="left";g.fillText("开仓 "+px(pp.entry,pp.sym),PL+6,ey-10);}}
  if(hv!=null&&d[hv]){const cx=PL+hv*bw+bw/2;g.strokeStyle=co("chair");g.setLineDash([4,4]);
    g.beginPath();g.moveTo(cx,PT);g.lineTo(cx,PT+ch);g.stroke();g.setLineDash([]);}
  if(S.k.length>1){                           // EMA20，跟随当前可见范围绘制
    const ema=[];let e20=S.k[0].c;S.k.forEach(b=>{e20=b.c*(2/21)+e20*(19/21);ema.push(e20);});
    const s0=Math.max(0,_e-VW.n);
    g.save();g.strokeStyle=co("ink");g.lineWidth=1.5;g.beginPath();let started=false;
    for(let i=s0;i<_e&&i<S.k.length;i++){const cx=PL+(i-s0)*bw+bw/2,cy=y(ema[i]);
      if(!started){g.moveTo(cx,cy);started=true;}else g.lineTo(cx,cy);}
    g.stroke();g.restore();}
  syncHandles();
}
function y2p(y){if(!geo.ch)return null;const r=(y-geo.PT)/geo.ch;
  if(r<-.02||r>1.02)return null;return geo.T-r*(geo.T-geo.B);}
function p2y(p){if(!geo.ch||p==null)return null;return geo.PT+(geo.T-p)/(geo.T-geo.B)*geo.ch;}
addEventListener("mousemove",e=>{
  if(!onChart(e.target)){if(hv!=null){hv=null;draw();}return;}   // 指针移到面板上就收起十字线，也少一次重绘
  hv=e.clientX>geo.cw?null:Math.floor((e.clientX-geo.PL)/geo.bw);draw();});
addEventListener("resize",fit);
function head(){
  const p=mid(S.sym);
  $("#nS").textContent=disp(S.sym);
  const bell=WATCH.some(w=>w.fired&&Date.now()-w.due<3e5);   // 刚收盘 5 分钟内：标签页标题也挂个铃铛
  document.title=(bell?"🔔 ":"")+px(p)+" "+disp(S.sym);render();
}

/* ================= 机会清单 =================
   看到形态好、但这根 K 线还没走完 —— 从「看到」到「能下单」这段空窗最容易忘。
   顶栏 ☆ 或按 W 记一笔，收盘那一刻响一声把你叫回来，不用写纸上。
   收盘时刻按 epoch 对齐直接算，不依赖行情推送；页面关着时响不了，重开会补提醒。*/
const WKEY="bn_watch";
let WATCH=[],_wsig="",WAC=null,WGEST=false;
function wLoad(){try{WATCH=JSON.parse(localStorage.getItem(WKEY)||"[]")||[];}catch(e){WATCH=[];}
  if(!Array.isArray(WATCH))WATCH=[];}
function wSave(){try{localStorage.setItem(WKEY,JSON.stringify(WATCH));}catch(e){}}
function tfMs(tf){return TFMS[tf]||36e5;}
function wDue(tf,from){const m=tfMs(tf);return Math.ceil(((from||Date.now())+1)/m)*m;}   // 下一根收盘时刻
function wFind(sym,tf){return WATCH.findIndex(w=>w.sym===sym&&w.tf===tf);}
function wHas(sym){return WATCH.some(w=>w.sym===sym);}
function wLeft(w){return w.due-Date.now();}
function cdTxt(ms){                                  // 倒计时：mm:ss，超过一小时才带小时
  if(ms<=0)return "已收盘";
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=n=>String(n).padStart(2,"0");
  return h?h+":"+p(m)+":"+p(ss):m+":"+p(ss);}
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function wPrune(){const n=Date.now(),b=WATCH.length;
  WATCH=WATCH.filter(w=>w&&w.sym&&w.tf&&n-w.due<WATCH_KEEP);
  if(WATCH.length>WATCH_MAX)WATCH=WATCH.slice(-WATCH_MAX);
  return WATCH.length!==b;}
/* 提示音：用 WebAudio 现生成，不用外部音频文件（单文件网页带不了资源）。
   浏览器要求先有用户手势才让出声，标记这一下点击正好把它解锁。*/
function wAudioInit(){try{if(!WAC)WAC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function wBeep(){
  if(!WGEST)return;                                  // 还没点过任何地方时浏览器不让出声，强发只会往控制台吐错；
                                                     // 此时靠 toast + 标题铃铛 + 按钮变色提醒，一样看得见
  try{wAudioInit();if(WAC){if(WAC.state==="suspended")WAC.resume();
    [0,190].forEach(d=>{const o=WAC.createOscillator(),g=WAC.createGain(),t=WAC.currentTime+d/1000;
      o.type="sine";o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
      o.connect(g);g.connect(WAC.destination);o.start(t);o.stop(t+0.2);});}}catch(e){log("beep err "+e.message);}
  try{if(WGEST&&navigator.vibrate)navigator.vibrate([90,60,90]);}catch(e){}}
function wToggle(sym,tf){
  sym=sym||S.sym;tf=tf||S.tf;
  const i=wFind(sym,tf);
  if(i>=0){WATCH.splice(i,1);wSave();wSync();toast("已取消标记 "+disp(sym)+" "+tf);return false;}
  const due=wDue(tf);
  WATCH.push({sym:sym,tf:tf,at:Date.now(),px:mid(sym)||0,due:due,fired:false});
  if(WATCH.length>WATCH_MAX)WATCH=WATCH.slice(-WATCH_MAX);
  wSave();wAudioInit();wSync();
  toast("已标记 "+disp(sym)+" "+tf+" · 收盘还有 "+cdTxt(due-Date.now()));
  return true;}
function wRemove(sym,tf){const i=wFind(sym,tf);if(i>=0){WATCH.splice(i,1);wSave();_wsig="";wSync();}}
async function wJump(sym,tf){                        // 点清单里一条：切过去，周期也跟着切回标记时那个
  const tfNew=tf&&tf!==S.tf;
  if(tfNew){S.tf=tf;applyPrefUI();hv=null;}
  if(sym&&sym!==S.sym){await pick(sym);}
  else if(tfNew){savePref();await kline();head();}
  wSync();}
function wSync(){                                    // 顶栏 ☆、机会按钮、清单，三处一起刷
  const st=$("#bStar");
  if(st){const on=wFind(S.sym,S.tf)>=0;
    st.classList.toggle("on",on);st.textContent=on?"★":"☆";
    st.title=(on?"取消标记":"标记这个机会")+"（W）：等这根 K 线收盘再下单";}
  const b=$("#bWat");
  if(b){const due=WATCH.filter(w=>wLeft(w)<=0).length;
    b.classList.toggle("hot",due>0);
    b.textContent=!WATCH.length?"机会"
      :due?("机会 "+WATCH.length+" · 可下单")
      :("机会 "+WATCH.length+" · "+cdTxt(Math.min.apply(null,WATCH.map(wLeft))));}
  const sh=$("#shWat");
  if(sh&&sh.classList.contains("on"))wList(true);}
function wList(soft){
  const box=$("#wlist");if(!box)return;
  const rows=WATCH.slice().sort((a,b)=>a.due-b.due),sig=rows.map(w=>w.sym+w.tf).join(",");
  const cnt=$("#wCnt");if(cnt)cnt.textContent=rows.length?rows.length+" 个":"";
  if(soft&&sig===_wsig&&rows.length){                // 每秒只改倒计时那几个字，不重建 DOM
    rows.forEach(w=>{const el=box.querySelector('.wi[data-c="'+w.sym+'"][data-tf="'+w.tf+'"]');if(!el)return;
      const l=wLeft(w),cd=el.querySelector(".cd"),dd=el.querySelector(".dd"),p=mid(w.sym);

/* ================= 行情健康检查 · 异常立即锁单 ================= */
function setLock(why){
  if(LOCK===why)return;
  const was=LOCK;LOCK=why;const b=$("#lockbar");
  if(b){b.textContent=why?"⚠ "+why+" · 交易已锁定":"";b.classList.toggle("on",!!why);}
  document.body.classList.toggle("locked",!!why);

/* 锁定只能拦住「新下单」，交易所那边挂着的未成交入场单照样会成交，而此时页面已经看不到行情。
   所以断线/停更时把它们撤掉（send 在锁定状态会拒发，这里直连 priv）。*/
async function onLocked(){
  /* 冷启动保护：本次打开到现在一次实时价都没收到（弱网/代理没通），
     这时的锁定不代表“行情断了”，而是“还没连上”。上一场留在交易所的入场单
     不该因此被清掉 —— 连上过再断线，才走自动撤单。*/
  if(!NET.mid&&!LOCK_CANCEL_COLDSTART){log("cold start lock, skip cancel");return;}
  const kill=[];
  Object.entries(S.ords||{}).forEach(([sym,arr])=>{
    if(posOf(sym).length)return;
    (arr||[]).filter(Boolean).forEach(o=>{if(!ordInfo(o).ro)kill.push({sym,oid:o.orderId});});});
  if(!kill.length)return;
  if(!LOCK_CANCEL_ENTRY){toast("⚠ 行情已锁定，但交易所还挂着 "+kill.length+" 张未成交入场单，建议手动撤掉");return;}
  toast("行情异常，正在撤掉 "+kill.length+" 张未成交入场单");
  for(const k of kill){
    try{await priv("DELETE","/fapi/v1/order",{symbol:k.sym,orderId:k.oid});log("lock-cancel "+k.sym);}
    catch(e){log("lock-cancel err "+e.message);}}
  load(true);
}
function lockCheck(){
  const t=Date.now(),ivl={"5m":3e5,"1h":36e5}[S.tf]||3e5;
  const age=NET.mid?t-NET.mid:Infinity;
  let why="";
  /* 只看价格新不新鲜，不看它从 WS 推送还是轮询来。
     旧逻辑只要 WS 一断就锁单，弱网下等于整天锁着。*/
  if(!S.uni.length)why="行情未加载";
  else if(t-T0>20000&&age>15000)
    why=NET.mid?"实时价中断 "+Math.round(age/1000)+" 秒":"实时价未接通";
  else if(NET.fail>=3)why="行情接口连续失败";
  else if(NET.info&&t-NET.info>45000)why="行情接口 45 秒无响应";
  else if(!NET.info)why="行情尚未加载";
  else if(S.k.length&&t-S.k[S.k.length-1].t>ivl*3)why="K 线停更";
  setLock(why);
}

/* ==========================================================
   TRADE 层·纯函数内核：不碰 DOM / 不碰全局状态，可单独单测
   测试：把 __CORE__ 之间的代码抄进 bn-core.test.mjs
   ========================================================== */
/*__CORE_START__*/
const TradeCore={
  dec(v){const n=+v;if(!isFinite(n)||n<=0)return 8;
    const s=n.toFixed(12).replace(/0+$/,""),i=s.indexOf(".");return i<0?0:Math.max(0,s.length-i-1);},
  /* 数量向下对齐到 stepSize，绝不向上取整（否则会超出可用保证金/持仓数量）*/
  alignSz(s,step){const st=+step>0?+step:1e-8,d=this.dec(st);
    return +(Math.floor((+s)/st+1e-9)*st).toFixed(d);},
  /* 价格对齐到 tickSize：dir -1 向下 / +1 向上 / 不传 = 四舍五入 */
  alignPx(p,tick,dir){const n=+p;if(!isFinite(n)||n<=0)return 0;
    const tk=+tick>0?+tick:0.01,d=this.dec(tk);
    const r=dir?(dir<0?Math.floor(n/tk+1e-9):Math.ceil(n/tk-1e-9)):Math.round(n/tk);
    if(!(r>0))return 0;return +(r*tk).toFixed(d);},
  /* 仓位计算：含手续费、最小/最大下单量、最小名义价值、可用保证金、杠杆约束
     返回 reasons[]（不能下单的具体原因）与 ok */
  sizing(i){
    const r={e:i.entry,sl:i.sl,tp:i.tp,risk:i.riskPct,reasons:[],ok:false};
    const lev=Math.max(1,Math.min(+i.lev||1,+i.maxLev||+i.lev||1));r.lev=lev;
    if(!(+i.equity>0))r.reasons.push("未加载账户资金");
    if(r.e==null||r.sl==null){r.reasons.push("入场或止损未选");return r;}
    const dist=Math.abs(r.e-r.sl);
    if(!dist||!isFinite(dist)){r.bad=true;r.reasons.push("止损 = 入场价，无效");return r;}
    r.dist=dist;
    const feeRt=(+i.feeRate||0)*2;                      // 开 + 平 两边
    const perUnit=dist+r.e*feeRt;                       // 每单位真实风险（含费）
    const budget=(+i.equity||0)*(+i.riskPct||0)/100;
    r.budget=budget;
    let size=this.alignSz(perUnit>0?budget/perUnit:0,i.step);
    if(!(size>0)){r.size=0;r.reasons.push("数量小于最小下单精度（stepSize="+(i.step||0)+"）");return r;}
    const avail=i.availableMargin!=null?+i.availableMargin:+i.equity||0;
    let notional=size*r.e,margin=notional/lev;
    if(margin+notional*feeRt>avail){                    // 保证金+开仓费不足：先缩仓，缩不下去才拒
      // 约束 notional/lev + notional*feeRt <= avail → size <= avail*lev/(e*(1+lev*feeRt))
      const maxSize=this.alignSz(avail*lev/(r.e*(1+lev*feeRt)),i.step);
      if(maxSize>0&&maxSize<size){size=maxSize;notional=size*r.e;margin=notional/lev;
        r.capped="可用保证金不足，已按可用保证金缩仓";}
      else if(!(maxSize>0)){r.size=0;r.reasons.push("可用保证金不足");return r;}
    }
    if(+i.maxQty>0&&size>+i.maxQty){                    // 品种单笔上限
      size=this.alignSz(+i.maxQty,i.step);notional=size*r.e;margin=notional/lev;
      r.capped=(r.capped?r.capped+"；":"")+"已按品种单笔上限缩仓";}
    if(+i.minQty>0&&size<+i.minQty)r.reasons.push("数量 "+size+" 低于最小下单量 "+i.minQty);
    const minN=+i.minNotional||0;
    if(notional<minN)r.reasons.push("名义价值 "+notional.toFixed(2)+" 低于最小 "+minN);
    r.size=size;r.notional=notional;r.margin=margin;
    r.fee=notional*feeRt;
    r.riskUsd=size*dist+r.fee;                          // 含费的实际风险
    if(i.tp!=null){const long=r.sl<r.e,good=long?(+i.tp>r.e):(+i.tp<r.e);
      if(!good)r.reasons.push("止盈方向错误（应在入场价的盈利一侧）");}
    r.rr=i.tp!=null?Math.abs(i.tp-r.e)/dist:null;
    r.ok=r.reasons.length===0&&size>0;
    return r;
  }
};
/*__CORE_END__*/

/* ---- 拖拽把手 ---- */
function bindGrip(hd,key){
  const grip=$(hd).querySelector(".grip");let on=false;
  const mv=ev=>{if(!on)return;
    const cy=ev.touches?.[0]?.clientY??ev.clientY,p=y2p(cy);
    if(p==null)return;
    F[key]=p;render();
    if(ev.cancelable)ev.preventDefault();};
  /* pointercancel 也必须收尾：iPad 上系统手势会直接吞掉 pointerup，
     漏了的话 on 一直是 true、pointermove 也一直挂着 ——
     手指早就离开了，入场/止损/止盈线还会跟着指针跑。*/
  const up=()=>{on=false;removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
    removeEventListener("pointercancel",up);};
  grip.addEventListener("pointerdown",ev=>{on=true;
    addEventListener("pointermove",mv,{passive:false});addEventListener("pointerup",up);
    addEventListener("pointercancel",up);
    if(ev.cancelable)ev.preventDefault();});
}

/* ================= 确认下单 ================= */
$("#ohGo").addEventListener("click",async()=>{
  if(SUBMITTING||INFLIGHT){toast("正在提交，请稍候");return;}      // 防双击双倍开仓
  if(!HASKEY){toast("未配置 API Key / Secret，无法下单");return;}
  if(ACCT_LOADING){toast("账户加载中，请稍候再试");return;}
  if(!hasAcct()){toast("未读到账户资金，无法下单");return;}
  const r=sizing();
  if(!r.ok){toast((r.reasons&&r.reasons[0])||"入场或止损无效");return;}
  const sym=S.sym,qty=fmtSz(alignSz(r.size,sym),sym);
  if(!(+qty>0)){toast("数量小于最小下单精度（stepSize="+(fOf(sym).step||0)+"）");return;}
  const buy=S.side==="buy",m=mid(sym);
  if(!isFinite(m)||m<=0){toast("无法获取市价，已阻止下单");return;}
  const side=buy?"BUY":"SELL",ps=buy?"LONG":"SHORT";
  const stopEntry=buy?(m<r.e):(m>r.e);   // 入场价在「突破方向」→ 先用触发单等价格过来，触发后照样只挂单
  const ePx=fmtPx(alignPx(r.e,sym,buy?-1:1),sym);   // 买往下对齐、卖往上对齐：尽量不要刚挂上就穿价被拒
  const entry=stopEntry
    ?{symbol:sym,side,type:"STOP",stopPrice:ePx,price:ePx,timeInForce:TIF,quantity:qty,
      workingType:WORK,priceProtect:"true"}
    :{symbol:sym,side,type:"LIMIT",timeInForce:TIF,quantity:qty,price:ePx};
  if(S.dual)entry.positionSide=ps;
  if(LOCK){toast("行情异常，交易已锁定："+LOCK);return;}
  SUBMITTING=true;try{render();}catch(e){}
  try{
    if(!await ensureLev(r.lev)){toast("杠杆设置未确认成功，已阻止下单");return;}
    /* PREATTACH_SL：入场单和止损单一起发。只挂单可能挂很久才成交，如果等成交再补挂止损，
       期间关掉页面 / 手机休眠就没人给你挂止损 → 裸仓。止损是 closePosition 触发单，
       没仓位时先挂着无害；入场一直没成交，它就是孤儿单，由清理孤儿单收尾。
       止盈仍然等成交后再挂，因为它必须按真实成交数量来。*/
    const slOrd=exitOrder(sym,buy,alignPx(r.sl,sym,buy?1:-1),ps);
    /* 兜底止盈也一起预挂：止盈本来是“成交后由页面补挂”，入场单在你关着页面时成交
       就只有止损、没有止盈。预挂一张 closePosition 触发单把这个窗口堵上。*/
    const tpFb=(PREATTACH_TP&&r.tp!=null)?tpFallbackOrder(sym,buy,r.tp,ps):null;
    const label=(stopEntry?(buy?"突破挂多 ":"突破挂空 "):(buy?"挂单做多 ":"挂单做空 "))+qty+" "+disp(sym);
    const good=x=>x&&x.orderId!=null&&!(x.code!=null&&+x.code<0);
    let arr=[],eOk=false,slOk=false,tpFbOk=false,slOid=null,tpFbOid=null;
    for(let tryN=0;tryN<=1;tryN++){
      const batch=[entry];
      /* 重挂只补没挂上的那几张：批量单是逐单结算的，上一轮止损/兜底止盈多半已经成功，
         这里再塞一次 = 同一个仓位两张止损、两张兜底止盈。*/
      const iSlB=(PREATTACH_SL&&!slOk)?batch.push(slOrd)-1:-1;
      const iFbB=(tpFb&&!tpFbOk)?batch.push(tpFb)-1:-1;
      const res=batch.length>1
        ?await send("POST","/fapi/v1/batchOrders",{batchOrders:JSON.stringify(batch)},label)
        :await send("POST","/fapi/v1/order",entry,label);
      arr=Array.isArray(res)?res:(res?[res]:[]);
      eOk=good(arr[0]);
      if(iSlB>=0&&good(arr[iSlB])){slOk=true;slOid=arr[iSlB].orderId;}   // 只往上累加，重试不能把上一轮的成功抹掉
      if(iFbB>=0&&good(arr[iFbB])){tpFbOk=true;tpFbOid=arr[iFbB].orderId;}
      if(eOk)break;
      const code=arr[0]&&arr[0].code!=null?+arr[0].code
        :(LAST_ERR&&LAST_ERR.code!=null?+LAST_ERR.code:0);
      if(code!==-5022||tryN>=1)break;         // -5022 = 只挂单会立刻成交被拒 → 往盘口外挪几个 tick 再试一次
      const tk=(fOf(sym).tick||0)*NUDGE_TICKS;
      if(!(tk>0))break;
      const np=alignPx(buy?(+entry.price-tk):(+entry.price+tk),sym,buy?-1:1);
      entry.price=fmtPx(np,sym);
      if(entry.stopPrice)entry.stopPrice=entry.price;
      toast("只挂单会立刻成交，已把价格挪到 "+px(np,sym)+" 重试");
    }
    /* 入场没挂上、但随单预挂的止损/兜底止盈挂上了 → 立刻撤掉。
       留着的话它不进 PENDBR、也不算“有仓位”，下次这个品种真有仓位时会被无端触发。
       直连 priv 不走 send：拒单往往伴随行情锁定，send 在 LOCK 下会拒发，撤不掉。*/
    if(!eOk){
      for(const oid of [slOid,tpFbOid].filter(Boolean)){
        try{await priv("DELETE","/fapi/v1/order",{symbol:sym,orderId:oid});log("rollback "+sym+" "+oid);}
        catch(err){log("rollback err "+((err&&err.message)||err));}}
      if(slOid||tpFbOid){toast("入场没挂上，已撤掉随单预挂的止损/止盈");load(true);}
      return;}
    if(PREATTACH_SL&&!slOk)toast("⚠ 止损没能一起挂上，成交后会自动补挂，请留意");
    if(tpFb&&!tpFbOk)toast("兜底止盈没挂上，成交后会自动补挂");
    PENDBR[sym]={side,sl:r.sl,tp:r.tp,qty:+qty,slDone:slOk,ts:Date.now(),
      tpFbDone:tpFbOk,tpFbOid:tpFbOid,
      oid:arr[0]&&arr[0].orderId!=null?arr[0].orderId:null};
    savePendBr();endFlow();
  }finally{SUBMITTING=false;try{render();}catch(e){}}
});

    catch(e){return "存不进去："+e.message;}
    return "已保存，刷新页面生效 · http="+(http||"直连")+" ws="+(ws||"直连");}};

/* 出了事至少留个记录：单文件页面没别的日志可看，BN.dump() 就是全部线索 */
addEventListener("error",e=>{try{log("window error "+((e&&e.message)||e));}catch(_){}});
addEventListener("unhandledrejection",e=>{try{const r=(e||{}).reason;log("unhandled "+((r&&r.message)||r));}catch(_){}});

/* ================= 启动 ================= */
async function boot(){
  await syncTime();                               // 签名依赖服务器时间，必须先校时
  try{await loadUniverse();sock();setInterval(tick,TICKER_MS);}
  catch(e){toast("行情加载失败，交易已锁定");log("boot universe err "+e.message);}
  await kline(true);head();
  await bootKeys();                               // 密钥来自本机存储，代码里没有
  avHint();
  if(HASKEY)await startPrivate();
  else if(!readRec())toast("未配置 API Key：只看行情。点持仓面板右上角就能填");
  ACCT_LOADING=false;
  setInterval(syncTime,3e5);
  posView();render();
}
loadPref();                                 // 偏好回填：必须等 S / F 都初始化完，而且要在 boot 之前
/* 画布必须先于 boot() fit 一次：boot() 要等校时 + 行情接口，网络慢时是十几秒，
   这期间 W/H 一直是 0，draw() 次次直接 return——K 线拉回来了也画不出来，整页空白。
   fit() 只看窗口尺寸、不碰网络，放最前面最安全。*/
try{fit();}catch(e){}
/* boot() 里任何一步抛错，都不能把收尾的 fit()/render() 一起拖下水；
   而 .then 后面没 .catch 还会变成 unhandledrejection，屏幕上什么都看不到。*/
boot().catch(e=>{log("boot err "+((e&&e.message)||e));toast("启动出错："+((e&&e.message)||e));})
  .then(()=>{try{fit();}catch(e){}try{render();}catch(e){}});
</script>
