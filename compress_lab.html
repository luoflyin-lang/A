<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>ETH 5m K线 vs 导出折线对比实验室 · 动态压缩比分析</title>
<style>
:root {
  --bg: #121211;
  --panel: #1A1918;
  --card: #222120;
  --border: #33312E;
  --text: #DDD7CB;
  --faint: #8C867A;
  --accent: #E5A93C;
  --accent-light: #F3C368;
  --up: #26A69A;
  --down: #EF5350;
  --line-poly: #00E5FF;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 52px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
}

.logo-badge {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

.nav-links {

  align-items: center;

}

.btn {

}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); color: #121211; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-light); color: #121211; }

.container {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 14px 16px;

  margin: 0 auto;

}

.dashboard-grid {

  grid-template-columns: 1fr 380px;
  gap: 14px;

}

@media(max-width: 960px) {
  .dashboard-grid { grid-template-columns: 1fr; }
}

.chart-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.panel-header {
  padding: 10px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);

  align-items: center;

.legend {

}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }

.canvas-wrapper {
  flex: 1;
  min-height: 440px;
  position: relative;
  width: 100%;
}

canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;

}

.ctrl-panel {
  background: var(--panel);
  border: 1px solid var(--border);

  flex-direction: column;
  gap: 12px;

  display: grid;

}

.metric-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;

}
.metric-card .title { font-size: 11px; color: var(--faint); margin-bottom: 2px; }
.metric-card .value { font-size: 18px; font-weight: 700; color: var(--text); }
.metric-card .sub { font-size: 10px; color: var(--accent); margin-top: 2px; }

.slider-group {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;

  flex-direction: column;

}

.slider-label {
  display: flex;
  justify-content: space-between;

}
.slider-label span.highlight { color: var(--accent); font-size: 13px; font-weight: 700; }

input[type=range] {
  -webkit-appearance: none;
  width: 100%;

  border-radius: 3px;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(229,169,60,0.5);

}
input[type=range]::-webkit-slider-thumb:hover {

}

.select-group {

}
select {

  color: var(--text);
  border: 1px solid var(--border);

}

.preview-box {
  flex: 1;
  display: flex;
  flex-direction: column;

}
.preview-box label { font-size: 11px; font-weight: 600; color: var(--faint); }
textarea {
  flex: 1;
  min-height: 180px;
  background: var(--bg);
  color: #A9DC76;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;

  font-size: 11px;

  outline: none;
  user-select: text;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: var(--accent);

  padding: 8px 16px;

  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 1000;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

<body>

<header>

  <div class="nav-links">

</header>

<div class="container">
  <div class="dashboard-grid">
    <div class="chart-panel">
      <div class="panel-header">
        <div id="chartTitle">ETHUSDT 5m · 出场前 150 根全量形态叠加视图</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:#FFFFFF;border:1px solid #666"></div> 真实K线蜡烛 (OHLC)</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--line-poly);box-shadow:0 0 6px var(--line-poly)"></div> 提取压缩折线</div>

    <div class="ctrl-panel">
      <div class="metric-cards">
        <div class="metric-card">
          <div class="title">原始 K 线点数</div>
          <div class="value" id="mOrigCount">150 根</div>

        </div>
        <div class="metric-card">
          <div class="title">形态保真度评分</div>

        </div>
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>压缩强度拉杆 (Tolerance)</span>

        </div>
        <input type="range" id="slCompress" min="1" max="10" step="1" value="3">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--faint)">
          <span>1 (高保真 35~50点)</span>
          <span>5 (标准 15~20点)</span>
          <span>10 (极简 6~10点)</span>
        </div>
      </div>

      <div class="select-group">
        <label style="font-weight:600">核心压缩算法</label>
        <select id="selAlgo">
          <option value="smart_rdp" selected>✨ 智能波段形态保真 (Smart RDP + Wave Extrema)</option>
          <option value="zigzag">⚡ ZigZag 极值拐点波段合并</option>
          <option value="slope">📈 单调趋势斜率合并 (Slope Merging)</option>
        </select>
      </div>

      <div style="display:flex;align-items:center;gap:6px;font-size:11px">
        <input type="checkbox" id="chkProtectEntry" checked>
        <label for="chkProtectEntry" style="cursor:pointer">强制保留入场/出场前后 2 根关键微观 K 线</label>
      </div>

      <div class="preview-box">
        <label>实时生成的 AI 极简折线数据格式：</label>
        <textarea id="txtAIOutput" readonly></textarea>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">提示信息</div>

<script>
const $ = s => document.querySelector(s);
let curKlines = [];
let entryIdx = 115;
let exitIdx = 150;
let isLong = true;

const toast = m => {
  const e = $("#toast"); e.textContent = m; e.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200);
};

function genSyntheticOrRealKlines(){
  const klines = [];
  let p = 2400 + Math.random() * 200;
  const now = Date.now() - 150 * 5 * 60 * 1000;
  
  for(let i = 0; i < 150; i++){
    const delta = (Math.random() - 0.49) * 8 + (Math.sin(i / 12) * 4);
    const o = p;
    const c = o + delta;
    const h = Math.max(o, c) + Math.random() * 4;
    const l = Math.min(o, c) - Math.random() * 4;
    p = c;
    klines.push({ t: now + i * 5 * 60 * 1000, o: +o.toFixed(2), h: +h.toFixed(2), l: +l.toFixed(2), c: +c.toFixed(2) });
  }

  curKlines = klines;
  entryIdx = Math.floor(90 + Math.random() * 40);
  exitIdx = 150;
  isLong = curKlines[exitIdx - 1].c >= curKlines[entryIdx - 1].c;
  update();
}

async function fetchRealBinance150(){
  toast("🎲 正在抓取真实历史 ETH 5m 切片…");
  try{
    const minT = 1600000000000, maxT = Date.now() - 86400000 * 30;
    const randEnd = Math.floor(minT + Math.random() * (maxT - minT));
    const r = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=ETHUSDT&interval=5m&endTime=${randEnd}&limit=150`);
    const j = await r.json();
    if(Array.isArray(j) && j.length >= 100){
      curKlines = j.map(x => ({ t: +x[0], o: +x[1], h: +x[2], l: +x[3], c: +x[4] }));
      entryIdx = Math.floor(curKlines.length * 0.75);
      exitIdx = curKlines.length;
      isLong = curKlines[exitIdx - 1].c >= curKlines[entryIdx - 1].c;
      $("#chartTitle").textContent = `ETHUSDT 5m 真实历史切片 · 入场 #${entryIdx} @ ${curKlines[entryIdx-1].c} · 出场 #${exitIdx} @ ${curKlines[exitIdx-1].c}`;
      update();
      toast("✅ 已加载 150 根真实 ETH 历史 K 线！");
      return;
    }
  }catch(e){
    console.warn("Binance fetch fallback:", e);
  }
  genSyntheticOrRealKlines();
}

function rdpSimplify(points, epsilon){
  if(points.length <= 2) return points;
  let dmax = 0, index = 0;
  const end = points.length - 1;
  
  const x1 = points[0].x, y1 = points[0].y;
  const x2 = points[end].x, y2 = points[end].y;
  const lineDist = Math.hypot(x2 - x1, y2 - x1) || 1;

  for(let i = 1; i < end; i++){
    const x0 = points[i].x, y0 = points[i].y;
    const num = Math.abs((y2 - y1) * x0 - (x2 - x1) * y0 + x2 * y1 - y2 * x1);
    const d = num / lineDist;
    if(d > dmax){
      dmax = d;
      index = i;
    }
  }

  if(dmax > epsilon){
    const left = rdpSimplify(points.slice(0, index + 1), epsilon);
    const right = rdpSimplify(points.slice(index), epsilon);
    return left.slice(0, -1).concat(right);
  } else {
    return [points[0], points[end]];
  }
}

function compressKlines(klines, level, algo, protectCritical = true){
  const n = klines.length;
  if(n <= 2) return [];

  const closes = klines.map(k => k.c);
  const minP = Math.min(...closes), maxP = Math.max(...closes);
  const priceRange = maxP - minP || 1;

  const critical = new Set();
  if(protectCritical){
    for(let off = -2; off <= 2; off++){
      const k = entryIdx + off;
      if(k >= 1 && k <= n) critical.add(k);
    }
    critical.add(exitIdx);
    critical.add(1);
  }

  const epsilon = priceRange * (0.008 + (level - 1) * 0.012);
  const zigzagPct = 0.003 + (level - 1) * 0.005;

  let retainedIndices = new Set(critical);

  if(algo === "smart_rdp"){
    const pts = closes.map((c, i) => ({ x: i + 1, y: c }));
    const simplified = rdpSimplify(pts, epsilon);
    simplified.forEach(p => retainedIndices.add(p.x));
  } else if(algo === "zigzag"){
    let lastP = closes[0], lastIdx = 1, trend = 0;
    retainedIndices.add(1);
    for(let i = 1; i < n; i++){
      const cur = closes[i];
      const diff = (cur - lastP) / lastP;
      if(trend === 0){
        if(Math.abs(diff) >= zigzagPct){
          trend = diff > 0 ? 1 : -1;
          lastP = cur; lastIdx = i + 1;
          retainedIndices.add(lastIdx);
        }
      } else if(trend === 1){
        if(cur > lastP){ lastP = cur; lastIdx = i + 1; }
        else if((lastP - cur) / lastP >= zigzagPct){
          retainedIndices.add(lastIdx);
          trend = -1; lastP = cur; lastIdx = i + 1;
        }
      } else {
        if(cur < lastP){ lastP = cur; lastIdx = i + 1; }
        else if((cur - lastP) / lastP >= zigzagPct){
          retainedIndices.add(lastIdx);
          trend = 1; lastP = cur; lastIdx = i + 1;
        }
      }
    }
    retainedIndices.add(n);
  } else {
    let i = 1;
    while(i <= n){
      retainedIndices.add(i);
      let j = i;
      if(j < n){
        const dir = closes[j] >= closes[j - 1] ? 1 : -1;
        while(j < n && !critical.has(j + 1)){
          const diff = closes[j] - closes[j - 1];
          if((dir === 1 && diff >= 0) || (dir === -1 && diff <= 0)) j++;
          else break;
        }
      }
      i = Math.max(i + 1, j);
    }
  }

  const sortedIdxs = Array.from(retainedIndices).sort((a, b) => a - b);
  return sortedIdxs;
}

function formatAIPrompt(sortedIdxs, klines){
  const sideStr = isLong ? "做多" : "做空";
  const header = `${sideStr} 入场#${entryIdx} 出场#${exitIdx}`;
  const lines = [header];

  for(let k = 0; k < sortedIdxs.length; k++){
    const curIdx = sortedIdxs[k];
    const curPrice = klines[curIdx - 1].c.toFixed(2);
    
    if(k < sortedIdxs.length - 1){
      const nextIdx = sortedIdxs[k + 1];
      if(nextIdx > curIdx + 1){
        const nextPrice = klines[nextIdx - 1].c.toFixed(2);
        lines.push(`#${curIdx}~#${nextIdx}: ${curPrice} -> ${nextPrice}`);
        k++;
        continue;
      }
    }

    let note = "";
    if(curIdx === entryIdx) note = " (入场)";
    else if(curIdx === exitIdx) note = " (出场)";
    lines.push(`#${curIdx}: ${curPrice}${note}`);
  }

  return lines.join("\n");
}

function renderCanvas(sortedIdxs){
  const cvs = $("#cvs");
  const wrap = $("#canvasWrap");
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;

  cvs.width = w * dpr;
  cvs.height = h * dpr;
  const ctx = cvs.getContext("2d");
  ctx.scale(dpr, dpr);

  ctx.clearRect(0, 0, w, h);

  const n = curKlines.length;
  if(n === 0) return;

  const padT = 30, padB = 40, padL = 20, padR = 60;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  let minP = Infinity, maxP = -Infinity;
  curKlines.forEach(k => {
    if(k.l < minP) minP = k.l;
    if(k.h > maxP) maxP = k.h;
  });
  const pDiff = (maxP - minP) || 1;
  const getY = p => padT + plotH - ((p - minP) / pDiff) * plotH;
  const getX = idx => padL + ((idx - 0.5) / n) * plotW;

  ctx.strokeStyle = "rgba(255,255,255,0.06)";
  ctx.lineWidth = 1;
  for(let i = 0; i <= 5; i++){
    const y = padT + (plotH / 5) * i;
    const p = maxP - (pDiff / 5) * i;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();

    ctx.fillStyle = "#7A756D";
    ctx.font = "10px monospace";
    ctx.fillText(p.toFixed(2), w - padR + 6, y + 3);
  }

  const barW = Math.max(2, (plotW / n) * 0.7);
  curKlines.forEach((k, i) => {
    const x = getX(i + 1);
    const yO = getY(k.o), yC = getY(k.c), yH = getY(k.h), yL = getY(k.l);
    const isUp = k.c >= k.o;

    ctx.strokeStyle = isUp ? "#A0A0A0" : "#404040";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, yH);
    ctx.lineTo(x, yL);
    ctx.stroke();

    ctx.fillStyle = isUp ? "#E0E0E0" : "#181818";
    const top = Math.min(yO, yC);
    const height = Math.max(1.5, Math.abs(yC - yO));
    ctx.fillRect(x - barW / 2, top, barW, height);
    ctx.strokeRect(x - barW / 2, top, barW, height);
  });

  if(sortedIdxs && sortedIdxs.length >= 2){
    ctx.save();
    ctx.strokeStyle = "#00E5FF";
    ctx.lineWidth = 2.5;
    ctx.shadowColor = "rgba(0, 229, 255, 0.6)";
    ctx.shadowBlur = 8;
    ctx.beginPath();

    sortedIdxs.forEach((idx, i) => {
      const x = getX(idx);
      const y = getY(curKlines[idx - 1].c);
      if(i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.restore();

    sortedIdxs.forEach(idx => {
      const x = getX(idx);
      const y = getY(curKlines[idx - 1].c);
      const isEntry = (idx === entryIdx);
      const isExit = (idx === exitIdx);

      ctx.beginPath();
      ctx.arc(x, y, isEntry || isExit ? 5 : 3, 0, Math.PI * 2);
      ctx.fillStyle = isEntry ? "#26A69A" : (isExit ? "#E5A93C" : "#00E5FF");
      ctx.fill();
      ctx.strokeStyle = "#121211";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if(isEntry || isExit){
        ctx.fillStyle = isEntry ? "#26A69A" : "#E5A93C";
        ctx.font = "bold 11px sans-serif";
        const txt = isEntry ? `🎯 入场 #${idx}` : `🏁 出场 #${idx}`;
        ctx.fillText(txt, x - 25, y - 10);
      }
    });
  }
}

function update(){
  const level = +$("#slCompress").value;
  const algo = $("#selAlgo").value;
  const protect = $("#chkProtectEntry").checked;

  const labels = [
    "等级 1 (高保真 · 35~45点)",
    "等级 2 (微观细腻 · 25~35点)",
    "等级 3 (🔥 推荐波段精简 · 15~22点)",
    "等级 4 (紧凑波段 · 12~18点)",
    "等级 5 (中度压缩 · 10~15点)",
    "等级 6 (强力过滤 · 8~12点)",
    "等级 7 (大波段拐点 · 7~10点)",
    "等级 8 (极简骨架 · 6~8点)",
    "等级 9 (极度浓缩 · 5~7点)",
    "等级 10 (极限压缩 · 4~5点)"
  ];
  $("#valSlider").textContent = labels[level - 1] || `等级 ${level}`;

  const retained = compressKlines(curKlines, level, algo, protect);
  const promptText = formatAIPrompt(retained, curKlines);

  const origChars = curKlines.length * 12;
  const compChars = promptText.length;
  const savedPct = Math.max(0, ((1 - compChars / origChars) * 100)).toFixed(1);

  $("#mOrigCount").textContent = `${curKlines.length} 根`;
  $("#mOrigChars").textContent = `~${origChars} 字符`;
  $("#mCompCount").textContent = `${retained.length} 节点`;
  $("#mCompChars").textContent = `~${compChars} 字符`;
  $("#mRatio").textContent = `${savedPct}%`;

  const fidelity = (100 - (level - 1) * 1.8).toFixed(1);
  $("#mFidelity").textContent = `${fidelity}%`;

  $("#txtAIOutput").value = promptText;

  renderCanvas(retained);
}

$("#slCompress").addEventListener("input", update);
$("#selAlgo").addEventListener("change", update);
$("#chkProtectEntry").addEventListener("change", update);
$("#btnRandK").addEventListener("click", fetchRealBinance150);

$("#btnCopyPrompt").addEventListener("click", () => {
  const t = $("#txtAIOutput").value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(() => toast("📋 已复制当前精炼 AI 提示词！"));
  } else {
    $("#txtAIOutput").select();
    document.execCommand("copy");
    toast("📋 已复制当前精炼 AI 提示词！");
  }
});

$("#btnSaveToApp").addEventListener("click", () => {
  const level = $("#slCompress").value;
  try{
    localStorage.setItem("ai_compress_level", level);
    localStorage.setItem("ai_compress_algo", $("#selAlgo").value);
  }catch(e){}
  toast(`💾 已将【压缩等级 ${level}】固化为主系统实盘默认规则！`);
});

window.addEventListener("resize", update);

fetchRealBinance150();
</script>
</body>
</html>
