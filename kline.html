<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三K线全天实时监控 (XAUUSD | EURUSD | SPX500)</title>
  <!-- TradingView 官方基础脚本
       data-cfasync="false" 是关键：阻止 Cloudflare Rocket Loader 改写/延迟该脚本 -->
  <script data-cfasync="false" type="text/javascript" src="https://s3.tradingview.com/tv.js" onerror="window.__tvLoadFailed = true;"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
    }

    /* 移动端地址栏让 100vh 溢出，用 dvh 兜底 */
    body {
      height: 100dvh;
    }

    /* 纵向三等分主容器 */
    #charts-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 单个图表卡片，严格平分 1/3 高度 */
    .chart-box {
      flex: 1 1 33.333%;
      width: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 图表之间极细黑分界线 */
    .chart-box:not(:last-child) {
      border-bottom: 1px solid #000000;
    }

    /* 裁剪容器：向右裁剪价格轴，向下裁剪时间轴 */
    .chart-crop {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(100% + 110px);
      height: calc(100% + 45px);
    }

    /* 遮住 TradingView 左下角 logo（图表在跨域 iframe 内，无法直接删除节点） */
    .logo-mask {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 130px;
      height: 32px;
      background-color: #ffffff;
      z-index: 998;
      pointer-events: none;
    }

    /* 左上角品种名称 */
    .symbol-overlay {
      position: absolute;
      top: 10px;
      left: 16px;
      z-index: 999;
      font-size: 14px;
      font-weight: 600;
      color: #000000;
      letter-spacing: 0.5px;
      user-select: none;
      pointer-events: none;
    }

    /* 第三个轮播品种允许点击手动预览与切换 */
    #symbol-3 {
      pointer-events: auto !important;
      cursor: pointer;
    }

    /* 右上角收盘倒计时：纯净简约，无背景无阴影 */
    .countdown-overlay {
      position: absolute;
      top: 10px;
      right: 16px;
      z-index: 999;
      font-size: 14px;
      font-weight: 600;
      color: #000000;
      letter-spacing: 0.5px;
      user-select: none;
      pointer-events: none;
      background: transparent;
      box-shadow: none;
      padding: 0;
    }

    /* 网络断开时右上角倒计时变红警示 */
    .countdown-overlay.is-offline {
      color: #ff3b30 !important;
      font-weight: 700 !important;
      background: rgba(255, 59, 48, 0.1) !important;
      padding: 2px 8px !important;
      border-radius: 4px !important;
    }

    /* 网络断开全屏蒙层与告警卡片 */
    #network-alert {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .network-alert-card {
      background: #ffffff;
      border: 2px solid #ff3b30;
      border-radius: 14px;
      box-shadow: 0 16px 48px rgba(255, 59, 48, 0.22);
      padding: 32px 36px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      animation: alertPulse 2s infinite ease-in-out;
    }

    @keyframes alertPulse {
      0%, 100% { border-color: #ff3b30; box-shadow: 0 16px 48px rgba(255, 59, 48, 0.22); }
      50% { border-color: #ff7875; box-shadow: 0 16px 48px rgba(255, 59, 48, 0.38); }
    }

    .network-alert-icon {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 14px;
    }

    .network-alert-title {
      font-size: 21px;
      font-weight: 700;
      color: #ff3b30;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .network-alert-desc {
      font-size: 14px;
      color: #444444;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .network-alert-status {
      font-size: 13px;
      color: #666666;
      background: #f5f5f7;
      border: 1px solid #e5e5ea;
      padding: 8px 14px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 22px;
    }

    .network-alert-btn {
      background: #ff3b30;
      color: #ffffff;
      border: none;
      padding: 11px 26px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .network-alert-btn:hover {
      background: #d62d23;
    }

    .network-alert-btn:active {
      transform: scale(0.97);
    }

    /* 脚本加载失败时的可见错误提示，避免只剩一片白 */
    #fatal-error {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      color: #000000;
      text-align: center;
      padding: 0 24px;
      font-size: 14px;
      line-height: 1.6;
    }

    #fatal-error strong {
      font-size: 17px;
    }

    #fatal-error span {
      font-size: 12px;
      color: #666666;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <!-- 网络断开高警示蒙层 -->
  <div id="network-alert">
    <div class="network-alert-card">
      <div class="network-alert-icon">⚠️</div>
      <div class="network-alert-title" id="network-alert-title">网络连接已断开！</div>
      <div class="network-alert-desc">行情数据与倒计时已立即暂停。请检查您的 Wi-Fi 或网络连接，切勿依据当前静止画面做交易决策！</div>
      <div class="network-alert-status" id="network-alert-status">正在持续监测网络，恢复后将自动刷新图表...</div>
      <div>
        <button class="network-alert-btn" id="network-retry-btn" onclick="manualCheckNetwork()">立即检测并刷新</button>
      </div>
    </div>
  </div>

  <!-- 三K线主容器 (三等分平铺) -->
  <div id="charts-container">
    <!-- 图表 1: 现货黄金 -->
    <div class="chart-box">
      <div class="symbol-overlay" id="symbol-1">XAUUSD</div>
      <div id="chart-1" class="chart-crop"></div>
      <div class="logo-mask"></div>
      <div class="countdown-overlay" id="countdown-1">--:--</div>
    </div>

    <!-- 图表 2: 欧元美元 -->
    <div class="chart-box">
      <div class="symbol-overlay" id="symbol-2">EURUSD</div>
      <div id="chart-2" class="chart-crop"></div>
      <div class="logo-mask"></div>
      <div class="countdown-overlay" id="countdown-2">--:--</div>
    </div>

    <!-- 图表 3: 轮播指数 (早上: 日经 / 中午: 德指 / 晚上: 标普) -->
    <div class="chart-box">
      <div class="symbol-overlay" id="symbol-3" onclick="cycleManualSlot()" title="点击手动切换：日经 / 德指 / 标普 / 自动轮播">--</div>
      <div id="chart-3" class="chart-crop"></div>
      <div class="logo-mask"></div>
      <div class="countdown-overlay" id="countdown-3">--:--</div>
    </div>
  </div>

  <!-- 致命错误提示（tv.js 未能加载时显示） -->
  <div id="fatal-error">
    <strong>图表脚本加载失败</strong>
    <div>无法加载 https://s3.tradingview.com/tv.js</div>
    <span>请检查网络 / 广告拦截插件，或确认 Cloudflare 未开启 Rocket Loader、未对该域设置阻断第三方脚本的 CSP。</span>
  </div>

  <script data-cfasync="false">
    /**
     * 图表 1 & 图表 2 全天 24 小时固定常驻 (黄金 + 欧美)
     */
    var FIXED_SYMBOLS = [
      { containerId: "chart-1", symbol: "OANDA:XAUUSD", title: "XAUUSD" },
      { containerId: "chart-2", symbol: "FX:EURUSD", title: "EURUSD" }
    ];

    /**
     * 图表 3 全球主要指数时段轮播定义 (基于北京时间 UTC+8)
     * 1. 早上 (06:00 - 14:00): 日经 225 (Nikkei 225, OANDA:JP225USD)
     * 2. 中午/欧盘 (14:00 - 20:30): 德国指数 40 (DAX 40, OANDA:DE40EUR)
     * 3. 晚上/美盘 (20:30 - 次日 06:00): 标普 500 (SPX 500, OANDA:SPX500USD)
     */
    var SLOT_CONFIG = [
      {
        id: "nikkei",
        name: "日经 (亚盘)",
        startMin: 6 * 60,         // 06:00
        endMin: 14 * 60,          // 14:00
        symbol: "OANDA:JP225USD",
        title: "JP225"
      },
      {
        id: "dax",
        name: "德指 (欧盘)",
        startMin: 14 * 60,        // 14:00
        endMin: 20 * 60 + 30,     // 20:30
        symbol: "FOREXCOM:GER40",
        title: "DAX"
      },
      {
        id: "spx",
        name: "标普 (美盘)",
        startMin: 20 * 60 + 30,   // 20:30
        endMin: 6 * 60,           // 06:00 (跨午夜)
        isCrossMidnight: true,
        symbol: "OANDA:SPX500USD",
        title: "SPX500"
      }
    ];

    var currentChart3SlotId = null;
    var manualSlot = null; // 允许键盘或点击手动预览

    function determineCurrentSlot() {
      // 北京时间 = UTC + 8
      var now = new Date();
      var utc = now.getTime() + now.getTimezoneOffset() * 60000;
      var bj = new Date(utc + 8 * 3600000);
      var currentMin = bj.getHours() * 60 + bj.getMinutes();

      for (var i = 0; i < SLOT_CONFIG.length; i++) {
        var slot = SLOT_CONFIG[i];
        if (slot.isCrossMidnight) {
          if (currentMin >= slot.startMin || currentMin < slot.endMin) {
            return slot;
          }
        } else {
          if (currentMin >= slot.startMin && currentMin < slot.endMin) {
            return slot;
          }
        }
      }
      return SLOT_CONFIG[0];
    }

    function updateChart3() {
      var activeSlot = manualSlot || determineCurrentSlot();
      if (currentChart3SlotId !== activeSlot.id) {
        currentChart3SlotId = activeSlot.id;

        var sym3 = document.getElementById("symbol-3");
        if (sym3) sym3.textContent = activeSlot.title;

        // 仅重新加载图表 3，图表 1 和图表 2 不受任何影响
        createTradingViewWidget("chart-3", activeSlot.symbol);
      }
    }

    function cycleManualSlot() {
      if (!manualSlot) {
        manualSlot = SLOT_CONFIG[0]; // JP225
      } else if (manualSlot.id === "nikkei") {
        manualSlot = SLOT_CONFIG[1]; // DAX
      } else if (manualSlot.id === "dax") {
        manualSlot = SLOT_CONFIG[2]; // SPX500
      } else {
        manualSlot = null; // 恢复自动
      }
      updateChart3();
    }

    var TV_MAX_RETRY = 40; // 约 20 秒
    var chartState = {};

    function showFatalError() {
      var el = document.getElementById("fatal-error");
      if (el) el.style.display = "flex";
    }

    /**
     * 创建 TradingView 图表组件 (15 分钟标准周期)
     */
    function createTradingViewWidget(containerId, symbol) {
      var container = document.getElementById(containerId);
      if (!container) return;

      var state = chartState[containerId];
      if (!state) {
        state = chartState[containerId] = { retry: 0 };
      }

      if (window.__tvLoadFailed) {
        showFatalError();
        return;
      }

      if (typeof TradingView === "undefined" || !TradingView.widget) {
        state.retry++;
        if (state.retry > TV_MAX_RETRY) {
          showFatalError();
          return;
        }
        setTimeout(function () {
          createTradingViewWidget(containerId, symbol);
        }, 500);
        return;
      }

      container.innerHTML = ""; // 清空容器

      new TradingView.widget({
        autosize: true,
        symbol: symbol,
        interval: "15",
        timezone: "Asia/Shanghai",
        theme: "light",
        style: "1", // 1 为普通K线
        locale: "zh_CN",
        backgroundColor: "#ffffff",
        gridColor: "rgba(255, 255, 255, 0)", // 去掉背景网格
        toolbar_bg: "#ffffff",
        enable_publishing: false,
        allow_symbol_change: false,
        hide_top_toolbar: true,
        hide_legend: true,
        hide_side_toolbar: true,
        save_image: false,
        hide_volume: true, // 彻底隐藏成交量
        loading_screen: {
          backgroundColor: "#ffffff",
          foregroundColor: "#ffffff"
        },
        disabled_features: [
          "volume_force_overlay",
          "create_volume_indicator_by_default",
          "header_widget",
          "timeframes_toolbar",
          "left_toolbar",
          "control_bar",
          "legend_widget",
          "scales_context_menu",
          "use_localstorage_for_settings",
          "save_chart_properties_to_local_storage",
          "display_market_status"
        ],
        container_id: containerId,
        studies: [
          {
            id: "MAExp@tv-basicstudies",
            inputs: {
              length: 20
            }
          }
        ],
        studies_overrides: {
          "moving average exponential.plot.color": "#000000",
          "moving average exponential.plot.linewidth": 2,
          // 兜底隐藏成交量柱线
          "volume.volume.color.0": "rgba(255, 255, 255, 0)",
          "volume.volume.color.1": "rgba(255, 255, 255, 0)",
          "volume.volume.transparency": 100,
          "volume.show ma": false
        },
        overrides: {
          // 纯白背景
          "paneProperties.background": "#ffffff",
          "paneProperties.backgroundType": "solid",
          // 彻底隐藏鼠标十字光标虚线
          "paneProperties.crossHairProperties.color": "rgba(255, 255, 255, 0)",
          "paneProperties.crossHairProperties.width": 0,

          // 去掉背景网格线与品种水印
          "paneProperties.vertGridProperties.color": "rgba(255, 255, 255, 0)",
          "paneProperties.horzGridProperties.color": "rgba(255, 255, 255, 0)",
          "paneProperties.separatorColor": "rgba(255, 255, 255, 0)",
          "symbolWatermarkProperties.color": "rgba(255, 255, 255, 0)",
          "symbolWatermarkProperties.transparency": 100,

          // 彻底隐藏实时现价虚线 (Price Line) 及相关基准线
          "mainSeriesProperties.showPriceLine": false,
          "mainSeriesProperties.priceLineColor": "rgba(255, 255, 255, 0)",
          "mainSeriesProperties.priceLineWidth": 0,
          "mainSeriesProperties.baseLineColor": "rgba(255, 255, 255, 0)",

          // 彻底隐藏买卖盘虚线 (Bid/Ask Line)
          "mainSeriesProperties.bidAsk.visible": false,
          "mainSeriesProperties.bidAsk.bidLineColor": "rgba(255, 255, 255, 0)",
          "mainSeriesProperties.bidAsk.askLineColor": "rgba(255, 255, 255, 0)",

          // 彻底隐藏昨收价虚线 (Prev Close Line)
          "mainSeriesProperties.showPrevClosePriceLine": false,
          "mainSeriesProperties.prevClosePriceLineColor": "rgba(255, 255, 255, 0)",

          // 隐藏最新价倒计时标签与高低均价线
          "mainSeriesProperties.showCountdown": false,
          "mainSeriesProperties.highLowAvgPrice.highLowPriceLinesVisible": false,
          "mainSeriesProperties.highLowAvgPrice.highLowPriceLabelsVisible": false,
          "mainSeriesProperties.highLowAvgPrice.averageClosePriceLineVisible": false,

          // 黑白蜡烛：上涨为空心/白色配黑边，下跌为纯黑
          "mainSeriesProperties.candleStyle.upColor": "#ffffff",
          "mainSeriesProperties.candleStyle.downColor": "#000000",
          "mainSeriesProperties.candleStyle.drawWick": true,
          "mainSeriesProperties.candleStyle.drawBorder": true,
          "mainSeriesProperties.candleStyle.borderColor": "#000000",
          "mainSeriesProperties.candleStyle.borderUpColor": "#000000",
          "mainSeriesProperties.candleStyle.borderDownColor": "#000000",
          "mainSeriesProperties.candleStyle.wickUpColor": "#000000",
          "mainSeriesProperties.candleStyle.wickDownColor": "#000000",

          // 坐标轴文字与刻度隐藏（透明）
          "scalesProperties.textColor": "rgba(255, 255, 255, 0)",
          "scalesProperties.lineColor": "rgba(255, 255, 255, 0)",
          "scalesProperties.showBidAskPrice": false,
          "scalesProperties.showSymbolLabels": false,
          "scalesProperties.showSeriesLastValue": false
        }
      });
    }

    /**
     * 批量加载图表：前两个固定，第三个按时段自适应
     */
    function initCharts() {
      for (var i = 0; i < FIXED_SYMBOLS.length; i++) {
        createTradingViewWidget(FIXED_SYMBOLS[i].containerId, FIXED_SYMBOLS[i].symbol);
      }
      updateChart3();
    }

    /**
     * 全天候网络连通性监测引擎
     * 1. 毫秒级原生事件监听 (window.offline / online)
     * 2. 每 2.5 秒主动心跳探测 (多源竞速，防止 Wi-Fi 连着但宽带断网)
     * 3. 断网时立刻锁定倒计时为红字 ⚠️ 网络断开，并弹出高警示模糊蒙层
     * 4. 恢复网络后自动重新加载 (location.reload)，确保 WebSocket 新建连接并拉取最新 K 线
     */
    var isNetworkOnline = true;
    var consecutiveFailures = 0;
    var isReconnecting = false;

    function setNetworkState(online) {
      if (online) {
        consecutiveFailures = 0;
        if (!isNetworkOnline) {
          // 由断网状态恢复！
          isNetworkOnline = true;
          isReconnecting = true;
          var titleEl = document.getElementById("network-alert-title");
          var statusEl = document.getElementById("network-alert-status");
          if (titleEl) {
            titleEl.textContent = "✅ 网络已恢复！";
            titleEl.style.color = "#34c759";
          }
          if (statusEl) {
            statusEl.textContent = "正在拉取最新行情数据，即将自动刷新图表...";
            statusEl.style.color = "#34c759";
          }
          // 延迟 400ms 刷新页面，确保 WebSocket 干净重连并补全缺失 K 线
          setTimeout(function() {
            window.location.reload();
          }, 400);
          return;
        }

        var alertEl = document.getElementById("network-alert");
        if (alertEl) alertEl.style.display = "none";

        var countdowns = document.querySelectorAll(".countdown-overlay");
        for (var i = 0; i < countdowns.length; i++) {
          countdowns[i].classList.remove("is-offline");
        }
      } else {
        if (!isNetworkOnline) return; // 已经是断网状态
        isNetworkOnline = false;

        var alertEl = document.getElementById("network-alert");
        if (alertEl) alertEl.style.display = "flex";

        var titleEl = document.getElementById("network-alert-title");
        var statusEl = document.getElementById("network-alert-status");
        if (titleEl) {
          titleEl.textContent = "⚠️ 网络连接已断开！";
          titleEl.style.color = "#ff3b30";
        }
        if (statusEl) {
          statusEl.textContent = "正在持续监测网络，恢复后将自动刷新图表...";
          statusEl.style.color = "#666666";
        }

        // 倒计时栏立即替换为醒目红字警告
        var c1 = document.getElementById("countdown-1");
        var c2 = document.getElementById("countdown-2");
        var c3 = document.getElementById("countdown-3");
        var warningText = "⚠️ 网络断开";
        if (c1) { c1.textContent = warningText; c1.classList.add("is-offline"); }
        if (c2) { c2.textContent = warningText; c2.classList.add("is-offline"); }
        if (c3) { c3.textContent = warningText; c3.classList.add("is-offline"); }
      }
    }

    function probeUrl(url, timeoutMs) {
      return new Promise(function(resolve) {
        if (typeof navigator.onLine === "boolean" && !navigator.onLine) {
          resolve(false);
          return;
        }
        var controller = new AbortController();
        var timer = setTimeout(function() {
          try { controller.abort(); } catch(e) {}
          resolve(false);
        }, timeoutMs || 2200);

        fetch(url, {
          mode: "no-cors",
          cache: "no-store",
          signal: controller.signal
        }).then(function() {
          clearTimeout(timer);
          resolve(true);
        }).catch(function() {
          clearTimeout(timer);
          resolve(false);
        });
      });
    }

    async function checkConnectivity() {
      // 1. 优先检查操作系统/浏览器网络层
      if (typeof navigator.onLine === "boolean" && !navigator.onLine) {
        return false;
      }

      // 2. 仅向自建无限制的 /ping 接口发送探活请求，杜绝高频请求第三方图表域名
      var target = (window.location && window.location.protocol && window.location.protocol.startsWith("http"))
        ? window.location.origin + "/ping?_=" + Date.now()
        : "https://aa.124568.xyz/ping?_=" + Date.now();

      return await probeUrl(target, 2500);
    }

    async function runNetworkCheck() {
      if (isReconnecting) return;
      var ok = await checkConnectivity();
      if (ok) {
        setNetworkState(true);
      } else {
        consecutiveFailures++;
        // 连续两次探测失败，或原生属性确认为离线时，立即标记断网
        if (consecutiveFailures >= 2 || (typeof navigator.onLine === "boolean" && !navigator.onLine)) {
          setNetworkState(false);
        }
      }
    }

    async function manualCheckNetwork() {
      var btn = document.getElementById("network-retry-btn");
      var statusEl = document.getElementById("network-alert-status");
      if (btn) btn.textContent = "检测中...";
      if (statusEl) statusEl.textContent = "正在发送心跳探测包...";
      var ok = await checkConnectivity();
      if (ok) {
        setNetworkState(true);
      } else {
        if (btn) btn.textContent = "立即检测并刷新";
        if (statusEl) statusEl.textContent = "探测失败：仍未检测到可用外网，请检查网络设置。";
      }
    }

    /**
     * 15分钟 K 线收盘倒计时逻辑 (三图共振同步)
     * 15分钟 = 900 秒，K线按整点 :00 / :15 / :30 / :45 收盘
     * 若网络断开，停止计时并保持红字警告
     */
    function updateCountdown() {
      if (!isNetworkOnline) {
        var c1 = document.getElementById("countdown-1");
        var c2 = document.getElementById("countdown-2");
        var c3 = document.getElementById("countdown-3");
        var warningText = "⚠️ 网络断开";
        if (c1) { c1.textContent = warningText; c1.classList.add("is-offline"); }
        if (c2) { c2.textContent = warningText; c2.classList.add("is-offline"); }
        if (c3) { c3.textContent = warningText; c3.classList.add("is-offline"); }
        return;
      }

      var now = new Date();
      var elapsedInCandle = (now.getUTCMinutes() * 60 + now.getUTCSeconds()) % 900;
      var remainingSeconds = 900 - elapsedInCandle;

      var mins = Math.floor(remainingSeconds / 60);
      var secs = remainingSeconds % 60;
      var formatted = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");

      var c1 = document.getElementById("countdown-1");
      var c2 = document.getElementById("countdown-2");
      var c3 = document.getElementById("countdown-3");
      if (c1) { c1.textContent = formatted; c1.classList.remove("is-offline"); }
      if (c2) { c2.textContent = formatted; c2.classList.remove("is-offline"); }
      if (c3) { c3.textContent = formatted; c3.classList.remove("is-offline"); }
    }

    // 初始化运行
    function init() {
      initCharts();
      updateCountdown();
      setInterval(updateCountdown, 1000);   // 每秒刷新倒计时

      // 毫秒级原生网络状态监听
      window.addEventListener("offline", function() {
        setNetworkState(false);
      });
      window.addEventListener("online", function() {
        runNetworkCheck();
      });

      // 定时主动心跳探测：每 5 秒检测一次，彻底杜绝静默断网且不产生频控干扰
      setInterval(runNetworkCheck, 5000);

      // 设备从休眠唤醒或标签页切换时立即校正与检测
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          updateCountdown();
          runNetworkCheck();
        }
      });

      // 页面初次加载时立即做一次网络连通性初检
      runNetworkCheck();

      // 定时监测图表 3 时段跨越 (例如 14:00 或 20:30 到达时自动无感切换)
      setInterval(function () {
        if (!manualSlot) {
          updateChart3();
        }
      }, 5000);

      // 键盘快捷键支持：1(日经)、2(德指)、3(标普)、0(恢复自动轮播)
      window.addEventListener("keydown", function (e) {
        if (e.key === "1") {
          manualSlot = SLOT_CONFIG[0];
          updateChart3();
        } else if (e.key === "2") {
          manualSlot = SLOT_CONFIG[1];
          updateChart3();
        } else if (e.key === "3") {
          manualSlot = SLOT_CONFIG[2];
          updateChart3();
        } else if (e.key === "0") {
          manualSlot = null;
          updateChart3();
        }
      });
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
