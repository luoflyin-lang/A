<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>竖屏8K线实时监控 (2×4 布局: 黄金 欧美 | 美日 日经 | 德指 标普 | 恒指 比特币)</title>
  <!-- TradingView 核心脚本：自建高可用 Worker CDN 优先加载，老旧平板与断网多重兜底 -->
  <script data-cfasync="false" type="text/javascript" src="https://aa.124568.xyz/tv.js"></script>
  <script data-cfasync="false" type="text/javascript">
    if (typeof window.TradingView === "undefined") {
      var _tvFallbacks = [
        "tv.js",
        "/tv.js",
        "https://s3.tradingview.com/tv.js"
      ];
      var _tvIdx = 0;
      function _loadTvNext() {
        if (_tvIdx >= _tvFallbacks.length || (typeof window.TradingView !== "undefined" && window.TradingView.widget)) return;
        var s = document.createElement("script");
        s.setAttribute("data-cfasync", "false");
        s.type = "text/javascript";
        s.src = _tvFallbacks[_tvIdx++];
        s.onload = function() {
          if (typeof initCharts === "function") initCharts();
        };
        s.onerror = function() {
          _loadTvNext();
        };
        setTimeout(function() {
          if (typeof window.TradingView === "undefined" || !window.TradingView.widget) {
            _loadTvNext();
          }
        }, 3500);
        document.head.appendChild(s);
      }
      _loadTvNext();
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
    }

    body {
      min-height: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
    }

    /* 全屏右上角全局统一收盘倒计时 (整屏仅保留右上角这一个) */
    #global-countdown {
      position: fixed;
      top: 6px;
      right: 12px;
      z-index: 10000;
      font-size: 15px;
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.5px;
      user-select: none;
      pointer-events: auto;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.88);
      padding: 1px 6px;
      border-radius: 4px;
      transition: background-color 0.2s, color 0.2s;
    }

    /* 倒计时剩 2 分钟时黑白反色高亮 3 秒 */
    #global-countdown.is-alerting {
      background: #000000 !important;
      color: #ffffff !important;
    }

    #global-countdown.is-offline {
      color: #ff3b30 !important;
      font-weight: 700 !important;
      background: rgba(255, 59, 48, 0.1) !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
    }

    /* 竖屏 8 分屏网格容器 (2 列 × 4 行) */
    #grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 单个图表卡片：启用严格显存隔离与硬件合成层，杜绝跨图表连锁重绘 */
    .chart-box {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-color: #ffffff;
      contain: strict;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* 竖屏网格黑线：左边一列加右边框 */
    .chart-box:nth-child(odd) {
      border-right: 1px solid #000000;
    }

    /* 竖屏网格黑线：前 3 行 (前 6 个品种) 加上下分隔底边框 */
    .chart-box:nth-child(-n+6) {
      border-bottom: 1px solid #000000;
    }

    /* 裁剪容器：向右裁剪价格轴，向下裁剪时间轴 */
    .chart-crop {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(100% + 70px);
      height: calc(100% + 36px);
      contain: strict;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    /* 左上角品种名称 */
    .symbol-overlay {
      position: absolute;
      top: 6px;
      left: 10px;
      z-index: 999;
      font-size: 14px;
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.5px;
      user-select: none;
      pointer-events: none;
    }

    /* 网络断开全屏蒙层与告警卡片 */
    #network-alert {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 100000;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .network-alert-card {
      background: #ffffff;
      border: 2px solid #ff3b30;
      border-radius: 14px;
      box-shadow: 0 16px 48px rgba(255, 59, 48, 0.22);
      padding: 32px 36px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      animation: alertPulse 2s infinite ease-in-out;
    }

    @keyframes alertPulse {
      0%, 100% { border-color: #ff3b30; box-shadow: 0 16px 48px rgba(255, 59, 48, 0.22); }
      50% { border-color: #ff7875; box-shadow: 0 16px 48px rgba(255, 59, 48, 0.38); }
    }

    .network-alert-icon {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 14px;
    }

    .network-alert-title {
      font-size: 21px;
      font-weight: 700;
      color: #ff3b30;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .network-alert-desc {
      font-size: 14px;
      color: #444444;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .network-alert-status {
      font-size: 13px;
      color: #666666;
      background: #f5f5f7;
      border: 1px solid #e5e5ea;
      padding: 8px 14px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 22px;
    }

    .network-alert-btn {
      background: #ff3b30;
      color: #ffffff;
      border: none;
      padding: 11px 26px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .network-alert-btn:hover {
      background: #d62d23;
    }

    .network-alert-btn:active {
      transform: scale(0.97);
    }

    /* 脚本加载失败时的可见错误提示 */
    #fatal-error {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 20000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      color: #000000;
      text-align: center;
      padding: 0 24px;
      font-size: 14px;
      line-height: 1.6;
    }

    #fatal-error strong {
      font-size: 17px;
    }

    #fatal-error span {
      font-size: 12px;
      color: #666666;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <!-- 网络断开高警示蒙层 -->
  <div id="network-alert">
    <div class="network-alert-card">
      <div class="network-alert-icon">⚠️</div>
      <div class="network-alert-title" id="network-alert-title">网络连接已断开！</div>
      <div class="network-alert-desc">行情数据与倒计时已立即暂停。请检查您的 Wi-Fi 或网络连接，切勿依据当前静止画面做交易决策！</div>
      <div class="network-alert-status" id="network-alert-status">正在持续监测网络，恢复后将自动刷新图表...</div>
      <div>
        <button class="network-alert-btn" id="network-retry-btn" onclick="manualCheckNetwork()">立即检测并刷新</button>
      </div>
    </div>
  </div>

  <!-- 全屏右上角全局统一收盘倒计时 (点击可测试收盘前2分钟提示音) -->
  <div id="global-countdown" onclick="testAlertSound()" title="点击测试收盘前2分钟提示音">--:--</div>

  <!-- 竖屏 8 分屏网格 (2 列 × 4 行) -->
  <div id="grid-container">
    <!-- 第 1 排: 黄金 | 欧美 -->
    <div class="chart-box">
      <div class="symbol-overlay">XAUUSD</div>
      <div id="chart-0" class="chart-crop"></div>
    </div>
    <div class="chart-box">
      <div class="symbol-overlay">EURUSD</div>
      <div id="chart-1" class="chart-crop"></div>
    </div>

    <!-- 第 2 排: 美日 | 日经 -->
    <div class="chart-box">
      <div class="symbol-overlay">USDJPY</div>
      <div id="chart-2" class="chart-crop"></div>
    </div>
    <div class="chart-box">
      <div class="symbol-overlay">JP225</div>
      <div id="chart-3" class="chart-crop"></div>
    </div>

    <!-- 第 3 排: 德指 | 标普 -->
    <div class="chart-box">
      <div class="symbol-overlay">DAX</div>
      <div id="chart-4" class="chart-crop"></div>
    </div>
    <div class="chart-box">
      <div class="symbol-overlay">SPX500</div>
      <div id="chart-5" class="chart-crop"></div>
    </div>

    <!-- 第 4 排: 恒指 | 比特币 -->
    <div class="chart-box">
      <div class="symbol-overlay">HK50</div>
      <div id="chart-6" class="chart-crop"></div>
    </div>
    <div class="chart-box">
      <div class="symbol-overlay">BTC</div>
      <div id="chart-7" class="chart-crop"></div>
    </div>
  </div>

  <!-- 脚本加载异常提示 -->
  <div id="fatal-error">
    <strong>图表核心组件连接中...</strong>
    <div>正在自动切换备用高速节点重新加载...</div>
    <span>如因本地 Wi-Fi / 网络波动未自动加载，可点击下方按钮立即重试：</span>
    <button class="network-alert-btn" style="margin-top: 12px;" onclick="window.location.reload()">立即重新加载</button>
  </div>

  <script data-cfasync="false">
    var CHARTS_CONFIG = [
      { id: "chart-0", symbol: "OANDA:XAUUSD", title: "XAUUSD" },
      { id: "chart-1", symbol: "FX:EURUSD", title: "EURUSD" },
      { id: "chart-2", symbol: "FX:USDJPY", title: "USDJPY" },
      { id: "chart-3", symbol: "OANDA:JP225USD", title: "JP225" },
      { id: "chart-4", symbol: "FOREXCOM:GER40", title: "DAX" },
      { id: "chart-5", symbol: "OANDA:SPX500USD", title: "SPX500" },
      { id: "chart-6", symbol: "FOREXCOM:HK50", title: "HK50" },
      { id: "chart-7", symbol: "BINANCE:BTCUSDT", title: "BTC" }
    ];

    var TV_MAX_RETRY = 50;
    var chartState = {};

    function showFatalError() {
      var el = document.getElementById("fatal-error");
      if (el) el.style.display = "flex";
    }

    function hideFatalError() {
      var el = document.getElementById("fatal-error");
      if (el) el.style.display = "none";
    }

    var isTvLoading = false;
    var tvLoadTimer = null;
    function loadTvScriptDynamically(callback) {
      if (typeof TradingView !== "undefined" && TradingView.widget) {
        hideFatalError();
        if (callback) callback();
        return;
      }
      if (isTvLoading) return;
      isTvLoading = true;

      var fallbackSources = [
        "https://aa.124568.xyz/tv.js",
        "tv.js",
        "/tv.js",
        "https://s3.tradingview.com/tv.js"
      ];
      var fIdx = 0;

      function tryOne() {
        if (typeof TradingView !== "undefined" && TradingView.widget) {
          isTvLoading = false;
          clearTimeout(tvLoadTimer);
          hideFatalError();
          if (callback) callback();
          return;
        }
        if (fIdx >= fallbackSources.length) {
          isTvLoading = false;
          clearTimeout(tvLoadTimer);
          return;
        }
        var nextSrc = fallbackSources[fIdx++];
        var script = document.createElement("script");
        script.setAttribute("data-cfasync", "false");
        script.type = "text/javascript";
        script.src = nextSrc;
        script.onload = function() {
          isTvLoading = false;
          clearTimeout(tvLoadTimer);
          hideFatalError();
          if (callback) callback();
        };
        script.onerror = function() {
          clearTimeout(tvLoadTimer);
          tryOne();
        };
        clearTimeout(tvLoadTimer);
        tvLoadTimer = setTimeout(function() {
          if (typeof TradingView === "undefined" || !TradingView.widget) {
            tryOne();
          }
        }, 3500);
        document.head.appendChild(script);
      }

      tryOne();
    }

    function createTradingViewWidget(containerId, symbol) {
      var container = document.getElementById(containerId);
      if (!container) return;

      var state = chartState[containerId];
      if (!state) {
        state = chartState[containerId] = { retry: 0 };
      }

      if (typeof TradingView === "undefined" || !TradingView.widget) {
        state.retry++;
        if (state.retry > TV_MAX_RETRY) {
          showFatalError();
          return;
        }
        loadTvScriptDynamically(function() {
          createTradingViewWidget(containerId, symbol);
        });
        setTimeout(function () {
          createTradingViewWidget(containerId, symbol);
        }, 600);
        return;
      }

      hideFatalError();
      container.innerHTML = "";

      new TradingView.widget({
        autosize: true,
        symbol: symbol,
        interval: "15",
        timezone: "Asia/Shanghai",
        theme: "light",
        style: "1",
        locale: "zh_CN",
        useWidgetHost: true,
        backgroundColor: "#ffffff",
        gridColor: "rgba(255, 255, 255, 0)",
        toolbar_bg: "#ffffff",
        enable_publishing: false,
        allow_symbol_change: false,
        hide_top_toolbar: true,
        hide_legend: true,
        hide_side_toolbar: true,
        save_image: false,
        hide_volume: true,
        loading_screen: {
          backgroundColor: "#ffffff",
          foregroundColor: "#ffffff"
        },
        doNotStoreSettings: true,
        showFloatingTooltip: false,
        disabled_features: [
          "volume_force_overlay",
          "create_volume_indicator_by_default",
          "header_widget",
          "timeframes_toolbar",
          "left_toolbar",
          "control_bar",
          "legend_widget",
          "show_legend_values_in_compact_mode",
          "show_study_arguments",
          "show_study_titles",
          "study_templates",
          "study_overlay",
          "study_symbol_ticker_description",
          "scales_context_menu",
          "use_localstorage_for_settings",
          "save_chart_properties_to_local_storage",
          "display_market_status",
          "pane_context_menu",
          "context_menus",
          "chart_zoom",
          "chart_scroll",
          "popup_hints",
          "adaptive_logo",
          "show_chart_property_page",
          "edit_buttons_in_legend",
          "property_pages",
          "countdown",
          "chart_crosshair_menu",
          "cl_feed_return"
        ],
        container_id: containerId,
        studies: [
          {
            id: "MAExp@tv-basicstudies",
            inputs: {
              length: 20
            }
          }
        ],
        studies_overrides: {
          "moving average exponential.plot.color": "#000000",
          "moving average exponential.plot.linewidth": 1.5,
          "moving average exponential.showLabelsOnPriceScale": false,
          "moving average exponential.plots.0.showLabelsOnPriceScale": false,
          "volume.volume.color.0": "rgba(255, 255, 255, 0)",
          "volume.volume.color.1": "rgba(255, 255, 255, 0)",
          "volume.volume.transparency": 100,
          "volume.show ma": false
        },
        overrides: {
          // 纯白背景
          "paneProperties.background": "#ffffff",
          "paneProperties.backgroundType": "solid",
          "paneProperties.crossHairProperties.color": "rgba(255, 255, 255, 0)",
          "paneProperties.crossHairProperties.width": 0,
          "paneProperties.vertGridProperties.color": "rgba(255, 255, 255, 0)",
          "paneProperties.horzGridProperties.color": "rgba(255, 255, 255, 0)",
          "paneProperties.separatorColor": "rgba(255, 255, 255, 0)",
          "symbolWatermarkProperties.color": "rgba(255, 255, 255, 0)",
          "symbolWatermarkProperties.transparency": 100,

          // 彻底关闭均线与图例指标标签
          "paneProperties.legendProperties.showStudyArguments": false,
          "paneProperties.legendProperties.showStudyTitles": false,
          "paneProperties.legendProperties.showStudyValues": false,
          "paneProperties.legendProperties.showSeriesTitle": false,
          "paneProperties.legendProperties.showSeriesOHLC": false,
          "paneProperties.legendProperties.showLegend": false,

          "mainSeriesProperties.showPriceLine": false,
          "mainSeriesProperties.priceLineColor": "rgba(255, 255, 255, 0)",
          "mainSeriesProperties.priceLineWidth": 0,
          "mainSeriesProperties.baseLineColor": "rgba(255, 255, 255, 0)",
          "mainSeriesProperties.bidAsk.visible": false,
          "mainSeriesProperties.bidAsk.bidLineColor": "rgba(255, 255, 255, 0)",
          "mainSeriesProperties.bidAsk.askLineColor": "rgba(255, 255, 255, 0)",
          "mainSeriesProperties.showPrevClosePriceLine": false,
          "mainSeriesProperties.prevClosePriceLineColor": "rgba(255, 255, 255, 0)",
          "mainSeriesProperties.showCountdown": false,
          "mainSeriesProperties.highLowAvgPrice.highLowPriceLinesVisible": false,
          "mainSeriesProperties.highLowAvgPrice.highLowPriceLabelsVisible": false,
          "mainSeriesProperties.highLowAvgPrice.averageClosePriceLineVisible": false,

          "mainSeriesProperties.candleStyle.upColor": "#ffffff",
          "mainSeriesProperties.candleStyle.downColor": "#000000",
          "mainSeriesProperties.candleStyle.drawWick": true,
          "mainSeriesProperties.candleStyle.drawBorder": true,
          "mainSeriesProperties.candleStyle.borderColor": "#000000",
          "mainSeriesProperties.candleStyle.borderUpColor": "#000000",
          "mainSeriesProperties.candleStyle.borderDownColor": "#000000",
          "mainSeriesProperties.candleStyle.wickUpColor": "#000000",
          "mainSeriesProperties.candleStyle.wickDownColor": "#000000",

          // 坐标轴文字与刻度隐藏（透明），并关闭指标/均线在轴上的数字标签
          "scalesProperties.textColor": "rgba(255, 255, 255, 0)",
          "scalesProperties.lineColor": "rgba(255, 255, 255, 0)",
          "scalesProperties.showBidAskPrice": false,
          "scalesProperties.showSymbolLabels": false,
          "scalesProperties.showSeriesLastValue": false,
          "scalesProperties.showStudyLastValue": false,
          "scalesProperties.showStudyPlotLabels": false
        }
      });
    }

    /**
     * 错峰平滑加载：每个图表间隔 400ms 初始化，避免瞬时并发冲垮显存与长连接
     */
    function initCharts() {
      for (var i = 0; i < CHARTS_CONFIG.length; i++) {
        (function(idx) {
          setTimeout(function() {
            createTradingViewWidget(CHARTS_CONFIG[idx].id, CHARTS_CONFIG[idx].symbol);
          }, idx * 400);
        })(i);
      }
    }

    var isNetworkOnline = true;
    var consecutiveFailures = 0;
    var isReconnecting = false;

    function setNetworkState(online) {
      var countdownEl = document.getElementById("global-countdown");
      if (online) {
        consecutiveFailures = 0;
        if (!isNetworkOnline) {
          isNetworkOnline = true;
          isReconnecting = false;
          var alertEl = document.getElementById("network-alert");
          if (alertEl) alertEl.style.display = "none";
          if (countdownEl) {
            countdownEl.classList.remove("is-offline");
          }
        }
      } else {
        if (!isNetworkOnline) return;
        isNetworkOnline = false;

        var alertEl = document.getElementById("network-alert");
        if (alertEl) alertEl.style.display = "flex";

        var titleEl = document.getElementById("network-alert-title");
        var statusEl = document.getElementById("network-alert-status");
        if (titleEl) {
          titleEl.textContent = "⚠️ 网络连接已断开！";
          titleEl.style.color = "#ff3b30";
        }
        if (statusEl) {
          statusEl.textContent = "正在持续监测网络，恢复后将自动恢复...";
          statusEl.style.color = "#666666";
        }

        if (countdownEl) {
          countdownEl.textContent = "⚠️ 网络断开";
          countdownEl.classList.add("is-offline");
        }
      }
    }

    function probeUrl(url, timeoutMs) {
      return new Promise(function(resolve) {
        if (typeof navigator.onLine === "boolean" && !navigator.onLine) {
          resolve(false);
          return;
        }
        var controller = new AbortController();
        var timer = setTimeout(function() {
          try { controller.abort(); } catch(e) {}
          resolve(false);
        }, timeoutMs || 2200);

        fetch(url, {
          mode: "no-cors",
          cache: "no-store",
          signal: controller.signal
        }).then(function() {
          clearTimeout(timer);
          resolve(true);
        }).catch(function() {
          clearTimeout(timer);
          resolve(false);
        });
      });
    }

    async function checkConnectivity() {
      if (typeof navigator.onLine === "boolean" && !navigator.onLine) {
        return false;
      }
      var target = (window.location && window.location.protocol && window.location.protocol.startsWith("http"))
        ? window.location.origin + "/ping?_=" + Date.now()
        : "https://aa.124568.xyz/ping?_=" + Date.now();

      return await probeUrl(target, 2500);
    }

    async function runNetworkCheck() {
      if (isReconnecting) return;
      var ok = await checkConnectivity();
      if (ok) {
        setNetworkState(true);
      } else {
        consecutiveFailures++;
        if (consecutiveFailures >= 2 || (typeof navigator.onLine === "boolean" && !navigator.onLine)) {
          setNetworkState(false);
        }
      }
    }

    async function manualCheckNetwork() {
      var btn = document.getElementById("network-retry-btn");
      var statusEl = document.getElementById("network-alert-status");
      if (btn) btn.textContent = "检测中...";
      if (statusEl) statusEl.textContent = "正在发送心跳探测包...";
      var ok = await checkConnectivity();
      if (ok) {
        setNetworkState(true);
      } else {
        if (btn) btn.textContent = "立即检测并刷新";
        if (statusEl) statusEl.textContent = "探测失败：仍未检测到可用外网，请检查网络设置。";
      }
    }

    // ========================================================
    // 收盘前 2 分钟提示音引擎 (Web Audio API)
    // 零外部资源依赖，离线可用，毫秒级响应，响铃 3 秒 (3 声空灵风铃音)
    // ========================================================
    var audioCtx = null;
    var lastAlertCandleKey = -1;

    function getAudioContext() {
      if (!audioCtx) {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      return audioCtx;
    }

    // 只要用户在屏幕上有任何点击或轻触，立即激活浏览器音频上下文权限
    function unlockAudio() {
      var ctx = getAudioContext();
      if (ctx && ctx.state === "suspended") {
        ctx.resume();
      }
    }

    // 播放约 3 秒清晰悠扬提示音 (0s, 1s, 2s 各一声纯净正弦波风铃音)
    function playCloseAlertSound() {
      var ctx = getAudioContext();
      if (!ctx) return;
      if (ctx.state === "suspended") {
        ctx.resume();
      }

      var now = ctx.currentTime;
      var chimes = [
        { offset: 0.0, freq: 880.00, dur: 0.65 }, // A5
        { offset: 1.0, freq: 880.00, dur: 0.65 }, // A5
        { offset: 2.0, freq: 1174.66, dur: 0.85 } // D6 (更高明亮音，收尾确认)
      ];

      chimes.forEach(function(c) {
        try {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(c.freq, now + c.offset);

          // 渐入渐出平滑包络：杜绝破音，声音温润清晰
          gain.gain.setValueAtTime(0.0001, now + c.offset);
          gain.gain.exponentialRampToValueAtTime(0.38, now + c.offset + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + c.offset + c.dur);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + c.offset);
          osc.stop(now + c.offset + c.dur);
        } catch(e) {}
      });
    }

    // 触发 2 分钟收盘提醒：声音 + 倒计时黑白反色高亮 3 秒
    function triggerTwoMinuteAlert() {
      playCloseAlertSound();

      var countdownEl = document.getElementById("global-countdown");
      if (countdownEl) {
        countdownEl.classList.add("is-alerting");
        setTimeout(function() {
          countdownEl.classList.remove("is-alerting");
        }, 3000);
      }
    }

    // 点击右上角倒计时手动试听测试
    function testAlertSound() {
      unlockAudio();
      triggerTwoMinuteAlert();
    }

    function updateCountdown() {
      var countdownEl = document.getElementById("global-countdown");
      if (!countdownEl) return;
      if (!isNetworkOnline) {
        countdownEl.textContent = "⚠️ 网络断开";
        countdownEl.classList.add("is-offline");
        return;
      }

      var now = new Date();
      var totalSec = Math.floor(now.getTime() / 1000);
      var currentCandleKey = Math.floor(totalSec / 900); // 15分钟 K线唯一批次ID
      var elapsedInCandle = (now.getUTCMinutes() * 60 + now.getUTCSeconds()) % 900;
      var remainingSeconds = 900 - elapsedInCandle;

      // 还剩 2 分钟 (120 秒) 时准时响铃 3 秒
      // 容差区间 [118, 120]，防止某秒定时器极微小漂移
      if (remainingSeconds <= 120 && remainingSeconds >= 118) {
        if (lastAlertCandleKey !== currentCandleKey) {
          lastAlertCandleKey = currentCandleKey;
          triggerTwoMinuteAlert();
        }
      }

      var mins = Math.floor(remainingSeconds / 60);
      var secs = remainingSeconds % 60;
      var formatted = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");

      countdownEl.textContent = formatted;
      countdownEl.classList.remove("is-offline");
    }

    function init() {
      initCharts();
      updateCountdown();
      setInterval(updateCountdown, 1000);

      // 监听屏幕任意点击/轻触，自动激活浏览器音频播放权限
      window.addEventListener("click", unlockAudio, { passive: true });
      window.addEventListener("touchstart", unlockAudio, { passive: true });
      window.addEventListener("pointerdown", unlockAudio, { passive: true });

      window.addEventListener("offline", function() {
        setNetworkState(false);
      });
      window.addEventListener("online", function() {
        runNetworkCheck();
      });

      setInterval(runNetworkCheck, 30000);

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          updateCountdown();
          runNetworkCheck();
        }
      });

      runNetworkCheck();
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
